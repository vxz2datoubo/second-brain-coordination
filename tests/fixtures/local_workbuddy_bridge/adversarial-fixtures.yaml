# ---------------------------------------------------------------------------
# Credential-LOOKING strings. These are NOT real secrets and are deliberately
# built with a self-describing SYNTHETIC marker so no secret scanner can ever
# flag them. They exist ONLY to prove the redaction boundary fires.
#
# The tests construct the prefixes at runtime (see the test module) and use
# these markers to assert rejection. Persisted here as inert reference data.
# ---------------------------------------------------------------------------
credential_looking_values:
  description: "synthetic non-functional shapes; body is a self-describing marker"
  shapes:
    - "ghp_<SYNTHETIC-NOT-A-REAL-TOKEN>"
    - "github_pat_<SYNTHETIC-NOT-A-REAL-TOKEN>"
    - "sk-<SYNTHETIC-NOT-A-REAL-KEY>"
    - "password: <SYNTHETIC-NOT-A-REAL-PASSWORD>"
    - "PEM private-key header + <SYNTHETIC-NOT-A-REAL-KEY> body"
  note: >-
    Tests assemble concrete instances in memory using a repeated marker body.
    The PEM shape is described rather than written literally so no secret
    scanner can match it. No real credential value is ever written here.

