name: Program Control Tower R153 Signal Opportunity Materializer

on:
  pull_request:
    paths:
      - ".github/workflows/program-control-tower-r153-signal-opportunity-materializer.yml"
      - "coordination/CONTROL-TOWER/signal_opportunity_materializer.py"
      - "coordination/CONTROL-TOWER/tests/test_signal_opportunity_materializer.py"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R153/**"

permissions:
  contents: read

jobs:
  r153:
    name: R153 materializer (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact-head provenance and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Compile R153 module
        working-directory: coordination/CONTROL-TOWER
        run: python -m py_compile signal_opportunity_materializer.py tests/test_signal_opportunity_materializer.py

      - name: Run R153 adversarial tests
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_opportunity_materializer -v

      - name: Retain R152 apply regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_idle_signal_apply -v

      - name: Retain R151 scheduler regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_idle_signal_scheduler -v

      - name: Retain R150 trusted release regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_trusted_task_release -v

      - name: Retain R149 impact regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_task_release_impact -v

      - name: Run full Control Tower suite
        working-directory: coordination/CONTROL-TOWER
        run: python run_all_tests.py

      - name: Verify exact five-file scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          allowed() {
            case "$1" in
              .github/workflows/program-control-tower-r153-signal-opportunity-materializer.yml) return 0 ;;
              coordination/CONTROL-TOWER/signal_opportunity_materializer.py) return 0 ;;
              coordination/CONTROL-TOWER/tests/test_signal_opportunity_materializer.py) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R153/PROJECT-PLAN.md) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R153/SIGNAL-OPPORTUNITY-MATERIALIZATION.schema.json) return 0 ;;
              *) return 1 ;;
            esac
          }
          for path in "${changed[@]}"; do
            if ! allowed "$path"; then
              echo "R153 out-of-scope path: $path" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 5
          echo R153_SCOPE_PASS

      - name: Verify no live authority mutation in implementation PR
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE" HEAD | grep -E '^(coordination/ACTIVE-|coordination/ROUTES/|coordination/CONTROL-TOWER/LANE-WORK-CLAIMS\.yaml$|coordination/PROGRAMS/.*/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/)'; then
            echo "R153 implementation may not mutate live authority or S0C" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text = Path('coordination/CONTROL-TOWER/signal_opportunity_materializer.py').read_text(encoding='utf-8')
          needles = [
              'CANONICAL_S0C_LEDGER_INSTANCE_REQUIRED',
              'OWNER_EXACT_SIGNAL_RECONCILIATION_RECORD_REQUIRED',
              'CROSS_DOMAIN_AUTO_MATERIALIZATION_FORBIDDEN',
              'creates_signal_truth": False',
              'creates_task": False',
              'creates_issue": False',
              'creates_route": False',
              'creates_work_claim": False',
              'creates_worker_slot": False',
              'grants_execution_authority": False',
              'grants_domain_write": False',
              'grants_w3_write": False',
              'grants_merge_authority": False',
          ]
          for needle in needles:
              if needle not in text:
                  raise SystemExit(f'missing R153 boundary: {needle}')
          if 'jaccard' in text.casefold() or 'embedding' in text.casefold():
              raise SystemExit('R153 fuzzy owner-work authority forbidden')
          print('R153_AUTHORITY_BOUNDARY_PASS')
          PY

      - name: Verify whitespace and unfinished markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          if grep -R -n -E 'TODO|FIXME|NotImplementedError' \
            coordination/CONTROL-TOWER/signal_opportunity_materializer.py \
            coordination/CONTROL-TOWER/tests/test_signal_opportunity_materializer.py; then
            exit 1
          fi
