name: E23-Phase3-D2-Adapter
on:
  push:
    branches: [qclaw/q0-d2-candidate-adapter-0011-e8]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py: ['3.11', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.py }}
    - run: pip install pyyaml
    - working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
      run: |
        python generate_adapters.py
        python validate_adapters.py
      env:
        Q0_SRC_DIR: q0_sources
        OUTPUT_DIR: .
        POLICY_DIR: .
        PYTHONHASHSEED: '0'
