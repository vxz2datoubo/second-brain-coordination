name: Global Signal Plane R142 Retrospective Intake

on:
  pull_request:
    paths:
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src/global_signal_gateway/**'
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/tests/**'
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/R142/**'
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/src/global_signal_plane/ledger.py'
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/tests/test_signal_plane.py'
      - '.github/workflows/global-signal-plane-r142-retrospective-intake.yml'

permissions:
  contents: read

jobs:
  retrospective-intake:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Bind exact PR head base and merge ref
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          test "$HEAD_SHA" = "$PR_HEAD"
          git fetch --no-tags origin "+refs/pull/${{ github.event.pull_request.number }}/merge:refs/remotes/origin/r142-merge"
          MERGE_SHA="$(git rev-parse refs/remotes/origin/r142-merge)"
          test "$(git rev-parse "${MERGE_SHA}^1")" = "$BASE_SHA"
          test "$(git rev-parse "${MERGE_SHA}^2")" = "$PR_HEAD"
          echo "R142_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "R142_PR_HEAD_SHA=$PR_HEAD" >> "$GITHUB_ENV"
          echo "R142_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "R142_MERGE_SHA=$MERGE_SHA" >> "$GITHUB_ENV"
          printf 'HEAD=%s\nPR_HEAD=%s\nBASE=%s\nMERGE=%s\n' "$HEAD_SHA" "$PR_HEAD" "$BASE_SHA" "$MERGE_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'

      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: R142 adversarial tests
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY
        env:
          PYTHONPATH: 'src:../S0-SYNTHETIC/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_r142*.py' -v

      - name: Bounded R136 regression
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY
        env:
          PYTHONPATH: 'src:../S0-SYNTHETIC/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_r136_matrix.py' -v

      - name: Full S0C regression
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE
        env:
          PYTHONPATH: 'S0-SYNTHETIC/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s S0-SYNTHETIC/tests -p 'test_signal_plane.py' -v

      - name: Execute governed real M4 reconstruction and reconcile
        shell: bash
        env:
          R142_PR_NUMBER: '${{ github.event.pull_request.number }}'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          CANONICAL_WORKTREE="$RUNNER_TEMP/r142-canonical-main-${{ matrix.python-version }}"
          M4_OUTPUT="$RUNNER_TEMP/r142-real-m4-py${{ matrix.python-version }}.json"
          M4_LOG="$RUNNER_TEMP/r142-real-m4-py${{ matrix.python-version }}.log"
          echo "R142_M4_OUTPUT=$M4_OUTPUT" >> "$GITHUB_ENV"
          echo "R142_M4_LOG=$M4_LOG" >> "$GITHUB_ENV"
          trap 'git worktree remove --force "$CANONICAL_WORKTREE" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$CANONICAL_WORKTREE" "$R142_BASE_SHA"
          export R142_CANONICAL_WORKTREE="$CANONICAL_WORKTREE"
          export R142_M4_OUTPUT="$M4_OUTPUT"
          set +e
          python coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/R142/run_real_m4.py >"$M4_LOG" 2>&1
          RC=$?
          set -e
          cat "$M4_LOG"
          test "$RC" -eq 0
          test -s "$M4_OUTPUT"

      - name: Upload M4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r142-m4-diagnostics-py${{ matrix.python-version }}
          path: |
            ${{ env.R142_M4_LOG }}
            ${{ env.R142_M4_OUTPUT }}
          if-no-files-found: warn

      - name: Scope allowlist public safety and diff proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          base = os.environ['R142_BASE_SHA']
          changed = subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'], text=True).splitlines()
          prefixes = (
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src/global_signal_gateway/',
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/tests/',
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/R142/',
          )
          exact_s0c = {
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/src/global_signal_plane/ledger.py',
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/tests/test_signal_plane.py',
          }
          workflow = '.github/workflows/global-signal-plane-r142-retrospective-intake.yml'
          outside = [p for p in changed if p != workflow and p not in exact_s0c and not any(p.startswith(prefix) for prefix in prefixes)]
          if outside:
              raise SystemExit(f'R142_ALLOWLIST_FAIL:{outside}')
          patterns = (
              re.compile(r'ghp_[A-Za-z0-9]{20,}'), re.compile(r'sk-[A-Za-z0-9]{20,}'),
              re.compile(r'-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'),
          )
          for name in changed:
              path = Path(name)
              if path.is_file():
                  text = path.read_text(encoding='utf-8')
                  if any(pattern.search(text) for pattern in patterns):
                      raise SystemExit(f'R142_PUBLIC_SAFETY_FAIL:{name}')
          print('R142_ALLOWLIST_PASS')
          print('R142_PUBLIC_SAFETY_PASS')
          print('S0C_SOURCE_MUTATION=BOUNDED_AUTHORIZED_R142_F01')
          PY
          git diff --check "$R142_BASE_SHA...HEAD"
          if grep -InE '\b(TODO|FIXME)\b|NotImplementedError' \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src/global_signal_gateway/retrospective_*.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/tests/test_r142*.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/R142/run_real_m4.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/src/global_signal_plane/ledger.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/tests/test_signal_plane.py; then
            exit 1
          fi
          echo R142_PLACEHOLDER_PASS

      - name: Resource cleanup proof
        run: |
          python - <<'PY'
          import multiprocessing
          assert not multiprocessing.active_children()
          print('R142_RESOURCE_CLEANUP_PASS')
          print('task_owned_background_processes=NONE')
          print('nested_parallelism=FORBIDDEN')
          PY

      - name: Materialize exact-head CI evidence
        env:
          R142_PYTHON_VERSION: '${{ matrix.python-version }}'
          R142_RUN_ID: '${{ github.run_id }}'
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          m4_path = Path(os.environ['R142_M4_OUTPUT'])
          m4 = json.loads(m4_path.read_text(encoding='utf-8'))
          record = {
            'schema_version': 'R142ExactHeadCIEvidence/v2',
            'git_rev_parse_head': os.environ['R142_HEAD_SHA'],
            'pr_head_sha': os.environ['R142_PR_HEAD_SHA'],
            'base_sha': os.environ['R142_BASE_SHA'],
            'merge_ref_sha': os.environ['R142_MERGE_SHA'],
            'python_version': os.environ['R142_PYTHON_VERSION'],
            'github_run_id': os.environ['R142_RUN_ID'],
            'tests': ['R142 adversarial F01-F04', 'R136 bounded regression', 'full S0C regression', 'real M4 evidence-first reconcile'],
            'real_m4_candidate_count': m4['reconstructed_candidate_count'],
            'real_m4_disposition_counts': m4['current_disposition_counts'],
            'real_m4_current_new_ids': m4['current_new_durable_signal_ids'],
            'real_m4_needs_revalidation_ids': m4['needs_revalidation_ids'],
            'real_m4_provider_ref': m4['live_observation']['provider_attribution_ref'],
            'real_m4_s0c_projection_checksum': m4['s0c_projection']['checksum'],
            'real_m4_artifact_sha256': hashlib.sha256(m4_path.read_bytes()).hexdigest(),
            'post_hoc_oracle_comparison': m4['post_hoc_oracle_comparison'],
            'f03_closed_candidate': m4['f03_self_fulfilling_evidence_removed'],
            'f04_closed_candidate': m4['f04_source_fragment_provenance_corrected'],
            'public_safety': 'PASS', 'changed_path_allowlist': 'PASS', 'resource_cleanup': 'PASS',
            's0c_scope': 'BOUNDED_AUTHORIZED_R142_F01',
            'executor_role': 'GPT_ENGINEERING_WORKER', 'model_id': 'GPT-5.6 Sol',
          }
          target = Path(os.environ['RUNNER_TEMP']) / 'r142-exact-head-ci.json'
          target.write_text(json.dumps(record, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r142-exact-head-ci-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/r142-exact-head-ci.json
            ${{ env.R142_M4_OUTPUT }}
          if-no-files-found: error
