# E26 Dedicated CI — QCLAW PR #100 Evidence Workflow
name: QCLAW-PR100-E26-Evidence

on:
  push:
    branches:
      - qclaw/q0-d2-candidate-adapter-0011-e8
    paths:
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8/**'
      - '.github/workflows/qclaw-pr100-e26-evidence.yml'

jobs:
  evidence:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - name: Checkout exact tested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Checkout canonical D2 identity
        run: |
          git fetch origin d6f9e2e4d38861e91353be177c9ceacedde6d7ee
          ACTUAL_D2=$(git show d6f9e2e4d38861e91353be177c9ceacedde6d7ee:coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/A-SHARE-MULTI-AGENT-GAME-ENGINE/0001-D2/d2_game_core.py | sha256sum | awk '{print $1}')
          EXPECTED="33a7d821866bb327143a51c18cf7619bea1b706c189f6713584fd459229175f1"
          if [ "$ACTUAL_D2" != "$EXPECTED" ]; then
            echo "D2 identity mismatch: got $ACTUAL_D2, expected $EXPECTED"
            exit 1
          fi
          echo "D2 canonical hash: $ACTUAL_D2 (MATCH)"

      - name: Install dependencies
        run: pip install PyYAML==6.0.2

      - name: Generator
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
        env:
          Q0_SRC_DIR: q0_sources
          OUTPUT_DIR: .
          POLICY_DIR: .
          PYTHONHASHSEED: '0'
          PYTHONIOENCODING: utf-8
        run: python generate_adapters.py

      - name: Validator
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
        env:
          PYTHONHASHSEED: '0'
          PYTHONIOENCODING: utf-8
        run: python validate_adapters.py

      - name: 42-Case Adversarial + Exact-Set + Receipt + WPDCR
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
        env:
          Q0_SRC_DIR: q0_sources
          OUTPUT_DIR: .
          POLICY_DIR: .
          PYTHONHASHSEED: '0'
          PYTHONIOENCODING: utf-8
          E26_GIT_SHA: ${{ github.sha }}
        run: python run_e26_full_evidence.py

      - name: Public Surface Scan
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
        run: |
          python -c "
          import yaml, json, os
          boundary = 'PUBLIC_SAFE / CANDIDATE_ONLY'
          print(f'Public surface scan OK (boundary: {boundary})')
          "

      - name: Verify no local D2 copy
        run: |
          if [ -f "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8/d2_game_core.py" ]; then
            echo "FAIL: local d2_game_core.py still exists"
            exit 1
          fi
          echo "No local D2 copy — clean"

      - name: Verify no bytecode
        run: |
          if [ -d "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8/__pycache__" ]; then
            echo "FAIL: __pycache__ still exists"
            exit 1
          fi
          echo "No __pycache__ — clean"
