name: codex-e56-canonical-authority-closure

on:
  pull_request:
    paths:
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CODEX-E56/**"
      - ".github/workflows/codex-e56-canonical-authority-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority:
    name: authority / py${{ matrix.python }} / seed=${{ matrix.seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        seed: ["0", "1", "777"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact event head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Execute product tests, fixtures and genuine mutations
        env:
          PYTHONHASHSEED: ${{ matrix.seed }}
        run: >-
          python coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CODEX-E56/tools/provider_runner.py
          --output provider-evidence
          --branch '${{ github.head_ref || github.ref_name }}'
          --workflow '.github/workflows/codex-e56-canonical-authority-closure.yml'
          --seed '${{ matrix.seed }}'
          --job-name 'authority / py${{ matrix.python }} / seed=${{ matrix.seed }}'
          --run-id '${{ github.run_id }}'
          --run-attempt '${{ github.run_attempt }}'
          --expected-head '${{ github.event.pull_request.head.sha || github.sha }}'
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-py${{ matrix.python }}-seed${{ matrix.seed }}
          path: provider-evidence/canonical.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: environment-py${{ matrix.python }}-seed${{ matrix.seed }}
          path: |
            provider-evidence/environment.json
            provider-evidence/mutation-results.json
            provider-evidence/job-evidence.json
          if-no-files-found: error
  compare:
    name: provider-compare
    needs: authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact event head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/download-artifact@v4
        with:
          path: provider-artifacts
      - name: Require canonical byte equality and bind environment mutations
        run: >-
          python coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CODEX-E56/tools/compare_provider_artifacts.py
          --root provider-artifacts
          --output provider-compare.json
      - uses: actions/upload-artifact@v4
        with:
          name: provider-compare
          path: provider-compare.json
          if-no-files-found: error
