name: R159 Reversible Change Bootstrap

on:
  push:
    branches:
      - gpt/r159-reversible-change-foundation
    paths:
      - '.github/workflows/program-control-tower-r159-reversible-change.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install retained dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Reconstruct exact R159 candidate from content-addressed transport
        env:
          GH_TOKEN: ${{ github.token }}
          CHUNK_0: 0d33fe57c00ac397c62db6dbedae38c2183f2f64
          CHUNK_1: 13864b458e7242e3a3205217e5f032638821557c
          CHUNK_2: 0759f1ebdb00ddae109479dd6e95d1a32f1a1c1f
          CHUNK_3: c0a7f5480b63a740324cddb6b77c8586a0aa236e
          EXPECTED_TAR_SHA256: ce5e6c6e2bf0b2d1f9fe438d5cd50e4748078b7514adbc82541aaf1e731e3ccc
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, tarfile
          from pathlib import Path, PurePosixPath
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          chunks = []
          for name in ('CHUNK_0', 'CHUNK_1', 'CHUNK_2', 'CHUNK_3'):
              sha = os.environ[name]
              req = Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urlopen(req) as response:
                  payload = json.load(response)
              if payload.get('sha') != sha or payload.get('encoding') != 'base64':
                  raise SystemExit(f'R159 transport blob identity mismatch: {name}')
              chunks.append(base64.b64decode(payload['content']).decode('utf-8'))

          archive = base64.b64decode(''.join(chunks), validate=True)
          digest = hashlib.sha256(archive).hexdigest()
          if digest != os.environ['EXPECTED_TAR_SHA256']:
              raise SystemExit(f'R159 archive digest mismatch: {digest}')

          allowed = {
              'coordination/CONTROL-TOWER/reversible_change.py',
              'coordination/CONTROL-TOWER/tests/test_reversible_change.py',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/CHANGE-REVERSIBILITY-ASSESSMENT.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/KNOWN-GOOD-CHECKPOINT.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/GOVERNED-REVERT-PLAN.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/PROJECT-PLAN.md',
              '.github/workflows/program-control-tower-r159-reversible-change.yml',
          }
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:gz') as tf:
              members = tf.getmembers()
              names = [m.name for m in members if m.isfile()]
              if set(names) != allowed or len(names) != len(allowed):
                  raise SystemExit(f'R159 archive scope mismatch: {names}')
              for member in members:
                  p = PurePosixPath(member.name)
                  if member.name.startswith('/') or '..' in p.parts or not member.isfile():
                      raise SystemExit(f'R159 unsafe archive member: {member.name}')
                  target = Path(member.name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = tf.extractfile(member)
                  if source is None:
                      raise SystemExit(f'R159 archive member unreadable: {member.name}')
                  target.write_bytes(source.read())
          print('R159_TRANSPORT_RECONSTRUCTION_PASS')
          PY

      - name: Validate syntax schemas and workflow
        run: |
          python -m py_compile coordination/CONTROL-TOWER/reversible_change.py coordination/CONTROL-TOWER/tests/test_reversible_change.py
          python -m json.tool coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/CHANGE-REVERSIBILITY-ASSESSMENT.schema.json >/dev/null
          python -m json.tool coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/KNOWN-GOOD-CHECKPOINT.schema.json >/dev/null
          python -m json.tool coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/GOVERNED-REVERT-PLAN.schema.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('.github/workflows/program-control-tower-r159-reversible-change.yml')
          value = yaml.safe_load(p.read_text(encoding='utf-8'))
          if not isinstance(value, dict):
              raise SystemExit('R159 final workflow YAML invalid')
          print('R159_FINAL_WORKFLOW_YAML_PASS')
          PY

      - name: Create clean local-only preflight commit
        run: |
          set -euo pipefail
          git config user.name 'r159-preflight'
          git config user.email 'r159-preflight@invalid.local'
          git add .github/workflows/program-control-tower-r159-reversible-change.yml \
            coordination/CONTROL-TOWER/reversible_change.py \
            coordination/CONTROL-TOWER/tests/test_reversible_change.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 7
          git commit -m 'R159 local-only verification candidate'
          test -z "$(git status --porcelain)"
          echo R159_LOCAL_CLEAN_COMMIT_PASS

      - name: Run R159 adversarial regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_reversible_change -v

      - name: Run full retained Control Tower suite
        working-directory: coordination/CONTROL-TOWER
        run: python run_all_tests.py

      - name: Verify exact additive seven-file preflight scope
        run: |
          set -euo pipefail
          BASE='a65488b9be4d60ac5198201fdd7872df1e2f4957'
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          expected=(
            '.github/workflows/program-control-tower-r159-reversible-change.yml'
            'coordination/CONTROL-TOWER/reversible_change.py'
            'coordination/CONTROL-TOWER/tests/test_reversible_change.py'
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/CHANGE-REVERSIBILITY-ASSESSMENT.schema.json'
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/GOVERNED-REVERT-PLAN.schema.json'
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/KNOWN-GOOD-CHECKPOINT.schema.json'
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/PROJECT-PLAN.md'
          )
          test "${#changed[@]}" -eq 7
          for path in "${changed[@]}"; do
            printf '%s\n' "${expected[@]}" | grep -Fxq "$path" || { echo "R159 out-of-scope: $path" >&2; exit 1; }
          done
          for path in "${expected[@]}"; do
            git cat-file -e "${BASE}:${path}" 2>/dev/null && { echo "R159 expected additive path already existed: $path" >&2; exit 1; } || true
          done
          git diff --check "$BASE" HEAD
          echo R159_EXACT_SEVEN_FILE_ADDITIVE_SCOPE_PASS

      - name: Publish exact tested file blobs without moving branch ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          paths = [
              '.github/workflows/program-control-tower-r159-reversible-change.yml',
              'coordination/CONTROL-TOWER/reversible_change.py',
              'coordination/CONTROL-TOWER/tests/test_reversible_change.py',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/CHANGE-REVERSIBILITY-ASSESSMENT.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/GOVERNED-REVERT-PLAN.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/KNOWN-GOOD-CHECKPOINT.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R159/PROJECT-PLAN.md',
          ]
          for path in paths:
              raw = Path(path).read_bytes()
              body = json.dumps({'content': base64.b64encode(raw).decode('ascii'), 'encoding': 'base64'}).encode()
              req = Request(
                  f'https://api.github.com/repos/{repo}/git/blobs',
                  data=body,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urlopen(req) as response:
                  payload = json.load(response)
              sha = payload.get('sha')
              if not isinstance(sha, str) or len(sha) != 40:
                  raise SystemExit(f'R159 blob publication failed: {path}')
              print(f'R159_TESTED_BLOB {path} {sha}')
          print('R159_TESTED_BLOBS_PUBLISHED_WITHOUT_REF_UPDATE')
          PY
