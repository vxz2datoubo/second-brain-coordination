name: Program Control Tower R149 Task Release Impact

on:
  pull_request:
    paths:
      - 'coordination/CONTROL-TOWER/task_release_impact.py'
      - 'coordination/CONTROL-TOWER/tests/test_task_release_impact.py'
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R149/**'
      - '.github/workflows/program-control-tower-r149-task-release-impact.yml'

permissions:
  contents: read

jobs:
  r149-impact-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact PR head and current main binding
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          test "$HEAD_SHA" = "$PR_HEAD"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          CURRENT_MAIN="$(git rev-parse refs/remotes/origin/main)"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "$BASE_SHA" = "$CURRENT_MAIN"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          echo "R149_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "R149_CURRENT_MAIN_SHA=$CURRENT_MAIN" >> "$GITHUB_ENV"
          printf 'HEAD=%s\nPR_HEAD=%s\nEVENT_BASE=%s\nCURRENT_MAIN=%s\n' "$HEAD_SHA" "$PR_HEAD" "$BASE_SHA" "$CURRENT_MAIN"

      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'

      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run R149 acceptance and adversarial regressions
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_task_release_impact.py' -v

      - name: Run retained Control Tower regression suite
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Scope, authority-boundary and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          export BASE="${{ github.event.pull_request.base.sha }}"
          python - <<'PY'
          import os, subprocess
          base = os.environ['BASE']
          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines()
          allowed_exact = {
              'coordination/CONTROL-TOWER/task_release_impact.py',
              'coordination/CONTROL-TOWER/tests/test_task_release_impact.py',
              '.github/workflows/program-control-tower-r149-task-release-impact.yml',
          }
          allowed_prefix = 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R149/'
          outside = [path for path in changed if path not in allowed_exact and not path.startswith(allowed_prefix)]
          if outside:
              raise SystemExit(f'R149_SCOPE_FAIL:{outside}')
          forbidden_prefixes = (
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/',
              'coordination/ACTIVE-',
          )
          forbidden = [path for path in changed if path.startswith(forbidden_prefixes)]
          if forbidden:
              raise SystemExit(f'R149_AUTHORITY_BOUNDARY_FAIL:{forbidden}')
          print('R149_SCOPE_PASS')
          print('NO_SIGNAL_TOWER_RUNTIME_MUTATION=true')
          print('NO_ACTIVE_ROUTE_OR_CLAIM_MUTATION=true')
          PY
          git diff --check "$BASE...HEAD"
          if grep -InE '\b(TODO|FIXME)\b|NotImplementedError' \
            coordination/CONTROL-TOWER/task_release_impact.py \
            coordination/CONTROL-TOWER/tests/test_task_release_impact.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R149 2>/dev/null; then
            exit 1
          fi

      - name: Receipt authority lock smoke
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          from task_release_impact import FINAL_DISPOSITIONS, RECEIPT_SCHEMA
          assert RECEIPT_SCHEMA == 'TaskReleaseImpactReceipt/v1'
          assert 'RELEASE_BOUNDED_TASK' in FINAL_DISPOSITIONS
          print('RECEIPT_IS_EVIDENCE_ONLY=true')
          print('NO_AUTOMATIC_TASK_TO_EXECUTION=true')
          PY
