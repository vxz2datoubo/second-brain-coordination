name: Epistemic Frontier Mapping Contracts

on:
  pull_request:
    paths:
      - "coordination/SKILLS/EPISTEMIC-KNOWLEDGE-STATE-FRONTIER-MAPPING-SKILL-v1.0.yaml"
      - "coordination/BLUEPRINTS/EPISTEMIC-KNOWLEDGE-STATE-FRONTIER-MAPPING-BLUEPRINT-v1.0.md"
      - "coordination/BLUEPRINTS/EPISTEMIC-KNOWLEDGE-STATE-FRONTIER-RESEARCH-VALIDATION-v1.0.md"
      - "coordination/PROPOSALS/PROGRAM-LANES/LANE-A-HARNESS-INTEGRATION/EPISTEMIC-FRONTIER-MAPPING/**"
      - ".github/workflows/epistemic-frontier-mapping-contracts.yml"
  push:
    branches:
      - "gpt/epistemic-frontier-mapping-skill"

jobs:
  contract-tests:
    name: Epistemic frontier contracts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only YAML parser
        run: python -m pip install pyyaml
      - name: Validate public-safe YAML artifacts
        run: >-
          python -c "import pathlib,yaml; paths=[pathlib.Path('coordination/SKILLS/EPISTEMIC-KNOWLEDGE-STATE-FRONTIER-MAPPING-SKILL-v1.0.yaml'),pathlib.Path('coordination/PROPOSALS/PROGRAM-LANES/LANE-A-HARNESS-INTEGRATION/EPISTEMIC-FRONTIER-MAPPING/EPISTEMIC-FRONTIER-EVALS-v1.0.yaml')]; docs=[yaml.safe_load(p.read_text(encoding='utf-8')) for p in paths]; assert all(isinstance(d,dict) for d in docs); print('EPISTEMIC_FRONTIER_FORMAT_VALIDATION_PASS')"
      - name: Run deterministic contract and adversarial eval tests
        run: >-
          python -m unittest discover -s coordination/PROPOSALS/PROGRAM-LANES/LANE-A-HARNESS-INTEGRATION/EPISTEMIC-FRONTIER-MAPPING/tests -v
      - name: Verify public-safe boundary strings
        run: >-
          python -c "import pathlib; txt='\n'.join(p.read_text(encoding='utf-8') for p in [pathlib.Path('coordination/SKILLS/EPISTEMIC-KNOWLEDGE-STATE-FRONTIER-MAPPING-SKILL-v1.0.yaml'),pathlib.Path('coordination/PROPOSALS/PROGRAM-LANES/LANE-A-HARNESS-INTEGRATION/EPISTEMIC-FRONTIER-MAPPING/EPISTEMIC-FRONTIER-EVALS-v1.0.yaml')]); assert 'NO_TRADE' in txt; assert 'NO_SECOND_KNOWLEDGE_AUTHORITY' in txt; assert 'Private raw evidence copied into public coordination artifacts' in txt; print('EPISTEMIC_FRONTIER_BOUNDARY_PASS')"
      - name: Verify diff whitespace
        run: git diff --check HEAD^ HEAD
