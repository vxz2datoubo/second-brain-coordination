name: Vendor-neutral agent kernel

on:
  pull_request:
    paths:
      - ".github/workflows/vendor-neutral-agent-kernel.yml"
      - "coordination/BLUEPRINTS/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL-PROTOCOL-v1.0-CANDIDATE.md"
      - "coordination/BLUEPRINTS/PERSONAL-EPISTEMIC-COGNITIVE-OPERATING-SYSTEM-AGENT-KERNEL-ADDENDUM-v1.0-CANDIDATE.md"
      - "coordination/BLUEPRINTS/PROJECT-BLUEPRINT-INTEGRATION-INDEX-v1.5-CANDIDATE.md"
      - "coordination/SKILLS/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL-GOVERNANCE-SKILL-v1.0.yaml"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-evidence:
    name: Candidate evidence (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check -r coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL/requirements-ci.txt
      - name: Resolve immutable evidence context
        id: context
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before || github.sha }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          git diff --name-only "$base...$head" > "$RUNNER_TEMP/changed-files.txt"
          echo "commit=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse "$head^{tree}")" >> "$GITHUB_OUTPUT"
          evidence="coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL/E30-COMPLETION-EVIDENCE.json"
          python - "$evidence" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys
          evidence = json.load(open(sys.argv[1], encoding="utf-8"))
          identity = evidence["primary_tested_identity"]
          print(f"tested_commit={identity['tested_commit']}")
          print(f"tested_tree={identity['tested_tree']}")
          PY
          echo "changed_files=$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"
      - name: Run complete candidate suite and static gates
        run: >-
          python -B coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL/ci_verify.py
          --changed-files "${{ steps.context.outputs.changed_files }}"
          --commit "${{ steps.context.outputs.commit }}"
          --tree "${{ steps.context.outputs.tree }}"
          --tested-commit "${{ steps.context.outputs.tested_commit }}"
          --tested-tree "${{ steps.context.outputs.tested_tree }}"
      - name: Reproduce clean Git archive evidence under three hash seeds
        shell: bash
        run: |
          set -euo pipefail
          reports=()
          : > "$RUNNER_TEMP/archive-roots.jsonl"
          for seed in 1 2 3; do
            archive_root="$(mktemp -d)"
            git archive "${{ steps.context.outputs.commit }}" | tar -x -C "$archive_root"
            report_path="$RUNNER_TEMP/archive-$seed.json"
            stderr_path="$RUNNER_TEMP/archive-$seed.stderr"
            PYTHONHASHSEED="$seed" python -B "$archive_root/coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL/ci_verify.py" \
              --changed-files "${{ steps.context.outputs.changed_files }}" \
              --commit "${{ steps.context.outputs.commit }}" \
              --tree "${{ steps.context.outputs.tree }}" \
              --tested-commit "${{ steps.context.outputs.tested_commit }}" \
              --tested-tree "${{ steps.context.outputs.tested_tree }}" > "$report_path" 2> "$stderr_path"
            report_sha="$(sha256sum "$report_path" | awk '{print $1}')"
            report_size="$(stat -c '%s' "$report_path")"
            stderr_sha="$(sha256sum "$stderr_path" | awk '{print $1}')"
            artifact_set_sha="$(printf 'ci-report.json\t%s\t%s\n' "$report_size" "$report_sha" | sha256sum | awk '{print $1}')"
            reports+=("$report_sha")
            printf '{"root_id":"e30-clean-archive-seed-%s","root_locator":"archive://e30-clean-archive-seed-%s","hash_seed":%s,"command":"PYTHONHASHSEED=%s python -B <root>/coordination/.../ci_verify.py --commit %s --tree %s --tested-commit %s --tested-tree %s","exit_code":0,"stdout_sha256":"%s","stderr_sha256":"%s","artifact_set_sha256":"%s","artifacts":[{"path":"ci-report.json","size":%s,"sha256":"%s"}]}\n' \
              "$seed" "$seed" "$seed" "$seed" "${{ steps.context.outputs.commit }}" "${{ steps.context.outputs.tree }}" \
              "${{ steps.context.outputs.tested_commit }}" "${{ steps.context.outputs.tested_tree }}" "$report_sha" "$stderr_sha" \
              "$artifact_set_sha" "$report_size" "$report_sha" >> "$RUNNER_TEMP/archive-roots.jsonl"
          done
          printf '%s\n' "${reports[@]}" | sort -u | tee "$RUNNER_TEMP/archive-report-hashes.txt"
          test "$(sort -u "$RUNNER_TEMP/archive-report-hashes.txt" | wc -l)" -eq 1
          python - "$RUNNER_TEMP/archive-roots.jsonl" "$RUNNER_TEMP/archive-manifest.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          roots = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines() if line]
          Path(sys.argv[2]).write_text(json.dumps({
              "schema_version": "VNAK_E30_ARCHIVE_PROVENANCE_v1",
              "root_count": len(roots),
              "roots": roots,
          }, sort_keys=True, indent=2) + "\n")
          PY
          cat "$RUNNER_TEMP/archive-manifest.json"
      - name: Upload machine-readable evidence
        uses: actions/upload-artifact@v4
        with:
          name: vendor-neutral-agent-kernel-evidence-py${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/archive-*.json
            ${{ runner.temp }}/archive-*.stderr
            ${{ runner.temp }}/archive-manifest.json
            ${{ runner.temp }}/archive-report-hashes.txt
