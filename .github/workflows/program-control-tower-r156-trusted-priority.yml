name: Program Control Tower R156 Trusted Priority

on:
  pull_request:
    paths:
      - ".github/workflows/program-control-tower-r156-trusted-priority.yml"
      - ".github/workflows/program-control-tower-r155-explicit-user-value.yml"
      - "coordination/CONTROL-TOWER/signal_priority_classification.py"
      - "coordination/CONTROL-TOWER/signal_opportunity_materializer_current.py"
      - "coordination/CONTROL-TOWER/tests/test_signal_priority_classification.py"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R156/**"

permissions:
  contents: read

jobs:
  r156:
    name: R156 trusted priority (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact-head provenance and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Compile R156 modules
        working-directory: coordination/CONTROL-TOWER
        run: python -m py_compile signal_priority_classification.py signal_opportunity_materializer_current.py tests/test_signal_priority_classification.py

      - name: Validate R156 JSON schema document
        run: python -m json.tool coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R156/TRUSTED-IDLE-PRIORITY-CLASSIFICATION.schema.json >/dev/null

      - name: Run R156 adversarial tests
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_priority_classification -v

      - name: Retain R155 user-value regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_user_value -v

      - name: Retain R154 ranking regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_opportunity_ranking -v

      - name: Retain R153 materializer regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_opportunity_materializer -v

      - name: Retain R152 apply regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_idle_signal_apply -v

      - name: Retain R151 scheduler regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_idle_signal_scheduler -v

      - name: Retain R150 trusted release regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_trusted_task_release -v

      - name: Retain R149 impact regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_task_release_impact -v

      - name: Run full Control Tower suite
        working-directory: coordination/CONTROL-TOWER
        run: python run_all_tests.py

      - name: Verify exact seven-file successor scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          allowed() {
            case "$1" in
              .github/workflows/program-control-tower-r156-trusted-priority.yml) return 0 ;;
              .github/workflows/program-control-tower-r155-explicit-user-value.yml) return 0 ;;
              coordination/CONTROL-TOWER/signal_priority_classification.py) return 0 ;;
              coordination/CONTROL-TOWER/signal_opportunity_materializer_current.py) return 0 ;;
              coordination/CONTROL-TOWER/tests/test_signal_priority_classification.py) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R156/PROJECT-PLAN.md) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R156/TRUSTED-IDLE-PRIORITY-CLASSIFICATION.schema.json) return 0 ;;
              *) return 1 ;;
            esac
          }
          for path in "${changed[@]}"; do
            if ! allowed "$path"; then
              echo "R156 out-of-scope path: $path" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 7
          test "$(git diff --name-status "$BASE" HEAD | grep -c '^A[[:space:]]')" -eq 5
          test "$(git diff --name-status "$BASE" HEAD | grep -c '^M[[:space:]]')" -eq 2
          echo R156_SCOPE_PASS

      - name: Verify trust and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE" HEAD | grep -E '^(coordination/ACTIVE-|coordination/ROUTES/|coordination/CONTROL-TOWER/LANE-WORK-CLAIMS\.yaml$|coordination/PROGRAMS/.*/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/)'; then
            echo "R156 may not mutate live authority or S0C" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          priority = Path('coordination/CONTROL-TOWER/signal_priority_classification.py').read_text(encoding='utf-8')
          current = Path('coordination/CONTROL-TOWER/signal_opportunity_materializer_current.py').read_text(encoding='utf-8')
          required_priority = [
              'POLICY_VERSION = "R156/v1"',
              'RESEARCH_EPISTEMIC_STATE = "CANDIDATE_HYPOTHESIS"',
              'INELIGIBLE_EPISTEMIC_STATES = frozenset({"UNKNOWN", "NEEDS_REVALIDATION"})',
              'priority = P4',
              'priority = P3',
              'R155_RANKING_UPGRADE_EVIDENCE_REQUIRED',
              'r156://priority/',
              'selects_opportunity": False',
              'releases_task": False',
              'grants_execution_authority": False',
              'grants_domain_write": False',
              'grants_w3_write": False',
              'grants_merge_authority": False',
          ]
          for needle in required_priority:
              if needle not in priority:
                  raise SystemExit(f'missing R156 priority boundary: {needle}')
          required_current = [
              'derive_trusted_priority_evidence(',
              'R156_BASE_PRIORITY_NOT_R154_P3',
              'R156_R155_RANKING_UPGRADE_EVIDENCE_REQUIRED',
              'R153_R154_R155_R156_TRUSTED_PRIORITY_BOUND',
          ]
          for needle in required_current:
              if needle not in current:
                  raise SystemExit(f'missing R156 composition boundary: {needle}')
          forbidden_parameters = ('priority_override', 'caller_priority', 'signal_kind:', 'desired_effect:', 'sentiment', 'embedding', 'jaccard', 'behavior_profile', 'private_chain_of_thought')
          for needle in forbidden_parameters:
              if needle in priority.casefold():
                  raise SystemExit(f'forbidden R156 inference/injection surface: {needle}')
          print('R156_AUTHORITY_BOUNDARY_PASS')
          PY

      - name: Verify whitespace and unfinished markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          if grep -R -n -E 'TODO|FIXME|NotImplementedError' \
            coordination/CONTROL-TOWER/signal_priority_classification.py \
            coordination/CONTROL-TOWER/signal_opportunity_materializer_current.py \
            coordination/CONTROL-TOWER/tests/test_signal_priority_classification.py; then
            exit 1
          fi
