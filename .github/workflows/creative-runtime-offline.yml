name: Creative runtime offline verification

on:
  pull_request:
    paths:
      - "creative_runtime/**"
      - "apps/cli/creativectl.py"
      - "apps/web/**"
      - "tests/test_creative*.py"
      - "tools/verify_creative_runtime.py"
      - "tools/build_experience_demo.py"
      - "tools/build_experience_package.py"
      - "tools/rehearse_creative_operations.py"
      - "tools/verify_experience_artifact.py"
      - "skills/creative-program-understanding-map/**"
      - "coordination/PROGRAMS/CREATIVE-INTERACTIVE-FILM-SECOND-BRAIN-0001/**"
      - ".github/workflows/creative-runtime-offline.yml"
  push:
    branches:
      - "codex/creative-runtime-continuous-build"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-runtime:
    name: Offline runtime (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Assert exact checked-out source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          echo "CREATIVE_RUNTIME_EXACT_HEAD=$EXPECTED_HEAD"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run deterministic creative-runtime tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_creative*.py" -v

      - name: Run complete offline lifecycle verification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/verify_creative_runtime.py --expected-head "$EXPECTED_HEAD"

      - name: Rehearse bounded synthetic multi-session operations
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/rehearse_creative_operations.py --session-count 8

      - name: Verify public-safe runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          if rg -n --glob '*.py' '(requests\.|urllib\.request|httpx|openai|anthropic|os\.environ)' creative_runtime apps/cli tools; then
            echo "Unexpected network or credential boundary in offline runtime"
            exit 2
          fi
          if rg -n --glob '*.html' '(fetch\(|XMLHttpRequest|WebSocket|navigator\.sendBeacon|https?://|<script[^>]+src=)' apps/web; then
            echo "Unexpected remote boundary in static experience player"
            exit 2
          fi
          echo "CREATIVE_RUNTIME_PUBLIC_SAFE_BOUNDARY=PASS"

      - name: Verify whitespace only within event diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

  synthetic-experience-artifact:
    name: Synthetic experience artifact (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: offline-runtime
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [night_signal, harbor_protocol]
    steps:
      - name: Checkout exact event head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Assert exact checked-out source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build exact-head synthetic experience artifact
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPERIENCE_PACKAGE: ${{ runner.temp }}/creative-runtime-experience-${{ matrix.scenario }}
        run: |
          set -euo pipefail
          python tools/build_experience_package.py --expected-head "$EXPECTED_HEAD" --scenario "${{ matrix.scenario }}" --output-dir "$EXPERIENCE_PACKAGE"
          python tools/verify_experience_artifact.py --expected-head "$EXPECTED_HEAD" --package-dir "$EXPERIENCE_PACKAGE"

      - name: Upload public-safe synthetic experience
        uses: actions/upload-artifact@v4
        with:
          name: creative-runtime-synthetic-experience-${{ matrix.scenario }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/creative-runtime-experience-${{ matrix.scenario }}
          if-no-files-found: error
          retention-days: 7
