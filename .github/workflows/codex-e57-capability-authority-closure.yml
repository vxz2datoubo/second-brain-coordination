name: Codex E57 Capability Authority Closure

on:
  pull_request:
    paths:
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CODEX-E57/**"
      - ".github/workflows/codex-e57-capability-authority-closure.yml"

permissions:
  contents: read

jobs:
  e57-authority:
    name: e57-authority / py${{ matrix.python-version }} / seed=${{ matrix.hash-seed }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        hash-seed: ["0", "1", "777"]
    env:
      PYTHONHASHSEED: ${{ matrix.hash-seed }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute E57 product suite and genuine mutations
        run: python coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CODEX-E57/tools/provider_runner.py --out provider-out
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-py${{ matrix.python-version }}-seed${{ matrix.hash-seed }}
          path: provider-out/canonical.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: environment-py${{ matrix.python-version }}-seed${{ matrix.hash-seed }}
          path: provider-out/environment.json
          if-no-files-found: error

  provider-compare:
    name: provider-compare
    needs: e57-authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: provider-artifacts
      - name: Compare canonical artifact bytes
        run: python coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CODEX-E57/tools/compare_provider_artifacts.py --root provider-artifacts --out compare-out
      - uses: actions/upload-artifact@v4
        with:
          name: provider-compare
          path: compare-out/provider-compare.json
          if-no-files-found: error
