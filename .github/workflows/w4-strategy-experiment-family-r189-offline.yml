name: W4 StrategyExperimentFamily R189 offline
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      exact_head:
        description: Exact commit SHA which this run asserts as its authority
        required: true
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ['3.11', '3.13']}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.exact_head || github.sha }}
      - name: exact_head_authority
        run: |
          test -z "${{ inputs.exact_head }}" || test "$(git rev-parse HEAD)" = "${{ inputs.exact_head }}"
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - run: python -m unittest discover -s coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W4-STRATEGY-EXPERIMENT-FAMILY-P0/tests -v
