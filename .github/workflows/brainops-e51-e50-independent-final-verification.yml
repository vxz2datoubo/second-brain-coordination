name: BrainOps E51 provider-observable E50 final verification

on:
  pull_request:
    paths:
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/E51/**"
      - ".github/workflows/brainops-e51-e50-independent-final-verification.yml"

permissions:
  contents: read

jobs:
  e51-provider-observable-verification:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact pull-request checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD) { throw "checkout_sha_mismatch:$actual" }
          "checkout_sha=$actual" | Set-Content -LiteralPath "$env:RUNNER_TEMP\\e51-checkout-${{ matrix.python-version }}.txt" -NoNewline
      - name: Run E51 verifier unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/E51/tests -p "test_*.py" -v
      - name: Execute exact frozen E50 receipt argv on independent Windows clone
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP "e51-${{ github.run_id }}-${{ matrix.python-version }}"
          python coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/E51/e51_provider_verifier.py `
            --workspace-root "$env:GITHUB_WORKSPACE" `
            --artifact-dir "$artifactDir"
      - name: Upload E51 provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e51-provider-observable-evidence-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/e51-${{ github.run_id }}-${{ matrix.python-version }}/*
            !${{ runner.temp }}/e51-${{ github.run_id }}-${{ matrix.python-version }}/scratch/**
          if-no-files-found: error
