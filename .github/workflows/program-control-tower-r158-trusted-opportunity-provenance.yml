name: R158 Successor Compatibility Bootstrap

on:
  push:
    branches:
      - gpt/r158-trusted-opportunity-provenance-binding
    paths:
      - '.github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact remediation head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install retained dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Fetch and apply content-addressed successor patch
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_BLOB: 75d96de957bbdcb33547a6d945fe81c368ea420c
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          sha = os.environ['SCRIPT_BLOB']
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs/{sha}"
          req = Request(url, headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urlopen(req) as response:
              payload = json.load(response)
          if payload.get('sha') != sha or payload.get('encoding') != 'base64':
              raise SystemExit('R158 successor patch blob identity mismatch')
          Path('/tmp/r158_successor_patch.py').write_bytes(base64.b64decode(payload['content']))
          PY
          python -m py_compile /tmp/r158_successor_patch.py
          python /tmp/r158_successor_patch.py

      - name: Validate patched workflow YAML
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for path in (
              '.github/workflows/program-control-tower-r151-idle-signal-auto-release.yml',
              '.github/workflows/program-control-tower-r152-idle-signal-apply.yml',
              '.github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml',
          ):
              value = yaml.safe_load(Path(path).read_text(encoding='utf-8'))
              if not isinstance(value, dict):
                  raise SystemExit(f'invalid workflow YAML: {path}')
          print('R158_PATCHED_WORKFLOW_YAML_PASS')
          PY

      - name: Create clean local-only preflight commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/program-control-tower-r151-idle-signal-auto-release.yml \
            .github/workflows/program-control-tower-r152-idle-signal-apply.yml \
            .github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/PROJECT-PLAN.md
          mapfile -t staged < <(git diff --cached --name-only)
          expected=(
            '.github/workflows/program-control-tower-r151-idle-signal-auto-release.yml'
            '.github/workflows/program-control-tower-r152-idle-signal-apply.yml'
            '.github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml'
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/PROJECT-PLAN.md'
          )
          test "${#staged[@]}" -eq 4
          for path in "${staged[@]}"; do
            printf '%s\n' "${expected[@]}" | grep -Fxq "$path"
          done
          git diff --cached --check
          git commit -m 'R158 local-only successor compatibility preflight'
          test -z "$(git status --porcelain --untracked-files=no)"
          echo R158_LOCAL_CLEAN_PREFLIGHT_COMMIT_PASS

      - name: Validate successor workflows and full retained suite on clean tree
        run: |
          cd coordination/CONTROL-TOWER
          python -m unittest tests.test_idle_signal_scheduler -v
          python -m unittest tests.test_idle_signal_apply -v
          python run_all_tests.py

      - name: Verify exact nine-file successor scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          mapfile -t effective < <(git diff --name-only refs/remotes/origin/main...HEAD)
          expected=(
            '.github/workflows/program-control-tower-r151-idle-signal-auto-release.yml'
            '.github/workflows/program-control-tower-r152-idle-signal-apply.yml'
            '.github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml'
            'coordination/CONTROL-TOWER/idle_signal_scheduler.py'
            'coordination/CONTROL-TOWER/idle_signal_apply.py'
            'coordination/CONTROL-TOWER/tests/test_idle_signal_scheduler.py'
            'coordination/CONTROL-TOWER/tests/test_idle_signal_apply.py'
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/PROJECT-PLAN.md'
            'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/TRUSTED-OPPORTUNITY-PROVENANCE.schema.json'
          )
          test "${#effective[@]}" -eq 9
          for path in "${effective[@]}"; do
            printf '%s\n' "${expected[@]}" | grep -Fxq "$path"
          done
          grep -Fq 'R151_R158_SUCCESSOR_SCOPE_PASS' .github/workflows/program-control-tower-r151-idle-signal-auto-release.yml
          grep -Fq 'R152_R158_SUCCESSOR_SCOPE_PASS' .github/workflows/program-control-tower-r152-idle-signal-apply.yml
          grep -Fq 'IdleSignalAutoReleaseAuthorization/v1' .github/workflows/program-control-tower-r151-idle-signal-auto-release.yml
          grep -Fq 'IdleSignalAutoReleaseAuthorization/v2' .github/workflows/program-control-tower-r151-idle-signal-auto-release.yml
          git diff --check refs/remotes/origin/main...HEAD
          echo R158_NINE_FILE_SUCCESSOR_PREFLIGHT_PASS

      - name: Publish exact tested remediation blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          paths = [
              '.github/workflows/program-control-tower-r151-idle-signal-auto-release.yml',
              '.github/workflows/program-control-tower-r152-idle-signal-apply.yml',
              '.github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/PROJECT-PLAN.md',
          ]
          endpoint = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs"
          for path in paths:
              content = base64.b64encode(Path(path).read_bytes()).decode('ascii')
              body = json.dumps({'content': content, 'encoding': 'base64'}).encode('utf-8')
              req = Request(endpoint, data=body, method='POST', headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              })
              with urlopen(req) as response:
                  payload = json.load(response)
              print(f"R158_FINAL_BLOB|{path}|{payload['sha']}")
          PY
