name: Program Control Tower R158 Trusted Opportunity Provenance

on:
  pull_request:
    paths:
      - ".github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml"
      - "coordination/CONTROL-TOWER/idle_signal_scheduler.py"
      - "coordination/CONTROL-TOWER/idle_signal_apply.py"
      - "coordination/CONTROL-TOWER/tests/test_idle_signal_scheduler.py"
      - "coordination/CONTROL-TOWER/tests/test_idle_signal_apply.py"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/**"

permissions:
  contents: read

jobs:
  r158:
    name: R158 provenance binding (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact-head provenance and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install retained Control Tower dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Compile R158 surfaces
        working-directory: coordination/CONTROL-TOWER
        run: python -m py_compile idle_signal_scheduler.py idle_signal_apply.py tests/test_idle_signal_scheduler.py tests/test_idle_signal_apply.py
      - name: Validate R158 schema
        run: python -m json.tool coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/TRUSTED-OPPORTUNITY-PROVENANCE.schema.json >/dev/null
      - name: Run R158 scheduler/apply adversarial regressions
        working-directory: coordination/CONTROL-TOWER
        run: |
          python -m unittest tests.test_idle_signal_scheduler -v
          python -m unittest tests.test_idle_signal_apply -v
      - name: Retain R157 through R149 regressions
        working-directory: coordination/CONTROL-TOWER
        run: |
          python -m unittest tests.test_r157_ranking_calibration -v
          python -m unittest tests.test_signal_priority_classification -v
          python -m unittest tests.test_signal_user_value -v
          python -m unittest tests.test_signal_opportunity_ranking -v
          python -m unittest tests.test_signal_opportunity_materializer -v
          python -m unittest tests.test_trusted_task_release -v
          python -m unittest tests.test_task_release_impact -v
      - name: Run full Control Tower suite
        working-directory: coordination/CONTROL-TOWER
        run: python run_all_tests.py
      - name: Verify exact seven-file bounded scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          allowed() {
            case "$1" in
              .github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml) return 0 ;;
              coordination/CONTROL-TOWER/idle_signal_scheduler.py) return 0 ;;
              coordination/CONTROL-TOWER/idle_signal_apply.py) return 0 ;;
              coordination/CONTROL-TOWER/tests/test_idle_signal_scheduler.py) return 0 ;;
              coordination/CONTROL-TOWER/tests/test_idle_signal_apply.py) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/PROJECT-PLAN.md) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/TRUSTED-OPPORTUNITY-PROVENANCE.schema.json) return 0 ;;
              *) return 1 ;;
            esac
          }
          for path in "${changed[@]}"; do allowed "$path" || { echo "R158 out-of-scope: $path" >&2; exit 1; }; done
          test "${#changed[@]}" -eq 7
          echo R158_SCOPE_PASS
      - name: Verify provenance and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          scheduler = Path('coordination/CONTROL-TOWER/idle_signal_scheduler.py').read_text()
          apply = Path('coordination/CONTROL-TOWER/idle_signal_apply.py').read_text()
          if 'AUTHORIZATION_SCHEMA = "IdleSignalAutoReleaseAuthorization/v2"' not in scheduler:
              raise SystemExit('R158 authorization v2 missing')
          required = (
              'signal_opportunity_materializer_current',
              'TrustedSignalOpportunityBatch/v1',
              'trusted_opportunity_batch_digest',
              'materialization_decision_digest',
              'caller_can_supply_opportunity_truth',
              'apply_requires_fresh_rematerialization',
          )
          for needle in required:
              if needle not in scheduler + apply:
                  raise SystemExit(f'R158 provenance binding missing: {needle}')
          tree = ast.parse(apply)
          fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == 'prepare_apply_transaction')
          names = [a.arg for a in fn.args.args + fn.args.kwonlyargs]
          if 'opportunity_value' in names or 'opportunity' in names:
              raise SystemExit(f'R152 caller opportunity truth seam still present: {names}')
          if 'materialization_requests' not in names:
              raise SystemExit(f'R152 materialization request input missing: {names}')
          for token in ('owner_observer=', 'materializer=', 'observer='):
              if token in scheduler:
                  raise SystemExit(f'R151 production injection seam present: {token}')
          print('R158_AUTHORITY_BOUNDARY_PASS')
          PY
      - name: Verify whitespace and unfinished markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          if grep -R -n -E 'TODO|FIXME|NotImplementedError' \
            coordination/CONTROL-TOWER/idle_signal_scheduler.py \
            coordination/CONTROL-TOWER/idle_signal_apply.py \
            coordination/CONTROL-TOWER/tests/test_idle_signal_scheduler.py \
            coordination/CONTROL-TOWER/tests/test_idle_signal_apply.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158; then
            exit 1
          fi
