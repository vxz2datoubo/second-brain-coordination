name: W2 Market Semantic Capability P0

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/w2-market-semantic-capability-p0.yml"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/MARKET-SEMANTIC-FIELD-SPEC.schema.json"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/PROVIDER-CAPABILITY-OBSERVATION.schema.json"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/fixtures/market-semantic-fields.synthetic.yaml"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/src/offline_research/market_semantics.py"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/tests/test_market_semantics.py"

permissions:
  contents: read

jobs:
  semantic-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check jsonschema PyYAML

      - name: Compile semantic runtime
        run: >-
          python -m compileall -q
          coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/src/offline_research/market_semantics.py
          coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/tests/test_market_semantics.py

      - name: Run inherited W2 plus R182 adversarial regressions
        env:
          PYTHONPATH: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/src
        run: >-
          python -m unittest discover
          -s coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/tests
          -p 'test_*.py'
          -v

      - name: Attack caller-minted last_verified_at freshness
        env:
          PYTHONPATH: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/src
        run: |
          python - <<'PY'
          import json
          from dataclasses import fields
          from pathlib import Path

          from offline_research.market_semantics import (
              MarketSemanticFieldSpec,
              SemanticValidationError,
              require_governed_semantic_spec,
              semantic_identity_digest_from_mapping,
          )

          root = Path("coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE")
          fixture = json.loads((root / "fixtures/market-semantic-fields.synthetic.yaml").read_text())
          original = dict(fixture["field_specs"][0])

          def attack(timestamp):
              forged = dict(original)
              forged["last_verified_at"] = timestamp
              forged["semantic_digest"] = semantic_identity_digest_from_mapping(forged)
              assert forged["semantic_digest"] != original["semantic_digest"], forged
              spec = MarketSemanticFieldSpec(**forged)
              try:
                  require_governed_semantic_spec(spec)
              except SemanticValidationError as exc:
                  assert exc.code == "SEMANTIC_REGISTRY_DIGEST_MISMATCH", exc
                  return
              raise AssertionError(f"caller-minted verification freshness accepted: {timestamp}")

          attack("2026-09-02T00:00:00-05:00")
          attack("2099-01-01T00:00:00+00:00")
          print("R182_LAST_VERIFIED_AT_AUTHORITY_ATTACK_PASS")
          PY

      - name: Enforce exact six-file write scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          allowed = {
              ".github/workflows/w2-market-semantic-capability-p0.yml",
              "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/MARKET-SEMANTIC-FIELD-SPEC.schema.json",
              "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/PROVIDER-CAPABILITY-OBSERVATION.schema.json",
              "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/fixtures/market-semantic-fields.synthetic.yaml",
              "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/src/offline_research/market_semantics.py",
              "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-2-OFFLINE-VERTICAL-SLICE/tests/test_market_semantics.py",
          }
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          changed = {
              line.strip()
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}...{head}"], text=True
              ).splitlines()
              if line.strip()
          }
          unexpected = sorted(changed - allowed)
          missing = sorted(allowed - changed)
          if unexpected:
              raise SystemExit(f"R182_SCOPE_VIOLATION unexpected={unexpected}")
          if missing:
              raise SystemExit(f"R182_SCOPE_INCOMPLETE missing={missing}")
          print(f"R182_SCOPE_PASS changed={len(changed)}")
          PY

      - name: Whitespace gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
