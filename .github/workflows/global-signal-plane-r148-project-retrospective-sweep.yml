name: Global Signal Plane R148 Project Retrospective Sweep

on:
  pull_request:
    paths:
      - ".github/workflows/global-signal-plane-r148-project-retrospective-sweep.yml"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/R148-PROJECT-RETROSPECTIVE-SWEEP/**"
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Exact commit SHA to verify"
        required: true
        type: string
      base_ref:
        description: "Base branch/ref for scope comparison"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: r148-${{ github.ref }}
  cancel-in-progress: true

env:
  R148_ROOT: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/R148-PROJECT-RETROSPECTIVE-SWEEP
  R147_ROOT: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/R147-AUTOMATIC-INGRESS
  S0E_ROOT: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY
  S0C_ROOT: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC
  EXACT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_sha }}
  EXACT_BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.base_ref }}

jobs:
  exact-head:
    name: Python ${{ matrix.python-version }} R148 exact-head
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Validate exact-head inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXACT_HEAD_SHA}"
          test -n "${EXACT_BASE_REF}"
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "${EXACT_HEAD_SHA}"
      - name: Run R148 regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/${{ env.R148_ROOT }}/src:${{ github.workspace }}/${{ env.R147_ROOT }}/src:${{ github.workspace }}/${{ env.S0E_ROOT }}/src:${{ github.workspace }}/${{ env.S0C_ROOT }}/src
        run: python -m unittest discover -s "${R148_ROOT}/tests" -p "test_*.py" -v
      - name: Re-run R142 retrospective regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/${{ env.S0E_ROOT }}/src:${{ github.workspace }}/${{ env.S0C_ROOT }}/src:${{ github.workspace }}/${{ env.S0E_ROOT }}/tests
        run: python -m unittest discover -s "${S0E_ROOT}/tests" -p "test_r142_retrospective_intake.py" -v
      - name: Re-run R142/R145 semantic boundary regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/${{ env.S0E_ROOT }}/src:${{ github.workspace }}/${{ env.S0C_ROOT }}/src:${{ github.workspace }}/${{ env.S0E_ROOT }}/tests
        run: python -m unittest discover -s "${S0E_ROOT}/tests" -p "test_r142_r145_semantic_regressions.py" -v
      - name: Re-run R147 durable ingress regressions
        env:
          PYTHONPATH: ${{ github.workspace }}/${{ env.R147_ROOT }}/src:${{ github.workspace }}/${{ env.S0E_ROOT }}/src:${{ github.workspace }}/${{ env.S0C_ROOT }}/src:${{ github.workspace }}/${{ env.S0E_ROOT }}/tests
        run: python -m unittest discover -s "${R147_ROOT}/tests" -p "test_*.py" -v
      - name: Scope and whitespace check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${EXACT_BASE_REF}"
          git diff --check "origin/${EXACT_BASE_REF}...HEAD"
          while IFS= read -r path; do
            case "${path}" in
              .github/workflows/global-signal-plane-r148-project-retrospective-sweep.yml) ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/R148-PROJECT-RETROSPECTIVE-SWEEP/*) ;;
              *) echo "R148_SCOPE_DRIFT:${path}"; exit 1 ;;
            esac
          done < <(git diff --name-only "origin/${EXACT_BASE_REF}...HEAD")
