name: QCLAW E50 learning-system preproduction audit

on:
  pull_request:
    paths:
      - ".github/workflows/qclaw-e50-preproduction-audit.yml"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-LEARNING-SYSTEM-PREPRODUCTION-COMPLETENESS-AUDIT-0032-E50/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: E50 audit Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-LEARNING-SYSTEM-PREPRODUCTION-COMPLETENESS-AUDIT-0032-E50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run E50 canonical-system audit unit tests
        run: python -m unittest discover -s tests -t .
      - name: Run full E50 audit and emit canonicalized evidence matrix
        run: |
          python canary/build_evidence_matrix.py
          python - <<'PY'
          import json, hashlib, pathlib
          p = pathlib.Path("evidence/evidence_matrix.json")
          raw = p.read_text(encoding="utf-8")
          data = json.loads(raw)
          # Canonicalize for cross-version comparison: drop the head SHA
          # (CI checkout HEAD differs per run) and keep verdicts deterministic.
          data["cross_version_compare"] = {
              "matrix_sha256": hashlib.sha256(raw.encode("utf-8")).hexdigest(),
              "recommendation": data["recommendation"]["recommendation"],
              "verdicts": {d["dimension"]: d["verdict"] for d in data["matrix"]["dimensions"]},
          }
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print("matrix_sha256:", data["cross_version_compare"]["matrix_sha256"])
          print("recommendation:", data["cross_version_compare"]["recommendation"])
          print("verdicts:", json.dumps(data["cross_version_compare"]["verdicts"]))
          PY
      - name: Upload evidence matrix artifact
        uses: actions/upload-artifact@v4
        with:
          name: e50-evidence-matrix-${{ matrix.python-version }}
          path: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-LEARNING-SYSTEM-PREPRODUCTION-COMPLETENESS-AUDIT-0032-E50/evidence/evidence_matrix.json
