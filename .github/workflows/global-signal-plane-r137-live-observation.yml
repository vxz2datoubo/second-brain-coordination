name: Global Signal Plane R137 Live Observation

on:
  pull_request:
    paths:
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/**"
      - ".github/workflows/global-signal-plane-r137-live-observation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r137-mechanisms:
    name: R137 mechanisms (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact workflow head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install public parser dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: R137 and R136 fail-closed regressions
        env:
          PYTHONPATH: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src:coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/tests -p 'test_r137_live_observation_provider.py' -v
          python -m unittest discover -s coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/tests -p 'test_r136_matrix.py' -v
      - name: Detect whether canonical ACTIVE route is R137
        id: active_r137
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import yaml

          active = yaml.safe_load(Path('coordination/ACTIVE-CODEX-TASK.yaml').read_text(encoding='utf-8'))
          is_r137 = (
              active.get('task_id') == 'CODEX-GLOBAL-SIGNAL-TOWER-R137-AUTHORITY-BOUND-LIVE-OBSERVATION-PROVIDER'
              and int(active.get('route_epoch', -1)) == 137
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"enabled={'true' if is_r137 else 'false'}\n")
          print({'r137_live_proof_enabled': is_r137, 'observed_task_id': active.get('task_id'), 'observed_route_epoch': active.get('route_epoch')})
          PY
      - name: Public GitHub on-demand runtime proof
        if: github.event_name == 'pull_request' && steps.active_r137.outputs.enabled == 'true'
        env:
          PYTHONPATH: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src:coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/src
          PYTHONDONTWRITEBYTECODE: "1"
          R137_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from global_signal_gateway.gateway import validate_live_observation_proof
          from global_signal_gateway.live_observation_provider import (
              CONTROL_PATHS, CONTRACT_REVISION, DOMAIN_REPOSITORY,
              DomainFreshnessTarget, LiveObservationProvider, LiveObservationRequest,
          )
          request = LiveObservationRequest(
              request_id="github-actions-r137-public-proof",
              provider_contract_revision=CONTRACT_REVISION,
              target_repository="vxz2datoubo/second-brain-coordination",
              target_branch="main",
              pull_request_number=int(os.environ["R137_PR_NUMBER"]),
              expected_task_id="CODEX-GLOBAL-SIGNAL-TOWER-R137-AUTHORITY-BOUND-LIVE-OBSERVATION-PROVIDER",
              expected_route_epoch=137,
              required_control_plane_paths=CONTROL_PATHS,
              required_domain_freshness_targets=(DomainFreshnessTarget(DOMAIN_REPOSITORY),),
              required_review_scope="ALL_RAW_REVIEWS",
              requested_max_age_seconds=300,
              requested_at=datetime.now(timezone.utc).isoformat(),
          )
          bundle, proof = LiveObservationProvider().observe(request)
          assert validate_live_observation_proof(proof)
          print({"evidence_ref": bundle.identity_ref(), "evidence_digest": bundle.bundle_digest, "main": bundle.initial_main_sha})
          PY
