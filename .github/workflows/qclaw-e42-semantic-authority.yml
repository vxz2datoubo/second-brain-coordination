name: QCLAW E42 Semantic Authority Evaluation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches:
      - qclaw/e41-post-receipt-semantic-authority-repair-0023-e42

jobs:
  test:
    name: Python ${{ matrix.python }} seed ${{ matrix.hash_seed }}
    runs-on: ubuntu-latest
    if-no-files-found: error
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        hash_seed: [0, 1, 777]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert exact head
        run: |
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          ACTUAL=$(git rev-parse HEAD)
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL" || { echo "HEAD MISMATCH"; exit 1; }
      - name: Run E42 test suite
        env:
          PYTHONHASHSEED: ${{ matrix.hash_seed }}
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-E41-POST-RECEIPT-SEMANTIC-AUTHORITY-REPAIR-0023-E42
        run: |
          python -m unittest discover -s tests -p "test_q*.py" -v
      - name: Generate canonical artifact
        env:
          PYTHONHASHSEED: ${{ matrix.hash_seed }}
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-E41-POST-RECEIPT-SEMANTIC-AUTHORITY-REPAIR-0023-E42
        run: |
          mkdir -p artifacts
          find src -name "*.py" -print0 | sort -z | xargs -0 cat > artifacts/source-concat.txt
          sha256sum artifacts/source-concat.txt > artifacts/source-concat.txt.sha256
          python -m unittest discover -s tests -p "test_q*.py" > artifacts/test-output.txt 2>&1 || true
          sha256sum artifacts/test-output.txt > artifacts/test-output.txt.sha256
      - name: Upload canonical artifact
        uses: actions/upload-artifact@v4
        with:
          name: e42-artifact-py${{ matrix.python }}-seed${{ matrix.hash_seed }}
          path: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-E41-POST-RECEIPT-SEMANTIC-AUTHORITY-REPAIR-0023-E42/artifacts/
          if-no-files-found: error

  byte-compare:
    name: Byte-exact artifact compare
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/download-artifact@v4
      - name: Download all artifacts
        run: |
          mkdir -p all-artifacts
          for d in e42-artifact-*/; do
            cp -r "$d" all-artifacts/
          done
      - name: Compare artifacts
        run: |
          echo "=== Artifact Comparison ==="
          find all-artifacts -name "source-concat.txt.sha256" -exec echo "=== {} ===" \; -exec cat {} \;
          echo "---"
          echo "Expected 6 artifacts (3.11+3.13 x seeds 0/1/777)"
          COUNT=$(find all-artifacts -name "source-concat.txt.sha256" | wc -l)
          echo "Found: $COUNT"
          test "$COUNT" -eq 6 || { echo "ARTIFACT COUNT MISMATCH"; exit 1; }
          echo "Byte comparison: checking all source-concat.txt files match"
          FIRST=$(find all-artifacts -name "source-concat.txt" | head -1)
          SHA_FIRST=$(sha256sum "$FIRST" | awk '{print $1}')
          for f in $(find all-artifacts -name "source-concat.txt"); do
            SHA=$(sha256sum "$f" | awk '{print $1}')
            echo "  $f: $SHA"
            test "$SHA" = "$SHA_FIRST" || { echo "BYTE MISMATCH"; exit 1; }
          done
          echo "All 6 artifacts byte-identical ✅"
