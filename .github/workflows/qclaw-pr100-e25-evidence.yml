name: QCLAW PR #100 E25 Gate B Evidence

on:
  push:
    branches: [qclaw/q0-d2-candidate-adapter-0011-e8]
    paths:
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8/**"
      - ".github/workflows/qclaw-pr100-e25-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    name: Python ${{ matrix.python-version }} E25 Evidence
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Record identity
        run: |
          echo "GitHub SHA: ${{ github.sha }}"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Runner: ${{ runner.os }} ${{ runner.arch }}"
          python --version
          git log -1 --format="%H %s"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Extract canonical D2 from accepted commit (not local copy)
        run: |
          python -c "
          import hashlib, subprocess
          CANONICAL_COMMIT = 'd6f9e2e4d38861e91353be177c9ceacedde6d7ee'
          EXPECTED_HASH = '33a7d821866bb327143a51c18cf7619bea1b706c189f6713584fd459229175f1'
          # Extract from canonical commit (isolated, not from PR tree)
          subprocess.run(['git', 'show', f'{CANONICAL_COMMIT}:coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/A-SHARE-MULTI-AGENT-GAME-ENGINE/0001-D2/d2_game_core.py'], capture_output=True, check=True)
          result = subprocess.run(['git', 'show', f'{CANONICAL_COMMIT}:coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/A-SHARE-MULTI-AGENT-GAME-ENGINE/0001-D2/d2_game_core.py'], capture_output=True, text=True)
          h = hashlib.sha256(result.stdout.encode('utf-8')).hexdigest()
          assert h == EXPECTED_HASH, f'CANONICAL D2 HASH MISMATCH: got {h}, expected {EXPECTED_HASH}'
          import os
          os.makedirs('0011-E8/d2_verify', exist_ok=True)
          open('0011-E8/d2_verify/canonical_hash.txt', 'w').write(f'{h}\n{EXPECTED_HASH}\nMATCH\n')
          print(f'Canonical D2 verified: {h}')
          "

      - name: Generator
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
        run: python -u generate_adapters.py
        env:
          Q0_SRC_DIR: q0_sources
          OUTPUT_DIR: .
          POLICY_DIR: .
          PYTHONHASHSEED: "0"

      - name: Validator
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
        run: python -u validate_adapters.py
        env:
          Q0_SRC_DIR: q0_sources
          OUTPUT_DIR: .
          POLICY_DIR: .

      - name: E25 Evidence Runner (42 adversarial + exact-set + receipts)
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
        run: python -u run_e25_full_evidence.py
        env:
          Q0_SRC_DIR: q0_sources
          OUTPUT_DIR: .
          POLICY_DIR: .
          PYTHONHASHSEED: "0"
          PYTHONIOENCODING: "utf-8"
          E25_GIT_SHA: ${{ github.sha }}

      - name: Scan public delivery surface
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/QCLAW-D2-CANDIDATE-ADAPTER/0011-E8
        run: python -u public_surface_scan.py
