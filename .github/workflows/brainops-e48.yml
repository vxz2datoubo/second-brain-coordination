name: BrainOps E48 exact-head synthetic gate

on:
  pull_request:
    paths:
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/**"
      - ".github/workflows/brainops-e48.yml"
  push:
    branches:
      - "codex/brainops-integrated-recoverable-authority-release-gate-0044-e48"

jobs:
  e48:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          PYTHONPATH=coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/src \
            python -m brainops_control_plane.ci_identity "$EXPECTED_HEAD"
      - name: Run full synthetic regression
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE
        run: python -m unittest discover -s tests -p "test_*.py" -q
      - name: Validate workflow policy
        run: |
          PYTHONPATH=coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/src \
            python -m brainops_control_plane.workflow_policy --workflow .github/workflows/brainops-e48.yml
      - name: Prepare external evidence directory
        run: |
          echo "E48_EVIDENCE_DIR=$RUNNER_TEMP/e48-${{ github.run_id }}-${{ matrix.python-version }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/e48-${{ github.run_id }}-${{ matrix.python-version }}"
      - name: Generate provider pre-evidence
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          printf '{"evidence_class":"IN_JOB_POLICY_AND_CURRENT_JOB_OBSERVATION_ONLY","head_sha":"%s","job_python_version":"%s","required_python_versions":["3.11","3.13"],"workflow":"brainops-e48.yml"}\n' "$EXPECTED_HEAD" "${{ matrix.python-version }}" > "$E48_EVIDENCE_DIR/e48-provider-pre-evidence.json"
      - name: Run repository-backed pre-receipt gate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          BASE_HEAD="$(git merge-base origin/main HEAD)"
          PYTHONPATH=coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/src \
            python -m brainops_control_plane.release_gate \
              --repository-root . \
              --program-root coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE \
              --expected-head "$EXPECTED_HEAD" \
              --base-head "$BASE_HEAD" \
              --provider-pre-evidence "$E48_EVIDENCE_DIR/e48-provider-pre-evidence.json" \
              --output "$E48_EVIDENCE_DIR/e48-release-pre-evidence.json"
      - name: Run active mutation harness
        run: |
          PYTHONPATH=coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/src \
            python -m brainops_control_plane.mutation_harness \
              --program-root coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE \
              --repository-root . \
              --base-head "$(git merge-base origin/main HEAD)" \
              --expected-head "${{ github.event.pull_request.head.sha || github.sha }}" \
              --output "$E48_EVIDENCE_DIR/e48-mutation-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: e48-pre-evidence-${{ matrix.python-version }}
          path: ${{ runner.temp }}/e48-${{ github.run_id }}-${{ matrix.python-version }}
