name: Program Control Tower R150 Trusted Task Release

on:
  pull_request:
    paths:
      - 'coordination/CONTROL-TOWER/trusted_task_release.py'
      - 'coordination/CONTROL-TOWER/tests/test_trusted_task_release.py'
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R150/**'
      - '.github/workflows/program-control-tower-r150-trusted-task-release.yml'

permissions:
  contents: read

jobs:
  r150-trusted-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact PR head and fresh current main
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          test "$HEAD_SHA" = "$PR_HEAD"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          CURRENT_MAIN="$(git rev-parse refs/remotes/origin/main)"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "$BASE_SHA" = "$CURRENT_MAIN"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          echo "R150_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "R150_CURRENT_MAIN_SHA=$CURRENT_MAIN" >> "$GITHUB_ENV"
          printf 'HEAD=%s\nPR_HEAD=%s\nEVENT_BASE=%s\nCURRENT_MAIN=%s\n' "$HEAD_SHA" "$PR_HEAD" "$BASE_SHA" "$CURRENT_MAIN"

      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'

      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run R150 trusted-observation adversarial regressions
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_trusted_task_release.py' -v

      - name: Run retained R149 acceptance regressions
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_task_release_impact.py' -v

      - name: Run retained full Control Tower suite
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Scope, authority and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          export BASE="${{ github.event.pull_request.base.sha }}"
          python - <<'PY'
          import os, subprocess
          base = os.environ['BASE']
          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines()
          allowed_exact = {
              'coordination/CONTROL-TOWER/trusted_task_release.py',
              'coordination/CONTROL-TOWER/tests/test_trusted_task_release.py',
              '.github/workflows/program-control-tower-r150-trusted-task-release.yml',
          }
          allowed_prefix = 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R150/'
          outside = [path for path in changed if path not in allowed_exact and not path.startswith(allowed_prefix)]
          if outside:
              raise SystemExit(f'R150_SCOPE_FAIL:{outside}')
          forbidden_prefixes = (
              'coordination/ACTIVE-',
              'coordination/ROUTES/',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/',
          )
          forbidden = [path for path in changed if path.startswith(forbidden_prefixes)]
          if forbidden:
              raise SystemExit(f'R150_AUTHORITY_BOUNDARY_FAIL:{forbidden}')
          print('R150_SCOPE_PASS')
          print('NO_ACTIVE_ROUTE_CLAIM_WORKER_MUTATION=true')
          print('NO_SIGNAL_TOWER_RUNTIME_MUTATION=true')
          print('NO_SECOND_DOMAIN_AUTHORITY=true')
          PY
          git diff --check "$BASE...HEAD"
          if grep -InE '\b(TODO|FIXME)\b|NotImplementedError' \
            coordination/CONTROL-TOWER/trusted_task_release.py \
            coordination/CONTROL-TOWER/tests/test_trusted_task_release.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R150 2>/dev/null; then
            exit 1
          fi

      - name: Evidence-only authority smoke
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          from trusted_task_release import PROPOSAL_SCHEMA, TRUSTED_RECEIPT_SCHEMA
          assert PROPOSAL_SCHEMA == 'TaskReleaseProposal/v1'
          assert TRUSTED_RECEIPT_SCHEMA == 'TrustedTaskReleaseImpactReceipt/v1'
          print('R150_RECEIPT_EVIDENCE_ONLY=true')
          print('NO_AUTOMATIC_TASK_ROUTE_CLAIM=true')
          print('NO_DOMAIN_SIGNAL_W3_WRITE=true')
          PY
