name: Program Control Tower R154 Signal Opportunity Ranking

on:
  pull_request:
    paths:
      - ".github/workflows/program-control-tower-r154-signal-opportunity-ranking.yml"
      - ".github/workflows/program-control-tower-r153-signal-opportunity-materializer.yml"
      - "coordination/CONTROL-TOWER/signal_opportunity_ranking.py"
      - "coordination/CONTROL-TOWER/tests/test_signal_opportunity_ranking.py"
      - "coordination/CONTROL-TOWER/signal_opportunity_materializer.py"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R154/**"

permissions:
  contents: read

jobs:
  r154:
    name: R154 ranking evidence (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact-head provenance and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Compile R154 and R153
        working-directory: coordination/CONTROL-TOWER
        run: python -m py_compile signal_opportunity_ranking.py signal_opportunity_materializer.py tests/test_signal_opportunity_ranking.py tests/test_signal_opportunity_materializer.py

      - name: Run R154 adversarial tests
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_opportunity_ranking -v

      - name: Retain R153 materializer regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_opportunity_materializer -v

      - name: Retain R152 apply regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_idle_signal_apply -v

      - name: Retain R151 scheduler regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_idle_signal_scheduler -v

      - name: Retain R150 trusted release regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_trusted_task_release -v

      - name: Retain R149 impact regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_task_release_impact -v

      - name: Run full Control Tower suite
        working-directory: coordination/CONTROL-TOWER
        run: python run_all_tests.py

      - name: Verify exact seven-file scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          allowed() {
            case "$1" in
              .github/workflows/program-control-tower-r153-signal-opportunity-materializer.yml) return 0 ;;
              .github/workflows/program-control-tower-r154-signal-opportunity-ranking.yml) return 0 ;;
              coordination/CONTROL-TOWER/signal_opportunity_ranking.py) return 0 ;;
              coordination/CONTROL-TOWER/tests/test_signal_opportunity_ranking.py) return 0 ;;
              coordination/CONTROL-TOWER/signal_opportunity_materializer.py) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R154/PROJECT-PLAN.md) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R154/TRUSTED-SIGNAL-OPPORTUNITY-RANKING.schema.json) return 0 ;;
              *) return 1 ;;
            esac
          }
          for path in "${changed[@]}"; do
            if ! allowed "$path"; then
              echo "R154 out-of-scope path: $path" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 7
          echo R154_SCOPE_PASS

      - name: Verify authority boundary and no protected mutations
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$BASE" HEAD | grep -E '^(coordination/ACTIVE-|coordination/ROUTES/|coordination/CONTROL-TOWER/LANE-WORK-CLAIMS\.yaml$|coordination/PROGRAMS/.*/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/)'; then
            echo "R154 may not mutate live authority or S0C" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          ranker = Path('coordination/CONTROL-TOWER/signal_opportunity_ranking.py').read_text(encoding='utf-8')
          materializer = Path('coordination/CONTROL-TOWER/signal_opportunity_materializer.py').read_text(encoding='utf-8')
          for needle in [
              'selects_opportunity": False',
              'releases_task": False',
              'creates_task": False',
              'grants_execution_authority": False',
              'grants_domain_write": False',
              'grants_merge_authority": False',
          ]:
              if needle not in ranker:
                  raise SystemExit(f'missing R154 boundary: {needle}')
          if 'derive_trusted_ranking_evidence' not in materializer or 'ranking_evidence_ref' not in materializer:
              raise SystemExit('R153 is not mechanically integrated with R154')
          if '**TRUSTED_NEUTRAL_RANKING' in materializer:
              raise SystemExit('R153 still expands the hard-coded neutral ranking vector')
          for forbidden in ('embedding', 'jaccard'):
              if forbidden in ranker.casefold():
                  raise SystemExit(f'R154 fuzzy ranking authority forbidden: {forbidden}')
          print('R154_AUTHORITY_BOUNDARY_PASS')
          PY

      - name: Verify whitespace and unfinished markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          if grep -R -n -E 'TODO|FIXME|NotImplementedError' \
            coordination/CONTROL-TOWER/signal_opportunity_ranking.py \
            coordination/CONTROL-TOWER/tests/test_signal_opportunity_ranking.py \
            coordination/CONTROL-TOWER/signal_opportunity_materializer.py; then
            exit 1
          fi