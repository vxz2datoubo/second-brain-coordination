name: Global Signal Plane S0D
on:
  pull_request:
    paths: ['coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0D-READ-ONLY-SHADOW/**', '.github/workflows/global-signal-plane-s0d.yml']
  push:
    branches: ['codex/global-signal-plane-s0d-read-only-shadow-r135']
jobs:
  s0d-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {python-version: ['3.11', '3.13']}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python-version }}'}
      - name: Install exact YAML parser used by source-schema admission
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Run S0D mechanism regressions
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0D-READ-ONLY-SHADOW
        env: {PYTHONPATH: src}
        run: python -m unittest discover -s tests -v
      - name: Run public safety scan
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0D-READ-ONLY-SHADOW
        run: python public_safety_scan.py
      - name: Validate public artifacts and diff
        run: |
          python -c "import json; json.load(open('coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0D-READ-ONLY-SHADOW/REAL-SOURCE-ONE-SHOT-SHADOW-RECEIPT.json', encoding='utf-8')); print('S0D_RECEIPT_JSON_PASS')"
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          git diff --check "$BASE_SHA...HEAD"
