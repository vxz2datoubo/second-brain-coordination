name: Program Control Tower R157 Ranking Calibration

on:
  pull_request:
    paths:
      - ".github/workflows/program-control-tower-r157-ranking-calibration.yml"
      - "coordination/CONTROL-TOWER/evals/r157_ranking_calibration.py"
      - "coordination/CONTROL-TOWER/tests/test_r157_ranking_calibration.py"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R157/**"

permissions:
  contents: read

jobs:
  r157:
    name: R157 ranking calibration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact-head provenance and base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${{ github.event.pull_request.base.sha }}"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha }}" HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install retained Control Tower test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Compile R157 evaluator and tests
        working-directory: coordination/CONTROL-TOWER
        run: python -m py_compile evals/r157_ranking_calibration.py tests/test_r157_ranking_calibration.py

      - name: Validate R157 JSON documents
        run: |
          python -m json.tool coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R157/RANKING-CALIBRATION-REPORT.schema.json >/dev/null
          python -m json.tool coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R157/RANKING-CALIBRATION-SCENARIOS.json >/dev/null

      - name: Run R157 counterfactual and adversarial tests
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_r157_ranking_calibration -v

      - name: Retain R156 priority classification regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_priority_classification -v

      - name: Retain R155 user-value regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_user_value -v

      - name: Retain R154 ranking regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_opportunity_ranking -v

      - name: Retain R153 materializer regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_signal_opportunity_materializer -v

      - name: Retain R152 apply regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_idle_signal_apply -v

      - name: Retain R151 scheduler regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_idle_signal_scheduler -v

      - name: Retain R150 trusted release regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_trusted_task_release -v

      - name: Retain R149 impact regressions
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest tests.test_task_release_impact -v

      - name: Run full Control Tower suite
        working-directory: coordination/CONTROL-TOWER
        run: python run_all_tests.py

      - name: Verify exact six-additive-file evaluation scope
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          allowed() {
            case "$1" in
              .github/workflows/program-control-tower-r157-ranking-calibration.yml) return 0 ;;
              coordination/CONTROL-TOWER/evals/r157_ranking_calibration.py) return 0 ;;
              coordination/CONTROL-TOWER/tests/test_r157_ranking_calibration.py) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R157/PROJECT-PLAN.md) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R157/RANKING-CALIBRATION-REPORT.schema.json) return 0 ;;
              coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R157/RANKING-CALIBRATION-SCENARIOS.json) return 0 ;;
              *) return 1 ;;
            esac
          }
          for path in "${changed[@]}"; do
            if ! allowed "$path"; then
              echo "R157 out-of-scope path: $path" >&2
              exit 1
            fi
          done
          test "${#changed[@]}" -eq 6
          test "$(git diff --name-status "$BASE" HEAD | grep -c '^A[[:space:]]')" -eq 6
          if git diff --name-status "$BASE" HEAD | grep -Ev '^A[[:space:]]'; then
            echo "R157 is additive-only; existing-file mutation detected" >&2
            exit 1
          fi
          echo R157_SCOPE_PASS

      - name: Verify evaluation-only authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('coordination/CONTROL-TOWER/evals/r157_ranking_calibration.py')
          source = path.read_text(encoding='utf-8')
          tree = ast.parse(source)

          allowed_import_roots = {'__future__', 'hashlib', 'json', 'typing', 'idle_signal_scheduler'}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      if alias.name.split('.')[0] not in allowed_import_roots:
                          raise SystemExit(f'R157 evaluator imports forbidden module: {alias.name}')
              elif isinstance(node, ast.ImportFrom):
                  module = node.module or ''
                  if module.split('.')[0] not in allowed_import_roots:
                      raise SystemExit(f'R157 evaluator imports forbidden module: {module}')

          imported_rank_subject = False
          for node in tree.body:
              if isinstance(node, ast.ImportFrom) and node.module == 'idle_signal_scheduler':
                  imported = {alias.name for alias in node.names}
                  if imported != {'P3', 'P4', '_rank_key'}:
                      raise SystemExit(f'R157 subject import surface changed: {sorted(imported)}')
                  imported_rank_subject = True
          if not imported_rank_subject:
              raise SystemExit('R157 retained R151 rank subject import missing')

          function_names = {node.name for node in ast.walk(tree) if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))}
          if '_rank_key' in function_names:
              raise SystemExit('R157 may not duplicate the R151 _rank_key implementation')

          forbidden_tokens = (
              'evaluate_trusted_release_proposal',
              'LiveObservationProvider',
              'requests',
              'urllib',
              'subprocess',
              'socket',
              'os.system',
              'write_text(',
              'write_bytes(',
              'open(',
              'sentiment',
              'embedding',
              'private_chain_of_thought',
          )
          lowered = source.casefold()
          for token in forbidden_tokens:
              if token.casefold() in lowered:
                  raise SystemExit(f'R157 evaluation-only boundary violated by token: {token}')

          required = (
              'POLICY_VERSION = "R157/v1"',
              'SUBJECT_REF = "coordination/CONTROL-TOWER/idle_signal_scheduler.py#_rank_key"',
              '"evaluation_only": True',
              '"selects_opportunity": False',
              '"releases_task": False',
              '"grants_execution_authority": False',
              '"grants_domain_write": False',
              '"grants_w3_write": False',
              '"grants_merge_authority": False',
              '"tunes_ranking_weights": False',
          )
          for needle in required:
              if needle not in source:
                  raise SystemExit(f'R157 authority declaration missing: {needle}')
          print('R157_EVALUATION_ONLY_BOUNDARY_PASS')
          PY

      - name: Verify whitespace and unfinished markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
          if grep -R -n -E 'TODO|FIXME|NotImplementedError' \
            coordination/CONTROL-TOWER/evals/r157_ranking_calibration.py \
            coordination/CONTROL-TOWER/tests/test_r157_ranking_calibration.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R157; then
            exit 1
          fi
