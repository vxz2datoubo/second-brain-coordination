name: W5 Event Coverage P0 VS1

on:
  pull_request:
    paths:
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/**'
      - '.github/workflows/w5-event-coverage-p0-vs1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install retained-suite dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Exact-head provenance
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 0665cc0147fe7efae7e9498c36f9a87566ad036c HEAD

      - name: Compile runtime
        run: python -m py_compile coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/event_coverage.py

      - name: P0-VS1 adversarial regressions
        run: python -m unittest discover -s coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/tests -p 'test_*.py' -v

      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE')
          schemas = sorted(root.glob('*.schema.json'))
          assert len(schemas) == 3, schemas
          for path in schemas:
              doc = json.loads(path.read_text(encoding='utf-8'))
              assert doc.get('$schema') == 'https://json-schema.org/draft/2020-12/schema'
              assert doc.get('additionalProperties') is False
          print('W5_EVENT_COVERAGE_SCHEMAS_PASS')
          PY

      - name: Authority boundary static gate
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/event_coverage.py')
          spec = importlib.util.spec_from_file_location('event_coverage', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          assert module.AUTHORITY
          assert all(value is False for value in module.AUTHORITY.values())
          assert module.CANONICAL_SOURCE_INSTANCE_AUTHORITY_AVAILABLE is False
          assert module.TYPED_FREE_TEXT_SEMANTIC_AUTHORITY_AVAILABLE is False
          print('W5_EVENT_COVERAGE_AUTHORITY_BOUNDARY_PASS')
          PY

      - name: Current-main integration delta gate
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/w5-main /tmp/w5-integrated
          git worktree add --detach /tmp/w5-main origin/main
          git worktree add --detach /tmp/w5-integrated origin/main

          collect_control_result() {
            local root="$1"; local out="$2"
            (cd "$root" && python - "$out" <<'PY'
          import hashlib
          import json
          import sys
          import unittest
          from pathlib import Path

          output = Path(sys.argv[1])
          suite = unittest.defaultTestLoader.discover('coordination/CONTROL-TOWER/tests', pattern='test_*.py')
          result = unittest.TestResult()
          suite.run(result)

          def fingerprint(kind, test, text):
              normalized = '\n'.join(line.rstrip() for line in text.strip().splitlines())
              return hashlib.sha256((kind + '\n' + test.id() + '\n' + normalized).encode('utf-8')).hexdigest()

          failures = {
              test.id(): {'kind': 'FAIL', 'fingerprint': fingerprint('FAIL', test, text)}
              for test, text in result.failures
          }
          failures.update({
              test.id(): {'kind': 'ERROR', 'fingerprint': fingerprint('ERROR', test, text)}
              for test, text in result.errors
          })
          payload = {
              'testsRun': result.testsRun,
              'failure_count': len(result.failures),
              'error_count': len(result.errors),
              'failures': failures,
          }
          output.write_text(json.dumps(payload, sort_keys=True), encoding='utf-8')
          print(json.dumps(payload, sort_keys=True))
          PY
            )
          }

          collect_control_result /tmp/w5-main /tmp/w5-main.json

          git -C /tmp/w5-integrated -c user.name='R164 CI' -c user.email='r164-ci@example.invalid' \
            merge --no-ff "$HEAD_SHA" -m 'R164 temporary current-main integration'
          test -z "$(git -C /tmp/w5-integrated status --porcelain=v1 --untracked-files=all)"

          (
            cd /tmp/w5-integrated
            python -m py_compile coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/event_coverage.py
            python -m unittest discover \
              -s coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/tests \
              -p 'test_*.py' -v
          )
          collect_control_result /tmp/w5-integrated /tmp/w5-integrated.json

          python - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('/tmp/w5-main.json').read_text(encoding='utf-8'))
          integrated = json.loads(Path('/tmp/w5-integrated.json').read_text(encoding='utf-8'))

          base_failures = base['failures']
          integrated_failures = integrated['failures']
          introduced = sorted(set(integrated_failures) - set(base_failures))
          modified = sorted(
              test_id for test_id in set(base_failures).intersection(integrated_failures)
              if base_failures[test_id] != integrated_failures[test_id]
          )
          improved = sorted(set(base_failures) - set(integrated_failures))

          if introduced:
              raise SystemExit('CANDIDATE_INTRODUCED_FAILURE: ' + repr(introduced))
          if modified:
              raise SystemExit('CANDIDATE_MODIFIED_BASELINE_FAILURE: ' + repr(modified))

          print(
              'W5_CURRENT_MAIN_INTEGRATION_DELTA_PASS '
              f"baseline_failures={len(base_failures)} "
              f"integrated_failures={len(integrated_failures)} "
              f"baseline_improvements={len(improved)} "
              f"base_tests={base['testsRun']} integrated_tests={integrated['testsRun']}"
          )
          PY

      - name: Exact bounded file scope
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/w5-event-coverage-p0-vs1.yml',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/CLAIM-EVIDENCE-LEDGER.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/EVENT-COVERAGE-REPORT.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/PROJECT-PLAN.md',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/SOURCE-REGISTRY.schema.json',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/event_coverage.py',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/W5-EVENT-COVERAGE/tests/test_event_coverage.py',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only','0665cc0147fe7efae7e9498c36f9a87566ad036c...HEAD'], text=True).splitlines())
          actual.discard('')
          if actual != expected:
              raise SystemExit(f'changed-file scope mismatch: {sorted(actual)}')
          print('W5_EVENT_COVERAGE_EXACT_SCOPE_PASS')
          PY

      - name: Whitespace gate
        run: git diff --check 0665cc0147fe7efae7e9498c36f9a87566ad036c...HEAD
