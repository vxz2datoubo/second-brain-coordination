name: Runtime Governance Proof Publisher

on:
  workflow_run:
    workflows: ["Runtime governance root"]
    types: [completed]

permissions:
  actions: read
  pull-requests: read
  statuses: write

jobs:
  publish-live-proof-pointer:
    runs-on: ubuntu-latest
    steps:
      - name: Publish bounded runtime-governance live proof pointer
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          REPO = "vxz2datoubo/second-brain-coordination"
          ROOT_NAME = "Runtime governance root"
          ROOT_PATH = ".github/workflows/runtime-governance-root.yml"
          ROOT_FILENAME = "runtime-governance-root.yml"
          PR_NUMBER = 418
          CONTEXT = "r145/runtime-governance-live-proof"
          SHA40 = re.compile(r"^[0-9a-f]{40}$")
          RUN_BINDING_RE = re.compile(
              r"^R145_LIVE_ROOT pr=(?P<pr>[1-9][0-9]*) "
              r"head=(?P<head>[0-9a-f]{40}) base=(?P<base>[0-9a-f]{40})$"
          )
          FAILURE_CONCLUSIONS = {
              "failure", "timed_out", "cancelled", "action_required",
              "skipped", "neutral", "startup_failure", "stale",
          }

          def _sha(value):
              return value if isinstance(value, str) and SHA40.fullmatch(value) else None

          def _parse_run_binding(value):
              if not isinstance(value, str):
                  return None
              match = RUN_BINDING_RE.fullmatch(value)
              if match is None:
                  return None
              return {
                  "pr": int(match.group("pr")),
                  "head": match.group("head"),
                  "base": match.group("base"),
              }

          def _decision(publish, state, head_sha, target_url, reason, run_id):
              return {
                  "publish": bool(publish),
                  "state": state,
                  "head_sha": head_sha,
                  "target_url": target_url,
                  "context": CONTEXT,
                  "reason": reason,
                  "root_run_id": run_id,
              }

          def _fail(reason, run_id=None):
              return _decision(False, None, None, None, reason, run_id)

          def evaluate_live_proof(event, original, expected, current_pr):
              wr = event.get("workflow_run") if isinstance(event.get("workflow_run"), dict) else {}
              wf = event.get("workflow") if isinstance(event.get("workflow"), dict) else {}
              repo = event.get("repository") if isinstance(event.get("repository"), dict) else {}
              run_id = original.get("id") if isinstance(original.get("id"), int) else None

              if event.get("action") != "completed":
                  return _fail("WORKFLOW_RUN_NOT_COMPLETED_ACTION", run_id)
              if repo.get("full_name") != REPO:
                  return _fail("REPOSITORY_MISMATCH", run_id)
              if wr.get("id") != run_id:
                  return _fail("WORKFLOW_RUN_ID_MISMATCH", run_id)
              if wr.get("name") != ROOT_NAME or original.get("name") != ROOT_NAME:
                  return _fail("WORKFLOW_NAME_MISMATCH", run_id)
              if wr.get("event") != "pull_request_target" or original.get("event") != "pull_request_target":
                  return _fail("WORKFLOW_EVENT_MISMATCH", run_id)
              if wr.get("status") != "completed" or original.get("status") != "completed":
                  return _fail("WORKFLOW_RUN_NOT_COMPLETED", run_id)

              expected_id = expected.get("id")
              if not isinstance(expected_id, int):
                  return _fail("EXPECTED_WORKFLOW_ID_MISSING", run_id)
              if expected.get("name") != ROOT_NAME or expected.get("path") != ROOT_PATH:
                  return _fail("EXPECTED_WORKFLOW_IDENTITY_MISMATCH", run_id)
              if wf.get("id") != expected_id or wr.get("workflow_id") != expected_id or original.get("workflow_id") != expected_id:
                  return _fail("WORKFLOW_ID_MISMATCH", run_id)
              if wf.get("path") != ROOT_PATH:
                  return _fail("WORKFLOW_PATH_MISMATCH", run_id)
              original_path = original.get("path")
              if not isinstance(original_path, str) or original_path.split("@", 1)[0] != ROOT_PATH:
                  return _fail("WORKFLOW_RUN_PATH_MISMATCH", run_id)
              if original.get("id") != run_id:
                  return _fail("ORIGINAL_RUN_IDENTITY_MISMATCH", run_id)

              original_repo = original.get("repository") if isinstance(original.get("repository"), dict) else {}
              if original_repo.get("full_name") != REPO:
                  return _fail("ORIGINAL_RUN_REPOSITORY_MISMATCH", run_id)

              event_title = wr.get("display_title")
              original_title = original.get("display_title")
              if event_title != original_title:
                  return _fail("WORKFLOW_RUN_DISPLAY_TITLE_MISMATCH", run_id)
              run_binding = _parse_run_binding(original_title)
              if run_binding is None:
                  return _fail("RUN_NAME_BINDING_MALFORMED", run_id)
              if run_binding["pr"] != PR_NUMBER:
                  return _fail("PR_NUMBER_MISMATCH", run_id)
              head_sha = _sha(run_binding["head"])
              base_sha = _sha(run_binding["base"])
              if head_sha is None:
                  return _fail("BOUND_HEAD_SHA_MISSING", run_id)
              if base_sha is None:
                  return _fail("BOUND_BASE_SHA_MISSING", run_id)

              rest_bindings = original.get("pull_requests")
              if not isinstance(rest_bindings, list):
                  return _fail("REST_PR_BINDINGS_MALFORMED", run_id)
              if len(rest_bindings) > 1:
                  return _fail("REST_PR_BINDING_AMBIGUOUS", run_id)
              if len(rest_bindings) == 1:
                  rest_binding = rest_bindings[0] if isinstance(rest_bindings[0], dict) else {}
                  rest_head = rest_binding.get("head") if isinstance(rest_binding.get("head"), dict) else {}
                  rest_base = rest_binding.get("base") if isinstance(rest_binding.get("base"), dict) else {}
                  rest_head_sha = _sha(rest_head.get("sha"))
                  rest_base_sha = _sha(rest_base.get("sha"))
                  if rest_binding.get("number") != PR_NUMBER or rest_head_sha is None or rest_base_sha is None:
                      return _fail("REST_PR_BINDING_MALFORMED", run_id)
                  if (
                      rest_binding.get("number") != run_binding["pr"]
                      or rest_head_sha != head_sha
                      or rest_base_sha != base_sha
                  ):
                      return _fail("REST_PR_BINDING_MISMATCH", run_id)

              target_url = original.get("html_url")
              expected_url = f"https://github.com/{REPO}/actions/runs/{run_id}"
              if target_url != expected_url:
                  return _fail("ROOT_RUN_TARGET_URL_MISMATCH", run_id)

              current_head = current_pr.get("head") if isinstance(current_pr.get("head"), dict) else {}
              current_base = current_pr.get("base") if isinstance(current_pr.get("base"), dict) else {}
              if current_pr.get("number") != PR_NUMBER:
                  return _decision(True, "error", head_sha, target_url, "CURRENT_PR_IDENTITY_MISMATCH", run_id)
              if current_head.get("sha") != head_sha or current_base.get("sha") != base_sha:
                  return _decision(True, "error", head_sha, target_url, "STALE_ROOT_RUN_FOR_OLDER_PR_HEAD", run_id)

              conclusion = original.get("conclusion")
              if wr.get("conclusion") != conclusion:
                  return _decision(True, "error", head_sha, target_url, "WORKFLOW_CONCLUSION_MISMATCH", run_id)
              if conclusion == "success":
                  return _decision(True, "success", head_sha, target_url, "ROOT_RUN_SUCCESS", run_id)
              if conclusion in FAILURE_CONCLUSIONS:
                  return _decision(True, "failure", head_sha, target_url, f"ROOT_RUN_{str(conclusion).upper()}", run_id)
              return _decision(True, "error", head_sha, target_url, "ROOT_RUN_CONCLUSION_UNKNOWN", run_id)

          def request_json(method, path, body=None):
              token = os.environ.get("GITHUB_TOKEN", "")
              if not token:
                  raise SystemExit("PUBLISHER_TOKEN_MISSING")
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "r145-runtime-governance-proof-publisher",
              }
              url = f"https://api.github.com{path}"
              data = None if body is None else json.dumps(body, sort_keys=True).encode("utf-8")
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"GITHUB_API_HTTP_{exc.code}:{path}:{detail[:300]}") from exc

          def main():
              event_path = os.environ.get("GITHUB_EVENT_PATH", "")
              if not event_path:
                  raise SystemExit("PUBLISHER_EVENT_PATH_MISSING")
              with open(event_path, "r", encoding="utf-8") as handle:
                  event = json.load(handle)

              wr = event.get("workflow_run") if isinstance(event.get("workflow_run"), dict) else {}
              run_id = wr.get("id")
              if not isinstance(run_id, int):
                  print(json.dumps({"publisher": "FAIL_CLOSED", "reason": "WORKFLOW_RUN_ID_MISSING", "run_id": run_id}, sort_keys=True))
                  raise SystemExit(2)

              expected = request_json("GET", f"/repos/{REPO}/actions/workflows/{ROOT_FILENAME}")
              original = request_json("GET", f"/repos/{REPO}/actions/runs/{run_id}?exclude_pull_requests=false")
              current_pr = request_json("GET", f"/repos/{REPO}/pulls/{PR_NUMBER}")
              decision = evaluate_live_proof(event, original, expected, current_pr)

              if not decision["publish"]:
                  print(json.dumps({"publisher": "FAIL_CLOSED", "reason": decision["reason"], "run_id": decision["root_run_id"]}, sort_keys=True))
                  raise SystemExit(2)

              payload = {
                  "state": decision["state"],
                  "target_url": decision["target_url"],
                  "description": f'{decision["reason"]}; root run {decision["root_run_id"]}'[:140],
                  "context": decision["context"],
              }
              request_json("POST", f'/repos/{REPO}/statuses/{decision["head_sha"]}', payload)
              print(json.dumps({
                  "publisher": "STATUS_PUBLISHED",
                  "state": decision["state"],
                  "context": decision["context"],
                  "head_sha": decision["head_sha"],
                  "root_run_id": decision["root_run_id"],
                  "target_url": decision["target_url"],
                  "reason": decision["reason"],
                  "acceptance_authority": False,
              }, sort_keys=True))

              if decision["state"] == "error":
                  raise SystemExit(2)

          if __name__ == "__main__":
              main()
          PY
