name: R171 Interactive Film V2 Continuation

on:
  pull_request:
    paths:
      - "creative_runtime/**"
      - "apps/cli/**"
      - "tests/**"
      - "coordination/PROGRAMS/REALTIME-INTERACTIVE-FILM-GAME-0002/V2-CONTINUATION-R171/**"
      - ".github/workflows/r171-interactive-film-v2-continuation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head:
    name: Python ${{ matrix.python }} R171 exact head
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install retained test dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Assert exact head
        if: ${{ github.event_name == 'pull_request' }}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Compile R171 runtime and tests
        run: >-
          python -m py_compile
          creative_runtime/ledger.py
          creative_runtime/continuation.py
          apps/cli/creativectl.py
          tests/test_r171_continuation.py

      - name: Enforce single persisted v2 session authority
        run: |
          python - <<'PY'
          from pathlib import Path
          from creative_runtime import continuation

          assert continuation.SCHEMA == 'CreativeSession/v2'
          runtime_text = '\n'.join(
              Path(path).read_text(encoding='utf-8')
              for path in ('creative_runtime/continuation.py', 'apps/cli/creativectl.py')
          )
          forbidden = 'CreativeSession/' + 'v2-' + 'continuation'
          assert forbidden not in runtime_text, 'parallel continuation schema survived remediation'
          print('R171_SINGLE_V2_SESSION_AUTHORITY_PASS')
          PY

      - name: Run focused R171 adversarial suite
        run: python -m unittest discover -s tests -p 'test_r171_continuation.py' -v

      - name: Run full retained creative suite
        run: python -m unittest discover -s tests -v

      - name: Exact bounded R171 scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          IMPLEMENTATION_BASELINE: 5574ebf4287691aed3f5789e895bb5c55451f209
        run: |
          python - <<'PY'
          import os
          import subprocess

          expected = {
              '.github/workflows/r171-interactive-film-v2-continuation.yml',
              'apps/cli/creativectl.py',
              'coordination/PROGRAMS/REALTIME-INTERACTIVE-FILM-GAME-0002/V2-CONTINUATION-R171/AI_HANDOFF.yaml',
              'creative_runtime/continuation.py',
              'creative_runtime/ledger.py',
              'tests/test_r171_continuation.py',
          }
          base = os.environ['IMPLEMENTATION_BASELINE']
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True
              ).splitlines()
          )
          actual.discard('')
          if actual != expected:
              raise SystemExit(f'R171 changed-file scope mismatch: {sorted(actual)}')
          print('R171_EXACT_SIX_FILE_SCOPE_PASS')
          PY

      - name: Candidate whitespace gate
        if: ${{ github.event_name == 'pull_request' }}
        env:
          IMPLEMENTATION_BASELINE: 5574ebf4287691aed3f5789e895bb5c55451f209
        run: git diff --check "$IMPLEMENTATION_BASELINE"...HEAD

      - name: Fresh current-main integration proof
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN_START="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          CANDIDATE_START="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test -n "$MAIN_START"
          test "$CANDIDATE_START" = "$HEAD_SHA"

          WT="/tmp/r171-integrated-${GITHUB_RUN_ID}-${{ matrix.python }}"
          rm -rf "$WT"
          cleanup() {
            git worktree remove --force "$WT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$WT" "$MAIN_START"
          git -C "$WT" \
            -c user.name='R171 CI' \
            -c user.email='r171-ci@example.invalid' \
            merge --no-ff "$HEAD_SHA" -m 'R171 temporary current-main integration'
          test "$(git -C "$WT" rev-parse HEAD^1)" = "$MAIN_START"
          test "$(git -C "$WT" rev-parse HEAD^2)" = "$HEAD_SHA"
          test -z "$(git -C "$WT" status --porcelain=v1 --untracked-files=all)"

          (
            cd "$WT"
            python -m py_compile creative_runtime/ledger.py creative_runtime/continuation.py apps/cli/creativectl.py tests/test_r171_continuation.py
            python -m unittest discover -s tests -p 'test_r171_continuation.py' -v
          )

          MAIN_END="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          CANDIDATE_END="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test "$MAIN_END" = "$MAIN_START"
          test "$CANDIDATE_END" = "$HEAD_SHA"
          echo "R171_CURRENT_MAIN_INTEGRATION_PASS main=$MAIN_START candidate=$HEAD_SHA"
