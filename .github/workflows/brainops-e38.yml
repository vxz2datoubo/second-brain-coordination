name: BrainOps E38 trusted authority exact head

"on":
  pull_request:
    paths:
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/**"
      - ".github/workflows/brainops-e38.yml"

permissions:
  contents: read

jobs:
  test-exact-pr-head:
    name: Python ${{ matrix.python-version }} exact PR head
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact pull-request head checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          PYTHONPATH=coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/src
          python -m brainops_control_plane.ci_identity "$EXPECTED_HEAD"
      - name: Run BrainOps E35 through E38 tests
        run: >-
          python -m unittest discover -s
          coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/tests
          -v
      - name: Compile control-plane sources
        run: >-
          python -c "import pathlib, py_compile;
          [py_compile.compile(str(path), doraise=True) for path in
          pathlib.Path('coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/src/brainops_control_plane').glob('*.py')]"
