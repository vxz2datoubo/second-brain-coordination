name: Global Signal Plane S0C

on:
  pull_request:
    paths:
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/**'
      - '.github/workflows/global-signal-plane-s0.yml'
  push:
    branches: ['codex/global-signal-plane-s0c-enterprise-r134']

jobs:
  s0c-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run S0C unit and enterprise scenario tests
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run public safety scan
        working-directory: coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC
        run: python public_safety_scan.py
      - name: Validate fixtures and diff format
        run: |
          python -c "import json; json.load(open('coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0-SYNTHETIC/fixtures/gst_scenarios.json', encoding='utf-8')); print('FIXTURE_JSON_PASS')"
          git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
