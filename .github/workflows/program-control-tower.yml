name: Program Control Tower foundation

on:
  pull_request:
    paths:
      - ".github/workflows/program-control-tower.yml"
      - ".github/workflows/r145-final-active-gate.yml"
      - ".github/workflows/runtime-governance-root.yml"
      - ".github/workflows/runtime-governance-proof-publisher.yml"
      - "coordination/ACTIVE-PROGRAM-LANES.yaml"
      - "coordination/ACTIVE-CODEX-TASK.yaml"
      - "coordination/ACTIVE-QCLAW-TASK.yaml"
      - "coordination/ACTIVE-WORKBUDDY-TASK.yaml"
      - "coordination/ACTIVE-GPT-ENGINEERING-WORKERS.yaml"
      - "coordination/PROGRAM-CONTROL-TOWER.md"
      - "coordination/CONTROL-TOWER/**"
      - "coordination/PROPOSALS/PROGRAM-LANES/**"
      - "coordination/GOVERNANCE/AI-SYSTEM-PARALLEL-PROGRAM-CONTROL-TOWER-PROTOCOL-v1.0.yaml"
      - "coordination/SKILLS/AI-SYSTEM-PARALLEL-PROGRAM-CONTROL-TOWER-SKILL-v1.0.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-tower:
    name: Python ${{ matrix.python-version }} control-tower
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Compile CI-isolation helper
        working-directory: coordination/CONTROL-TOWER
        run: python -m py_compile integration_state_isolation.py tests/test_integration_state_isolation.py
      - name: Run CI-isolation focused regressions absolutely
        working-directory: coordination/CONTROL-TOWER
        run: python -m unittest discover -s tests -p 'test_integration_state_isolation.py' -v
      - name: Prove current-main versus exact-candidate Control Tower delta
        if: ${{ github.event_name == 'pull_request' }}
        working-directory: coordination/CONTROL-TOWER
        env:
          CANDIDATE_BRANCH: ${{ github.head_ref }}
        run: |
          python integration_state_isolation.py proof \
            --repo-root ../.. \
            --candidate-branch "$CANDIDATE_BRANCH" \
            --test-dir coordination/CONTROL-TOWER/tests \
            --output /tmp/control-tower-integration-state-receipt.json
          python -m json.tool /tmp/control-tower-integration-state-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('/tmp/control-tower-integration-state-receipt.json').read_text())
          assert receipt['classification'] == 'PASS_NO_CANDIDATE_REGRESSION', receipt
          assert receipt['baseline_declared_healthy'] is False
          assert receipt['authority'] and all(value is False for value in receipt['authority'].values())
          assert not receipt['candidate_introduced_command_failures'], receipt
          assert not receipt['candidate_modified_baseline_command_failures'], receipt
          print('integration_state_isolation=PASS')
          print('baseline_failures_preserved=', len(receipt['baseline_failures_preserved']))
          print('baseline_command_failures_preserved=', len(receipt['baseline_command_failures_preserved']))
          print('candidate_only_tests=', len(receipt['candidate_only_test_ids']))
          print('command_observations=', len(receipt['per_command_observations']))
          print('receipt_digest=', receipt['receipt_digest'])
          PY
      - name: Verify candidate diff whitespace
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git fetch --no-tags origin main
          BASE="$(git merge-base origin/main HEAD)"
          git diff --check "$BASE"...HEAD
      - name: Run full retained suite on workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: coordination/CONTROL-TOWER
        run: python run_all_tests.py
      - name: Reconcile current canonical control-plane state
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: coordination/CONTROL-TOWER
        run: python run_control_tower.py check --repo-root ../..
      - name: Validate Program Lane work claims
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: coordination/CONTROL-TOWER
        run: python run_lane_claims.py --repo-root ../..
      - name: Verify work-claim bulletin projection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: coordination/CONTROL-TOWER
        run: python run_claim_projection.py check --repo-root ../..
      - name: Verify durable authorization witness round trips
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: coordination/CONTROL-TOWER
        run: |
          python run_authorization_witness.py create --repo-root ../.. --lane LANE-C-SECOND-BRAIN-GPT-COGNITIVE-CLOSED-LOOP > /tmp/control-tower-lane-c-witness.json
          python run_authorization_witness.py verify --repo-root ../.. --lane LANE-C-SECOND-BRAIN-GPT-COGNITIVE-CLOSED-LOOP --witness-file /tmp/control-tower-lane-c-witness.json
          python run_authorization_witness.py create --repo-root ../.. --lane LANE-B-A-SHARE-REMEDIATION > /tmp/control-tower-lane-b-witness.json
          python run_authorization_witness.py verify --repo-root ../.. --lane LANE-B-A-SHARE-REMEDIATION --witness-file /tmp/control-tower-lane-b-witness.json
      - name: Emit Codex route witness
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: coordination/CONTROL-TOWER
        run: python run_control_tower.py witness --repo-root ../.. --agent CODEX
