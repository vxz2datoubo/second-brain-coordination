name: Program Control Tower R151 Idle Signal Auto Release

on:
  pull_request:
    paths:
      - 'coordination/CONTROL-TOWER/idle_signal_scheduler.py'
      - 'coordination/CONTROL-TOWER/tests/test_idle_signal_scheduler.py'
      - 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R151/**'
      - '.github/workflows/program-control-tower-r151-idle-signal-auto-release.yml'

permissions:
  contents: read

jobs:
  r151-idle-signal-auto-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assert exact PR head and fresh current main
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          PR_HEAD="${{ github.event.pull_request.head.sha }}"
          test "$HEAD_SHA" = "$PR_HEAD"
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          CURRENT_MAIN="$(git rev-parse refs/remotes/origin/main)"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          test "${{ github.event.pull_request.base.ref }}" = "main"
          test "$BASE_SHA" = "$CURRENT_MAIN"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          echo "R151_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "R151_CURRENT_MAIN_SHA=$CURRENT_MAIN" >> "$GITHUB_ENV"
          printf 'HEAD=%s\nPR_HEAD=%s\nEVENT_BASE=%s\nCURRENT_MAIN=%s\n' "$HEAD_SHA" "$PR_HEAD" "$BASE_SHA" "$CURRENT_MAIN"

      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'

      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run R151 idle Signal scheduler adversarial regressions
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_idle_signal_scheduler.py' -v

      - name: Run retained R150 trusted-release regressions
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_trusted_task_release.py' -v

      - name: Run retained R149 impact/composition regressions
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_task_release_impact.py' -v

      - name: Run retained full Control Tower suite
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate R151 authorization schema and authority boundary
        working-directory: coordination/CONTROL-TOWER
        env:
          PYTHONPATH: '.:../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/S0E-EXPLICIT-INTAKE-ADAPTIVE-GATEWAY/src'
          PYTHONDONTWRITEBYTECODE: '1'
          R151_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import idle_signal_scheduler as r151

          schema_path = Path('../PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R151/IDLE-SIGNAL-AUTO-RELEASE-AUTHORIZATION.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f"{os.environ['R151_BASE_SHA']}...HEAD"],
              text=True,
              cwd='../..',
          ).splitlines()
          r158_marker = 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/TRUSTED-OPPORTUNITY-PROVENANCE.schema.json'
          historical_const = schema['properties']['schema_version']['const']
          if r158_marker in changed:
              assert historical_const == 'IdleSignalAutoReleaseAuthorization/v1'
              assert r151.AUTHORIZATION_SCHEMA == 'IdleSignalAutoReleaseAuthorization/v2'
              print('R151_R158_SUCCESSOR_SCHEMA_PASS')
          else:
              assert historical_const == r151.AUTHORIZATION_SCHEMA
              print('R151_AUTHORIZATION_SCHEMA_PASS')
          authority = schema['properties']['authority']['properties']
          assert authority['signal_self_authorizes']['const'] is False
          assert authority['can_create_issue']['const'] is True
          assert authority['can_begin_bounded_engineering']['const'] is True
          assert authority['can_merge_without_independent_accept']['const'] is False
          assert authority['can_deploy_production']['const'] is False
          assert authority['can_expand_permissions_or_secrets']['const'] is False
          assert authority['can_touch_trading_orders_or_funds']['const'] is False
          assert authority['can_perform_destructive_history_rewrite']['const'] is False
          print('SIGNAL_SELF_AUTHORITY=false')
          print('INDEPENDENT_REVIEW_REQUIRED=true')
          PY

      - name: Scope, authority and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          export BASE="${{ github.event.pull_request.base.sha }}"
          python - <<'PY'
          import os, subprocess
          base = os.environ['BASE']
          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines()
          r158_marker = 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/TRUSTED-OPPORTUNITY-PROVENANCE.schema.json'
          r158_exact = {
              '.github/workflows/program-control-tower-r151-idle-signal-auto-release.yml',
              '.github/workflows/program-control-tower-r152-idle-signal-apply.yml',
              '.github/workflows/program-control-tower-r158-trusted-opportunity-provenance.yml',
              'coordination/CONTROL-TOWER/idle_signal_scheduler.py',
              'coordination/CONTROL-TOWER/idle_signal_apply.py',
              'coordination/CONTROL-TOWER/tests/test_idle_signal_scheduler.py',
              'coordination/CONTROL-TOWER/tests/test_idle_signal_apply.py',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R158/PROJECT-PLAN.md',
              r158_marker,
          }
          if r158_marker in changed:
              if len(changed) != 9 or set(changed) != r158_exact:
                  raise SystemExit(f'R151_R158_SUCCESSOR_SCOPE_FAIL:{changed}')
              print('R151_R158_SUCCESSOR_SCOPE_PASS')
          else:
              allowed_exact = {
                  'coordination/CONTROL-TOWER/idle_signal_scheduler.py',
                  'coordination/CONTROL-TOWER/tests/test_idle_signal_scheduler.py',
                  '.github/workflows/program-control-tower-r151-idle-signal-auto-release.yml',
              }
              allowed_prefix = 'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R151/'
              outside = [path for path in changed if path not in allowed_exact and not path.startswith(allowed_prefix)]
              if outside:
                  raise SystemExit(f'R151_SCOPE_FAIL:{outside}')
              print('R151_SCOPE_PASS')
          forbidden_prefixes = (
              'coordination/ACTIVE-',
              'coordination/ROUTES/',
              'coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/GLOBAL-SIGNAL-PLANE/',
          )
          forbidden = [path for path in changed if path.startswith(forbidden_prefixes)]
          if forbidden:
              raise SystemExit(f'R151_AUTHORITY_BOUNDARY_FAIL:{forbidden}')
          print('NO_ACTIVE_ROUTE_CLAIM_WORKER_MUTATION=true')
          print('NO_SIGNAL_TOWER_RUNTIME_MUTATION=true')
          print('NO_SECOND_TASK_OR_SIGNAL_AUTHORITY=true')
          PY
          git diff --check "$BASE...HEAD"
          if grep -InE '\b(TODO|FIXME)\b|NotImplementedError' \
            coordination/CONTROL-TOWER/idle_signal_scheduler.py \
            coordination/CONTROL-TOWER/tests/test_idle_signal_scheduler.py \
            coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CONTROL-TOWER/R151 2>/dev/null; then
            exit 1
          fi
