provider_specific_v2:
  status: "AUTHORIZED_READ_ONLY_DESIGN_ONLY"
  purpose: >-
    Turn the abstract authority-family package into one provider-specific minimum-complexity recommendation that the user can actually understand and approve or defer, without changing any repository or cloud control plane.
  configuration_changes_authorized: false
  cloud_account_creation_authorized: false
  billing_enablement_authorized: false
  repository_settings_changes_authorized: false
  environment_or_ruleset_changes_authorized: false
  oidc_setting_changes_authorized: false
  github_app_changes_authorized: false
  secrets_or_keys_creation_authorized: false
  formal_write_authorized: false
  mandatory_designs:
    aws_a1:
      name: "AWS serverless external human-preapproval authority"
      required_model:
        - "GitHub Actions OIDC assumes a requester role restricted to the exact repository/ref/workflow/audience/immutable identity policy."
        - "Requester role may invoke only the issuer function/API; it cannot create approval records, mutate arbitrary ledger state, call KMS Sign, deploy issuer code, or alter IAM/KMS/Lambda/DynamoDB policy."
        - "A separate human AWS control identity/session with MFA, unavailable to Codex/QCLAW/ordinary caller, creates the approved candidate digest/scope record."
        - "Issuer Lambda/function validates the request, conditionally consumes the pre-approved single-use record in DynamoDB, and signs the exact grant with an asymmetric KMS key."
        - "Model fail-closed crash/retry/idempotency behavior and grant replay prevention."
      required_cost_check:
        - "Use current official AWS pricing and state region/account assumptions."
        - "Check current KMS key monthly charge, Sign operation charge, Lambda free tier, DynamoDB free tier, logging/network extras if any."
    gcp_a2:
      name: "Google Cloud serverless external human-preapproval authority"
      required_model:
        - "GitHub OIDC uses Workload Identity Federation with repository/workflow/ref conditions to obtain an invoker-only principal."
        - "GitHub workload may invoke only the issuer service; it cannot create approvals, deploy issuer code, alter IAM/KMS policy, or sign directly."
        - "A separate human Google Cloud control identity/session with MFA, unavailable to agents, creates the approved digest/scope record."
        - "Cloud Run/Function issuer conditionally consumes Firestore/transactional approval state and signs the exact grant with Cloud KMS."
        - "Model fail-closed crash/retry/idempotency behavior and grant replay prevention."
      required_cost_check:
        - "Use current official Google Cloud pricing and state region/account assumptions."
        - "Check software KMS key-version monthly charge, crypto operations, Cloud Run/Functions free quota, Firestore free quota, billing prerequisite and any hidden baseline cost."
    github_app_b:
      name: "Independent GitHub App/custom deployment protection"
      requirement: "Keep as a comparison; quantify App registration, private-key lifecycle, hosting, webhook validation, ledger and operational burden."
    no_change_c:
      name: "Defer production authority"
      requirement: "Keep E47/E48 candidate/derived operation available and formal persistence fail-closed."
  required_reasoning:
    - "Explicitly test whether a second GitHub reviewer identity is truly required. A human-controlled external cloud approval identity may be the independent authorization boundary while GitHub environment review remains defense-in-depth."
    - "Do not allow the GitHub workload identity to possess the capability to mint approvals or signatures directly; otherwise the ordinary caller can self-issue."
    - "Use immutable repository/workflow identifiers where supported and bind exact candidate full digests, scope, target, expiry and nonce/grant ID."
    - "Separate provenance evidence (GitHub/Sigstore attestations) from authorization. Attestations may supplement but cannot replace the external approval/single-use authority."
    - "Compare new-account burden, billing/card requirement, MFA/manual approval burden, monthly cost at expected tiny volume, setup difficulty, maintenance, rollback and vendor lock-in."
  w3_formal_store_boundary:
    canonical_evidence:
      - "PHASE-0/ENTERPRISE-TARGET-ARCHITECTURE.md: authority plane includes future private Git knowledge."
      - "PHASE-0/SYSTEM-OF-RECORD-MATRIX.yaml: approved knowledge authority = future private Git knowledge repository; Supabase/local serving = rebuildable projection."
    requirement: >-
      Do not treat ProductionCertificationGrant issuance as equivalent to a completed formal knowledge write. State exactly whether E61 v2 only establishes certification authority or also binds the future private-Git authority write path.
    allowed_outcomes:
      - "If end-to-end private-Git write binding can be designed without configuration, include the bounded design and later implementation gate."
      - "If it is a separate implementation concern, explicitly propose a follow-on gate/task such as FORMAL_PRIVATE_GIT_WRITE_PATH_BINDING and keep formal persistence disabled until both certification and write-path binding are accepted."
  user_decision_output:
    target: "ONE_RECOMMENDED_PROVIDER_SPECIFIC_ARCHITECTURE"
    must_include:
      - "why it satisfies non-self-issuance"
      - "whether a second GitHub account/reviewer is required"
      - "exact new account/billing prerequisite"
      - "estimated low-volume monthly cost with official-source basis"
      - "initial manual setup steps understandable to a non-specialist"
      - "what Codex can automate after approval and what user must personally approve/do"
      - "revocation/rollback"
      - "what remains blocked even after this stage"
    final_choice_format: "APPROVE_RECOMMENDED_ARCHITECTURE | DEFER_AND_REMAIN_CANDIDATE_ONLY"
  deliverable: "E61-PROVIDER-SPECIFIC-MINIMUM-AUTHORITY-V2-USER-DECISION-PACKAGE"
