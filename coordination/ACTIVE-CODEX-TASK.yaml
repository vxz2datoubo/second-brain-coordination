    - "Do not enumerate child files/directories."
    - "Do not open/read DailyMemoryCandidate-v2 or any private file content."
    - "Do not read or publish ACL entries in epoch 96."

filesystem_type_attestation:
  mutation_budget: 0
  local_drive_methods:
    - method: "DOTNET_DRIVEINFO"
      rule: "Use System.IO.DriveInfo on the derived volume root and read DriveFormat only."
    - method: "GET_VOLUME"
      rule: >-
        If Get-Volume is available, derive the drive-letter character locally from the volume root and read only FileSystemType. Do not print
        the drive letter, volume object, label, unique id, path or serial. Method absence/failure is recorded only as a redacted method failure.
    - method: "CIM_LOGICAL_DISK"
      rule: >-
        If Get-CimInstance is available, query only Win32_LogicalDisk for the exact derived local device id and read only FileSystem. Do not
        print device id, caption, volume name, serial, path or any other property.
  nonlocal_rule: >-
    If root volume kind is UNC or OTHER, do not guess filesystem type and do not broaden discovery; return NONLOCAL_VOLUME_METHOD_NOT_AUTHORIZED
    for GPT review.
  normalization:
    public_values: ["NTFS", "REFS", "EXFAT", "FAT32", "FAT", "OTHER", "UNKNOWN"]
    rule: >-
      Normalize successful method values case-insensitively. If at least one method succeeds and all successful methods agree, accept that
      normalized filesystem type. If successful methods disagree, return UNKNOWN with FILESYSTEM_TYPE_METHOD_CONFLICT. If all fail, return
      UNKNOWN with FILESYSTEM_TYPE_ALL_METHODS_FAILED. Do not expose raw errors.
  persistent_acl_support_rule: >-
    NTFS or REFS => SUPPORTED. EXFAT, FAT32 or FAT => UNSUPPORTED. OTHER or UNKNOWN => UNKNOWN.
  reparse_check: >-
    Independently read only exact-root FileAttributes and test ReparsePoint. Report YES/NO. A failure here must not erase an already-established
    filesystem type; report UNKNOWN plus a separate redacted issue.

