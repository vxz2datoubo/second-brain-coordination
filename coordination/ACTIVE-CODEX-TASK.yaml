review_disposition:
  classification: "E17_ATOMIC_SETTLEMENT_ACCEPTED_AS_BASE_GATE_A_FAILS_FAIL_CLOSED_EPISODE_COMPOSABILITY"
  accepted_and_frozen_as_useful_base:
    - "E17 tested commit a1a4aa2b31c137e65d687ca50e571c6f52e62579 is exactly one substantive commit after the E17 reviewed base."
    - "E17 receipt commit 9c3bc2c6797c68a457b28cf2f28d4da1680e626d is exactly one receipt-only commit after the tested head."
    - "The substantive delta is limited to d2_game_core.py and tests/test_d2_game_core.py; the receipt delta is limited to E17-GATE-A-R2-RECEIPT.md."
    - "76 focused tests, three clean Git-archive runs, deterministic output and Python 3.11/3.13 CI are accepted as evidence."
    - "Structurally valid peer pairs now preflight both legs over one shared pre-state and commit or abort without one-legged inventory mutation."
    - "E17 one-legged causal-parent and resource/lifecycle exploits, paired identity reservation, zero external flow and complementary delta proof are accepted as the new base."
  blocking_findings:
    - id: "E18-B01-PUBLIC-API-RETURNS-UNVERIFIABLE-EPISODE"
      severity: "BLOCKER"
      finding: >-
        _validate_peer_transfer_pairs marks a lone or malformed peer declaration invalid and arbitrate emits deterministic zero-fill BLOCKED events.
        _peer_group_invariant_reasons independently adds PEER_GROUP_INCOMPLETE_RECIPROCAL_MEMBERSHIP or PEER_GROUP_INVALID_RECIPROCAL_ACTIONS,
        so verify_episode_ledger rejects the exact EpisodeState returned by the public API.
    - id: "E18-B02-FAIL-CLOSED-AND-FORGERY-STATES-CONFLATED"
      severity: "BLOCKER"
      finding: >-
        The verifier does not distinguish an honestly malformed declaration that was safely rejected from a forged history where a member or event
        was deleted from an originally valid pair. Both are represented as incomplete membership even though their immutable action registries and
        expected terminal semantics differ.
    - id: "E18-B03-BLOCKED-EPISODE-NOT-COMPOSABLE"
      severity: "BLOCKER"
      finding: >-
        Because _arbitrate_internal verifies prior_episode_state before continuing, a malformed peer declaration can permanently stop the episode chain
        with UNVERIFIABLE_PRIOR_EPISODE_STATE despite producing no inventory, resource or external-flow mutation.
    - id: "E18-B04-E17-COMMENT-CONTRACT-CONTRADICTION"
      severity: "MAJOR"
      finding: >-
        _valid_peer_pair_map states malformed declarations remain ordinary fail-closed actions, but the canonical verifier treats those generated
        fail-closed episodes as invalid. The public disposition contract must select one coherent behavior before Evaluation V2 begins.
  preserved_unknowns:
    - id: "ROOT-CAPSULE-ORIGIN-AUTHENTICATION"
      disposition: "DOWNSTREAM_TRUST_ANCHOR_REQUIRED_NOT_A_GATE_A_COMPOSABILITY_BLOCKER"
      finding: >-
        Internal reconstruction does not authenticate a wholly replaced root capsule with an external signature, trusted timestamp or canonical publication.
    - id: "ATOMIC-PEER-RESOURCE-EFFECTS"
      disposition: "NOT_IMPLEMENTED_YET_FAIL_CLOSED_PRESERVE_FOR_SEPARATE_GATE"
      finding: "Peer CLAIM/RELEASE/EXPIRE effects remain prohibited before mutation and are not part of E18."
  decision:
    e17_atomic_settlement_repairs: "ACCEPTED_AS_NEW_BASE"
    gate_a_overall: "NOT_ACCEPTED"
    gate_b: "FROZEN"
    gate_c: "FROZEN"
