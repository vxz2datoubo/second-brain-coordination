  read_only_fallback_required_when_fetch_write_fails:
    step_1_remote_head: >-
      Run `git ls-remote https://github.com/vxz2datoubo/second-brain-coordination.git refs/heads/main` and parse the one exact
      40-hex SHA for refs/heads/main. This command must not update local refs or write fetched objects.
    step_2_exact_sha_control: >-
      Retrieve only `coordination/ACTIVE-CODEX-TASK.yaml` over HTTPS from
      `https://raw.githubusercontent.com/vxz2datoubo/second-brain-coordination/<REMOTE_MAIN_SHA>/coordination/ACTIVE-CODEX-TASK.yaml`,
      where <REMOTE_MAIN_SHA> is exactly the SHA returned by step 1. Do not read the mutable `main` raw URL without pinning the SHA.
    step_3_validation: >-
      Require repository vxz2datoubo/second-brain-coordination, task_id CODEX-CLTM-0021-PRIVATE-STORE-WRITABILITY-DIAGNOSTIC,
      route_epoch 91, status READY, execution_allowed true, and all epoch-91 private/formal/live/production/trading locks intact.
    step_4_fail_closed: >-
      If ls-remote fails, returns ambiguity, HTTPS exact-SHA retrieval fails, or the exact-SHA control differs materially, stop before
      reading CLTM_PRIVATE_DATA_ROOT or performing any diagnostic write.
  local_git_mutation_forbidden_in_fallback:
