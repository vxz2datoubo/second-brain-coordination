task_impact_forecast:
  fundamental_goal: >-
    Convert the current D2 scaffold into a genuinely stateful, deterministic and auditable multi-agent synthetic game system whose
    participant states, interactions, evaluation evidence and candidate-knowledge boundary are coherent enough for later research calibration.
  expected_positive_effects:
    - "Independent per-agent state eliminates false multi-agent claims and enables real interaction semantics."
    - "State-carrying episodes and semantic invariants improve defect detection and future calibration readiness."
    - "A strict quarantine port allows schema compatibility work without importing QCLAW claims as facts."
    - "A larger autonomous mission reduces repeated micro-remediation cycles."
  expected_negative_effects:
    - "Refactoring core state may invalidate existing fixture hashes and require explicit migration receipts."
    - "More meaningful scenarios and invariants increase implementation and review cost."
    - "Multiple stacked PRs raise coordination complexity if boundaries are not kept clean."
  risk_gates:
    - "No state from one synthetic agent may silently mutate another agent's portfolio."
    - "No test-count padding: every invariant must have a unique requirement and failure oracle."
    - "No candidate claim may enter runtime state as fact, probability, identity or signal."
    - "No D1, D0, QCLAW, WorkBuddy or accepted frozen branch may be edited."
  stop_conditions:
    - "Real market data, replay, backtest, performance claim, identity, account, order routing or trade becomes necessary."
    - "A required change falls outside authorized D2 paths or conflicts with another active owner."
    - "Deterministic evidence cannot be reproduced from clean Git extraction."
    - "Current route becomes stale or Issue #92 is implicitly required."
  required_observations:
    - "Per-agent pre/post state hashes and total-system conservation evidence."
    - "Cross-agent conflict, resource contention, abstention and causal-ledger behavior."
    - "Invariant-to-test mapping and mutation/failure-injection sensitivity."
    - "Three-run deterministic hashes and resource-cost measurements."
    - "Proactive improvements, rejected alternatives and remaining UNKNOWNs."
  forecast_classification: "HIGH_VALUE_WITH_CONTROLLED_SYNTHETIC_RISK"

stage_plan:
  - stage_id: "A_PR101_TRUE_MULTI_AGENT_STATE_REMEDIATION"
    owner_pr: 101
    reviewed_head: "8e4750b8a48386559516b817e87cacce4486ea92"
    objective: >-
      Refactor the core from one global first-agent inventory into explicit per-agent evolving state plus shared market state,
      while preserving deterministic event sourcing and accepted D1 reducer semantics.
    required_results:
      - "AgentPortfolioState or equivalent mapping keyed by stable agent_id; every action mutates only its owner's state unless an explicit shared-resource contract applies."
      - "GameRun contains final per-agent states and a total-system state hash, not only one final_inventory."
      - "Cross-agent conflict/arbitration semantics are explicit and independent of lexicographic agent ID accidents."
      - "Validate all top-level market/agent/action collections and object types before attribute access, comprehensions or sorting."
      - "Validate family/subtype consistency, action labels, IDs, evidence/assumption refs, string lengths, counts and bounded arithmetic."
      - "Bound agents, actions, events, causal parents, evidence refs and episode steps with explicit reason codes."
      - "Duplicate order/action replay is idempotent or explicitly rejected; it may not duplicate lots or events silently."
      - "Preserve four canonical families and nine subtype identifiers."
      - "Migration note and backward-compatibility decision for the PR #101 first scaffold."

  - stage_id: "B_PR102_SEMANTIC_STATEFUL_EVALUATION_REMEDIATION"
    owner_pr: 102
    reviewed_head: "1524137dbc6780abb5e9174bcd1e93910ae15007"
    objective: >-
      Replace count-padded single-agent evaluation with semantically distinct multi-agent scenarios, state-carrying episodes,
      requirement-linked invariants and sensitive negative tests.
    minimum_requirements:
      synthetic_scenarios: 72
      semantic_executable_invariants: 80
      negative_cases: 36
      stateful_multi_step_episodes: 24
      counterfactual_pairs: 36
      cross_family_interaction_scenarios: 24
    semantic_rules:
      - "No more than 20% of invariants may be simple existence/count/hash-presence checks."
      - "Every invariant has invariant_id, requirement_id, fixture_ids, failure oracle and mapped test_id."
      - "At least one mutation or injected defect must cause each invariant family to fail."
      - "Multi-step episodes carry forward prior per-agent state, event ledger and causal parents."
      - "Scenarios include at least two agents and cover all four families in aggregate; at least twelve scenarios include three or more agents."
      - "Cover shared constraints, conflicting actions, abstention, incomplete information, hidden-type ambiguity and policy shocks."
      - "Negative tests include malformed top-level types, duplicate IDs, event cycles, future information, state leakage and candidate contamination."
    determinism:
      - "At least three isolated Git-extracted runs with distinct PYTHONHASHSEED values."
      - "Record exact commands, exits, stdout/stderr SHA-256, event/state/counterfactual hashes and elapsed resource measurements."

  - stage_id: "C_NEW_QUARANTINE_AND_ONTOLOGY_COMPATIBILITY_PR"
    required_new_draft_pr: true
    branch_prefix: "codex/a-share-multi-agent-game-engine-0001-d2-integration-"
    output_root: "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/A-SHARE-MULTI-AGENT-GAME-ENGINE/0001-D2-INTEGRATION/"
    objective: >-
      Build a fail-closed candidate adapter port that validates structure and translates source ontology without consuming QCLAW claims as facts.
    required_results:
      - "CANDIDATE-KNOWLEDGE-ADAPTER-PORT.yaml with schema/version negotiation."
      - "ONTOLOGY-TRANSLATION-MATRIX.yaml using exact canonical families RETAIL, INSTITUTIONAL_QUANT, ACTIVE_CAPITAL and POLICY_INDUSTRIAL_FOREIGN_AGGREGATE."
      - "Preserve source family/subtype labels separately and map unknowns to UNMAPPED_UNKNOWN with rationale."
      - "Reject old LargeCapital/QuantStrategy/ActiveSpeculative labels when presented as canonical D2 labels."
      - "Reject abbreviated locks, missing verifier evidence, hard-coded determinism status, missing hashes, identity promotion and claim-to-fact promotion."
      - "Use only synthetic compatibility fixtures; do not import PR #100 atom text into game state."
      - "Compatibility report against PR #100 head 137ea134... remains advisory and candidate-only."

  - stage_id: "D_SYSTEM_CONNECTION_EVIDENCE_AND_D3_BOUNDED_PLAN"
    objective: >-
      Close D2 with coherent documentation, machine receipts and a bounded D3 proposal while preserving all release gates.
    required_results:
      - "D1-D2-INTEGRATION-MAP.md updated for per-agent state."
      - "D2-SECOND-BRAIN-NON-DUPLICATION-MAP.md referencing PR #57 merged base and PR #58 open candidate."
      - "SCENARIO-INVARIANT-NEGTEST-COVERAGE-MATRIX.yaml."
      - "DETERMINISM-AND-RESOURCE-RECEIPT.yaml with three clean runs."
      - "PROACTIVE-IMPROVEMENT-AND-DECISION-LEDGER.yaml."
      - "ASSUMPTION-MODEL-RISK-AND-UNKNOWN-REGISTRY.yaml."
      - "AMED-AGENT-EXECUTION-RECEIPT.yaml and AI_HANDOFF.yaml."
      - "D3-BOUNDED-PROPOSAL.md comparing at least three next-step options, prerequisites, evidence gates, cost and rollback."
      - "No D3 implementation."

