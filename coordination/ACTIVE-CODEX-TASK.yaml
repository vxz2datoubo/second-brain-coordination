    Resolve current process user SID and token group SIDs locally only so applicable DENY entries can be detected. Do not print identities.
  read_method: >-
    Use Windows ACL APIs / PowerShell `Get-Acl` only on the exact bound root. Request access rules as SecurityIdentifier identities. Preserve
    raw ACL text locally; do not print or publish username, SID, private path or raw ACL entries.
  sufficient_current_sid_allow: >-
    PASS requires at least one Allow rule whose identity equals the current user SID, whose rights include Modify or FullControl, and whose
    inheritance includes both ContainerInherit and ObjectInherit. The rule may be explicit or inherited; report only EXPLICIT or INHERITED.
    Existing FullControl may satisfy attestation, but epoch 93 does not authorize creating or changing such a grant.
  blocking_deny: >-
    If any applicable Deny rule for the current user SID or a current token-group SID overlaps write/modify/delete rights needed by Modify,
    report BLOCKING_DENY_PRESENT and stop with no mutation.
  outcome_values:
    acl_attestation: ["PASS", "DIRECT_SID_MODIFY_GRANT_NOT_ATTESTED", "BLOCKING_DENY_PRESENT", "UNKNOWN"]
    grant_source: ["EXPLICIT", "INHERITED", "NONE", "UNKNOWN"]

