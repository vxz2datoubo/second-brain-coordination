acl_precheck:
  principal: "current Windows process user SID"
  read_scope: "ACL on exact bound root only"
  blocking_deny_rule: >-
    Resolve current user SID and current token-group SIDs locally without printing identities. If any applicable Deny ACE overlaps Modify,
    Write, Delete or DeleteSubdirectoriesAndFiles, stop before mutation as BLOCKING_DENY_PRESENT for GPT review.
  already_sufficient_rule: >-
    If an explicit Allow ACE already exists for the exact current user SID with rights containing Modify and inheritance containing both
    ContainerInherit and ObjectInherit, report NOT_REQUIRED and do not mutate. Existing FullControl for the exact SID may satisfy this
    precheck, but epoch 97 must not create or broaden to FullControl.

permission_repair:
  mutation_budget: 1
  persistence: "PERMANENT"
  exact_scope: "CLTM_PRIVATE_DATA_ROOT only"
  principal: "current Windows user SID only"
  desired_right: "Modify"
  inheritance: "ContainerInherit,ObjectInherit"
  propagation: "None"
  access_type: "Allow"
  method: >-
    Use Windows/.NET ACL APIs on the exact bound directory. Read the existing DirectorySecurity, construct a FileSystemAccessRule using the
    current SecurityIdentifier, FileSystemRights.Modify, InheritanceFlags.ContainerInherit | InheritanceFlags.ObjectInherit,
    PropagationFlags.None, AccessControlType.Allow, then AddAccessRule and persist the updated DirectorySecurity. Do not replace the ACL
    wholesale, disable inheritance, remove entries, change owner, or alter any other path.
  one_mutation_only: >-
    If the ACL persist call fails or returns ambiguous state, do not retry, broaden, reset, take ownership or request elevation automatically.

post_mutation_verify:
  rule: >-
    Re-read only the exact root ACL as SecurityIdentifier identities and require an explicit current-user-SID Allow ACE whose rights contain
    Modify and whose inheritance contains both ContainerInherit and ObjectInherit. Report only coarse PASS/FAIL and whether the rule was
    APPLIED or NOT_REQUIRED. Do not print SID, username, path or raw ACL text.
  operational_context: >-
    Preserve epoch-92 functional writeability PASS as prior evidence. Do not perform another plain-write or SQLite probe in epoch 97; the
    purpose of this epoch is the durable direct-SID ACL guarantee only.

