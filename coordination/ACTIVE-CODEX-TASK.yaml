review_disposition:
  classification: "E18_DECLARATION_COMPOSABILITY_ACCEPTED_AS_BASE_GATE_A_FAILS_TYPE_FIRST_PUBLIC_API_TOTALITY"
  accepted_and_frozen_as_useful_base:
    - "E18 tested commit 6ddd68e8c244d7296f5f980cc93b0a5677f25180 is exactly one substantive commit after the E18 reviewed base."
    - "E18 receipt commit d6f9e2e4d38861e91353be177c9ceacedde6d7ee is exactly one receipt-only commit after the tested head."
    - "The substantive delta is limited to d2_game_core.py and tests/test_d2_game_core.py; the receipt delta is limited to E18-GATE-A-R3-RECEIPT.md."
    - "91 focused tests, three byte-stable Git archives and deterministic ledger output are accepted as evidence for the tested cases."
    - "Honest malformed peer declarations now produce deterministic zero-mutation declaration aborts that verify and compose across later steps."
    - "E18 separation between declaration abort, settlement abort, valid commit and forged member/event mutation is accepted as the new base."
  blocking_findings:
    - id: "E19-B01-ORDER-ID-DEREFERENCE-BEFORE-TYPE-VALIDATION"
      severity: "BLOCKER"
      finding: >-
        _arbitrate_internal constructs order_ids with action.order.order_id for every non-None order before _validate_action runs.
        A CandidateAction carrying object(), a dict or another non-SyntheticOrder value can therefore raise AttributeError or a related
        Python exception instead of receiving the documented deterministic pre-construction rejection or fail-closed terminal disposition.
    - id: "E19-B02-UNHASHABLE-IDENTITIES-BEFORE-VALIDATION"
      severity: "BLOCKER"
      finding: >-
        Duplicate checks and registry sets consume action_id, arrival_sequence, effective_invocation_id, order_id and peer_transfer_id before
        their bounded-text/integer/type contracts are established. Lists, dictionaries or other unhashable values can fail during set construction,
        sorting or membership tests before the public contract selects an intentional disposition.
    - id: "E19-B03-E18-RECEIPT-TEST-CODE-DISCREPANCY"
      severity: "MAJOR"
      finding: >-
        The E18 receipt claims that an arbitrary non-SyntheticOrder peer value is rejected before attribute access, but the tested code still
        dereferences order.order_id before _validate_action and the E18 regression suite covers order=None rather than an arbitrary object value.
        Preserve this discrepancy as evidence; do not rewrite the E18 receipt or represent the claim as proven.
    - id: "E19-B04-PUBLIC-POSTCONDITION-MATRIX-IS-NOT-TYPE-ADVERSARIAL"
      severity: "MAJOR"
      finding: >-
        The E18 terminal matrix covers semantic peer branches with normally typed dataclass fields, but it does not cover malformed field types,
        unhashable identifiers, deceptive order objects or multi-fault precedence. Gate A cannot claim a total public boundary until those paths
        are intentional, deterministic and tested.
  preserved_unknowns:
    - id: "ROOT-CAPSULE-ORIGIN-AUTHENTICATION"
      disposition: "DOWNSTREAM_TRUST_ANCHOR_REQUIRED_NOT_AN_E19_BLOCKER"
      finding: "External signature, trusted timestamp and canonical registry publication remain outside Gate A."
    - id: "ATOMIC-PEER-RESOURCE-EFFECTS"
      disposition: "NOT_IMPLEMENTED_YET_FAIL_CLOSED_PRESERVE_FOR_SEPARATE_GATE"
      finding: "Peer CLAIM/RELEASE/EXPIRE effects remain prohibited before mutation and are not part of E19."
  decision:
    e18_declaration_composability_repairs: "ACCEPTED_AS_NEW_BASE"
