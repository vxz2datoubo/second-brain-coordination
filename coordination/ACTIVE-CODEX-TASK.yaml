mode_label: "【Codex模式：目标模式】D2双入口类型优先仲裁与验证器总函数闭环E20"
mode_reason: >-
  Epoch 19 correctly selected a type-first repair for arbitrate, but independent task review occurred before any E19 implementation and found the
  same defect class in verify_episode_ledger. The verifier checks outer dataclass membership, then constructs sets and dictionaries from nested IDs,
  sorts actions by arrival_sequence and enters semantic reconstruction before proving those nested values safe. A malformed dataclass-shaped
  EpisodeState can therefore raise accidental Python exceptions instead of returning a deterministic invalid verification result. The repair remains
  precise and bounded to two public entry points in one D2 file and test suite, so target mode applies rather than project-plan mode.
