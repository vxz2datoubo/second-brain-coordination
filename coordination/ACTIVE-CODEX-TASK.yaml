stage_plan:
  - gate_id: "A_R2_PR101_ATOMIC_PEER_SETTLEMENT"
    status: "ACTIVE"
    owner_pr: 101
    reviewed_head: "ff942e345e92374cd9653533b9cb9549b25949fc"
    required_commit_shape: "ONE_SUBSTANTIVE_TESTED_COMMIT_PLUS_ONE_RECEIPT_ONLY_COMMIT_FROM_E17_REVIEWED_HEAD"
    allowed_paths:
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/A-SHARE-MULTI-AGENT-GAME-ENGINE/0001-D2/d2_game_core.py"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/A-SHARE-MULTI-AGENT-GAME-ENGINE/0001-D2/tests/test_d2_game_core.py"
      - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/A-SHARE-MULTI-AGENT-GAME-ENGINE/0001-D2/E17-GATE-A-R2-RECEIPT.md"
    objective: >-
      Make every PEER_TO_PEER_TRANSFER group a deterministic atomic settlement over one shared pre-state. Both reciprocal legs must commit with
      matched complementary deltas and valid resource effects, or both must terminate without inventory or resource mutation. The independent verifier
      must reject any one-legged or partially committed group even when stored events, state and hashes are coordinated and reducer reconstruction agrees.
    required_results:
      - "Resolve each peer_transfer_id into exactly two reciprocal actions in the same step boundary before any peer leg mutates state."
      - "Preflight both agents, actions, causal parents, information requirements, labels, orders, D1 outcomes, conflict resources, CLAIM/RELEASE/EXPIRE semantics and all terminal guards against one shared immutable pre-state snapshot."
      - "Implement an explicit atomic settlement plan or equivalent two-phase plan/commit contract; do not use compensating rollback events."
      - "On COMMIT, emit exactly two deterministically ordered terminal peer events, apply equal filled quantities with complementary signed inventory deltas, create no external-liquidity flow, and prove zero aggregate closed-system delta."
      - "On ABORT, emit exactly two deterministic non-mutating terminal events or one explicitly justified group terminal representation; in either design no leg may mutate inventory or conflict-resource state."
      - "Freeze and test action, invocation and supplied-order identity consumption for both committed and aborted groups; remain consistent with the E16 terminal identity rule."
      - "Freeze how conflict CLAIM/RELEASE/EXPIRE interacts with a peer group. Either prohibit unsupported combinations fail-closed before mutation or include their resource effects atomically in the settlement plan."
      - "Add an independent verifier peer-group invariant that does not merely trust reducer reconstruction: every group must have complete reciprocal membership, same-step coverage, deterministic event membership, complementary deltas, zero external flow and valid commit/abort disposition."
      - "Make total_system_conserved and total_system_accounted true for every verifier-valid peer-only episode; otherwise verification must fail."
      - "Preserve all E16 event reconstruction, event-ID, step-boundary, causal-parent and blocked-identity guarantees."
    mandatory_exploit_tests:
      - "Baseline pair shape is valid; the second leg has an unknown or forward causal parent. Old core accepts the first leg and blocks the second; repaired core must atomically abort both."
      - "The second leg conflicts with an already claimed resource or lacks resource ownership. No first-leg mutation may survive."
      - "One leg uses RELEASE or EXPIRE semantics in a peer group. Unsupported combinations must fail both before mutation, or supported combinations must commit atomically with proven resource state."
      - "Swap which leg carries each failure; behavior must be symmetric and independent of arrival order except for deterministic event ordering."
      - "Coordinate stored events, portfolios, peer IDs, claims and hashes to represent a one-legged transfer. Independent verification must reject it."
      - "Delete or duplicate one peer terminal event while recomputing state hash. Verification must reject it."
      - "Make both events accepted but quantities, sides, counterpart IDs, transfer IDs, step indices or signed deltas non-complementary. Verification must reject each mutation."
      - "Aborted pair identities cannot be reused across a later step under the frozen terminal-identity rule."
      - "A valid no-fill pair and a valid partial-fill pair must have explicitly tested dispositions and zero aggregate local delta."
      - "Interaction with a successful CLAIM followed by later RELEASE/EXPIRE must preserve resource ownership and event lineage."
    minimum_tests:
      total_focused_semantic_tests: 66
      new_atomicity_regressions: 12
      clean_git_archive_runs: 3
      distinct_pythonhashseed_values: 3
    evidence_required:
      - "Exact substantive and receipt SHAs, parents, trees and allowed-file deltas."
      - "Exact baseline exploit commands/results and final regression IDs."
      - "Exact commands, exits, stdout/stderr SHA-256, Python/platform and elapsed time."
      - "Three clean Git-archive runs plus deterministic trace/hash equality."
      - "CI status for all configured Python versions."
      - "External completion anchors on PR #101, Issue #23 and Issue #31."
      - "OutcomeCalibrationReview comparing the E17 forecast with observed benefits, harms, costs, surprises and residual UNKNOWNs."
    caution:
      - "Do not weaken or delete E15/E16 tests or evidence."
      - "Do not solve atomicity by relabeling peer inventory changes as external liquidity."
      - "Do not modify D0, D1, QCLAW, WorkBuddy, PR #102, PR #103 or PR #105."
      - "Do not start Evaluation V2 or any downstream gate."

