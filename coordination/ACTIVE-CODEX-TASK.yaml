acl_provenance_attestation:
  mutation_budget: 0
  identity_handling: >-
    Resolve current Windows user SID and current token-group SIDs locally. Do not print username, SID, group names, group SIDs, private path,
    or raw ACL entries. For Allow provenance, treat a group ACE as applicable only when WindowsPrincipal.IsInRole(group SID) is true for the
    current process. For Deny detection, conservatively treat any matching current-user SID or token-group SID as applicable.
  sufficient_single_ace: >-
    PASS requires at least one applicable Allow ACE for either the current user SID or an enabled current token-group SID whose rights contain
    Modify or FullControl and whose inheritance includes both ContainerInherit and ObjectInherit. Do not infer PASS from partial rights split
    across multiple ACEs. Report only principal class and grant source, never identities.
  blocking_deny: >-
    If any applicable Deny ACE for current user SID or current token-group SID overlaps Modify/Write/Delete/DeleteSubdirectoriesAndFiles,
    report BLOCKING_DENY_PRESENT and stop with no mutation.
  outcome_values:
    acl_effective_provenance: ["PASS", "NO_APPLICABLE_DURABLE_ALLOW_ATTESTED", "BLOCKING_DENY_PRESENT", "UNKNOWN"]
    principal_class: ["USER", "GROUP", "NONE", "UNKNOWN"]
    grant_source: ["EXPLICIT", "INHERITED", "NONE", "UNKNOWN"]
    rights_basis: ["MODIFY", "FULLCONTROL", "NONE", "UNKNOWN"]

