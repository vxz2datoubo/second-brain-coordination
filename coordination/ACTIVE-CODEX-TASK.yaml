  blocking_findings:
    - id: "E24-B01-INVARIANT-SLOT-CREATES-METADATA-ONLY-UNIQUENESS"
      severity: "BLOCKER"
      finding: >-
        invariant_catalog creates 80 rows from 72 fixtures and adds slot=index//72 to semantic_input. Slot is not consumed by execute_scenario,
        any predicate, or any oracle, so the last eight rows can receive unique signatures without unique executable semantics.
    - id: "E24-B02-INVARIANT-ROWS-DO-NOT-EXECUTE-NAMED-ORACLES"
      severity: "BLOCKER"
      finding: >-
        The invariant test checks only that failure_oracle_id starts with ORACLE- and that IDs are unique. It never dispatches each row's predicate_id
        or failure_oracle_id against its fixture, violating the explicit E23 requirement.
    - id: "E24-B03-NEGATIVE-VARIANTS-CONTAIN-UNUSED-DIVERSITY"
      severity: "BLOCKER"
      finding: >-
        Several negative families include variant in declared semantic_input while execute_negative ignores it except for identifiers. Duplicate invocation,
        duplicate order, prior replay, agent/action subclass and bool-arrival rows therefore gain coverage credit without distinct behavior.
    - id: "E24-B04-COUNTERFACTUAL-SIGNATURES-OVERSTATE-EXECUTION-DIVERSITY"
      severity: "MAJOR"
      finding: >-
        counterfactual_catalog declares multiple conflict_mode values, but execution collapses every value >=2 to the same non-null conflict key behavior.
        Declared metadata rather than derived executable input controls distinctness.
    - id: "E24-B05-CATALOG-VALIDATOR-TRUSTS-AUTHOR-DECLARED-SIGNATURES"
      severity: "BLOCKER"
      finding: >-
        catalog_validation hashes spec.semantic_input and expected_relation supplied by the catalog author. It does not derive signatures from the actual
        constructed input, executed trace, predicate dispatch or oracle relation, so unused fields can defeat duplicate detection.
  decision:
