    - "D3 remains proposal-only and all three PRs preserve synthetic-only, research-only and NO_TRADE boundaries."
  blocking_findings:
    - "run_bounded_counterfactual_episode carries portfolios and prior event IDs but not SharedMarketState; claimed conflict resources reset on every step."
    - "Actions that are not removed in an episode may execute again with the same action/order IDs on later steps; duplicate replay is checked only inside one arbitrate call."
    - "ActionLabel.BLOCKED can still carry a valid order through reduce_order and produce an accepted event labelled BLOCKED."
    - "total_system_state_hash omits the market/shared-state object and total_system_conserved relies on the internally accumulated net_filled_quantity instead of independently recomputing from immutable events/actions."
    - "PR #102 mutation_sensitivity does not inject defects into the system and assert invariant failure; it mostly asserts that a mutated object differs or that the original result is still correct."
    - "The HIDDEN invariant re-creates the fixture with _agents_for instead of validating a preserved run/decision trace."
    - "state_leakage_guard checks only initial-inventory ownership and does not detect swapped final states, unauthorized deltas or cross-step replay."
    - "The 72 scenarios use continuous-AM or suspended state only, leaving the broader A-share phase state machine unexercised at D2."
    - "PR #103 accepts any deterministic_status other than HARDCODED_PASS and trusts a candidate-provided canonical_family_label without a table-derived mapping proof."
    - "Current receipts do not provide one complete local-tested-to-remote-head tree mapping and final precompletion-main anchor across all three PRs."

