# -----------------------------------------------------------------------------
# INDEPENDENT REVIEW DISPOSITION
# -----------------------------------------------------------------------------
review_disposition:
  classification: "GATE_A_MACHINE_SHAPE_PASS_SEMANTIC_PROOF_FAIL_RETURN_FOR_BOUNDED_REMEDIATION"
  accepted_and_frozen_as_useful_base:
    - "Tested commit 9a1c50eb2fd26bbf4dfd029152cceaca15bf1a3d is exactly one commit after reviewed E15 head."
    - "Receipt commit b4a544063e0ef7056f9e0f97ef8d130c36c149b4 is exactly one receipt-only commit after the tested head."
    - "Substantive delta is limited to d2_game_core.py and tests/test_d2_game_core.py; receipt delta is limited to E15-GATE-A-RECEIPT.md."
    - "36 focused tests, three clean archive runs, deterministic output and Python 3.11/3.13 CI evidence are preserved."
    - "Immutable EpisodeState, CLAIM/RELEASE/EXPIRE, external-flow accounting, peer-transfer accounting and reducer-based portfolio reconstruction are useful foundations."
  blocking_findings:
    - id: "E16-B01-STORED-ACCEPTED-ORACLE"
      severity: "BLOCKER"
      finding: >-
        verify_episode_ledger branches on stored event.accepted. A coordinated forgery can change a previously accepted event into a no-op,
        roll current_agents and external flows back, recompute pre/post hashes and episode.state_hash, and potentially pass because the verifier
        does not independently derive whether the action must execute from immutable action semantics and reducer output.
    - id: "E16-B02-EVENT-ID-NOT-RECONSTRUCTED"
      severity: "BLOCKER"
      finding: >-
        event_id is checked only for uniqueness. It is never recomputed, and EpisodeState does not currently retain enough immutable run/event
        identity input to reproduce _event_id. Coordinated replacement of event IDs plus claim, flow, causal references and hashes is therefore
        not independently disproved.
    - id: "E16-B03-INCOMPLETE-EVENT-ACTION-BINDING"
      severity: "BLOCKER"
      finding: >-
        The verifier does not fully prove equality for accepted, label, rejected_reason_codes, cause_refs, causal_parent_event_ids, invocation_id,
        liquidity_mode, conflict_transition, counterparty_agent_id and peer_transfer_id against the immutable action registry and reconstructed transition.
    - id: "E16-B04-BLOCKED-IDENTITY-REPLAY-GAP"
      severity: "BLOCKER"
      finding: >-
        Declared ABSTAIN/BLOCKED identities are consumed, but invalid-agent, unknown-agent, invalid-parent, conflict and other generated blocked events
        are not uniformly added to episode-wide executed/rejected action and invocation identity sets. A different action_id can therefore reuse an
        invocation after a generated block, contrary to the Gate A replay contract.
    - id: "E16-B05-STEP-AND-CAUSAL-BINDING"
      severity: "MAJOR"
      finding: >-
        step_index is hashed but not independently reconstructed, and an event may substitute a different already-known causal parent without proving
        equality to CandidateAction.causal_parent_event_ids.
  decision:
    gate_a: "NOT_ACCEPTED"
    gate_b: "FROZEN"
    gate_c: "FROZEN"
    gate_d: "FROZEN"
    issue92: "BLOCKED_NOT_RELEASED"
    merge: false

