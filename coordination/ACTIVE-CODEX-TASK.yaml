first_principles_goal: >-
  Implement the smallest deterministic synthetic A-share rule engine that can prove state, feasibility, inventory and no-fill semantics
  without real data, identity inference, profitability claims or executable trading output.

required_actions:
  - "Claim exact Epoch 5 from latest remote main; create a new isolated branch from accepted D0 head e979f109225bf2d6f00a7890d79df3684dc9e129."
  - "Create a stacked Draft PR whose base is codex/a-share-multi-agent-game-engine-0001-d0; do not add D1 commits to PR #95."
  - "Use only the new D1 root coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/A-SHARE-MULTI-AGENT-GAME-ENGINE/0001-D1/."
  - "Implement a standard-library-only pure state reducer. Synthetic OrderIntent is a research object and must never connect to broker/account/order APIs."
  - "Define explicit immutable contracts for RuleSnapshot, SecurityStatus, MarketState, AgentState, InventoryState, InformationSet, SyntheticOrderIntent, FeasibilityResult and SyntheticMatchOutcome."
  - "Support pre_open, call_auction, continuous_auction, midday_break, closing_auction, halted and post_close transitions; unsupported transitions fail closed."
  - "Validate in this order: source capability/available_at, rule snapshot/security status, phase/halt, price limit/order validity, fresh-seasoned-pending inventory, quantity/capacity and declared synthetic matching rule."
  - "Model outcomes only as filled, partially_filled, unfilled_cancelled, unfilled_carried, unknown_outcome or invalid_or_blocked. No queue position, participant identity or true exchange matching detail may be inferred."
  - "Implement T+1 inventory separation: seasoned_quantity, fresh_quantity, locked_quantity, pending quantities and explicit cross-day settlement transition."
  - "UNKNOWN rule, status, capability, unit or inventory prerequisites must return abstain/invalid_or_blocked; no UNKNOWN-to-zero coercion."
  - "Provide at least twelve executable fixtures covering call auction, continuous partial/no fill, halt, limit, fresh-lot sell rejection, seasoned sale, cross-day transition, stale/UNKNOWN rules and competing latent hypotheses."
  - "Provide at least twenty executable invariants including inventory conservation, non-negative buckets, phase legality, no fill while halted/break, no future leakage, deterministic equal-input output, no identity promotion and no direct order output."
  - "Add negative tests for malformed snapshots, unsupported transitions, missing available_at, missing security status, invalid quantities, illegal fresh sale and nondeterministic repeated execution."
  - "Document every assumption and remaining UNKNOWN; do not hard-code current exchange numeric rules as timeless facts."
  - "Run the full fixture/invariant suite twice in isolated temporary directories and require byte-identical normalized outputs."
  - "Create a tested implementation commit and a later receipt-only commit. Externally anchor the concrete receipt SHA after push."
  - "Stop for GPT review; D2 data admission, replay, calibration, Level-k, self-play and MARL remain blocked."

