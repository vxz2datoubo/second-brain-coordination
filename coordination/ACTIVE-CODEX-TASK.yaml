filesystem_security_attestation:
  mutation_budget: 0
  filesystem_type_method: >-
    Derive the volume root from the resolved private root and read its filesystem type using Windows/.NET read-only volume metadata. Do not
    output drive letter, mount path, volume label, serial number, private path or any identity.
  filesystem_type_public_values: ["NTFS", "REFS", "EXFAT", "FAT32", "FAT", "OTHER", "UNKNOWN"]
  persistent_acl_support_rule: >-
    Classify `SUPPORTED` for NTFS or ReFS; classify `UNSUPPORTED` for exFAT, FAT32 or FAT; otherwise `UNKNOWN`. If the exact root volume cannot
    be classified unambiguously, return UNKNOWN and stop for GPT review.
  root_reparse_point: >-
    Inspect only the exact resolved root item attributes and report YES/NO/UNKNOWN. Do not follow or enumerate child paths beyond normal
    Resolve-Path resolution already required for boundary validation.
  interpretation:
    - "SUPPORTED + no durable ACE provenance => ACL-capable filesystem but permission source remains unresolved; do not canary automatically."
    - "UNSUPPORTED => lack of durable per-file ACL provenance is expected for this filesystem model; functional writeability may still be valid."
    - "UNKNOWN => stop for GPT review."

