review_disposition:
  classification: "E19_DIRECTION_VALID_BUT_INCOMPLETE_SUPERSEDED_BEFORE_EXECUTION_BY_DUAL_ENTRY_PUBLIC_BOUNDARY_TOTALITY"
  accepted_and_frozen_as_useful_base:
    - "E18 tested commit 6ddd68e8c244d7296f5f980cc93b0a5677f25180 and receipt commit d6f9e2e4d38861e91353be177c9ceacedde6d7ee remain the exact code base."
    - "E18 verifier-valid declaration aborts, E17 atomic peer settlement and E16 independent reconstruction remain accepted as preserved semantics."
    - "E19 correctly identified arbitration-side pre-validation order and identity consumption."
    - "PR #101 head did not move after E19 publication; no E19 implementation, checkpoint or completion evidence exists, so scope can be corrected without code rollback."
  blocking_findings:
    - id: "E20-B01-ARBITRATION-NESTED-FIELDS-CONSUMED-BEFORE-STRUCTURAL-PROOF"
      severity: "BLOCKER"
      finding: >-
        arbitrate extracts order_id and builds sets, dictionaries, sorted collections and registry membership from CandidateAction and AgentState
        nested fields before the exact types and bounded contracts required by those operations are established.
    - id: "E20-B02-VERIFIER-NESTED-FIELDS-CONSUMED-BEFORE-DEEP-VALIDATION"
      severity: "BLOCKER"
      finding: >-
        verify_episode_ledger confirms only outer dataclass tuple membership, then builds a set from initial_agents[*].agent_id, a dictionary from
        action_registry[*].action_id and sorts boundary actions by arrival_sequence. Unhashable or incomparable nested values can escape as TypeError.
    - id: "E20-B03-VERIFIER-IS-NOT-A-TOTAL-PUBLIC-TRUST-BOUNDARY"
      severity: "BLOCKER"
      finding: >-
        The verifier should return EpisodeLedgerVerification(valid=false, reason_codes=...) for malformed stored state, but dataclass-shaped adversarial
        values can crash before a canonical invalid result is produced. Evaluation V2 cannot freeze that behavior.
    - id: "E20-B04-SPLIT-VALIDATOR-DRIFT-RISK"
      severity: "MAJOR"
      finding: >-
        Repairing only arbitrate would create two structural contracts: one safe writer and one unsafe reader. Shared narrow validators or an equivalent
        common structural contract are required to prevent future divergence.
  preserved_unknowns:
    - id: "ROOT-CAPSULE-ORIGIN-AUTHENTICATION"
      disposition: "DOWNSTREAM_TRUST_ANCHOR_REQUIRED_NOT_AN_E20_BLOCKER"
      finding: "External signature, trusted timestamp and canonical registry publication remain outside Gate A."
    - id: "ATOMIC-PEER-RESOURCE-EFFECTS"
      disposition: "NOT_IMPLEMENTED_YET_FAIL_CLOSED_PRESERVE_FOR_SEPARATE_GATE"
      finding: "Peer CLAIM/RELEASE/EXPIRE effects remain prohibited before mutation and are not part of E20."
