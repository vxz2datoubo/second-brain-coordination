review_disposition:
  classification: "E20_VALUABLE_SHARED_PREFLIGHT_BUT_OPERATION_SAFE_TOTALITY_NOT_PROVEN"
  accepted_as_reusable_candidate_base:
    - "From d6f9e2e... E20 produced exactly one substantive commit 7a290873... and one receipt-only commit bf9c726...."
    - "Only d2_game_core.py, tests/test_d2_game_core.py and E20-GATE-A-R5-RECEIPT.md changed."
    - "The shared preflight blocks ordinary object, dict, list, unhashable container and wrong outer-dataclass cases before the previous unsafe paths."
    - "124 focused tests pass and GitHub Actions passed on Python 3.11 and Python 3.13."
    - "E16 independent reconstruction, E17 atomic peer settlement and E18 declaration-abort semantics remain preserved."
    - "The boundary remains SYNTHETIC_ONLY, CANDIDATE_ONLY, research_only and NO_TRADE."
  blocking_findings:
    - id: "E21-B01-NOMINAL-STR-INT-SUBCLASSES-REMAIN-OPERATION-UNSAFE"
      severity: "BLOCKER"
      finding: >-
        _bounded_text uses isinstance(value, str) and _safe_int uses isinstance(value, int). A hostile str/int subclass can pass these checks while
        overriding __hash__, __eq__, __lt__, __le__, __str__, encode or numeric comparison. Arbitration and verification subsequently place these values
        into sets/dicts, sort them and compare them, so accidental user-defined exceptions can still escape.
    - id: "E21-B02-CARRIER-SUBCLASSES-CAN-BYPASS-NOMINAL-DATACLASS-CHECKS"
      severity: "BLOCKER"
      finding: >-
        Structural checks accept subclasses of EpisodeState, CandidateAction, AgentState, LedgerEvent and imported D1 carriers. A hostile subclass can
        override __getattribute__, __eq__ or related behavior and be dereferenced or compared after passing isinstance.
    - id: "E21-B03-ENUM-PROOF-IS-NOT-EXACT"
      severity: "BLOCKER"
      finding: >-
        _safe_enum_text_or_none accepts bounded strings for enum fields, and MarketState.phase plus permitted phases are checked against the base Enum
        class. A wrong Enum with an unsafe/non-JSON value can reach _primitive/_canonical, while wrong text enum stand-ins are not proven as their exact
        documented contract before later use.
    - id: "E21-B04-E20-ADVERSARIAL-TESTS-MISS-HOSTILE-NOMINAL-SUBTYPES"
      severity: "BLOCKER"
      finding: >-
        The 33 new E20 cases use one ordinary explosive object and list/dict fixtures. They do not use malicious str/int subclasses, carrier subclasses or
        wrong Enum values, despite the E20 route requiring exact contracts and custom __hash__/__eq__/__lt__ adversaries.
    - id: "E21-B05-CLEAN-ARCHIVE-EXECUTION-EVIDENCE-INCOMPLETE"
      severity: "MAJOR"
      finding: >-
        The E20 receipt records three identical tar hashes, but does not prove three distinct archive extractions and focused-suite executions in different
        roots with process-level seeds, exact command exits, stdout/stderr hashes and reason-order trace equality.
    - id: "E21-B06-E20-RECEIPT-CALIBRATION-AND-FINAL-GIT-METADATA-INCOMPLETE"
      severity: "MAJOR"
      finding: >-
        The receipt records tested commit/tree but does not contain or externally reconcile the full receipt commit parent/tree metadata and does not
        provide the required OutcomeCalibrationReview against the E20 forecast.
