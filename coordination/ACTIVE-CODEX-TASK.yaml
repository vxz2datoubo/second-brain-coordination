root_goal: >-
  Connect an authorized real/private Conversation Source to the existing W3 candidate runtime without exposing raw private
  conversation bodies in public GitHub and without promoting any candidate to formal PROJECT/GLOBAL authority. Prove one
  privacy-preserving local/private canary from source -> ConversationEpisode/source identity -> LearningPacket -> MemoryStore
  -> QueryPlan/ContextBundle recall, while preserving provenance, user/project scope, valid-time, correction semantics and fail-closed behavior.

implementation_stage:
  name: "Private candidate-ingestion bridge and canary"
  candidate_authority_only: true
  formal_write_allowed: false
  public_repo_implementation_and_synthetic_tests_allowed: true
  local_private_source_read_allowed: true
  local_private_candidate_store_write_allowed: true
  raw_private_body_in_git_pr_issue_ci_logs: false
  real_private_canary_authorized: true
  required_sequence:
    A: "Extend the canonical ConversationEpisode/source adapter to support an authorized private/local source class without weakening synthetic/public-safe behavior."
    B: "Provide one bounded local/private ingestion entry point (library/CLI) that accepts a trusted private source handle or structured Daily Memory Candidate package, validates scope/provenance/time/role/privacy, and emits only existing W3 LearningPacket candidates."
    C: "Run synthetic/public-safe regression and adversarial tests in Git/CI; no private fixture content is committed."
    D: "If an actually accessible authorized private conversation source exists in the Codex runtime, perform one minimal local-only canary ingestion and later scoped recall; public evidence contains only hashes/counts/status, never raw text or private semantic values."
    E: "If the real source is unavailable, do not fabricate success: return PRIVATE_SOURCE_BINDING_WAITING with the exact missing source/transport capability while preserving the completed bridge implementation and tests."

private_source_contract:
  source_examples_allowed: ["local private export/file handle", "authorized local conversation capture", "structured Daily Memory Candidate v2 package"]
  public_receipt_allowed_fields: ["source_hash", "pointer_hash", "episode_id_hash", "candidate_count", "atom_id_hash", "scope_hash", "timestamps", "validation_status", "recall_count", "test_count"]
  public_receipt_forbidden_fields: ["raw conversation body", "verbatim private text", "private file path", "secret values", "credential/token/cookie/session identifiers", "full private semantic candidate value"]
  source_absence_semantics: "PRIVATE_SOURCE_BINDING_WAITING, not success and not 'no conversation occurred'"

candidate_ingestion_interface:
  required: true
  purpose: "Create a stable canonical local ingestion boundary usable by Daily Memory Candidate v2 or other authorized private Conversation Sources."
  must_reuse: ["ConversationEpisode", "LearningPacket", "MemoryStore", "QueryPlan", "ContextBundle", "existing provenance/conflict/UNKNOWN"]
  must_not_create: ["second memory store", "second QueryPlan", "second ContextBundle", "new vector/graph/temporal authority"]
  daily_memory_candidate_v2_transport: "Interface/contract required; direct ChatGPT automation -> local W3 transport may remain SYSTEM_DEPENDENCY if unavailable."

acceptance_gates:
  - "All canonical main Phase 3 tests pass plus new private-ingestion bridge tests."
  - "Synthetic/public-safe behavior remains backward compatible."
  - "Private/local source classification is fail-closed and cannot be used to publish raw bodies in public receipts."
  - "Direct/generic packet bypass, assistant-role contamination, prompt injection, secret values, missing provenance, missing user/project/time scope and stale/superseded current states fail closed."
  - "The candidate-ingestion interface is deterministic/idempotent and uses only the existing W3 candidate authority."
  - "A local/private canary is performed if and only if a real authorized source is actually accessible; otherwise PRIVATE_SOURCE_BINDING_WAITING is explicit."
  - "No formal PROJECT/GLOBAL promotion occurs."
  - "No private raw text appears in Git history, PR/Issue comments, CI logs, tests, fixtures, embeddings or public ContextBundle evidence."
  - "Rollback/rebuild and deterministic replay remain valid."
  - "LOCAL_EXECUTION_ISSUES is present in every checkpoint/closeout: NONE_OBSERVED or each issue reported with the mandatory four fields."

