    objective: >-
      Establish one shared type-first structural contract across arbitrate and verify_episode_ledger. No nested field may be dereferenced, hashed,
      compared, sorted, inserted into a set/dict or used as a registry key before the exact contract needed for that operation is proven. Every returned
      GameRun must contain a verifier-valid EpisodeState. Every malformed arbitration input must be intentionally rejected before construction, and every
      malformed stored episode must yield a deterministic invalid EpisodeLedgerVerification rather than an accidental Python exception.
    required_results:
      - "Inventory every pre-event and pre-verification field consumption across AgentState, CandidateAction, SyntheticOrder, LedgerEvent, ExternalLiquidityFlowEvent, SharedMarketState, EpisodeStepBoundary and EpisodeState."
      - "Implement shared narrow structural validators or an equivalent single-source contract used by both arbitration and verification."
      - "Arbitrate must reject malformed structure before event, boundary, registry, replay identity or portfolio/resource mutation."
      - "verify_episode_ledger must be total over arbitrary Python objects and dataclass-shaped malformed EpisodeState values, returning stable invalid reason codes without mutation."
      - "Freeze a deterministic error taxonomy and precedence: top-level type, collection shape/limit, nested field structure, identity uniqueness, schedule/boundary structure, semantic invariants, reconstruction mismatch."
      - "Do not coerce malformed identifiers to strings, tuples or hashable stand-ins."
      - "Do not use a broad catch-all TypeError/AttributeError wrapper around either public entry point."
      - "Cover arbitrary object/dict/list/deceptive order values and unhashable or incomparable nested identifiers."
      - "Cover custom adversarial values whose __hash__, __eq__, __lt__ or partial attributes raise; invalid types must be rejected without invoking unsafe operations."
      - "Every non-exceptional arbitrate branch must return a verifier-valid episode; every intentional arbitration exception must occur before construction."
      - "Every verifier call must return EpisodeLedgerVerification and must never leak accidental exceptions for malformed user-supplied state."
      - "Preserve E16 independent reconstruction, E17 atomic settlement, E18 declaration-abort composability and all existing negative evidence."
      - "Record that E19 was superseded before execution and do not create or edit an E19 receipt."
    mandatory_exploit_tests:
      - "Arbitrate peer and external actions with order=object(), dict, list and a deceptive partial-order object."
      - "Arbitrate with unhashable action_id, agent_id, invocation_id, order_id, peer_transfer_id, counterparty ID and conflict key."
      - "Arbitrate with wrong-type or incomparable arrival_sequence and scheduled_step_index values before any sort or set operation."
      - "Verify EpisodeState whose initial AgentState has agent_id=list/dict and whose action registry has action_id=list/dict."
      - "Verify EpisodeState whose arrival_sequence cannot be sorted, whose boundary action IDs are unhashable, and whose event IDs/references are malformed."
      - "Verify malformed SharedMarketState claims, external flow IDs and nested SyntheticOrder fields without accidental hash/attribute errors."
      - "Use adversarial custom objects with raising __hash__, __eq__, __lt__ or missing attributes to prove unsafe operations are not reached."
      - "Multi-fault inputs must produce the frozen first reason independent of PYTHONHASHSEED and list/tuple representation where both are supported."
      - "Valid E18 declaration aborts, valid external actions, atomic peer commits, settlement aborts and forged-history rejection remain unchanged."
      - "Source-level or executable guards prove no protected field consumption precedes the shared structural preflight."
