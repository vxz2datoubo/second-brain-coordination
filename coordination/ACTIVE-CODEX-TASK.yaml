fundamental_goal: >-
  Guarantee, with one narrowly scoped ACL mutation at most, that the current Windows user/SID running Codex has a durable explicit Allow
  FileSystemAccessRule granting Modify on the exact already-bound CLTM_PRIVATE_DATA_ROOT with ContainerInherit and ObjectInherit and
  PropagationFlags.None. Preserve all unrelated ACL entries and inheritance. Do not broaden to FullControl, groups, parent paths, the drive,
  ownership, Defender/CFA, registry or security policy. Do not read private content or execute ingestion/recall/canary in epoch 97.

canonical_remote_read_policy:
  remote_head_gate: >-
    Run `git ls-remote https://github.com/vxz2datoubo/second-brain-coordination.git refs/heads/main` and parse exactly one 40-hex SHA for
    refs/heads/main. Do not mutate linked-worktree Git metadata/object storage.
  disposable_temp_git_fallback: >-
    Use one task-owned bare Git repository under OS temp, fetch current remote main with depth 128, require fetched head to equal the
    immediately preceding ls-remote SHA, read exact-head ACTIVE-CODEX-TASK.yaml, evaluate runtime freshness, and delete only task-owned temp
    Git artifacts before CLTM_PRIVATE_DATA_ROOT access.
  canonical_read_mode_public_value: "TEMP_BARE_GIT_EXACT_HEAD"
  fail_closed: >-
    Any ls-remote/fetch/head-equality/control-read/runtime-freshness/temp-cleanup ambiguity stops before private-root ACL access.

