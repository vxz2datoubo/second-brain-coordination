      - "Consume action and invocation identity for every emitted terminal event, including generated blocks. Define and test whether an unexecuted order ID is reserved or reusable; apply one explicit rule consistently."
      - "Perform all prior-episode identity and action-registry collision checks before constructing a new event."
      - "Preserve external-versus-peer accounting, resource lifecycle, four families, nine subtypes, bounds, synthetic-only and NO_TRADE boundaries."
    mandatory_exploit_tests:
