required_outcomes:
  - "Introduce a canonical GPT_ENGINEERING_WORKER active route registry supporting multiple bounded slots/leases."
  - "Normalize each worker slot into the same route identity fields used by Control Tower."
  - "Bind Work Claims to execution_agent + exact worker slot/lease identity + task_id/epoch/issue/pr/branch."
  - "Preserve fail-closed stale-route and non-executable-route checks."
  - "Extend authorization witness freshness/invalidation to worker slot identity."
  - "Extend deterministic program and claim projections."
  - "Enforce configured GPT worker WIP/resource limits and same-object/authority collisions."
  - "Preserve CODEX/QCLAW/WORKBUDDY backward compatibility."
  - "Preserve reviewer/executor separation metadata; CI does not confer acceptance authority."
  - "Provide closed/released worker-slot historical semantics with no active lease."

mandatory_adversarial_tests:
  - "valid GPT worker slot + exact active Work Claim => PASS"
  - "active claim bound to execution_allowed=false worker slot => FAIL"
  - "stale worker slot/task/epoch/issue/pr/branch => FAIL"
  - "GPT worker impersonating CODEX => FAIL or mechanically distinct provenance"
  - "two GPT worker slots writing same canonical object/authority => FAIL"
  - "two GPT worker slots on non-overlapping surfaces => only PASS within WIP/resource limits"
  - "one slot silently replacing another active slot => FAIL"
  - "stale authorization witness after slot route change => FAIL"
  - "stale witness after peer claim or release-policy change => FAIL"
  - "closed/released slot retains no execution lease"
  - "existing CODEX/QCLAW/WORKBUDDY regression suite remains green"
  - "projection generation remains deterministic/idempotent"

