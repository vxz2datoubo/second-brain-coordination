  plan_is_not_completion_evidence: true

implementation_requirements:
  intake:
    - "semantic aliases for explicit Signal capture; not exact-string-only"
    - "explicit user no-capture override has precedence"
    - "DURABLE_SIGNAL envelope requires desired_effect and success_condition"
    - "expected_problems/risks/assumptions/unknowns preserve UNKNOWN and provenance"
    - "public-safe source summary only; private raw body rejected or opaque-ref-only"
  durable_ingress:
    - "reuse S0C SignalEvent/SignalLink/DurableSignalLedger"
    - "no second persistent Signal truth"
    - "if Git-backed journal is used, deterministic replay to S0C must be proven"
    - "accepted event/link semantics are append-only; corrections are events/links"
    - "duplicate/idempotency collision/omission/revoke semantics remain fail-closed and replayable"
    - "do not silently break existing S0C schema; extensions require compatibility layer or explicit migration"
  system_awareness:
    - "derive SystemAwarenessProjection from canonical authorities and exact source revisions"
    - "include component capability/authority/entrypoint/read-set/route/dependency/maturity/current state/regression/unknown refs"
    - "targeted retrieval only; no whole-repository prompt injection"
    - "stale source revision invalidates material release snapshot"
    - "projection cannot grant authority or overwrite domain truth"
  adaptive_gateway:
    - "independent axes persistence/execution/materiality"
    - "EPHEMERAL/DIRECT for simple one-off work where sufficient"
    - "TRACE_ONLY/DOMAIN_WORKFLOW for ordinary AI Film directing unless a material mutation is requested"
    - "DURABLE_SIGNAL/GOVERNED_MISSION for material system/blueprint/module/skill/formal task work"
    - "risk escalation cannot be downgraded by convenience/cost"
  global_preflight:
    - "GLOBAL_SHALLOW + DELTA + TARGETED_DEEP + CONDITIONAL_RESEARCH"
    - "detect duplicate/extend/reinforce/contradict/dependency/block/shared-surface/authority collision"
    - "produce merge/parallel/serialize/reviewer/challenger/counterfactual decisions with evidence"
    - "bind current GitHub PR exact heads/reviews/main, routes, claims, lanes, leases and relevant domain refs"
    - "no fresh valid reconciliation receipt -> no formal task release"
  task_release_packet:
    - "bind included Signals/clusters, desired effects, success conditions, conflicts, dependencies, routing rationale and exact snapshots"
    - "unresolved material conflicts remain visible"
    - "GlobalReconciliationReceipt is not execution authority"
    - "Control Tower remains mandatory for formal execution"
  runtime_invocation_receipt:
    - "actual reads require exact repository/commit/path/blob/content or attributable connector/tool trace evidence"
    - "self-declared read/scan is not proof"
    - "separate process_compliance from outcome_quality"
    - "missing evidence -> UNVERIFIED"
    - "compact receipt references existing trace; no second raw trace store"
  ai_film_smoke:
    - "read-only exact-commit source"
    - "PROJECT_INDEX first"
    - "resolve read_sets.directing and applicable director_route_index rules"
    - "mechanically bind applicable screenplay/continuity/map/character/feedback refs"
    - "prove ordinary directing route is TRACE_ONLY/DOMAIN_WORKFLOW and creates no durable Signal by default"
    - "AI Film receives ZERO mutation"
  closure:
    - "Task DONE != Signal SATISFIED"
    - "closure assessment supports PARTIALLY_SATISFIED/SATISFIED/BLOCKED/NEEDS_REVALIDATION/REVOKED/SUPERSEDED"
    - "SATISFIED leaves active projection but append-only history remains"
    - "new feedback/failure may create Signal candidate; no automatic formal skill promotion"

