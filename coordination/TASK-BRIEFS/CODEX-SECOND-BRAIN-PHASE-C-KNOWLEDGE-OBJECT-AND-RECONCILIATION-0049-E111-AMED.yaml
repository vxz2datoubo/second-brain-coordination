mission_intent:
  root_goal: >-
    Implement PHASE_C of the GPT Second Brain Knowledge Digestion skill: KnowledgeEpisode/KnowledgeAtom schema compatible with W3,
    12-action ReconciliationEngine with audit log and rollback, GraphEvolutionManager, compatibility migration from existing Memory Palace atoms,
    20+ synthetic tests, and 5 human-readable Markdown templates. This is the knowledge object and reconciliation layer that sits atop
    the R109-accepted Memory Palace foundation.
  user_capability_outcome: >-
    GPT can digest any input into source-anchored atomic knowledge, reconcile it against existing knowledge before writing (rather than
    blind append), maintain a conflict-aware evolution graph, and render human-readable notes. All operations are auditable and rollbackable.
  success_condition: >-
    20 reconciliation tests pass (>=95% accuracy), atomization quality tests pass, graph consistency tests pass, zero scope leakage,
    temporal reasoning correct, compatibility migration works, all 5 Markdown templates render, and existing 246 Phase 3 regression tests still pass.
  stop_condition: >-
    Any need for live GPT bridge (PHASE_D), production deployment, real private data write, trading system integration,
    formal skill promotion (PHASE_G), or modification of W3 canonical structure.
