required_behavior:
  numeric:
    - "canonical decimal parsing rejects float input where precision provenance would be lost"
    - "tick quantization is explicit and deterministic"
    - "unit conversion is explicit, never implicit"
  direction:
    - "vendor enum mapping is source/version bound"
    - "UNKNOWN direction remains UNKNOWN"
  temporal:
    - "event_time/exchange_time/published_at/available_at/ingested_at are distinct semantic roles"
    - "available_at cannot be silently substituted from another clock"
  missingness:
    - "missing, zero, stale, not-applicable and entitlement-unverified are distinguishable"
  capability:
    - "OFFICIAL_DOCUMENTED, LOCAL_RUNTIME_VERIFIED and other evidence states are separate"
    - "new official docs do not overwrite old local observations"
  drift:
    - "typed drift report instead of generic data error"

