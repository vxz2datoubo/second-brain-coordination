  frozen: true

objective: >-
  Build one recoverable and idempotent durable lifecycle in which every applied transition can be safely identified and resumed after response loss or restart,
  all claim/lease cross-record mutations are journaled and reconciled, legacy positive bypasses remain closed, and exact tested-head plus receipt-head Python 3.11/3.13 CI is verified before completion.

required_results:
  - "Persist or deterministically recover the exact authority needed after EFFECT_AUTHORIZED and TERMINAL_ATTESTED; no critical authorization may exist only in a function return value."
  - "Return an ALREADY_* recovery result for an identical already-applied request and reject any state-matched but request-mismatched replay."
  - "Journal effect authorization, claim invocation attach, lease invocation attach, terminal attestation, claim terminal CAS and lease terminal commit."
  - "Reconcile every partial cross-record state without repeating an already-applied mutation."
  - "Retain fail-closed legacy effect, direct invocation and direct finalize entrypoints."
  - "Retain verifier-minted synthetic Manual App, Automation and CLI identity binding without claiming a production trust root."
  - "Add mutation-backed tests for post-apply response loss at every positive lifecycle stage."
  - "Use exact-head PR/push CI on Python 3.11 and 3.13 at the tested and receipt heads."
  - "Create a pre-receipt validator that rejects missing CI, wrong SHA, placeholders, incomplete stage coverage and invalid receipt topology."

architecture_constraints:
  states:
    - "CAPABILITY_ATTESTED"
    - "EFFECT_AUTHORIZED"
    - "CLAIM_INVOCATION_ATTACHED"
    - "LEASE_INVOCATION_ATTACHED"
    - "TERMINAL_ATTESTED"
    - "CLAIM_TERMINAL_COMMITTED"
    - "LEASE_TERMINAL_COMMITTED"
  journal_binding:
    - "request_digest"
    - "purpose"
    - "lease_id"
    - "claim_id"
    - "provenance_digest"
    - "storage_id"
    - "holder"
    - "target"
    - "task_id"
    - "route_epoch"
    - "invocation_id when available"
    - "terminal evidence digest when available"
  idempotency_rule: >-
    An identical request against an already-applied stage must produce a stable recoverable result without a second mutation.
    A different request against that stage must fail closed.

mandatory_negative_families:
  - "effect authorization CAS applied then response lost"
  - "claim invocation CAS applied then response lost"
  - "lease invocation CAS applied then response lost"
  - "terminal attestation CAS applied then response lost"
  - "claim terminal CAS and lease terminal commit response loss"
  - "cross-claim, cross-route, cross-holder, cross-target, cross-invocation and cross-evidence replay"
  - "journal phase skip, repeat, reversal, purpose substitution and record tampering"
  - "deleted or substituted durable request digest"
  - "legacy effect, direct attach and direct finalize bypass attempts"
  - "caller-cloned Manual App, Automation and CLI identity fields"
  - "workflow merge-ref checkout or wrong exact SHA"
  - "receipt attempted before green tested-head CI"

