schema_version: "1.0"
record_type: "AMEDTaskBrief"
task_id: "CODEX-D2-EVALUATION-V2-CONTROLLED-VIOLATION-TRACE-PROVENANCE-AND-EVIDENCE-PRESERVATION-CLOSURE-0017-E25"
issue_or_pr: "Issue #23 / Draft PR #106"
assigned_agent: "CODEX"
mode: "target"
mode_reason: >-
  E24 produced a reusable execution-derived catalog base and valid Python 3.11/3.13 CI,
  but independent review found one bounded correctness cluster: named invariant failure
  oracles are simulated by boolean inversion rather than exercised on controlled violating
  artifacts, some signature inputs are reconstructed separately from the exact execution
  trace, and the completion receipts erase prior evidence while omitting mandatory lease fields.
task_weight: "STANDARD"

mission_intent:
  fundamental_goal: >-
    Turn every named invariant into a genuinely executable positive-and-negative contract,
    bind every catalog signature to the exact artifact and relation actually executed, and
    publish a complete, cumulative, freshness-verifiable E25 evidence package.
  user_capability_outcome: >-
    Provide a Gate B evaluator whose coverage cannot be manufactured by metadata, boolean
    self-certification, duplicated signature formulas, or abbreviated receipts.
  current_state_to_change: >-
    E24 tested head b708dee derives several signatures from runtime objects and truthfully
    reduced duplicate counts, but `_invariant_oracle(predicate, False)` always returns true
    for registered predicates without constructing or evaluating a controlled violation.
    E24 receipt head 3dd2bf also omits mandatory completion fields and replaces cumulative
    research, discovery, unknown and improvement records with short stubs.
  causal_mechanism:
    - "Register each predicate with one executable predicate function, one controlled violation constructor, and one failure oracle that inspects the resulting artifact."
    - "Run the positive fixture and the controlled violating artifact through the actual predicate; require true then false and require predicate-specific failure evidence."
    - "Retain the exact executed artifacts used for outcome checks and derive signatures from those same objects rather than re-running or duplicating constructor formulas."
    - "Preserve historical E22-E24 evidence while appending E25 records and satisfy every lease-protocol completion field with immutable external anchors."
  success_criteria:
    - "All ten predicate families have executable positive and controlled-negative evidence; no oracle may accept a caller-supplied boolean as proof."
    - "Every one of the 80 invariant rows dispatches a registered predicate and maps to a real controlled violation case whose named oracle detects the intended breach."
    - "Counterfactual, episode and other catalog signatures are derived from the exact executed objects and observed relations used for evaluation, without a duplicated parallel formula."
    - "Identity-only changes remain duplicate; behaviorally consumed input or observed-relation changes produce distinct signatures."
    - "E24 truthful counts, eight E23 source mutations, eight metamorphic properties, inherited D1/D2 tests, clean-archive determinism and Python 3.11/3.13 CI remain green."
    - "E25 completion evidence contains all lease-protocol fields, per-command exits and hashes, per-seed archive evidence, CI job anchors, preserved failures/SKIP/UNKNOWN and cumulative ledgers."
    - "Exactly one corrective substantive tested commit and one E25 receipt-only commit descend from 3dd2bf116d018a2dfa132cdbb22de5fd11547d61."
  failure_conditions:
    - "A failure oracle is implemented as `not predicate_passed`, a constant, metadata lookup or caller assertion rather than evidence from a violating artifact."
    - "A signature is derived from a formula or re-execution that is not the exact artifact used for the corresponding outcome."
    - "Any historical negative result, UNKNOWN, discovery or implemented improvement is deleted or silently replaced."
    - "Any mandatory completion field, exact command, exit code, stdout/stderr hash or immutable external receipt anchor is absent."
    - "E23/E24 accepted reusable behavior is weakened, or production/later-gate scope is entered."
  stop_conditions:
    - "Remote main route, task ID, epoch, PR, branch, completion signal or execution permission changes."
    - "PR #106 head at lease claim is not 3dd2bf116d018a2dfa132cdbb22de5fd11547d61."
    - "A real controlled violation cannot be built without modifying production D2 or another owner's system of record."
    - "Any secret, private data, licensed capture, real market input, account, order or trading surface is encountered."
    - "A required fix needs Gate C/D, a canonical schema migration or a second active Codex line."

