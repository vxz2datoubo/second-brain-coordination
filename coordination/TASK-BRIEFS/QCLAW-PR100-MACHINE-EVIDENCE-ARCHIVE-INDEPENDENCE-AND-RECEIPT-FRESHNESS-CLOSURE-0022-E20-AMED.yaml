  - "Generate TEST-RUN-RECEIPT from that exact result artifact; validator must compare complete ID sets, outcomes, counts and hashes and reject missing/extra/duplicate cases, placeholders, truncated hashes and absent result files."
  - "Create three different temporary directories by git archive of the exact substantive tested commit. Record archive command/hash, extraction root, tested commit, PYTHONHASHSEED, exact generator/validator/runner commands, exits and full stdout/stderr SHA-256."
  - "Archive validation must require three distinct canonicalized roots, the exact same 40-character tested commit, three process seeds, full 64-hex hashes, and byte-identical declared canonical artifacts."
  - "Validate PERSON-EVIDENCE-AUDIT against the exact 99-source atom set: one unique row per source deterministic_id and atom_index, exact count fields, boolean person_bearing, non-empty rationale, and person metadata rules. Add a mutation that removes atom 39/69/72 from the audit itself, not merely quarantine."
