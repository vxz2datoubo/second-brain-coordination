blocking_findings:
  - id: "E20-B01-TRACKED-RUNNER-IS-STILL-E18-AND-NOT-40-ADVERSARIAL-CASES"
    severity: "BLOCKER"
    evidence: >-
      run_production_tests.py is unchanged in the E19 substantive diff, identifies itself as E18, counts a clean
      baseline and other non-adversarial assertions, and still expects 15 quarantined atoms. E19 did not deliver
      the required >=40 distinct production-entry mutations.
  - id: "E20-B02-MACHINE-RESULT-FILE-ABSENT-AND-RECEIPT-PLACEHOLDERS"
    severity: "BLOCKER"
    evidence: >-
      TEST-RUN-RECEIPT.md references e19_test_results.json, but no tracked file exists. Rows contain abcd/bcde/var
      placeholders and summarize only T01-T16 while claiming machine generation.
  - id: "E20-B03-RECEIPT-VALIDATOR-DOES-NOT-VALIDATE-RESULTS"
    severity: "BLOCKER"
    evidence: >-
      validate_adapters.py checks only marker text and whether the runner SHA appears in the receipt. It does not
      parse a result artifact, compare complete case IDs/outcomes, validate stdout/stderr hashes, or reject placeholders.
  - id: "E20-B04-D05-IS-NOT-THREE-INDEPENDENT-GIT-ARCHIVES"
    severity: "BLOCKER"
    evidence: >-
      All three D05 rows use the same root path, commit is TBD_TESTED_COMMIT, commands contain ellipses, and stdout/stderr
      values are 32 hex characters rather than full SHA-256. No extraction provenance exists.
  - id: "E20-B05-D05-VALIDATION-CHECKS-FIELDS-NOT-TRUTH"
    severity: "BLOCKER"
    evidence: >-
      The validator checks only the seed set and presence of six fields. It does not require distinct roots, exact tested
      commit, git archive extraction, full hash format, command identity, or byte-identical canonical artifacts.
  - id: "E20-B06-PERSON-AUDIT-CAN-OMIT-SOURCE-ROWS"
    severity: "BLOCKER"
    evidence: >-
      The validator treats PERSON-EVIDENCE-AUDIT as authority but does not prove exactly 99 unique atom indexes and IDs,
      exact equality with the source atom set, declared count consistency, rationale completeness, or source-derived
      person-bearing evidence. An omitted person row can still disappear from both audit and quarantine.
  - id: "E20-B07-D2-LOCK-DOES-NOT-VERIFY-SIZE-OR-COMMIT"
    severity: "BLOCKER"
    evidence: >-
      Validator checks a snapshot hash but does not bind SOURCE-LOCK commit and size, and duplicates subtype-family truth
      in Python rather than deriving the complete locked interface contract.
  - id: "E20-B08-AMBIGUITY-SOURCE-AND-FAMILY-COMPATIBILITY-INCOMPLETE"
    severity: "BLOCKER"
    evidence: >-
      Distinct subtype/basis is checked, but source_refs are not validated and evidence_family is not mechanically mapped
      to and compared with each hypothesis's subtype family.
  - id: "E20-B09-PACKAGE-MANIFEST-COMPLETENESS-NOT-PROVEN"
    severity: "BLOCKER"
    evidence: >-
      Validator verifies only whatever artifact_hash_size_manifest entries are present. It does not compare against an
      exact required artifact set; pkg_hash_actual is computed but unused.
  - id: "E20-B10-E17-E18-HANDOFFS-REMAIN-ACTIVE-AND-CONTRADICT-E19"
    severity: "BLOCKER"
    evidence: >-
      AI_HANDOFF.yaml and QUALITY-GATE-REPORT.md still claim E18, 15 quarantined atoms and 54 tests; SUPPLY-CHAIN-HASH-VERIFICATION.yaml
      remains E17 and reports 39 tests and stale hashes. The E19 receipt commit changed only three of six declared receipt surfaces.
  - id: "E20-B11-COMPLETION-FRESHNESS-PACKET-MISSING"
    severity: "BLOCKER"
    evidence: >-
      Completion comments and receipts omit the required two remote-main heads, full command ledger, full 40-character
      tested/receipt anchors, complete case outcomes, failures/SKIP/UNKNOWN and cumulative AMED records.
  - id: "E20-B12-GREEN-CI-IS-UNRELATED"
    severity: "BLOCKER"
    evidence: >-
      Workflow run 30572371886 is green on Python 3.11/3.13 but its jobs run Phase 3 tests and public scan, not PR #100's
