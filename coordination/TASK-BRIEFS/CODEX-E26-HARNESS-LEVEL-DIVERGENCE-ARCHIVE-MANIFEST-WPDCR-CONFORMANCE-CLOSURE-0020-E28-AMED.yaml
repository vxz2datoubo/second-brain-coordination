mission_intent:
  fundamental_goal: >-
    Close the last evidence gaps without redoing accepted E27 bridge work: prove a real harness-level specification/execution
    disagreement, make archive independence auditable per extracted root and per artifact, and deliver a validator-enforced cumulative
    WPDCR report that exactly follows the permanent enterprise contract.
  accepted_reusable_base:
    - "Canonical remote bridge and cause classification as local tracking lag."
    - "Unchanged E26 substantive commit b45ab1 and receipt commit 07ce7e."
    - "Exact-branch workflow_dispatch run 30590950622 on Python 3.11 and 3.13."
    - "Direct object inspectors for HAS_EPISODE, NONEMPTY_EVENTS and STEP_MONOTONIC."
    - "Portable ZIP archive execution carrier and preserved merge-SHA negative evidence."
  defects_to_close:
    - "The existing misleading_spec test is not passed through run_evaluation or execute_counterfactual and therefore is not a real harness-level disagreement."
    - "Counterfactual signature provenance still needs an explicit test showing formula/spec-only changes cannot alter the signature while the executed artifact is held fixed."
    - "Archive evidence lacks root identity/path hashes and per-artifact hash/size equality."
    - "receipt_validation.py does not enforce archive root/artifact schema or exact WPDCR sections."
    - "E26-WORK-PROCESS-AND-COORDINATION-REPORT.yaml is a flat custom summary rather than the mandatory enterprise section structure."
  observable_success:
    - "A real harness-level test injects disagreement into the formula/specification source while holding the actual execution artifact fixed; signature follows execution only."
    - "Changing only unused labels/formula fields cannot change the catalog signature; changing actual consumed input or observation must change it."
    - "Three extracted archive roots have unique identities, exact tested commit, full root-contained commands, exits, stream hashes and per-artifact hash/size manifests."
    - "Completion validator rejects missing root identity, artifact drift, wrong signal, wrong runtime matrix and any missing WPDCR mandatory section."
    - "Python 3.11 and 3.13 exact-branch CI runs all new E28 tests and archive proof."
  stop_conditions:
    - "A fix would require changing Gate, production authority, real data or another Agent's surface."
    - "The real execution artifact cannot be isolated from specification input without a new architecture; report D3 and exact proposal instead of faking proof."

