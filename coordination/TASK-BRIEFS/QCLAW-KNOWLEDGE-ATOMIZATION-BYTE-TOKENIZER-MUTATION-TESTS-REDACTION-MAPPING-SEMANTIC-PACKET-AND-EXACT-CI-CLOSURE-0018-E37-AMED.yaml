hard_invariants:
  - "Production entry accepts bytes and rejects invalid strict UTF-8 before parsing."
  - "All character positions are converted through verified codepoint-to-byte mapping before span creation."
  - "Every source byte has exactly one ledger owner; zero-length owner, overlap, omission, duplicate, out-of-range, inverted and illegal-boundary fail closed."
  - "JSON uses an original-position tokenizer/parser and preserves duplicate keys, escapes, order, punctuation and whitespace."
  - "Redaction emits irreversible original-byte to redacted-view mapping with explicit priority and longest-match resolution, and persists no secret text/hash/fingerprint."
  - "No semantic relation is inferred from proximity, adjacency, type pairing or co-occurrence."
  - "Canonical packet hashes all semantic and safety-relevant fields without self-reference."
  - "Tests use unittest or pytest test cases; custom chk counters, hardcoded true, or-true, vacuous predicates and no-crash gates are forbidden."
  - "All subprocesses validate return code, stderr and structured non-empty stdout."
  - "Completion requires E37 exact-head CI on tested and receipt heads plus Python 3.11/3.13 three-seed byte-identical artifacts."

