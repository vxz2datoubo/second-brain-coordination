required_results:
  - "Strict UTF-8: reject or quarantine invalid input; never errors=replace in authoritative paths."
  - "No silent deletion or truncation. Short units, headings, code fences and long content must be preserved, split with lineage, or fail closed."
  - "Support Markdown, TXT, JSON, JSONL and conversation-like records with structure-aware adapters; unsupported formats must be explicit."
  - "Every atom must carry path-independent source identity plus exact source commit/blob/hash and line/byte spans."
  - "Populate subject/predicate/object, scope, time scope, premises, conditions, exceptions, negations, failure conditions, counterexamples, authority and verification fields where source semantics support them."
  - "Do not infer fact/causality/authority merely from lexical markers; preserve CLAIM/OPINION/HYPOTHESIS/UNKNOWN distinctions."
  - "Canonical outputs must be byte-identical across repeated runs, different temporary roots, PYTHONHASHSEED values and Python 3.11/3.13. Wall-clock metadata must be excluded from semantic identity or supplied as a separately bounded run envelope."
  - "Packet ID and content hash must cover the full canonical semantic payload: atoms, relations, conflicts, UNKNOWNs, lineage and authority fields."
  - "Normal queue execution must emit non-empty source manifest IDs and immutable source references."
  - "Use span-based redaction without global replace; never persist raw secrets or secret-derived hashes; test repeated, overlapping and mixed secret patterns."
  - "Digest at least one real public-safe repository source from an exact commit/blob, not a task-authored explanatory fixture."
  - "Add adversarial tests for short critical statements, >8000-char content, code fences, numbered lists beyond 3, multilingual text, invalid UTF-8, path relocation, timestamp drift, relation/hash mutation, duplicate/conflict/UNKNOWN retention and redaction overlap."
  - "Create a pull-request/exact-head CI workflow for Python 3.11 and 3.13; prove canonical outputs identical across at least three isolated roots."
  - "Final topology: final tested substantive head followed by exactly one non-empty evidence-only receipt; receipt parent equals tested head; validate receipt head; no later commit."

