implementation_requirements:
  source_binding:
    - "repository slug + exact source commit + source path are mandatory on every observation"
    - "bind PROJECT_INDEX authority and relevant schema/version identifiers when available"
    - "source drift between observation and projection invalidates the receipt or forces a new observation"
    - "no branch-name-only or latest-without-SHA evidence"
  read_only_adapter:
    - "one-shot read-only source adapter; no daemon, polling loop, webhook or scheduler"
    - "external source commands/providers expose read operations only"
    - "no git push, GitHub mutation API, branch/issue/PR/comment/label/file/settings writes to AI Film"
    - "existing read credentials may be used only for read access and may never be persisted or logged"
    - "task-owned temp clone/cache must be cleaned"
  authority_and_privacy:
    - "AI Film PROJECT_INDEX remains source authority"
    - "Signal Tower is observation/projection only, never film-domain write authority"
    - "do not persist full screenplay/character/map/assets/director canonical bodies"
    - "persist metadata, IDs/status, hashes, locators and opaque refs only unless a field is explicitly public-safe-to-project"
    - "no private ChatGPT conversation/message ingestion"
    - "no W3 write or Formal Skill promotion"
  backlog_projection:
    - "derive state only from mechanically observed source evidence"
    - "supported shadow states: COMPLETED, ACTIVE, PENDING, BLOCKED, UNKNOWN, REGRESSION, LEARNING, RESEARCH, USER_REQUESTED"
    - "UNKNOWN remains UNKNOWN; missing data must not be guessed"
    - "omission is not revocation"
    - "status transitions preserve provenance and prior history"
    - "duplicate observations are idempotent"
    - "AI_FILM_DOMAIN_BACKLOG_BOOTSTRAP_REQUIRED is mechanically produced when required coverage is incomplete or stale"
  second_brain_self_observation:
    - "read current main/route/work-claim/program-lane refs without mutating them"
    - "exercise CROSS_WINDOW_STATE_DRIFT against real current control-plane identities"
    - "stale snapshot must fail closed rather than silently refresh an accepted decision"
  replay:
    - "shadow projection deterministic replay/checksum"
    - "same bound source snapshot yields same effective shadow output"
    - "changed source commit yields changed fingerprint/receipt and never silently overwrites lineage"

