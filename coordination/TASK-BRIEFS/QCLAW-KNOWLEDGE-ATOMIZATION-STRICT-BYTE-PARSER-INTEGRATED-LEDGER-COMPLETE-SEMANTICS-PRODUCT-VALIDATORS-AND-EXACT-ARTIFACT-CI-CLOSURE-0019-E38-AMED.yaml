hard_invariants:
  - "Every byte-scanning loop advances monotonically or terminates with a structured error; 0xED and all malformed UTF-8 have timeout-backed rejection tests."
  - "EOF exclusive byte/codepoint boundaries are represented correctly without clamping to the final codepoint."
  - "Every source byte has exactly one ledger owner; no adapter byte is silently skipped."
  - "JSON is a grammar-validating original-position parser preserving duplicate keys/values, escapes, punctuation, order and whitespace."
  - "JSONL malformed or unterminated records become explicit UNKNOWN_ERROR ownership."
  - "Conversation field roles are established by verified field identity and have separate role/time/metadata/boundary/body spans."
  - "Redaction application is source-span ordered, replacement spans are recorded during output construction and complete private-key blocks are removed."
  - "Secret-bearing packets persist no original source hash or secret-derived fingerprint."
  - "Atoms include all seven required semantic fields, safe redacted content and exact original spans."
  - "Relations require executable evidence validation; a caller-supplied label alone cannot mint a relation."
  - "Canonical packet hashes complete ledger, exact gaps, mappings, semantic fields, full endpoints/evidence, unknowns, conflicts, safe lineage and nonempty config."
  - "Completion requires actual exact-head tested and receipt CI with byte-identical canonical artifacts."

