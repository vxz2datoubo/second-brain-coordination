mandatory_blocker_b02_lossless_migration:
  - mechanically validate each genuine predecessor v1 event/patch against predecessor semantics
  - map only to current v2 transitions without weakening current SceneGraph behavior
  - after applying predecessor and mapped v2 semantics, compare relationships, known_facts, risk_level, and flags mechanically
  - any divergence is LOSSY_UNREPRESENTABLE and MUST fail closed
  - genuine v1 sequence listen -> approach -> leave MUST fail closed because mapped current echo_knock adds flags.clue=heard
  - do not remove or weaken current v2 echo_knock clue=heard semantics
  - failed migration MUST leave original legacy session.json bytes byte-for-byte unchanged
  - failed migration MUST create no shadow/default/new save artifact
  - retain at least one genuine lossless positive terminal path, including canonical approach -> listen if verified lossless
  - positive terminal bridge MUST remain typed, source-bound, deterministic and replay-verifiable and cannot be forged/reused as a template

carry_forward_required:
  - caller-minted or recomputable-hash state_patch fails closed before SaveStore load, timeline, DirectorSequence/continuity and review packet consumption
  - append-only hashes are integrity evidence only and never mint state authority
  - forged typed migration provenance and copied bridge provenance fail closed
  - migration receipt/history/provenance persists across continued play, choose, say, repeated save, slot save, slot load and restore
  - native v2 session is never falsely marked migrated
  - wrong transition id, wrong resulting_patch, unknown action and second/post-prefix bridge attempts fail closed
  - no second Ledger/Gateway/Resolver/Authority or canonical knowledge source

