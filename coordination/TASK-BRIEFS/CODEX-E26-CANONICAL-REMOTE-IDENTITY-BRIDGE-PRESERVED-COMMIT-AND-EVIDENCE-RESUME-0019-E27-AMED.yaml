mission_intent:
  fundamental_goal: >-
    Resolve the canonical-remote identity split without discarding or rewriting the preserved E26 substantive commit; make the
    implementation remotely inspectable, run governed dual-Python CI, and close E26 only with exact immutable evidence.
  user_capability_outcome: "A reliable read-task flow that cannot be derailed by a stale or wrong local origin and preserves real work."
  current_state_to_change: >-
    Canonical GitHub main publishes E26, local origin/main reported E24, local commit b45ab1... is unpushed, and no remote E26 code or CI
    can yet be independently reviewed.
  causal_mechanism:
    - "Verify canonical repository identity separately from the local remote name."
    - "Fetch/read canonical main through an exact URL or approved connector and bind the route to that source."
    - "Prove the local commit parent/tree/paths, push it unchanged, then let remote CI and GPT inspect it."
  observable_success:
    - "Canonical and local remote identities are machine-recorded with redacted URLs and full SHAs."
    - "Preserved commit b45ab1e27b066edfdf8354c580702406bc4a49ae is pushed unchanged to PR #106."
    - "Its parent remains e06f58944723ed4d2bc22c3fe30862f69091fef4 and tree remains c4e3ad8987273ea569dc0ee79928245f312561f3."
    - "Relevant Python 3.11/3.13 CI executes E26 and exact-commit archive proof."
    - "One receipt-only commit and correct PR/Issue full-SHA anchors complete the route."
  failure_conditions:
    - "Any reset, rebase, amend, force push or silent recreation of b45ab1."
    - "Canonical remote identity remains unverified."
    - "Pushed commit differs from the preserved local SHA/tree/parent."
    - "CI does not execute the E26 paths or archives."
  stop_conditions:
    - "Canonical remote cannot be authenticated/read after exact URL and connector/API checks."
    - "The preserved commit has unexpected parent, tree, paths or safety-boundary changes."
    - "Dual-Python CI fails; report without creating a completion receipt."

