fundamental_rule: >-
  A durable positive transition is incomplete unless every possible hard-crash cut between record mutation and journal mutation is reconciled from actual durable state after restart, without relying on an exception handler and without a second business mutation.

required_results:
  - "Build an explicit effect/invocation record-journal state matrix and reconcile every legal partial combination."
  - "Prove hard process death after durable CAS and before journal CAS using isolated process fault injection."
  - "Complete missing BINDINGS_VERIFIED, CLAIM_MUTATION_APPLIED and LEASE_MUTATION_APPLIED journal phases from actual durable claim/lease state."
  - "Reject changed purpose, request digest, holder, target, invocation, provenance, route, time or expired recovery."
  - "Implement a product release verifier that binds canonical route/task brief, git graph, tested/receipt topology and completed GitHub provider runs/jobs/artifacts."
  - "Invoke receipt topology, placeholder/forbidden-content, required evidence-family and reproduction-command validators."
  - "Use a non-self-referential receipt identity design and place actual receipt/provider identities in GPT's post-commit review record."
  - "Record tested-head run/job/artifact IDs, names, head SHAs and digests in the receipt without future placeholders."
  - "Run active mutations for hard-crash gaps, provider substitution, skipped topology, placeholder injection and invalid reproduction commands."
  - "Obtain E49 exact-head Python 3.11/3.13 tested and receipt CI before requesting final review."

hard_crash_matrix:
  effect:
    - "journal REQUESTED or BINDINGS_VERIFIED; lease CAPABILITY_ATTESTED"
    - "journal BINDINGS_VERIFIED; lease EFFECT_AUTHORIZED"
    - "journal LEASE_MUTATION_APPLIED; lease EFFECT_AUTHORIZED"
  invocation:
    - "journal BINDINGS_VERIFIED; claim invocation absent; lease EFFECT_AUTHORIZED"
    - "journal BINDINGS_VERIFIED; claim invocation present; lease EFFECT_AUTHORIZED"
    - "journal CLAIM_MUTATION_APPLIED; claim invocation present; lease EFFECT_AUTHORIZED"
    - "journal CLAIM_MUTATION_APPLIED; claim invocation present; lease INVOCATION_ATTACHED"
    - "journal LEASE_MUTATION_APPLIED; claim invocation present; lease INVOCATION_ATTACHED"
  recovery_rule: "Derive the sole legal next action from actual claim, lease and journal facts; only fill missing phases; never repeat a business mutation."

