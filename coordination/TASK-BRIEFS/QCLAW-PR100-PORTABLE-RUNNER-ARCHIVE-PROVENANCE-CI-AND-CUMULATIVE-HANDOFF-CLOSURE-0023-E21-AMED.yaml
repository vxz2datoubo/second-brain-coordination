mission_intent:
  fundamental_goal: >-
    Convert E20's locally useful test ledger into independently replayable Gate-B evidence that runs from the exact archived commit,
    on clean paths and dual Python CI, while preserving cumulative truth about the work process, failures, discoveries and UNKNOWNs.
  user_capability_outcome: >-
    GPT can replay QQ's generator, validator and adversarial cases without the author's old workspace, verify three independent
    archives, and understand exactly what remains candidate-only before any later gate.
  current_state_to_change: >-
    E20 has 42 machine-recorded cases and a D2 commit/hash/size lock, but `run_production_tests.py` hard-codes the previous local
    workspace, Q0 source directory and QClaw Python executable. D05 records only seeds and exits, not roots, commit, commands or
    hashes. Workflow run 30580735871 is green without an E20 runner/validator step. Several cumulative evidence files were not updated.
  causal_mechanism:
    - "Relative paths, CLI inputs and sys.executable remove dependence on one local installation."
    - "Exact-commit archive roots prove the tests consume the archived tree rather than an external workspace."
    - "Relevant Python 3.11/3.13 CI prevents local-only evidence from masquerading as portable evidence."
    - "Cumulative WPDCR and handoff files preserve difficulties, failed attempts and coordination needs."
  observable_success:
    - "Runner contains no hard-coded user/workspace/Python absolute paths."
    - "Three distinct archive roots from the exact tested commit run generator, validator and the 42-case suite successfully."
    - "Python 3.11 and 3.13 CI visibly execute the QCLAW E21 commands."
    - "D05 and receipts contain exact commit, roots, commands, exits and full hashes."
  success_criteria:
    - "All E21 route gates pass with no placeholders or stale E17-E20 active claims."
    - "E20's 42 cases and source-lock improvements remain reusable and are exactly reconciled."
  failure_conditions:
    - "Any replay relies on an external old workspace or executable."
    - "Archive roots, tested commit, commands or hashes are not mechanically recorded."
    - "CI remains unrelated to PR #100."
    - "Cumulative process, difficulty, discovery, UNKNOWN or coordination truth is omitted."
  stop_conditions:
    - "A route/base/branch/ownership mismatch."
    - "Private knowledge, credentials, restricted sources, real data or later-gate authority is required."
    - "Evidence cannot be reproduced truthfully within authorized scope."

