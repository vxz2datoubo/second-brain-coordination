implementation_requirements:
  transport:
    - "fixed https://api.github.com host and allowlisted GET endpoint templates only"
    - "public repository resources only; no token/credential/private repo support"
    - "versioned GitHub REST header and explicit response schema handling"
    - "redirect rejection, bounded timeout/size, media type and strict JSON validation"
    - "serial requests only; no nested/concurrent network pool"
    - "complete pagination required where applicable"
  object_binding:
    - "main -> commit/tree -> required path/blob/content digest exact binding"
    - "recompute Git blob identity/content digest where bytes are observed"
    - "first/final main recheck"
    - "PR state/head/base/merged/merge-commit first/final recheck when PR is in scope"
  evidence:
    - "LiveObservationEvidenceBundle binds provider code ref/digest, request, observation, exact objects, completeness, freshness and invalidation"
    - "compact proof references evidence bundle identity/digest"
    - "caller-authored compact proof without provider evidence remains UNVERIFIED"
    - "unknown provider id fails closed"
  review_boundary:
    - "fetch complete review pages"
    - "record raw review id/state/commit_id/submitted_at/actor refs"
    - "provider does not decide whether review is governance-acceptable"
  control_plane:
    - "bind exact route, Work Claim, Program Lane, lease/Control Tower, domain freshness and approval/revocation state"
    - "provider is evidence-only and never grants execution or merge"
  provider_registration:
    - "no caller-accessible production verifier/provider registration API"
    - "test-only injection seam must remain test-only"
    - "same-process Python isolation limitation must remain explicit"
  bootstrap:
    - "R137 implementation may consume only the one-time canonical ROOT_PROVIDER_BOOTSTRAP receipt"
    - "receipt must match task/epoch/route/claim/scope/expiry and explicit release"
    - "bootstrap cannot satisfy ordinary live-observation proof validation"
    - "after provider acceptance bootstrap must be consumed/retired and replay-tested"

