objective: >-
  Rebuild the atomization pipeline from strict original UTF-8 bytes so every byte has exact-once ownership,
  every redaction and semantic relation has truthful source evidence, every rejection gate is an executable product validator,
  and Python 3.11/3.13 produce byte-identical canonical artifacts under three hash seeds.

required_stages:
  - id: S0
    name: "original_byte_contract"
    acceptance:
      - "Public entry accepts bytes and rejects invalid UTF-8."
      - "All spans are in range, ordered, legal UTF-8 boundaries and slice back exactly."
      - "Character parser positions are converted through an explicit codepoint-to-byte map."
  - id: S1
    name: "exact_coverage_ledger"
    acceptance:
      - "Every source byte belongs exactly once to ATOM_CANDIDATE, STRUCTURE or UNKNOWN_ERROR."
      - "Overlap, omission, duplicate ownership, out-of-range and illegal-boundary spans fail closed."
      - "No percentage clamp or automatic gap filling may turn invalid coverage into success."
  - id: S2
    name: "lossless_adapters"
    acceptance:
      - "Markdown, TXT, JSON, JSONL and conversation preserve actual bytes, delimiters, ordering and line endings."
      - "JSON uses a position-aware tokenizer/parser, not find or json.dumps reconstruction."
      - "JSONL never synthesizes a final newline and malformed lines are UNKNOWN_ERROR."
  - id: S3
    name: "redaction_and_safe_lineage"
    acceptance:
      - "All redaction candidates are collected before deterministic overlap resolution."
      - "Serializable output contains no secret text, secret-derived hash/fingerprint or reversible replacement."
      - "Original-byte span to redacted-view span mapping and redaction coverage are explicit."
  - id: S4
    name: "atoms_relations_packet"
    acceptance:
      - "Atom source spans remain exact while redacted content is stored separately."
      - "No short text, structure or unknown region is silently dropped."
      - "Relations require explicit link syntax, rule identity, human confirmation or parser-verifiable structure; adjacency and type pairing produce zero relations."
      - "Canonical packet hashes coverage, semantic fields, relations/evidence, redaction mapping, unknowns, conflicts, safe lineage and configuration."
  - id: S5
    name: "executable_validators"
    acceptance:
      - "Product validators reject unsafe paths, invalid/placeholder/short SHA, self-reference, Base64 wrapping, unexplained bytes, overlap, secret fingerprint and incomplete packet."
      - "Tests call validators and assert concrete failures; no hardcoded true, fixture self-check or no-crash gates."
  - id: S6
    name: "exact_remote_evidence"
    acceptance:
      - "Use a real test framework and check all subprocess return codes, stderr and nonempty outputs."
      - "PR and branch-push workflow checks out and asserts the exact event head."
      - "Python 3.11 and 3.13 each generate artifacts under seeds 0, 1 and 42; a separate compare job verifies byte identity."
      - "Both substantive and receipt heads have verifiable successful jobs and artifact comparison."

