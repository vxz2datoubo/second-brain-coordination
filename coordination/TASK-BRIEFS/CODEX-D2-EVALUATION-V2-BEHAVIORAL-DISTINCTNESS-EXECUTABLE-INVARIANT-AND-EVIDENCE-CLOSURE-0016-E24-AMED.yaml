mission_intent:
  fundamental_goal: >-
    Make every counted Evaluation V2 case represent a distinct executable input-plus-relation behavior,
    and make every invariant row execute its declared predicate and failure oracle.
  user_capability_outcome: >-
    Provide a trustworthy synthetic evaluation gate that cannot gain coverage credit from IDs,
    unused metadata, collapsed modes, or undeclared oracle behavior.
  current_state_to_change: >-
    E23 provides true SUT mutation, family-specific killers, metamorphic execution and dual-Python CI,
    but catalog distinctness still trusts author-declared metadata and invariant rows are not dispatched
    through their named predicates and failure oracles.
  causal_mechanism:
    - "Construct public executable inputs first, then derive normalized input signatures from consumed fields only."
    - "Derive relation signatures from the actual named predicate/oracle contract and normalized observed result."
    - "Reject duplicate input-plus-relation signatures, orphan rows, unknown predicates/oracles and unexecuted rows."
    - "Use controlled violating fixtures to prove each named failure oracle can detect its intended breach."
  success_criteria:
    - "Every counted scenario, invariant, negative, episode, counterfactual and cross-family row has a unique execution-derived input-plus-relation signature."
    - "Changing only identity fields, slot, unused variant or collapsed mode cannot create new coverage credit."
    - "Every invariant row invokes its named predicate and named failure oracle."
    - "All E23 mutation, metamorphic, inherited D1/D2, archive determinism and Python 3.11/3.13 CI evidence remains green."
    - "Exactly one corrective substantive tested commit and one E24 receipt-only commit descend from c21be383027b2c4ef74a830f4ed394a3f77f3afc."
  failure_conditions:
    - "Any catalog row remains unique only because of an unconsumed or identity-only field."
    - "Any counted row is not executed through its declared behavior and relation oracle."
    - "Any E23 true-SUT mutant, family-specific kill, metamorphic property or inherited regression is weakened or removed."
    - "Delivery changes production D2, later gates, unauthorized PRs or real-data/trading surfaces."
  stop_conditions:
    - "Remote main route no longer matches this task_id and route_epoch."
    - "PR #106 head no longer equals the authorized reviewed/base head before the first E24 commit, unless GPT publishes an explicit route bridge."
    - "A required fix needs production D2, Gate C/D, cross-agent ownership, secrets, real data, accounts, orders or trading."
