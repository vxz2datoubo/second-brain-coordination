  when provenance is genuinely canonical and all existing P0A gates remain clean may DS-10 remove the
  W4_AUTHORITY_BINDING_NOT_IMPLEMENTED_P0A / EXTERNAL_CANONICAL_BINDING_REQUIRED abstention and reach
  ELIGIBLE_FOR_W7_VALIDATION (which must remain != W7 ACCEPT).

step_one_read_surface_inventory:
  - Reconfirm the canonical W4 read binding is present at main 286c67d8 (read_binding.py + registry.py + CANONICAL-W4-STORE.yaml).
  - Confirm DS-10 research_integrity.py currently hard-codes the abstention (finding W4_AUTHORITY_BINDING_NOT_IMPLEMENTED_P0A at UNKNOWN; w4_authority_state = EXTERNAL_CANONICAL_BINDING_REQUIRED; disposition always ABSTAIN).
  - Confirm no second W4 registry / TrialLedger / read-receipt store exists or is needed.

step_two_consumer_adapter:
  - Add a DS-10-owned, READ-ONLY consumer adapter that loads the governed W4 read_binding module by (ref, blob_sha) with byte-level drift verification (same importlib pattern as _load_verified_w2_rule_module) and calls verify_canonical_family_receipt().
