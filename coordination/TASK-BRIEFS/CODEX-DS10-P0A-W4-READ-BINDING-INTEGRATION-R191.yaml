  - Only when the receipt primary is CANONICAL_W4_READ_VERIFIED (or POINTER_ADVANCED) AND the cross-checks pass, mark w4 provenance canonical and remove the abstention.

step_three_abstention_removal_semantics:
  - Remove W4_AUTHORITY_BINDING_NOT_IMPLEMENTED_P0A and set w4_authority_state to a verified-canonical state ONLY when the receipt verifies canonically AND cross-checks pass. Otherwise preserve the existing ABSTAIN behavior exactly.
  - Preserve ELIGIBLE_FOR_W7_VALIDATION != W7 ACCEPT: keep w7_handoff_is_acceptance = False.
  - Preserve all existing P0A gates: trial reconciliation, selection-bias, lockbox, PIT/no-lookahead, method-state. None of these may be relaxed.

step_four_verification:
  - Adversarial tests: caller-supplied expected_w4_snapshot_digest alone must NEVER remove the abstention (preserve test_matching_digest_never_mints_w4_authority); a forged/mismatched receipt must keep ABSTAIN; a non-canonical / wrong-family receipt must keep ABSTAIN; only a genuinely canonical receipt matching the snapshot reaches ELIGIBLE_FOR_W7_VALIDATION.
  - Regression: all existing 45+ P0A tests must still pass.
  - Offline CI: exact-head push run on both 3.11 and 3.13.

