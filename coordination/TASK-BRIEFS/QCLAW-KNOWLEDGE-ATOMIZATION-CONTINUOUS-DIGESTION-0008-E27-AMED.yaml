fundamental_goal: >-
  Build and operate a general knowledge-digestion pipeline that preserves full semantics while decomposing
  authorized source material into minimal complete atoms, typed relations, conflicts, exceptions, counterexamples,
  failure conditions, UNKNOWNs, methods, skills and deterministic LearningPackets. It must perform real digestion,
  not merely publish schemas, while preserving the single canonical Phase-3/W3 memory authority.

priority_state_machine:
  P0: "Atomization architecture defect or blocker -> repair/complete architecture first."
  P1: "Digest queue contains knowledge -> ingest, atomize, verify, package and receipt it."
  P2: "Only when P0 and P1 are empty -> assist a separately authorized system task, then atomize the resulting learning."

first_delivery_scope: "FOUNDATION_RECONCILIATION + RUNNABLE_PIPELINE + FIRST_REAL_DIGEST_BATCH"

required_reading:
  - "Issue #59 full knowledge atomization and continuous digestion charter."
  - "Issue #20 QCLAW knowledge learning engine foundation."
  - "Issue #38 and PR #57 single Phase-3 candidate memory/runtime authority."
  - "coordination/ACTIVE-QCLAW-TASK.yaml"
  - "coordination/ACTIVE-CODEX-TASK.yaml"
  - "Existing KnowledgeAtom, LearningPacket, provenance, conflict and UNKNOWN contracts on main."

required_results:
  - "Non-duplication audit mapping REUSE / EXTEND / ADAPT / DEPRECATE / UNKNOWN against existing W3 and Phase-3 contracts."
  - "KnowledgeSourceManifest, KnowledgeDocument, KnowledgeSegment, KnowledgeAtom, KnowledgeRelation, KnowledgeConflict, KnowledgeUnknown, AtomizationDecision, AtomizationRunManifest, KnowledgeDigestQueue, SecretScanReceipt and LearningPacket compatibility contracts."
  - "Runnable deterministic pipeline for Markdown, TXT, JSON, JSONL and conversation-like fixtures."
  - "Minimum-complete-semantic-unit segmentation that preserves subject, scope, time, premise, condition, exception, negation, failure condition, counterexample and source position."
  - "Typed atom taxonomy covering fact, observation, claim, hypothesis, causal claim, correlation, definition, rule, constraint, unknown, decision, rationale, method, procedure, skill, user correction, temporal update, failure lesson and opportunity."
  - "Typed relation taxonomy preserving SUPPORTS, CONTRADICTS, REFINES, DEPENDS_ON, HAS_CONDITION, HAS_EXCEPTION, FAILS_WHEN, HAS_COUNTEREXAMPLE, SUPERSEDES, RESOLVES_UNKNOWN, RAISES_UNKNOWN, VERIFIED_BY and other non-lossy relations."
  - "Deterministic IDs and semantic hashes unaffected by runtime timestamps or source ordering where semantics are equivalent."
  - "Conflict and supersession/version chains; no silent overwrite of old knowledge."
  - "Secret-value scanner that removes only authentication/access/financial-secret values while retaining the remaining document semantics and producing a redacted receipt without original values."
  - "A real digest queue and first public-safe digest batch drawn from existing repository blueprints, decisions, failure reports or user-authorized project knowledge."
  - "Every first-batch atom traceable to exact source path/location/hash and classified by confidence, authority, verification and knowledge status."
  - "Quality report for overlong/overfragmented atoms, lost conditions/negations/time, causal overreach, fact/opinion confusion, broken lineage, hidden conflict, deleted UNKNOWN, duplicate inflation and secret leakage."
  - "LearningPacket output compatible with the canonical Phase-3 consumer; no new database, fusion engine, QueryPlan or ContextBundle runtime."
  - "UNKNOWN registry and waiting-source queue for items that cannot be completed truthfully."
  - "20/40/60/80/100 progress checkpoints and full WPDCR/feedback report."

