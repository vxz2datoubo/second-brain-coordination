quality_and_adversarial_tests:
  - "Do not treat mechanical chunks or arbitrary short sentences as valid atoms."
  - "Preserve negation, conditions, exceptions, counterexamples, temporal scope and failure conditions."
  - "Do not upgrade correlation to causation or source assertion to verified fact."
  - "Do not collapse conflicts or UNKNOWNs into a smooth summary."
  - "Do not let candidate status block GPT semantic access when policy permits access."
  - "Reject broken source lineage, unstable IDs, duplicate inflation and supersession without version links."
  - "Zero secret values in commits, logs, fixtures, packets, errors and receipts."
  - "A mixed document containing a secret value must be precisely redacted and otherwise digested, not discarded wholesale."
  - "Identical input/configuration produces identical semantic IDs, relation IDs and packet hash."
  - "Different source statements that conflict remain distinct and linked by conflict objects."

branch_and_ownership_rules:
  - "Create a fresh branch and Draft PR; do not modify PR #100 or its branch."
  - "Do not modify Codex PR #107, PR #109 or the active Codex implementation branch."
  - "Do not create a second canonical memory store, retrieval engine, fusion engine, QueryPlan or ContextBundle implementation."
  - "Only write the dedicated QCLAW knowledge-atomization program directory, compatible schemas/fixtures/tests and required handoff/report files unless the active route explicitly expands ownership."
  - "Candidate outputs do not become approved authority without GPT/W1 acceptance."

hard_boundaries:
  - "Authentication, access, payment, banking, broker and trading secret values are prohibited everywhere."
  - "Third-party content must respect ownership, authorization and publication basis."
  - "No account, broker, order, trade, production or real-market execution."
  - "No direct main write, merge, force push, rebase, reset or hidden branch reuse."
  - "If compute remains exhausted, report BLOCKED_COMPUTE_EXHAUSTED with exact state and preserve the route; do not fabricate progress."

