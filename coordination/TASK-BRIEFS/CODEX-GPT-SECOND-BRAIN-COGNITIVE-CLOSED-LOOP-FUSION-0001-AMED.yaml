objective: >-
  Starting from the GPT-accepted and merged R109 Memory Palace foundation, integrate long-term conversational memory, reusable semantic knowledge,
  plans/events/constraints, owner stances, temporal/conflict reasoning, retrieval-before-write reconciliation, retrieval-before-answer associative
  recall and feedback-driven lifecycle updates into one W3-backed cognitive loop. GPT must become the primary conversational ingestion/recall
  orchestrator; QCLAW/QQ may remain an optional batch/backfill worker but cannot be a runtime dependency.

architecture_rules:
  - "Reuse one W3/Integrated Offline Memory canonical candidate runtime; no second memory/knowledge authority."
  - "Raw source episodes are append-preserving; derived atoms/graphs/indexes are versioned projections."
  - "Memory, knowledge, plan/event/constraint, stance, conflict and unknown objects must be interoperable through stable IDs and relations."
  - "Embedding similarity is retrieval evidence only, never truth or current-validity authority."
  - "User assertion, owner stance, source claim, assistant analysis and model inference remain separate epistemic roles."
  - "CURRENT, HISTORICAL and freshness/revalidation semantics must remain explicit."
  - "User/project/privacy scope is fail-closed."
  - "No credentials in memory, embedding, log or fixtures."
  - "NO_TRADE and no irreversible autonomous action."
  - "Reuse E50-proven foundations D1/D2/D4/D6/D8/D9/D11 as evidence only; do not import the QCLAW audit harness or create a QCLAW runtime dependency."
  - "Treat E50 D3/D5/D7/D10/D12 as implementation requirements or explicit UNKNOWN/PARTIAL where still unresolved."

phase_plan:
  - phase: "P0_COMPATIBILITY_AND_BASE_FREEZE"
    goal: >-
      Read exact accepted R109 head `ad5f0e4c925b7750ad28d8b7e13e322dea46f325`, merge `07d847e870bc0f2d1770c3c5e7892168c0e28f94`,
      and current main. Map W3, CLTM, Memory Palace, existing KnowledgeAtom/relations/LearningPacket/QueryPlan and the GPT cognitive-loop skill.
      Produce a compatibility matrix and explicit reuse/adapt/add decisions before implementation. Also update any stale blueprint header that still
      says the R108 predecessor is waiting; do not create a second active blueprint.
    outputs:
      - "compatibility matrix"
      - "object/ID lineage map"
      - "schema migration plan if additive changes are needed"
      - "test plan and rollback plan"
      - "stale predecessor metadata reconciliation"
  - phase: "P1_KNOWLEDGE_EPISODE_ATOMIZATION_AND_RECONCILIATION"
    goal: >-
      Add or adapt KnowledgeEpisode/KnowledgeAtom ingestion atop the existing W3 packet boundary; support faithful extraction contract, typed atoms,
      retrieval-before-write comparison and graph evolution actions without touching real private sources.
    required_actions:
      - NEW
      - DUPLICATE
      - MERGE
      - REFINE
      - SUPPORT
      - WEAKEN
      - CONTRADICT
      - SUPERSEDE
      - REVOKE
      - REVALIDATE
      - RESOLVE_UNKNOWN
      - UNKNOWN
  - phase: "P2_UNIFIED_MEMORY_KNOWLEDGE_PLAN_GRAPH"
    goal: >-
      Make episodic memory, knowledge, events/plans/constraints, owner stance, conflicts and unknowns cross-retrievable through the same provenance,
      temporal and relation model. Preserve one source episode lineage for multi-atom inputs.
  - phase: "P3_ASSOCIATIVE_RECALL_AND_CONTEXT_BUNDLE"
    goal: >-
      Implement bounded lexical/semantic/temporal/provenance/entity-graph/structural-analogy retrieval and GPTSecondBrainContextBundle. Add anti-anchor
      logic so strong similarity cannot resurrect stale, revoked or disproven experience into CURRENT reasoning.
  - phase: "P4_FEEDBACK_AND_LIFECYCLE"
    goal: >-
      Define and test feedback outcomes (useful, irrelevant, stale, wrong, incomplete conditions, cross-context success) and map them into evidence,
      confidence, scope, freshness, supersession, revocation and skill-candidate lifecycle updates.
      Skill promotion runtime must require independent validation receipts, rollback and failure conditions; no one-case promotion.
  - phase: "P5_TOOL_CONTRACT_ONLY"
    goal: >-
      Define narrow GPT-facing contracts for memory.capture, knowledge.reconcile, memory.search, memory.recall_context, memory.conflicts and memory.feedback.
      In this task, implement only synthetic/private-safe adapters if feasible. Production MCP/Gateway deployment and real private-store access remain locked.

reference_acceptance_story_schedule_conflict:
  prior_memory:
    recorded_before: "2026-08-15"
    statement: "2026-08-16 要去旅游"
  new_utterance:
    recorded_at: "2026-08-15T20:00:00+08:00"
    statement: "明天准备直接睡大觉睡一天"
  required_behavior:
    - "Resolve 明天 to 2026-08-16 without rewriting the source utterance."
    - "Retrieve the prior travel plan via temporal/plan graph rather than accidental same-day lexical coincidence."
    - "Represent both as event/plan/constraint objects with source provenance."
    - "Emit SCHEDULE_POTENTIAL_CONFLICT when travel time/cancellation/flexibility is unknown."
    - "Do not assert user contradiction as a fact."
    - "If later evidence proves mutual exclusion, permit SCHEDULE_HARD_CONFLICT."
    - "If user cancels travel, append correction/supersession/revocation while preserving HISTORICAL recall."
    - "Context bundle must let GPT naturally remind the user of the possible conflict and missing information."

reference_acceptance_story_knowledge_digest:
  input: >-
    One user-supplied passage contains multiple factual claims, one author interpretation, one mechanism, conditions, a counterexample and a reusable
    method; user invokes `消化这个`.
  required_behavior:
    - "Preserve immutable source identity/content hash/span."
    - "Emit multiple typed atoms with shared episode lineage."
    - "Separate source fact/claim/interpretation/value judgment/model inference."
    - "Retrieve relevant existing W3 atoms before writing."
    - "Assign typed reconciliation action for each material candidate."
    - "Create only evidence-supported relation edges; unresolved links remain UNKNOWN."
    - "Write candidate packets atomically/idempotently."
    - "Require exact scoped recall and appropriate paraphrase/graph recall before success receipt."

reference_acceptance_story_proactive_recall:
  required_behavior:
    - "A current user turn can trigger retrieval even without explicit 'remember/search' wording when prior context materially changes the answer."
    - "Bound retrieval by user/project/privacy/time/status/evidence and relation budget."
    - "Retrieve relevant counterevidence or mismatch for consequential decisions."
    - "Skip retrieval or ABSTAIN for irrelevant, stale-only or low-confidence matches."

reference_acceptance_story_feedback:
  required_behavior:
    - "User/real outcome can mark a retrieved knowledge/case as useful, irrelevant, stale, wrong or condition-incomplete."
    - "Feedback updates lifecycle append-preservingly and never rewrites original evidence."
    - "One successful case cannot promote a method directly to formal skill."

required_synthetic_adversarial_tests:
  - "travel-on-2026-08-16 plus 2026-08-15 'tomorrow sleep all day' => potential conflict when constraints incomplete"
  - "same story with explicit mutually exclusive fixed interval => hard conflict"
  - "later cancellation => CURRENT excludes old plan; HISTORICAL reconstructs it"
  - "long mixed knowledge passage => multi-atom typed extraction with one source episode"
  - "author opinion never becomes objective fact"
  - "owner stance never becomes objective fact"
  - "duplicate semantic claim avoids duplicate voting while preserving provenance"
  - "new evidence refines/supports/weakens/contradicts existing lineage correctly"
  - "structural analogy retrieval works with low lexical overlap"
  - "highly similar stale or revoked case cannot dominate CURRENT answer"
  - "strong supporting memory plus counterevidence are both available for high-risk context bundle"
  - "cross-project and foreign-user recall returns nothing"
  - "secret/token/private-key patterns fail before mutation/indexing"
  - "restart preserves candidate and exact scoped recall"
  - "index rebuild does not change canonical atom identity"
  - "feedback marks wrong/stale knowledge without deleting history"
  - "four cognitive states remain topic-specific and inferred does not become explicit"
  - "paraphrased prompt injection is not silently treated as trusted memory content; unsupported generalization remains explicit UNKNOWN until covered"

