  - "SyntheticFileCasGateway only as a test double, never as production authority."
  - "Durable claim state machine and immutable terminal-state direction."
  - "Four disjoint execution-evidence concepts and no-default capability direction."
  - "Stale READY route must be blocked by durable authority."

