objective: >-
  Reimplement the complete confirmed R163 remediation as one clean, non-retroactive CODEX bounded slice from canonical main,
  without importing any implementation commit from frozen PR #495.

required_behaviors:
  state_patch_boundary:
    - caller-minted or recomputable-hash CreativeSession/v2 state_patch MUST fail closed
    - rejection MUST occur before SaveStore load, timeline, DirectorSequence/continuity, or review packet consumption
    - append-only hashes are integrity only and MUST NOT mint state mutation authority
  legacy_terminal_bridge:
    - retain only the genuine canonical legacy-resolution terminal-equivalence bridge
    - bridge provenance MUST be typed, mechanically validated, source-bound and replay-verifiable
    - forged typed provenance or recomputed hashes MUST NOT authorize the bridge
    - bridge MUST NOT become a reusable caller template
  migration_durability:
    - migration receipt/history/provenance MUST persist across continued play
    - persistence MUST cover choose, say, repeated save, slot save, slot load and restore
    - native v2 MUST remain unmarked as migrated
  legacy_preservation:
    - original legacy source bytes MUST remain unchanged
    - incompatible, malformed, noncanonical or lossy legacy MUST fail closed
    - no shadow or misleading default may be created on failed migration
  semantics:
    - current SceneGraph semantics MUST NOT be weakened merely to fit legacy history
    - no second Ledger/Gateway/Resolver/Authority or canonical knowledge source

required_regressions:
  inherited:
    - all predecessor S00-S06 regressions still applicable on canonical baseline
    - all R163 A genuine migration regressions
    - all R163 B exact-prefix timeline regressions
    - all R163 C independently observable end-to-end evidence regressions
    - all R163 D review-ticket/evidence expectations applicable to successor
  adversarial:
    - direct hash-valid caller state_patch jump
    - direct jump through load/timeline/director/review surfaces
    - forged typed migration provenance with recomputed event hashes
    - sibling-slot save/load/restore attack
    - migration provenance persistence after choose
    - migration provenance persistence after say
    - repeated save persistence
    - native-v2 nonlabeling
    - original legacy source preservation
    - incompatible legacy fail-closed without shadow default
    - wrong transition id
    - wrong resulting_patch
    - unknown action
    - second or post-prefix state_patch/migration-source mint attempt

