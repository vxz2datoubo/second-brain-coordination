mission_intent:
  fundamental_goal: Eliminate caller-minted trust roots between W4 performance evidence, P0A research-integrity evaluation,
    and downstream P0C while preserving one canonical evidence chain.
  user_capability_outcome: A research-only DS10 path whose authenticity/PIT evidence can be mechanically verified before any
    downstream statistical result is trusted.
  current_state_to_change: 'PR #678 is frozen because schema-valid caller content plus caller-computable hashes can counterfeit
    provenance.'
  causal_mechanism:
  - W4 producer/verifier derives performance material from governed source bytes
  - P0A verifier re-reads canonical inputs and reruns evaluator
  - P0C later consumes verifier-produced material read-only
  observable_success:
  - forged audit and recomputed digest rejected
  - matrix mutation/reorder/deletion/substitution rejected
  - positive synthetic integration uses verifier-produced upstream evidence
  success_criteria:
  - trusted exact-main reads
  - complete PIT provenance
  - authenticity separated from disposition
  - no second ledger/truth plane
  - P0B compatibility explicit if pins move
  failure_conditions:
  - caller assertions become authority
  - incomplete family silently filtered
  - future/revised information leaks into earlier decision state
  - scope crosses into P0C/W7/orders/trading
  stop_conditions:
  - authority/scope conflict
  - canonical identity drift
  - required evidence unavailable
  - write outside allowlist
  - real account/funds/order gate
