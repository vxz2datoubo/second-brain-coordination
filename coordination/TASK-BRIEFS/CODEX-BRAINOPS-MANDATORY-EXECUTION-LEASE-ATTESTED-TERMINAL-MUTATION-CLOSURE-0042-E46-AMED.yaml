actual_problem:
  - "Decision-use is optional and can be bypassed by terminal validation."
  - "Effect permits can still be minted without an attested execution lease."
  - "Durable finalize can write terminal success/failure before attested terminal evidence exists."
  - "Invocation binding may be null."
  - "Manual, Automation and CLI execution identities are caller-populated rather than verifier-minted."
  - "A separate process-local terminal attestor remains positive-capable."
  - "Post-apply response-loss recovery reconciliation is not implemented."

objective: >-
  Make one durable execution lease state machine the mandatory authority for effect authorization, invocation attachment,
  verifier-minted owner execution identity, terminal mutation and final classification. Permanently fail closed every legacy bypass.

required_work:
  execution_lease:
    - "Create a revisioned-CAS monotonic lease bound to exact provenance, storage, claim, holder, target, route tuple and expiry."
    - "Use explicit states CAPABILITY_ATTESTED, EFFECT_AUTHORIZED, INVOCATION_ATTACHED, TERMINAL_ATTESTED and TERMINAL_COMMITTED."
    - "Require a non-empty invocation ID only at the attach transition; never treat None as invocation binding."
  effect_gate:
    - "Require the lease transition for acquire_effect_permit and bind the sealed permit to lease ID and claim."
    - "Disable the old claim/holder-only positive permit path."
  invocation_and_terminal:
    - "Require the effect permit and lease transition for attach_invocation."
    - "Mint owner-specific AttestedExecutionIdentity objects through a synthetic verifier, not caller strings."
    - "Add finalize_with_attested_terminal as the only positive terminal mutation path."
    - "Disable the old finalize positive path."
  terminal_chain:
    - "Require current lease state and attested execution identity in terminal evidence validation."
    - "Bind reconciliation and classification to lease ID and terminal commit receipt."
    - "Remove or permanently downgrade the process-local legacy terminal attestor path."
  recovery_reconciliation:
    - "Add a durable recovery operation journal."
    - "Distinguish not applied, applied, response lost, CAS conflict and reconciliation required."
    - "Test post-apply response loss and restart reconciliation."
  tests:
    - "Direct terminal-validator bypass without lease consumption."
    - "Effect permit without lease."
    - "Direct finalize without attested terminal."
    - "Null invocation binding."
    - "Copied owner/transport strings for Manual, Automation and CLI identities."
    - "Legacy process-local attestor replay across new instances."
    - "Illegal lease transitions, duplicate effect and cross-claim/route/owner/target reuse."
    - "Post-apply response loss followed by restart reconciliation."

