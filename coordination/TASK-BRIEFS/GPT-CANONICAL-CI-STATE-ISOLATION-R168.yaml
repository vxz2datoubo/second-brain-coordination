purpose: >-
  Implement the reusable primitive specified by Issue #496 so candidate regression attribution is separated from current-main
  control-state health without mutating or weakening existing Control Tower tests.

required_behavior:
  retained_suite:
    - "collect stable fully-qualified test IDs and PASS/FAIL/ERROR state"
    - "normalize volatile worktree/tmp/address data before failure fingerprinting"
    - "duplicate test IDs fail closed"
    - "missing baseline test IDs fail closed"
    - "candidate-only tests are explicit and must pass"
  integration_state:
    - "current main and candidate exact head are pinned at proof start and rechecked at proof end"
    - "integration state is a clean committed temporary merge or equivalent immutable tree"
    - "dirty worktree or unresolved merge is TEST_ENVIRONMENT_INVALID"
    - "temporary merge parents/tree and merge base are evidence-bound"
  classifications:
    - "BASELINE_CURRENT_MAIN_FAILURE"
    - "CANDIDATE_INTRODUCED_FAILURE"
    - "CANDIDATE_MODIFIED_BASELINE_FAILURE"
    - "CANDIDATE_BASELINE_IMPROVEMENT"
    - "CANDIDATE_EXACT_HEAD_FAILURE"
    - "TEST_ENVIRONMENT_INVALID"
    - "PASS_NO_CANDIDATE_REGRESSION"
  authority:
    - "baseline failures remain visible and never become PASS through attribution"
    - "zero regression delta grants no review/Ready/merge/release authority"
    - "receipt authority flags are mechanically false"

implementation_shape:
  helper: "coordination/CONTROL-TOWER/integration_state_isolation.py"
  receipt_schema: "coordination/CONTROL-TOWER/integration_state_isolation.schema.json"
  tests: "coordination/CONTROL-TOWER/tests/test_integration_state_isolation.py"
  consumer: ".github/workflows/program-control-tower.yml"

acceptance_scenarios:
  - "active-worker current main with known baseline failures and non-regressing candidate"
  - "one new retained failure blocks"
  - "one modified baseline failure fingerprint blocks"
  - "one baseline improvement is recorded and not penalized"
  - "dirty integration state fails environment-invalid"
  - "test discovery/cardinality or baseline-ID drift fails closed"
  - "main changes during proof invalidates receipt"
  - "candidate head changes during proof invalidates receipt"
  - "candidate-only failing test blocks absolutely"
  - "receipt schema rejects authority=true and unknown fields"

exact_runtime_write_allowlist:
