mandatory_work_packages:
  - id: "WP0"
    name: "Claim, plan and clean topology"
    gates:
      - "Verify current main, Issue/PR/review identities and frozen E52 head."
      - "Create fresh branch from exact current main."
      - "First commit changes exactly one E53 PROJECT-PLAN.md file."
      - "Open sole Draft PR and publish TaskLeaseClaim."
      - "Record exact E52 source path/blob/content hashes and dispositions."
  - id: "WP1"
    name: "SourceEvidence and factory-controlled canonical atoms"
    gates:
      - "Create immutable SourceEvidence from exact bytes with ByteTruthIndex, SHA-256, byte length and source identity."
      - "Canonical Atom creation is factory-controlled; unsupported direct construction fails."
      - "Recompute atom text, evidence digest and deterministic atom_id from exact legal source slice."
      - "Only ledger ATOM_CANDIDATE spans may create automatic claims."
      - "FACT requires a separate verified-evidence workflow and never lexical auto-promotion."
  - id: "WP2"
    name: "Ledger-bound packet and executable field evidence"
    gates:
      - "Packet accepts exact SourceEvidence plus FinalizedLedger, not caller-authored source/coverage mappings."
      - "Recompute owner totals, span count, exact coverage digest, gap/overlap/duplicate checks and source binding."
      - "EXTRACTED semantic fields carry deterministic rule enum, exact span and evidence digest."
      - "Validator reruns the rule from source bytes; unsupported interpretation stays field-specific UNKNOWN."
      - "Reject non-finite floats and undocumented canonical value types."
  - id: "WP3"
    name: "Verified relation registry and complete canonical identity"
    gates:
      - "Relations accept only finalized atoms from the same immutable SourceEvidence registry."
      - "Evidence bytes, source/evidence digest, relation/evidence type and endpoints are recomputed."
      - "Packet finalization validates all atoms, relations, redaction lineage, config and validator results."
      - "packet_id is derived from complete standards-compliant canonical JSON excluding self-reference."
  - id: "WP4"
    name: "Clean integration and commit-range hygiene"
    gates:
      - "Current tree and every commit in base..head are scanned for generated/transient files."
      - "The E52 historical pyc checkpoint is recorded as quarantined and never imported."
      - "Create a clean integration manifest proving every E53 production blob originated from new work or an exact selected clean blob."
      - "No out-of-scope deletion, sparse tree, orphan tree or protected-path change."
  - id: "WP5"
    name: "Adversarial product validators and real mutations"
    gates:
      - "No assertTrue(True), import-only, existence-only, documentation-only or print-only credit."
      - "Mutate actual copied E53 production source in isolated temporary copies; target gate must fail nonzero; restored source must pass."
      - "Cover forged atom ID/text/source, caller-authored coverage, field-value/span mismatch, forged relation endpoints, NaN/Infinity, mutable aliases, JSON key promotion, malformed JSON/JSONL, Markdown ownership, redaction bypass, 0xED non-progress, generated files, fake artifacts and premature receipt."
      - "Generate bounded valid/invalid UTF-8, JSON/JSONL, line-ending and Markdown corpora with deterministic seeds and record counterexamples."
      - "Run child-process timeout/kill/reap and resource cleanup checks."
  - id: "WP6"
    name: "Exact-head Provider matrix and artifacts"
    gates:
      - "Workflow runs while PR is Draft and asserts checkout HEAD equals pull_request.head.sha."
      - "Python 3.11 and 3.13 times PYTHONHASHSEED 0,1,777: six matrix jobs."
      - "Each job creates byte-identical canonical-evidence.json and separate environment-evidence.json."
      - "Upload paths are fixed; missing files fail; artifact names are unique and exact."
      - "Compare job requires exactly six canonical artifacts and byte-compares all of them."
      - "Run/job/artifact IDs, digests, logs and exact head are independently visible."
  - id: "WP7"
    name: "Strict receipt topology"
    gates:
      - "Tested-head Provider success precedes receipt creation."
      - "Exactly one nonempty receipt-only final commit."
      - "Receipt is placeholder-free and binds task, epoch, base, plan, tested head, workflow, runs, jobs, artifacts, digests, source/selection/mutation/coverage manifests and completion signal."
      - "Receipt-head repeats the same matrix and compare successfully."
      - "Receipt remains final head; no post-receipt commit."
  - id: "WP8"
