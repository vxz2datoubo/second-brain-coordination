fundamental_goal: >-
  Build the first trustworthy, visible and reversible BrainOps control plane that prefers the Codex view and
  Codex App Automations inside the unified ChatGPT desktop app, while retaining Codex CLI/SDK only as an explicit
  fallback. The user must be able to see whether the chain is running, pause or disable it, inspect routes, sessions,
  logs and ports, and eventually manage Second Brain and MaiBot services from one localhost console.

first_delivery_scope: "P0_DISCOVERY + P1_READ_ONLY_CONSOLE + P3_SHADOW_RECONCILIATION"

