  - "coordination/GOVERNANCE/WPDCR-AUTONOMY-AND-MODEL-PROFILE-MANDATORY-OVERLAY-v1.0.yaml"

mandatory_capability_probe:
  desktop_app:
    - "Installed ChatGPT desktop version and Windows package identity without reading secrets."
    - "Presence of the unified ChatGPT/Codex global switcher and Codex view."
    - "Presence and exact UI/API-observable behavior of Codex App Automations."
    - "Supported schedule intervals, specifically whether a 30-minute interval is available."
    - "Whether an automation runs in a visible Codex thread and returns results to a review queue."
    - "Whether the app must remain running and the PC awake."
    - "Whether official deep link, URI handler, local API, App Intent or other supported external trigger exists."
    - "Whether App and CLI share authentication/config/session state, with evidence and no credential disclosure."
  codex_cli_fallback:
    - "CLI version, login status, codex exec, JSONL, session resume and permission-profile support."
    - "Do not make CLI the primary path when App Automation is supported."
  host_environment:
    - "Windows version/session, .NET SDK/runtime, Docker availability, Git, repository/worktree and relevant ports."

capability_classification:
  allowed_values: ["SUPPORTED", "UNSUPPORTED", "UNKNOWN", "BLOCKED"]
  rule: "Documentation alone is not local capability evidence; unknowns remain UNKNOWN."

required_outputs:
  - "App-first versus CLI-fallback architecture ADR with current official/local evidence and rejected alternatives."
  - "Threat model for desktop automation, GitHub prompt injection, OAuth/session boundaries, localhost control and arbitrary-command denial."
  - "Typed schemas for service manifests, port manifests, desired/observed state, activation manifests, leases, fencing generations, idempotency, execution ownership, Codex App automation identity and CLI sessions."
  - "Loopback-only ASP.NET Core/Blazor read-only control console, or a better justified low-dependency equivalent."
  - "SQLite metadata/audit skeleton with no secret storage."
  - "Read-only discovery adapters for processes, Windows Services, listening ports, Docker availability, ChatGPT/Codex desktop presence and Codex CLI capability."
  - "SignalR or equivalent live status with polling recovery."
  - "Shadow review-request watcher and route reconciler that checks GitHub events plus a 30-minute anti-entropy schedule fixture."
  - "Shadow ownership selector with APP_AUTOMATION / CLI_FALLBACK / MANUAL_APP / NONE and one-owner-per-route fencing."
  - "Exact Codex App Automation prompt and manual setup instructions when the capability is supported."
  - "WOULD_DISPATCH / WOULD_BLOCK evidence for READY, BLOCKED, PAUSED, stale epoch, duplicate activation, active lease, user-approval-required and automation-disabled cases."
  - "Visible UI designs for global automation switch, per-service switch, pause dispatch, safe stop, terminate fallback executor and emergency stop, all mutating actions disabled in this delivery."
  - "Port and future MaiBot component registry design covering capture, VAD, STT, dialogue, TTS, playback and terminal/websocket gateway."
  - "WPDCR report, actual model/profile report, failed approaches, unknowns, opportunities and next bounded route recommendation."

app_first_rules:
  - "Codex App/Codex view is the preferred human-visible execution surface."
  - "Codex CLI/SDK is an explicit fallback, not a hidden parallel executor."
  - "Do not use UI mouse/keyboard automation, screen-coordinate clicking or reverse-engineered private IPC as production control."
  - "Do not claim direct App activation unless an official supported interface or locally verified App Automation path exists."
  - "The management console must not kill the whole ChatGPT app merely to stop one task; whole-app termination requires a separate explicit emergency action design."
  - "App and CLI must never claim the same route epoch; execution ownership is fenced and auditable."

security_and_boundary_rules:
  - "Management endpoints bind to 127.0.0.1 only."
  - "No arbitrary shell, executable path or free-form argument API."
  - "No credential, OAuth token, cookie, browser-profile or secret inspection/output."
  - "No Windows Service installation, startup registration, Task Scheduler mutation, firewall change or public/LAN bind in this route."
  - "No actual Codex unattended dispatch in this route; shadow only."
  - "Do not modify or continue PR #107, PR #100 or their branches."
  - "Do not dispatch QQ; QQ has a separate authority route."
  - "No trading, account, order, broker, real-market execution or production activation."

mandatory_tests:
  - "Loopback binding enforcement and public-bind rejection."
  - "Schema duplicate-key, traversal, executable substitution, argument injection and secret-redaction tests."
  - "Stale epoch fencing, duplicate idempotency, concurrent lease and one-owner-per-route races."
  - "READY/BLOCKED/PAUSED/DISABLED/approval-required fixtures."
  - "QQ route cannot be dispatched by the Codex controller."
  - "App-unavailable and CLI-unavailable degradation without false success."
  - "Offline GitHub behavior and later reconciliation."
  - "UI reconnect/state resynchronization."
  - "All P1/P3 mutating endpoints absent or fail closed."

commit_and_evidence_shape:
  substantive_commits: "one or a small project-plan series justified in the plan"
  final_receipt: "one non-empty evidence-only receipt directly after the exact tested head"
  receipt_parent_must_equal_tested_head: true
  exact_head_ci_required: true
  required_runtimes: ["supported .NET target", "repository-required Python checks where applicable"]
  prohibited: ["amend", "rebase", "reset", "force_push", "direct_main_write", "auto_merge", "post_receipt_commit"]

