command_execution_contract:
  on_trigger: "VERIFY_E48_ROUTE_CREATE_FRESH_PLAN_ONLY_COMMIT_OPEN_DRAFT_PR_AND_EXECUTE_REAL_AUTHORITY_INTEGRATION_NOW"
  second_user_start_command_required: false
  read_only_acknowledgement_forbidden: true
