status: "PENDING_ISSUE_PUBLICATION"
execution_allowed: false
automatic_dispatch_allowed: false
canary_execution_allowed: false
automatic_resume: false

source:
  issue: 150
  pull_request: 151
  plan_head: "d881be5b9f79eea8e0a8e4889c1c6ccba37586ed"
  tested_head: "f6835949b111134dea5734217a2074d169f897d3"
  receipt_head: "20fc964e6f67c817742e8e8a7a34858a8305fea9"
  review_record_commit: "f07f71ca13ff9e7a56fee840b6ebd8881cd04e3a"
  classification: "E47_EXACT_HEAD_CI_RECEIPT_TOPOLOGY_AND_RESTART_SAFE_PARALLEL_LEDGER_SCAFFOLD_ACCEPTED_BUT_MANDATORY_AUTHORITY_INTEGRATION_VERIFIER_MINTED_CAPABILITY_TERMINAL_IDENTITY_EXPIRY_CAPABILITY_RECOVERY_MUTATION_PROOF_AND_PRODUCT_RECEIPT_GATE_FAILED"
  frozen: true

fundamental_rule: >-
  E48 may expose exactly one positive execution authority chain. Adding, exporting or retaining a second independently usable positive lifecycle authority is a blocking failure.

objective: >-
  Integrate request-bound restart recovery and cross-record reconciliation directly into the existing DurableExecutionLeaseAuthority and DurableClaimAuthority chain,
  require verifier-minted provenance/capability/execution identity at every relevant positive boundary, enforce expiry and temporal ordering throughout the lifecycle,
  and make tested/receipt release decisions executable from actual git and GitHub Actions evidence rather than caller assertions.

mandatory_authority_chain:
  - "VerifiedAuthorityProvenance from exact route and approval proof"
  - "actual DurableClaimRecord acquired by DurableClaimAuthority"
  - "consumed verifier-minted ChallengeCapabilityDecision"
  - "DurableExecutionLeaseAuthority capability transition"
  - "recoverable effect authorization bound to durable request identity"
  - "actual DurableClaimRecord invocation attachment"
  - "recoverable lease invocation attachment"
  - "verifier-minted AttestedExecutionIdentity"
  - "verifier-minted AttestedTerminalEvidence"
  - "actual DurableClaimRecord terminal mutation"
  - "recoverable durable lease terminal commit and stable terminal receipt"

required_results:
  - "Refactor the actual DurableExecutionLeaseAuthority and DurableClaimAuthority path; no independent positive RecoverableLifecycleAuthority may remain exported or usable."
  - "Capability entry requires VerifiedAuthorityProvenance, an exact active DurableClaimRecord and consumed verifier-minted ChallengeCapabilityDecision."
  - "Effect authorization is restart-recoverable from durable request/transition evidence and cannot be minted from caller strings or mirror records."
  - "Invocation recovery mutates and reconciles the real DurableClaimRecord and lease record at most once."
  - "Terminal attestation requires AttestedExecutionIdentity and AttestedTerminalEvidence with exact holder, target, invocation, transport, source, verifier and terminal semantics."
  - "Terminal recovery mutates the real DurableClaimRecord and lease terminal state at most once."
  - "Every positive stage and identical replay rechecks expiry, temporal order, route/approval validity and exact request binding."
  - "Capability claim/lease creation has a durable journal and recovery for claim-only, lease-only, response-lost and CAS-conflict states."
  - "Repository-backed release gate reads actual git graph/diffs and provider evidence generated by CI, not caller-declared success objects."
  - "Active mutation harness proves implementation and workflow weakening causes red tests/gates."

forbidden_shadow_patterns:
  - "A new authority with its own mirror claim state that does not mutate DurableClaimRecord."
  - "Public caller-constructible capability binding accepted as positive authority."
  - "Plain caller TerminalEvidence accepted without verifier-minted identity/evidence."
  - "Exporting both old mandatory authority and a second positive lifecycle API."
  - "Treating model tests of a parallel state machine as proof of real entrypoint enforcement."

expiry_and_time_contract:
  recheck_at:
    - "capability attestation"
    - "effect authorization"
    - "identical effect replay"
    - "claim invocation attachment"
    - "lease invocation attachment"
    - "identical invocation replay"
    - "identity attestation"
    - "terminal evidence attestation"
    - "terminal claim mutation"
    - "lease terminal commit"
    - "all reconciliation and ALREADY_* returns"
  required_order:
    - "route observation <= approval issue <= provenance verification <= claim time"
    - "challenge observation <= challenge consumption <= capability lease creation"
    - "effect time <= invocation attach time <= identity observation/capture/attestation"
    - "terminal observation <= terminal capture <= terminal attestation <= terminal commit"
  expired_result: "FAIL_CLOSED_WITH_NO_MUTATION_OR_POSITIVE_ALREADY_RESULT"

capability_recovery_contract:
  journal_before_first_cross_record_write: true
  states:
    - "REQUESTED"
    - "CLAIM_FOUND_OR_ACQUIRED"
    - "CAPABILITY_DECISION_VALIDATED"
    - "LEASE_CREATED"
    - "RESPONSE_LOST"
    - "RECONCILIATION_REQUIRED"
    - "RECONCILED"
    - "COMPLETED"
  cases:
    - "claim exists and lease absent"
    - "lease exists and claim exact"
    - "claim/lease binding mismatch"
    - "lease CAS applied but response lost"
    - "journal CAS applied but response lost"
    - "challenge decision replay or substitution"

repository_backed_release_gate:
  product_entrypoint: "A command-line/module entrypoint invoked by E48 CI against the checked-out repository."
  inputs_must_be_generated_or_read_from:
    - "git rev-parse and git cat-file"
    - "git diff/name-status for tested-to-receipt topology"
    - "task route and task brief files"
    - "workflow-produced provider evidence manifest containing exact run/job/head/conclusion data"
    - "actual repository text for placeholder and forbidden-content scan"
  must_verify:
    - "expected workflow identity and exact tested/receipt SHA"
    - "successful Python 3.11 and 3.13 jobs"
    - "tested head is ancestor and exact parent of receipt head"
    - "receipt commit is nonempty and evidence-only"
    - "no commit follows receipt head on the task branch at review time"
    - "all required recovery/identity/expiry/mutation evidence families exist"
    - "public-safety scan and changed-path allowlist"
  caller_supplied_success_objects_as_authority: false
  output: "canonical JSON evidence manifest plus SHA256 artifact"

active_mutation_harness:
  must_mutate_and_observe_failure:
    - "replace exact-head checkout with PR merge ref or wrong SHA"
    - "remove expiry check from one positive stage"
    - "accept plain caller terminal evidence"
    - "bypass actual DurableClaimAuthority invocation mutation with mirror state"
    - "change request digest or purpose binding"
    - "delete capability partial-state recovery"
    - "allow runtime/test file in receipt commit"
    - "fabricate provider CI evidence or wrong workflow name"
  execution: "isolated temporary copy/worktree only"
  required_evidence: "mutation ID, modified symbol/file, expected failing gate, observed nonzero exit and output digest"

commit_topology:
  first_commit: "STRICT_PLAN_ONLY_SINGLE_PLAN_FILE"
  implementation_commits: "ONE_OR_MORE_ALLOWED_BEFORE_TESTED_HEAD"
  tested_head_rule: "DESIGNATE_ONLY_AFTER_REAL_AUTHORITY_INTEGRATION_TESTS_RELEASE_GATE_AND_MUTATION_HARNESS_COMPLETE"
  receipt_rule: "EXACTLY_ONE_NONEMPTY_EVIDENCE_ONLY_FINAL_COMMIT_AFTER_GREEN_EXACT_TESTED_HEAD_CI_AND_RELEASE_GATE"
  post_receipt_commits_forbidden: true

ci_contract:
  workflow: ".github/workflows/brainops-e48.yml"
  exact_head_checkout_and_assertion: true
  python_versions: ["3.11", "3.13"]
  run_full_regression_and_e48_integration_tests: true
  run_repository_backed_release_gate: true
  run_active_mutation_harness: true
  emit_canonical_evidence_artifact: true
  tested_head_success_required: true
  receipt_head_success_required: true
  unrelated_workflow_credit: false

repository_scope:
  allowed_paths:
    - "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/BRAINOPS-APP-FIRST-CONTROL-PLANE/**"
    - ".github/workflows/brainops-e48.yml"
  source_import_policy: "SELECTED_PATH_AND_BLOB_FROM_FROZEN_E47_ONLY"
  imported_source_manifest_required: true
