mode_label: "【Codex模式：项目计划模式】真实权威链整合、受证明身份、全阶段过期控制与可执行发布门 E48"
mode_reason: >-
  E47 proved useful restart-safe ledger mechanics and exact-head CI, but implemented them as an independent caller-constructible authority beside the unchanged mandatory E46 chain.
  E48 must integrate recovery into the actual positive authority entrypoints, preserve verifier-owned identity, enforce time validity at every stage and make release evidence executable against real repository/provider state.
