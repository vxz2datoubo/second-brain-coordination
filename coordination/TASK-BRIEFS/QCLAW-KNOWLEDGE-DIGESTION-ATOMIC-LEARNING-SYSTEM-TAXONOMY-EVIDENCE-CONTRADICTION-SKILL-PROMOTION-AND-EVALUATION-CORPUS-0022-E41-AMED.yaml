objective: >-
  Build an independently testable knowledge-digestion and learning-system layer for the Second Brain. Convert public-safe synthetic inputs into traceable knowledge atoms, contradiction/version records, cognition mappings, candidate skills and evaluation evidence. This task is semantic, methodological and evaluation-focused. It must not edit or duplicate Codex E54 production authority code.

source_and_separation:
  qclaw_e40:
    issue: 164
    pull_request: 165
    frozen_head: "e58b39fcabbe9dae4f75a6570c86a88754176766"
    status: "READ_ONLY_FAILURE_REFERENCE"
    whole_branch_import_forbidden: true
  codex_e54:
    issue: 170
    status: "PARALLEL_ACTIVE_CORRECTIVE_ENGINEERING"
    branch_or_files_must_not_be_modified: true
  rule: >-
    E41 owns knowledge taxonomy, digestion semantics, contradiction/version logic, cognition mapping, skill-promotion governance, synthetic evaluation corpus and its own evaluator. E54 owns low-level source-bound authority, format byte ownership, mutation infrastructure, Provider recertification and receipt topology. Any overlap must be recorded as a boundary conflict and left unresolved for GPT arbitration rather than edited.

mandatory_work_packages:
  - id: "Q0"
    name: "CLAIM_PLAN_AND_BOUNDARY"
    requirements:
      - "Verify Issue, current main, frozen E40 and active E54."
      - "Create fresh branch from exact latest origin/main."
      - "First task commit adds exactly one E41 PROJECT-PLAN.md file."
      - "Open one Draft PR, publish TaskLeaseClaim and immediately execute."
      - "Publish an overlap-exclusion manifest before substantive implementation."
  - id: "Q1"
    name: "KNOWLEDGE_ATOM_TAXONOMY"
    requirements:
      - "Define atomic types: concept, definition, mechanism, causal_chain, condition, counterexample, indicator, data_source, scope, failure_condition, verification_method and executable_action."
      - "Separate source fact, author claim, evidence, inference, hypothesis and value judgment."
      - "Every atom records provenance, confidence, scope, verification state and invalidation conditions."
      - "No externally supplied confidence or authority label is trusted without evaluator evidence."
  - id: "Q2"
    name: "DIGESTION_PIPELINE_AND_TRACEABILITY"
    requirements:
      - "Model faithful extraction before interpretation."
      - "Preserve exact source references and distinguish quoted source content from system-generated interpretation."
      - "Define deterministic decomposition, normalization, terminology mapping and atom linking."
      - "Unsupported interpretation remains UNKNOWN or CANDIDATE, never silently promoted."
  - id: "Q3"
    name: "CONTRADICTION_DEDUP_VERSION_AND_MASTER_RECORD"
    requirements:
      - "Merge duplicates into one master record without erasing provenance."
      - "Preserve conflicting claims and classify time change, scenario difference, definition mismatch or probable error."
      - "Record additions, corrections, replacements, scope restrictions and pending verification as explicit version events."
      - "Prohibit silent overwrite and patch-forest authority."
  - id: "Q4"
    name: "USER_COGNITION_MAPPING"
    requirements:
      - "Represent known-and-stated, known-but-unstated, unknown-but-readable and unknown-and-needs-layering."
      - "Separate explicit user facts from high-probability inference and low-confidence guess."
      - "Define what may enter global memory, project memory, candidate zone or remain unpersisted."
      - "No private account, credential, model configuration or hidden personal data is used."
  - id: "Q5"
    name: "SKILL_PROMOTION_AND_FAILURE_CONDITIONS"
    requirements:
      - "Define candidate skill, experimental skill and formal skill states."
      - "Promotion requires reproducible tests, multiple cases, counterexamples, scope, failure conditions and rollback."
      - "Single sample, attractive narrative or one successful run cannot become a formal skill."
      - "Define demotion, deprecation and supersession rules."
  - id: "Q6"
    name: "SYNTHETIC_CORPUS_AND_ADVERSARIAL_EVALUATION"
    requirements:
      - "Create deterministic public-safe synthetic inputs spanning prose, research notes, contradictory sources, stale updates, ambiguous terms, causal claims, trading-method claims and engineering receipts."
      - "Include positive, negative, ambiguous and adversarial cases."
      - "Ground-truth expected atoms, evidence layers, contradiction classes, confidence bands, memory destinations and skill states."
      - "Include cases that tempt overcompression, false certainty, silent overwrite, duplicate master records, unsupported FACT promotion and leakage of secret-like strings."
  - id: "Q7"
    name: "EVALUATOR_TESTS_AND_PROVIDER_EVIDENCE"
    requirements:
      - "Implement an E41-only deterministic evaluator or validator for the semantic contracts and corpus."
      - "No assertTrue(True), import-only, existence-only, documentation-only or print-only credit."
      - "Use copied E41 production-source mutations for critical promotion, contradiction, provenance and memory-routing guards; mutant must fail nonzero and restoration pass."
      - "Provider workflow runs while Draft on Python 3.11 and 3.13 with seeds 0, 1 and 777, emits exactly six byte-identical canonical evaluation summaries plus separated environment evidence, and compares exact bytes."
  - id: "Q8"
    name: "REPORT_AND_HANDOFF"
    requirements:
      - "Report exact base, plan, tested, receipt/current heads, parents and trees."
      - "List all changed files, commands, exits, counts, durations and stdout/stderr hashes."
      - "Report corpus seeds, case counts, minimized counterexamples, mutation anchors and restoration results."
      - "Report all Provider run/job/artifact identities and digests."
      - "Record architecture choices, serious alternatives, failures, retries, unknowns, overlap findings, rollback and transferable learning."
      - "Stop for GPT independent review; no merge."

acceptance_invariants:
  - "Atoms are individually traceable and cannot silently inherit authority from document-level metadata."
  - "Fact, claim, evidence, inference, hypothesis and value judgment remain distinct."
  - "Contradictions survive digestion with provenance and classification."
  - "One current master record per knowledge object, with explicit version history."
  - "Skill promotion is evidence-gated and reversible."
  - "Memory routing is explicit and confidence-aware."
  - "The synthetic corpus is deterministic, adversarial and independently checkable."
  - "No overlap edits to Codex E54 or frozen QCLAW E40."

provider_contract:
  workflow: ".github/workflows/qclaw-e41-knowledge-digestion-evaluation.yml"
  run_while_draft: true
  exact_event_head_assertion: true
  python_versions: ["3.11", "3.13"]
  hash_seeds: ["0", "1", "777"]
  expected_matrix_jobs: 6
  canonical_summary_per_job: true
  separated_environment_evidence: true
  exact_six_byte_compare: true
  tested_head_success_required: true
  receipt_head_success_required: true

hard_boundaries:
  - "No modification of QCLAW E40, Codex E52/E53/E54 branches or files."
  - "No merge, direct main write, rebase, force-push, history rewrite or repository settings."
  - "No model/provider/reasoning/default/thread/subagent/workspace/session/private configuration access or mutation."
  - "No credentials, accounts, positions, funds, market data, orders or trading."
  - "Synthetic/public-safe fixtures only."

start_semantics:
  user_command: "读取任务"
  behavior: "Read, claim and execute immediately; do not stop after acknowledging and do not request a second start command."
