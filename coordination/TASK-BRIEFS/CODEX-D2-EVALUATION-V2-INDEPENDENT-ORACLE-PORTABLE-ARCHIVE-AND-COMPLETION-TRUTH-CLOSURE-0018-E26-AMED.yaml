    - "Gate C, Gate D, Issue #92 and Issue #108 remain frozen."
  required_commit_or_artifact_shape:
    - "Starting at e06f58944723ed4d2bc22c3fe30862f69091fef4, exactly one E26 corrective substantive tested commit."
    - "After dual-Python CI and three-archive evidence pass, exactly one E26 receipt-only commit."
    - "No amend, rebase, reset, force push, merge or direct main write."
  evidence_gates:
