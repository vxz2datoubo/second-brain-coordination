mission_intent:
  fundamental_goal: >-
    Close the remaining Gate-B confidence-manufacture seams without discarding E25's valid implementation: failure evidence must be
    independently derived from the violating object, signatures must be proven to follow actual executed artifacts under deliberate
    specification disagreement, reproducibility must be demonstrated from three clean archives of the exact tested commit, and every
    completion claim must be cumulatively and immutably anchored.
  user_capability_outcome: >-
    A reviewer can independently reproduce and falsify Evaluation V2 evidence, understand the work process and remaining uncertainty,
    and know exactly what is accepted before any later gate is considered.
  current_state_to_change: >-
    E25 code and CI are partly reusable, but `_object_oracle` calls the same predicate and negates it for three families; the focused
    signature test uses generic dictionaries rather than an actual harness/spec divergence; fresh archive evidence is NOT_ACCEPTED;
    the AMED receipt lacks mandatory fields; and the PR completion comment records a receipt SHA that does not equal the remote head.
  causal_mechanism:
    - "Independent structural inspectors remove same-function self-verification."
    - "A real divergence injection proves counted signatures come from consumed execution objects rather than author formulas."
    - "Three exact-commit archive roots reveal hidden workspace, path, import and hash-seed dependencies."
    - "Cumulative WPDCR/AMED receipts plus external full-SHA anchors prevent narrative completion from outrunning Git truth."
  observable_success:
    - "All E26 tests and public runner pass on Python 3.11 and 3.13."
    - "Three distinct archive roots from the exact tested commit produce byte-identical canonical outputs and identical normalized stdout."
    - "No failure oracle calls its paired predicate or accepts a caller-provided verdict."
    - "The complete E26 receipt fields and exact full receipt SHA are independently visible in PR #106 and Issue #23."
  success_criteria:
    - "All acceptance gates in the active E26 route pass."
    - "E22-E25 negative evidence and reusable results remain cumulatively present."
  failure_conditions:
    - "An oracle remains a same-predicate inversion or hard-coded success."
    - "Archive runs depend on an external workspace, stale checkout or non-exact commit."
    - "Completion fields, process sections, failures, SKIP or UNKNOWN are omitted or replaced by placeholders."
  stop_conditions:
    - "Any S4/D4 privacy, secret, destructive, real-data, account, order or trading risk."
    - "A route, PR, branch, base or ownership mismatch."
    - "Required evidence cannot be produced truthfully within the authorized scope; report exact blocker and unaffected work."

