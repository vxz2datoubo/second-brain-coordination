implementation_requirements:
  package:
    - "deterministic Python package or justified equivalent under the authorized S0 root"
    - "no external daemon/database/service dependency"
    - "standard-library durable local store preferred; SQLite is acceptable"
  signal_event:
    - "immutable admitted event model"
    - "structural + semantic validation with stable error codes"
    - "event_source + event_id distinct-event uniqueness"
    - "idempotency_key + semantic content hash collision detection"
    - "private/secret fields rejected or represented by opaque public-safe refs according to contract"
  ledger:
    - "append-only admitted event history"
    - "at-least-once ingest API; duplicate delivery is expected"
    - "effectively-once state processing via idempotency"
    - "no fake exactly-once claim"
    - "durable local persistence with transaction/crash semantics demonstrated synthetically"
  relation_and_projection:
    - "SignalLink relations with provenance preservation"
    - "deterministic SignalCluster/SignalProjection reducer"
    - "optimistic projection concurrency/version checks"
    - "no timestamp-only last-write-wins"
    - "out-of-order/causation/version handling"
    - "projection checksum"
  replay_and_recovery:
    - "deterministic replay/rebuild produces same effective state/checksum"
    - "crash after append before projection recovers without event loss or double application"
    - "malformed material events reject/quarantine deterministically"
    - "snapshot/compaction replay-equivalence fixture if implemented; no irreversible raw deletion"
  reconciliation_receipt:
    - "builder/verifier for synthetic GlobalReconciliationReceipt snapshots"
    - "bind PR head/state/main/route/workclaim/programlane/domain/approval snapshots"
    - "material-change invalidation"
    - "release compare-and-check"
    - "receipt PASS never grants execution without Control Tower"
  fixtures:
    - "synthetic GitHub/route/domain snapshots only; no live GitHub calls"
    - "R133 real incident metadata may be represented as public-safe fixture refs/SHAs from canonical evidence"
    - "all GST-R001 through GST-R024 are executable/table-driven"

