problem_statement: >-
  Historical-window retrospective intake currently carries domain/project labels but does not yet mechanically require the candidate's
  owner-domain current canonical authority before concluding that the desired effect remains unmet. Because the current R142 evidence
  chain is centered on second-brain-coordination, a domain-specific AI Film, A-share, World Model or future-system candidate could be
  misclassified as new shared/Second Brain work merely because a non-owner domain lacks that architecture.

mission: >-
  Materialize a domain-neutral Domain Authority Resolution Gate by adapting existing cross-project authority boundaries, R135 exact-commit
  read-only source binding, and R142 retrospective reconciliation. Ensure global Signal visibility never transfers domain ownership;
  ensure completion/satisfaction judgments are made only against the resolved owner-domain canonical authority; fail closed when that
  authority is unresolved; and block domain-mismatched Signal->Task->Route release.

