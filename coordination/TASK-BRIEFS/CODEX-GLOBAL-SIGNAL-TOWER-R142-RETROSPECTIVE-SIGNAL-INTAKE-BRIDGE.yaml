scope_expansion: >-
  If exact implementation evidence shows S0C source changes are required, STOP and request GPT scope expansion. Do not solve this
  by creating another store, reducer, ledger, backlog or authority.

required_contracts:
  import_package:
    schema: "SignalImportPackage/v1"
    requirements:
      - "machine-checkable batch plus per-candidate identity"
      - "source_window/message/project/time provenance where available"
      - "public-safe summary/original intent reference, never raw private body in public repo"
      - "signal kind, epistemic state, desired effect, problem, success condition, risks, assumptions, unknowns, dependencies"
      - "candidate relations and model/tool/version/work-item refs when relevant"
      - "UNKNOWN rather than fabrication"
  reconciliation:
    dispositions:
      - NEW_DURABLE_SIGNAL
      - ALREADY_CANONICAL
      - ALREADY_SATISFIED
      - DUPLICATE
      - EXTENDS
      - REINFORCES
      - CONTRADICTS
      - SUPERSEDED
      - DOMAIN_CANONICAL_ONLY
      - NEEDS_REVALIDATION
      - REJECT_PRIVATE_OR_UNSAFE
      - INSUFFICIENT_PROVENANCE
    hard_rules:
      - "old-window NEW is only a candidate; current canonical decides current status"
      - "no newest-wins, no text-similarity-only admission, no closed-task resurrection"
      - "preserve contradictions/supersession evidence"
      - "Signal != Task"
  durable_bridge:
    requirements:
      - "ordinary GPT-window reachable through an approved GitHub-stage on-demand path"
      - "no daemon/private service/secret expansion"
      - "reuse existing R136 gateway and S0C admission/projection semantics"
      - "Git-backed transport, if used, is append-only transport/replay source only, never second effective truth"
      - "deterministic replay/read-back"
  receipt:
    required_fields:
      - import_batch_id
      - candidate_id
      - normalized_event_or_link_ids
      - disposition
      - canonical_snapshot_or_main
      - package_digest
      - durable_ledger_identity_or_receipt
      - replay_checksum
      - current_projection_result
      - duplicate_or_superseded_refs
      - public_safety_result
      - process_compliance
      - write_status

milestones:
  M0:
    goal: "fresh reconcile + project plan"
    required:
      - "verify main/task/epoch/issue/branch/route/claim/lane/open PR state"
      - "inventory exact reusable R134-R141 code; do not copy a second implementation"
      - "inspect S0C physical persistence and S0E entrypoint semantics"
      - "select minimal last-mile transport architecture and record tradeoffs"
      - "plan commit before implementation"
  M1:
    goal: "package schema + validation"
    required:
      - "SignalImportPackage/v1 parser/validator"
      - "canonical digest and deterministic serialization"
      - "batch/per-candidate idempotency"
      - "privacy/provenance/UNKNOWN guards"
  M2:
    goal: "current-state reconciler"
    required:
      - "compare candidates with current Signal/Task/Mission/control-plane/domain canonical state"
      - "derive disposition without trusting old-window self-label"
      - "preserve relation evidence and current-canonical exact refs"
  M3:
    goal: "one-shot durable bridge"
    required:
      - "GPT-window reachable GitHub-stage path"
      - "S0E -> existing S0C semantics, no second truth"
      - "durable receipt"
      - "deterministic replay/read-back"
  M4:
    goal: "real retrospective E2E + adversarial suite"
    required:
      - "use the user-provided approximately-45-candidate old-window package as the first real case"
      - "prove already satisfied/canonical items are not reactivated"
      - "prove true NEW/NEEDS_REVALIDATION can be admitted"
      - "cover duplicate collision, contradiction, supersession, private rejection, stale snapshot, Signal!=Task, replay stability"
  M5:
    goal: "exact-head CI/resource/safety"
    required:
      - "Python 3.11 and 3.13 exact-head CI"
      - "public-safe scan"
      - "changed-path allowlist"
      - "no placeholder/TODO/shadow implementation"
      - "git diff --check"
      - "single-worker default / no nested pools / no daemon"
      - "task-owned cleanup only; no global process kill"
  M6:
    goal: "evidence + GPT handoff"
    required:
      - "exact tested head and CI run/job IDs"
      - "real import/reconciliation/durable receipt/read-back evidence"
      - "changed-path inventory, rollback, UNKNOWN/finding delta"
      - "completion signal then STOP for GPT review"

minimum_adversarial_cases:
  - "old self-declared NEW but current ALREADY_SATISFIED"
  - "true NEW_DURABLE_SIGNAL"
  - "duplicate retry idempotent"
  - "same id different body collision fail closed"
  - "SUPERSEDED historical requirement"
  - "CONTRADICTS with both evidence sides retained"
  - "DOMAIN_CANONICAL_ONLY not global backlog"
  - "private/raw body rejected"
  - "INSUFFICIENT_PROVENANCE"
  - "omission != revocation"
  - "Signal != Task"
  - "stale canonical snapshot invalidates admission"
  - "closed Task but desired effect still unmet"
  - "current dependency linkage"
  - "stable replay checksum"
  - "transport cannot directly mutate effective truth"
  - "old-window NEW label overridden by current reconcile"
  - "no durable receipt means NOT_PERSISTED"
  - "cross-window same candidate dedup"
  - "real approximately-45-candidate package"

