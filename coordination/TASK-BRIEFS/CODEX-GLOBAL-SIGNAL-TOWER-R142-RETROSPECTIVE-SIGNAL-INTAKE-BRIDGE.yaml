  Close the last-mile gap between historical ChatGPT-window mining and the accepted S0C durable Signal truth. Build one bounded,
  public-safe, on-demand retrospective import path: old-window candidate package -> fresh current-canonical reconciliation ->
  disposition/dedup/supersession -> existing R136 SignalIntakeGateway/S0C admission semantics -> durable receipt and replay/read-back.
  The old window is a miner, never current authority. Signal remains distinct from Task.

