acceptance_scenarios:
  - "caller says 10 trials while W4 records 100 -> observed 100 and mismatch finding"
  - "losing/failed trial missing -> blocking incomplete-history finding"
  - "same trial ID with changed immutable digest -> mutation finding"
  - "identical rerun links to original instead of silently increasing economic trial count"
  - "family narrowed after winner -> reject/retest"
  - "benchmark/metric/horizon changed after seeing result -> reject/retest"
  - "lockbox opened once after full candidate freeze -> eligible final-eval state"
  - "lockbox used for retuning or second winner selection -> contamination"
  - "lockbox history absent -> UNKNOWN/ABSTAIN"
  - "future financial revision/current rule leaks backward -> block"
  - "statistical method NOT_RUN/NOT_APPLICABLE/INSUFFICIENT_DATA cannot equal PASS"
  - "ELIGIBLE_FOR_W7_VALIDATION cannot grant W7/position/order/trade authority"

