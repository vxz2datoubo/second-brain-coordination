purpose: >-
  Implement Issue #552 P0A as an additive non-authoritative audit layer. It reads a W4-owned experiment-family snapshot and emits
  deterministic research-integrity evidence for W7 without owning experiments, validation, probability, capital or trading.

required_behavior:
  trial_completeness:
    - "derive observed trial identity set and digest from supplied immutable records"
    - "detect declared/observed count mismatch"
    - "detect duplicate IDs, missing expected IDs, mutation and unexplained deletion"
    - "distinguish reproducibility rerun from a new selection-affecting trial"
  selection:
    - "selection rule must exist before selected winner/final evaluation"
    - "family definition, benchmark, metric and horizon mutation after selection requires new family/retest"
  lockbox:
    - "SEALED_UNUSED and OPENED_ONCE_FINAL_EVAL are the only eligible final-holdout states"
    - "reuse for tuning/feature/prompt/model/parameter selection is contamination"
    - "missing access history remains UNKNOWN/ABSTAIN"
  pit:
    - "dataset/rule/available_at evidence must be explicit"
    - "future revisions/current rules applied backward block eligibility"
  output:
    - "ResearchIntegrityAudit/v1 with blocking/nonblocking findings, selection-bias risk and W7 handoff disposition"
    - "all authority flags false"

