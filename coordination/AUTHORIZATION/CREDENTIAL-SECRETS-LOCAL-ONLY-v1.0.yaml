schema_version: "2.0"
record_type: "UserAuthorizationDecision"
status: "ACTIVE"
issued_by: "USER"
recorded_by: "GPT"
issued_at: "2026-07-21"
updated_at: "2026-07-27"

knowledge_policy:
  complete_learning: true
  complete_atomization: true
  complete_retrieval: true
  gpt_access_default: "FULL_SEMANTIC_ACCESS"

credential_secret_exception:
  categories:
    - "access_token"
    - "api_key"
    - "login_password"
    - "session_credential"
    - "private_key"
    - "account_authentication_secret"
    - "mcp_server_credential"
    - "tdx_or_market_data_local_credential"
  storage: "LOCAL_ONLY"
  locally_searchable: true
  local_runtime_read_allowed: true
  local_runtime_use_allowed: true
  local_authentication_test_allowed: true
  repeated_per_use_confirmation_required: false
  github_upload: false
  public_object_storage: false
  ordinary_learning_packet_body: false
  ordinary_context_bundle_body: false
  graph_representation:
    - "reference_id"
    - "purpose"
    - "owning_system"
    - "updated_at"
    - "verification_digest"
    - "local_location_hint"

local_codex_direct_access_authorization:
  status: "EXPLICITLY_AUTHORIZED_BY_USER"
  priority: "MAXIMUM_EXECUTION_EFFICIENCY"
  applies_to:
    - "local Codex"
    - "Codex CLI or local Codex execution carrier"
    - "WorkBuddy-owned local MCP configuration when used by an authorized Codex task"
  authorized_targets:
    - "WorkBuddy MCP servers"
    - "TongDaXin / TDX local adapters and MCP servers"
    - "TQ local adapters"
    - "local market-data adapters"
    - "other user-owned local MCP or adapter services explicitly required by an authorized project task"
  permitted_actions:
    - "search local credential locations and environment variables"
    - "read credential values directly inside the local machine boundary"
    - "resolve credentials without asking the user for each individual use"
    - "inject credentials into the local process or child process environment"
    - "perform local authentication and connectivity tests"
    - "reuse an already authenticated local session"
    - "read WorkBuddy configuration only as needed to discover endpoint and credential references"
  execution_rule: >-
    When an active project task authorizes use of a local MCP, TDX, TQ, WorkBuddy adapter or other user-owned local service,
    local Codex must attempt direct local credential discovery and authentication instead of refusing merely because a secret
    value is required. Missing credentials remain a real blocker only after the authorized local search paths have been tried.
  no_interactive_gate_for_existing_local_secret: true
  cross_agent_ownership_rule: >-
    Reading WorkBuddy-owned local configuration and credentials for interoperability does not transfer WorkBuddy branch,
    task or canonical ownership to Codex. Codex may use the local interface but may not rewrite WorkBuddy-owned project history
    unless a separate route authorizes it.

secret_value_non_export_contract:
  allowed_boundary: "LOCAL_MACHINE_PROCESS_MEMORY_ONLY"
  prohibited_destinations:
    - "Git or GitHub"
    - "commits, branches, pull requests and issues"
    - "AI_HANDOFF, receipts, reports and task comments"
    - "stdout or stderr logs"
    - "test fixtures, snapshots and datasets"
    - "chat messages or context bundles"
    - "telemetry, crash reports or external observability"
    - "remote services other than the explicitly authorized authentication endpoint"
  redaction_required: true
  report_only:
    - "credential reference ID"
    - "source type such as environment/local config/session store"
    - "authentication success or secret-free failure code"
    - "non-reversible verification digest when needed"
  memory_lifetime: "SHORTEST_PRACTICAL_RUNTIME_LIFETIME"
  persistent_plaintext_copy: false

missing_or_failed_credential_behavior:
  required_attempt_order:
    - "existing authenticated local session"
    - "process and user environment variables"
    - "project-approved local configuration references"
    - "WorkBuddy or adapter-local credential references"
    - "operating-system credential store when already configured"
  after_exhaustion: "FAIL_CLOSED_WITH_SECRET_FREE_DIAGNOSTIC"
  must_not_claim_policy_denial_when_user_authorization_applies: true

not_secret_content:
  - "API documentation"
  - "interface schemas"
  - "field definitions"
  - "usage instructions"
  - "non-authentication technical materials"

binding_policy:
  - "coordination/GOVERNANCE/LOCAL-CREDENTIAL-DIRECT-USE-AND-NON-EXPORT-PROTOCOL-v1.0.yaml"
  - "coordination/CODEX-TASK-ROUTER.md"

interpretation: >-
  Credential values remain local-only, but local-only does not mean unreadable by the user's local execution agent.
  Local Codex is expressly authorized to read and use them for authorized local integrations, with maximum execution efficiency,
  while never exporting the values into repository, reports, logs, chat or unrelated external systems.
