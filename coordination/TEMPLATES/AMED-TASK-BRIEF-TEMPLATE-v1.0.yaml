schema_version: "1.2"
record_type: "AMEDTaskBrief"
task_id: ""
issue_or_pr: ""
assigned_agent: ""
mode: ""
mode_label: ""
mode_reason: ""
task_weight: "LIGHT | STANDARD | STRATEGIC"
proactive_mission_authoring_protocol: "coordination/GOVERNANCE/PROACTIVE-MISSION-AUTHORING-AND-BOUNDED-INITIATIVE-GRANT-PROTOCOL-v1.0.yaml"
work_process_reporting_protocol: "coordination/GOVERNANCE/AGENT-WORK-PROCESS-DIFFICULTY-DISCOVERY-AND-COORDINATION-REPORTING-PROTOCOL-v1.0.yaml"
read_claim_execute_protocol: "coordination/GOVERNANCE/AGENT-READ-TASK-CLAIM-AND-EXECUTE-COMMAND-SEMANTICS-v1.0.yaml"

mission_intent:
  fundamental_goal: ""
  user_capability_outcome: ""
  current_state_to_change: ""
  causal_mechanism: [""]
  observable_success: [""]
  success_criteria: [""]
  failure_conditions: [""]
  stop_conditions: [""]

primary_delivery_and_non_negotiables:
  minimum_required_deliverables: [""]
  frozen_constraints: [""]
  required_commit_or_artifact_shape: [""]
  evidence_gates: [""]
  excluded_work: [""]

system_position:
  workstream: ""
  bounded_context: ""
  systems_of_record: [""]
  upstream_dependencies: [""]
  downstream_consumers: [""]
  read_only_dependencies: [""]
  canonical_components_not_to_duplicate: [""]
  related_active_tasks: [""]

proactive_mission_assignment:
  initiative_required: true
  optimize_for_fundamental_goal_not_literal_steps: true
  better_than_minimum_is_expected_when_evidence_supports_it: true
  executor_may_choose:
    - "internal implementation method"
    - "validation and test design"
    - "bounded architecture and sequencing inside authorized paths"
    - "AMED A/B adjacent improvements that pass value, evidence and rollback tests"
  executor_must_not_wait_for_extra_instruction_to:
    - "challenge stale or false assumptions"
    - "inspect relevant adjacent modules, tests, interfaces and existing capabilities"
    - "use a simpler or more reliable method when it better serves the fundamental goal"
    - "report material discoveries, hard problems and precise coordination requests"
  better_method_value_test:
    - "materially improves correctness, safety, reproducibility, integration, maintainability, cost or future leverage"
    - "does not weaken evidence or hide negative results"
    - "complexity is proportionate to value"
    - "can be tested and rolled back"
    - "does not change canonical authority, ownership, permissions or safety boundaries"
  proposal_or_stop_when:
    - "the opportunity requires a new canonical runtime or system of record"
    - "the work belongs to another active owner or protected branch"
    - "the exploration budget would be exceeded"
    - "private, licensed, real-data, account, order, destructive or user-gated authority is required"
    - "no reliable solution is supported by current evidence"

read_claim_execute_semantics:
  trigger_phrases: ["读取任务", "执行任务", "开始任务", "读取并执行任务"]
  canonical_action: "READ_LATEST_ROUTE_CLAIM_VALID_LEASE_AND_EXECUTE_IMMEDIATELY"
  second_user_start_command_required: false
  read_only_acknowledgement_forbidden: true
  plan_only_response_when_ready_forbidden: true
  minimum_progress_before_return: "Complete the first meaningful authorized action and evidence, then continue to checkpoint, truthful blocker or completion."
  non_executable_route_report_must_include:
    - "exact failed field or dependency"
    - "checks and attempts performed"
    - "minimum missing information, capability or decision"
    - "affected and unaffected scope"
    - "requested owner and exact action"
    - "reactivation or closure condition"

mandatory_discovery_questions:
  - "What can be done more reliably, simply, safely or completely than the literal wording?"
  - "Which assumptions, dependencies, requirements, tests, interfaces or source claims may be wrong, stale or missing?"
  - "What can be reused, adapted, integrated, generalized, simplified, migrated or deprecated instead of duplicated?"
  - "What valuable extension or adjacent capability becomes visible, and what evidence would justify it?"
  - "What remains unresolved or cannot be solved reliably inside current evidence, authority or budget?"
  - "Who needs to coordinate exactly what input, access, decision, test or review?"
  - "Which discoveries should feed back into protocols, templates, tests, blueprints, skills, routes, lessons or future tasks?"

active_discovery_duty:
  required_checks: [WRONG_OR_STALE_ASSUMPTION, MISSING_REQUIREMENT, DUPLICATE_RUNTIME_OR_SKILL, INTERFACE_GAP, REUSABLE_CAPABILITY, SIMPLER_OR_BETTER_METHOD, CROSS_MODULE_LINKAGE, HIDDEN_COST_OR_RISK, NEGATIVE_OR_COUNTERINTUITIVE_RESULT, NEW_UNKNOWN, COORDINATION_DEPENDENCY, SYSTEM_FEEDBACK_OPPORTUNITY]
  required_output: "SYSTEM-DISCOVERY-AND-OPPORTUNITY-REPORT"
  no_material_discovery_rule: "Report NONE_OBSERVED and list checks performed."

anticipated_difficulty_and_unknowns:
  planned_difficulty: "D0_ROUTINE | D1_MODERATE | D2_HARD | D3_VERY_HARD | D4_RESEARCH_UNKNOWN"
  expected_hard_parts: [""]
  likely_hidden_dependencies: [""]
  expected_unknowns: [""]
  evidence_required_before_declaring_blocked: ["attempts made", "observed results", "minimum missing information or capability", "affected and unaffected scope", "exact coordination request"]
  safe_abstention: ""

coordination_and_handoff_design:
  likely_upstream_owners: [""]
  likely_downstream_owners: [""]
  authoritative_source_of_truth: ""
  handoff_artifacts: [""]
  exact_coordination_request_shape: ["owner", "exact action/input/access/decision/test", "evidence reference", "urgency", "blocked gate", "unaffected work", "closure condition"]
  work_that_can_continue_without_coordination: [""]
  acceptance_and_close_conditions: [""]

system_feedback_and_double_loop_targets:
  inspect_for_updates: ["protocols", "templates", "tests", "validators", "blueprints", "skills", "interfaces", "routes", "engineering lessons", "deprecations", "follow-up tasks"]
  executor_authority: "A/B only inside current task; C/D remain proposal/user-gated."
  GPT_acceptance_required: true

hard_boundaries:
  security: [""]
  privacy: [""]
  license: [""]
  file_and_branch_ownership: [""]
  wip_and_routing: [""]
  trade_and_account: [""]
  fact_inference_boundary: [""]

research_trigger:
  level: "L1_REUSE_AND_QUICK_CHECK | L2_TARGETED_PROFESSIONAL_RESEARCH | L3_INDEPENDENT_RESEARCH_TASK"
  trigger_reasons: [""]
  required_source_classes: [""]
  a_share_adaptation_required: false
  research_ledger_required: true

exploration_budget:
  primary_delivery_share: ""
  active_discovery_share: ""
  system_opportunity_share: ""
  max_new_architecture_proposals: 0
  max_new_skill_candidates: 0
  max_unplanned_files: 0
  scope_expansion_without_gate: false

improvement_authority:
  A_SAFE_LOCAL_AUTONOMOUS:
    allowed_examples: [""]
  B_BOUNDED_IMPLEMENT_AND_REPORT:
    allowed_examples: [""]
  C_PROPOSAL_ONLY:
    examples: [""]
  D_PROHIBITED_OR_USER_GATE:
    examples: [""]

agent_specific_initiative:
  CODEX:
    emphasis: ["architecture", "implementation", "tests", "determinism", "interfaces", "foundational defect discovery"]
  QCLAW:
    emphasis: ["source conflict", "counterevidence", "knowledge gaps", "candidate skills", "maturity audit"]
  WORKBUDDY:
    emphasis: ["local reality", "permissions", "paths", "services", "data quality", "performance", "deployment gaps"]

required_evidence:
  fact_classes: [VERIFIED_REPOSITORY, VERIFIED_LOCAL, VERIFIED_OFFICIAL_SOURCE, VERIFIED_TEST, INFERENCE, INHERITED_REPORT, ACCESS_NOT_AVAILABLE, UNKNOWN]
  commands_and_exit_codes: true
  tests_pass_fail_skip: true
  negative_results: true
  alternatives_and_tradeoffs: true
  rollback: true

mandatory_delivery_artifacts:
  - AGENT-EXECUTION-RECEIPT
  - RESEARCH-LEDGER
  - UNPLANNED-IMPROVEMENT-LEDGER
  - SYSTEM-DISCOVERY-AND-OPPORTUNITY-REPORT
  - WORK-PROCESS-AND-COORDINATION-REPORT
  - TEST-RUN-RECEIPT
  - UNKNOWN-REGISTRY
  - AI_HANDOFF

executor_lease_acknowledgement:
  required: true
  must_confirm:
    - "latest remote main, task ID, route epoch, Issue, PR, branch, base and completion signal"
    - "fundamental goal and proactive discovery duties"
    - "A/B implementation boundary and C/D gates"
    - "读取任务 means read, claim and execute immediately, not summarize and stop"

second_pass_audit:
  required: true
  reviewer: "GPT"
  gates: [TASK_ASSIGNMENT_INITIATIVE_QUALITY_GATE, TASK_COMPLETENESS_GATE, FACT_EVIDENCE_GATE, RESEARCH_QUALITY_GATE, ENGINEERING_CORRECTNESS_GATE, IMPROVEMENT_VALUE_GATE, PROCESS_DIFFICULTY_COORDINATION_GATE, SYSTEM_EVOLUTION_GATE, NEXT_ACTION_GATE]
