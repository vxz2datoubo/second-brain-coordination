schema_version: "1.1"
record_type: "ModelReasoningExecutionAdvisory"
protocol: "coordination/GOVERNANCE/AGENT-MODEL-REASONING-EXECUTION-INTENSITY-AND-DELEGATED-INTELLIGENCE-ROUTING-PROTOCOL-v1.0.yaml"

operator_model_advisory:
  recommendation_level: "FAST_LOW | BALANCED | HIGH | MAXIMUM"
  recommended_model_or_picker_label: ""
  recommended_reasoning_level: "low | medium | high | extra-high | maximum | current"
  rationale:
    task_difficulty: ""
    uncertainty_or_ambiguity: ""
    reversibility_or_error_cost: ""
    why_this_level: ""
  lower_cost_alternative: ""
  quality_risk_if_underpowered: ""
  user_action_required: "USER_MANUALLY_SELECTS_OR_KEEPS_CURRENT_SETTING"
  agent_setting_mutation_forbidden: true
  exact_model_availability_known: false
  user_visible_message: ""

execution_contract:
  model_selection_owner: "USER_ONLY"
  executor_uses_current_user_selected_environment: true
  executor_must_not_change:
    - "ChatGPT/Codex model picker"
    - "reasoning/thinking/pro mode"
    - "user or project config.toml model fields"
    - "agent TOML model fields"
    - "workspace, thread, environment, registry or app model defaults"
  mismatch_response:
    - "REPORT_ONLY"
    - "DO_NOT_AUTOCORRECT"
    - "ASK_USER_ONLY_IF_RELIABLE_COMPLETION_REQUIRES_A_DIFFERENT_LEVEL"

forensic_restoration_exception:
  enabled_only_by_explicit_user_request: true
  exact_before_state_required: true
  restore_only_proven_agent_changed_fields: true
  guess_or_recommendation_as_restore_value_forbidden: true
  no_trustworthy_before_state_result: "BLOCKED_NO_TRUSTWORTHY_PRECHANGE_STATE"
  private_configuration_must_not_be_committed_or_exposed: true

actual_runtime_reporting:
  report_if_exposed: true
  inaccessible_value: "ACCESS_NOT_EXPOSED"
  never_guess: true
  required_fields:
    - recommended_model_or_level
    - recommended_reasoning_level
    - user_was_notified
    - observed_runtime_model_or_ACCESS_NOT_EXPOSED
    - observed_reasoning_or_ACCESS_NOT_EXPOSED
    - agent_changed_model_setting
    - restoration_exception_used
    - quality_effect_or_residual_uncertainty

executor_lease_acknowledgement:
  must_confirm:
    - "The profile is advice to the user, not runtime-setting authority."
    - "The agent will not change any model or reasoning setting."
    - "Only an explicit user-requested exact restoration may write a proven pre-change value."
