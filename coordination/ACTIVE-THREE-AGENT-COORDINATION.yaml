  all_agent_model_mutation_rule: "Agents may not read or modify persistent model/provider/reasoning/default/thread/subagent settings."
  repository_scope_rule: "Engineering routes require exact allowed paths; agents block rather than infer."
  mode_integrity_rule: "An agent may not change project_plan/objective/target mode unless GPT publishes the change in the canonical route."
  capability_witness_rule: "Caller-created observations or copied identity strings cannot create positive capability or execution identity."
  mandatory_execution_lease_rule: "Effect permits, invocation attachment, terminal mutation and positive classification must share one durable monotonic execution lease; optional validators are not authority."
  recoverable_transition_rule: "A durable state transition is incomplete unless an identical post-apply retry can recover the same authority or continuation result after restart without a second mutation."
  request_identity_rule: "Idempotency is granted only to the exact durable request digest and purpose; same-state requests with changed bindings fail closed."
  cross_record_journal_rule: "Every claim/lease multi-record positive transition requires a purpose-bound durable operation journal and explicit partial-state reconciliation."
  effect_gate_rule: "No lease means no effect permit. Legacy claim/holder-only permit entrypoints must be non-mutating."
  terminal_mutation_rule: "No verifier-minted owner execution identity and current lease state means no terminal claim mutation. Legacy finalize must be non-mutating."
  claim_bound_decision_rule: "Positive decisions bind exact provenance, storage, claim, holder, target and route; invocation becomes non-null only through the unique attach transition."
  recovery_enforcement_rule: "Governed recovery requires exact grant-ledger consumption and durable operation reconciliation; response loss must never be guessed as success."
  original_byte_truth_rule: "Knowledge digestion accepts strict UTF-8 original bytes; parser character positions must be mapped to legal byte boundaries before span creation."
  exact_coverage_rule: "Every source byte has exactly one ATOM_CANDIDATE, STRUCTURE or UNKNOWN_ERROR owner; zero-length, overlap, omission, duplicate ownership and out-of-range fail closed."
  relation_truth_rule: "Semantic relations require explicit linking evidence or verifiable rule identity; proximity, adjacency and type pairing never create a relation."
  redaction_lineage_rule: "Redaction is planned on original bytes, emits irreversible original-to-redacted span mapping, and stores no secret text/hash/fingerprint."
  executable_validator_rule: "Rejection gates must be product validators called by unittest or pytest; hardcoded true, fixture self-check, custom PASS counters and no-crash gates are invalid."
  mutation_proof_rule: "Critical validators must be demonstrated by mutations that fail before correction and pass after correction."
  receipt_topology_rule: "The first task commit is plan-only; implementation may use multiple pre-tested commits; receipt is forbidden until complete exact tested-head remote CI and must be the sole final evidence-only commit."
  exact_ci_rule: "Completion requires checkout and assertion of the exact event head on substantive and receipt heads with Python 3.11/3.13 task-named CI; a PR merge ref or unrelated green workflow earns no credit."
  source_trust_rule: "Frozen sources remain failure/design references until current exact tests prove behavior."
  production_cas_rule: "Synthetic contracts are not live production authority or runtime proof."
  secret_rule: "No credential/session/key/private-config disclosure or persistence."
  trade_rule: "No real trading, account, order, position or funds operation."

