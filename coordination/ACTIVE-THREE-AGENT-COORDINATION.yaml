permanent_governance:
  model_selection_owner: "USER_ONLY"
  all_agent_model_mutation_rule: "Agents may not read or modify persistent model/provider/reasoning/default/thread/subagent settings."
  repository_scope_rule: "Engineering routes require exact allowed paths; agents block rather than infer."
  mode_integrity_rule: "An agent may not change project_plan/objective/target mode unless GPT publishes the change in the canonical route."
  single_positive_authority_rule: "A control plane may expose exactly one positive authority chain; parallel caller-usable positive authorities and mirror owner-state records are forbidden."
  capability_witness_rule: "Caller-created observations, bindings or copied identity strings cannot create positive capability or execution identity."
  mandatory_execution_lease_rule: "Effect authorization, invocation attachment, terminal mutation and positive classification must share the actual durable claim and execution lease authority; optional or parallel validators are not authority."
  recoverable_transition_rule: "A durable state transition is incomplete unless an identical post-apply retry can recover the same authority or continuation result after restart without a second mutation."
  request_identity_rule: "Idempotency is granted only to the exact durable request digest and purpose; same-state requests with changed bindings fail closed."
  cross_record_journal_rule: "Every claim/lease multi-record positive transition, including capability creation, requires a purpose-bound durable operation journal and explicit partial-state reconciliation."
  effect_gate_rule: "No verified capability and current integrated lease means no effect authorization. Legacy claim/holder-only or caller-created permit entrypoints remain non-mutating."
  terminal_mutation_rule: "No verifier-minted execution identity, terminal evidence and current integrated lease means no actual DurableClaimRecord terminal mutation."
  expiry_rule: "Expiry, provenance and temporal order are rechecked at every positive stage, reconciliation and ALREADY result; an expired record never grants positive continuation."
  actual_claim_mutation_rule: "Invocation and terminal credit require observed mutation of the actual DurableClaimRecord, never a mirror claim-side model."
  release_evidence_rule: "Release gates derive decisions from actual git graph, repository files and CI-generated provider evidence; caller-declared success objects are non-authoritative."
  original_byte_truth_rule: "Knowledge digestion accepts strict UTF-8 original bytes; parser character positions must be mapped to legal byte boundaries before span creation."
  parser_progress_rule: "Every byte-scanning loop must advance monotonically or terminate with a structured error; malformed input requires timeout-backed mutation proof."
  exact_coverage_rule: "Every source byte has exactly one ATOM_CANDIDATE, STRUCTURE or UNKNOWN_ERROR owner; zero-length, overlap, omission, duplicate ownership and out-of-range fail closed."
  relation_truth_rule: "Semantic relations require executable linking evidence or verifiable rule identity; proximity, adjacency, type pairing and caller-declared labels never create authority."
  redaction_lineage_rule: "Redaction is planned on original bytes, applied in source-span order, records replacement spans during construction and stores no secret text/hash/fingerprint."
  executable_validator_rule: "Rejection gates must be product validators invoked on actual task evidence; hardcoded true, fixture self-check, caller-filled evidence and no-crash gates are invalid."
  mutation_proof_rule: "Critical controls must be demonstrated by active isolated mutations that produce nonzero failures before restoration."
  receipt_topology_rule: "The first task commit is plan-only; implementation may use multiple pre-tested commits; receipt is forbidden until complete exact tested-head remote CI and must be the sole final evidence-only commit."
  exact_ci_rule: "Completion requires checkout and assertion of the exact event head on tested and receipt heads with Python 3.11/3.13 task-named CI, canonical artifacts and independent byte comparison; a PR merge ref or unrelated green workflow earns no credit."
  source_trust_rule: "Frozen sources remain failure/design references until current exact integration and mutation tests prove behavior."
  production_cas_rule: "Synthetic contracts are not live production authority or runtime proof."
  secret_rule: "No credential/session/key/private-config disclosure or persistence."
  trade_rule: "No real trading, account, order, position or funds operation."

