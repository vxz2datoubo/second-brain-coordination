    mitigation: Synthetic corpus, mutation matrix, copied negative cases, and isolated Draft PR.
  - id: H2
    description: E53 source may be mistaken for authority during porting.
    mitigation: Exact selection ledger, no verbatim production copy, E53 marked untrusted.
