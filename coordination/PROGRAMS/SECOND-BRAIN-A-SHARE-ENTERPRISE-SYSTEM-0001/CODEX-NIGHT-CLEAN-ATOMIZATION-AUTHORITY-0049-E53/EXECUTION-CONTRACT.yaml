schema_version: "1.0"
task_id: "CODEX-NIGHT-CLEAN-SOURCE-BOUND-ATOMIZATION-AUTHORITY-ADVERSARIAL-PROVIDER-AND-RECEIPT-CLOSURE-0049-E53"
mode: "project_plan"
agent: "CODEX"
execution_style: "AUTONOMOUS_NIGHT_ENGINEERING_WITH_EVIDENCE"
intended_substantive_engineering_window: ">=4 hours"
artificial_waiting_forbidden: true
automatic_resume_within_task: true
second_user_start_command_required: false
stop_for_intermediate_gpt_review: false
stop_only_on_hard_block_or_final_evidence: true

agent_discretion:
  allowed:
    - "Choose internal abstractions, module boundaries, test frameworks already compatible with the repository, data structures and mutation implementation details."
    - "Add adjacent public-safe tests and validators when they strengthen the declared invariants."
    - "Refactor E53 task-branch code when required to eliminate bypasses, provided scope and provenance remain explicit."
    - "Continue counterexample search after the first green suite."
  required_records:
    - "Every architecture decision and rationale."
    - "At least one serious alternative considered for each major abstraction and why it was rejected."
    - "Unexpected findings, failed approaches and retries."
    - "Any scope expansion, with direct link to a mandatory invariant."
  forbidden:
    - "Changing model/provider/reasoning/private configuration."
    - "Merging, writing main, changing repository settings or rewriting history."
    - "Accessing credentials, accounts, private user data, market data or trading surfaces."
    - "Padding runtime with sleep or idle loops."

completion_rule: >-
  Do not claim completion merely because local tests pass. Completion exists only when clean topology, product validators, real mutations, exact-head six-matrix Provider artifacts, independent byte comparison, tested-head success, one receipt-only commit, receipt-head success and the full evidence report all exist.

reporting_rule: >-
  The final report must be sufficiently granular for GPT to independently check every claim against repository paths, commit SHAs, commands, exit codes, workflow runs, jobs, logs, artifacts and digests. A summary-only report is a failure.
