      - "Every condition/exception/negation in source → structured field in atom"
      - "statements default to CLAIM unless source-evidence upgrade"
    status: "PENDING"

  - id: "S4_CANONICAL_PACKET_HASH"
    description: "Packet ID and content hash cover full semantics including relations, conflicts, UNKNOWNs, lineage."
    deliverables:
      - "Full canonical serialization (sorted, normalized)"
      - "Packet hash = SHA-256(canonical_form)"
      - "tests/test_packet_hash.py — cross-run reproducibility"
    contracts:
      - "Hash covers atoms, relations, all unknowns, all conflicts, source lineage"
      - "Byte-identical across PYTHONHASHSEED values"
    status: "PENDING"

  - id: "S5_SPAN_REDACTION"
    description: "Span-based redaction (no global replacement), no secret-derived hashes, overlap resolution."
    deliverables:
