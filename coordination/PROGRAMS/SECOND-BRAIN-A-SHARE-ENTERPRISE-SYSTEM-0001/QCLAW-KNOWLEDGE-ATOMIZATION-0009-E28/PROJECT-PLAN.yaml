      - "Every source byte is either an atom byte or in a parse_report gap entry with reason"
      - "Code fences are atoms with content_type=code_block"
      - "Invalid UTF-8 fails closed (rejected, not replaced)"
      - "Short headings are atoms with content_type=heading"
