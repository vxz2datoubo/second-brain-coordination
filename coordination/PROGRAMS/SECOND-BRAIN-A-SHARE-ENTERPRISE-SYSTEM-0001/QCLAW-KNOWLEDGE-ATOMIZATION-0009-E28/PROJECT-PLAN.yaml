      - "Canonical packet sha256 identical across runs, roots, PYTHONHASHSEED=0/42/random"
      - "No datetime.now() or os.path.abspath() in canonical output path"
    status: "PENDING"

  - id: "S3_COMPLETE_SEMANTICS"
    description: "Full structured fields: conditions, exceptions, negations, failures, counterexamples, temporal_scope, authority, verification."
    deliverables:
      - "Updated atom schema with all semantic subfields"
      - "Semantic extractor for each field type"
      - "Conservative CLAIM/OPINION/HYPOTHESIS/UNKNOWN classification"
      - "No lexical fact/causality promotion (negative tests)"
