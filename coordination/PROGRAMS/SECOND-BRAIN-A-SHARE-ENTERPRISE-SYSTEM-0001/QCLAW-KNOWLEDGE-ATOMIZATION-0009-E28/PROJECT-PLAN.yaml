      - "Overlap resolution (longer match takes priority)"
      - "No sha256(secret) stored anywhere"
      - "tests/test_redaction.py — overlap, repetition, mixed-document"
    contracts:
      - "Redacted output contains zero raw secrets"
      - "No secret-derived fingerprint or hash in log/atom/output"
      - "Surrounding knowledge preserved at byte level outside redacted spans"
    status: "PENDING"

  - id: "S6_REAL_DIGEST_BATCH"
    description: "Digest at least one pre-existing public-safe repository document with exact commit/blob/path/content hash anchoring."
    deliverables:
      - "Anchor manifest: commit SHA, blob SHA, path, content SHA-256"
      - "Digest output: atoms, relations, UNKNOWNs, conflicts"
      - "Verification: exact-match to source blob from remote"
    contracts:
      - "Source is NOT task-authored (pre-existing in repository)"
      - "All atoms have exact source-span references"
    status: "PENDING"

  - id: "S7_EXACT_EVIDENCE"
    description: "Exact-head dual-Python CI, three isolated-root identity evidence, non-empty evidence-only receipt."
    deliverables:
