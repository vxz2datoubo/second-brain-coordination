global_alternatives:
  - alternative: "Keep all duplicates with _copy / _v2 / _stale suffixes"
    decision: "REJECTED"
    rationale: >
      Creates ambiguity for downstream consumers. Violates single-owner
      artifact class principle. Requires every consumer to implement
      filename-level deduplication — not their responsibility.

  - alternative: "Move duplicates to an archive/ subdirectory"
    decision: "REJECTED"
    rationale: >
      Archive directories inside active PRs are confusing. Git history
      is the correct archive mechanism. Archive directories risk
      accidental reingestion.

  - alternative: "Merge duplicates into parent files"
    decision: "PARTIALLY USED (where content differed)"
    rationale: >
      Where duplicates had genuinely different content, it was merged.
      Where content was byte-identical, removal was chosen instead.

