research:
  - id: "R126-RESEARCH-001"
    question: "Why can a valid omitted atom fail R125 proof despite a successful write?"
    evidence: "Two episodes can produce distinct atom IDs for the same canonical statement; budget=1 lexical ranking selects the lexicographically smaller ID."
    conclusion: "Statement discovery cannot prove one requested identity."
  - id: "R126-RESEARCH-002"
    question: "Can exact identity be proven without restoring a second retrieval authority?"
    evidence: "ContextAssembler can apply its existing candidate-set, caller-observability and admission path directly to one requested atom before any ranking or budget selection."
    conclusion: "Use an internal exact-candidate admission proof; leave normal retrieval unchanged."
  - id: "R126-RESEARCH-003"
    question: "Does exact proof expose foreign or absent identities?"
    evidence: "The helper returns only a boolean and routes missing, foreign or rejected identities to false."
    conclusion: "Caller-visible behavior remains fail-closed and absence-equivalent."
