schema_version: "e57-research-ledger-v1"
agent_id: "CODEX"
scope: "public synthetic authority/evidence engineering only"
entries:
  - id: "E57-R-001"
    proposition: "A normal Python importer must not receive an issuance or registry-insertion capability."
    implementation_evidence: "Issuer ledger and signing material remain in a child process; verifier channel refuses issue action."
    tests: ["direct construction", "copy", "object.__new__", "foreign issuer", "same-id substitution", "module-global enumeration", "type-map replacement"]
    status: "LOCALLY_SUPPORTED_WITH_NARROW_THREAT_MODEL"
    prohibited_inference: "This is not a claim against arbitrary malicious code that already controls the issuer process."
  - id: "E57-R-002"
    proposition: "Semantic authority can be grounded in raw ownership and execution records rather than caller labels."
    implementation_evidence: "Typed JSON, raw byte partitions, conflict-source distinction, validation receipt binding, redaction range/policy, and relation endpoint binding."
    tests: ["UTF-8", "surrogate pairs", "boolean/null typing", "JSONL", "Markdown UNKNOWN", "partition gap", "conflict", "validation", "redaction", "relation"]
    status: "LOCALLY_SUPPORTED"
  - id: "E57-R-003"
    proposition: "Mutation evidence is genuine only if it changes a real source byte sequence, triggers its named test failure, and restores exact bytes."
    implementation_evidence: "Fourteen disposable-copy source mutations, each with before/mutated/restored SHA-256 and named test execution."
    status: "LOCALLY_SUPPORTED"
  - id: "E57-R-004"
    proposition: "Provider evidence must be separately reconstructed from downloaded records and bound to a known external digest."
    implementation_evidence: "Provider mapping round-trip, independent file verifier, external-digest failure case, and clean Git archive verifier."
    status: "LOCAL_IMPLEMENTATION_READY_REMOTE_EVIDENCE_PENDING"
negative_evidence_policy: "A green local test, a structurally valid JSON file, or a producer-supplied PASS field alone never promotes an authority claim."
