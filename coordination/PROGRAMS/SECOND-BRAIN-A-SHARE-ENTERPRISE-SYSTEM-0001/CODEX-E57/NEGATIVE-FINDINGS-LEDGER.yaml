schema_version: "e57-negative-findings-ledger-v1"
entries:
  - id: "E57-N-001"
    finding: "Initial E57 substantive commit accidentally included seven Python bytecode cache files."
    classification: "HISTORY_HYGIENE_DEFECT_CORRECTED_WITHOUT_REWRITE"
    evidence:
      introduced_commit: "c689570dfc78c03d38ce58b5a88df25a362ae845"
      removal_commit: "8a5dcb0d13920ff4f3770996f5303c5c677d7125"
      retained_in_final_tree: false
    remediation: "Task-local .gitignore added; topology reports transient generated paths and refuses retained generated/runtime paths."
  - id: "E57-N-002"
    finding: "A first Provider mutation used shared job identities, allowing the shared-artifact invariant to fail for the wrong reason."
    classification: "TEST_ISOLATION_DEFECT_CORRECTED"
    remediation: "Receipt fixture now uses distinct job IDs while intentionally overlapping only artifact IDs."
  - id: "E57-N-003"
    finding: "An early GitHub Actions run did not start product execution."
    classification: "EXTERNAL_PROVIDER_INFRASTRUCTURE_FAILURE"
    evidence: "Run 31120300037: Service Unavailable while resolving action download information."
    remediation: "Preserve as negative evidence; require a later complete exact-head run rather than retrying by assertion."
  - id: "E57-N-004"
    finding: "A PowerShell wrapper malformed the unittest invocation before tests started."
    classification: "LOCAL_COMMAND_WRAPPER_FAILURE"
    remediation: "Use a base64-encoded Python subprocess wrapper; retain only its successful command evidence as test proof."
  - id: "E57-N-005"
    finding: "A direct single-test invocation exposed an implicit cross-test fixture import."
    classification: "TEST_FIXTURE_IMPORT_DEFECT_CORRECTED"
    remediation: "Synthetic Provider fixtures now live in an explicit tests package and no mutation relies on a discovery-only import side effect."
  - id: "E57-N-006"
    finding: "Provider evidence shape validation alone cannot detect a syntactically valid post-download substitution."
    classification: "ARCHITECTURE_GAP_CORRECTED"
    remediation: "External expected evidence digests and a clean-archive verifier are now required."
