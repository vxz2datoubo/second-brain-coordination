schema_version: "1.0"
task_id: "CODEX-E55-POST-RECEIPT-CANONICAL-EVALUATION-FORMAT-OWNERSHIP-PROVIDER-COMPARE-MUTATION-RESULT-TOPOLOGY-HYGIENE-AND-RECEIPT-CLOSURE-0052-E56"
entries:
  - finding_id: "E56-NF-001"
    class: "TEST_ISOLATION"
    status: "RESOLVED_IN_TASK"
    observation: "A real source mutation and ordinary full suite were accidentally invoked concurrently during local development."
    implication: "A passing or failing result during overlap is not valid evidence."
    control: "Run ordinary suite first; run one mutation at a time; restore exact bytes; rerun its named test."
  - finding_id: "E56-NF-002"
    class: "MUTATION_TEST_MASKING"
    status: "RESOLVED_IN_TASK"
    observation: "Three initial counterexamples were also rejected by a different later invariant, so they did not demonstrate the intended predicate kill."
    implication: "A green mutation count can be self-confirming unless each test isolates the mutated predicate."
    control: "Use duplicate artifact identity, valid extra-job metadata, and an environment-slot payload as isolated counterexamples."
  - finding_id: "E56-NF-003"
    class: "LOCAL_RUNTIME_GAP"
    status: "OPEN"
    observation: "This host exposes Python 3.12 and 3.13 but not Python 3.11."
    implication: "The required py3.11 Provider evidence cannot be truthfully produced locally."
    control: "Require the GitHub Actions py3.11/3.13 exact-head matrix before receipt creation."
