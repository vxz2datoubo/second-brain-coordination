    expected: "Distinct identity_domain_hash, proposition_id and canonical atom ID; a user-bound query returns only its own atom."
    test_gate: "Synthetic identity collision plus cross-user zero-recall test."
  - case: "same proposition / same domain / two independent sources"
    expected: "One proposition lineage with both source provenance records; DUPLICATE does not add a second proposition vote."
    test_gate: "Packet replay/provenance-union/idempotency test."
  - case: "same text / different project or privacy domain"
    expected: "Distinct domain identities and zero retrieval across domains; no implicit sharing."
    test_gate: "Cross-project/privacy fail-closed test."
  - case: "user-bound QueryPlan knowledge admission"
    expected: "Authorized governed KnowledgeAtom admits; foreign-user equivalent rejects before ranking."
