knowledge_identity_and_provenance_freeze:
  identity_version: "knowledge-proposition-domain-v1"
  semantic_proposition_identity:
    definition: >-
      proposition_id is a deterministic hash of normalized proposition content, epistemic role/taxonomy version and identity_domain_hash.
      identity_domain_hash is a deterministic hash of user_scope, project_scope and privacy_domain under this version. Source episode ID, source
      manifest and source content hash are intentionally excluded from proposition_id.
    collision_rule: "Same normalized proposition in a foreign user, project or privacy domain gets a different proposition_id and canonical atom ID."
    same_domain_rule: "Same normalized proposition and epistemic role in one identity domain resolves to one proposition lineage, not one atom per source."
    canonical_atom_rule: >-
      P1 must use a verified KnowledgeAtom ID derived from proposition_id, rather than generic atom_id(statement, atom_type, scope), while preserving
      the existing LearningPacket atomic/idempotent boundary. The displayed project scope is not permitted to substitute for identity_domain_hash.
  source_evidence_identity:
    definition: "Each immutable KnowledgeEpisode/source manifest keeps its own content hash, locator/span and evidence ID."
    attachment_rule: >-
      Multiple independent sources attach as packet/source provenance to one same-domain proposition lineage. Packet-to-atom links and an additive
      evidence-manifest union must preserve every source; a later upsert must not make earlier evidence inaccessible.
  duplicate_voting_prevention:
    duplicate: "DUPLICATE adds provenance to the existing proposition lineage and produces no additional proposition vote."
    support_weaken: "Independent SUPPORT/WEAKEN evidence is represented as evidence lineage/typed relation, not another equivalent proposition atom."
    contradict: "Materially incompatible proposition remains a distinct domain-bound lineage with explicit CONTRADICT/conflict relation."
  sharing_boundary: "Cross-domain sharing/global promotion requires a future explicit governed operation; this route creates none and formal promotion remains locked."

knowledge_query_scope_admission_freeze:
  governed_metadata_required:
    - "identity_version"
    - "identity_domain_hash"
    - "user_scope"
    - "project_scope"
    - "privacy_domain"
    - "proposition_id"
    - "epistemic_role"
    - "valid_from / valid_to / recorded_at"
    - "freshness / revalidation state"
    - "evidence_manifest_ids"
  P1_query_binding: >-
    KnowledgeAtom admission requires QueryPlan user_scope, exactly authorized project scope, allowed privacy domain and a timezone-aware valid_at.
    Missing or malformed knowledge metadata, missing query fields or any mismatch rejects the atom. Generic atoms retain their existing behavior;
    knowledge atoms receive no legacy permissive fallback.
  admission_order:
    - "identity domain and user/project/privacy exact match"
    - "CURRENT/HISTORICAL valid-time, freshness, stale/revoked/superseded gate"
    - "verification/evidence floor and relation budget"
    - "lexical, semantic or structural candidate ranking only after admission"
  anti_bypass: "Semantic/structural similarity, provenance adjacency and relation traversal cannot bypass the above admission order."

r111_p0_acceptance_case_matrix:
