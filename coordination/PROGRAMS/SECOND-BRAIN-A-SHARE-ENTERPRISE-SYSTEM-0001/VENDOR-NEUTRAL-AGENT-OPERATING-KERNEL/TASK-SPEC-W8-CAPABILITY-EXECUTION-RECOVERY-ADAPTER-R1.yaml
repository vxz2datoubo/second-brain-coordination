  responsibilities:
    - "CapabilityDescriptor registry and ToolRouteDecision runtime binding"
    - "ExecutionCheckpoint, side-effect ledger, AgentHandoff and feature flags"
  must_not_own: ["authority lease", "knowledge memory", "model evaluation"]
