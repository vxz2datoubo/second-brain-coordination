  source_id: "SRC-CLAUDE-OPUS5-PUBLIC-CAPTURE-20260726"
  authenticity: "UNVERIFIED_THIRD_PARTY_CAPTURE"
  license_status: "UNKNOWN"
  raw_import_allowed: false
  git_blob_sha: "508fcbbb8f74c4aa7437f86b203bfc8a17267937"
  sha256: "a6d256384c62a8ea4113a2edda7977aa1145be4abd1cd8c82b73c2c0eb87a111"
  logical_lines: 1511
  bytes: 135669

disposition_enum:
  - KEEP_MECHANISM
  - ADAPT_TO_EXISTING_AUTHORITY
  - REPLACE_WITH_PROJECT_CONTRACT
  - SEPARATE_POLICY_OR_ADAPTER
  - EXCLUDE_FROM_COMMON_KERNEL

decisions:
  - mechanism: "product_identity_and_vendor_reminders"
    disposition: "EXCLUDE_FROM_COMMON_KERNEL"
    reason: "Brand identity and product promotion are not cognitive capabilities."
    target: null

  - mechanism: "vendor_app_recommendation_and_partner_routing"
    disposition: "EXCLUDE_FROM_COMMON_KERNEL"
    reason: "Routing must optimize semantic and evidence fit, not commercial preference."
    target: null

  - mechanism: "vendor_specific_tool_schemas"
    disposition: "SEPARATE_POLICY_OR_ADAPTER"
    reason: "Provider schemas belong in adapters and capability descriptors."
    target: "W8 CapabilityRegistry"

  - mechanism: "persistent_memory_listing_and_read_before_ask"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Reuse QueryPlan and ContextBundle instead of chat-product memory."
    target: "W3 and Phase 3 memory"

  - mechanism: "stated_only_memory"
    disposition: "REPLACE_WITH_PROJECT_CONTRACT"
    reason: "Typed provenance allows learning while preventing inference contamination."
    target: "EpistemicClaim and MemoryWriteProposal"

  - mechanism: "version_guarded_memory_edits"
    disposition: "KEEP_MECHANISM"
    reason: "Optimistic concurrency and conflict preservation are model-neutral."
    target: "W3 memory transaction and snapshot contracts"

  - mechanism: "subject_scoped_memory_files"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Use KnowledgeAtom scopes and reconstructable views, not a second file memory."
    target: "W3"

  - mechanism: "automatic_memory_write"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Generate candidate proposals without canonical self-promotion."
    target: "MemoryWriteProposal"

  - mechanism: "search_when_freshness_matters"
    disposition: "KEEP_MECHANISM"
    reason: "Temporal instability should trigger live verification."
    target: "TaskIntent evidence budget and QueryPlan"

  - mechanism: "primary_source_preference_and_conflict_checks"
    disposition: "KEEP_MECHANISM"
    reason: "Evidence hierarchy and counterevidence improve epistemic quality."
    target: "EvidenceItem and ValidationPipeline"

  - mechanism: "fixed_search_call_counts"
    disposition: "REPLACE_WITH_PROJECT_CONTRACT"
    reason: "Use marginal evidence gain and task risk rather than a static count."
    target: "VerificationBudgetController candidate"

  - mechanism: "ask_user_tool"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Clarify only when ambiguity materially changes outcome or side effects."
    target: "IntentCompiler"

  - mechanism: "tool_category_routing"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Generalize to deterministic provider-neutral capability scoring."
    target: "CapabilityRouter"

  - mechanism: "artifact_creation_and_presentation"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Use ArtifactRegistry, ownership, validation, and public/private classification."
    target: "Collaboration control plane"

  - mechanism: "conversation_search"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Use governed memory retrieval, not vendor chat-history semantics."
    target: "QueryPlan and ContextBundle"

  - mechanism: "visual_output_routing"
    disposition: "SEPARATE_POLICY_OR_ADAPTER"
    reason: "Presentation behavior belongs to media and visualization Skills."
    target: "Domain Skills"

  - mechanism: "progress_updates_and_conciseness"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Communication policy should be calibrated to user and task."
    target: "ModelBehaviorProfile"

  - mechanism: "over_verification_and_subagent_controls"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Model-version quirks belong in evaluated behavior profiles."
    target: "ModelBehaviorProfile"

  - mechanism: "citations_and_source_trace"
    disposition: "ADAPT_TO_EXISTING_AUTHORITY"
    reason: "Use project provenance and artifact trace instead of proprietary tags."
    target: "EvidenceItem, ContextBundle, and CompletionReceipt"

  - mechanism: "vendor_normative_persona_and_ideology"
    disposition: "EXCLUDE_FROM_COMMON_KERNEL"
    reason: "A vendor worldview or consumer-product persona must not become project cognition."
    target: null

  - mechanism: "operational_integrity_controls"
    disposition: "KEEP_MECHANISM"
    reason: "Truthful evidence, explicit authority, rollback, and credential isolation are engineering correctness."
    target: "W1 governance and common contracts"

  - mechanism: "copyright_and_license_controls"
    disposition: "SEPARATE_POLICY_OR_ADAPTER"
    reason: "Publication policy stays separate while source provenance remains mandatory."
    target: "SourceRecord and ArtifactRegistry"

  - mechanism: "runtime_identity_and_environment"
    disposition: "REPLACE_WITH_PROJECT_CONTRACT"
    reason: "Use model-neutral runtime identity and capability negotiation."
    target: "ModelBehaviorProfile and CapabilityDescriptor"
