# Classification algorithm
classification_rules:
  - rule: "named_person_quarantine"
    priority: 1
    description: >
      If atom deterministic_id is in QUARANTINE-MANIFEST.yaml, classify as PERSON_IDENTITY_QUARANTINED.
      No family/subtype/agent identity emitted.

  - rule: "source_field_driven_mapping"
    priority: 2
    description: >
      If atom has recognized subject_family that maps to a D2 family:
      a) If confidence=LOW AND misclassification_risk=HIGH → AMBIGUOUS with multiple hypotheses
      b) Otherwise → MAPPED with d2_family + d2_subtype (resolved via mapping tables)
      Subject_family takes precedence over perspective_class.

  - rule: "no_subject_family"
    priority: 3
    description: >
      If atom has NO subject_family:
      a) atom_type in (FACT, CONSTRAINT, RISK) + perspective_class= MARKET_STRUCTURE → CONTEXT_ONLY
      b) atom_type=VALIDATION_TASK → UNMAPPED
      c) atom_type=HYPOTHESIS + perspective_class=NORMATIVE_ADVICE → CONTEXT_ONLY
      d) Others → UNMAPPED

  - rule: "unmapped_family"
    priority: 4
    description: >
      If atom has subject_family but not in mapping table → UNMAPPED

  - rule: "no_unmapped_unknown_family"
    priority: 5
    description: >
      UNMAPPED_UNKNOWN must NEVER appear as a family value.
      UNMAPPED disposition uses no family field.

# Lossless field preservation
preserved_fields:
  - source_deterministic_id
  - source_atom_type
  - source_confidence
  - source_evidence_status
  - source_evidence_references
  - source_counterevidence_references
  - source_unknown_state
  - source_field_hash

# No authority upgrade rules
no_upgrade_rules:
  - description: "CLAIM must NOT be upgraded to source_atom_type=FACT"
  - description: "HYPOTHESIS must NOT be upgraded to CLAIM"
  - description: "UNKNOWN must NOT be upgraded to any higher certainty type"
  - description: "confidence must NOT increase from source value"
  - description: "evidence_status must NOT be upgraded from source value"
