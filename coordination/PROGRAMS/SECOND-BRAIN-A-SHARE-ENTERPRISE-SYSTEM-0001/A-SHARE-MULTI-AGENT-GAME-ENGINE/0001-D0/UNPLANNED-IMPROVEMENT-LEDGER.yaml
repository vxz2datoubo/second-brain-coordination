entries:
  - improvement_id: "UIP-MAGE-003"
    classification: "A_SAFE_LOCAL_AUTONOMOUS"
    change: "Replaced public physical local paths with stable aliases and added a dedicated path-hygiene scan."
    reason: "Epoch 3 review found local-path disclosure in a PUBLIC_SAFE artifact."
    impact: "Public documentation only; evidence semantics remain traceable through alias definitions."
    rollback: "Revert the R2 audit rewrite; do not publish physical paths."
  - improvement_id: "UIP-MAGE-004"
    classification: "B_BOUNDED_IMPLEMENT_AND_REPORT"
    change: "Added competing-hypotheses requirement to best-response action records after fail-closed validation."
    reason: "Action-level alternatives are necessary to prevent identity/narrative collapse."
    impact: "Backward-compatible contract clarification; no runtime implementation."
    rollback: "Revert the single contract-field addition if a future canonical owner rejects it."
  - improvement_id: "UIP-MAGE-001"
    classification: "B_IMPLEMENT_AND_REPORT"
    change: "Added explicit source-perspective, source-correlation and calibration boundaries for frozen PR #93 candidate inputs."
    reason: "Issue #23 requires non-asymmetric credibility governance and prevents authority inflation."
    impact: "Adds documentation only; no external contract, data permission or runtime changes."
    rollback: "Remove the candidate-only documents from the D0 branch."
  - improvement_id: "UIP-MAGE-002"
    classification: "A_DIRECT"
    change: "Added a system-of-record map and forbidden dependency edges."
    reason: "Prevents a second memory, evidence, replay or trading runtime."
    impact: "Clarifies existing ownership without changing owners."
    rollback: "Revert D0 package."
