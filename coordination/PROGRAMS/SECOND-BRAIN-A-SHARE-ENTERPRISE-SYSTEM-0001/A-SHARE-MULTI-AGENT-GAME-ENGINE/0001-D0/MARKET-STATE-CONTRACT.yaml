schema_version: "1.0"
record_type: "MarketStateContract"
status: "Interface"
required_fields:
  - "state_id"
  - "event_time"
  - "available_at"
  - "market_phase"
  - "rule_snapshot_ref"
  - "security_status_ref"
  - "price_limit_state"
  - "trading_halt_state"
  - "data_capability_snapshot"
  - "lineage_refs"
  - "unknown_flags"
  - "state_transition_reason"
  - "observability_boundary"
  - "forbidden_downstream_use"
market_phase_values:
  - "pre_open"
  - "call_auction"
  - "continuous_auction"
  - "midday_break"
  - "closing_auction"
  - "post_close"
  - "halted"
rules:
  event_time: "Never substitute local receive time for source or exchange event time."
  rule_snapshot_ref: "Must identify an effective-date version; D0 stores no hard-coded current rule as timeless fact."
  price_limit_state: "Unknown when status, board or rule evidence is unavailable."
  data_capability_snapshot: "Must distinguish five-level, ten-level, aggregate, raw-event and historical-bar capabilities."
  available_at: "Information unavailable at the state cutoff cannot enter the InformationSet."
  state_transition_reason: "Every phase, halt, limit or settlement transition records the snapshot-backed reason."
  observability_boundary: "Observable fields, withheld fields and UNKNOWNs remain distinguishable."
forbidden_uses:
  - "implicit historical rule reconstruction"
  - "identity label"
  - "order emission"
  - "using a local receive time as exchange event time"
  - "turning aggregate observation into raw order or identity evidence"
