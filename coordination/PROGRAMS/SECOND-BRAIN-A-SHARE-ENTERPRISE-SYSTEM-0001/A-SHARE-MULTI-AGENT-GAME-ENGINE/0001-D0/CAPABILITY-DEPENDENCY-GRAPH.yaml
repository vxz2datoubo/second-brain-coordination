schema_version: "1.0"
record_type: "CapabilityDependencyGraph"
nodes:
  - id: "source_evidence_contracts"
    owner: "brain_core.contracts"
    status: "VERIFIED_LOCAL"
  - id: "data_capability_governance"
    owner: "brain_core.foundation_data_governance"
    status: "VERIFIED_LOCAL"
  - id: "research_validation"
    owner: "brain_core.trading_domain"
    status: "VERIFIED_LOCAL"
  - id: "participant_hypothesis_contract"
    owner: "issue_23_d0"
    status: "CANDIDATE_CONTRACT"
  - id: "synthetic_rules_mvp"
    owner: "future_task"
    status: "Future Roadmap"
    blocking_scope: "all numeric simulation outputs"
    evidence_requirement: "synthetic fixtures, deterministic reducer and invariant suite"
    latest_resolution_phase: "D1"
    rollback_effect: "freeze candidate outputs; preserve test evidence"
  - id: "point_in_time_replay_calibration"
    owner: "future_task"
    status: "BLOCKED_BY_DATA_ADMISSION"
    blocking_scope: "replay, backtest and performance claims"
    evidence_requirement: "approved admission manifest, versioned rule/status snapshots and availability audit"
    latest_resolution_phase: "D3"
    rollback_effect: "withdraw manifest and quarantine derived artifacts"
  - id: "level_k_self_play_marl"
    owner: "future_task"
    status: "BLOCKED_BY_SYNTHETIC_AND_CALIBRATION_GATES"
    blocking_scope: "advanced model training and promotion"
    evidence_requirement: "D1-D4 acceptance plus registered compute and independent validation"
    latest_resolution_phase: "D6"
    rollback_effect: "freeze or reject model; no execution side effect"
edges:
  - from: "source_evidence_contracts"
    to: "participant_hypothesis_contract"
    relation: "provides_provenance"
  - from: "data_capability_governance"
    to: "participant_hypothesis_contract"
    relation: "limits_observability"
  - from: "participant_hypothesis_contract"
    to: "synthetic_rules_mvp"
    relation: "defines_interfaces"
  - from: "synthetic_rules_mvp"
    to: "point_in_time_replay_calibration"
    relation: "must_precede"
  - from: "point_in_time_replay_calibration"
    to: "level_k_self_play_marl"
    relation: "must_precede"
  - from: "participant_hypothesis_contract"
    to: "research_validation"
    relation: "candidate_input_only"
forbidden_edges:
  - "participant_hypothesis_contract -> trading_execution"
  - "expert_claim -> market_fact"
  - "aggregate_l2_field -> raw_order_event"
