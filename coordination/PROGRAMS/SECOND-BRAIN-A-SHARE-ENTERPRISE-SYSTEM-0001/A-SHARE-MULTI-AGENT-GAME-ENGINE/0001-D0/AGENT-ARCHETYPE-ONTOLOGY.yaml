schema_version: "1.0"
record_type: "AgentArchetypeOntology"
status: "CANDIDATE_CONTRACT"
identity_rule: "All participant types are latent hypotheses; no observation can emit a confirmed real identity."
families:
  - family_id: "quant_strategy"
    description: "Rule-based or model-based strategies with heterogeneous horizons and infrastructure."
    subtypes:
      - "liquidity_provision_candidate"
      - "short_horizon_execution_candidate"
      - "cross_sectional_statistical_candidate"
      - "trend_or_breakout_candidate"
    default_evidence_limit: "Aggregate snapshots cannot distinguish these subtypes."
  - family_id: "active_speculative_capital"
    description: "Short-horizon, attention-sensitive capital with variable holding periods and execution capacity."
    subtypes:
      - "event_attention_candidate"
      - "theme_relay_candidate"
      - "momentum_continuation_candidate"
      - "liquidity_reversal_candidate"
    default_evidence_limit: "A price-volume pattern is not proof of coordinated or single-owner activity."
  - family_id: "large_capital_and_inventory"
    description: "Capital with material inventory, organizational constraints or longer holding horizons."
    subtypes:
      - "public_fund_candidate"
      - "private_fund_candidate"
      - "policy_or_stabilization_candidate"
      - "industrial_capital_candidate"
      - "foreign_capital_candidate"
      - "index_or_passive_rebalance_candidate"
    default_evidence_limit: "Large observed flow can have multiple independent causes."
  - family_id: "retail_population"
    description: "A heterogeneous population with differing attention, skill, inventory and holding horizon."
    subtypes:
      - "attention_driven_candidate"
      - "anchored_inventory_candidate"
      - "long_horizon_holder_candidate"
      - "active_individual_candidate"
    default_evidence_limit: "Small prints and retail narratives do not identify account type."
common_hypothesis_fields:
  - "hypothesis_id"
  - "family_id"
  - "subtype_id"
  - "posterior_probability"
  - "prior_basis"
  - "supporting_evidence_refs"
  - "counterevidence_refs"
  - "alternative_hypothesis_ids"
  - "market_phase"
  - "time_horizon"
  - "feasibility_constraints"
  - "invalidation_conditions"
  - "evidence_quality"
forbidden_uses:
  - "real identity attribution"
  - "account-level inventory attribution"
  - "direct trade instruction"
  - "performance claim"
