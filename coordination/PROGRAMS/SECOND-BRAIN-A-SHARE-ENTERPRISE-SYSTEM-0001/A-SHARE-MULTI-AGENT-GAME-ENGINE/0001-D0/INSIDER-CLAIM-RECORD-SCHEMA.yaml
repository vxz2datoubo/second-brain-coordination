schema_version: "1.0"
record_type: "InsiderClaimRecordSchema"
status: "CANDIDATE_CONTRACT"
required_fields:
  - "claim_id"
  - "expert_source_profile_ref"
  - "source_record_ref"
  - "perspective"
  - "claim_kind"
  - "as_of_or_prediction_window"
  - "interest_conflicts"
  - "evidence_refs"
  - "counterevidence_refs"
  - "verification_state"
  - "credibility_vector"
  - "candidate_action"
  - "forbidden_downstream_use"
verification_states: ["unverified", "partially_corrobated", "corroborated", "refuted", "unknown"]
candidate_action_rule: "May create a validation task, never an order or identity label."
