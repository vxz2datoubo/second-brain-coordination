schema_version: "2.0"
record_type: "RationalAndBestResponseActionContract"
status: "Interface"
semantic_boundary: "candidate hypothesis; not an order, recommendation, identity claim or performance estimate"
action_record_required_fields:
  - "action_hypothesis_id"
  - "classification"
  - "archetype_hypothesis_ref"
  - "decision_horizon"
  - "utility_components"
  - "utility_units_and_unknowns"
  - "information_set_ref"
  - "feasibility_evaluation"
  - "constraint_evaluation_order"
  - "rule_snapshot_ref"
  - "inventory_constraints"
  - "cost_and_impact_assumptions"
  - "fill_probability_assumptions"
  - "opponent_hypotheses"
  - "supporting_evidence_refs"
  - "counterevidence_refs"
  - "confounders"
  - "abstention_semantics"
  - "invalidation_conditions"
  - "forbidden_downstream_use"
classification_values:
  - "feasible"
  - "rational_candidate"
  - "best_response_candidate"
  - "most_consistent_hypothesis"
  - "robust_hypothesis"
  - "invalid_or_blocked"
  - "abstain"
utility_components:
  expected_value_candidate:
    unit: "declared future-task utility unit or UNKNOWN"
    meaning: "Candidate objective term; never a profitability claim in D0."
  fill_probability_candidate:
    unit: "probability only after calibration; otherwise UNKNOWN"
    meaning: "Does not imply queue priority or raw order visibility."
  impact_candidate:
    unit: "declared price/utility unit or UNKNOWN"
    meaning: "Synthetic assumption until separately calibrated."
  cost_candidate:
    unit: "declared cost unit or UNKNOWN"
    meaning: "Must include what is excluded."
  risk_candidate:
    unit: "declared loss/risk measure or UNKNOWN"
    meaning: "Cannot be combined with other terms until units/horizon align."
  opponent_response_candidate:
    unit: "scenario score or UNKNOWN"
    meaning: "Competing latent-type hypotheses must remain present."
constraint_evaluation_order:
  - "source_capability_and_available_at"
  - "rule_snapshot_and_security_status"
  - "market_phase_and_halt"
  - "price_limit_and_order_validity"
  - "fresh_seasoned_pending_inventory"
  - "quantity_capacity_and_cost_assumptions"
  - "candidate_utility_comparison"
blocking_rules:
  - "Unknown security status, rule snapshot, source capability, required unit or required inventory state produces invalid_or_blocked or abstain."
  - "A fresh same-day buy cannot be represented as a same-day sale where the applicable rule snapshot forbids it."
  - "No action becomes feasible by absence of a constraint."
  - "No candidate may emit an executable order, target position or real participant identity."
deterministic_examples:
  - scenario: "Synthetic fresh inventory with a rule snapshot prohibiting same-day sale."
    expected: "sell action is invalid_or_blocked; abstention reason cites fresh inventory and snapshot."
  - scenario: "Two latent archetypes fit the same aggregate observation with UNKNOWN raw-event capability."
    expected: "most_consistent_hypothesis retains both alternatives; no identity label or best response is promoted."
