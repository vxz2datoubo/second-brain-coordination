schema_version: "1.0"
record_type: "RationalAndBestResponseActionContract"
status: "Interface"
action_record_required_fields:
  - "action_hypothesis_id"
  - "classification"
  - "archetype_hypothesis_ref"
  - "objective_decomposition"
  - "feasibility_evaluation"
  - "rule_snapshot_ref"
  - "inventory_constraints"
  - "cost_and_impact_assumptions"
  - "fill_probability_assumptions"
  - "opponent_response_assumptions"
  - "supporting_evidence_refs"
  - "counterevidence_refs"
  - "confidence_status"
  - "confounders"
  - "invalidation_conditions"
  - "forbidden_downstream_use"
classification_values:
  - "feasible"
  - "rational_candidate"
  - "best_response_candidate"
  - "most_consistent_hypothesis"
  - "robust_hypothesis"
  - "invalid_or_blocked"
blocking_rules:
  - "A fresh same-day buy cannot be represented as a same-day sale where the applicable rule snapshot forbids it."
  - "Unknown security status, rule snapshot or required capability produces invalid_or_blocked or abstain."
  - "No action may become executable by absence of a constraint."
