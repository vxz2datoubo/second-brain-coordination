schema_version: "1.0"
record_type: "AgentPolicyContract"
status: "Interface"
required_fields:
  - "policy_id"
  - "archetype_hypothesis_ref"
  - "objective_components"
  - "information_set_refs"
  - "inventory_state_ref"
  - "feasibility_constraints"
  - "candidate_actions"
  - "opponent_hypotheses"
  - "evidence_refs"
  - "counterevidence_refs"
  - "invalidation_conditions"
  - "forbidden_downstream_use"
  - "decision_horizon"
  - "utility_units"
  - "abstention_semantics"
  - "competing_hypotheses"
objective_components:
  - "expected_value_candidate"
  - "impact_candidate"
  - "fill_probability_candidate"
  - "cost_candidate"
  - "risk_candidate"
  - "opponent_response_candidate"
constraints:
  - "rule_snapshot"
  - "market_phase"
  - "price_limit"
  - "suspension"
  - "fresh_vs_seasoned_inventory"
  - "cross_day_inventory"
  - "capacity"
  - "data_capability"
policy_output_rule: "Outputs are candidate hypotheses with abstention allowed, never executable trade instructions."
evaluation_order:
  - "available_at_and_capability"
  - "rule_snapshot_and_security_status"
  - "market_phase_and_halt"
  - "inventory_and_order_feasibility"
  - "utility_terms_with_aligned_units"
  - "competing_hypothesis_and_counterevidence_review"
unknown_rule: "Missing evidence, unit, horizon or applicable constraint must produce abstain or invalid_or_blocked."
