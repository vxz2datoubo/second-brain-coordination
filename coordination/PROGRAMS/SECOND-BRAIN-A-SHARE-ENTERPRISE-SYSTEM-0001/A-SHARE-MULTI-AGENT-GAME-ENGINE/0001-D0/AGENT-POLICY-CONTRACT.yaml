schema_version: "1.0"
record_type: "AgentPolicyContract"
status: "Interface"
required_fields:
  - "policy_id"
  - "archetype_hypothesis_ref"
  - "objective_components"
  - "information_set_refs"
  - "inventory_state_ref"
  - "feasibility_constraints"
  - "candidate_actions"
  - "opponent_hypotheses"
  - "evidence_refs"
  - "counterevidence_refs"
  - "invalidation_conditions"
  - "forbidden_downstream_use"
objective_components:
  - "expected_value_candidate"
  - "impact_candidate"
  - "fill_probability_candidate"
  - "cost_candidate"
  - "risk_candidate"
  - "opponent_response_candidate"
constraints:
  - "rule_snapshot"
  - "market_phase"
  - "price_limit"
  - "suspension"
  - "fresh_vs_seasoned_inventory"
  - "cross_day_inventory"
  - "capacity"
  - "data_capability"
policy_output_rule: "Outputs are candidate hypotheses with abstention allowed, never executable trade instructions."
