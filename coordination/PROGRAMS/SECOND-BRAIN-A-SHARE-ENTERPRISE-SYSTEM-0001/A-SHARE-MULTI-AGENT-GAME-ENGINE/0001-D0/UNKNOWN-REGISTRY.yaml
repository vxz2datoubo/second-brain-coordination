schema_version: "1.0"
record_type: "UnknownRegistry"
boundary: "research_only / NO_TRADE"
items:
  - unknown_id: "UNK-MAGE-001"
    subject: "real participant identity and private inventory"
    status: "UNKNOWN"
    why: "Market observations do not expose legal owner, objective, information set or inventory provenance."
    prohibited_inference: "identity certainty from price, volume, book or fund-flow patterns"
    closure_requirement: "independent, permitted, point-in-time evidence with alternative-hypothesis review"
  - unknown_id: "UNK-MAGE-002"
    subject: "raw order, cancellation, queue and trade-event availability"
    status: "PARTIALLY_VERIFIED"
    why: "Local governance verifies L2 aggregates only; raw event capabilities remain gated."
    prohibited_inference: "microstructure intent or queue priority from aggregate fields"
    closure_requirement: "authorized source capability card, field semantics and independent runtime verification"
  - unknown_id: "UNK-MAGE-003"
    subject: "historical A-share rule and security-status point-in-time snapshots"
    status: "UNKNOWN"
    why: "D0 performs no data admission or historical replay."
    prohibited_inference: "historically valid feasibility labels without a versioned rule snapshot"
    closure_requirement: "approved rule/status snapshot and provenance manifest"
  - unknown_id: "UNK-MAGE-004"
    subject: "PR #93 expert claims and proposed scores"
    status: "CANDIDATE_ONLY"
    why: "PR #93 is an unmerged Draft and its source claims have not been independently validated."
    prohibited_inference: "treating article claims as market facts or trading signals"
    closure_requirement: "GPT acceptance plus claim-level evidence and calibration review"
  - unknown_id: "UNK-MAGE-005"
    subject: "causal effect and tradable value of participant-model outputs"
    status: "NOT_IMPLEMENTED"
    why: "No synthetic, historical or out-of-sample validation runs occur in D0."
    prohibited_inference: "profitability, predictive edge or production readiness"
    closure_requirement: "separate approved validation program with point-in-time, cost and calibration gates"
  - unknown_id: "UNK-MAGE-006"
    subject: "numeric coefficients, matching details, impact, cost and fill-probability units"
    status: "UNKNOWN"
    why: "D0 intentionally has no admitted data or calibrated numerical model."
    prohibited_inference: "inventing coefficients or interpreting synthetic utility as market performance"
    closure_requirement: "registered synthetic assumptions followed by approved calibration and baseline comparison"
  - unknown_id: "UNK-MAGE-007"
    subject: "remote Git commit SHA identity after API transport fallback"
    status: "PARTIALLY_VERIFIED"
    why: "Public content tree equality can be proved even when local Git and GitHub API commits differ."
    prohibited_inference: "claiming commit hashes are identical without a parent/tree proof"
    closure_requirement: "REMOTE-PUBLICATION-AND-TREE-EQUALITY-RECEIPT plus external PR/Issue SHA anchor"
