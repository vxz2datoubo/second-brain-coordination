schema_version: "1.0"
record_type: "RiskRegister"
boundary: "PUBLIC_SAFE / CANDIDATE_ONLY / research_only / NO_TRADE"
risks:
  - risk_id: "RISK-MAGE-001"
    name: "identity narrative inflation"
    severity: "HIGH"
    trigger: "behavioral observation is emitted as a confirmed participant identity"
    control: "latent hypotheses, posterior probabilities, alternatives, counterevidence and forbidden downstream use"
    stop_condition: true
  - risk_id: "RISK-MAGE-002"
    name: "parallel runtime duplication"
    severity: "HIGH"
    trigger: "D0 introduces a second data, replay, memory, evidence or validation owner"
    control: "reuse matrix, system-of-record map and dependency graph"
    stop_condition: true
  - risk_id: "RISK-MAGE-003"
    name: "unavailable-data fabrication"
    severity: "HIGH"
    trigger: "source activation, labels, historical facts or field semantics are asserted without authorized evidence"
    control: "UNKNOWN registry and capability gates"
    stop_condition: true
  - risk_id: "RISK-MAGE-004"
    name: "premature complex modeling"
    severity: "MEDIUM"
    trigger: "Level-k, self-play or MARL proposed before a rules baseline and validation gates"
    control: "explicit staged promotion gates and compute plan"
    stop_condition: true
  - risk_id: "RISK-MAGE-005"
    name: "protected-information disclosure"
    severity: "HIGH"
    trigger: "local blueprint text, credentials, private data or account material appears in the D0 package"
    control: "chapter-level delta only and final public-safety scan"
    stop_condition: true
  - risk_id: "RISK-MAGE-006"
    name: "public local-path disclosure"
    severity: "HIGH"
    trigger: "physical workstation path appears in a public artifact"
    control: "stable alias table, complete delivered-diff path scan and receipt evidence"
    stop_condition: true
  - risk_id: "RISK-MAGE-007"
    name: "remote publication provenance mismatch"
    severity: "MEDIUM"
    trigger: "local tested or receipt SHA is treated as identical to a remote API-created SHA without tree proof"
    control: "machine-readable parent/tree equality receipt and external remote SHA anchor"
    stop_condition: false
