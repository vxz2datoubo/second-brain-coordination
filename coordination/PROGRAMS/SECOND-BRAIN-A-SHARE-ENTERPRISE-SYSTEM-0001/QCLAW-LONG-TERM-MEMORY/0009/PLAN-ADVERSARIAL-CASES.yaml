# PLAN-ADVERSARIAL-CASES.yaml
# Stage D: PR #65 Meaningful LTM Plan Evidence
# 48+ unique structured adversarial cases for the Long-Term Memory plan
# All authority_status values restricted to: PLAN | CONTRACT | CANDIDATE
# NO claims of IMPLEMENTED for unimplemented components

document_type: PLAN_ADVERSARIAL_CASES
task_id: QCLAW-UNIFIED-KNOWLEDGE-SUPPLY-CHAIN-ONTOLOGY-DETERMINISM-AND-LTM-EVIDENCE-0013-E10
route_epoch: 10
stage: D
target_pr: 65
total_cases: 48
required_categories:
  - STALE_MEMORY
  - SUPERSESSION
  - CONFLICT
  - UNKNOWN
  - ROLEPLAY_CONTAMINATION
  - PRIVACY_BOUNDARY
  - SOURCE_AUTHORITY
  - PLAN_VS_IMPLEMENTED
  - D2_SEPARATION
  - CANDIDATE_PROMOTION
