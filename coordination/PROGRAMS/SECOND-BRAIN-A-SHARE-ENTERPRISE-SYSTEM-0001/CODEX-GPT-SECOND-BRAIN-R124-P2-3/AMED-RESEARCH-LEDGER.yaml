    conclusion: "All three discovery paths must enter ContextAssembler._consider_candidate before deduplication, budget and explanation."
  - id: "R124-P2-3-RESEARCH-002"
    question: "Can temporal and provenance migration preserve ranking without inventing a new weighting theory?"
    evidence: "Existing lexical and relation paths already have score semantics; the route freezes new cross-channel numeric weights."
    conclusion: "Temporal and provenance candidates are deterministically supplemental after scored candidates, with no new numeric component."
  - id: "R124-P2-3-RESEARCH-003"
    question: "How is hidden conversation lineage prevented from becoming a discovery oracle?"
    evidence: "ContextAssembler applies caller observability and admission before CandidateSet records a candidate or public rejection count."
    conclusion: "The migration reuses that boundary for temporal, relation and provenance paths; non-observable candidates remain absent from public reports."
