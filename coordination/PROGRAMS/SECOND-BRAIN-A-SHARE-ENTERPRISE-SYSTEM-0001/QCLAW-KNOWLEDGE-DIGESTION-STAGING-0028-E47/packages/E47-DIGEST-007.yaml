    ### 3.2 System Position


    必须标明：


    - 所属工作流和有界上下文；

    - 上游、下游；

    - 系统记录源；

    - 只读依赖；

    - 不得复制的canonical运行时；

    - 对其他任务、分支和接口的影响。


    ### 3.3 Hard Boundaries


