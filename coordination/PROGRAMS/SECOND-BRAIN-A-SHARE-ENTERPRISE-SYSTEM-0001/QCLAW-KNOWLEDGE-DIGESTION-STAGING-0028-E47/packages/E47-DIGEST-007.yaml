- atom_id: A004
  atom_type: SCOPE
  content: '每个AI任务不能只是逐字完成清单，也不能以“主动改良”为名无限扩张。AMED要求执行者同时运行三条链：


    ```text

    主任务交付链

    → 完成明确目标、成功标准与验证


    现场侦察链

    → 发现错误假设、缺失需求、重复建设、接口缺口、过时规则、负面影响与新机会


    系统演进链

    → 将可复用发现形成证据化提案，经GPT二次审核后反哺蓝图、合同、Skill、测试、路由和长期工程经验

    ```


    核心原则：


    > 有纪律的主动性。围绕任务意图自主改进方法，但不得绕过权威边界、WIP、风险门、许可、隐私或GPT验收。'
  source_spans:
  - byte_start: 427
    byte_end: 1089
    line_start: 16
    line_end: 27
    span_label: bd:1. 根本目标
  evidence_kind: INFERENCE
  confidence: LOW
  scope: Body of 1. 根本目标
