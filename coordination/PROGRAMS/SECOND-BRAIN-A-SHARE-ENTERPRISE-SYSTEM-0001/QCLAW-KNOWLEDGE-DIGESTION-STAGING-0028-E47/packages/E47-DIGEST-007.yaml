- atom_id: A006
  atom_type: CONCEPT
  content: '### 第一环：任务内改进


    回答：


    - 怎样更可靠地完成本次任务？

    - 哪个实现、数据、测试或接口更合适？

    - 哪些错误可以在当前范围内修正？


    ### 第二环：系统级演进


    回答：


    - 为什么原系统没有提前发现这个问题？

    - 哪条任务模板、蓝图、接口、测试、权威边界或决策链需要永久改变？

    - 该发现能否泛化到其他工作流？

    - 哪些旧能力应降级、废弃或重新验证？


    单次成功只形成观察或假设，不能自动升级为企业标准。系统级回写必须经过GPT二次审核、证据复核和必要的独立验证。'
