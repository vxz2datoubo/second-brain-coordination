schema_version: "1.0"
handoff_id: "PEOS-USER-COGNITIVE-FRAMEWORK-SEED-HANDOFF-0001"
project_id: "PERSONAL-EPISTEMIC-COGNITIVE-OPERATING-SYSTEM-0010"
parent_issue: 61
related_issues: [38, 59, 60, 63, 72]
branch: "docs/peos-user-cognitive-framework-seed-v0"
status: "RESEARCH_INPUT_READY_FOR_REVIEW"
boundary: "research_only / NO_TRADE"
canonical_runtime_created: false
parallel_personal_model_created: false
public_repo_safe_abstraction_only: true

mission: >-
  Establish a versioned, evidence-aware and user-correctable seed for the user's cognitive framework,
  capturing strengths, gaps, unknowns, mastery and learning paths without creating a parallel runtime
  or converting one conversation into permanent personality labels.

deliverables:
  - path: "README.md"
    purpose: "project scope, architecture relationship, privacy and acceptance criteria"
  - path: "CURRENT-COGNITIVE-SNAPSHOT-v0.1.md"
    purpose: "human-readable strengths, gaps, unknowns and validation tasks"
  - path: "DISCUSSION-2026-07-25-SYSTEMS-FEEDBACK-GOVERNANCE.md"
    purpose: "detailed cognitive discussion episode and theory mapping"
  - path: "COGNITIVE-FRAMEWORK-MODEL-v0.1.yaml"
    purpose: "structured candidate features, gaps, mastery and unknown registry"
  - path: "COGNITIVE-UPDATE-AND-RETRIEVAL-PROTOCOL.md"
    purpose: "future conversation ingestion, review, retrieval and correction protocol"
  - path: "COGNITIVE-GROWTH-BACKLOG.md"
    purpose: "learning and validation roadmap"

frozen_principles:
  - "Single conversation creates observations or candidates, not permanent traits."
  - "User correction is authoritative inside the user model but cannot overwrite world facts."
  - "Supporting and opposing evidence must be preserved."
  - "State, trait, context and domain must remain separate."
  - "Roleplay and intimate conversation must not contaminate cognitive profiling."
  - "Raw private conversation must not be stored in the public repository."
  - "The framework must surface known unknowns and unknown unknowns."
  - "The assistant should provide metacognitive prompts: terms, assumptions, blind spots, counterexamples and adjacent theories."
  - "No runtime, trading action or canonical authority is created by this seed."

current_candidate_findings:
  strengths:
    - "system outcome orientation over loudness or popularity"
    - "distinguishing healthy correction from crisis-forced reset"
    - "detecting local versus global objective conflicts"
    - "asking who a feedback loop actually serves"
    - "risk routing and non-binary governance intuition"
    - "active desire to discover blind spots and unknown unknowns"
  gaps:
    - "formal systems and control theory"
    - "multi-objective social welfare and rights constraints"
    - "Goodhart/Campbell and metric gaming"
    - "principal-agent, mechanism design and public choice"
    - "empirical media-effects evidence and quantification"
  unknowns:
    - "cross-domain transfer stability"
    - "performance under pressure and real stakes"
    - "independent strongest-counterargument generation"
    - "confidence calibration"
    - "conversion of intuition into causal models and falsifiable predictions"

agent_tasks:
  GPT:
    role:
      - "continue cognitive dialogue and metacognitive prompting"
      - "propose candidate observations and strongest counterarguments"
      - "orchestrate user review and correction"
      - "audit privacy and unsupported profiling"
    prohibited:
      - "claiming stable traits from one conversation"
      - "writing private raw dialogue to public GitHub"
  CODEX:
    role:
      - "after Issue #72 authority freeze, map mature candidate fields into W10 canonical contracts"
      - "perform C0 non-duplication audit"
      - "define schema validation and version migrations"
    prohibited:
      - "starting a second PersonalCognitiveModel runtime before interface freeze"
  QCLAW:
    role:
      - "atomize future cognitive episodes"
      - "generate candidate concept links, evidence and counterevidence"
      - "prepare hybrid retrieval fixtures"
    prohibited:
      - "promoting model inference into source evidence"
      - "modifying canonical runtime before authorization"
  WORKBUDDY:
    role:
      - "validate local/private source formats and import boundaries"
      - "verify public/private path separation"
      - "test real retrieval against approved local data"
    prohibited:
      - "uploading private raw files to public repository"

next_review_actions:
  - id: "R1"
    owner: "USER + GPT"
    action: "Review each candidate strength and gap; accept, correct, dispute or revoke."
    priority: "P0"
  - id: "R2"
    owner: "GPT"
    action: "Turn the first three backlog items into a small learning sequence with exercises."
    priority: "P0"
  - id: "R3"
    owner: "CODEX"
    action: "After authority freeze, compare this seed with Issue #61 schema requirements and produce a non-duplication mapping."
    priority: "BLOCKED_BY_ISSUE_72"
  - id: "R4"
    owner: "QCLAW"
    action: "Prepare retrieval test cases for topic, mastery, gap, time, evidence and counterevidence queries."
    priority: "PLANNING_INPUT_ONLY"
  - id: "R5"
    owner: "USER + GPT"
    action: "Create a second cognitive episode in a different domain to test transfer rather than repeating the same evidence."
    priority: "P1"

acceptance_gates:
  - "No private data leakage."
  - "No parallel canonical runtime."
  - "Every candidate has status, evidence, confidence and review path."
  - "At least one explicit opposing-evidence or unknown path exists for each major claim."
  - "User can correct and revoke the model."
  - "Future retrieval can answer strengths, gaps, unknowns, mastery and history questions."
