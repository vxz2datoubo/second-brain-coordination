  transport: "bounded HTTP client with media, UTF-8 JSON, size, schema, pagination and concurrency-one enforcement"
  evidence_bundle: "public-safe immutable LiveObservationEvidenceBundle with request/response metadata, exact objects, completeness, freshness, invalidation and provider-code identity"
