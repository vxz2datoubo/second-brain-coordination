observation_sequence:
  - "read main M0, commit and tree through allowlisted GitHub REST endpoints"
  - "resolve each required canonical path at exact M0; recompute Git blob identity and content digest from observed bytes"
  - "when PR is requested, observe PR state/head/base/merged/merge commit and fully paginate raw reviews"
  - "observe domain freshness and canonical route/claim/lane/lease/approval-revocation surfaces"
  - "re-read main M1 and, when applicable, PR state; any material drift returns UNVERIFIED/BLOCKED"
  - "validate completeness, freshness and provider-code binding; emit bundle then compact proof"

evidence_bundle_schema:
