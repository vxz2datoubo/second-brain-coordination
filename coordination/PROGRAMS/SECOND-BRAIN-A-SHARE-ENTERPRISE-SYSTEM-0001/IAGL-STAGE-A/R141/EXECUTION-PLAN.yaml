resource_contract:
  execution: single-process synchronous synthetic supervisor
  subprocesses: forbidden
  network: forbidden
  cleanup: task-owned SQLite files and temporary directories only
  rollback: do not merge; retain auditable branch and remove only task-owned ephemeral resources
design_tradeoffs:
  - SQLite gives crash/restart and fencing semantics using only the Python standard library.
  - Snapshot facts are explicit synthetic test inputs; the store cannot become canonical governance or domain truth.
  - Deterministic checkpoint identity derives from snapshot, slice, fence, sequence, and status; only lease fencing tokens are fresh local state.
  - CI-only YAML parsing uses an explicitly named public dependency setup step; the Stage-A runtime itself performs no network operation.
  - Material execution is deliberately restricted to a current reconciliation grant, durable plan, active lease/fence, and pre-execution budget reservation.
unknowns:
