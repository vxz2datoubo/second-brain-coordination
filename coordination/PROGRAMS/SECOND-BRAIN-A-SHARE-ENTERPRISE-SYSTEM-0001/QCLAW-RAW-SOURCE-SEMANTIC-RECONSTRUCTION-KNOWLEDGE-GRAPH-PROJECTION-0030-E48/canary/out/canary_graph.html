<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>E48 Canary Knowledge Graph</title>
<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; }
  #mynetwork { position: absolute; left: 0; top: 0; bottom: 0; right: 380px; }
  #sidebar { position: absolute; right: 0; top: 0; bottom: 0; width: 360px;
              overflow: auto; padding: 16px; background: #fafafa;
              border-left: 1px solid #ddd; box-sizing: border-box; }
  #sidebar h2 { margin-top: 0; font-size: 14px; }
  #sidebar pre { white-space: pre-wrap; font-size: 11px; line-height: 1.4; }
  .unknown { background: #ffe6e6; }
  .contradicts { background: #fff4cc; }
  .controls label { display: block; font-size: 12px; margin-top: 6px; }
  .controls input { width: 100%; box-sizing: border-box; }
</style>
</head>
<body>
<div id="mynetwork"></div>
<div id="sidebar">
  <h2 id="sidebar-title">E48 Canary Knowledge Graph</h2>
  <div class="controls">
    <label>Filter by node type</label>
    <input id="filter-type" placeholder="atom / segment / source / unknown ...">
    <label>Filter by evidence kind</label>
    <input id="filter-evidence" placeholder="SOURCE_EXTRACT / INFERENCE ...">
    <label>Minimum confidence</label>
    <input id="filter-confidence" type="number" step="0.1" min="0" max="1" value="0">
    <label>Source id contains</label>
    <input id="filter-source" placeholder="source:...">
  </div>
  <h2 style="margin-top:16px">Selected node</h2>
  <pre id="detail">Click any node to see provenance.</pre>
</div>
<script>
  const PROJ = {"edge_count": 8, "edges": [{"attributes": {"via": "L0 raw byte slice"}, "confidence": 1.0, "edge_id": "e:SE48-CANARY-001-000->src-canary", "edge_type": "segment_to_raw_span", "source_node_id": "seg:SE48-CANARY-001-000", "target_node_id": "src-canary"}, {"attributes": {}, "confidence": 1.0, "edge_id": "e:raw:SE48-CANARY-001-000->src-canary", "edge_type": "raw_span_to_source", "source_node_id": "seg:SE48-CANARY-001-000", "target_node_id": "src-canary"}, {"attributes": {}, "confidence": 1.0, "edge_id": "e:A001->SE48-CANARY-001-000", "edge_type": "atom_to_segment", "source_node_id": "atom:A001", "target_node_id": "seg:SE48-CANARY-001-000"}, {"attributes": {}, "confidence": 1.0, "edge_id": "e:A002->SE48-CANARY-001-000", "edge_type": "atom_to_segment", "source_node_id": "atom:A002", "target_node_id": "seg:SE48-CANARY-001-000"}, {"attributes": {}, "confidence": 1.0, "edge_id": "e:A003->SE48-CANARY-001-000", "edge_type": "atom_to_segment", "source_node_id": "atom:A003", "target_node_id": "seg:SE48-CANARY-001-000"}, {"attributes": {"span_index": "-1"}, "confidence": 1.0, "edge_id": "e:rel:A001->A002:SUPPORTS", "edge_type": "SUPPORTS", "source_node_id": "atom:A001", "target_node_id": "atom:A002"}, {"attributes": {"span_index": "-1"}, "confidence": 1.0, "edge_id": "e:rel:A002->A003:REFINES", "edge_type": "REFINES", "source_node_id": "atom:A002", "target_node_id": "atom:A003"}, {"attributes": {}, "confidence": 1.0, "edge_id": "e:raises:A001->unknown:U001", "edge_type": "RAISES_UNKNOWN", "source_node_id": "atom:A001", "target_node_id": "unknown:U001"}], "node_count": 6, "nodes": [{"attributes": {"source_hash": "9f8ddc0ecc658b4a60d0950fe43e3dc2904d1a0d938115d3061572d89750dc7f"}, "label": "E48 PUBLIC_SAFE canary", "node_id": "src-canary", "node_type": "source"}, {"attributes": {"byte_end": "1041", "byte_start": "0", "confidence": "0.8500"}, "label": "SE48-CANARY-001-000", "node_id": "seg:SE48-CANARY-001-000", "node_type": "normalized_segment"}, {"attributes": {"atom_type": "MECHANISM", "confidence": "HIGH", "evidence_kind": "SOURCE_EXTRACT"}, "label": "# synthetic_canary_noisy_chinese.txt — E48 PUBLI", "node_id": "atom:A001", "node_type": "knowledge_atom"}, {"attributes": {"atom_type": "CONDITION", "confidence": "MEDIUM", "evidence_kind": "SOURCE_EXTRACT"}, "label": "y corpus\n# All text here is synthetic / fictiona", "node_id": "atom:A002", "node_type": "knowledge_atom"}, {"attributes": {"atom_type": "INDICATOR", "confidence": "LOW", "evidence_kind": "SOURCE_EXTRACT"}, "label": "rivate content.\n# Required noise categories per ", "node_id": "atom:A003", "node_type": "knowledge_atom"}, {"attributes": {}, "label": "Who is 他 她 in the third paragraph?", "node_id": "unknown:U001", "node_type": "unknown"}], "projection_id": "E48-CANARY-L3", "projection_schema_version": "1.0", "projection_sha256": "cac2da548db36c1a8474d1a116733da83002083e2e9ee4f714b56892718c9f7e", "schema": "QCLAW-E48-KNOWLEDGE-GRAPH-PROJECTION-V1"};
  const nodes = new vis.DataSet(PROJ.nodes.map(n => ({
    id: n.node_id,
    label: n.label || n.node_id,
    title: n.node_type + (n.attributes ? ('\n' + JSON.stringify(n.attributes)) : ''),
    group: n.node_type,
    color: n.node_type === 'unknown' ? { background: '#ffd6d6', border: '#a33' } :
           (n.attributes && n.attributes.class === 'contradiction') ?
             { background: '#fff4cc', border: '#a80' } : undefined,
  })));
  const edges = new vis.DataSet(PROJ.edges.map(e => ({
    id: e.edge_id,
    from: e.source_node_id,
    to: e.target_node_id,
    label: e.edge_type,
    color: e.edge_type === 'CONTRADICTS' ? { color: '#a80' } :
           e.edge_type === 'RAISES_UNKNOWN' ? { color: '#a33' } : undefined,
    arrows: 'to',
  })));
  const container = document.getElementById('mynetwork');
  const data = { nodes: nodes, edges: edges };
  const options = {
    layout: { improvedLayout: true },
    physics: { stabilization: { iterations: 200 } },
    interaction: { hover: true, tooltipDelay: 200 },
    groups: {
      source: { color: { background: '#cce5ff', border: '#246' } },
      normalized_segment: { color: { background: '#e6f2ff', border: '#246' } },
      knowledge_atom: { color: { background: '#d9f2d9', border: '#262' } },
      unknown: { color: { background: '#ffd6d6', border: '#a33' } },
      candidate_memory: { color: { background: '#efe0ff', border: '#525' } },
      candidate_skill: { color: { background: '#fff0e0', border: '#a60' } },
    },
  };
  const net = new vis.Network(container, data, options);
  net.on('selectNode', evt => {
    const id = evt.nodes[0];
    const n = PROJ.nodes.find(x => x.node_id === id);
    document.getElementById('detail').textContent = JSON.stringify(n, null, 2);
  });
  // client-side filters
  function applyFilters() {
    const t = document.getElementById('filter-type').value.trim().toLowerCase();
    const ev = document.getElementById('filter-evidence').value.trim().toLowerCase();
    const minC = parseFloat(document.getElementById('filter-confidence').value || '0');
    const src = document.getElementById('filter-source').value.trim().toLowerCase();
    const visible = new Set(PROJ.nodes.filter(n => {
      if (t && !n.node_type.toLowerCase().includes(t)) return false;
      const attrs = n.attributes || {};
      if (ev && !(String(attrs.evidence_kind || '').toLowerCase().includes(ev))) return false;
      const conf = parseFloat(attrs.confidence || '1');
      if (!isNaN(conf) && conf < minC) return false;
      if (src && !n.node_id.toLowerCase().includes(src)) return false;
      return true;
    }).map(n => n.node_id));
    nodes.update(PROJ.nodes.map(n => ({ id: n.node_id, hidden: !visible.has(n.node_id) }))));
    edges.update(PROJ.edges.map(e => ({
      id: e.edge_id,
      hidden: !(visible.has(e.source_node_id) && visible.has(e.target_node_id)),
    }))));
  }
  ['filter-type','filter-evidence','filter-confidence','filter-source']
    .forEach(id => document.getElementById(id).addEventListener('input', applyFilters));
</script>
</body>
</html>
