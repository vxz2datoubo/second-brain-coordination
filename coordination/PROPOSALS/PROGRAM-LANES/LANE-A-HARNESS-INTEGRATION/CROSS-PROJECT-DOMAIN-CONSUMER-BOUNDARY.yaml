schema_version: "0.1"
contract_id: "COGNITIVE-OS-CROSS-PROJECT-DOMAIN-CONSUMER-BOUNDARY-0001"
status: "ARCHITECTURE_CANDIDATE / PROPOSAL_ONLY"
owner: "USER"
architecture_owner: "GPT"
boundary: "NO_RUNTIME_AUTHORIZATION / NO_CROSS_REPO_LIVE_BINDING / NO_TRADE"

purpose: >-
  The shared Cognitive OS is intended to serve multiple domain systems over time. AI Film is a future high-value
  domain consumer, not a permanent island and not a second general-purpose cognitive runtime. This contract freezes
  the separation between shared cognition and domain-specific authority so later Harness integration can connect them
  without copying or merging canonical systems.

current_future_consumers:
  - id: A_SHARE_SYSTEM
    repository: vxz2datoubo/second-brain-coordination
    status: FIRST_DOMAIN_CONSUMER_ARCHITECTURE
    boundary: RESEARCH_ONLY_NO_TRADE
  - id: AI_FILM_SYSTEM
    repository: vxz2datoubo/eustia-ai-film
    status: FUTURE_DOMAIN_CONSUMER / CONTINUE_INDEPENDENT_DEVELOPMENT
    current_cross_repo_runtime_binding: NONE
    note: >-
      AI Film may continue developing its own director, continuity, media evidence, temporal retrieval, golden-case,
      model-generation feedback and domain learning capabilities. Cross-project reusable cognition should later be
      exposed through shared interfaces rather than duplicated as a second global brain/runtime.
  - id: MAIBOT_OR_OTHER_FUTURE_DOMAINS
    repository: UNKNOWN_OR_SEPARATE
    status: FUTURE_CANDIDATE

shared_cognitive_services_future:
  - SIGNAL_TOWER_MISSION_INTAKE
  - PROBLEM_SIGNATURE
  - W3_LONG_TERM_MEMORY_AND_KNOWLEDGE
  - METHOD_DISCOVERY
  - SKILL_MANIFEST_PROGRESSIVE_DISCLOSURE
  - DECISION_EPISODE
  - CLAIM_EVIDENCE_CONTRACT
  - EFFECTIVE_CHALLENGE
  - TOOL_GROUNDED_VERIFICATION
  - TRACE_LEDGER_HANDOFF
  - OUTCOME_MATCHING
  - REFLECTION_CANDIDATE
  - REFLECTION_VERIFICATION
  - METHOD_CREDIT
  - SKILL_HEALTH
  - REGRESSION_CASE
  - CROSS_CONTEXT_REVALIDATION
  - CONTROL_TOWER_GOVERNANCE
  - HARNESS_RUNTIME_ADAPTER

domain_authority_must_remain_local:
  AI_FILM_SYSTEM:
    canonical_authorities:
      - director_system
      - screenplay_adaptation
      - character_and_performance
      - scene_spatial_topology
      - visual_asset_registry
      - continuity_and_current_production_state
      - model_specific_prompt_compilation
      - film_specific_media_evidence
      - film_specific_golden_cases
      - C_DANCE_H3_and_future_model_generation_feedback
    rule: >-
      Shared Cognitive OS may retrieve, reason over, trace, challenge and learn from admitted domain evidence, but may
      not silently become the canonical editor of film-domain truth or replace the film repository's own write routes.
  A_SHARE_SYSTEM:
    canonical_authorities:
      - market_data_and_rules
      - event_evidence
      - strategy_and_backtest
      - participant_hypotheses
      - risk_veto
      - allocation
      - trading_domain_constraints

shared_vs_domain_learning:
  domain_learning_examples:
    - "C-DANCE prompt A/B outcome"
    - "camera blocking failure pattern"
    - "character continuity drift"
    - "temporal frame/evidence alignment"
    - "shot grammar success/failure"
    - "market event attribution replay"
    - "A-share PIT data failure"
  shared_learning_candidate_examples:
    - "retrieval strategy improved by temporal evidence"
    - "independent challenge catches a recurrent failure"
    - "method selection failed because prerequisite check was missing"
    - "reflection overfit from a single episode"
    - "golden-case regression prevents negative transfer"
    - "trace lineage missing caused false SUCCESS"
  promotion_rule: >-
    A domain lesson may become a CROSS_PROJECT_CAPABILITY_CANDIDATE only when the transferable mechanism is separated
    from domain content, evidence/failure conditions are explicit, and cross-domain validation shows utility without
    authority leakage or negative transfer.

cross_project_capability_candidate_v1:
  required:
    - candidate_id
    - source_domain
    - source_case_refs
    - transferable_mechanism
    - domain_specific_parts
    - proposed_shared_contract
    - known_failure_conditions
    - validation_plan
    - status
  status_values:
    - OBSERVED_IN_DOMAIN
    - CANDIDATE_FOR_SHARED_COGNITION
    - CROSS_DOMAIN_TEST_REQUIRED
    - VALIDATED_SHARED_CAPABILITY
    - REJECTED_AS_DOMAIN_SPECIFIC
    - DEGRADED
  hard_rules:
    - "domain success is not sufficient for shared promotion"
    - "shared promotion cannot move domain canonical truth into W3 automatically"
    - "cross-domain test must include a negative-control domain or task"
    - "rejection as domain-specific is a valid result"

future_cross_repo_adapter:
  topology: >-
    Domain Repository <-> Domain Adapter <-> Shared Cognitive Contracts <-> Signal Tower / W3 / #312 / W9 / W7
    <-> Harness Adapter <-> Runtime Providers
  no_direct_import_rule: >-
    A domain repository must not import mutable implementation internals from another domain repository. Cross-project
    integration must occur through versioned contracts, opaque references, APIs/tools, or controlled connector/adapters.
  provenance_required: true
  source_repo_commit_binding_required: true
  domain_schema_version_required: true
  writeback_owner_required: true
  rollback_required: true

ai_film_future_integration_sequence:
  F0:
    state: NOW
    action: "continue independent film-system improvement; no shared runtime coupling"
  F1:
    state: AFTER_COGNITIVE_OS_H0_H1_STABLE
    action: "inventory film capabilities and classify DOMAIN_ONLY vs CROSS_PROJECT_CAPABILITY_CANDIDATE"
  F2:
    state: FUTURE
    action: "define AI Film Domain Adapter and admitted read/write contracts"
  F3:
    state: FUTURE
    action: "synthetic/fixture integration with DecisionEpisode, retrieval, trace and learning"
  F4:
    state: FUTURE
    action: "real film workflow shadow consumer using Harness; film canonical authority remains local"
  F5:
    state: FUTURE
    action: "cross-domain validation of shared learning with A-share/engineering/research tasks"
  F6:
    state: FUTURE
    action: "only validated transferable mechanisms enter shared cognitive capability/skill governance"

cross_project_control_tower_future_checks:
  - agent_lease_collision
  - heavy_compute_collision
  - shared_interface_version_collision
  - duplicate_shared_authority
  - cross_repo_write_without_owner
  - domain_adapter_schema_drift
  - source_commit_staleness
  - private_data_scope_leak
  - feedback_loop_cross_contamination
  - negative_transfer_from_shared_skill

current_invariants:
  ai_film_development_may_continue: true
  no_need_to_pause_ai_film_for_h0: true
  no_cross_repo_runtime_binding_yet: true
  no_second_global_w3_in_ai_film: true
  no_second_global_control_tower_in_ai_film: true
  no_second_general_harness_runtime_authority_in_ai_film: true
  shared_architecture_must_keep_future_domain_adapter_seam: true

acceptance_intent: >-
  H0 should be considered incomplete if its contracts assume A-share is the only future domain. The shared cognitive
  layers must remain domain-neutral enough for AI Film and later Maibot/other systems, while preserving each domain's
  own canonical truth, lifecycle and writeback rules.
