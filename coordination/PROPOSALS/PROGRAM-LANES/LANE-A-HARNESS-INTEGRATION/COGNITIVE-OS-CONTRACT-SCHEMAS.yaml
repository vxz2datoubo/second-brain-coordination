    problem_signature_ref: {type: [string, "null"]}
    decision_episode_ref: {type: [string, "null"]}
    status: {enum: [RECEIVED, PLANNING, WAITING_AUTHORIZATION, EXECUTING, BLOCKED, ABSTAINED, CANCELLED, COMPLETED, FAILED]}
    final_result_ref: {type: [string, "null"]}
    no_work_reason_ref: {type: [string, "null"]}
