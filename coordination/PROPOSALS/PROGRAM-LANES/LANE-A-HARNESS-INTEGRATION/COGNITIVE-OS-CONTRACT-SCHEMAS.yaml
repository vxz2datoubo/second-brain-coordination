MissionGraph_v1:
  type: object
  required: [schema_version, mission_graph_id, mission_id, nodes, edges, generated_at]
  properties:
    schema_version: {const: "MissionGraph/v1"}
    mission_graph_id: {type: string}
    mission_id: {type: string}
    nodes:
      type: array
      items:
        type: object
        required: [work_item_id, work_type, owner_candidate, resource_class, status, retry_budget]
        properties:
          work_item_id: {type: string}
          work_type: {enum: [RETRIEVAL, RESEARCH, DATA_ACQUISITION, EVIDENCE_VERIFICATION, ANALYSIS, IMPLEMENTATION, TEST, CHALLENGE, REVIEW, ADJUDICATION, APPROVAL, WRITEBACK, OUTCOME_AUDIT]}
          owner_candidate: {type: string}
          required_authority_refs: {type: array, items: {type: string}}
          input_refs: {type: array, items: {type: string}}
          expected_output_contract: {type: string}
          resource_class: {enum: [LIGHT, MEDIUM, HEAVY_LOCAL, REMOTE_CI, EXTERNAL_SERVICE]}
          status: {enum: [PLANNED, AUTHORIZED, QUEUED, RUNNING, BLOCKED, RETURNED, COMPLETED, FAILED, CANCELLED, ABSTAINED]}
          retry_budget: {type: integer, minimum: 0}
          timeout_policy_ref: {type: [string, "null"]}
          termination_condition_ref: {type: [string, "null"]}
    edges:
      type: array
      items:
        type: object
        required: [from, to, type]
        properties:
          from: {type: string}
          to: {type: string}
          type: {enum: [DEPENDS_ON, CAN_PARALLEL_WITH, BLOCKS, REQUIRES_APPROVAL_FROM, RETURNS_TO, ESCALATES_TO, FEEDBACK_TO]}
          condition_ref: {type: [string, "null"]}
    parallel_groups: {type: array, items: {type: array, items: {type: string}}}
    generated_at: {type: string}
  semantic_invariants:
    - MG-DEPENDENCY-DAG-ACYCLIC
    - MG-RETURN-CYCLE-BOUNDED
    - MG-EXECUTABLE-NODE-NEEDS-CONTROL-TOWER
    - MG-CAN-PARALLEL-NOT-AUTHORIZATION
    - MG-HEAVY-LOCAL-RESOURCE-CAP

