schema_version: "0.2"
contract_bundle_id: "COGNITIVE-OS-CORE-CONTRACTS-0001"
status: "ARCHITECTURE_CANDIDATE / PROPOSAL_ONLY"
owner: "USER"
architecture_owner: "GPT"
boundary: "NO_RUNTIME_AUTHORIZATION / NO_TRADE"

contract_language:
  name: "COGNITIVE_CONTRACT_DSL"
  version: "0.2"
  machine_validation_status: "DESIGN_DSL_REQUIRES_H1_COMPILATION_TO_FORMAL_JSON_SCHEMA_AND_SEMANTIC_VALIDATORS"
  rule: >-
    The structures below are machine-oriented architecture contracts, not a claim that this YAML is already
    standards-compliant JSON Schema. H1 must compile structural constraints into formal JSON Schema and implement
    named semantic invariants as deterministic validators. Free-form invariant prose must not be executable truth.

common_semantics:
  ids_are_stable_opaque: true
  timestamps: "RFC3339_OFFSET_AWARE"
  raw_content_by_reference: true
  natural_language_cannot_override_machine_state: true
  unknown_and_abstain_are_first_class: true
  schema_break_requires_version_bump: true
  extra_authority_from_unknown_fields: false
  semantic_invariants_are_named_and_tested: true

DecisionEpisode_v1:
  type: object
  required:
    - schema_version
    - decision_episode_id
    - mission_id
    - problem_signature_id
    - task_class
    - materiality
    - risk_class
    - state
    - created_at
    - authority_snapshot_ref
    - trace_root_id
    - reproducibility_fingerprint
  properties:
    schema_version: {const: "DecisionEpisode/v1"}
    decision_episode_id: {type: string, minLength: 1}
    mission_id: {type: string, minLength: 1}
    problem_signature_id: {type: string, minLength: 1}
    user_goal_ref: {type: [string, "null"]}
    task_class:
      enum: [KNOWLEDGE, RESEARCH, SYSTEM_DESIGN, ENGINEERING, MARKET_INTELLIGENCE, EQUITY_ANALYSIS, BACKTEST, REVIEW, DECISION_SUPPORT, OTHER]
    materiality: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    risk_class: {enum: [R0, R1, R2, R3, R4]}
    regime_context_ref: {type: [string, "null"]}
    context_bundle_ref: {type: [string, "null"]}
    cognitive_capability_map_ref: {type: [string, "null"]}
    method_selection_ref: {type: [string, "null"]}
    evidence_plan_ref: {type: [string, "null"]}
    mission_graph_ref: {type: [string, "null"]}
    challenge_level: {enum: [C0, C1, C2, C3, C4, NOT_SET]}
    claim_ids: {type: array, items: {type: string}, uniqueItems: true}
    trace_root_id: {type: string, minLength: 1}
    handoff_refs: {type: array, items: {type: string}, uniqueItems: true}
    unresolved_refs: {type: array, items: {type: string}, uniqueItems: true}
    authority_snapshot_ref: {type: string, minLength: 1}
    control_tower_authorization_ref: {type: [string, "null"]}
    w7_veto_status: {enum: [NOT_EVALUATED, PASS, VETO, HUMAN_GATE, ABSTAIN]}
    decision_status: {enum: [OPEN, PROPOSED, ACCEPTED, REJECTED, ABSTAINED, CANCELLED, FAILED, CLOSED]}
    state:
      enum:
        - INTAKE
        - PROBLEM_SIGNATURED
        - CONTEXT_RETRIEVED
        - CAPABILITY_GAP_MAPPED
        - METHODS_DISCOVERED
        - METHODS_SELECTED_OR_ABSTAINED
        - EVIDENCE_PLAN_READY
        - CONTROL_TOWER_AUTHORIZED
        - EXECUTING
        - PRIMARY_RESULT_READY
        - CHALLENGE_PENDING_OR_SKIPPED
        - VERIFIED
        - ADJUDICATED
        - DOMAIN_VALIDATED
        - RISK_VETO_CHECKED
        - OUTPUT_OR_ACTION_PROPOSED
        - OUTCOME_OBSERVED
        - ATTRIBUTED
        - REFLECTED
        - LEARNING_CANDIDATES_CREATED
        - CROSS_CONTEXT_VALIDATED
        - UPDATED
        - DEGRADED
        - RETIRED
        - ABSTAINED
        - CANCELLED
        - FAILED
        - CLOSED
    state_history_refs: {type: array, items: {type: string}}
    outcome_ref: {type: [string, "null"]}
    explicit_correction_event_ref: {type: [string, "null"]}
    learning_ref: {type: [string, "null"]}
    reproducibility_fingerprint: {type: string, minLength: 1}
    created_at: {type: string}
    closed_at: {type: [string, "null"]}
  semantic_invariants:
    - DE-W7-VETO-NO-ACCEPT
    - DE-ABSTAIN-STATE-CONSISTENCY
    - DE-EXECUTION-AUTH-REQUIRED
    - DE-POST-PRIMARY-TRACE-RESOLVABLE
    - DE-LEARNING-NEEDS-OUTCOME-OR-CORRECTION
    - DE-NO-RAW-PRIVATE-BODY

DecisionEpisodeStateMachine_v1:
  initial_state: INTAKE
  terminal_states: [RETIRED, ABSTAINED, CANCELLED, FAILED, CLOSED]
  execution_authorization_required_states:
    - EXECUTING
    - PRIMARY_RESULT_READY
    - CHALLENGE_PENDING_OR_SKIPPED
    - VERIFIED
    - ADJUDICATED
    - DOMAIN_VALIDATED
    - RISK_VETO_CHECKED
    - OUTPUT_OR_ACTION_PROPOSED
    - OUTCOME_OBSERVED
    - ATTRIBUTED
    - REFLECTED
    - LEARNING_CANDIDATES_CREATED
    - CROSS_CONTEXT_VALIDATED
    - UPDATED
    - DEGRADED
    - RETIRED
  trace_resolvable_required_states:
    - PRIMARY_RESULT_READY
    - CHALLENGE_PENDING_OR_SKIPPED
    - VERIFIED
    - ADJUDICATED
    - DOMAIN_VALIDATED
    - RISK_VETO_CHECKED
    - OUTPUT_OR_ACTION_PROPOSED
    - OUTCOME_OBSERVED
    - ATTRIBUTED
    - REFLECTED
    - LEARNING_CANDIDATES_CREATED
    - CROSS_CONTEXT_VALIDATED
    - UPDATED
    - DEGRADED
    - RETIRED
    - CLOSED
  forward_transitions:
    INTAKE: [PROBLEM_SIGNATURED, ABSTAINED, CANCELLED, FAILED]
    PROBLEM_SIGNATURED: [CONTEXT_RETRIEVED, ABSTAINED, CANCELLED, FAILED]
    CONTEXT_RETRIEVED: [CAPABILITY_GAP_MAPPED, METHODS_DISCOVERED, ABSTAINED, CANCELLED, FAILED]
    CAPABILITY_GAP_MAPPED: [METHODS_DISCOVERED, ABSTAINED, CANCELLED, FAILED]
    METHODS_DISCOVERED: [METHODS_SELECTED_OR_ABSTAINED, ABSTAINED, CANCELLED, FAILED]
    METHODS_SELECTED_OR_ABSTAINED: [EVIDENCE_PLAN_READY, CONTROL_TOWER_AUTHORIZED, ABSTAINED, CANCELLED, FAILED]
    EVIDENCE_PLAN_READY: [CONTROL_TOWER_AUTHORIZED, ABSTAINED, CANCELLED, FAILED]
    CONTROL_TOWER_AUTHORIZED: [EXECUTING, CANCELLED, FAILED]
    EXECUTING: [PRIMARY_RESULT_READY, CANCELLED, FAILED]
    PRIMARY_RESULT_READY: [CHALLENGE_PENDING_OR_SKIPPED, VERIFIED, ADJUDICATED, CANCELLED, FAILED]
    CHALLENGE_PENDING_OR_SKIPPED: [VERIFIED, ADJUDICATED, CANCELLED, FAILED]
    VERIFIED: [ADJUDICATED, CANCELLED, FAILED]
    ADJUDICATED: [DOMAIN_VALIDATED, RISK_VETO_CHECKED, ABSTAINED, CANCELLED, FAILED]
    DOMAIN_VALIDATED: [RISK_VETO_CHECKED, ABSTAINED, CANCELLED, FAILED]
    RISK_VETO_CHECKED: [OUTPUT_OR_ACTION_PROPOSED, ABSTAINED, CANCELLED, FAILED]
    OUTPUT_OR_ACTION_PROPOSED: [OUTCOME_OBSERVED, CLOSED, CANCELLED, FAILED]
    OUTCOME_OBSERVED: [ATTRIBUTED, CLOSED, FAILED]
    ATTRIBUTED: [REFLECTED, CLOSED, FAILED]
    REFLECTED: [LEARNING_CANDIDATES_CREATED, CLOSED, FAILED]
    LEARNING_CANDIDATES_CREATED: [CROSS_CONTEXT_VALIDATED, CLOSED, FAILED]
    CROSS_CONTEXT_VALIDATED: [UPDATED, DEGRADED, RETIRED, CLOSED, FAILED]
    UPDATED: [CLOSED, DEGRADED, RETIRED]
    DEGRADED: [CLOSED, RETIRED, CROSS_CONTEXT_VALIDATED]
    RETIRED: [CLOSED]
    ABSTAINED: [CLOSED]
    CANCELLED: [CLOSED]
    FAILED: [CLOSED]
    CLOSED: []
  rework_transitions:
    description: "Allowed only through a bounded ReworkRequest carrying retry budget, reason, return target and new evidence/input fingerprint."
    examples:
      ADJUDICATED: [EVIDENCE_PLAN_READY, METHODS_DISCOVERED]
      RISK_VETO_CHECKED: [EVIDENCE_PLAN_READY, METHODS_DISCOVERED, EXECUTING]
      DEGRADED: [METHODS_DISCOVERED]

ProblemSignature_v1:
  type: object
  required:
    - schema_version
    - problem_signature_id
    - task_class
    - objective
    - materiality
