SemanticInvariantRegistry_v1:
  DE-W7-VETO-NO-ACCEPT:
    if: {w7_veto_status: VETO}
    require: {decision_status_not: ACCEPTED}
  DE-ABSTAIN-STATE-CONSISTENCY:
    if: {decision_status: ABSTAINED}
    require: {state_in: [ABSTAINED, CLOSED]}
  DE-EXECUTION-AUTH-REQUIRED:
    if: {state_in_ref: DecisionEpisodeStateMachine_v1.execution_authorization_required_states}
    require: {control_tower_authorization_ref_non_null: true}
  DE-POST-PRIMARY-TRACE-RESOLVABLE:
    if: {state_in_ref: DecisionEpisodeStateMachine_v1.trace_resolvable_required_states}
    require: {trace_root_id_resolvable: true}
  DE-LEARNING-NEEDS-OUTCOME-OR-CORRECTION:
    if: {learning_ref_non_null: true}
    require_any:
      - {outcome_ref_non_null: true}
      - {explicit_correction_event_ref_non_null: true}
  DE-NO-RAW-PRIVATE-BODY:
    require: {raw_private_source_body_embedded: false}
  PS-HIGH-MATERIALITY-EVIDENCE-OR-WAIVER:
    if: {materiality_in: [HIGH, CRITICAL]}
    require_any:
      - {evidence_mode_not: INTERNAL_ONLY}
      - {evidence_waiver_ref_non_null: true}
  PS-CAUSAL-REQUIRES-COMPETING-HYPOTHESES:
    if: {causal_requirement: CAUSAL}
    require: {competing_hypotheses_required: true}
  PS-PIT-REQUIRES-CAPABILITY:
    if: {point_in_time_required: true}
    require: {pit_capability_ref_non_null: true}
  M-USER-INTAKE-NO-AUTH-GRANT:
    rule: "Mission intake itself never satisfies Control Tower authorization."
  M-COMPLETED-NEEDS-RESULT-OR-NO-WORK:
    if: {status: COMPLETED}
    require_any:
      - {final_result_ref_non_null: true}
      - {no_work_reason_ref_non_null: true}
  MG-DEPENDENCY-DAG-ACYCLIC:
    rule: "DEPENDS_ON and BLOCKS edges must form an acyclic graph after removing explicit ReworkRequest edges."
  MG-RETURN-CYCLE-BOUNDED:
    rule: "Every RETURNS_TO cycle maps to ReworkRequest/v1 and has retry budget, termination and escalation semantics."
  MG-EXECUTABLE-NODE-NEEDS-CONTROL-TOWER:
    rule: "A node may move to AUTHORIZED/RUNNING only with a valid current ExecutionAuthorization external to MissionGraph."
  MG-CAN-PARALLEL-NOT-AUTHORIZATION:
    rule: "CAN_PARALLEL_WITH expresses logical independence only; it never grants concurrency or execution permission."
  MG-HEAVY-LOCAL-RESOURCE-CAP:
    rule: "HEAVY_LOCAL concurrency must satisfy current Control Tower resource policy."
  C-UNKNOWN-CONFIDENCE-UNKNOWN:
    if: {claim_type: UNKNOWN}
    require: {confidence_class: UNKNOWN}
  C-MATERIAL-CAUSAL-NEEDS-FALSIFIER:
    if_all:
      - {claim_type: CAUSAL_HYPOTHESIS}
      - {materiality_in: [HIGH, CRITICAL]}
    require: {falsifier_refs_min_items: 1}
  C-PROSE-CANNOT-PROMOTE-INFERENCE-TO-FACT:
    rule: "No human companion text may mutate Claim.claim_type from MODEL_INFERENCE to OBSERVED_FACT."
  CH-C2-C4-INDEPENDENT-PASS-REQUIRED:
    if: {challenge_level_in: [C2, C3, C4]}
    require: {independent_pass_ref_non_null: true}
  A-NO-W7-OVERRIDE:
    rule: "Adjudication never overrides W7 final veto authority."
  A-UNRESOLVED-ABSTAIN-VALID:
    rule: "UNRESOLVED and ABSTAIN are valid dispositions."
  FH-RAW-TRACE-REF-REQUIRED:
    require: {raw_trace_refs_min_items: 1}
  FH-HUMAN-COMPANION-NONAUTHORITATIVE:
    rule: "The .analysis.md companion cannot mutate machine fields or grant authority."
  OL-NEEDS-OUTCOME-CORRECTION-OR-AUDIT:
    require_any:
      - {outcome_ref_non_null: true}
      - {correction_event_ref_non_null: true}
      - {audit_finding_ref_non_null: true}
  OL-NO-DIRECT-FORMAL-SKILL:
    rule: "OutcomeLearning may create candidates only; direct FORMAL_SKILL transition is forbidden."
  OL-GOOD-OUTCOME-NOT-PROOF-OF-GOOD-METHOD:
    rule: "Positive outcome alone cannot set method selection/execution quality to GOOD."
  OL-BAD-OUTCOME-NOT-PROOF-OF-BAD-METHOD:
    rule: "Negative outcome alone cannot set method selection/execution quality to BAD."
  RW-RETURN-TARGET-ALLOWED-BY-STATE-MACHINE:
    rule: "return_from_state -> return_to_state must be listed in rework_transitions or an explicitly versioned extension."
  RW-NO-RETRY-WHEN-BUDGET-ZERO:
    if: {retry_budget_remaining: 0}
    require: {next_action_in: [ABSTAIN, ESCALATE, CANCEL, FAIL_CLOSED]}
  RW-RETRY-REQUIRES-MATERIAL-CHANGE-OR-EXPLICIT-ESCALATION:
    rule: "A repeated pass requires changed evidence/input fingerprint or explicit escalation; identical blind retry is not valid learning."

ReproducibilityFingerprint_v1:
  required_components:
    - SourceSnapshotHash
    - ContextBundleHash
    - UpstreamHandoffHashes
    - PromptTemplateHash
    - MethodSkillVersions
    - ModelProvider
    - ModelID
    - ToolSchemaHash
    - CodeCommit
    - DomainRuleSnapshot
    - SchemaVersion
  optional_components:
    - HarnessRuntimeVersion
    - ProviderNativeProtocolVersion
    - ControlTowerAuthorizationFingerprint
    - RandomSeedOrSamplingConfig
  canonicalization:
    field_order: "LEXICOGRAPHIC"
    hash_algorithm: "SHA-256"
    raw_secret_values: "FORBIDDEN"
