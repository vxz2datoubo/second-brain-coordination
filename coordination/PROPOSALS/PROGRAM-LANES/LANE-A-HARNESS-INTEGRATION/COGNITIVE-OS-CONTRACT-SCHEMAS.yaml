schema_version: "0.1"
contract_bundle_id: "COGNITIVE-OS-CORE-CONTRACTS-0001"
status: "ARCHITECTURE_CANDIDATE / PROPOSAL_ONLY"
owner: "USER"
architecture_owner: "GPT"
boundary: "NO_RUNTIME_AUTHORIZATION / NO_TRADE"

common_semantics:
  ids_are_stable_opaque: true
  timestamps: "RFC3339_OFFSET_AWARE"
  raw_content_by_reference: true
  natural_language_cannot_override_machine_state: true
  unknown_and_abstain_are_first_class: true
  schema_break_requires_version_bump: true
  extra_authority_from_unknown_fields: false

DecisionEpisode_v1:
  type: object
  required:
    - schema_version
    - decision_episode_id
    - mission_id
    - problem_signature_id
    - task_class
    - materiality
    - risk_class
    - state
    - created_at
    - authority_snapshot_ref
    - trace_root_id
    - reproducibility_fingerprint
  properties:
    schema_version: {const: "DecisionEpisode/v1"}
    decision_episode_id: {type: string, minLength: 1}
    mission_id: {type: string, minLength: 1}
    problem_signature_id: {type: string, minLength: 1}
    user_goal_ref: {type: [string, "null"]}
    task_class:
      enum: [KNOWLEDGE, RESEARCH, SYSTEM_DESIGN, ENGINEERING, MARKET_INTELLIGENCE, EQUITY_ANALYSIS, BACKTEST, REVIEW, DECISION_SUPPORT, OTHER]
    materiality: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    risk_class: {enum: [R0, R1, R2, R3, R4]}
    regime_context_ref: {type: [string, "null"]}
    context_bundle_ref: {type: [string, "null"]}
    cognitive_capability_map_ref: {type: [string, "null"]}
    method_selection_ref: {type: [string, "null"]}
    evidence_plan_ref: {type: [string, "null"]}
    mission_graph_ref: {type: [string, "null"]}
    challenge_level: {enum: [C0, C1, C2, C3, C4, NOT_SET]}
    claim_ids: {type: array, items: {type: string}, uniqueItems: true}
    trace_root_id: {type: string, minLength: 1}
    handoff_refs: {type: array, items: {type: string}, uniqueItems: true}
    unresolved_refs: {type: array, items: {type: string}, uniqueItems: true}
    authority_snapshot_ref: {type: string, minLength: 1}
    control_tower_authorization_ref: {type: [string, "null"]}
    w7_veto_status: {enum: [NOT_EVALUATED, PASS, VETO, HUMAN_GATE, ABSTAIN]}
    decision_status: {enum: [OPEN, PROPOSED, ACCEPTED, REJECTED, ABSTAINED, CANCELLED, FAILED, CLOSED]}
    state:
      enum:
        - INTAKE
        - PROBLEM_SIGNATURED
        - CONTEXT_RETRIEVED
        - CAPABILITY_GAP_MAPPED
        - METHODS_DISCOVERED
        - METHODS_SELECTED_OR_ABSTAINED
        - EVIDENCE_PLAN_READY
        - CONTROL_TOWER_AUTHORIZED
        - EXECUTING
        - PRIMARY_RESULT_READY
        - CHALLENGE_PENDING_OR_SKIPPED
        - VERIFIED
        - ADJUDICATED
        - DOMAIN_VALIDATED
        - RISK_VETO_CHECKED
        - OUTPUT_OR_ACTION_PROPOSED
        - OUTCOME_OBSERVED
        - ATTRIBUTED
        - REFLECTED
        - LEARNING_CANDIDATES_CREATED
        - CROSS_CONTEXT_VALIDATED
        - UPDATED
        - DEGRADED
        - RETIRED
        - ABSTAINED
        - CANCELLED
        - FAILED
        - CLOSED
    state_history_refs: {type: array, items: {type: string}}
    outcome_ref: {type: [string, "null"]}
    learning_ref: {type: [string, "null"]}
    reproducibility_fingerprint: {type: string, minLength: 1}
    created_at: {type: string}
    closed_at: {type: [string, "null"]}
  invariants:
    - "w7_veto_status == VETO => decision_status != ACCEPTED"
    - "decision_status == ABSTAINED => state in [ABSTAINED,CLOSED]"
    - "state >= EXECUTING => control_tower_authorization_ref != null"
    - "state >= PRIMARY_RESULT_READY => trace_root_id is resolvable"
    - "learning_ref != null => outcome_ref != null OR explicit_correction_event exists"
    - "DecisionEpisode never embeds raw private source bodies"

ProblemSignature_v1:
  type: object
  required: [schema_version, problem_signature_id, task_class, objective, materiality, reversibility, evidence_mode]
  properties:
    schema_version: {const: "ProblemSignature/v1"}
    problem_signature_id: {type: string}
    domain: {type: array, items: {type: string}, uniqueItems: true}
    task_class: {type: string}
    objective: {type: string}
    decision_horizon: {type: [string, "null"]}
    materiality: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
    reversibility: {enum: [REVERSIBLE, PARTIALLY_REVERSIBLE, IRREVERSIBLE, UNKNOWN]}
    causal_requirement: {enum: [DESCRIPTIVE, ASSOCIATIONAL, CAUSAL, DECISIONAL, UNKNOWN]}
    evidence_mode: {enum: [INTERNAL_ONLY, EXTERNAL_REQUIRED, FIRST_PARTY_REQUIRED, MIXED, UNKNOWN]}
    point_in_time_required: {type: boolean}
    uncertainty_types: {type: array, items: {type: string}}
    adversarial_exposure: {enum: [LOW, MEDIUM, HIGH, UNKNOWN]}
    data_prerequisites: {type: array, items: {type: string}}
    tool_prerequisites: {type: array, items: {type: string}}
    regime_refs: {type: array, items: {type: string}}
    failure_cost: {enum: [LOW, MEDIUM, HIGH, CRITICAL, UNKNOWN]}
    privacy_scope_ref: {type: [string, "null"]}
    authority_requirements: {type: array, items: {type: string}}
    unknowns: {type: array, items: {type: string}}
  invariants:
    - "materiality in [HIGH,CRITICAL] => evidence_mode != INTERNAL_ONLY unless explicit waiver"
    - "causal_requirement == CAUSAL => competing_hypotheses_required"
    - "point_in_time_required == true => PIT-capable source/tool prerequisite must be declared"

Mission_v1:
  type: object
  required: [schema_version, mission_id, intake_source, objective, status, created_at]
  properties:
    schema_version: {const: "Mission/v1"}
    mission_id: {type: string}
    intake_source: {enum: [USER, SYSTEM_EVENT, OUTCOME_FOLLOWUP, SCHEDULED_REVIEW]}
    objective: {type: string}
    user_constraint_refs: {type: array, items: {type: string}}
    problem_signature_ref: {type: [string, "null"]}
    decision_episode_ref: {type: [string, "null"]}
    status: {enum: [RECEIVED, PLANNING, WAITING_AUTHORIZATION, EXECUTING, BLOCKED, ABSTAINED, CANCELLED, COMPLETED, FAILED]}
    created_at: {type: string}
    completed_at: {type: [string, "null"]}
  invariants:
    - "intake_source == USER does not imply execution authorization"
    - "COMPLETED requires final result or explicit no-work/abstention result"

MissionGraph_v1:
  type: object
  required: [schema_version, mission_graph_id, mission_id, nodes, edges, generated_at]
  properties:
    schema_version: {const: "MissionGraph/v1"}
    mission_graph_id: {type: string}
    mission_id: {type: string}
    nodes:
      type: array
      items:
        required: [work_item_id, work_type, owner_candidate, resource_class, status]
        properties:
          work_item_id: {type: string}
          work_type: {enum: [RETRIEVAL, RESEARCH, DATA_ACQUISITION, EVIDENCE_VERIFICATION, ANALYSIS, IMPLEMENTATION, TEST, CHALLENGE, REVIEW, ADJUDICATION, APPROVAL, WRITEBACK, OUTCOME_AUDIT]}
          owner_candidate: {type: string}
          required_authority_refs: {type: array, items: {type: string}}
          input_refs: {type: array, items: {type: string}}
          expected_output_contract: {type: string}
          resource_class: {enum: [LIGHT, MEDIUM, HEAVY_LOCAL, REMOTE_CI, EXTERNAL_SERVICE]}
          status: {enum: [PLANNED, AUTHORIZED, QUEUED, RUNNING, BLOCKED, RETURNED, COMPLETED, FAILED, CANCELLED, ABSTAINED]}
          retry_budget: {type: integer, minimum: 0}
          timeout_policy_ref: {type: [string, "null"]}
    edges:
      type: array
      items:
        required: [from, to, type]
        properties:
          from: {type: string}
          to: {type: string}
          type: {enum: [DEPENDS_ON, CAN_PARALLEL_WITH, BLOCKS, REQUIRES_APPROVAL_FROM, RETURNS_TO, ESCALATES_TO, FEEDBACK_TO]}
          condition_ref: {type: [string, "null"]}
    parallel_groups: {type: array, items: {type: array, items: {type: string}}}
    generated_at: {type: string}
  invariants:
    - "graph must be acyclic for DEPENDS_ON/BLOCKS after excluding explicit bounded rework edges"
    - "every RETURNS_TO cycle has termination condition and retry budget"
    - "every executable node requires later Control Tower authorization"
    - "same-agent parallel work is not inferred from CAN_PARALLEL_WITH"
    - "HEAVY_LOCAL parallel group cardinality <= resource policy"

Claim_v1:
  type: object
  required: [schema_version, claim_id, claim_type, statement_ref, status]
  properties:
    schema_version: {const: "Claim/v1"}
    claim_id: {type: string}
    claim_type: {enum: [OBSERVED_FACT, SOURCE_CLAIM, SOURCE_INTERPRETATION, USER_ASSERTION, MODEL_INFERENCE, CAUSAL_HYPOTHESIS, DECISION_ASSUMPTION, UNKNOWN]}
    statement_ref: {type: string}
    scope_ref: {type: [string, "null"]}
    valid_time_ref: {type: [string, "null"]}
    source_refs: {type: array, items: {type: string}}
    support_refs: {type: array, items: {type: string}}
    counterevidence_refs: {type: array, items: {type: string}}
    assumption_refs: {type: array, items: {type: string}}
    falsifier_refs: {type: array, items: {type: string}}
    regime_applicability_ref: {type: [string, "null"]}
    confidence_class: {enum: [HIGH, MEDIUM, LOW, UNKNOWN]}
    status: {enum: [OPEN, SUPPORTED, WEAKENED, CONTRADICTED, UNRESOLVED, REJECTED, SUPERSEDED, REVOKED]}
  invariants:
    - "claim_type == UNKNOWN => confidence_class == UNKNOWN"
    - "claim_type == CAUSAL_HYPOTHESIS => falsifier_refs non-empty for material claims"
    - "MODEL_INFERENCE cannot be promoted to OBSERVED_FACT by prose-only handoff"

ChallengeCase_v1:
  type: object
  required: [schema_version, challenge_id, target_claim_id, challenge_type, severity, status]
  properties:
    schema_version: {const: "ChallengeCase/v1"}
    challenge_id: {type: string}
    target_claim_id: {type: string}
    challenge_type: {enum: [COUNTEREVIDENCE, ALTERNATIVE_EXPLANATION, ASSUMPTION_ATTACK, METHOD_MISMATCH, REGIME_MISMATCH, SOURCE_QUALITY, CAUSAL_OVERREACH, MISSING_DATA, RISK_GAP, OTHER]}
    severity: {enum: [LOW, MEDIUM, HIGH, BLOCKING]}
    independent_pass_ref: {type: [string, "null"]}
    counterevidence_refs: {type: array, items: {type: string}}
    alternative_hypothesis_refs: {type: array, items: {type: string}}
    falsifier_refs: {type: array, items: {type: string}}
    status: {enum: [OPEN, ANSWERED, VERIFIED, SUSTAINED, REJECTED, UNRESOLVED]}
  invariants:
    - "C2/C3/C4 challenge requires independent_pass_ref"

VerificationResult_v1:
  type: object
  required: [schema_version, verification_id, target_claim_id, result, trace_refs]
  properties:
    schema_version: {const: "VerificationResult/v1"}
    verification_id: {type: string}
    target_claim_id: {type: string}
    result: {enum: [CONFIRMED, PARTIALLY_CONFIRMED, REFUTED, INCONCLUSIVE, SOURCE_UNAVAILABLE, TOOL_FAILED]}
    evidence_refs: {type: array, items: {type: string}}
    counterevidence_refs: {type: array, items: {type: string}}
    tool_refs: {type: array, items: {type: string}}
    source_policy_ref: {type: [string, "null"]}
    trace_refs: {type: array, items: {type: string}}
    observed_at: {type: [string, "null"]}

Adjudication_v1:
  type: object
  required: [schema_version, adjudication_id, claim_results, disposition]
  properties:
    schema_version: {const: "Adjudication/v1"}
    adjudication_id: {type: string}
    claim_results: {type: array, items: {type: string}}
    disposition: {enum: [ACCEPT, ACCEPT_WITH_LIMITS, RETURN_FOR_EVIDENCE, RETURN_FOR_REWORK, UNRESOLVED, ABSTAIN]}
    rubric_ref: {type: string}
    ordering_blind_ref: {type: [string, "null"]}
    unresolved_refs: {type: array, items: {type: string}}
    strongest_counterargument_ref: {type: [string, "null"]}
  invariants:
    - "adjudicator cannot override W7 veto"
    - "UNRESOLVED/ABSTAIN are valid terminal dispositions"

FormalHandoff_v1:
  type: object
  required:
    - schema_version
    - handoff_id
    - decision_episode_id
    - producer
    - consumer
    - stage
    - epistemic_status
    - input_fingerprint
    - raw_trace_refs
    - created_at
  properties:
    schema_version: {const: "FormalHandoff/v1"}
    handoff_id: {type: string}
    decision_episode_id: {type: string}
    producer: {type: string}
    consumer: {type: string}
    stage: {type: string}
    claim_ids: {type: array, items: {type: string}}
    evidence_refs: {type: array, items: {type: string}}
    counterevidence_refs: {type: array, items: {type: string}}
    unknown_refs: {type: array, items: {type: string}}
    unresolved_refs: {type: array, items: {type: string}}
    epistemic_status: {enum: [OBSERVED, SUPPORTED, HYPOTHESIS, MIXED, UNKNOWN, ABSTAINED]}
    applicability_ref: {type: [string, "null"]}
    falsifier_refs: {type: array, items: {type: string}}
    input_fingerprint: {type: string}
    upstream_handoff_refs: {type: array, items: {type: string}}
    raw_trace_refs: {type: array, items: {type: string}, minItems: 1}
    artifact_refs: {type: array, items: {type: string}}
    accepted_by: {type: [string, "null"]}
    acceptance_status: {enum: [PENDING, ACCEPTED, REJECTED, RETURNED, SUPERSEDED]}
    created_at: {type: string}
  human_companion:
    suffix: ".analysis.md"
    may_include:
      - rationale
      - strongest_counterargument
      - alternatives_considered
      - second_order_effects
      - uncertainty_explanation
      - suggestions
    may_not:
      - promote_epistemic_status
      - change_claim_ids
      - invent_evidence_refs
      - grant_authority
  invariants:
    - "raw_trace_refs minItems >= 1 for material handoff"
    - "human companion cannot alter machine fields"

OutcomeLearning_v1:
  type: object
  required: [schema_version, learning_event_id, decision_episode_id, outcome_ref, created_at]
  properties:
    schema_version: {const: "OutcomeLearning/v1"}
    learning_event_id: {type: string}
    decision_episode_id: {type: string}
    outcome_ref: {type: string}
    claim_outcomes: {type: array, items: {type: string}}
    failure_localization_refs: {type: array, items: {type: string}}
    method_credit_refs: {type: array, items: {type: string}}
    tool_credit_refs: {type: array, items: {type: string}}
    source_credit_refs: {type: array, items: {type: string}}
    challenge_credit_refs: {type: array, items: {type: string}}
    regression_case_refs: {type: array, items: {type: string}}
    reflection_candidate_ref: {type: [string, "null"]}
    skill_health_candidate_refs: {type: array, items: {type: string}}
    w3_candidate_update_refs: {type: array, items: {type: string}}
    created_at: {type: string}
  invariants:
    - "OutcomeLearning cannot directly create FORMAL_SKILL"
    - "good outcome alone is insufficient evidence of good method"
    - "bad outcome alone is insufficient evidence of bad method"

ReproducibilityFingerprint_v1:
  required_components:
    - SourceSnapshotHash
    - ContextBundleHash
    - UpstreamHandoffHashes
    - PromptTemplateHash
    - MethodSkillVersions
    - ModelProvider
    - ModelID
    - ToolSchemaHash
    - CodeCommit
    - DomainRuleSnapshot
    - SchemaVersion
  optional_components:
    - HarnessRuntimeVersion
    - ProviderNativeProtocolVersion
    - ControlTowerAuthorizationFingerprint
    - RandomSeedOrSamplingConfig
  canonicalization:
    field_order: "LEXICOGRAPHIC"
    hash_algorithm: "SHA-256"
    raw_secret_values: "FORBIDDEN"
