architecture_verdict:
  result: "ACCEPT_HANDOFF_WITH_ARCHITECTURAL_REASSIGNMENT"
  explanation: >-
    The handoff is compatible with the existing Cognitive OS if the new work is treated as a pre-Mission Global Signal
    Plane feeding the already-defined Mission Router. Mission routing, execution authorization, long-term truth, runtime
    trace and domain canonicals remain owned by their existing authorities. No duplicate Signal Tower, Control Tower,
    W3, Trace Ledger or domain truth store is permitted.

capability_disposition_matrix:
  - capability: "single global Signal intake entry"
    source_status: USER_EXPLICIT
    disposition: MODIFY
    existing_component: SIGNAL_TOWER_MISSION_ROUTER
    decision: >-
      Keep one user-facing Signal Tower identity, but split internal architecture into PRE_MISSION_SIGNAL_PLANE and
      existing MISSION_PLANE. Do not create separate AI Film and Second Brain towers.

  - capability: "SignalEvent intake for ideas/requirements/bugs/findings/risks/opportunities/dependencies/outcomes/corrections"
    source_status: USER_EXPLICIT_AND_CONFIRMED_DESIGN
    disposition: NEW_REQUIRED
    existing_component: NONE
    decision: "Add pre-Mission SignalEvent contract; capture-first/formalize-later."

  - capability: "Signal relation graph: duplicate/conflict/supersede/dependency/synergy/shared-surface/authority-collision"
    source_status: CONFIRMED_DESIGN
    disposition: NEW_REQUIRED
    existing_component: "partial overlap with Control Tower O0-O4 and cognitive fingerprints"
    decision: >-
      Signal relations describe planning/evidence relationships. Execution collision authority remains Control Tower.
      Duplicate history is append-only; duplicate does not delete provenance.

  - capability: "Mission / ProblemSignature / MissionGraph"
    source_status: EXISTING_COGNITIVE_OS
    disposition: ADOPT
    existing_component: "SIGNAL_TOWER_MISSION_ROUTER + #312 + H1 contracts"
    decision: "Do not duplicate inside Signal Plane. Signal Plane outputs MissionCandidate/refs into Mission Plane."

  - capability: "Global reconciliation before formal task release"
    source_status: USER_EXPLICIT
    disposition: NEW_REQUIRED
    existing_component: "Control Tower reconciliation is narrower and execution-oriented"
    decision: >-
      Add GlobalReconciliationReceipt covering Signal, Mission/Task, GitHub, routes, claims, program lanes, domain state,
      pending approvals and material freshness. Receipt is planning freshness evidence, never execution authorization.

  - capability: "NO VALID GLOBAL RECONCILIATION RECEIPT -> NO NEW FORMAL TASK RELEASE"
    source_status: USER_EXPLICIT_CONFIRMED
    disposition: ADOPT_AS_HARD_PRE_RELEASE_INVARIANT
    decision: >-
      Mission/task publication is blocked without a fresh valid receipt. Control Tower authorization remains a separate
      later gate. Existing already-active emergency/user-approved work must not be silently cancelled by this invariant.

  - capability: "cross-window / cross-project state reconciliation"
    source_status: USER_EXPLICIT_AND_REAL_INCIDENT
    disposition: NEW_REQUIRED
    existing_component: "R133-CROSS-WINDOW-CLOSURE-RECONCILIATION-0001"
    decision: "CROSS_WINDOW_STATE_DRIFT becomes a mandatory Signal Plane regression and pre/postflight check."

  - capability: "exact-head / stale review / merge drift detection"
    source_status: USER_EXPLICIT_AND_DERIVED
    disposition: PORT_AND_EXTEND
    existing_component: "Control Tower stale-route/commit freshness + GitHub exact-head review practice"
    decision: >-
      Signal Plane records/reconciles GitHub state and raises planning blockers. Control Tower remains the authority that
      blocks unauthorized execution or conflicting leases.

  - capability: "PlanningIntentFingerprint"
    source_status: NOT_FROZEN
    disposition: MODIFY_LATER
    existing_component: "ReproducibilityFingerprint + source/context hashes + touch_set + authority_targets"
    decision: >-
      Do not create a third fingerprint truth. Future schema should be a planning projection that reuses stable hashes
      and explicitly excludes runtime reproducibility claims.

  - capability: "SemanticWorkKey"
    source_status: NOT_FROZEN
    disposition: MODIFY_LATER
    existing_component: "task_id/route refs + relation graph + touch_set + objective/domain/authority semantics"
    decision: >-
      Candidate dedup key only; never sufficient by itself to merge two signals or authorize work. Final schema remains open.

  - capability: "W3 continuity retrieval"
    source_status: EXISTING_AND_USER_REQUIRED
    disposition: ADOPT
    existing_component: W3_SECOND_BRAIN
    decision: "Signal Plane may request relevant W3 context by ref; it cannot become knowledge/memory truth authority."

  - capability: "Control Tower authorization / Work Claim / WIP / leases / O0-O4"
    source_status: EXISTING_FROZEN_BOUNDARY
    disposition: ADOPT
    existing_component: CONTROL_TOWER_310
    decision: "No execution authority moves into Signal Tower."

  - capability: "Operation Ledger / raw execution trace"
    source_status: USER_EXPLICIT_AND_EXISTING_DESIGN
    disposition: ADOPT
    existing_component: TRACE_LEDGER_PRIVACY_CONTRACT
    decision: >-
      Signal lifecycle events may reference or extend the Cross-Agent Trace Ledger taxonomy, but no second raw trace or
      telemetry truth store is created. Raw once, reference everywhere remains binding.

  - capability: "Signal append-only history + current projection"
    source_status: CONFIRMED_DESIGN
    disposition: NEW_REQUIRED
    decision: >-
      Signal ledger history is immutable/append-oriented; effective state is derived through explicit supersede/revoke/
      conflict-resolution events. Omission is not revocation.

  - capability: "privacy-safe Content Plane vs Control Plane separation"
    source_status: USER_GOAL_AND_CONFIRMED_DESIGN
    disposition: ADOPT_AND_EXTEND
    existing_component: TRACE_LEDGER_PRIVACY_CONTRACT
    decision: >-
      Signal control records keep refs/hashes/redacted summaries according to privacy scope. Public coordination state
      must not contain raw private chat bodies, secrets or credentials.

  - capability: "AI Film domain backlog bootstrap"
    source_status: USER_EXPLICIT
    disposition: NEW_REQUIRED_AS_DOMAIN_BOOTSTRAP
    existing_component: CROSS_PROJECT_DOMAIN_CONSUMER_BOUNDARY
    decision: >-
      After Signal Plane foundation is frozen, AI Film becomes the first full cross-repo backlog bootstrap consumer.
      Signal records refs/status/relations only; AI Film PROJECT_INDEX and domain canonicals remain authoritative.

  - capability: "AI Film Runtime Invocation Receipt / Health Check / Behavioral Activation"
    source_status: DOMAIN_BACKLOG_REQUIREMENTS_EVIDENCE
    disposition: REFERENCE_ONLY_FOR_SIGNAL_BOOTSTRAP_AND_CROSS_DOMAIN_CANDIDACY
    decision: >-
      Preserve as AI Film domain backlog. Transferable mechanism may later become CROSS_PROJECT_CAPABILITY_CANDIDATE
      only after cross-domain validation. Do not prematurely promote into shared runtime rules.

  - capability: "AI Film H3 -> C-DANCE proxy evaluation, Reference Escalation, Selective Constraint/SOAC"
    source_status: DOMAIN_BACKLOG_REQUIREMENTS_EVIDENCE
    disposition: REFERENCE_ONLY_FOR_SIGNAL_BOOTSTRAP
    decision: "Remain AI Film domain work until separately validated for shared cognition."

  - capability: "second global W3 / second Control Tower / second Trace Ledger / mega-agent"
    source_status: FORBIDDEN_ANTI_PATTERN
    disposition: REJECT_WITH_REASON
    reason: "duplicate authority, single-point-of-failure risk and semantic divergence"

unified_architecture_candidate:
  identity: "ONE_SIGNAL_TOWER / TWO_INTERNAL_PLANES"
  planes:
    PRE_MISSION_SIGNAL_PLANE:
      responsibilities:
        - capture
        - classify
        - preserve provenance
        - relation graph
        - dedup_without_deletion
        - supersession_and_revocation
        - global shallow scan
        - delta scan
        - targeted deep retrieval requests
        - cross-window reconciliation
        - priority vector
        - backlog projection
        - MissionCandidate proposal
      may_not:
        - own execution authorization
        - write W3 truth directly
        - replace Mission/ProblemSignature/MissionGraph
        - replace domain canonical
        - replace Trace Ledger
    MISSION_PLANE:
      existing_contract: SIGNAL_TOWER_MISSION_ROUTER_CONTRACT_0001
      starts_after: VALID_SIGNAL_CLUSTER_OR_DIRECT_USER_MISSION
      responsibilities:
        - MissionDraft
        - continuity retrieval request
        - ProblemSignature request
        - work-need decision
        - MissionGraph proposal
        - ask Control Tower
        - aggregate final result
  authorities:
    knowledge_memory_lifecycle: W3_SECOND_BRAIN
    method_selection: METHOD_ROUTER_312
    execution_authorization: CONTROL_TOWER_310
    runtime_orchestration: HARNESS_RUNTIME_FUTURE_ONLY
    final_risk_veto: W7_VALIDATION_RISK
    outcome_learning: W9_OUTCOME_LEARNING
    domain_truth: DOMAIN_REPOSITORIES

