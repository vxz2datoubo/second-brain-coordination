strongest_counterarguments:
  - risk: "Signal Tower becomes a giant second brain/control plane"
    answer: "separate pre-Mission planning from W3 truth and Control Tower execution authority; enforce authority graph tests"
  - risk: "Global scan becomes too expensive and slow"
    answer: "shallow global metadata scan + delta watermark + targeted deep reads; no mechanical full-load"
  - risk: "receipt becomes stale milliseconds after creation"
    answer: "bind receipt to watermarks/SHAs/revisions and invalidate on material changes"
  - risk: "semantic dedup merges distinct intents"
    answer: "fingerprints/keys are candidate evidence only; domain/objective/authority/constraints/touch-set review required"
  - risk: "all ideas create unbounded signal flood"
    answer: "clusters/projections/aging/compaction while preserving append-only provenance"
  - risk: "cross-domain lessons contaminate domain truth"
    answer: "use CROSS_PROJECT_CAPABILITY_CANDIDATE lifecycle and cross-domain validation before shared promotion"

