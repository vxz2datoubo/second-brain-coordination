parallelism_notes:
  S0_vs_H2:
    rule: >-
      S0A-S0E0 pre-Mission work does not require Harness and may precede H2. Completion never grants H2/H7 runtime
      authority. If the same Codex executor is used, only one active Codex execution route is allowed.
  H1_H7:
    rule: >-
      DAG edges express logical dependencies, not permission to execute independent nodes concurrently. Every actual
      implementation node requires a fresh per-agent route and Control Tower resource/collision decision.
  cross_project:
    rule: >-
      R136 AI Film use is read-only runtime-proof evidence only. Any AI Film canonical modification that installs a
      mandatory receipt emitter is a separate successor domain-write gate after R136 acceptance.
  remote_ci:
    use_for: "large test matrices and compatibility sweeps"
  local:
    heavy_stage_max: 1

