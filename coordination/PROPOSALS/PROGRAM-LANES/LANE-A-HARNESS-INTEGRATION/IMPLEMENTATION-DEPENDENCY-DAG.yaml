  H0K:
    name: GPT_H0_COMPATIBILITY_VERDICT
    state: ACCEPT_WITH_BOUNDED_DEBT
    runtime: false
    valid_results: [ACCEPT, ACCEPT_WITH_BOUNDED_DEBT, RETURN_FOR_ARCHITECTURE_REWORK]

  H1:
    name: CONTRACT_ONLY_SYNTHETIC_SKELETON
    state: COMPLETED
    runtime: true
    resource_class: LIGHT_TO_MEDIUM_IMPLEMENTATION
    evidence:
      issue: 338
      merged_pr: 340
      reviewed_head: "0b90373d8920caacb7b8847fc0af23e666cdf8a0"
      merge_commit: "c17df847bee689f23363b0ddbba417c6c37c79ab"
    expected_scope:
      - schemas
      - validators
      - state machine logic
      - fingerprint builder
      - synthetic fixtures
      - no Harness runtime call

  S0A:
    name: PRE_MISSION_SIGNAL_CONTRACTS_AND_RELATION_GRAPH
    state: ARCHITECTURE_CANDIDATE_IN_PR_342
    runtime: false
    resource_class: ARCHITECTURE_ONLY
    artifacts:
      - GLOBAL-SIGNAL-PLANE-CONTRACTS.yaml
      - GLOBAL-SIGNAL-PLANE-ENTERPRISE-GOVERNANCE.yaml
      - SIGNAL-TOWER-MISSION-ROUTER-CONTRACT.yaml
    requires: [H1]
    purpose: "freeze SignalEvent/Link/Cluster/Projection and one-tower/two-plane boundary"

  S0B:
    name: GLOBAL_RECONCILIATION_RECEIPT_AND_ENTERPRISE_REGRESSIONS
    state: ARCHITECTURE_CANDIDATE_IN_PR_342
    runtime: false
    resource_class: ARCHITECTURE_ONLY
    artifacts:
      - GLOBAL-RECONCILIATION-RECEIPT-CONTRACT.yaml
      - GLOBAL-SIGNAL-PLANE-REGRESSION-SPEC.yaml
      - UNIFIED-SIGNAL-TOWER-ARCHITECTURE-RECONCILIATION.yaml
    requires: [S0A]
    purpose: "freeze freshness/invalidation/replay/idempotency/cross-window acceptance semantics"

  S0C:
    name: PUBLIC_SAFE_SYNTHETIC_GLOBAL_SIGNAL_PLANE_SKELETON
    state: NOT_AUTHORIZED_YET
    runtime: true
    resource_class: LIGHT_TO_MEDIUM_IMPLEMENTATION
    requires: [S0A, S0B, FRESH_CONTROL_TOWER_S0_RELEASE]
    expected_capabilities:
      - immutable SignalEvent append API or equivalent local repository abstraction
      - idempotent ingestion
      - SignalLink relation store/projection
      - deterministic SignalCluster/SignalProjection reducer
      - GlobalReconciliationReceipt builder/verifier
      - receipt invalidation compare-and-check
      - public-safe synthetic fixtures
      - R133 cross-window drift regression
      - replay/rebuild checksum
      - no long-lived daemon
    forbidden:
      - DeepSeek_Harness_runtime
      - provider_subagent_jobs
      - private_chat_cross_window_bridge
      - webhooks_or_live_connectors_without_separate_gate
      - W3_runtime_mutation
      - domain_canonical_write
      - H2_auto_start
      - trading

  S0D:
    name: READ_ONLY_DOMAIN_BACKLOG_BOOTSTRAP_SHADOW
    state: BLOCKED
    runtime: true
    resource_class: MEDIUM_IMPLEMENTATION
    requires: [S0C, FRESH_CROSS_REPO_READ_ONLY_GATE]
    first_consumer: AI_FILM_SYSTEM
    boundary: "READ_ONLY_REFS_STATUS_RELATIONS / NO_DOMAIN_CANONICAL_WRITE"
    purpose: >-
      Read AI Film current canonical references and build a Signal backlog projection without copying domain truth.
      This is separate from S0C and requires source repo commit binding and privacy/domain-adapter checks.

  H2A:
    name: HARNESS_PINNED_INSTALL_AND_SMOKE
    state: NOT_AUTHORIZED / USER_H2_START_REQUIRED
    runtime: true
    resource_class: MEDIUM_IMPLEMENTATION
    exact_upstream_candidate:
      repository: deepseek-ai/deepseek-harness
      commit: 47f943859bef60e4160492346772ded9b24f765a
      package_family_version: 0.1.0-rc.5
    requires: [H0K, EXPLICIT_USER_H2_START, FRESH_CONTROL_TOWER_H2_RELEASE]

  H2B:
    name: HARNESS_ADAPTER_POC
    state: BLOCKED
    runtime: true
    resource_class: HEAVY_IMPLEMENTATION
    requires: [H1, H2A]
    expected_capabilities:
