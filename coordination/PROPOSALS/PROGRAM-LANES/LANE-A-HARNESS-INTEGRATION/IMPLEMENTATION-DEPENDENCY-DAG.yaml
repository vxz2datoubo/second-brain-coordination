parallelism_notes:
  S0_vs_H2:
    rule: >-
      S0A/S0B architecture and S0C public-safe offline implementation do not require Harness and may precede H2.
      They do not grant H2 or H7 runtime authority. If the same Codex executor is used, only one active Codex route is allowed.
  H1_H7:
    rule: >-
      DAG expresses logical dependencies, not permission to execute all independent nodes concurrently. Every actual
      implementation node requires a fresh per-agent route and Control Tower resource/collision decision.
  cross_project:
    rule: "AI Film S0D backlog bootstrap is a separate read-only gate and cannot overlap a conflicting active Codex lease."
  remote_ci:
    use_for: "large test matrices and compatibility sweeps"
  local:
    heavy_stage_max: 1
