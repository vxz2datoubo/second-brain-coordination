    name: "H1_CONTRACT_ONLY_SYNTHETIC_SKELETON"
    status: "CANDIDATE_ONLY / NOT_AUTHORIZED"
    execution_agent: null
    route_binding: null
    resource_class: "LIGHT_TO_MEDIUM_IMPLEMENTATION"
    runtime_harness_call: false
    private_data: false
    production_gateway: false
    trading: false
    depends_on:
      - H0_FINAL_VERDICT
      - FRESH_CONTROL_TOWER_H1_CLAIM_SCAN
    candidate_modules:
      - contracts
      - state_machines
      - semantic_invariant_validators
      - organization_graph_validator
      - trace_handoff_fixture_validator
      - reproducibility_fingerprint_builder
      - synthetic_fixtures
    required_outputs:
      - formal JSON Schema or equivalent structural validator artifacts compiled from COGNITIVE_CONTRACT_DSL/v0.2
      - deterministic semantic invariant registry implementation
      - DecisionEpisode state-machine tests
      - MissionGraph DAG/rework tests
      - authority/return-path/static graph tests
      - trace/handoff/fingerprint fixtures
      - exact-head CI receipt
    read_interfaces:
      - "H0 proposal contracts as design inputs"
      - "frozen Second Brain conceptual consumption boundaries"
    write_interfaces:
      - "NONE_TO_W3_OR_DOMAIN_RUNTIME"
    stop_after: "GPT_EXACT_HEAD_REVIEW"
    forbidden:
      - Harness package install/runtime binding as product code
      - provider integration
      - private W3 access
      - production/live bridge
      - Formal Skill promotion
      - trading

