schema_version: "0.2"
claim_bundle_id: "HARNESS-COGNITIVE-OS-IMPLEMENTATION-CLAIM-CANDIDATES-0001"
status: "CANDIDATE_ONLY / NOT_AUTHORIZED"
owner: "USER"
architecture_owner: "GPT"

