      commit: "47f943859bef60e4160492346772ded9b24f765a"
      package_family_version: "0.1.0-rc.5"
    depends_on:
      - H1_EXACT_HEAD_ACCEPTED
      - H1_MERGE_OR_APPROVED_INTEGRATION_BASE
      - HARNESS_RUNTIME_BINDING_GATE_PASS
      - FRESH_CONTROL_TOWER_H2_CLAIM_SCAN
    candidate_modules:
      - harness_adapter
      - signal_tower_adapter_fixture
      - second_brain_adapter_fixture
      - control_tower_authorization_adapter
      - challenge_workflow
      - trace_bridge
      - provider_adapter_fixture
      - resource_governor
    candidate_interfaces_read:
      - "SecondBrainSearch/v1 conceptual successor"
      - "SecondBrainContext/v1 conceptual successor"
      - "KnowledgeCandidateReconcile/v1 conceptual successor"
      - "FeedbackLifecycle/v1 successor candidate"
      - "MethodExecutionPlan/v1"
      - "MissionGraph/v1"
      - "ExecutionAuthorization/v1"
    adapter_owned_outputs:
      - "HarnessWorkflowRequest/v1"
      - "HarnessWorkflowResult/v1"
      - "FormalHandoff/v1"
      - "TraceLedgerEvent/v1"
    transported_but_not_owned:
      - "OutcomeLearning/v1 owned by W9"
      - "W3 lifecycle candidate updates owned by W3"
      - "W7 gate result owned by W7"
    required_runtime_gates:
      - canonical Harness identity and exact pin provenance PASS
      - reproducible clean install/pack smoke PASS
      - exact consumed public service signatures frozen
      - target environment compatibility PASS
      - provider failure/cancel/retry tests PASS
      - pinned-vs-latest compatibility radar works without auto-upgrade
      - rollback/no-residual-process PASS
    stop_after: "GPT_EXACT_HEAD_REVIEW"
    forbidden:
      - direct domain import of concrete Harness provider internals
      - private W3 live access
      - production scheduler/MCP/Gateway
      - credentials persistence in repo
      - formal PROJECT/GLOBAL promotion
      - trading account/order/fund action

frozen_authority_nonclaims:
  - "DOES_NOT_OWN_W3"
  - "DOES_NOT_OWN_FORMAL_SKILLS"
  - "DOES_NOT_OWN_METHOD_SELECTION"
  - "DOES_NOT_OWN_CONTROL_TOWER_AUTHORIZATION"
  - "DOES_NOT_OWN_W7_VETO"
  - "DOES_NOT_OWN_W9_OUTCOME_LEARNING"
  - "DOES_NOT_OWN_MARKET_DATA_OR_TRADING"
  - "DOES_NOT_OWN_PRIVATE_OR_PRODUCTION_PERMISSION"

resource_policy:
  local_heavy_stage_max: 1
  same_agent_active_execution_max: 1
  nested_process_pools: "FORBIDDEN"
  task_owned_descendant_tracking: "REQUIRED"
  global_kill_python: "FORBIDDEN"
  large_matrix: "REMOTE_CI_PREFERRED"

rollback:
  H1:
    type: "REMOVE_CONTRACT_SKELETON_RUNTIME_SURFACE"
    must_preserve:
      - W3 canonical data/schema
      - W2-W13 authority
      - Control Tower state
      - existing Agent routes
  H2:
    type: "DELETE_OR_DISABLE_HARNESS_ADAPTER_POC_SURFACE"
    must_preserve:
      - W3 canonical data/schema
      - W2-W13 authority
      - Control Tower state
      - existing Agent routes
      - user private data
    no_residual_daemon: true

prohibited_until_separate_approval:
  - private W3 live access
  - formal PROJECT/GLOBAL write
  - production scheduler
  - production MCP/Gateway
  - credentials or secret persistence
  - repository permission change
  - trading account/order/fund action
  - auto skill promotion
  - automatic Harness version upgrade
