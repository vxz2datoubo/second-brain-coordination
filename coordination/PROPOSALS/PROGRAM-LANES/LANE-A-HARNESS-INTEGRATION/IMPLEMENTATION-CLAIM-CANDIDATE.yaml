  - "H0 final compatibility verdict ACCEPT or ACCEPT_WITH_BOUNDED_DEBT"
  - "second-brain foundation remains CLOSED_WITH_BOUNDED_GAPS"
  - "fresh Control Tower reconciliation"
  - "fresh O0-O4 scan"
  - "no active same-agent implementation collision"
  - "no heavy local stage collision"
  - "explicit GPT implementation release for the exact slice"
  - "user high-impact approval if permissions/private/production/trading boundary changes"

candidate_write_root:
  preferred: "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/HARNESS-COGNITIVE-OS-ADAPTER"
  state: "DO_NOT_CREATE_UNTIL_EXACT_SLICE_RELEASED"

claims:
