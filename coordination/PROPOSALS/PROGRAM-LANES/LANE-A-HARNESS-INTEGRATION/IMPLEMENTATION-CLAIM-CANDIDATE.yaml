    status: "BLOCKED_PENDING_H1_AND_RUNTIME_BINDING_GATE"
    execution_agent: null
    route_binding: null
    resource_class: "HEAVY_IMPLEMENTATION"
    runtime_harness_call: true
    private_data: false
    production_gateway: false
    trading: false
    exact_upstream_candidate:
