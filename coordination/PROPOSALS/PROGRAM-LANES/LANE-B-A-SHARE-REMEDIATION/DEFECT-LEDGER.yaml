    finding_class: "CONFIRMED_DEFECT"
    subsystem: "B_MARKET_MICROSTRUCTURE+F_BACKTEST+G_DECISION"
    current_truth: >-
      Current Phase-2 simulation can convert a bar reaching the price limit directly into LIMIT_UP_BUY_RESTRICTED or
      LIMIT_DOWN_SELL_RESTRICTED. Exchange price validity does not prove whether a particular order could fill.
    evidence:
      - "canonical simulate_portfolio limit-price rejection behavior"
      - "public slice is bar-based and does not establish queue/order-book/contra-liquidity state"
    evidence_grade: "HIGH / CANONICAL_CODE + MARKET_MECHANISM"
    severity: "P0"
    probability_of_real_failure: "HIGH for locked-limit execution claims"
    user_impact: "Can turn a bar-level observation into false certainty about executable liquidity."
    trading_impact: "False no-fill/fill assumptions distort event studies, T feasibility and simulated PnL."
    false_positive_risk: "LOW"
    dependency: "W2 rule snapshot + liquidity/fillability evidence contract"
    existing_partial_solution: "ABSTAIN/UNKNOWN semantics and data-grade restrictions already exist elsewhere in design."
    recommended_action: >-
      Encode PRICE_VALIDITY and ORDER_FILLABILITY as separate states. A bar at limit may establish a valid/limit price state,
      but fillability must be UNKNOWN/ABSTAIN without sufficient queue/order-book/liquidity evidence, or explicitly labeled as a conservative scenario assumption.
    implementation_cost: "LOW_MEDIUM"
    validation_method: "Adversarial bar-at-limit fixtures with no queue evidence, explicit fillability evidence, and conservative-scenario labeling."
    failure_condition: "Bar close/high/low at a limit is reported as observed no-fill truth without fillability evidence."
    whether_runtime_change_required: true

