user_cognition_mapping:
  known_and_explicitly_expressed:
    - "A-share T+1, auction, price-limit, suspension and liquidity constraints must be modeled."
    - "L2/tick/order-flow evidence must not be faked from lower-grade aggregates."
    - "Volume Profile, Delta, CVD, Absorption, Footprint, Imbalance, VWAP and CMF are useful only with matching data capability."
    - "Single-factor results are insufficient; multi-factor interactions and different regimes require validation."
    - "Causation and correlation must be separated."
    - "Kunlun/BlueFocus need forward exposure, price-implied expectations, earnings surprise and market-pricing analysis."
    - "Cross-market event transmission should be backtested rather than assumed."
    - "Institution/quant/active-capital/retail simulations require explicit strengths, weaknesses and game interaction."
    - "Sentiment can be manipulated and should not receive naive high weight."
    - "Real trade feedback should feed back into factors, failure conditions and risk."
  probably_known_but_not_fully_structured:
    - "T+1 must be lot/inventory aware: same-day buys cannot erase saleability of older inventory."
    - "Market rules must be effective-date, board, security-type and rule-version keyed rather than a single global percentage."
    - "A green synthetic test can be false-green if the fixture era never crosses a rule-regime boundary."
    - "Data-source priority is not the same thing as proven runtime entitlement/capability."
  unknown_but_easy_to_explain:
    - "purged walk-forward, embargo and lockbox as anti-leakage validation gates"
    - "PBO / Deflated Sharpe / White Reality Check / SPA as defenses against selection and multiple-testing bias"
    - "effective independent trials versus raw trade count"
    - "point-in-time corporate-action and vendor-revision snapshots"
  unknown_and_requires_layered_explanation:
    - "causal event identification under overlapping policy/news shocks"
    - "multiple-testing correction across adaptive factor/strategy search"
    - "capacity/adverse-selection modeling under endogenous market impact"
    - "hidden participant type inference without converting probabilistic behavior evidence into identity claims"

