findings:
  - finding_id: "LB-P0-001"
    subsystem: "A_DATA+B_MARKET_MICROSTRUCTURE+F_BACKTEST"
    current_truth: "Phase-2 replay hardcodes price limits as ST=5%, non-ST=10%; rule selection is not board/security/effective-date aware."
    evidence:
      - "PHASE-2-OFFLINE-VERTICAL-SLICE/src/offline_research/engine.py::_limit_pct"
      - "Phase-2 Bar.limit_rule_version defaults to ashare-v1 without effective-date resolution"
      - "SSE/SZSE 2026 Trading Rules effective 2026-07-06 changed relevant regimes"
    evidence_grade: "HIGH / CANONICAL_CODE + OFFICIAL_PRIMARY_RULES"
    severity: "P0"
    probability_of_real_failure: "HIGH when replay crosses different board/rule regimes or post-2026-07-06 risk-warning rules"
    user_impact: "Can label executable/non-executable trades incorrectly and contaminate T-button or strategy conclusions."
    trading_impact: "False fills, false missed fills, wrong stop/entry feasibility, invalid backtest PnL."
    false_positive_risk: "LOW"
    dependency: "W2 rule authority + temporal semantics"
    existing_partial_solution: "Blueprints already require AShareRuleSnapshot/rule_snapshot_id and versioned A-share constraints."
    recommended_action: "Replace global percentage logic with effective-date/venue/board/security/status AShareRuleSnapshot consumption."
    implementation_cost: "MEDIUM"
    validation_method: "Boundary fixtures before/after rule changes + board/risk-warning/no-limit cases + exact rule_snapshot_id assertions."
    failure_condition: "Any replay decision uses a rule not effective at event_time or cannot resolve rule context without abstaining."
    whether_runtime_change_required: true

  - finding_id: "LB-P0-002"
    subsystem: "B_MARKET_MICROSTRUCTURE+G_DECISION"
    current_truth: "Phase-2 T+1 state tracks one acquired_day per symbol; a same-day buy resets acquired_day for the whole position."
    evidence:
      - "simulate_portfolio positions[symbol] stores aggregate quantity + acquired_day"
      - "SELL_CANDIDATE rejects whole position when acquired_day equals current trading day"
      - "existing test only checks newly bought inventory cannot be sold same day"
    evidence_grade: "HIGH / CANONICAL_CODE_AND_TEST"
    severity: "P0"
    probability_of_real_failure: "HIGH for core-position plus intraday T workflows"
    user_impact: "Directly mis-models the user's long-held CORE_BOOK + small T_BOOK behavior."
    trading_impact: "Can incorrectly lock old sellable inventory or misstate counterfactual T execution."
    false_positive_risk: "LOW"
    dependency: "W2 inventory/settlement semantics"
    existing_partial_solution: "Basic same-day T+1 lock exists; multiple blueprints explicitly require lot-level inventory."
    recommended_action: "Use lot-level or sellable/new inventory buckets with acquisition day and settlement eligibility."
    implementation_cost: "LOW_MEDIUM"
    validation_method: "Old 1000-share sellable lot + same-day 500-share buy; allow sale of old lot only; cover partial sell and next-day unlock."
    failure_condition: "Same-day purchase changes saleability of pre-existing settled inventory."
    whether_runtime_change_required: true

  - finding_id: "LB-P0-003"
    subsystem: "A_DATA+B_MARKET_MICROSTRUCTURE"
    current_truth: "Blueprint priority TQ > TDX MCP > WeStock > vipdoc exists, but current GitHub canonical evidence does not prove live adapter capability/entitlement for each source."
    evidence:
      - "Core-T blueprint defines source priority and per-field provenance requirements"
      - "Phase-0 audit says real-time capability not fully verified and raw tick/order/queue must not be claimed without evidence"
      - "Phase-2 public fixture runtime permits HISTORICAL_BAR only for fixtures and rejects RAW_TRADE_TICK"
    evidence_grade: "MEDIUM_HIGH / CANONICAL_DOCS; LIVE_LOCAL_STATE_UNAVAILABLE"
    severity: "P0"
    probability_of_real_failure: "MEDIUM"
    user_impact: "Order-flow features may be over-trusted if a data-source name is mistaken for a proven capability."
    trading_impact: "False Delta/CVD/Absorption/Footprint/queue conclusions if lower-grade aggregates are promoted."
    false_positive_risk: "MEDIUM because local adapters may exist outside current GitHub evidence"
    dependency: "W2 capability/entitlement registry"
    existing_partial_solution: "DataGrade A/B/C and explicit no-fake-orderflow rules already exist."
    recommended_action: "Create a read-only capability matrix backed by reproducible adapter probes before any order-flow feature is enabled."
    implementation_cost: "MEDIUM; may later require local provider access"
    validation_method: "Field-level provenance/capability probe, timestamp semantics, entitlement status, cross-source conflict fixtures."
    failure_condition: "A feature requiring RAW_TRADE_TICK/ORDER_EVENT is computed from snapshot/aggregate/vendor-labeled flow."
    whether_runtime_change_required: false

  - finding_id: "LB-P0-004"
    subsystem: "F_BACKTEST+I_SYSTEM_ENGINEERING"
    current_truth: "Existing Phase-2 tests can be green while validating a stale rule regime; test AS_OF is 2026-01-31 and does not cross the 2026-07-06 rule boundary."
    evidence:
      - "PHASE-2 tests/test_offline_research.py AS_OF=2026-01-31"
      - "test_t_plus_one_suspension_and_limits_reject validates only the old simplified limit contract"
      - "Program rules explicitly say formula correctness/blueprint presence are not A-share validation"
    evidence_grade: "HIGH / CANONICAL_TEST + OFFICIAL_RULE_CHANGE"
    severity: "P0"
    probability_of_real_failure: "HIGH if green CI is treated as current-rule proof"
    user_impact: "Creates false confidence in backtest correctness."
    trading_impact: "Invalid strategy promotion and incorrect execution feasibility."
    false_positive_risk: "LOW"
    dependency: "LB-P0-001"
    existing_partial_solution: "Strong exact-head/false-green governance exists elsewhere in the repo."
    recommended_action: "Add temporal rule-boundary regression suites and make current-rule coverage an explicit gate."
    implementation_cost: "LOW"
    validation_method: "Pre/post effective-date fixtures; mutation tests that old rule on new date and new rule on old date fail closed."
    failure_condition: "CI passes when rule/effective-date mismatch is injected."
    whether_runtime_change_required: true

  - finding_id: "LB-P1-005"
    subsystem: "A_DATA+C_SIGNAL_FACTOR"
    current_truth: "Corporate-action/adjustment fields are shallow in the public offline Bar contract (boolean adjusted, method, note) and do not demonstrate PIT revision history."
