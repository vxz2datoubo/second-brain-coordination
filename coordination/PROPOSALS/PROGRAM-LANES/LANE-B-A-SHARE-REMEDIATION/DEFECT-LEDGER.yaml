    probability_of_real_failure: "HIGH around intraday, corporate-action and special-rule cases"
    user_impact: "Can compute a wrong limit boundary even when the percentage rule itself is correct."
    trading_impact: "Wrong valid-price band and wrong simulated execution feasibility."
    false_positive_risk: "LOW"
    dependency: "W2/C2 effective rule snapshot + authoritative market input"
    existing_partial_solution: "PIT/lineage and rule_snapshot_id concepts already exist."
