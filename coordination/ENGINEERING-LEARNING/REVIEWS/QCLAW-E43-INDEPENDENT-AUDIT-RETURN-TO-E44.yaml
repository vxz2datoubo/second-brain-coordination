blocking_findings:
  - id: "E43-F01"
    severity: "CRITICAL"
    finding: "EvidenceFactory accepts caller-authored source span references, evidence layers, content and source digests without verifying an admitted source/span capability. AtomFactory accepts caller-authored provenance, confidence and verification state instead of deriving them from verified evidence."
  - id: "E43-F02"
    severity: "CRITICAL"
    finding: "AuthorityRegistry exposes public registration methods and mutable registries; factory HMAC secrets and keys are reachable through ordinary Python attributes. Registry membership checks IDs rather than immutable issued-object identity and complete recomputation."
  - id: "E43-F03"
    severity: "CRITICAL"
    finding: "SourceDocument and SourceSpan are directly constructible and mutable through ordinary attributes. SourceSpan carries no exact slice digest, SourceDocument has no full self-verifier, verify_span returns true after only document-id and bounds checks, zero-length spans are admitted, and roles are caller-authored."
  - id: "E43-F04"
    severity: "CRITICAL"
    finding: "MasterRecord transitions are publicly callable and use arbitrary evidence strings. Semantic identity is content plus evidence ID, so paraphrases and the same content under different evidence IDs are separate masters. Conflict classes and descriptions remain caller-authored and classification consumes unverified strings."
  - id: "E43-F05"
    severity: "CRITICAL"
    finding: "Cognition treats every SOURCE_FACT as KNOWN_AND_STATED and GLOBAL, without verified user-origin/message evidence. The signing key is caller-provided, atom_id is unused, and verification does not recompute state and routing from evidence."
  - id: "E43-F06"
    severity: "CRITICAL"
    finding: "Skill promotion gates trust caller-supplied evidence IDs, run IDs, case counts, counterexample counts, scope, failure conditions and rollback booleans. A caller can pass a forged Skill with an existing skill_id and chosen state; promote does not verify current issued-object identity or receipt evidence."
  - id: "E43-F07"
    severity: "CRITICAL"
    finding: "CorpusEvaluator feeds case.expected.atom_type into AtomFactory, so the expected answer is used to produce the observed answer. It does not infer atom type and does not execute complete conflict, memory, skill or anti-pattern outcomes."
  - id: "E43-F08"
    severity: "CRITICAL"
    finding: "Corpus identity omits ExpectedOutcome and most ground truth. Empty-input tests accept either PASS or FAIL, multi-case tests accept either verdict, secret-like input is required to PASS while being stored in plain evidence/atom content, and paraphrase cases are never compared."
  - id: "E43-F09"
    severity: "CRITICAL"
    finding: "No credited mutation execution occurred. test_q7 explicitly tests build and apply/restore without full execution and never calls MutationRunner.run_all. The runner has incorrect test cwd/module addressing, no finally restoration, incomplete command/stream/duration evidence and several mutations do not target the claimed invariant."
  - id: "E43-F10"
    severity: "CRITICAL"
    finding: "No E43 Provider workflow run exists at the claimed tested or receipt head. Only unrelated Phase 3 workflow runs are visible. The submitted workflow uses an invalid job-level if-no-files-found key, lacks explicit exact-head checkout, suppresses one test command with || true, publishes only six mixed artifacts, and compares source concatenation rather than semantic outcomes."
  - id: "E43-F11"
    severity: "MATERIAL"
    finding: "E42-SOURCE-SELECTION uses abbreviated blob SHAs instead of exact full Git blob SHA-1 values and noncanonical abbreviated source paths, so exact provenance is not established."
  - id: "E43-F12"
    severity: "MATERIAL"
    finding: "Receipt identity is contradictory: the real plan is 17aa46ed, while AI_HANDOFF labels 536acd9b as plan. TEST-RUN marks Python 3.11 to-verify while AI_HANDOFF and D05 claim 69/69 pass. The receipt claims six-artifact CI while also admitting Provider observation remains required."
  - id: "E43-F13"
    severity: "MATERIAL"
    finding: "The test suite includes a no-op pass test for unregistered bundle evidence and validates several defective semantics, including SOURCE_FACT automatically becoming GLOBAL and arbitrary evidence IDs/counts driving skill promotion."

