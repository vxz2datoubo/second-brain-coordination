blocking_findings:
  - id: "E39-S0-001"
    severity: "BLOCKING"
    finding: >-
      UTF8ByteIndex is declared frozen but line_starts and chunk_starts are typed and stored as mutable List[int] values. External callers can mutate the finalized index in place, directly violating the returned immutability requirement.
    evidence: "src/qclaw_strict_byte/utf8_guard.py stores line_starts and chunk_starts lists through object.__setattr__."
    required_closure: "Store immutable tuples and add direct append/item-assignment resistance tests."
  - id: "E39-S0-002"
    severity: "BLOCKING"
    finding: >-
      No explicit EOF-exclusive byte-boundary-to-codepoint API exists. byte_to_chunk_index rejects total_bytes and accepts continuation-byte offsets by mapping them to a containing codepoint, which conflates legal-boundary mapping with containing-codepoint lookup.
    required_closure: "Add separate legal boundary and containing-codepoint APIs; total_bytes must map to codepoint_count and illegal continuation boundaries must fail in the legal-boundary API."
  - id: "E39-S0-003"
    severity: "BLOCKING"
    finding: >-
      The required genuine 0xED non-progress mutation is still absent. Current tests run the unmodified parser and a separate sleeping process. test_timeout_on_blocked_process expects TimeoutExpired but does not kill or join the child, so it is neither a production-source mutation nor cleanup proof.
    required_closure: "Mutate the actual 0xED scan branch to stop advancing in an isolated copied source tree, observe forced process termination/nonzero test failure, restore source and prove green with no surviving child."
  - id: "E39-S0-004"
    severity: "BLOCKING"
    finding: >-
      Final LF, final CRLF and trailing empty-line semantics remain undefined. line_starts may append EOF, while _split_lines_byte does not emit a trailing empty line after a final terminator, and no tests bind one canonical rule.
    required_closure: "Define one explicit line model and test empty input, final LF, final CRLF, repeated terminators and trailing empty lines across index and all adapters."
  - id: "E39-COVERAGE-001"
    severity: "BLOCKING"
    finding: >-
      JSON tokenization skips whitespace without emitting STRUCTURE ownership, ignores validation failure and can return partial spans for malformed or trailing input instead of UNKNOWN_ERROR ownership. It therefore does not provide exact-once byte coverage.
    required_closure: "Emit every whitespace/punctuation/error byte exactly once and fail product validation when any byte is uncovered or multiply owned."
  - id: "E39-COVERAGE-002"
    severity: "BLOCKING"
    finding: >-
      adapt_jsonl tokenizes the full source buffer from each line_start instead of a line-bounded slice. A valid line can therefore consume tokens from later lines, creating cross-line spans, duplicates and overlap.
    required_closure: "Tokenize a bounded line slice and offset results, with adversarial adjacent valid/malformed lines and exact coverage tests."
  - id: "E39-COVERAGE-003"
    severity: "MAJOR"
    finding: >-
      Conversation adapters omit structural colon/space bytes and plain-conversation blank separators from returned spans, so their output is not a complete ownership partition without an explicit gap-filling stage.
