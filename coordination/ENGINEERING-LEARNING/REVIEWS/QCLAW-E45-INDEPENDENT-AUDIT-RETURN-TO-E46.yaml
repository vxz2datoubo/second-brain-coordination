blocking_findings:
  F01_PROVIDER_RED:
    severity: "CRITICAL"
    evidence: "Tested run 31157510874 and receipt run 31157703368 both conclude failure."
    detail: >-
      Every matrix job failed environment artifact upload because environment.txt was created at repository root but upload expected it under QCLAW-E45.
      The compare job also failed.
  F02_CANONICAL_COMPARE_CONTRADICTION:
    severity: "CRITICAL"
    detail: >-
      canonical-summary.txt embeds matrix-varying python and seed fields, then compare requires byte-identical canonical summaries across all six jobs.
      The workflow therefore asks matrix-specific bytes to be byte-identical and cannot satisfy its own determinism contract.
  F03_CAPABILITY_FORGEABLE:
    severity: "CRITICAL"
    detail: >-
      VerifiedEvidenceCapabilityView is a public frozen dataclass whose __post_init__ is pass. An ordinary caller can directly construct
      issuer=arbitrary, origin=USER_EXPLICIT_MESSAGE, verification_result=VERIFIED. The test that claims this is impossible only fails because
      it adds a nonexistent _bypass_frozen keyword; it does not test the real constructor path.
  F04_USER_ORIGIN_HEURISTIC:
    severity: "CRITICAL"
    detail: >-
      CognitionEngine upgrades to GLOBAL when a record is VERIFIED USER_EXPLICIT_MESSAGE and source_identity merely contains 'user_msg_'.
      This is a naming heuristic, not exact accepted source/span user-origin authority.
  F05_LOCAL_AUTHORITY_AND_RECORD_BYPASS:
    severity: "HIGH"
    detail: >-
      EvidenceFactory/EvidenceRegistry are ordinary caller-constructible local authorities. create_bundle accepts caller-supplied EvidenceRecord
      objects without proving registry identity, allowing fabricated VERIFIED records to be bundled.
  F06_MASTER_TRANSITION_UNGUARDED:
    severity: "CRITICAL"
    detail: >-
      MasterRegistry.verify_transition compares master.current_content_hash to itself, a tautology, then returns True. add_version does not
      require verify_transition or an independent evaluator receipt before changing current content.
  F07_SKILL_RECEIPTS_CALLER_CONSTRUCTIBLE:
    severity: "CRITICAL"
    detail: >-
      TestReceipt is a public dataclass. A caller can create success=True, arbitrary case_ids and counterexamples=0, then satisfy promotion gates.
      No accepted external receipt authority is verified.
  F08_MUTATION_NOT_REAL_ISOLATED:
    severity: "CRITICAL"
    detail: >-
      mutations.py writes mutated bytes directly into the task source tree, restores after subprocess only on the normal path, not in finally,
      and does not use an isolated copied-production workspace. Several mutations only change function signatures/error strings and need not kill
      the named invariant. The CI workflow does not execute run_mutation; tests only verify anchor presence/uniqueness and a dry-run restore.
  F09_SOURCE_SELECTION_INCOMPLETE:
    severity: "HIGH"
    detail: >-
      E44-SOURCE-SELECTION.yaml lists design-reference paths but omits required exact per-path source commit, full Git blob SHA-1 and content SHA-256.
  F10_RECEIPT_INCOMPLETE_OR_FALSE:
    severity: "HIGH"
    detail: >-
      TEST-RUN-RECEIPT.md contains 'tested_tree: Verified different from receipt (to be computed)' and says mutation subprocess execution is left
      to CI, while the workflow does not run the mutation runner. Completion reporting therefore overstates verified evidence.
  F11_P0_SELF_AUDIT_TOO_WEAK:
    severity: "HIGH"
    detail: >-
      Incident #194 QCLAW self-audit ran test_q1.py with baseline/peak/post Python count 1 and reported zero residuals. That is useful but does not
      exercise required child-spawns-grandchildren, root-exits-first, timeout, cancel or Ctrl-C descendant-tree behavior.
  F12_CONTROL_PLANE_DRIFT:
    severity: "HIGH"
    detail: >-
      ACTIVE-QCLAW-TASK and central coordination still say E45 READY/unclaimed with active_pull_request null while PR #195 and a completion signal exist.
      Current control-plane truth must be repaired before successor execution.

strongest_counterpoint: >-
  E45 contains useful semantic scaffolding and its ordinary unit tests do pass. The rejection is not because no work exists; it is because the
  asserted authority, mutation, resource and Provider evidence do not establish the required invariants, and both formal workflow runs are red.

