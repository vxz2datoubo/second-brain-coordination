blocking_findings:
  - id: "E53-CRITICAL-DEEP-MANIFEST-ALIAS"
    severity: "CRITICAL"
    confidence: "HIGH"
    fact: >-
      FinalizedLedger.finalize stores source_identity as a normal nested dict inside an outer MappingProxyType. A normal caller can mutate ledger.coverage_manifest['source_identity']. FinalizedLedger.verify checks only coverage_sha256 and does not recompute source identity, byte length, span count, owner totals, totality, boundaries or evidence verification.
    impact: >-
      Caller-authored nested coverage metadata can remain accepted and can enter a packet canonical body. Packet exposed coverage may diverge from its canonical bytes while packet verification still succeeds.
    required_fix: "Deep-freeze all nested values and fully recompute the complete manifest and packet projections from exact evidence and spans."
  - id: "E53-CRITICAL-FORMAT-OWNERSHIP-REGRESSION"
    severity: "CRITICAL"
    confidence: "HIGH"
    fact: >-
      adapters.py marks the entire JSON document as ATOM_CANDIDATE and every nonblank JSONL line as ATOM_CANDIDATE. Markdown only treats blank lines, headings and literal [REDACTED] as non-atoms; blockquotes, list markers, tables, code fences, code bodies and terminators become atom candidates.
    impact: "JSON keys and structural syntax can be promoted to canonical atoms; Markdown structural content is misowned."
    required_fix: "Restore exact format-specific structural/value ownership with byte-complete coverage and adversarial tests/mutations."
  - id: "E53-HIGH-RELATION-EVIDENCE-DIGEST"
    severity: "HIGH"
    confidence: "HIGH"
    fact: >-
      TypedRelation.evidence_sha256 is assigned the full SourceEvidence SHA-256 rather than SHA-256 of the exact relation evidence slice. Source identity and evidence identity are conflated.
    impact: "Relation evidence does not prove the exact bytes identified by relation.start/end."
    required_fix: "Separate source_sha256 and exact evidence_sha256 and bind both plus exact bytes/span/endpoints/type into relation verification and ID."
  - id: "E53-HIGH-PACKET-NOT-REBUILT"
    severity: "HIGH"
    confidence: "HIGH"
    fact: >-
      CanonicalPacketFactory.verify canonicalizes packet.canonical_json and compares packet ID/source/coverage projections, but it does not reconstruct the body from retained verified atoms, relations, unknowns, conflicts, redaction lineage and validation results.
    impact: "Divergence between the issued graph, exposed projections and canonical bytes is not comprehensively detected."
    required_fix: "Retain immutable finalized graph/snapshots and rebuild the complete canonical body during verify."
  - id: "E53-HIGH-HYGIENE-FINAL-DIFF-ONLY"
    severity: "HIGH"
    confidence: "HIGH"
    fact: >-
      scan_commit_range uses git diff --name-only base..head. It does not enumerate every commit. A generated file added and deleted inside the range can disappear from the final diff and evade the gate.
    impact: "The claimed every-commit history hygiene invariant is not implemented."
    required_fix: "Enumerate all commits and changed paths/tree entries, plus final-tree scan and add-then-delete adversarial coverage."
  - id: "E53-HIGH-MUTATION-COVERAGE-UNDERDELIVERED"
    severity: "HIGH"
    confidence: "HIGH"
    fact: >-
      The production-source mutation harness implements only MUT-UTF8-STRICT, MUT-ATOM-LEDGER and MUT-JSON-NAN. Required mutation classes for manifest aliases, JSON/JSONL ownership, Markdown structures, field provenance, relation evidence/endpoints, packet graph reconstruction, redaction, historical generated files, artifacts and receipt topology are absent as real source mutations.
    impact: "Green tests certify a much narrower surface than the published task contract."
    required_fix: "Implement the full copied-production mutation matrix with exact anchors, nonzero failure and restored-green evidence."
  - id: "E53-MEDIUM-PROVIDER-EVIDENCE-INCOMPLETE"
    severity: "MEDIUM"
    confidence: "HIGH"
    fact: >-
      environment-evidence.json records head, Python, implementation, hash seed and platform but omits the required test count, mutation count, mutation IDs and command/result hashes. Canonical evidence uses only one text fixture.
    impact: "Provider artifacts are deterministic but do not expose the full declared verification surface."
    required_fix: "Add exact counts/IDs/hashes and corrected multi-format authority fixtures before recertification."
  - id: "E53-MEDIUM-RECEIPT-VALIDATOR-WEAK"
    severity: "MEDIUM"
    confidence: "HIGH"
    fact: >-
      validate_receipt_fields checks only nonempty strings and four placeholder words; tests explicitly accept one-character SHA values. It does not validate SHA format, exact task/signal/workflow identities, run bindings or provider object shapes.
    impact: "The reusable topology validator can accept structurally fake receipts."
    required_fix: "Validate exact identifiers, SHA-40, numeric run/job/artifact bindings, allowlist topology and external receipt-head binding schema."
  - id: "E53-MEDIUM-DURATION-MISMATCH"
    severity: "MEDIUM"
    confidence: "HIGH"
    fact: >-
      Plan commit was created at 2026-08-05T16:52:43Z and receipt commit at 2026-08-05T17:26:55Z, an evidence window of about 34 minutes, not the user-requested four-hour substantive engineering run.
    impact: "The requested night-run depth was not achieved; the narrow test/mutation surface confirms under-scoping rather than exceptional completion."
    required_fix: "E54 must earn depth through the complete correction and mutation scope without artificial delay."

