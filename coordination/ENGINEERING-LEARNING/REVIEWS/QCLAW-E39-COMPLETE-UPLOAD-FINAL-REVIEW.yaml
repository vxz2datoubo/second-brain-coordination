    finding: "line_starts and chunk_starts remain mutable List[int] values inside a frozen dataclass. The complete upload did not modify utf8_guard.py after the prior checkpoint."
  - id: "E39-COMPLETE-S0-002"
    severity: "BLOCKING"
    finding: "There is still no explicit legal EOF-exclusive byte-boundary-to-codepoint API. total_bytes is rejected by byte_to_chunk_index and continuation offsets are accepted as containing-codepoint lookups."
  - id: "E39-COMPLETE-S0-003"
    severity: "BLOCKING"
    finding: "No genuine isolated mutation weakens the actual 0xED production scan branch into non-progress. The separate sleeping-process timeout test is not source mutation proof and does not itself kill and join the timed-out child."
  - id: "E39-COMPLETE-S0-004"
    severity: "BLOCKING"
    finding: "Empty input, final LF, final CRLF, repeated terminators and trailing empty-line semantics remain inconsistent between the index and adapters."
  - id: "E39-COMPLETE-COVERAGE-001"
    severity: "BLOCKING"
    finding: "JSON tokenization still skips whitespace without ownership, ignores grammar validation failure and can leave malformed or trailing bytes uncovered instead of UNKNOWN_ERROR."
  - id: "E39-COMPLETE-COVERAGE-002"
    severity: "BLOCKING"
    finding: "JSONL still calls the tokenizer on the entire source buffer at each line_start, allowing cross-line token consumption, duplicate ownership and overlap."
  - id: "E39-COMPLETE-COVERAGE-003"
    severity: "BLOCKING"
    finding: "Conversation adapters still omit colon, separator spaces, blank separators and some terminators, so they do not produce an exact byte partition."
  - id: "E39-COMPLETE-SEMANTICS-001"
    severity: "MAJOR"
    finding: "The seven atom semantic fields mostly remain default containers rather than verified extraction results. Relation extraction returns only externally supplied confirmed relations and does not implement the documented explicit link or parser-structure extraction."
  - id: "E39-COMPLETE-PACKET-001"
    severity: "MAJOR"
    finding: "LearningPacket.to_dict emits counts and coverage metadata rather than the complete atom, relation, unknown, conflict and redaction payload, so the serialized packet is not the promised complete canonical packet."
  - id: "E39-COMPLETE-VALIDATOR-001"
    severity: "BLOCKING"
    finding: "The pre-receipt validators are shallow existence/import tests. Receipt topology is represented by self.assertTrue(True), and placeholder scanning only covers source Python files rather than the manifest, workflow and receipt families."
  - id: "E39-COMPLETE-CI-001"
