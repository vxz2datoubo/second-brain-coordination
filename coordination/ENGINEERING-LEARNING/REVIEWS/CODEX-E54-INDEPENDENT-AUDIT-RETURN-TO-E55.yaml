blocking_findings:
  - id: "E54-B01-SOURCE-EVIDENCE-CONSTRUCTOR"
    severity: "critical"
    confidence: "high"
    finding: >-
      SourceEvidence is a publicly constructible dataclass. An ordinary caller can directly supply bytes, source_id, format_name and a matching digest, bypassing from_bytes admission. verify() only recomputes the digest and does not re-run strict UTF-8, allowed-format, source-id or blocked-content checks.
    consequence: "Invalid or credential/private-key-shaped source bytes can become verified ledger and packet inputs."
    required_correction: "Controlled issuance plus verification that re-runs every source-admission invariant from retained exact bytes."

  - id: "E54-B02-JSON-ESCAPE-OWNERSHIP"
    severity: "high"
    confidence: "high"
    finding: >-
      The JSON scanner marks all raw bytes between value quotes as atom content. Backslashes, escaped quote syntax and Unicode escape syntax are therefore atom-owned rather than structural. Existing tests check surrounding syntax but do not assert escape-byte ownership.
    consequence: "Syntax enters canonical atom evidence and encoded blocked content can bypass raw-marker checks."
    required_correction: "Parser/tokenizer-based raw/decoded mapping with all escape syntax structural and safety checks applied before and after decoding."

  - id: "E54-B03-INCOMPLETE-BLOCKED-CONTENT-POLICY"
    severity: "high"
    confidence: "high"
    finding: >-
      Source admission blocks only a narrow exact generic PRIVATE KEY marker plus ghp_ and sk-. It misses RSA, EC, DSA, OPENSSH, ENCRYPTED key boundaries, partial/truncated boundaries and other encoded/token families.
    consequence: "Private or credential-shaped material can enter a public-safe authority graph."
    required_correction: "Versioned comprehensive raw and decoded admission policy with adversarial partial and encoded cases."

  - id: "E54-B04-UNVERIFIED-PACKET-SUBRECORDS"
    severity: "high"
    confidence: "high"
    finding: >-
      Packet unknowns, conflicts and redaction lineage are arbitrary caller strings, while validation is an arbitrary caller mapping. They are frozen and reserialized but are not factory-issued, evidence-bound or registry-verified records.
    consequence: "A caller can mint canonical validation-pass, conflict, unknown and redaction assertions."
    required_correction: "Typed immutable evidence-bound record factories and registries included in full graph verification."

  - id: "E54-B05-RELATION-STRUCTURAL-EVIDENCE"
    severity: "high"
    confidence: "high"
    finding: >-
      RelationFactory accepts any nonempty source slice. The test and canonical Provider fixture use source byte 0:1, which is the JSON structural delimiter '{', as relation evidence.
    consequence: "Exact hashing is proven, but semantic evidence admission is not."
    required_correction: "Relations must reference a verified admitted evidence record/span; structural punctuation must fail."

  - id: "E54-B06-RECEIPT-ACTUAL-PARENT-NOT-BOUND"
    severity: "critical"
    confidence: "high"
    finding: >-
      verify_final_receipt computes the observed Git parent but never compares it with receipt tested_sha or the external anchor parent. The receipt and external anchor can agree with each other while the actual receipt commit has a different parent.
    consequence: "A receipt built on an untested commit can satisfy the current validator."
    required_correction: "Compare actual Git parent directly to tested_sha and anchor parent, and verify base-plan-tested-receipt ancestry."

  - id: "E54-B07-ARTIFACT-BINDING-SHAPE-ONLY"
    severity: "high"
    confidence: "high"
    finding: >-
      External anchor validation checks positive unique IDs, list lengths and hex digest shape, but does not bind the run to the receipt head/workflow/branch, jobs to the exact matrix, artifact IDs/names to that run, the compare ID as distinct from all job artifacts, or downloaded bytes to recorded digests.
    consequence: "Unrelated or invented artifact metadata can pass the local validator."
    required_correction: "Validate independently fetched run/job/artifact metadata and downloaded artifact bytes."

  - id: "E54-B08-INCOMPLETE-RECEIPT-ROUTE-TOPOLOGY"
    severity: "high"
    confidence: "high"
    finding: >-
      Route epoch is only checked as positive, base/plan/tested SHAs are not tied to observed topology, receipt paths need only be a nonempty subset of the allowlist, and verify_final_receipt does not itself require validate_receipt_fields.
    consequence: "A structurally different route or partial receipt can pass local validation."
    required_correction: "Bind all expected route identities, exact ancestry and exact receipt path set in one fail-closed verifier."

  - id: "E54-B09-HYGIENE-PATTERN-GAPS"
    severity: "high"
    confidence: "high"
    finding: >-
      History hygiene omits .generated, .generated.json, .tmp, .coverage, .pytest_cache and generic artifact directories. Its add-delete test uses generated.db, which is detected by the .db suffix and does not prove generic generated-file detection.
    consequence: "Forbidden transient/generated files can enter and disappear from history undetected."
    required_correction: "Expand patterns and test each distinct class, including merge-parent history where applicable."

  - id: "E54-B10-MUTATION-EVIDENCE-AND-COVERAGE"
    severity: "high"
    confidence: "high"
    finding: >-
      Mutation execution is genuine, but result records omit restoration stdout/stderr hashes, command identity/hash, duration, exact anchor position and counterexample identity. The matrix also omits the source-constructor, JSON escape, packet-subrecord, structural-relation, actual-parent, real artifact-binding and broader hygiene bypasses.
    consequence: "The current mutation certificate does not cover all remaining authority surfaces or satisfy its own reporting gate."
    required_correction: "Expand real mutations and emit complete mutation/restoration evidence."

  - id: "E54-B11-ATTRIBUTION-METADATA-CONFLICT"
    severity: "medium"
    confidence: "medium"
    finding: >-
      The E54 plan commit subject says agent CODEX while GitHub displays 迪迪(WorkBuddy) as author and committer, despite WorkBuddy being recorded paused.
    consequence: "Executor attribution and separation cannot be independently resolved from current public metadata."
    required_correction: "Record whether this is a shared application identity or an execution-boundary violation without accessing private configuration."

