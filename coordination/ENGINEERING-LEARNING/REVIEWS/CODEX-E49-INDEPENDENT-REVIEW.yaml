blocking_findings:
  - id: "E49-FINAL-001"
    severity: "BLOCKING"
    finding: >-
      The final git ancestry predicate is implemented incorrectly. git merge-base --is-ancestor intentionally returns success by exit code with empty stdout, but release_verifier compares captured stdout to the plan SHA. Every valid plan-to-tested ancestry therefore fails with plan_not_ancestor_of_tested.
    required_closure: "Use the subprocess return code as the authority and add a positive end-to-end final-path regression that reaches READY_FOR_INDEPENDENT_REVIEW on a real valid graph."
  - id: "E49-FINAL-002"
    severity: "BLOCKING"
    finding: >-
      Final provider authority remains caller-forgeable. E49ProviderEvidence is populated from an ordinary JSON document and the verifier trusts the magic provider_source value EXTERNAL_READ_ONLY_API plus caller-supplied run, job, artifact and remote-head fields. The implementation does not fetch GitHub provider state itself, verify a signed/immutable provider attestation or require a GPT-main post-run attestation.
    required_closure: "Consume provider facts through a trusted read-only adapter or a GPT-main committed post-run attestation whose source identity and payload digest are independently bound."
  - id: "E49-FINAL-003"
    severity: "BLOCKING"
    finding: >-
      The reproduction validator is textual, not executable. It checks only that receipt text contains the release_verifier module string and tested SHA. It does not parse required arguments or run the command in a clean clone. The published command also depends on an external C:\\temp provider JSON and is not a self-contained clean-clone proof.
    required_closure: "Execute the exact documented command in an ephemeral clean clone/worktree with a trusted materialized provider attestation and require a READY result."
  - id: "E49-FINAL-004"
    severity: "BLOCKING"
    finding: >-
      Receipt schema enforcement is shallow. The validator requires nine standard filenames but does not require or parse PROVIDER-EVIDENCE-TESTED-HEAD.json, validate the structured run/job/artifact identities and digests, or validate meaningful schemas for the remaining receipt documents. Unit fixtures demonstrate that empty JSON and minimal arbitrary strings satisfy most evidence-family checks.
    required_closure: "Define and validate strict schemas for every receipt family and require tested provider evidence as a first-class document."
  - id: "E49-FINAL-005"
    severity: "MAJOR"
    finding: >-
      The thirteen active mutations do not cover the actual final-path ancestry defect, a fully forged EXTERNAL_READ_ONLY_API document, textual-but-unexecutable reproduction commands, missing structured provider evidence or the final completion-signal mismatch.
  - id: "E49-FINAL-006"
    severity: "MAJOR"
    finding: >-
      The AMED receipt completion signal CODEX_BRAINOPS_E49_CRASH_COMPLETE_STAGE_JOURNAL_PROVIDER_RELEASE_EVIDENCE_READY_FOR_GPT_REVIEW does not exactly match the active route completion signal CODEX_BRAINOPS_E49_CRASH_COMPLETE_STAGE_JOURNAL_RELEASE_EVIDENCE_READY_FOR_GPT_REVIEW.

