    area: "PLAN_IDENTITY"
    finding: >-
      TaskLeaseClaim and STATUS.yaml bind plan_commit to 875a728b739af4b1b976b4cab08b28fe6c9a8e14, but that SHA is not resolvable through the repository commit endpoint during independent review. The exact first plan commit identity and one-file topology must be re-derived from the live branch and corrected everywhere before receipt identity can be trusted.
  - id: "E52-S3-BLOCKER-002"
    area: "COMMIT_HYGIENE"
    finding: >-
      The second checkpoint history temporarily committed src/e52_strict_byte/e40_candidate/__pycache__/immutable_index.cpython-313.pyc and later removed it. The final tree is clean, but the route needs a history/source-hygiene gate and .gitignore so generated bytecode cannot re-enter provider artifacts or future commits.
  - id: "E52-S3-BLOCKER-003"
    area: "FINALIZED_LEDGER_IMMUTABILITY"
    finding: >-
      FinalizedLedger stores tuple spans and mapping proxies but does not block assignment to _total_bytes, _spans or _manifest. The finalized ledger object is therefore mutable through normal private-attribute assignment, violating the route's private-state immutability rule.
  - id: "E52-S3-BLOCKER-004"
    area: "ADAPTER_SEMANTICS"
    finding: >-
      TXT and Markdown currently share a generic line adapter that marks every non-empty line ATOM_CANDIDATE and only terminators STRUCTURE. Code fences, fence bodies, headings, lists, tables, blockquotes, blank separators and other required structural identities are not represented. Exact coverage alone is not semantic ownership.
  - id: "E52-S3-BLOCKER-005"
    area: "JSON_ROLE_IDENTITY"
    finding: >-
      JSON grammar is validated, but all quoted strings, including object keys and their quote/escape bytes, are emitted as generic ATOM_CANDIDATE json_string spans. Key/value identity and grammar ownership are not explicit, so automatic atom extraction can turn structural keys into claims.
  - id: "E52-S3-BLOCKER-006"
    area: "SEMANTIC_CONTAINER_IMMUTABILITY"
    finding: >-
      Atom and CanonicalPacket are frozen dataclasses, but their Mapping fields are accepted by reference and remain mutable. Callers can mutate atom.fields, packet.source_identity, redaction_lineage, coverage_manifest, config or validator_results after construction, changing canonical bytes and packet_id through alias mutation.
  - id: "E52-S3-BLOCKER-007"
    area: "ATOM_FIELD_EVIDENCE"
    finding: >-
      extract_claim still assigns all seven fields the same generic UNKNOWN value and reason, with no field-specific source/default rule, evidence span or deterministic extractor. This remains default-only semantics rather than the required seven-field semantic closure.
  - id: "E52-S3-BLOCKER-008"
    area: "ATOM_SOURCE_IDENTITY"
    finding: >-
      extract_claim accepts caller-supplied source_digest without recomputing it from source bytes and does not prove that byte_span is within the source or that the source slice length matches the span. Atom evidence identity is therefore caller-asserted rather than executable.
  - id: "E52-S3-BLOCKER-009"
    area: "RELATION_EVIDENCE"
    finding: >-
      validate_relation checks endpoint presence, compares one caller-supplied digest string and requires a nonempty relation_type. It does not recompute the source digest, verify that evidence.byte_span is in bounds, confirm the span bytes still contain the explicit link, or require relation_type to match RelationEvidenceType. Arbitrary nonempty relation types can pass.
  - id: "E52-S3-BLOCKER-010"
    area: "PACKET_VALIDATION"
    finding: >-
      CanonicalPacket serializes full fields but has no construction/finalization validator. Empty source identity/config, false validator results, inconsistent coverage, relations with missing endpoints, mismatched atom source digests and mutable nested mappings can all be canonicalized as apparently valid packets.
  - id: "E52-S3-BLOCKER-011"
    area: "PRODUCT_MUTATIONS"
    finding: >-
      S4 product validators and copied-production mutation harness have not been committed. Current tests are ordinary unit tests and do not yet prove that each critical gate fails under source mutation and returns green after restoration.
  - id: "E52-S3-BLOCKER-012"
