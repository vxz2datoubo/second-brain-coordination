blocking_findings:
  - id: "E55-BLOCKER-001"
    severity: "S3_CRITICAL"
    title: "ordinary callers can forge issuance authority through mutable factory internals"
    evidence:
      - "SourceAdmissionFactory exposes mutable policy, _seal and _issued attributes."
      - "An ordinary caller can reuse _seal and insert a forged object into _issued, or replace policy with a permissive object, defeating the stated issuance boundary."
      - "Tests access _seal but do not test self-registration, seal reuse, registry substitution or policy replacement."
    required: "Opaque capability, encapsulated immutable policy/registry state and mutations for all ordinary-caller bypasses."
  - id: "E55-BLOCKER-002"
    severity: "S3_CRITICAL"
    title: "text and Markdown format ownership regresses to whole-line atomization"
    evidence:
      - "The non-JSON branch marks every nonblank, non-[REDACTED] line as ATOM_CANDIDATE."
      - "Markdown headings, list markers, blockquotes, fences, code and tables therefore become semantic evidence rather than structural ownership."
      - "The test suite explicitly treats ordinary text and Markdown lines identically and lacks structural-format adversarial cases."
    required: "Versioned format tokenizer with total ownership partition for text, Markdown, JSON and JSONL."
  - id: "E55-BLOCKER-003"
    severity: "S2_MATERIAL"
    title: "escaped JSON values are dropped rather than represented by exact decoded evidence"
