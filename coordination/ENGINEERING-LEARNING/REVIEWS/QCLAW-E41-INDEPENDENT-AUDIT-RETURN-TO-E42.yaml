blocking_findings:
  - id: "E41-BLOCKER-001"
    area: "ATOM_AUTHORITY_AND_IMMUTABILITY"
    finding: >-
      Atom is publicly constructible with caller-supplied atom_id, evidence_layer, confidence, verification_state, source_reference and provenance. Atom.create also accepts HIGH confidence and VERIFIED state without evaluator evidence. validate_atom does not recompute the ID or prove source, confidence or verification authority. Frozen dataclasses retain mutable list aliases such as invalidation_conditions.
  - id: "E41-BLOCKER-002"
    area: "SOURCE_TRACEABILITY"
    finding: >-
      extract() splits on double newlines, strips each paragraph and creates a new SourceSpan around the stripped content with offsets 0..entire-content. Original whitespace, delimiters and offsets are lost. SourceSpan accepts arbitrary ranges and is not bound to an immutable source document or digest, so the claimed exact traceability is false.
  - id: "E41-BLOCKER-003"
    area: "DIGESTED_GRAPH"
    finding: >-
      DigestedSegment and SourceSpan are publicly forgeable; linked_atom_ids is a mutable list; link() accepts arbitrary atom IDs without a verified registry; normalize() performs unbounded string replacement and drops parts of prior state. The complete interpretation/linking graph is not revalidated.
  - id: "E41-BLOCKER-004"
    area: "MASTER_RECORD_AND_DEDUP"
    finding: >-
      compute_object_id hashes the current content, so any revised or conflicting content becomes a different object instead of a new version of one knowledge object. merge_duplicates merges exact text only. Different content creates another master record and does not create a contradiction or version event, contrary to the function documentation and task objective.
  - id: "E41-BLOCKER-005"
    area: "CONTRADICTION_AND_VERSION_GOVERNANCE"
    finding: >-
      classify_conflict auto-labels definition_mismatch or scenario_difference from word-overlap thresholds without evidence. add_version_event does not verify previous_content against the current record or require provenance. prohibit_silent_overwrite stops enforcing once any historical event exists, permitting later unrelated content changes without a new event. Lists and dictionaries remain mutable aliases.
  - id: "E41-BLOCKER-006"
    area: "COGNITION_AND_MEMORY_AUTHORITY"
    finding: >-
      CognitionEntry is publicly constructible with EXPLICIT_USER_FACT and GLOBAL memory. classify_quality trusts caller booleans rather than evidence objects. route_to_memory can treat KNOWN_BUT_UNSTATED as an explicit user fact. validate_memory_route checks only a few combinations and does not prove that the assigned destination equals an evaluator-derived route.
  - id: "E41-BLOCKER-007"
    area: "SKILL_PROMOTION_AUTHORITY"
    finding: >-
      Skill and SkillPromotionGate are caller-authored. A caller can directly construct EXPERIMENTAL and provide fabricated counts/booleans to become FORMAL. Gate fields are not derived from actual test receipts, distinct cases, counterexamples, scope, failure conditions or rollback evidence. Candidate to experimental requires only one arbitrary string. Transition history and replacement identity validation are absent.
  - id: "E41-BLOCKER-008"
    area: "CORPUS_SCHEMA_AND_GROUND_TRUTH"
    finding: >-
      Several expected_atom_types use evidence-layer names that are not members of AtomType, including author_claim, hypothesis and value_judgment. corpus_seed hashes only case ID/type/input and omits all expected outputs and ground truth, so evaluation answers can change without changing the corpus identity. The corpus is not executed end-to-end against a deterministic evaluator.
  - id: "E41-BLOCKER-009"
    area: "MUTATION_PROOF"
    finding: >-
      The seven claimed active mutations are ordinary tests against unmodified production functions. No copied production source is changed, no exact anchor or source hash is recorded, no mutant suite exits nonzero and no pristine restoration reruns green. test_q7 also contains an import-only self.assertTrue(True) and an existence-only workflow test, both explicitly forbidden by the task.
  - id: "E41-BLOCKER-010"
    area: "PROVIDER_WORKFLOW"
    finding: >-
      The workflow lacks an explicit git rev-parse HEAD equality assertion, separated environment evidence, if-no-files-found:error and a canonical semantic evaluation output. It creates source-file inventory text rather than evaluator results. Neither tested nor receipt head has an E41 workflow run; only unrelated Phase 3 integrated offline memory runs are visible.
  - id: "E41-BLOCKER-011"
    area: "PREMATURE_RECEIPT"
    finding: >-
      Receipt 24eed791 was created without required tested-head Provider success, six jobs, six canonical artifacts, environment artifacts or a compare job. No E41 receipt-head Provider run exists. Local assertions of 60/60 and dual-Python consistency are not Provider evidence.
  - id: "E41-BLOCKER-012"
    area: "BOUNDARY_CONTRACT_CONTRADICTION"
    finding: >-
      OVERLAP-EXCLUSION assigns mutation infrastructure, Provider recertification and receipt topology entirely to E54 and declares them outside E41, while the E41 task explicitly requires an E41 mutation harness, Provider workflow and tested/receipt certification. E41 nevertheless implemented all three. The authority boundary is therefore internally contradictory and must be rewritten precisely.
  - id: "E41-BLOCKER-013"
    area: "REPORT_COMPLETENESS"
    finding: >-
      Q8 required exact parents/trees, all commands, exit codes, durations, stream hashes, corpus evaluation outcomes, mutation anchors/restoration and Provider run/job/artifact identities. The three receipt files contain only summary counts and abbreviated commands and do not satisfy the report contract.

