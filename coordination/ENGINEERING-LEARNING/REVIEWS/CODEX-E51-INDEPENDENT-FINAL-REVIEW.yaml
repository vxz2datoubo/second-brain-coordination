nonblocking_findings:
  - id: "E51-FINDING-001"
    severity: "MINOR"
    finding: >-
      The plan-only file was corrected during implementation to state that the frozen argv retains @HEAD and the E50 verifier resolves it, rather than E51 replacing it. This modified the plan document after its plan-only commit. The correction reduced authority and aligned the plan with the routed exact-command requirement, so it is accepted as an explicitly recorded governance deviation rather than a release blocker.
  - id: "E51-FINDING-002"
    severity: "MINOR"
    finding: >-
      Windows pipe output uses CRLF, while the frozen E50 canonical digest was defined over LF. E51 preserves and hashes the raw CRLF bytes, then applies only CRLF-to-LF normalization for canonical comparison. Raw provenance and canonical comparison are both retained; no argv or verifier output was rewritten.
  - id: "E51-FINDING-003"
    severity: "MINOR"
    finding: >-
      GitHub commit metadata for several implementation commits is attributed to the shared WorkBuddy identity while commit messages declare agent CODEX. This is an executor-attribution observability limitation, not evidence that the task scope or provider result is false. Future governance may require agent-specific signing or an external executor identity attestation.
  - id: "E51-FINDING-004"
    severity: "IMPROVEMENT"
    finding: >-
      The frozen E50 internal provider schema still does not require workflow identity or a positive run_id. The canonical E50 and E51 GPT attestations bind the real provider facts, so this remains a future hardening candidate rather than a blocker.

