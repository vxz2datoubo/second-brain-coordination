blocking_findings:
  - id: "E48-FINAL-001"
    severity: "BLOCKING"
    finding: >-
      The durable stage journal does not reconcile every durable partial state after a hard process crash. If a lease mutation succeeds and the process dies before RESPONSE_LOST or the next journal event is written, restart may observe BINDINGS_VERIFIED, CLAIM_MUTATION_APPLIED or LEASE_MUTATION_APPLIED. The current recovery helper advances only RESPONSE_LOST, RECONCILIATION_REQUIRED and RECONCILED, so it can return a positive continuation while leaving the durable journal incomplete.
    evidence_gap: "Tests simulate an applied write followed by an exception, allowing the exception handler to write response-loss metadata; they do not kill the process between the durable record CAS and journal CAS."
    required_closure: "Reconcile all journal-only and record-only partial combinations from actual durable state and prove them with hard process-kill fault injection."
  - id: "E48-FINAL-002"
    severity: "BLOCKING"
    finding: >-
      The product release gate does not implement the task's full provider/release contract. It validates exact local git head, cleanliness, ancestry, path scope, workflow policy and the authority surface, but does not read and bind the active route/task brief, inspect actual completed GitHub runs/jobs/artifacts, invoke receipt topology in its CLI path, scan the final receipt for placeholders/forbidden content, or validate required evidence families.
    proof: "The receipt-head gate returned PRE_EVIDENCE_READY even though the final receipt contains an unresolved receipt_commit_sha placeholder."
  - id: "E48-FINAL-003"
    severity: "BLOCKING"
    finding: "E48/RECEIPT/RECEIPT-MANIFEST.json contains receipt_commit_sha: RESOLVED_MECHANICALLY_AFTER_COMMIT instead of an authoritative identity or an explicit non-self-referential design."
  - id: "E48-FINAL-004"
    severity: "MAJOR"
    finding: "RESEARCH-LEDGER.md publishes non-executable reproduction commands using an incorrect base SHA, obsolete option names and missing required arguments."
  - id: "E48-FINAL-005"
    severity: "MAJOR"
    finding: "TEST-RUN-RECEIPT.json omits the actual provider job IDs, artifact IDs, artifact names and artifact digests that were later verified independently."

