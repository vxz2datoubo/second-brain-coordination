blocking_findings:
  ordinary_caller_registry_bypass:
    severity: "CRITICAL"
    facts:
      - "authority.py stores admission authority in the module-global mutable _ADMISSION_STATES dictionary."
      - "The module also exports _AdmissionState and _IssuedSourceRecord; an ordinary importer can construct a SourceEvidence, insert an issued record into _ADMISSION_STATES[id(admission)].issued and satisfy verify without reflection."
      - "AtomFactory, EvidenceFactory, PacketFactory and RelationFactory expose mutable _issued dictionaries. Public deterministic objects can be constructed and self-inserted before verify."
      - "Existing tests check that the SourceAdmission instance has no policy/_issued/_seal attributes, but do not attack module-global state or the other factory registries."
      - "MUT-ADMISSION-SELF-REGISTRATION changes the missing-record branch to True; it does not execute an actual reachable self-registration attack."
    effect: "E56 did not close the exact ordinary-caller self-registration and registry-substitution blocker inherited from E55."

  packet_and_relation_authority:
    severity: "HIGH"
    facts:
      - "CONFLICT accepts any distinct string beginning with evidence: and does not require the referenced opposing evidence to exist or verify."
      - "VALIDATION accepts a caller-chosen rule_id and PASS/FAIL without a registered evaluator execution receipt."
      - "REDACTION is not bound to an exact redacted source range, and relation evidence can be an unrelated same-source span."
    effect: "Record shapes are improved, but semantic authority is still partly caller-authored."

  raw_decoded_and_format_limits:
    severity: "MEDIUM"
    facts:
      - "SemanticSpan retains raw ranges and decoded text but not a complete per-decoded-character mapping with escaped flags."
      - "JSON number, boolean and null values are never admitted as typed semantic values."
      - "The Markdown tokenizer is a compact heuristic, not a complete versioned grammar; its limits are not represented as typed UNKNOWNs."
    effect: "The claimed complete format-ownership boundary is broader than the verified implementation."

  canonical_and_mutation_coverage:
    severity: "HIGH"
    facts:
      - "Canonical evaluation runs only four primary authority fixtures and therefore remains green while the reachable registry attacks survive."
      - "The mutation set omits module-global admission-state insertion; Atom/Evidence/Packet/Relation registry insertion; nonexistent conflict evidence; caller-declared validation PASS; complete decoded mapping loss; and incomplete receipt external anchoring."
      - "The independent mutation verifier checks declared mutation identities, hashes and exit shapes against the same incomplete registered mutation set."
    effect: "Provider execution is genuine, but its canonical result proves only an incomplete contract."

  receipt_provider_anchor_incomplete:
    severity: "CRITICAL"
    facts:
      - "The committed EXTERNAL-PROVIDER-ANCHOR.json binds only tested run 31110242028 and explicitly leaves receipt_head_provider_state pending."
      - "RUN-RECEIPT.md, FINAL-E56-REPORT.md, STATUS.yaml and UNKNOWN-REGISTRY.yaml all state receipt-head Provider validation or completion remains pending."
      - "Receipt run 31110844386 and its seven jobs/thirteen artifacts exist and are green, but no complete independently downloaded receipt-run archive/inner-byte anchor was published after that run."
      - "The final Issue comment is truncated/corrupted by control-character escapes and omits the receipt run/job/artifact/archive identities and a literal completion signal."
    effect: "Receipt execution credit exists; receipt authority does not."

  external_anchor_schema:
    severity: "HIGH"
    facts:
      - "ExternalProviderAnchor has two run IDs but only one set of six matrix job IDs, one compare job ID and thirteen artifact records."
      - "verify_topology does not prove which evidence set belongs to tested versus receipt run, does not verify exact workflow/branch constants, and does not require compare_job_id to be distinct from matrix IDs."
      - "Topology tests mock Git and cover parent/path linearity, not an actual full-route anchor verification against both public runs."
    effect: "The type cannot represent the two exact Provider evidence sets required by the route contract."

  reporting_consistency:
    severity: "MEDIUM"
    facts:
      - "Public visibility comments corrupt SHAs beginning with be/fd through backspace/form-feed escape sequences."
      - "STATUS.yaml still lists the receipt commit itself as pending after the receipt already exists and reports stale 40/18 counts while TEST-RUN-RECEIPT reports 41/19."
      - "PR body asserts Actual executor: CODEX while public Git author/committer metadata remains inconsistent; E56's own UNKNOWN registry correctly says attribution is unresolved."
    effect: "Independent reviewers cannot treat the self-report as the source of truth."

