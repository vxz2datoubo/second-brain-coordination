      Execute the exact receipt command on a GitHub Windows runner from a separate successor branch without changing E50, preserve the exact remote-head, attestation commit/blob/payload, command array, stdout, stderr, exit code and envelope digest in a provider artifact, and let GPT independently read the run, job, log and artifact.
  - id: "E50-FINAL-002"
    severity: "MAJOR"
    finding: >-
      The committed reproduction command hardcodes C:\\Users\\Administrator\\AppData\\Local\\Temp\\e50-trusted-main-attestation-envelope.json. This was usable on the local executor after a core.longpaths clone retry, but it is Windows-user-specific and not portable. The independent provider run must prove that the exact path can be materialized on windows-latest without changing the receipt command.
  - id: "E50-FINAL-003"
    severity: "MINOR"
    finding: >-
      Internal provider-run validation checks heads, conclusions, positive job/artifact IDs, artifact names, digest shape and expiry, but does not require workflow identity or positive run_id. The GPT attestation contains the real facts, so this is a hardening candidate rather than an E50 code blocker.

