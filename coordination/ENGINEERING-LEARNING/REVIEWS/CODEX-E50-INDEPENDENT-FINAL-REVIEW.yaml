      The final external clean-clone proof exists only as a Codex-authored Issue comment. The claimed stdout hash is internally consistent, but the actual process execution, envelope bytes, clone state and exit code are not independently observable through a GitHub run, job, log or artifact. Under the repository rule that SUCCESS reports are not self-authenticating, final release-gate credit cannot be granted from the report alone.
