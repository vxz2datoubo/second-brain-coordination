blocking_findings:
  - id: "E58-B1-PUBLIC-CALLER-BOOTSTRAPS-TRUSTED-RUNTIME"
    severity: "CRITICAL"
    fact: >-
      e58_runtime.__init__ publicly exports TrustedSemanticExecutor and bootstrap_trusted_runtime. bootstrap_trusted_runtime creates
      TrustedSemanticExecutor(_AuthorityKernel()) with the same public capability_id used by every runtime. Any ordinary caller can
      therefore construct a fresh object explicitly named trusted runtime plus its own verifier and issued receipts. The tests prove
      only that runtime A rejects runtime B's receipts when A's verifier object is already pinned; they do not establish who pins the
      canonical verifier or how a consumer distinguishes the authorized runtime object from an attacker-supplied runtime/verifier.
    consequence: >-
      E58 does not provide the canonical verifier-only authority required for QCLAW E45 or future formal knowledge/memory/skill
      promotion. It is an internally consistent ephemeral pair, not a trusted authority boundary.
  - id: "E58-B2-CALLER-AUTHORED-EVIDENCE-IS-AUTO-VALIDATED"
    severity: "CRITICAL"
    fact: >-
      EvidenceStatement is a public dataclass containing caller-supplied source_id, Proposition and excerpt. TrustedSemanticExecutor
      validate_evidence accepts any EvidenceStatement and issues outcome PASS plus an attested VALIDATION packet. No verified source
      record, raw byte span, ownership digest, source-content hash or source-admission capability is required before semantic evidence
      is validated.
    consequence: >-
      A caller can fabricate source identity, proposition, polarity and excerpt and obtain a valid receipt from the task-local
      executor. This is a regression from the required source-to-semantic authority chain.
  - id: "E58-B3-RELATION-TYPE-REMAINS-CALLER-AUTHORED"
    severity: "MAJOR"
    fact: >-
      issue_relation accepts arbitrary caller relation_type. Its relevance evaluator checks only that both validated atoms share an
      identical subject, then self-issues PASS. Shared subject does not prove a requested relation such as supports, contradicts,
      causes, supersedes or depends-on. No registered relation ontology/rule implementation derives the caller's relation_type.
  - id: "E58-B4-P0-DESCENDANT-TRACKING-FAILS-IN-ACTUAL-FALLBACK-MODE"
    severity: "CRITICAL_LOCAL_SAFETY"
    fact: >-
      OwnedProcessRegistry tracks only direct Popen children in _owned. The user's desktop host returned ERROR_ACCESS_DENIED when
      assigning those children to a nested Windows Job Object, so E58 explicitly used process_group_fallback. In that fallback,
      cleanup calls terminate/kill on the direct Popen object only and never enumerates or terminates descendants/process groups.
      active_count and peak counts therefore exclude grandchildren. A direct child can spawn many Python descendants, exit or be
      terminated, and E58 can still report active_count=0 while descendants remain.
    consequence: >-
      The exact failure mode relevant to the historical 119-Python incident is not controlled or measured. Current zero-orphan
      evidence is zero-direct-child evidence, not zero-descendant evidence.
  - id: "E58-B5-RESOURCE-HARD-CAPS-NOT-FULLY-ENFORCED"
    severity: "MAJOR_LOCAL_SAFETY"
    fact: >-
      ResourceBudget defines max_cpu_bound_workers but spawn does not classify or enforce CPU-bound worker count. There is no shared
      global cross-agent process counter, no project RAM hard-cap enforcement, no minimum-free-RAM enforcement and no sustained CPU
      monitor in OwnedProcessRegistry. The protocol's global and adaptive limits therefore remain policy text rather than runtime gates.
  - id: "E58-B6-P0-ROOT-CAUSE-CLOSURE-NOT-SATISFIED"
    severity: "MAJOR_GOVERNANCE"
    fact: >-
      Issue #194 requires a root-cause category and confidence before incident closure. E58 repeatedly reports
      UNKNOWN_PENDING_INSTRUMENTED_REPRODUCTION and has no historical PID/PPID tree. Despite the route stating P0 investigation
      precedes heavy local execution, E58 subsequently ran the local mutation catalog. The prevention canary is useful, but the P0
      incident completion signal has not been truthfully established.
  - id: "E58-B7-LIFECYCLE-CANARY-OMITS-GRANDCHILD-ORPHAN-ATTACK"
    severity: "MAJOR_LOCAL_SAFETY"
    fact: >-
      test_process_lifecycle covers normal/error/timeout/exception/KeyboardInterrupt for direct child processes only. It has no child
      that deliberately spawns one or more grandchildren, no root-exits-first scenario, no process-group/tree cleanup assertion and
      no cross-agent/global-cap regression. Thus the tests cannot detect E58-B4.
  - id: "E58-B8-MUTATION-CATALOG-OMITS-NEW-CRITICAL-BYPASSES"
    severity: "MAJOR"
    fact: >-
      Seven mutations correspond only to the previous E57 blockers. They do not mutate public trusted-runtime bootstrap, fabricated
      EvidenceStatement source binding, arbitrary relation_type semantics, descendant cleanup, global process caps or CPU/RAM gates.
  - id: "E58-B9-MUTATION-RESTORE-NOT-IN-FINALLY"
    severity: "MATERIAL"
    fact: >-
      run_catalog restores the temporary target after registry.wait returns. The restoration is not inside a finally block. A timeout
      or unexpected exception can skip the explicit restoration step, contrary to the route's required restore-in-finally invariant.
      Temporary-directory deletion still protects the active source tree, so this is not an active-tree corruption claim.

