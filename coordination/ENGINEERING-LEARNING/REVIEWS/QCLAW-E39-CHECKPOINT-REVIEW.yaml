blocking_findings:
  - id: "E39-S0-TIMEOUT-001"
    confidence: "HIGH"
    finding: >-
      with_timeout uses a daemon thread. When the target does not terminate, the caller raises TimeoutError but the worker continues running and cannot be killed. This is not process termination proof and is unsafe for an actual infinite-loop mutation.
    required_correction: >-
      Replace the timeout proof with an isolated subprocess or multiprocessing worker that is forcibly terminated and joined. Record exit status, timeout classification and cleanup proof.
  - id: "E39-S0-MUTATION-002"
    confidence: "HIGH"
    finding: >-
      test_0xED_loop_mutation_detected does not mutate the parser or simulate a non-progressing loop. It only passes a truncated 0xED byte to the already-correct implementation and observes a normal exception.
    required_correction: >-
      Apply an actual isolated mutation that removes cursor progress or rejection for the 0xED branch, execute it under the process timeout gate, observe forced termination/nonzero failure, restore the source and prove green recovery.
  - id: "E39-S0-IMMUTABILITY-003"
    confidence: "HIGH"
    finding: >-
      UTF8ByteIndex is frozen but line_starts and chunk_starts are mutable lists. External callers can modify the finalized index after construction.
    required_correction: >-
      Store immutable tuples or an equivalent immutable representation and add tests proving mutation attempts cannot alter the index.
  - id: "E39-S0-EOF-004"
    confidence: "HIGH"
    finding: >-
      byte_to_chunk_index(total_bytes) is explicitly rejected and no separate API maps the EOF-exclusive byte boundary to codepoint_count. This leaves the required exclusive span-end mapping incomplete.
    required_correction: >-
      Add an explicit byte-boundary-to-codepoint API where total_bytes maps to codepoint_count, while interior continuation bytes remain rejected or are handled by a separately documented containing-codepoint API.
  - id: "E39-S0-LINE-005"
    confidence: "MEDIUM"
    finding: >-
      Final LF/CRLF and empty trailing-line semantics are not explicitly tested; the current line-start loop does not append EOF for a final LF because it requires pos + 1 < total.
    required_correction: >-
      Define and test trailing LF, trailing CRLF, empty input and final empty-line semantics consistently with EOF-exclusive boundaries.

