blocking_findings:
  - id: "E57-B1-CALLER-AUTHORED-EVALUATOR-RECEIPT"
    severity: "CRITICAL"
    fact: >-
      EvaluatorReceipt is a public dataclass. verify_shape checks only nonempty strings and PASS/FAIL. issue_validation accepts any
      caller-created receipt whose input_digest equals evidence.payload_digest. No evaluator registry, execution transcript,
      issued receipt, signature or independently verified run exists.
    consequence: "A caller can manufacture VALIDATION PASS or FAIL while satisfying every current test and mutation."
  - id: "E57-B2-NON-OPPOSING-CONFLICT"
    severity: "MAJOR"
    fact: >-
      issue_conflict proves only that two evidence records are distinct and have different source_record_id values. It does not
      prove that their propositions, polarity, subject, predicate, scope or time are opposed.
    consequence: "Any two unrelated independently sourced facts can be promoted to a CONFLICT packet."
  - id: "E57-B3-CIRCULAR-RELATION-EVIDENCE"
    severity: "MAJOR"
    fact: >-
      issue_evidence accepts endpoint_ids directly from the caller. issue_relation later treats equality with those caller values
      as proof that the evidence is relevant to both endpoints.
    consequence: "Endpoint relevance is self-asserted rather than derived from verified content or evaluator execution."
  - id: "E57-B4-UNVERIFIED-REDACTION-POLICY"
    severity: "MATERIAL"
    fact: >-
      issue_redaction binds a byte range but accepts any nonempty reason_policy_id. There is no registered policy identity,
      policy-version lookup, classification execution or lineage receipt.
  - id: "E57-B5-NO-PUBLIC-VERIFIER-ONLY-CAPABILITY"
    severity: "MAJOR"
    fact: >-
      The implementation documents that consumers should receive records plus a verifier facade, but exposes only
      AuthoritySession, which contains both issuer and verifier connections and a public issue method. A caller may instantiate a
      new session and choose issuer_id. There is no externally distinguishable canonical verifier-only capability.
    consequence: "The claimed service boundary exists as convention, not as a consumable enforced interface."
  - id: "E57-B6-JSONL-WHOLE-SOURCE-OWNERSHIP-INCOMPLETE"
    severity: "MATERIAL"
    fact: >-
      parse_jsonl_ownership strips line terminators, skips blank lines and returns per-line ranges starting at zero. It does not
      preserve global byte offsets or prove a complete partition of the original JSONL byte stream.
  - id: "E57-B7-SURROGATE-EDGE-NOT-CLOSED"
    severity: "MATERIAL"
    fact: >-
      The parser covers a valid surrogate pair but has no explicit isolated-high/low-surrogate policy. A lone surrogate may reach
      canonical UTF-8 encoding and raise an uncaught UnicodeEncodeError rather than a typed UNKNOWN or AuthorityError.
  - id: "E57-B8-MUTATION-COVERAGE-OMITS-REAL-BYPASSES"
    severity: "MAJOR"
    fact: >-
      Current mutations cover receipt input binding, same-source conflict and caller endpoint equality, but not caller-created
      evaluator receipts, unrelated-source conflict, caller-declared endpoint relevance, arbitrary policy IDs, missing verifier
      facade, JSONL global ownership or isolated-surrogate behavior.

