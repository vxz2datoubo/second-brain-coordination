blocking_findings:
  - id: "E40-BLOCKER-001"
    area: "S0_IMMUTABILITY"
    finding: >-
      ByteTruthIndex.__setattr__ catches the AttributeError that it raises for a frozen instance and then calls object.__setattr__, so private state remains writable. The test assigns to the read-only property total_bytes, which fails because the property lacks a setter and therefore does not test the actual immutability gate.
  - id: "E40-BLOCKER-002"
    area: "S0_BOUNDARY_API"
    finding: >-
      The implementation exposes a legal-boundary set and a containing-chunk lookup, but does not expose the required explicit legal byte-boundary to codepoint-index mapping where total_bytes maps to codepoint_count and continuation offsets fail closed.
  - id: "E40-BLOCKER-003"
    area: "S0_REAL_0XED_MUTATION"
    finding: >-
      The 0xED test feeds already-invalid surrogate bytes to the normal implementation and accepts either success or ValueError using assertTrue(True). It does not mutate the actual production 0xED branch into a non-progress loop. Child cleanup is tested on an unrelated sleeping Python process rather than the mutated production scanner.
  - id: "E40-BLOCKER-004"
    area: "S0_LINE_MODEL"
    finding: >-
      line_starts includes EOF after a final terminator and adapters iterate every start, allowing zero-length EOF spans. Empty, final LF, final CRLF, repeated terminators and trailing empty lines are not governed by one explicit line-record API shared by the index and all adapters.
  - id: "E40-BLOCKER-005"
    area: "S1_LEDGER"
    finding: >-
      ByteLedger does not bind spans to ByteTruthIndex legal boundaries and adapters are not integrated into a finalized one-owner ledger. Summing span lengths is insufficient because it does not prove disjoint exact ownership or correct owner class for every byte.
  - id: "E40-BLOCKER-006"
    area: "S1_JSON"
    finding: >-
      The JSON tokenizer does not enforce grammar or literal spelling, accepts invalid escapes, can fail to advance on malformed tokens and labels arbitrary trailing malformed bytes as JSON_WHITESPACE rather than UNKNOWN_ERROR. Object keys are emitted as generic JSON_STRING rather than verified key spans.
  - id: "E40-BLOCKER-007"
    area: "S1_JSONL"
    finding: >-
      JSONL validates or rejects a stripped line but emits the same generic CONTENT span either way, omits blank lines and line terminators, and therefore does not establish exact one-owner coverage or bounded per-line JSON structure.
  - id: "E40-BLOCKER-008"
    area: "S1_CONVERSATION"
    finding: >-
      Structured conversation parsing calculates colon offsets from stripped bytes but applies them to the unstripped line. Leading whitespace can shift the role boundary, and role token, colon, separator spaces, content and terminator are not independently owned as required.
  - id: "E40-BLOCKER-009"
    area: "S2_REDACTION"
    finding: >-
      Production redaction accepts caller-supplied safe_examples that can bypass redaction. RedactionCandidate publicly retains matched_text containing the secret. The private-key pattern misses common headers such as RSA PRIVATE KEY because it expects RSA KEY.
  - id: "E40-BLOCKER-010"
    area: "S3_ATOMS"
    finding: >-
      All seven semantic fields are written as UNSPECIFIED defaults. There are no field value schemas, source/default provenance rules, evidence spans or active mutations proving field semantics.
  - id: "E40-BLOCKER-011"
    area: "S3_RELATIONS"
    finding: >-
      No relation extraction path exists. Relation.is_valid accepts any nonempty evidence string, does not require VALID_EVIDENCE_SOURCES, does not prove that endpoint IDs exist in the atom registry and does not bound confidence.
  - id: "E40-BLOCKER-012"
    area: "S3_PACKET"
    finding: >-
      LearningPacket serializes counts, atom hashes and relation hashes rather than full atom, relation, unknown, conflict, redaction-lineage and coverage content. It remains a counts-and-hashes summary rather than a complete canonical packet.
  - id: "E40-BLOCKER-013"
    area: "S4_VALIDATORS"
    finding: >-
      test_pre_receipt includes import-only checks followed by assertTrue(True), shallow marker scans, workflow existence-only validation and conceptual examples instead of isolated mutations of actual production source. This violates the product-validator contract.
  - id: "E40-BLOCKER-014"
    area: "S5_WORKFLOW"
    finding: >-
      The workflow gates tests on a non-draft pull request while PR #165 remains Draft. The artifact generator references undefined Python names matrix.python and matrix.seed, the upload paths depend on unproven expression substitution, if-no-files-found:error is absent, and no exact event-head assertion is present.
  - id: "E40-BLOCKER-015"
    area: "S5_PROVIDER_EVIDENCE"
    finding: >-
      No independently visible QCLAW E40 pull-request workflow run, six E40 artifacts, compare job, provider job IDs or artifact digests were found at the claimed tested or receipt heads. The only visible pull-request runs at those heads are unrelated Phase 3 integrated offline memory runs.
  - id: "E40-BLOCKER-016"
    area: "S6_RECEIPT"
    finding: >-
      Receipt creation occurred without provider-observable tested-head E40 CI. D05-COMMAND-EVIDENCE.yaml still contains receipt_tree: TO_BE_COMPUTED and abbreviated commands. Only three receipt files exist and provider run/job/artifact facts are absent.
  - id: "E40-BLOCKER-017"
    area: "IDENTITY"
    finding: >-
      The routed completion signal ends with PROVIDER_ARTIFACT_READY_FOR_GPT_REVIEW, while the report and AI_HANDOFF use PROVIDER_ARTIFACT_CI_READY_FOR_GPT_REVIEW. Completion identity is not byte-exact across the route and receipt.
  - id: "E40-BLOCKER-018"
    area: "SOURCE_MANIFEST"
    finding: >-
      SOURCE-MANIFEST records initial byte counts and labels files original, but does not bind every imported candidate to exact source blob identities and is not reconciled with later file sizes or receipt/provider evidence.

