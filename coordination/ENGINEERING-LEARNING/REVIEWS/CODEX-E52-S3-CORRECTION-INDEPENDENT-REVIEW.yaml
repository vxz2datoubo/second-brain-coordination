blocking_findings:
  - id: "E52-S3C-BLOCKER-001"
    severity: "CRITICAL"
    area: "ATOM_PROVENANCE_BYPASS"
    finding: >-
      Atom remains a public dataclass constructor. A caller may directly create Atom with an arbitrary atom_id, fabricated text, any in-range byte_span and a syntactically valid source_digest. Atom.__post_init__ does not recompute atom_id, bind text to source bytes, or prove that evidence_refs describe the source slice. The committed correction tests intentionally construct such manual atoms and accept them.
    required_correction: >-
      Make canonical atom creation factory-controlled or add an immutable SourceEvidence object carrying exact source bytes/index/ledger identity. Atom finalization must recompute source digest, evidence digest, decoded text and deterministic atom_id from the exact source slice. Direct manual construction that cannot prove those facts must fail.
  - id: "E52-S3C-BLOCKER-002"
    severity: "CRITICAL"
    area: "PACKET_SOURCE_BINDING"
    finding: >-
      CanonicalPacket contains only a declared source_identity mapping, not source bytes or a provider-resolvable immutable source evidence object. validate() checks digest shape and byte_length but cannot recompute either. A packet may therefore claim any 64-hex digest and length while carrying fabricated atoms that merely repeat that declaration.
    required_correction: >-
      Packet finalization must receive and freeze exact source evidence or a verified SourceEvidence/ByteTruthIndex identity whose digest and byte length are recomputed. Every atom and relation must be validated against that same evidence before canonical bytes or packet_id are available.
  - id: "E52-S3C-BLOCKER-003"
    severity: "HIGH"
    area: "COVERAGE_MANIFEST_BINDING"
    finding: >-
      Packet coverage validation checks only declared total_bytes and finalized:true. It does not consume a FinalizedLedger, recompute owner-byte totals, verify span_count, detect gaps/overlaps, or bind a coverage digest to the packet source.
    required_correction: >-
      CanonicalPacket must accept a finalized immutable ledger or a verified immutable ledger manifest produced by that ledger. Recompute total bytes, owner totals, span count and a deterministic coverage digest and reject caller-authored coverage mappings.
  - id: "E52-S3C-BLOCKER-004"
    severity: "HIGH"
    area: "FIELD_EVIDENCE_VALUE_BINDING"
    finding: >-
      EXTRACTED semantic fields prove only that an evidence span lies inside the atom span. The field value is not checked against the exact source slice or a declared deterministic extractor, so arbitrary text can be attached to a real span.
    required_correction: >-
      Field evidence must carry a deterministic extractor/rule and evidence digest, and validation must recompute the source slice plus the rule output. Unsupported interpretation remains field-specific UNKNOWN rather than caller-authored EXTRACTED.
  - id: "E52-S3C-BLOCKER-005"
    severity: "HIGH"
    area: "RELATION_ENDPOINT_INHERITED_BYPASS"
    finding: >-
      Relation evidence bytes are now verified, but endpoint Atom objects can still be manually forged while sharing the declared source digest. Relation validation therefore inherits the Atom provenance bypass.
    required_correction: "Only verified/finalized atoms from the same immutable source registry may be admitted as relation endpoints."
  - id: "E52-S3C-BLOCKER-006"
    severity: "MEDIUM"
    area: "HISTORY_HYGIENE"
    finding: >-
      Current-tree hygiene is clean, but an earlier E52 commit introduced __pycache__/immutable_index.cpython-313.pyc. The new hygiene gate scans the current filesystem only and does not detect forbidden paths anywhere in base..head commit history.
    required_correction: >-
      Add a commit-range hygiene validator that inspects every changed path in each E52 commit and records the historical exception. Because history rewrite is forbidden, classify the contaminated checkpoint as quarantined and require any future merge candidate to be produced through a clean selective integration route that never includes the generated blob.
  - id: "E52-S3C-BLOCKER-007"
    severity: "MEDIUM"
    area: "CANONICAL_VALUE_DOMAIN"
    finding: >-
      Canonical nested values permit arbitrary floats, including NaN and infinities, while json.dumps default behavior emits non-standard JSON tokens. This weakens cross-runtime canonical evidence.
    required_correction: "Reject non-finite floats and restrict canonical packet values to a documented deterministic JSON domain."

