    benefit_type: "reliability"
    probability: "high"
    impact: "high"
    causal_basis: "Verifier-valid blocked capsules can safely be supplied as prior_episode_state while terminal identities remain reserved."
    validation_signal: "A valid next action or peer pair executes after each fail-closed malformed declaration episode."
    expected_time_horizon: "short"
  - benefit_id: "B3"
    description: "Prevents Evaluation V2 from learning an accidental distinction between safe rejection and invalid ledger state."
    benefit_type: "cross_module"
    probability: "high"
    impact: "medium"
    causal_basis: "Frozen disposition semantics prevent downstream evaluation from counting expected blocked inputs as verifier failures."
    validation_signal: "Evaluation contracts can classify COMMIT, SETTLEMENT_ABORT, and DECLARATION_ABORT without ambiguity."
    expected_time_horizon: "medium"
  - benefit_id: "B4"
    description: "Creates a reusable public-API postcondition for future D2 branches."
    benefit_type: "long_term"
    probability: "medium"
    impact: "high"
    causal_basis: "No successful API return may contain an episode that the canonical verifier rejects."
    validation_signal: "Branch-complete tests enforce the postcondition across peer and non-peer terminal paths."
    expected_time_horizon: "long"

