    description: "Closes the contradiction between fail-closed event emission and verifier rejection."
    benefit_type: "direct"
    probability: "high"
    impact: "high"
    causal_basis: "A distinct declaration-abort contract lets honest blocked histories pass exact independent validation without weakening forgery detection."
    validation_signal: "Every successful public arbitrate return verifies true, including malformed peer inputs."
    expected_time_horizon: "immediate"
  - benefit_id: "B2"
