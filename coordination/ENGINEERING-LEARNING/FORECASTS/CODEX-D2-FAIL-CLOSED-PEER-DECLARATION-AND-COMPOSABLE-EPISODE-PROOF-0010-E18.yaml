    mitigation: "Bind declaration disposition to immutable action-registry shape, exact deterministic terminal events, zero mutation, zero flow, and reconstructed reasons."
    validation_signal: "Deleted, injected, relabeled, or partially committed histories remain invalid even when hashes are recomputed."
  - harm_id: "H2"
