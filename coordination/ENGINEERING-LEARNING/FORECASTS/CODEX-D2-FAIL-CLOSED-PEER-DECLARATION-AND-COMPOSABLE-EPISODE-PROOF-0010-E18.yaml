first_principles:
  fundamental_goal: >-
    Ensure every public D2 arbitration result is either a verifier-valid immutable episode or a pre-construction explicit rejection that produces no episode.
    A malformed peer declaration must fail closed without creating an internally unreusable or self-contradictory state capsule.
  current_state_to_change: >-
    E17 correctly makes structurally valid peer pairs atomic, but malformed PEER_TO_PEER_TRANSFER declarations are still emitted as BLOCKED events while
    the independent peer-group oracle marks their action registry as incomplete or invalid. The public arbitrate call can therefore return an EpisodeState
    that verify_episode_ledger rejects, and any later call using it as prior_episode_state fails with UNVERIFIABLE_PRIOR_EPISODE_STATE.
  causal_mechanism:
    - "Separate declaration disposition from settlement disposition: malformed declaration, valid-group abort, and valid-group commit are different semantic states."
    - "Bind each disposition to deterministic event membership, zero-mutation rules, identity consumption, and independent verifier rules."
    - "Require successful public API returns to satisfy a verifier-valid composability postcondition."
    - "Exercise every malformed peer-shape branch followed by a valid next step to prove that fail-closed history remains chainable."
  constraints:
    - "Preserve E16 independent reconstruction and E17 atomic settlement semantics."
    - "Research only, synthetic only, candidate only, NO_TRADE."
    - "No D1 changes, real market data, replay, fitting, account, order routing, or trade execution."
    - "Gate B/C/D and Issue #92 remain closed."
  required_evidence:
    - "Executable baseline reproductions showing arbitrate returns a BLOCKED episode that its own verifier rejects for at least lone and malformed two-leg peer declarations."
    - "An explicit declaration-disposition contract and rejected alternatives."
    - "Continuation tests proving the chosen fail-closed result is composable as prior state, or proof that strict pre-construction rejection produces no episode."
    - "Independent forgery tests separating honest malformed-declaration aborts from forged missing/extra/committed peer histories."
  observability_limits:
    - "Internal consistency does not authenticate a wholly replaced root capsule."
    - "Atomic peer-resource effects remain outside this task unless separately authorized."

expected_benefits:
