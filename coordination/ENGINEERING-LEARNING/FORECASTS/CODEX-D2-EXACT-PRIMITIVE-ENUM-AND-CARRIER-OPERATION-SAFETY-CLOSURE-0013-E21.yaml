observed_problem:
  summary: >-
    E20 added a valuable shared structural preflight for arbitrate and verify_episode_ledger, but its primitive and carrier checks rely on isinstance.
    Malicious subclasses of str, int, Enum and accepted dataclass carriers can therefore pass nominal type checks and still execute attacker-controlled
    __hash__, __eq__, __lt__, __le__, __str__, __getattribute__ or Enum.value behavior during set/dict construction, sorting, equality comparison and hashing.
  evidence:
    - "_bounded_text accepts every str subclass; _safe_int accepts every int subclass."
    - "_safe_enum_text_or_none accepts bounded strings for enum fields and accepts any Enum for MarketState.phase and permitted phases."
    - "Both public paths later build sets/dicts, sort identifiers and arrival sequences, compare dataclasses and canonicalize Enum values."
    - "E20 tests use one ordinary explosive object plus list/dict fixtures, but no malicious built-in subclass, carrier subclass or wrong Enum with unsafe value."

expected_benefits:
  - "Make both public trust boundaries total over hostile nominal subtypes, not only plainly wrong outer types."
  - "Freeze one operation-safe primitive and exact-enum contract shared by arbitration and verification."
  - "Prevent accidental RuntimeError, AssertionError, TypeError or AttributeError before intentional rejection."
  - "Preserve E16 reconstruction, E17 atomic settlement, E18 declaration-abort semantics and E20 ordinary malformed-input coverage."

risks:
  - id: "F21-R01-COMPATIBILITY-NARROWING"
    description: "Exact-type checks can reject previously tolerated subclasses or string enum stand-ins."
    control: "Treat public untrusted carriers as closed contracts; document the compatibility boundary and keep semantic valid values unchanged."
  - id: "F21-R02-DUPLICATED-EXACT-TYPE-RULES"
    description: "Ad hoc exact checks can drift between writer and verifier."
    control: "Use one shared operation-safety validator/taxonomy consumed by both entry points."
  - id: "F21-R03-CANONICALIZER-BYPASS"
    description: "Unsafe values may reach _primitive/_canonical through an overlooked nested field."
    control: "Inventory every canonicalized field and add unsupported-value fail-closed tests before hashing."
  - id: "F21-R04-TEST-COUNT-THEATER"
    description: "Large test counts can miss hostile subclass behavior."
    control: "Require explicit executable subclasses for each magic-operation class and verify sentinel methods are never invoked."
  - id: "F21-R05-EVIDENCE-SURFACE-OVERCLAIM"
    description: "Repeated git archive creation may be presented as clean execution evidence."
    control: "Require extraction into three distinct roots, process-level seeds, test execution and exact stdout/stderr/trace hashes."

success_criteria:
  - "No isinstance-only acceptance of untrusted str/int/dataclass subclasses before hash, equality, ordering, attribute access or canonicalization."
  - "Every enum-bearing field accepts only its documented exact enum type or None where allowed; no base Enum wildcard and no text fallback in structural proof."
  - "Malicious str/int/carrier subclasses and wrong Enums fail intentionally without invoking sentinel magic methods."
  - "Both public entry points preserve deterministic first-reason precedence for multi-fault inputs."
  - "At least 148 focused tests pass, including at least 24 new E21 hostile-subclass/enum/carrier regressions."
  - "Three clean Git-archive extractions in distinct roots pass under three pre-start PYTHONHASHSEED values with identical reason-order/semantic trace hashes."
  - "Python 3.11 and 3.13 CI pass."
  - "One substantive tested commit plus one receipt-only commit from bf9c726..., no history rewrite."

rollback:
  strategy: "Revert the E21 substantive and receipt commits together; preserve bf9c726... as the non-accepted E20 candidate base."

boundary: "PUBLIC_SAFE_REMOTE_OUTPUTS / SYNTHETIC_ONLY / CANDIDATE_ONLY / research_only / NO_TRADE"
