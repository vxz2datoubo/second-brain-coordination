schema_version: "1.0"
task_id: "CODEX-BRAINOPS-OBSERVABLE-ONE-SHOT-AUTOMATIC-TRIGGER-CANARY-0031-E36"
route_epoch: 37
forecast_type: "PREMORTEM_AND_ACCEPTANCE_FORECAST"

expected_outcomes:
  best_case:
    - "An official App Automation or supported CLI trigger is independently verified."
    - "One exact canary executes once, writes one receipt, and a repeated event is suppressed without side effects."
    - "Exact tested-head and receipt-head Python 3.11/3.13 CI pass."
  acceptable_blocked_case:
    - "No supported external trigger surface is available or observable."
    - "Capability remains UNKNOWN and the task returns BLOCKED_TRIGGER_SURFACE_UNKNOWN without simulated success."

high_risk_failure_modes:
  - id: "F1_MANUAL_OWNER_MISCLASSIFIED_AS_AUTOMATIC"
    mitigation: "MANUAL_APP must never produce WOULD_DISPATCH."
  - id: "F2_DUPLICATE_EVENT_DOUBLE_DISPATCH"
    mitigation: "Persist event and idempotency identities before the canary effect; prove second observation is side-effect free."
  - id: "F3_BOOLEAN_APPROVAL_REPLAY"
    mitigation: "Bind approval to exact canary, task, epoch, scope, expiry and nonce."
  - id: "F4_EXPIRED_LEASE_NEVER_RELEASED"
    mitigation: "Evaluate expiry deterministically and advance fencing generation monotonically."
  - id: "F5_FAKE_HASH_OR_SECRET_VALUE_PERSISTED"
    mitigation: "Require canonical 64-hex hashes and value-aware secret scanning before SQLite or receipt writes."
  - id: "F6_AUTOMATION_SURFACE_INFERRED_FROM_APP_PRESENCE"
    mitigation: "Desktop package/process presence cannot prove App Automation, schedule or external trigger support."
  - id: "F7_SELF_REVIEW_CLAIM"
    mitigation: "A GitHub marker may request GPT review, but completion cannot claim GPT was automatically invoked unless an independent observable ChatGPT automation run exists."
  - id: "F8_ROUTE_DRIFT"
    mitigation: "Fail if ACTIVE-CODEX-TASK and central coordination disagree on task, epoch, permissions or source head."

acceptance_questions:
  - "What exact supported surface produced the trigger?"
  - "Was the canary approved for this task, epoch, ID, scope and time window?"
  - "Did one and only one public-safe effect occur?"
  - "Did duplicate replay produce zero new commits, PRs or receipts?"
  - "Did the system distinguish review-request marker from actual GPT review execution?"
  - "Are normal automatic dispatch and all non-canary routes still disabled?"

boundary: "LOCAL_FIRST / APP_FIRST / ONE_SHOT_CANARY_ONLY / PUBLIC_SAFE / NO_TRADE"
