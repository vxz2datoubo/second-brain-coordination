schema_version: "1.0"
checklist_id: "CODEX-E53-NIGHT-FINAL-REPORT-CHECKLIST-001"
task_id: "CODEX-NIGHT-CLEAN-SOURCE-BOUND-ATOMIZATION-AUTHORITY-ADVERSARIAL-PROVIDER-AND-RECEIPT-CLOSURE-0049-E53"
required_final_report_fields:
  identity:
    - "issue, PR, branch, mode and completion signal"
    - "base, plan, tested, receipt and current head full SHAs"
    - "parent and tree SHA for each milestone commit"
  scope:
    - "full changed-file list with purpose and provenance"
    - "source-selection ledger with source path/blob/content hashes and disposition"
    - "out-of-scope and generated-file scan results"
  engineering:
    - "architecture decisions, rationale and rejected alternatives"
    - "work-package completion evidence"
    - "unexpected findings, failures, retries and residual unknowns"
  verification:
    - "exact commands, environment, exit codes, test counts, durations and stdout/stderr hashes"
    - "each mutation target, exact replacement, expected gate, observed nonzero result and restored result"
    - "valid/invalid corpus seeds, counts, counterexamples and minimization results"
    - "resource/child-process cleanup evidence"
  provider:
    - "workflow path and identity"
    - "tested-head and receipt-head run IDs/conclusions/head SHAs"
    - "all job IDs, Python versions, seeds, steps and conclusions"
    - "all artifact IDs, names, sizes, digests, expiration and download paths"
    - "independent exact-count and byte-comparison evidence"
  topology:
    - "proof first task commit is plan-only"
    - "proof receipt is one final evidence-only commit"
    - "proof no post-receipt commit"
    - "workspace clean, PR Draft/open/unmerged and no merge authorization"
  governance:
    - "no private config/model changes"
    - "no credentials, accounts, market data or trading"
    - "rollback and clean selective-integration instructions"
  learning:
    - "reusable methods"
    - "invalid assumptions"
    - "failure conditions"
    - "adjacent tasks discovered but not silently executed"
validation_rule: "Missing any applicable field blocks completion."
