first_principles:
  fundamental_goal: >-
    Close the last Gate-A public-API totality gap by ensuring malformed CandidateAction fields are validated before hashing,
    set construction, sorting, order-ID extraction or other field-specific dereference, while preserving E16-E18 ledger semantics.
  current_state_to_change: >-
    E18 correctly records malformed peer declarations as verifier-valid declaration aborts, but _arbitrate_internal still extracts
    action/order/invocation identities before _validate_action. A non-SyntheticOrder value can therefore raise AttributeError at
    action.order.order_id, and malformed unhashable IDs can fail during set construction before the declared fail-closed policy runs.
  causal_mechanism:
    - "Move or redesign structural validation so every dereference and identity extraction has a proven type contract."
    - "Separate pre-construction rejection from terminal fail-closed event semantics and test both as explicit public contracts."
    - "Require a public postcondition matrix across all non-exceptional terminal branches and adversarial malformed-field inputs."
  constraints:
    - "Preserve E16 independent reconstruction, E17 atomic settlement and E18 declaration-abort composability."
    - "Synthetic-only, candidate-only, research_only and NO_TRADE."
    - "No Evaluation V2, real data, replay, backtest, fitting, account, order routing or trade."
  required_evidence:
    - "Executable reproductions for non-SyntheticOrder, unhashable action/invocation/order/transfer identities and invalid arrival values."
    - "Proof that no field is dereferenced, hashed, sorted or inserted into a set before its type contract is established."
    - "Three clean archives, deterministic output and Python 3.11/3.13 CI."
  alternatives_considered:
    - option: "Release Gate B because E18 peer tests pass."
      reason_not_selected: "The public API still has a pre-validation crash path and the E18 receipt overstates the implemented guard."
    - option: "Catch AttributeError broadly around arbitration."
      reason_not_selected: "Broad exception masking would hide the offending field, weaken deterministic semantics and risk partial construction."
  stop_conditions:
    - "Any attempted solution weakens E16-E18 forgery detection or peer atomicity."
    - "Any malformed input creates a partial event/episode before an exception."
    - "Scope expands into Evaluation V2 or downstream gates without GPT acceptance."

