trigger:
  summary: >-
    Epoch 19 correctly identified pre-validation field consumption in arbitrate, but task review before execution found the same class of defect in
    verify_episode_ledger. The verifier confirms only outer dataclass membership before constructing sets and dictionaries from nested identifiers,
    sorting by arrival values, traversing boundaries and invoking reconstruction. Malformed but dataclass-shaped EpisodeState values can therefore
    raise accidental TypeError, AttributeError or comparison errors instead of returning a deterministic invalid verification result.
  evidence:
    - "PR #101 head remains exactly at the E18 receipt base; no E19 substantive commit or completion packet exists."
    - "verify_episode_ledger builds a set from initial_agents[*].agent_id and a dict from action_registry[*].action_id before deep structural validation."
    - "Boundary ordering sorts CandidateAction values by arrival_sequence before proving that every nested field is safe for comparison and registry use."
    - "The verifier is a public trust boundary; Evaluation V2 must not freeze an API where adversarial stored state can crash the verifier."

expected_benefits:
  - "One shared structural-preflight model protects both state creation and state verification."
  - "Malformed CandidateAction input is rejected intentionally before any mutation or identity reservation."
  - "Malformed EpisodeState input yields a deterministic EpisodeLedgerVerification(valid=false) instead of leaking Python runtime exceptions."
  - "Stable reason-code precedence separates malformed structure, semantic invalidity and reconstructed-history forgery."
  - "Evaluation V2 receives a genuinely total public boundary instead of an arbitration-only patch."

possible_harms_and_costs:
  - "A broader preflight layer may duplicate validation logic or accidentally diverge between arbitration and verification."
  - "Changing verifier failure ordering may break tests or downstream consumers that improperly depend on incidental reason ordering."
  - "Overly permissive normalization could launder malformed values into valid-looking identifiers."
  - "A broad exception wrapper could hide implementation defects and create false confidence."

controls:
  - "Prefer shared narrow structural validators with explicit safe-access sequencing."
  - "Do not coerce malformed identifiers to strings or hashable substitutes."
  - "Do not wrap either public entry point in catch-all TypeError/AttributeError handling."
  - "For arbitrate, malformed structure must fail before event, registry, boundary or identity mutation."
  - "For verify_episode_ledger, malformed stored structure must return deterministic invalid reason codes and never mutate input."
  - "Preserve E16 reconstruction, E17 atomic settlement and E18 declaration-abort composability."

success_indicators:
  - "Executable baseline reproductions for both arbitrate and verify paths fail on the old base and pass after repair."
  - "No field is dereferenced, hashed, compared, sorted or used as a key before its required structural contract is proven."
  - "verify_episode_ledger is total over arbitrary Python objects and dataclass-shaped malformed EpisodeState values."
  - "Every returned GameRun contains a verifier-valid EpisodeState."
  - "At least 124 focused tests with at least 32 new dual-entry boundary regressions."
  - "Three clean Git archives and deterministic results across three PYTHONHASHSEED values."
  - "Python 3.11 and 3.13 CI pass."

residual_unknowns:
  - "Root-capsule origin authentication, trusted timestamps and canonical publication remain downstream trust-anchor work."
  - "Atomic peer CLAIM/RELEASE/EXPIRE effects remain NOT_IMPLEMENTED_YET and fail closed."
  - "Evaluation V2, real data, replay, backtest, fitting, account, order routing and trading remain closed."

decision: "PROCEED_WITH_CONTROLS"
