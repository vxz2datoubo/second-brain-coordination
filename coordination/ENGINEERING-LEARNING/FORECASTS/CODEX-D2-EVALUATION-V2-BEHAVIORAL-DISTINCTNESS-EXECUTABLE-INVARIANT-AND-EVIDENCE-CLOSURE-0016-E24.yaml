    Ensure every unit counted by Evaluation V2 corresponds to a genuinely distinct executable behavior and expected relation,
    rather than a distinct author label or unused metadata field.
  causal_mechanism:
    - "Construct the actual public input consumed by execution."
    - "Normalize away identity-only fields while preserving behaviorally consumed fields."
    - "Execute the named predicate and failure oracle for every invariant row."
    - "Derive relation signatures from declared contracts plus observed normalized relations."
    - "Reject duplicate, orphan, unknown and unexecuted rows before coverage credit is granted."
  constraints:
