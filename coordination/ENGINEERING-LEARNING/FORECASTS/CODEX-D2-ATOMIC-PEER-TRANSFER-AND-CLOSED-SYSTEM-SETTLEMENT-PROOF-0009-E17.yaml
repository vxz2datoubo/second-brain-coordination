    benefit_type: "model_risk"
    probability: "high"
    impact: "high"
    causal_basis: "A separate peer-group invariant rejects internally reproducible but semantically invalid histories."
    validation_signal: "Verifier rejects one-legged groups after coordinated event, state and hash recomputation."
  - benefit_id: "B3"
