first_principles:
  fundamental_goal: >-
    Ensure every declared PEER_TO_PEER_TRANSFER is an atomic closed-system settlement:
    either both reciprocal legs commit with exactly offsetting inventory deltas, or both legs
    terminate without inventory mutation. A replayable internally consistent one-legged transfer
    must be impossible.
  current_state_to_change: >-
    E16 independently reconstructs stored events, but the reducer preflights only part of the
    counterpart semantics before executing the first leg. A syntactically valid pair can therefore
    execute one leg while the second later becomes BLOCKED by causal-parent, conflict-resource,
    lifecycle, information, or other terminal conditions; the verifier then faithfully reproduces
    the same invalid one-legged history.
  causal_mechanism:
    - "Resolve peer-transfer groups before mutation and validate both legs against the same pre-state snapshot."
    - "Use an explicit atomic settlement plan or two-phase preflight/commit contract."
    - "Require exactly two reciprocal terminal events with complementary signed deltas for a committed peer transfer."
    - "Add an independent ledger invariant that rejects one-legged, partially committed, or mismatched peer groups even if reducer reconstruction agrees."
  constraints:
    - "SYNTHETIC_ONLY / CANDIDATE_ONLY / research_only / NO_TRADE."
    - "No change to D0, D1, QCLAW, WorkBuddy, Evaluation V2, PR #103 or PR #105."
    - "Preserve E16 independent event reconstruction and terminal identity reservation."
    - "No weakening of existing 54 tests or accepted evidence."
  required_evidence:
    - "Executable baseline reproductions for at least causal-parent and conflict-resource one-legged transfers."
    - "Atomic commit/abort semantics with explicit transfer-group identity and complementary deltas."
    - "Independent verifier rejection of malformed peer settlement groups."
    - "Focused regression suite, clean archives, deterministic traces, allowed-file proof and CI."
  observability_limits:
    - "This proves synthetic ledger atomicity, not real exchange matching, counterparty identity, execution quality, alpha, or profitability."
    - "External origin authentication for a wholly replaced root episode capsule remains a downstream trust-anchor requirement."
  alternatives_considered:
    - option: "Only add a final total_system_accounted assertion in callers."
      reason_not_selected: "The core could still emit and certify an invalid one-legged history; callers must not carry the safety burden."
    - option: "Let the first leg execute and compensate with a synthetic rollback event."
      reason_not_selected: "This expands semantics and permits transient invalid state; atomic preflight and commit is simpler and auditable."
    - option: "Forbid all peer transfers."
      reason_not_selected: "It would avoid the bug but remove an accepted Gate-A capability rather than proving it."
  stop_conditions:
    - "Any proposed solution weakens E16 event reconstruction or trusts stored terminal fields."
    - "Any peer group can produce exactly one inventory-mutating accepted event."
    - "Scope expands into real data, replay, fitting, account, order routing or trade execution."
    - "Implementation requires D1 modification without a new GPT gate."

