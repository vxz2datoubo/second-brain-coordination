    benefit_type: "downstream"
    probability: "high"
    impact: "medium"
    causal_basis: "Evaluation V2 should test stable atomic semantics rather than canonize a reducer flaw."
    validation_signal: "Gate B is released only after atomic settlement evidence is accepted."

