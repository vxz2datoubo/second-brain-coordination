schema_version: "1.0"
task_id: "QCLAW-CODEX-REMOVE-PERSISTENT-MODEL-PIN-AND-RESTORE-USER-SELECTABLE-MODELS-0013-E32"
forecast_difficulty: "D1"

primary_risks:
  - risk: "QQ replaces one persistent pin with another default value."
    mitigation: "Only deletion of proven QQ-owned model/model_reasoning_effort overrides is allowed."
  - risk: "Whole-file TOML rewrite causes unrelated drift."
    mitigation: "Require surgical line removal and byte-level non-drift proof for all other content."
  - risk: "A project, agent, thread, environment or app DB override still pins the model."
    mitigation: "Read-only precedence inventory; no writes outside the proven QQ-owned fields. Report UNKNOWN if another layer controls selection."
  - risk: "QQ uses the user's Terra+xhigh statement as authorization to persist those values."
    mitigation: "Route explicitly classifies Terra+xhigh as a temporary desired profile, not a persistent-default authorization."
  - risk: "Verification clicks or changes the picker on the user's behalf."
    mitigation: "QQ may verify absence of persistent overrides and app startup, but user makes any UI model choice."

success_prediction:
  expected: "The two persistent override fields are absent, Codex reloads, and no unrelated configuration bytes change."
  evidence_needed:
    - "Redacted before/after field presence and file hashes"
    - "Unrelated-byte identity"
    - "Minimal reload result"
    - "Public-safe statement that user model selection is no longer agent-pinned"
