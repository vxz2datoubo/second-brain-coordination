  classification: "E22_REUSABLE_EVALUATION_SCAFFOLD_BUT_GATE_B_FAILS_TRUE_MUTATION_DISTINCT_COVERAGE_METAMORPHIC_VALIDITY_AND_CI_EXECUTION"
  summary: >-
    E22 produced a useful fresh Evaluation V2 package, accepted-core fingerprint lock, independent-accounting scaffold,
    three-commit history and deterministic archive report. Independent review nevertheless found that most registered
    mutants alter already-emitted EpisodeState records instead of mutating executable SUT semantics, the generic
    expected-digest check kills any changed artifact, catalog minimums are inflated by cycling a small number of templates,
    several claimed metamorphic properties are ordinary repetitions or negative tests, and the successful Python 3.11/3.13
    workflow does not execute the E22 entry point.

expected_benefits:
  - "Turn the mutation score from post-hoc record-corruption detection into evidence that tests falsify executable D2 semantic faults."
  - "Replace count theatre with distinct normalized cases, distinct semantic expectations and traceable executable test identities."
  - "Make each metamorphic property compare a real transformed construction against an independently stated relation."
  - "Run the actual Evaluation V2 suite in governed Python 3.11 and 3.13 CI."
  - "Preserve E22's useful independent oracle, accepted-core fingerprint, clean-root reporting and public-safe boundary."

risks:
  - id: "E23-R01-MUTATION-SEAM-COMMON-MODE"
    severity: "HIGH"
    mitigation: "Mutants must change callable SUT behavior through source-derived shadow modules or explicit governed mutation seams; the baseline and mutant run the same fixture and the same specific oracle."
  - id: "E23-R02-DIGEST-TAUTOLOGY"
    severity: "HIGH"
    mitigation: "A generic digest mismatch may be secondary evidence only. Every kill requires a family-specific semantic oracle code that passes on baseline and fails on mutant."
  - id: "E23-R03-CASE-DUPLICATION"
    severity: "HIGH"
    mitigation: "Publish normalized input-signature and expected-relation hashes; duplicate semantic signatures cannot satisfy catalog minimums."
  - id: "E23-R04-WORKFLOW-SCOPE"
    severity: "MEDIUM"
    mitigation: "Authorize only the exact existing workflow file required to invoke the Evaluation V2 runner; no unrelated CI edits."
  - id: "E23-R05-SYNTHETIC-OVERCLAIM"
    severity: "HIGH"
    mitigation: "Keep PUBLIC_SAFE / SYNTHETIC_ONLY / CANDIDATE_ONLY / research_only / NO_TRADE and prohibit performance or market-validity claims."

success_observables:
  - "All eight mandatory mutant families change executable SUT behavior, not merely stored output records."
  - "For every mutant, baseline passes and mutant fails at least one named family-specific oracle; digest-only killing is rejected."
  - "Mutation activation, kill matrix and surviving-mutant inventory are mechanically generated from executions."
  - "Scenario, invariant, negative, episode, counterfactual and cross-family minimums contain no duplicate normalized semantic signatures."
  - "Every catalog row maps to a concrete executable test case or parameterized case ID and an independently stated expected relation."
  - "Eight genuine metamorphic transformations pass and fail under their paired applicable mutants where defined."
  - "The exact E23 runner executes successfully in GitHub Actions on Python 3.11 and Python 3.13."
  - "Three independent Git-archive roots and three process-level seeds produce identical semantic, mutation, metamorphic and reason-order reports."

failure_signals:
  - "A mutant is implemented only by replace() on an emitted EpisodeState or by changing expected_digest."
  - "A mutant is marked killed solely because its normalized digest differs from baseline."
  - "Catalog counts are produced by cycling IDs over the same normalized input and expectation."
  - "A property compares the same execution with itself, has identical baseline/transformed objects without a transformation, or is only an ordinary rejection test."
  - "The CI workflow succeeds without an explicit Evaluation V2 step."
  - "Any placeholder, literal shell variable, guessed SHA, broad success claim or hidden survivor remains."

rollback:
  - "Revert only the E23 corrective and receipt commits on PR #106."
  - "Do not alter accepted Gate A heads, frozen PR #102, PR #103, PR #105 or main production code."

boundary: "PUBLIC_SAFE_REMOTE_OUTPUTS / SYNTHETIC_ONLY / CANDIDATE_ONLY / research_only / NO_TRADE"
