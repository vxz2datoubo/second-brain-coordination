schema_version: "1.0"
task_id: "CODEX-BRAINOPS-CANARY-NONCE-AUTHORITY-AND-ROUTE-PROOF-CLOSURE-0032-E37"
route_epoch: 38
forecast_class: "PRE_EXECUTION_RISK_AND_ACCEPTANCE_FORECAST"

primary_hypothesis: >-
  E36's event/idempotency uniqueness is insufficient for a true one-shot approval because approval nonce reuse is not persisted.
  A separate atomic approval-consumption ledger plus immutable approval and route-state proof will close the remaining pre-canary trust boundary.

expected_changes:
  - "ApprovalEvidence and verified approval-result contracts."
  - "Atomic approval nonce consumption in MetadataStore."
  - "Remote route-state blob/content proof contracts and freshness enforcement."
  - "Adversarial tests and a new E37 CI workflow or an exact scoped extension of E36 CI."

high_risk_failure_modes:
  - id: "R1"
    risk: "Nonce is checked for equality but still not consumed atomically."
    required_test: "Reuse same nonce with different event_id and idempotency_key; exactly one reservation may succeed."
  - id: "R2"
    risk: "Approval verifier trusts a caller-provided boolean or arbitrary approval_ref."
    required_test: "Forged actor/comment/body hash and unverified source must fail."
  - id: "R3"
    risk: "Route proof stores valid-looking hashes without recomputing from Git blob bytes."
    required_test: "Blob SHA/content SHA/path/ref mismatch and caller-only proof must fail."
  - id: "R4"
    risk: "Approval is consumed even when route proof or event reservation fails."
    required_test: "Transaction rollback leaves nonce reusable only after a fully failed transaction."
  - id: "R5"
    risk: "Stale or future route observations are accepted."
    required_test: "Enforce observed_at <= checked_at and the declared maximum age."
  - id: "R6"
    risk: "Raw approval/comment body or secret-like values reach SQLite."
    required_test: "Persist hashes and non-sensitive metadata only; scan stored rows."
  - id: "R7"
    risk: "Task quietly adds a real executor while closing proof contracts."
    required_test: "Static scan forbids subprocess/App/automation dispatch surfaces in E37 changes."

acceptance_forecast:
  must_hold:
    - "No actual canary or automatic dispatch occurs."
    - "Same nonce cannot authorize two distinct event/idempotency pairs."
    - "Approval source is immutable and independently verifiable, not a free-form string."
    - "Both route views are tied to exact remote commit/blob/content identities."
    - "Dual-Python exact-head and receipt-head CI are green."
    - "One tested head plus exactly one evidence-only receipt and no later commit."
  expected_result: "SUCCESS_WITH_PRE_CANARY_SECURITY_CLOSURE"

rollback: "Discard the isolated E37 branch and Draft PR; PR #113 remains immutable."
boundary: "LOCAL_FIRST / APP_FIRST / PRE_CANARY_SECURITY_CLOSURE_ONLY / PUBLIC_SAFE / NO_TRADE"
