schema_version: "1.0"
kind: "ENGINEERING_FORECAST"
task_id: "QCLAW-KNOWLEDGE-ATOMIZATION-SEMANTIC-LOSSLESS-DETERMINISM-SOURCE-LINEAGE-AND-RECEIPT-CLOSURE-0009-E28"
route_epoch: 28
forecast_owner: "GPT"

success_definition:
  - "No source semantics are silently dropped, truncated or mutated."
  - "Canonical packet bytes and identities are reproducible across runtime, root and time variations."
  - "Lineage is independently verifiable from immutable Git objects and exact source spans."
  - "Secret redaction is precise, non-leaking and does not destroy surrounding knowledge."
  - "A real repository knowledge batch is digested with exact-head CI and valid receipt topology."

high_risk_failure_modes:
  - id: "F1"
    risk: "Apparent determinism checks compare only IDs while timestamps and paths still change packet bytes."
    required_countermeasure: "Compare complete canonical packet bytes and hashes across repeated runs, roots, hash seeds and both Python versions."
  - id: "F2"
    risk: "Losslessness is claimed while short headings, code-fence delimiters, malformed UTF-8 or long blocks are dropped/truncated."
    required_countermeasure: "Source-byte accounting, exact spans and adversarial fixtures with explicit zero-loss or fail-closed assertions."
  - id: "F3"
    risk: "Lexical heuristics upgrade opinions or claims into facts and manufacture causal relations."
    required_countermeasure: "Conservative UNKNOWN/CLAIM defaults, source-evidence binding and negative tests for marker spoofing."
  - id: "F4"
    risk: "Redaction removes too much knowledge, misses overlapping secrets, or stores secret-derived fingerprints."
    required_countermeasure: "Span planner, overlap resolution, no secret-derived hashes, before/after semantic checks and mixed-document tests."
  - id: "F5"
    risk: "A self-authored fixture is mislabeled as real knowledge digestion."
    required_countermeasure: "Exact remote commit/blob/source-path manifest for a pre-existing public-safe repository document."
  - id: "F6"
    risk: "Receipt or CI labels hide an empty commit, wrong head or post-receipt correction."
    required_countermeasure: "Remote topology comparison, non-empty evidence allowlist, exact-head jobs and receipt-head validation."
  - id: "F7"
    risk: "QCLAW builds a second memory/retrieval runtime instead of an adapter into canonical contracts."
    required_countermeasure: "Machine-checked forbidden-symbol/path audit and explicit canonical import map."

expected_evidence:
  - "Execution plan and canonical non-duplication inventory."
  - "Source-byte/span conservation report."
  - "Cross-root/cross-runtime canonical byte identity matrix."
  - "Immutable source manifest with commit, blob, path, content hash and spans."
  - "Semantic adversarial matrix and redaction overlap matrix."
  - "Python 3.11/3.13 exact-head CI anchors and three isolated-root artifacts."
  - "Exactly one non-empty evidence-only receipt after final tested head."

stop_conditions:
  - "Any raw or derived authentication/access/financial secret appears in output."
  - "Any source content is silently dropped, truncated or replaced."
  - "Canonical outputs remain path/time/runtime dependent."
  - "Real-source lineage cannot be independently reconstructed."
  - "A second canonical runtime is introduced."
  - "Final topology requires a second receipt or post-receipt correction."
