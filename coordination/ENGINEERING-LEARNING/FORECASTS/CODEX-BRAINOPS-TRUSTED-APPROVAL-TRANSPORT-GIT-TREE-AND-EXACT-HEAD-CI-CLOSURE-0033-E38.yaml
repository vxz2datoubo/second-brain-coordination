schema_version: "1.0"
task_id: "CODEX-BRAINOPS-TRUSTED-APPROVAL-TRANSPORT-GIT-TREE-AND-EXACT-HEAD-CI-CLOSURE-0033-E38"
route_epoch: 39
forecast_type: "pre_execution"

hypothesis: >-
  If E38 removes public verified-result forge paths, derives approval bindings from a strict authoritative comment body,
  independently proves main-ref commit/tree/path/blob/content membership, and checks out the exact PR head in CI,
  then the pre-canary gate can distinguish genuine authority from self-consistent caller fabrications without executing a canary.

expected_positive_evidence:
  - "Only verifier-internal code can create a verified approval or route proof result."
  - "A canonical approval block round-trips to the exact bound approval and authorized actor."
  - "Public unauthenticated GitHub reads establish comment metadata, main ref, commit and two file identities."
  - "Route YAML semantic fields match the active E38 route and frozen automation flags."
  - "CI logs explicitly show HEAD equals github.event.pull_request.head.sha on both Python versions."

expected_negative_evidence:
  - "Direct calls attempting to forge verified result objects fail."
  - "Unrelated comments, body-hash-only wrappers and unauthorized actors fail."
  - "Self-consistent arbitrary bytes not present in the commit tree fail."
  - "Ref drift, redirect abuse, path swap, oversized payload and stale observations fail."
  - "Default pull-request merge checkout fails the exact-head assertion test."

risks:
  - id: R1
    risk: "A nominally private seal remains importable or callable through a public factory."
    mitigation: "Adversarial external-module construction tests and no public verified factory."
  - id: R2
    risk: "Comment parsing accepts duplicate or ambiguous approval bindings."
    mitigation: "Strict JSON/YAML subset, duplicate-key rejection, exact field set and canonical serialization."
  - id: R3
    risk: "Public GitHub transport follows attacker-controlled redirects or accepts mutable mixed snapshots."
    mitigation: "Fixed host/path allowlist, no credentials, redirect restrictions, response limits and ref recheck."
  - id: R4
    risk: "Contents are hash-consistent but not members of the declared commit tree."
    mitigation: "Fetch tree/blob identities from the exact commit and verify path membership."
  - id: R5
    risk: "CI still tests a merge ref while reports label it exact head."
    mitigation: "Explicit head SHA checkout plus hard git rev-parse equality assertion printed in logs."

success_criteria:
  - "All required positive and negative tests pass on exact Python 3.11 and 3.13 head identities."
  - "No canary or dispatch surface is invoked."
  - "One final non-empty evidence-only receipt directly follows the tested head."
  - "No later branch commit exists before GPT review."

failure_classifications:
  trusted_transport_unavailable: "BLOCKED_TRUSTED_TRANSPORT_UNAVAILABLE"
  approval_authority_unresolved: "BLOCKED_APPROVAL_AUTHORITY_UNRESOLVED"
  exact_head_ci_unavailable: "BLOCKED_EXACT_HEAD_CI_UNAVAILABLE"
