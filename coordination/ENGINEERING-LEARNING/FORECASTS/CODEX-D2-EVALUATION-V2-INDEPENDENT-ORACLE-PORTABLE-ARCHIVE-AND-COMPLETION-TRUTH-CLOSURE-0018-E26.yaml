first_principles:
  real_goal: "Make Gate-B evidence independently falsifiable, portable and immutably attributable."
  causal_mechanism:
    - "Direct artifact inspectors prevent same-predicate self-certification."
    - "Actual divergence tests prevent formula/execution provenance drift."
    - "Exact-commit archive runs expose hidden environmental coupling."
    - "Complete process and completion receipts prevent narrative/Git divergence."
  constraints:
    - "Same PR and branch; one tested plus one receipt commit."
    - "Synthetic/public-safe only; no later gates or production authority."
  failure_modes:
    - "Oracle implementation merely copies or calls its predicate."
    - "Archive evidence runs outside the archived tree or against a wrong commit."
    - "CI green without running E26."
    - "Wrong or placeholder external receipt anchor."
    - "Process/difficulty/discovery/coordination sections omitted."
  observability:
    - "Source-level call graph and focused negative tests."
    - "Per-root command/hash matrices and CI logs."
    - "Remote compare and external comments containing exact SHAs."
  alternatives_considered:
    - option: "Accept E25 with a process exception"
      rejected_reason: "Archive and immutable completion evidence are explicit acceptance gates, and three oracles retain a self-verification seam."
    - option: "Create a new evaluator PR"
      rejected_reason: "Would duplicate and discard useful E25 work; bounded correction is lower risk."
    - option: "Use only local Windows archive proof"
      disposition: "Allowed if reliable, but CI Linux proof is preferred as a portable independent path."
  stop_conditions:
    - "Evidence cannot be produced without expanding authority or hiding a failure."
    - "Route/base/path mismatch or S4/D4 risk."

expected_positive_impacts:
  - impact: "Independent controlled-violation evidence"
    signal: "No oracle invokes its paired predicate; mutation tests catch reintroduction."
  - impact: "Portable reproducibility"
    signal: "Three exact-commit archive roots produce identical normalized output and canonical artifact hashes."
  - impact: "Completion freshness"
    signal: "Actual tested and receipt heads match both PR and Issue anchors."
  - impact: "Higher collaboration quality"
    signal: "Complete WPDCR reports difficulty, pivots, discoveries, unresolved problems and exact coordination."

expected_negative_impacts:
  - impact: "Additional CI and receipt complexity"
    severity: "LOW_TO_MODERATE"
    control: "Use one small portable harness and reuse existing canonical report generation."
  - impact: "Longer Gate-B closure"
    severity: "MODERATE"
    control: "Preserve E25 accepted work and limit changes to four identified boundaries."
  - impact: "Potential platform-specific archive differences"
    severity: "MODERATE"
    control: "Normalize only declared nondeterministic fields; compare raw artifacts separately."

execution_cost:
  estimated: "D2_HARD / bounded STANDARD task"
  main_cost_drivers:
    - "Independent oracle refactor and tests"
    - "Portable archive harness and CI"
    - "Cumulative receipt reconstruction"
  opportunity_cost: "Delays Gate C, but prevents accepting a non-reproducible evidence boundary."
  expected_net_value: "HIGH_POSITIVE"

risk_gates:
  - gate: "NO_SCOPE_EXPANSION"
    stop_if: "Production D2, later gates or another Agent's files become necessary."
  - gate: "NO_FALSE_ARCHIVE_PASS"
    stop_if: "Three exact independent roots cannot be proven."
  - gate: "NO_ORACLE_SELF_CERTIFICATION"
    stop_if: "Any oracle depends on the paired predicate verdict."
  - gate: "NO_STALE_ANCHOR"
    stop_if: "External SHA cannot be bound after push."

calibration_requirements:
  compare_expected_to_actual:
    - "Difficulty and iteration deviation"
    - "Unexpected positive/negative findings"
    - "Archive platform effects"
    - "Complexity added versus defects removed"
    - "Coordination requests and closure"
  outcome_classes: [PREDICTION_ERROR, EXECUTION_ERROR, ENVIRONMENT_CHANGE, MEASUREMENT_ERROR, UNKNOWN_UNKNOWN]
