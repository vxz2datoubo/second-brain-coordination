reason: >-
  The task couples byte-level parsing, exact coverage invariants, security redaction lineage, semantic relation truth,
  canonical serialization and multi-version CI artifact comparison. A local green suite is insufficient unless every boundary is independently falsifiable.

expected_high_risk_areas:
  - area: "character_to_byte_conversion"
    risk: "A parser may produce character indexes and accidentally pass them to byte APIs again."
    required_signal: "Mutation tests must fail when any direct character-index-to-byte-span path is introduced."
  - area: "coverage_false_positive"
    risk: "Gap filling, overlap merging or percentage clamping may hide duplicate or missing byte ownership."
    required_signal: "Exact ownership vector or interval validator rejects every overlap, omission and out-of-range span."
  - area: "structured_format_position_truth"
    risk: "Standard JSON object parsing loses duplicate keys and original lexical positions."
    required_signal: "Position-aware tokenizer fixtures preserve duplicate keys, escapes, whitespace, punctuation and ordering."
  - area: "secret_fingerprint_leak"
    risk: "Source or packet hashes may encode secret-bearing original content even when visible text is redacted."
    required_signal: "Secret-bearing fixture proves original-content hashes/fingerprints are omitted and packet remains deterministic from safe material."
  - area: "semantic_relation_false_positive"
    risk: "Type pairing and proximity can silently recreate invented knowledge edges."
    required_signal: "Nearby negative fixtures yield exactly zero relations without an explicit linking rule/evidence span."
  - area: "determinism_fake_success"
    risk: "Equal subprocess failures or same-interpreter runs may be mislabeled cross-version determinism."
    required_signal: "All subprocess return codes are checked and independent 3.11/3.13 artifacts are compared in a separate CI job."

expected_unplanned_findings:
  - "BOM and CRLF handling may expose line/byte off-by-one errors."
  - "Combining characters may reveal invalid assumptions about one visible glyph equaling one codepoint."
  - "Nested JSON and duplicate keys may require a custom tokenizer rather than json.loads."
  - "Redacted-view offsets may require a monotonic segment map rather than a simple list of replacements."
  - "Canonical archive comparison may reveal platform newline, path ordering or JSON separator drift."

acceptance_forecast:
  optimistic: >-
    A clean original-byte tokenizer, exact coverage validator and artifact-based CI close the core E35 failures in one route.
  base: >-
    Byte truth and validators close, while one adapter or cross-version archive edge requires a narrowly scoped successor route.
  pessimistic: >-
    QCLAW reproduces E35-style wrapper tests or approximate parsing; the route must be frozen without semantic credit.

review_focus:
  - "Inspect implementation code, not architecture claims or receipts."
  - "Run adversarial reasoning against multibyte positions, duplicate JSON values, overlap and out-of-range intervals."
  - "Confirm tests call product validators and fail under targeted mutations."
  - "Confirm relation evidence contains an actual linking phrase/rule source."
  - "Confirm packet hash includes all semantic and coverage fields but excludes secret-derived fingerprints."
  - "Verify exact tested/receipt commit CI and artifact identities independently."

promotion_rule: >-
  No result enters the formal knowledge digestion skill or authority master file until byte truth, exact coverage,
