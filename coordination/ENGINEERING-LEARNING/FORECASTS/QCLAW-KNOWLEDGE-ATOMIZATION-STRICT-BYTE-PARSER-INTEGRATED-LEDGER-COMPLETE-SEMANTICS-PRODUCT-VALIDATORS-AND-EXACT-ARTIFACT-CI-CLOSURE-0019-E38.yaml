  - "Exact tested-head remote CI before receipt; exact receipt-head CI after receipt."

expected_evidence:
  - "Plan-only first commit diff containing one plan file."
  - "Timeout-backed mutation logs with nonzero failure for non-progressing parser variants."
  - "Canonical per-format owner ledger artifacts with zero gap/overlap."
  - "Semantic and redaction packet mutation manifests."
  - "Python 3.11/3.13 seed 0/1/777 artifacts and independent byte-compare hash manifest."
  - "Actual tested and receipt workflow run, job and artifact IDs with SHA-256."

stop_conditions:
  - "Any post-receipt implementation commit."
  - "Any inherited E37 CI/test/receipt credit without current exact reproduction."
  - "Any model/provider/reasoning/private-config access or mutation."
  - "Any real secret, account, trade, order, position or funds access."
