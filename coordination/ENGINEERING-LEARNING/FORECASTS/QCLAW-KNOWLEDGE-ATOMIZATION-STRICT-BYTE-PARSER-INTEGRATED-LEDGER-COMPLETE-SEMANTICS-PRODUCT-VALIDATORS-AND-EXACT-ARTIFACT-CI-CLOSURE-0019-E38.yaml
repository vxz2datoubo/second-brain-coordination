primary_success_condition: >-
  A fresh E38 route produces a terminating strict-byte parser, exact integrated owner ledger,
  complete semantic and safety packet, executable validators and successful exact-head artifact CI
  on both tested and receipt heads without inheriting E37 evidence credit.

risk_forecast:
  - risk: "The implementation patches only the 0xED branch while retaining other non-progressing scanners."
    likelihood: "HIGH"
    impact: "BLOCKING"
    early_signal: "No subprocess timeout/property tests over malformed byte corpora."
    required_control: "Monotonic progress assertions, bounded fuzz corpus and process timeout mutations for every parser entry."
  - risk: "JSON remains a token scanner without grammar state or exact ownership."
    likelihood: "HIGH"
    impact: "BLOCKING"
    early_signal: "Unterminated strings, plus-signed numbers or bad commas still yield tokens instead of UNKNOWN_ERROR."
    required_control: "Grammar-validating parser tests with duplicate keys, arbitrary whitespace, escapes and malformed structures."
  - risk: "Ledger is tested independently but not populated by the real adapter pipeline."
    likelihood: "HIGH"
    impact: "BLOCKING"
    early_signal: "Coverage is calculated by summing atom lengths or allows gaps outside validator fixtures."
    required_control: "Single production pipeline that emits and finalizes owners for every byte on every format."
  - risk: "Redaction still stores secret-derived identity or misapplies overlapping mappings."
    likelihood: "MEDIUM_HIGH"
    impact: "BLOCKING"
    early_signal: "Source hash remains in secret-bearing packet or output spans are found by marker search."
    required_control: "Source-order cursor construction, marker-collision fixtures and packet secret-fingerprint validator."
  - risk: "Semantic fields are decorative defaults and omitted from canonical hash."
    likelihood: "HIGH"
    impact: "HIGH"
    early_signal: "Deleting a semantic field leaves packet hash unchanged or all fields are empty strings without evidence state."
    required_control: "Field-source schema, UNKNOWN defaults and deletion mutation proving hash/gate failure."
  - risk: "Relations accept caller-declared evidence labels."
    likelihood: "MEDIUM_HIGH"
    impact: "HIGH"
    early_signal: "`human_confirmation` string alone creates a positive relation."
    required_control: "Verifier-owned evidence records with endpoint/span binding and substitution mutations."
  - risk: "CI appears green but does not prove exact head or cross-version byte identity."
    likelihood: "HIGH"
    impact: "BLOCKING"
    early_signal: "Default checkout, no SHA assertion, no artifact IDs or no independent compare job."
    required_control: "Exact event-head checkout/assertion, matrix artifact upload and independent byte compare manifest."
  - risk: "A receipt is created before provider jobs finish or contains future-state placeholders."
    likelihood: "HIGH"
    impact: "BLOCKING"
    early_signal: "Receipt says pending/next action or lacks actual run/job/artifact IDs."
    required_control: "Repository-backed pre-receipt validator and GPT post-run verification before receipt publication."

validation_priorities:
  - "0xED and malformed UTF-8 termination before all other features."
