success_forecast:
  likely_outcome: "Durable authority and evidence contracts can be implemented without live execution."
  main_uncertainty: "Whether fixed-repository GitHub CAS is sufficient and available for the future runtime without introducing hidden credential or latency assumptions."
  expected_test_growth: "20-40 adversarial tests beyond E40R1."

negative_tests:
  - "New process with empty local database reuses old approval -> must block from durable authority."
  - "Four workers race with separate local stores -> exactly one durable claim."
  - "Claim succeeds then process crashes -> no second invocation; reconciliation reaches terminal/unknown-safe state."
  - "Route remains READY after consumed durable claim -> verifier blocks execution."
  - "selected_owner is set but no invocation receipt exists -> classification is CONTROL_PLANE_CLAIM_ONLY."
  - "Current Codex App session performs work -> classification is CURRENT_CODEX_APP_SESSION_MANUAL_EXECUTION, not App Automation."
  - "Capability adapter unavailable -> UNKNOWN/blocked, never default available."
  - "Old nonce/comment replay -> rejected before side effect."

rollback:
  branch_strategy: "Fresh E41 branch; revert task-owned commits in reverse order."
  runtime_strategy: "No live Canary or external process is invoked, so rollback is repository-only."
  authority_strategy: "Synthetic test namespaces only; no production durable claim objects."
