  - id: "R2_CLAIM_LABEL_MISTAKEN_FOR_REAL_INVOCATION"
    probability: "high"
    impact: "high"
    mitigation: "Use disjoint execution-evidence types and require transport/callback receipts for automatic invocation claims."
  - id: "R3_CRASH_AFTER_CLAIM"
    probability: "medium"
    impact: "high"
    mitigation: "Persist CLAIMED before side effect, then reconcile terminal outcome without permitting replay."
  - id: "R4_STALE_READY_ROUTE_REPLAY"
    probability: "high"
    impact: "critical"
    mitigation: "Durable consumed authority must override stale READY route content; canonical route terminalization must be verified."
  - id: "R5_GITHUB_CAS_RACE_OR_PERMISSION_DEPENDENCY"
    probability: "medium"
    impact: "high"
    mitigation: "Use a fixed repository/ref protocol, exact expected-object CAS, conflict tests and fail-closed handling without exposing credentials."
  - id: "R6_DEFAULT_CAPABILITY_BOOLEAN"
    probability: "high"
    impact: "medium"
    mitigation: "No default true values; capability is evidence-backed, UNKNOWN or blocked."
  - id: "R7_SECOND_CANARY_BY_TEST_OR_DEBUG"
    probability: "medium"
    impact: "critical"
    mitigation: "E41 forbids live App/CLI execution; all tests use synthetic/fake adapters only."
  - id: "R8_MODEL_SETTING_REGRESSION"
    probability: "low"
    impact: "high"
