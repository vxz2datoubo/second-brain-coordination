first_principles:
  real_goal: >-
    Ensure Gate B counts only invariants that can pass on a valid artifact and fail on an
    actually constructed controlled violation, while binding every signature and receipt
    claim to the exact execution and immutable control-plane anchors that produced it.
  causal_mechanism:
    - "Replace boolean-inversion oracle self-certification with executable predicate, violation-constructor and evidence-oracle triples."
    - "Retain exact execution artifacts and derive signatures from those objects, eliminating duplicated constructor formulas and re-execution drift."
    - "Make cumulative ledgers append-only in meaning and publish all mandatory lease/freshness evidence with external receipt anchors."
  constraints:
    - "Same Draft PR #106 and branch; no new PR, merge or history rewrite."
    - "Exactly one corrective substantive tested commit plus one receipt-only commit from 3dd2bf116d018a2dfa132cdbb22de5fd11547d61."
    - "Synthetic-only candidate evaluation; production D2 and later gates remain frozen."
    - "Preserve E24 truthful reduced counts unless new executable evidence justifies a further truthful change."
  key_evidence:
    - "E24 tested head b708dee265278682a2921a91047cae877d6b7ad2 and receipt head 3dd2bf116d018a2dfa132cdbb22de5fd11547d61."
    - "evaluation_v2_harness.py lines 100-107 implement `_invariant_oracle` as registered-ID check plus boolean inversion."
    - "run_evaluation invokes `_invariant_oracle(spec.predicate_id, False)` without constructing a violating artifact."
    - "E24 receipt and AMED execution receipt omit mandatory completion-freshness fields and cumulative evidence was shortened."
    - "GitHub Actions run 30535795631 genuinely ran 35 focused tests on Python 3.11 and 3.13; this is reusable, not sufficient for Gate B acceptance."
  failure_modes:
    - "Violation factories create decorative changes that do not make the named predicate fail."
    - "Failure oracle and predicate share the same trivial boolean and therefore reproduce common-mode error."
    - "Exact execution artifacts are discarded and signature inputs are regenerated from parallel formulas."
    - "Receipt fields are present but not tied to immutable full-SHA anchors or exact command hashes."
    - "Historical negatives and unknowns disappear during cumulative file updates."
  alternatives_considered:
    - option: "Accept E24 because CI is green."
      disposition: "REJECTED"
      reason: "CI executes the current self-certifying test and therefore cannot establish the missing controlled violation semantics."
    - option: "Fix receipts only."
      disposition: "REJECTED"
      reason: "Would leave the central invariant-oracle defect untouched."
    - option: "Replace Evaluation V2 or modify production D2."
      disposition: "PROHIBITED"
      reason: "The defect is bounded to the evaluator and evidence layer."
    - option: "Narrow E25 on the same PR with one tested and one receipt commit."
      disposition: "SELECTED"
      reason: "Preserves reusable E23/E24 work while directly closing the residual correctness and governance defects."

