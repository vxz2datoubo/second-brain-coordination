    - HIGH_QUALITY_REVIEW
    - RECENT_FRONTIER_WORK
    - ADJACENT_TOPIC
    - COUNTEREVIDENCE_OR_FAILURE
    - NEW_TERM
    - ORPHAN_TERM
    - POTENTIAL_METHOD
    - REVALIDATION_TRIGGER
  downstream: "BLUEPRINT-TO-SKILL-GAP-COMPILER-0012"
  forbidden:
    - "automatic Formal Skill promotion"
    - "citation-count-only quality authority"
    - "topic assignment treated as ground truth"

research_to_skill_disposition:
  allowed:
    - EXISTING_SKILL_SUBCAPABILITY
    - CANDIDATE_INDEPENDENT_SKILL
    - REFERENCE_ONLY
    - REJECTED
    - UNKNOWN_NEEDS_RESEARCH
  rule: "No material method or theory may remain as an untyped name in a blueprint."

explanation_policy:
  KNOWN_SAID:
    - "Prefer delta, edge cases, counterexamples, composition and new information over repeating definitions."
  KNOWN_UNSAID_INFERRED:
    - "Use a short verification bridge before relying on the inference."
    - "Do not overteach unless evidence weakens."
  UNKNOWN_BUT_ACCESSIBLE:
    - "Bridge from already evidenced concepts, then introduce the professional term."
    - "Use one low-cost probe when material."
  UNKNOWN_REQUIRES_SCAFFOLDING:
    - "Expose the minimal prerequisite path."
    - "Use staged examples or visual/analogy aids without converting analogy to evidence."
    - "Re-evaluate after each scaffold."

financial_regime_policy:
  ontology_adapter: FIBO
  required_distinctions:
    - HISTORICALLY_KNOWN
    - CURRENTLY_VALIDATED
    - REVALIDATION_REQUIRED
  research_validation_links:
    - "White Reality Check"
    - "Probability of Backtest Overfitting"
    - "Regime Change / Drift"
  invariants:
    - "User understanding of a financial method is separate from current market validity."
    - "Historical backtest success cannot promote current applicability without regime and point-in-time validation."
    - "NO_TRADE boundary remains active."

safety_and_profile_boundaries:
  forbidden:
    - "Sensitive personal-trait inference from cognitive bands."
    - "Global intelligence score."
    - "Permanent personality judgment from a topic-specific gap."
    - "Political, religious, health or other sensitive profile inference."
    - "Cross-user or cross-project evidence leakage."
    - "Private raw evidence copied into public coordination artifacts."
  required:
    - "topic/domain scope"
    - "time version"
    - "evidence provenance"
    - "user correction path"
    - "invalidation conditions"

adversarial_cases:
  - id: EKM-ADV-01
    story: "No prior conversation about a concept."
    expected: "UNOBSERVED or ABSTAIN, not forced UNKNOWN_TO_USER."
  - id: EKM-ADV-02
    story: "Embedding similarity to concepts the user knows but no performance evidence."
    expected: "candidate retrieval only; cannot become KNOWN_UNSAID_INFERRED."
  - id: EKM-ADV-03
    story: "User explicitly corrects an inferred mastery claim."
    expected: "current projection follows correction; historical inference evidence remains traceable."
  - id: EKM-ADV-04
    story: "Strong financial knowledge in one domain, novel medical domain query."
    expected: "cross-domain transfer is candidate-only and requires validation."
  - id: EKM-ADV-05
    story: "Old API knowledge after breaking version change."
    expected: "historical mastery retained; current validity becomes REVALIDATION_REQUIRED."
  - id: EKM-ADV-06
    story: "ESCO and O*NET labels are similar but not semantically identical."
    expected: "CLOSE_MATCH/crosswalk, no identity merge."
  - id: EKM-ADV-07
    story: "New paper has high citations but conflicts with stronger evidence."
    expected: "evidence candidate with conflict; no skill promotion."
  - id: EKM-ADV-08
    story: "One failed answer on an advanced subtopic."
    expected: "local evidence update only; no whole-domain mastery collapse."
  - id: EKM-ADV-09
    story: "Prerequisite graph has a cycle."
    expected: "CYCLIC_OR_INVALID and fail closed for frontier recommendation."
  - id: EKM-ADV-10
    story: "User knows a method but method health is DEGRADED in current market regime."
    expected: "cognitive state may remain known while method selection is blocked/revalidated."

