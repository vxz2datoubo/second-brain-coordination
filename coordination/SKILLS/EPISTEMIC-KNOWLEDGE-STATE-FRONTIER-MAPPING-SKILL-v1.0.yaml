schema_version: "1.0"
skill_id: "EPISTEMIC-KNOWLEDGE-STATE-AND-FRONTIER-MAPPING-SKILL-0013"
module_id: "EPISTEMIC-KNOWLEDGE-STATE-FRONTIER-MAPPING-0013"
name: "Epistemic Knowledge-State and Frontier Mapping"
status: "CANDIDATE_ARCHITECTURE / NOT_FORMAL_SKILL"
implementation_issue: 457
owner: "USER"
architecture_owner: "GPT"
boundary: "ARCHITECTURE_CONTRACT_EVAL_ONLY / NO_SECOND_KNOWLEDGE_AUTHORITY / NO_TRADE"

canonical_reuse:
  knowledge_memory_truth_owner: "W3_SECOND_BRAIN"
  personal_cognitive_model_owner: "PERSONAL-EPISTEMIC-COGNITIVE-OPERATING-SYSTEM-0010"
  formal_skill_truth_owner: "EXISTING_FORMAL_SKILL_GOVERNANCE"
  method_memory_owner: "W3_SECOND_BRAIN"
  decision_episode_owner: "EXISTING_DECISION_EPISODE_GOVERNANCE"
  method_router: "ISSUE_312_METHOD_DISCOVERY_META_REASONING"
  gap_compiler: "BLUEPRINT-TO-SKILL-GAP-COMPILER-0012"
  no_new_memory_runtime: true
  no_new_knowledge_graph_authority: true
  no_new_personal_profile_authority: true
  no_new_skill_authority: true

purpose:
  - "Project a bounded, evidence-backed cognitive state for one user-scope x concept x domain x context x valid-time tuple."
  - "Distinguish what the user explicitly expressed, what is cautiously inferred, what appears directly learnable, and what currently requires scaffolding."
  - "Connect cognitive state to prerequisites, methods, skills, evidence, external standards, research sources, temporal validity, failure modes and next-frontier actions."
  - "Adapt explanation and research depth without changing underlying canonical facts."
  - "Preserve UNKNOWN, UNOBSERVED and ABSTAIN when evidence is insufficient."

when_to_use:
  - "A complex answer materially benefits from knowing what the user already expressed or demonstrated."
  - "A new concept can be connected to existing mastered concepts or prerequisite gaps."
  - "The system must decide explanation depth, whether to probe, or whether additional evidence has value."
  - "A blueprint, paper, standard, institution framework or new term must be mapped to existing methods/skills before new skill creation."
  - "A technical, policy, financial or market concept may be stale and requires current-validity separation from historical knowledge."
  - "Cross-domain transfer is proposed and needs evidence rather than assumption."

when_not_to_use:
  - "Simple low-risk one-shot factual answer where personal cognitive state cannot materially improve correctness or utility."
  - "There is no authorized user/project/privacy scope for the evidence."
  - "The requested inference would require sensitive personal-trait classification."
  - "A domain runtime already owns the canonical decision and this skill would create a second authority."
  - "Only topic or embedding similarity exists with no evidence/prerequisite support."

cognitive_bands:
  KNOWN_SAID:
    meaning: "Direct evidence exists that the user explicitly stated, confirmed, corrected, authored or directly demonstrated the concept in a measurement-relevant task."
    does_not_mean:
      - "CALIBRATED_MASTERY"
      - "current domain validity"
      - "formal skill competence"
  KNOWN_UNSAID_INFERRED:
    meaning: "The user did not explicitly state the concept, but bounded evidence supports a domain/context-scoped inference of likely knowledge or usable prerequisite structure."
    required:
      - "no conflicting user explicit/correction evidence"
      - "traceable performance, repeated-behavioral, transfer or strong prerequisite evidence"
      - "bounded domain_scope and context_scope"
      - "confidence at policy threshold"
      - "inference provenance"
    forbidden_sources_as_sole_basis:
      - "embedding similarity"
      - "topic similarity"
      - "single adjacent concept"
      - "assistant intuition"
  UNKNOWN_BUT_ACCESSIBLE:
    meaning: "No sufficient evidence establishes current mastery, but prerequisite coverage and explanation compatibility indicate low-scaffolding learnability or easy verification."
    invariant: "THIS_IS_NOT_A_CLAIM_THAT_THE_USER_DOES_NOT_KNOW_THE_CONCEPT"
  UNKNOWN_REQUIRES_SCAFFOLDING:
    meaning: "Current evidence indicates that prerequisite, terminology, domain, tool/data, freshness or complexity gaps must be resolved before direct explanation/application is likely to be reliable."
    invariant: "THIS_IS_NOT_A_GLOBAL_INTELLIGENCE_OR_PERSONALITY_JUDGMENT"

unclassified_outcomes:
  - UNOBSERVED
  - UNKNOWN
  - ABSTAIN
  - SCOPE_FORBIDDEN
  - REVALIDATION_REQUIRED

mastery_authority:
  source: "PEOS_EXISTING_MASTERY_LADDER"
  values:
    - UNKNOWN
    - HEARD_OF
    - RECOGNIZES
    - CAN_EXPLAIN
    - CAN_APPLY_WITH_SUPPORT
    - CAN_APPLY_INDEPENDENTLY
    - CAN_TRANSFER
    - CAN_CRITIQUE
    - CAN_TEACH
    - CALIBRATED_MASTERY
  rule: "cognitive_band and mastery_level are orthogonal; this skill cannot create a second mastery ladder"

state_key:
  required:
    - user_scope
    - concept_ref
    - domain_scope
    - context_scope
    - valid_time
    - projection_version

EpistemicStateProjection_v1:
  required:
    - schema_version
    - projection_id
    - user_scope
    - concept_ref
    - domain_scope
    - context_scope
    - valid_time
    - cognitive_band
    - mastery_level
    - evidence_modes
    - confidence
    - calibration_status
    - prerequisite_coverage
    - comprehension_readiness
    - supporting_refs
    - opposing_refs
    - user_correction_refs
    - freshness_status
    - unknown_type
    - explanation_bridge_refs
    - invalidation_conditions
    - provenance_refs
    - created_at
  fields:
    schema_version: {const: "EpistemicStateProjection/v1"}
    projection_id: {type: string}
    user_scope: {type: string}
    concept_ref: {type: string}
    domain_scope: {type: array, items: {type: string}, minItems: 1}
    context_scope: {type: array, items: {type: string}, minItems: 1}
    valid_time: {type: string}
    cognitive_band:
      enum: [KNOWN_SAID, KNOWN_UNSAID_INFERRED, UNKNOWN_BUT_ACCESSIBLE, UNKNOWN_REQUIRES_SCAFFOLDING, UNOBSERVED, UNKNOWN, ABSTAIN, REVALIDATION_REQUIRED]
    mastery_level: {type: string}
    evidence_modes:
      type: array
      items:
        enum: [USER_EXPLICIT, USER_CORRECTION, USER_AUTHORED_ARTIFACT, DIRECT_TASK_DEMONSTRATION, REPEATED_BEHAVIORAL_EVIDENCE, CROSS_CONTEXT_TRANSFER_EVIDENCE, PREREQUISITE_INFERENCE, MODEL_INFERENCE, UNOBSERVED, UNKNOWN]
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    confidence_basis: {type: array, items: {type: string}}
    calibration_status: {enum: [CALIBRATED, PARTIAL, UNCALIBRATED, REVALIDATION_REQUIRED, UNKNOWN]}
    prerequisite_coverage: {enum: [COMPLETE, SUFFICIENT, PARTIAL, MISSING, CYCLIC_OR_INVALID, UNKNOWN]}
    comprehension_readiness: {enum: [DIRECT, LIGHT_BRIDGE, SCAFFOLDING_REQUIRED, TOOL_OR_DATA_REQUIRED, REVALIDATION_REQUIRED, UNKNOWN]}
    supporting_refs: {type: array, items: {type: string}}
    opposing_refs: {type: array, items: {type: string}}
    user_correction_refs: {type: array, items: {type: string}}
    freshness_status: {enum: [CURRENT, HISTORICAL, STALE, REVALIDATION_REQUIRED, SUPERSEDED, RETRACTED, DRIFT_DETECTED, UNKNOWN]}
    unknown_type: {type: [string, "null"]}
    explanation_bridge_refs: {type: array, items: {type: string}}
    invalidation_conditions: {type: array, items: {type: string}}
    provenance_refs: {type: array, items: {type: string}, minItems: 1}
    created_at: {type: string}
  invariants:
    - "USER_CORRECTION must outrank conflicting derived inference."
    - "KNOWN_UNSAID_INFERRED must never be represented as USER_EXPLICIT."
    - "UNKNOWN_BUT_ACCESSIBLE does not imply UNKNOWN_TO_USER."
    - "UNOBSERVED must remain available when absence of evidence is the material fact."
    - "No cross-domain mastery transfer without explicit transfer evidence or bounded candidate status."
    - "Stale or superseded evidence cannot alone authorize CURRENT state."
    - "Projection is rebuildable and non-authoritative."

EvidencePriority_v1:
  order:
    - USER_CORRECTION
    - USER_EXPLICIT
    - USER_AUTHORED_ARTIFACT
    - DIRECT_TASK_DEMONSTRATION
    - REPEATED_BEHAVIORAL_EVIDENCE
    - CROSS_CONTEXT_TRANSFER_EVIDENCE
    - PREREQUISITE_INFERENCE
    - MODEL_INFERENCE
    - PURE_SIMILARITY
  rules:
    - "PURE_SIMILARITY can discover candidates but cannot grant KNOWN_UNSAID_INFERRED."
    - "Higher-priority evidence does not erase lower-priority historical evidence; it changes current projection."

