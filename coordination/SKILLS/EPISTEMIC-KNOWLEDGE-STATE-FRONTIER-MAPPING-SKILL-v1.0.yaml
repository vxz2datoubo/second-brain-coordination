        - TERMINOLOGY_BRIDGE
        - CONCRETE_EXAMPLE
        - VISUAL_OR_ANALOGY_BRIDGE
        - TOOL_LITERACY
        - DATA_LITERACY
        - DOMAIN_CONTEXT
        - FRESHNESS_REVALIDATION
        - EVIDENCE_GAP
  rules:
    - "Analogy may explain but is non-evidentiary unless separately supported."
    - "Frontier ranking cannot change canonical knowledge or skill truth."

