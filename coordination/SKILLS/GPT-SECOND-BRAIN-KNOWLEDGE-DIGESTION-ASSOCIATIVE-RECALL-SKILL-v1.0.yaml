    - "Every atom must resolve back to at least one source span or explicit evidence pointer."
    - "Reusing a source identity with changed content must be revisioned or content-hash-distinct."
    - "Use W3C PROV-inspired Entity/Activity/Agent semantics where useful without requiring RDF/OWL as physical storage."

