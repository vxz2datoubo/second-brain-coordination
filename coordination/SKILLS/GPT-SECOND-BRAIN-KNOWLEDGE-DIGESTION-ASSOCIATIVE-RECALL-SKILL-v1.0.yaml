  engineering_implementation: "CODEX"
  qclaw_role: "OPTIONAL_BATCH_BACKFILL_AND_INDEX_MAINTENANCE_NOT_RUNTIME_REQUIRED"

root_goal: >-
  Make GPT the owner's primary conversational knowledge-ingestion and associative-recall interface. The owner can send a passage, article,
  research finding, case, rule, experience, conversation insight or correction; GPT must faithfully digest it into traceable atomic knowledge,
  reconcile it with existing second-brain knowledge before writing, preserve conflicts and provenance, and later proactively retrieve and use the
  resulting knowledge or memory when it materially improves work, research, decision support or ordinary conversation. QCLAW/QQ must not be a
  required runtime dependency.

truth_boundary:
  - "This skill does not modify GPT model weights or fine-tune the foundation model."
  - "Operational 'becomes part of GPT's brain' means durable external memory plus mandatory retrieval, context assembly, reasoning use and feedback loops."
  - "No claim of durable write is allowed unless the canonical/private store write and post-write recall verification actually pass."
  - "GitHub coordination files contain contracts, schemas, tests and aggregate receipts only; raw private semantic memory must remain in the authorized private store."
  - "ChatGPT native saved memory and chat history are auxiliary context, not the canonical second-brain authority."

canonical_dependencies:
  second_brain_repository: "vxz2datoubo/second-brain-coordination"
  canonical_memory_runtime: "PHASE-3-INTEGRATED-OFFLINE-MEMORY / W3 MemoryStore"
  conversational_memory_program: "CLTM-0021"
  current_memory_palace_dependency:
    implementation_pr: 280
    hardening_route_epoch: 109
    status: "ACCEPTED_AND_MERGED_2026-08-14"
    acceptance_evidence:
      - "focused/adversarial Memory Palace: 27/27 PASS"
      - "full Phase 3 synthetic regression: 246/246 PASS"
      - "public safety: PASS, 72 files, 0 issues"
      - "GitHub Actions exact-head run: Python 3.11 and 3.13 both PASS"
    completed_required_behaviors:
      - "bitemporal claim-validity versus event-time separation"
      - "temporal retrieval confidence gate"
      - "general multi-atom capture"
      - "structured owner-stance target identity"
      - "typed conflict discipline"
      - "content-bound provenance"
      - "domain-aware freshness policy"
      - "pairwise schedule-conflict/non-overlap hardening"
    successor_activation_pr: 286
    successor_activation_status: "MERGED_2026-08-14"
  generic_methodology_integration:
    blueprint_pr: 448
    blueprint_path: "coordination/BLUEPRINTS/SECOND-BRAIN-GENERIC-METHODOLOGY-ENTERPRISE-INTEGRATION-BLUEPRINT-v1.0.md"
    status: "PROPOSED_DRAFT_AWAITING_REVIEW"
    scope: "9 PKM methodology gaps mapped as annotation/derivation/rendering layers atop W3; no new canonical authority"
  system_of_record_rule: >-
    Reuse one canonical W3/CLTM memory and knowledge runtime. Search indexes, embeddings, graph projections, summaries and palace placements are
    rebuildable projections and must not become competing canonical truth stores.

non_goals:
  - "Do not create a second QQ/QCLAW-compatible canonical knowledge database."
  - "Do not treat vector chunks as canonical knowledge atoms."
  - "Do not convert user opinion, author opinion or model inference into objective fact."
  - "Do not silently overwrite contradictory or superseded history."
  - "Do not treat semantic similarity as evidence of truth or present applicability."
  - "Do not promote a knowledge atom into a validated skill solely because it sounds useful."
  - "Do not query the entire knowledge base before every trivial chat turn."
  - "Do not let unrelated project/private memories bleed across scope boundaries."
  - "Do not persist passwords, API keys, tokens, cookies, private keys, MFA/recovery codes or other live credentials."
  - "Do not generate trading orders or bypass existing A-share risk/validation gates."

owner_cognitive_mapping:
  states:
    KNOWN_SAID:
      definition: "Owner demonstrably knows and explicitly stated it."
      evidence_requirement: "Direct owner source span or explicit confirmation."
      use: "May be used as established owner knowledge within temporal/scope validity."
    KNOWN_UNSAID_INFERRED:
      definition: "High-probability owner knowledge, constraint or mental model inferred from behavior/context but not explicitly stated."
      evidence_requirement: "Multiple convergent clues or strong contextual inference."
      use: "Use as labeled inference only; never rewrite as owner assertion."
    UNKNOWN_BUT_ACCESSIBLE:
      definition: "Owner has not demonstrated the concept but can probably understand it with a short bridge from known concepts."
      evidence_requirement: "Topic-specific gap plus known prerequisite bridge."
      use: "Teach by connecting to KNOWN_SAID/KNOWN_UNSAID concepts."
    UNKNOWN_REQUIRES_SCAFFOLDING:
      definition: "Concept needs prerequisites, staged explanation, examples, analogy, formal model or tooling."
      evidence_requirement: "Missing prerequisite chain or repeated comprehension failure."
      use: "Store prerequisite graph and teaching route; never make a global intelligence judgment."
  rules:
    - "Cognitive state is topic-specific and time-versioned."
    - "Low-confidence inferred states cannot overwrite explicit owner evidence."
    - "New owner correction updates the current cognitive map append-preservingly."

input_modes:
  ANALYZE_ONLY:
    trigger: "User asks to explain/analyze without durable capture intent."
    persistence: "NONE unless another explicit durable-memory rule applies."
  DIGEST_KNOWLEDGE:
    trigger_examples: ["消化这个", "录入知识", "把这个学进去", "加入第二大脑", "这个知识记录一下"]
    persistence: "KNOWLEDGE_CANDIDATE"
  CAPTURE_MEMORY:
    trigger_examples: ["采集记忆", "数据采集", "记住这件事"]
    persistence: "MEMORY_CANDIDATE"
  DIGEST_AND_MEMORY:
    trigger: "One source contains both reusable domain knowledge and owner-specific durable memory."
    persistence: "SEPARATE_LINKED_KNOWLEDGE_AND_MEMORY_OBJECTS"

