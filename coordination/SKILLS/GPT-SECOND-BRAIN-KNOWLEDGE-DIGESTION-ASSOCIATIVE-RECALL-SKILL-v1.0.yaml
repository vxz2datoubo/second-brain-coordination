semantic_separation:
  epistemic_roles:
    - SOURCE_FACT
    - SOURCE_CLAIM
    - SOURCE_INTERPRETATION
    - SOURCE_VALUE_JUDGMENT
    - USER_ASSERTION
    - USER_PREFERENCE
    - USER_DECISION
    - USER_CORRECTION
    - OWNER_STANCE
    - ASSISTANT_ANALYSIS
    - ASSISTANT_HYPOTHESIS
    - MODEL_INFERENCE
    - UNKNOWN
  mandatory_rules:
    - "Evidence is not the same thing as a claim."
    - "Correlation is not causation."
    - "Author confidence is not system confidence."
    - "Owner belief is not objective truth."
    - "Repeated assistant statements do not upgrade into owner facts."
    - "External popularity does not upgrade evidence grade."

write_pipeline:
  - step: 1
    id: SOURCE_CAPTURE
    action: "Capture immutable source identity, content hash, provenance, time and scope before interpretation."
  - step: 2
    id: FAITHFUL_EXTRACTION
    action: "Extract what the source actually says before adding outside knowledge. Preserve uncertainty, negation, conditions and exceptions."
  - step: 3
    id: MULTI_ATOM_DECOMPOSITION
    action: "Split distinct durable claims, mechanisms, conditions, cases, stances, goals and rules while retaining shared episode lineage."
  - step: 4
    id: EPISTEMIC_CLASSIFICATION
    action: "Separate fact/claim/evidence/inference/assumption/value judgment/user stance/assistant analysis."
  - step: 5
    id: ENTITY_AND_TERM_RESOLUTION
    action: "Map aliases, synonyms, entities, concepts and versioned terminology to stable identities; preserve ambiguity when unresolved."
  - step: 6
    id: COGNITIVE_MAPPING
    action: "Map relevant concepts into the owner's four cognitive states and build prerequisite/teaching edges where needed."
  - step: 7
    id: RETRIEVAL_BEFORE_WRITE
    action: "Search existing W3 knowledge before deciding whether a candidate is new. Use bounded lexical, semantic, graph, temporal, provenance and structural-analogy channels."
  - step: 8
    id: RECONCILIATION
    action: "Compare new atoms against current lineage heads and historical evidence; choose typed evolution actions rather than append blindly."
  - step: 9
    id: RELATION_EXTRACTION
    action: "Create high-confidence graph edges and explicit UNKNOWN edges for unresolved relation hypotheses."
  - step: 10
    id: TEMPORAL_AND_FRESHNESS_BINDING
    action: "Separate evidence time, proposition/event valid time and freshness/revalidation time; apply domain-aware freshness."
  - step: 11
    id: CANDIDATE_WRITE
    action: "Write through the canonical W3 LearningPacket/candidate boundary atomically and idempotently."
  - step: 12
    id: POST_WRITE_VERIFICATION
    action: "Require exact scoped recall plus paraphrase/graph recall tests appropriate to the atom before reporting success."
  - step: 13
    id: QUALITY_AND_PROMOTION
    action: "Keep uncertain knowledge as candidate; promote only through evidence/validation gates."

reconciliation_actions:
  NEW: "No materially equivalent existing atom; create a new lineage."
  DUPLICATE: "Same semantic claim and scope/source-equivalent; keep provenance but avoid duplicate voting."
  MERGE: "Combine complementary representations without erasing source-specific distinctions."
  REFINE: "New evidence narrows, conditions or improves an existing claim."
  SUPPORT: "Adds independent support without changing the proposition."
  WEAKEN: "Adds counterevidence that lowers confidence or narrows applicability."
  CONTRADICT: "Materially incompatible claims coexist as an explicit conflict set."
  SUPERSEDE: "Newer/current statement replaces the old one for CURRENT use while retaining history."
  REVOKE: "Explicitly invalidated current use; historical evidence remains."
  REVALIDATE: "Fresh evidence renews current applicability."
  RESOLVE_UNKNOWN: "Evidence closes a previously tracked knowledge gap."
  UNKNOWN: "Relation or status cannot yet be determined; do not force a merge."

