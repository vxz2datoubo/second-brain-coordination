retrieval_architecture:
  principle: "Retrieve evidence paths, not a bag of vaguely similar snippets."
  channels:
    lexical:
      purpose: "Exact terms, names, identifiers, Chinese keyword/trigram/BM25-style recall."
    semantic:
      purpose: "Paraphrase and concept similarity; additive, never sole authority."
    entity_graph:
      purpose: "Known entities, relations, dependencies, multi-hop paths."
    temporal:
      purpose: "Current/historical state, event windows, supersession and freshness."
    provenance:
      purpose: "Return source/evidence neighborhood and reconstruct fragmented source context."
    structural_analogy:
      purpose: "Retrieve cases with similar mechanism/constraints even when surface vocabulary differs."
    hierarchical_theme:
      purpose: "Retrieve atom, case/episode and higher-level topic/community summaries at different abstraction levels."
  bounded_query_plan_fields:
    - user_intent
    - entities
    - topic_terms
    - time_expression
    - current_or_historical_intent
    - user_scope
    - project_scope
    - relation_depth_budget
    - candidate_count_budget
    - evidence_grade_floor
    - freshness_requirement
    - counterevidence_requirement

proactive_recall_router:
  principle: >-
    GPT should recall automatically when prior knowledge is likely to materially change understanding, explanation, risk, action or continuity;
    otherwise skip retrieval to avoid latency and irrelevant memory injection.
  positive_triggers:
    - "Current message directly mentions a known entity/topic/case."
    - "Current request contains '之前/以前/记得/我们说过/继续/上次' or equivalent continuity intent."
    - "A current decision may conflict with a stored goal, constraint, plan, preference or correction."
    - "New information may update, contradict, revalidate or supersede existing knowledge."
    - "A stored case has strong mechanism-level or constraint-level similarity to the current problem."
    - "The current task is complex research/design/market analysis where reusable prior methods or failure cases can materially improve quality."
    - "The user's four-state cognitive map can improve explanation depth or prerequisite selection."
  negative_gates:
    - "Trivial small talk with no material continuity requirement."
    - "Only low-confidence or unrelated semantic similarity exists."
    - "All matched current-state-sensitive knowledge is stale and cannot be revalidated."
    - "Retrieval would violate user/project/privacy scope."
    - "The memory is superseded/revoked for CURRENT use and the task is not historical."
  decision_support_anti_anchor_rule: >-
    For consequential analysis, retrieve at least the strongest relevant supporting memory, strongest counterevidence/alternative memory, current
    lineage head and stale/superseded predecessor only when it helps explain evolution. Similar past experience must not automatically dictate the
    current answer.

context_bundle_contract:
  name: "GPTSecondBrainContextBundle"
  required_sections:
    - query_intent
    - current_relevant_atoms
    - historical_predecessors_if_needed
    - cases_and_analogies
    - owner_stances_and_preferences
    - cognitive_coverage_and_teaching_bridges
    - supporting_evidence
    - counterevidence
    - conflicts
    - unknowns
    - freshness_and_revalidation_status
    - provenance
    - retrieval_explanations
    - abstention_reason_if_any
  answer_use_rules:
    - "Use the compact bundle as evidence/context, not as hidden truth."
    - "Distinguish retrieved user memory from external facts and current web verification."
    - "For unstable external facts, current authoritative sources override stale memory while preserving historical memory."
    - "For user preferences/corrections, the latest valid explicit user statement outranks older inference."

memory_vs_knowledge_vs_skill:
  episodic_memory:
    meaning: "What happened, what the owner said/did, experiences, plans, evaluations, conversations and outcomes."
    canonical_form: "Append-preserving source episode plus derived candidate memory atoms."
  semantic_knowledge:
    meaning: "Reusable concepts, mechanisms, facts, methods, causal chains, cases and validated explanations."
    canonical_form: "Source-grounded knowledge atoms plus relations/version/confidence."
  skill:
    meaning: "A reusable procedure or decision method with triggers, inputs, steps, outputs, failure modes and validation evidence."
    promotion_rule: "Knowledge alone cannot become a formal skill without real use, tests/backtests or cross-case validation appropriate to its domain."

skill_promotion_lifecycle:
  - DISCOVERED_INSIGHT
  - KNOWLEDGE_CANDIDATE
  - METHOD_CANDIDATE
  - SKILL_CANDIDATE
  - SYNTHETIC_TESTED
  - REAL_CASE_TESTED
  - CROSS_CONTEXT_VALIDATED
  - FORMAL_SKILL
  - DEGRADED_OR_RETIRED

freshness_and_cycle_model:
  classes:
    TRANSIENT: "Minutes to hours; e.g. intraday clues or live operational state."
    SHORT_CYCLE: "Hours to days/weeks; e.g. news, current product/runtime state."
    MEDIUM_CYCLE: "Weeks to quarters; e.g. operating data, project phase, regulation snapshots."
    STRUCTURAL: "Durable mechanism, stable preference or historically established concept, unless corrected."
    UNKNOWN: "Freshness cannot yet be classified."
  rules:
    - "No universal decay half-life."
    - "Current validity, evidence quality, domain horizon and explicit supersession dominate naive recency."
    - "Historical relevance and current decision relevance are separate scores."
    - "Market-sensitive memories require point-in-time/current-data revalidation before affecting current trading conclusions."

cost_and_latency_strategy:
  online_fast_path:
    - "Intent/scope router."
    - "Bounded lexical/vector candidate recall."
    - "Cheap metadata/time/status filtering."
    - "Only then graph/structural expansion when utility justifies it."
  slow_path_triggers:
    - "New knowledge likely changes existing lineage."
    - "Contradiction/correction/preference shift."
    - "Complex multi-hop decision or global corpus question."
    - "High-value knowledge ingestion requiring deep reconciliation."
  offline_optional:
    - "Graph/community summary rebuild."
    - "Duplicate cluster consolidation."
    - "Index rebuild and drift checks."
    - "Historical backlog digestion."
    - "QCLAW may perform these jobs, but GPT live ingestion/retrieval must not depend on QCLAW availability."

research_design_basis:
  - id: "RAG-2020"
    contribution: "Separate parametric model knowledge from explicit non-parametric retrievable memory; preserve updatability and provenance."
  - id: "GENERATIVE-AGENTS-2023"
    contribution: "Experience record, reflection and dynamic retrieval jointly support behavior/planning."
  - id: "RAPTOR-2024"
    contribution: "Multi-level abstraction retrieval through hierarchical clustering and summaries."
  - id: "GRAPHRAG-2024"
    contribution: "Entity/relationship graph plus community summaries for global corpus sensemaking where naive top-k chunk RAG is weak."
  - id: "LONGMEMEVAL-2024-2025"
    contribution: "Evaluate extraction, multi-session reasoning, temporal reasoning, updates and abstention; use time-aware query expansion."
  - id: "A-MEM-2025"
    contribution: "Zettelkasten-inspired dynamic indexing/linking and memory evolution against historical memories."
  - id: "HALUMEM-2025"
    contribution: "Evaluate memory extraction, update and QA stages separately because upstream memory hallucinations propagate."
  - id: "APEX-MEM-ACL-2026"
    contribution: "Property graph, append-only temporal history and query-time conflict/evolution resolution."
  - id: "LIGHTMEM-ACL-2026"
    contribution: "Separate online bounded retrieval from offline consolidation to control latency."
  - id: "EXPERIENCE-FOLLOWING-ACL-2026"
    contribution: "High-similarity retrieved experiences can over-determine output; stored errors and misaligned replay can propagate."
  - id: "WHAT-DESERVES-MEMORY-ACL-2026"
    contribution: "Retention should reflect future utility rather than only fixed heuristic importance tags."
  - id: "SEEM-ACL-2026"
    contribution: "Structured episodic event frames with precise provenance and associative reconstruction from fragmented evidence."
  - id: "TRUTH-MAINTENANCE-SYSTEMS"
    contribution: "Track dependency and revise current beliefs without destructively deleting contradictory evidence."
  - id: "W3C-PROV-O"
    contribution: "Interoperable provenance concepts such as Entity, Activity and Agent."
  - id: "W3C-OWL-TIME"
    contribution: "Explicit temporal entities, instants, intervals and ordering relations."
  pkm_classics_supplement:
    reference_blueprint: "coordination/BLUEPRINTS/SECOND-BRAIN-GENERIC-METHODOLOGY-ENTERPRISE-INTEGRATION-BLUEPRINT-v1.0.md#G8"
