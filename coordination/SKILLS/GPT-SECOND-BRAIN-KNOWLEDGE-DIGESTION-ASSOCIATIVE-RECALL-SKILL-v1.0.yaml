name: "GPT 第二大脑知识消化、关联、召回与学以致用"
status: "CANDIDATE_SKILL_PROPOSED"
maturity: "R109_FOUNDATION_ACCEPTED_PHASE_C_KNOWLEDGE_OBJECT_AND_RECONCILIATION_NEXT"
