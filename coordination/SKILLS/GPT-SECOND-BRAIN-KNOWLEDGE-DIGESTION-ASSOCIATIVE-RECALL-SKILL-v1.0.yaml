risk_register:
  - risk: "FALSE_LINKING"
    consequence: "Unrelated knowledge becomes connected and contaminates future reasoning."
    control: "Typed relation confidence, provenance, UNKNOWN option, adversarial precision tests."
  - risk: "MEMORY_HALLUCINATION"
    consequence: "Extraction/update error becomes durable and propagates into future answers."
    control: "Stage-specific HaluMem-style evaluation and post-write evidence verification."
  - risk: "EXPERIENCE_FOLLOWING_AND_CONFIRMATION_BIAS"
    consequence: "A similar old case forces a similar answer even when current conditions differ."
    control: "Anti-anchor retrieval, counterevidence requirement, regime/current-validity checks."
  - risk: "STALE_KNOWLEDGE"
    consequence: "Outdated market/product/regulatory information influences current decisions."
    control: "Domain-aware freshness and mandatory current revalidation for unstable facts."
  - risk: "SCOPE_BLEED"
    consequence: "Private or unrelated project knowledge appears in the wrong context."
    control: "Fail-closed user/project/privacy filters and zero-tolerance adversarial tests."
  - risk: "GRAPH_BLOAT_AND_LATENCY"
    consequence: "Every write scans the whole memory and retrieval becomes slow/costly."
    control: "Fast/slow routing, bounded candidate recall, incremental graph links, optional offline consolidation."
  - risk: "OVER_ATOMIZATION"
    consequence: "Meaningful narrative/case context is destroyed into tiny fragments."
    control: "Keep immutable source episode, case/event frames and hierarchical summaries alongside atoms."
  - risk: "UNDER_ATOMIZATION"
    consequence: "One large note contains incompatible claims and cannot be updated precisely."
    control: "General multi-atom decomposition tests and one shared episode lineage."
  - risk: "AUTHORITY_CONFUSION"
    consequence: "Candidate/model inference is mistaken for formal truth."
    control: "Explicit authority state, epistemic role and promotion gates."
  - risk: "USER_BEHAVIOR_FAILURE_MODES"
    consequence: "Collector/perfectionist/janitor/topic-filer/non-distiller/tool-fragmenter patterns reduce system utility."
    control: "Behavioral risk observation from usage logs; user-confirmable patterns; mitigation suggestions in generic methodology blueprint G6."

confidence_and_risk_status:
  architecture_confidence: "HIGH"
  rationale: >-
    The architecture is strongly supported by the existing W3/CLTM design, R109 accepted foundation (27/27 + 246/246 PASS), and multiple independent
    long-term-memory/retrieval research lines plus PKM classics. The exact PHASE_C implementation quality and ChatGPT live-bridge behavior remain unproven.
  implementation_confidence: "MEDIUM_R109_FOUNDATION_PROVEN_PHASE_C_UNIMPLEMENTED"
  worst_case_if_rushed: >-
    A superficially impressive memory system that retrieves stale or wrongly linked knowledge and silently biases important decisions while claiming
    durable learning it has not actually achieved.
  conservative_rule: "Do not promote to FORMAL_SKILL until real end-to-end capture, restart, recall, correction, stale-rejection and scope-isolation tests pass."
