acceptance_stories:
  knowledge_ingestion_and_linking:
    input: "Owner sends a paragraph containing multiple claims, mechanism, caveat and one author opinion and says '消化这个'."
    required_result: >-
      Preserve one immutable source episode; emit separate typed atoms; distinguish author opinion from fact; search old knowledge first; identify
      duplicates/support/conflicts/refinements; create source-grounded graph edges; write candidate atoms atomically; prove recall; report what was
      new versus linked versus unresolved.
  correction:
    input: "Owner says a previous understanding was wrong and provides the correction."
    required_result: >-
      Retrieve the old lineage, preserve history, create USER_CORRECTION/new evidence, supersede current use where justified, and verify CURRENT and
      HISTORICAL recall separately.
  daily_conversation_recall:
    input: "Owner casually mentions a situation that is structurally linked to a prior case or stated preference without explicitly asking for recall."
    required_result: >-
      The router detects material utility, retrieves a small context bundle, uses it naturally if confidence/scope/freshness pass, and does not dump
      irrelevant memory metadata into the conversation.
  research_use:
    input: "Owner asks a new research question whose mechanism overlaps previously digested knowledge."
    required_result: >-
      Retrieve both exact-topic and mechanism-analogy knowledge, distinguish historical memory from current web facts, bring counterevidence, and
      make prior knowledge improve the new reasoning rather than merely quote it.
  anti_anchor:
    input: "A highly similar old case was later proven wrong or occurred under a different regime."
    required_result: >-
      Similarity alone cannot dominate; stale/revoked/conflicting status must be visible and the assistant must surface the mismatch or abstain.

success_definition: >-
  The system is successful when the owner can naturally provide knowledge to GPT, GPT can turn it into source-grounded atomic and linked candidate
  knowledge without QQ, durable W3 write and post-write recall are provable, and later conversations demonstrably retrieve and use the right prior
  knowledge/experience at the right abstraction level while preserving provenance, current-versus-historical truth, cognitive scope, uncertainty,
  counterevidence and privacy. Storage alone, retrieval alone or a YAML schema alone do not count as success.

