# 13. Skill outputs and success criteria
# ---------------------------------------------------------------------------
skill_outputs:
  - "RDC_CANONICAL_DEFINITION/v1"
  - "RDC_QUADRANT_MAP/v1"
  - "RDC_RESIDENCY_CONTRACT/v1"
  - "RDC_WRITE_AUTHORITY_DECISION/v1"
  - "DISPATCH_INTENT_SCHEMA/v1"
  - "CRITIC_PRESCREEN_POLICY/v1"
  - "RDC_TRUST_ATTACK_MAP/v1"
  - "RDC_HANDOFF_MAP/v1"

success_criteria:
  - "A new GPT window can recover the RDC map from canonical artifacts without chat-history dependence."
  - "Owner-facing statements distinguish K1/K2/K3/K4 instead of pretending equal expertise everywhere."
  - "Every RDC authority claim traces to a canonical governance contract, not to chat text."
  - "No RDC action can create a second control tower, second trust gate or host write authority."
  - "Real process activation remains impossible until independent review and explicit Owner authorization."

activation_gate:
  current_stage: "CANDIDATE_PENDING_INDEPENDENT_REVIEW"
  real_process_activation: "FORBIDDEN_UNTIL_INDEPENDENT_REVIEW_AND_CANONICALIZATION"
  owner_authorization_required: true
  chat_text_grants_authority: false
