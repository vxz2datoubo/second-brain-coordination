owner_intent_source: "Owner (大头) session instruction 2026-09-11/12: dispatch button -> RDC reads task -> RDC schedules WorkBuddy/Codex CLI or activates GPT window; RDC is a GPT-controlled command window that should connect the Second Brain console and serve as cross-AI coordination/scheduling tool; requested a full four-quadrant mapping built into one skill."
companion_skills:
