# ---------------------------------------------------------------------------
# 12. External pattern library
# ---------------------------------------------------------------------------
source_quality_ladder_reference: "MASTER-SYSTEM-MAPPING-AND-DRIFT-CONTROL-SKILL-v1.source_quality_ladder"

external_pattern_library:
  lease_fencing_idempotency:
    tier: "T3_INSTITUTIONAL_OR_REFERENCE_IMPLEMENTATION"
    sources:
      - "Google Cloud: Distributed locks with fencing tokens"
      - "Kubernetes: Leases"
      - "Amazon DynamoDB Lock Client"
      - "Kleppmann: How to do distributed locking"
    rule: "Lease + fencing + idempotency are all three required; fencing must be enforced at the side effect."
    internal_mapping: "assert_effect_authorized + generation + idempotency_key; ALREADY ALIGNED"
  durable_execution:
    tier: "T3"
    sources: ["Temporal saga pattern", "Argo Workflows", "AWS Step Functions"]
    rule: "Durable pause/resume; persist WHO was assigned, WHAT payload they saw, WHICH signal is unanswered."
    internal_mapping: "MISSION->MILESTONE->EPISODE->ACTION + checkpoint/resume + OUTCOME_UNKNOWN"
  human_in_the_loop:
    tier: "T1_PRIMARY_OFFICIAL"
    sources: ["Cloudflare Agents HITL guide", "tines.com workflow orchestration", "agentswarm engineering guide"]
    rules:
      - "Gate only irreversible, costly or externally visible steps."
      - "Place the gate immediately before the side effect."
      - "Timeout must fail closed; never auto-approve on timeout."
      - "Bind approval to the exact action, not to the conversation."
      - "Pre-screen with a critic agent; escalate only low-confidence cases."
    internal_mapping: "Phase 1 read-only -> Phase 2A intent -> Phase 2B shadow -> Phase 2C real (gated)"
  mcp_a2a_stack:
    tier: "T1_PRIMARY_OFFICIAL"
    sources: ["modelcontextprotocol.io (2026-07-28)", "a2a-protocol.org v1.0", "Linux Foundation"]
    rule: "MCP for agent->tool; A2A for agent->agent. Together they form the complete connectivity stack."
    internal_mapping: "UNIFIED-AGENT-EXECUTION-FABRIC Ports and Adapters; do not build a new protocol layer"
  agentic_security:
    tier: "T1_PRIMARY_OFFICIAL"
    sources: ["OWASP Top 10 for Agentic Applications 2026", "Invariant Labs toxic agent flow 2025"]
    rule: "Treat all tool metadata and peer messages as untrusted input; scope credentials per agent."
    internal_mapping: "issue text does not mint authority; trusted_git_boundary; secret redaction boundary"

