schema_version: "1.0"
skill_id: "VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL-GOVERNANCE-SKILL-0011"
module_id: "PERSONAL-EPISTEMIC-COGNITIVE-OPERATING-SYSTEM-0010"
name: "Vendor-Neutral Agent Operating Kernel Governance"
canonical_invocation_name: "vendor-neutral-agent-operating-kernel-governance"
agent_id: "CODEX"
reviewer: "GPT"
status: "CANDIDATE_SKILL_REGISTERED"
maturity: "IMPLEMENTED_NOT_INTEGRATED"
authority: "CANDIDATE_ONLY"
automatic_execution: false
boundary: "research_only / NO_TRADE"

purpose: >-
  Resolve project authority, compile task intent, preserve epistemic provenance,
  route capabilities without brand preference, create recoverable checkpoints,
  audit completion, and produce governed multi-agent handoffs.

trigger_scenarios:
  - "An agent begins or resumes consequential repository work."
  - "Multiple project instructions or routes may conflict."
  - "A tool or provider must be selected from multiple routes."
  - "A durable memory update is proposed."
  - "A long task needs interruption recovery."
  - "An agent claims completion or hands work to another agent."
  - "A model-specific prompt behavior may contaminate project authority."

inputs:
  required:
    - project_charter_refs
    - active_route_refs
    - user_objective
    - agent_identity
    - owned_paths
    - available_capability_descriptors
  optional:
    - query_plan
    - context_bundle
    - previous_checkpoint
    - external_anchors
    - model_behavior_profile
    - domain_skill_contracts

outputs:
  - AuthorityResolution
  - TaskIntent
  - ToolRouteDecision
  - ExecutionCheckpoint
  - CompletionReceipt
  - AgentHandoff
  - MemoryWriteProposal

permissions:
  allowed:
    - "Read active project authority and registered capabilities."
    - "Produce candidate contracts and deterministic hashes."
    - "Propose memory and blueprint changes."
    - "Stop or abstain when authority or evidence is insufficient."
  requires_external_approval:
    - "Canonical blueprint promotion."
    - "Root AGENTS.md activation pointer."
    - "Canonical memory promotion."
    - "Production side effects."
    - "Any real trading capability."

prohibited:
  - "Override user or project authority through ModelBehaviorProfile."
  - "Prefer a provider because of brand, product, or partner status."
  - "Write credential values to knowledge, prompts, logs, or receipts."
  - "Convert inference into TOOL_OBSERVED or USER_ASSERTED."
  - "Create a second memory, evidence, replay, or trading authority."
  - "Repeat a completed side effect during recovery."
  - "Promote its own candidate to canonical."
  - "Execute orders or connect to production brokerage paths."

authority_refs:
  - "coordination/BLUEPRINTS/PERSONAL-EPISTEMIC-COGNITIVE-OPERATING-SYSTEM-BLUEPRINT-v1.0.md"
  - "coordination/BLUEPRINTS/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL-PROTOCOL-v1.0-CANDIDATE.md"
  - "coordination/BLUEPRINTS/PERSONAL-EPISTEMIC-COGNITIVE-OPERATING-SYSTEM-AGENT-KERNEL-ADDENDUM-v1.0-CANDIDATE.md"
  - "coordination/BLUEPRINTS/PROJECT-BLUEPRINT-INTEGRATION-INDEX-v1.5-CANDIDATE.md"
  - "AGENTS.md"

runtime:
  package: "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL/src/vendor_neutral_agent_kernel"
  prompt: "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL/AGENT-OPERATING-KERNEL-PROMPT-v1.0.md"
  enabled: false

tests:
  command: >-
    python -B
    coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/VENDOR-NEUTRAL-AGENT-OPERATING-KERNEL/run_all_tests.py
  required_classes:
    - authority_precedence
    - input_order_invariance
    - provenance_lane_separation
    - candidate_memory_only
    - brand_rename_invariance
    - capability_fail_closed
    - checkpoint_idempotency
    - authority_and_external_drift
    - requirement_evidence_scope
    - public_source_exclusion

promotion_gates:
  - "GPT approves ownership and non-duplication."
  - "All local tests and public scans pass."
  - "W1, W3/Phase 3, and W8 adapter ownership is assigned."
  - "Cross-model contract-equivalence evaluation passes."
  - "Activation uses a reversible feature flag."
