schema_version: "1.2"
skill:
  id: BAYESIAN-BELIEF-UPDATE-FORECAST-FUSION-SKILL-0012B
  name: Bayesian Belief Update and Forecast Fusion
  lifecycle_stage: BELIEVE
  maturity: CONTRACT_CANDIDATE_POST_SELF_AUDIT_REMEDIATED
  source_issue: 522
  parent_registry_issue: 63
  effective_spec_snapshot:
    id: SECOND-BRAIN-DS02-ISSUE522-REMEDIATION-003
    ref: issuecomment-5474354229
    canonical_base: 1a514fe839b1c47a14d7fad4a96e8c9fd2365338
  boundaries:
    research_only: true
    no_trade: true
    runtime_implemented: false
    backtest_implemented: false
    canonical_belief_runtime_available: false
    canonical_dependence_authority_available: false
    second_market_authority: false
    second_event_authority: false
    second_regime_authority: false
    second_decision_authority: false
    second_risk_authority: false
    second_portfolio_authority: false
    execution_authority: false
  responsibility: >-
    Define and deterministically verify a proposal-only probabilistic belief contract while
    preserving target/rule identity, knowledge-cutoff and point-in-time provenance, ex-ante
    prior provenance, dependence lineage, small-sample shrinkage safety, content integrity,
    uncertainty, invalidation, and downstream authority separation. Phase 1 does not mint a
    validated canonical posterior. It does not decide, size, execute, or claim alpha.
  sub_capabilities:
    - id: BBU-01
      name: Forecast Target And Market Rule Identity
      requires: [target_id, target_definition_version, forecast_horizon, as_of_time, knowledge_cutoff, exchange, board, security_type, market_rule_version, market_rule_clause_state_version, rule_clause_ids]
      temporal_invariant: knowledge_cutoff <= as_of_time <= decision_time
      fail_closed_on: [missing_target, missing_horizon, definition_collision, cross_exchange_rule_substitution, deferred_clause_use, temporal_order_invalid]
    - id: BBU-02
      name: Prior Registry
      requires: [prior_id, prior_version, prior_family, structured_training_window, regime_scope, evidence_digest, effective_from]
      invariants:
        - training_window.end must not exceed knowledge_cutoff
        - effective_from must not exceed knowledge_cutoff
        - retrospective prior tuning cannot be relabeled ex ante
    - id: BBU-03
      name: Evidence Likelihood Adapter
      invariant: uncalibrated confidence is not a likelihood
      pit_gate: available_at <= knowledge_cutoff <= decision_time
      fallback: [UNKNOWN, ABSTAIN]
    - id: BBU-04
      name: Dependence Provenance Contract
      keys: [source_instance_id, source_family_id, candidate_independence_group_id, ancestry_refs, shared_feed_group_ids, shared_feature_group_ids, shared_training_data_group_ids, shared_model_lineage_ids]
      authority_state: UNAVAILABLE_PHASE1
      independence_status: UNVERIFIED
      invariants:
        - caller independence labels never prove conditional independence
        - copied/reposted/shared-lineage evidence must not be multiplied as independent Bayes factors
        - multiple unresolved sources yield revalidation rather than confidence inflation
    - id: BBU-05
      name: Bayesian Update Proposal Contract
      required_sanity_models: [BETA_BINOMIAL, NORMAL_NORMAL, LOG_ODDS_BAYES_FACTOR]
      invariant: use numerically stable updates, preserve the update ledger, and verify posterior arithmetic
      phase1_packet_status: UNVALIDATED_PROPOSAL
      validated_computation_receipt: UNAVAILABLE
      canonical_belief_authorized: false
    - id: BBU-06
      name: Hierarchical Shrinkage Safety Gate
      purpose: prevent tiny A-share samples from manufacturing extreme certainty
      phase1_machine_rule: small effective samples with extreme posterior require REVALIDATION_REQUIRED
      threshold_source: DS02_NUMERIC_INTEGRITY_CONTRACT_SAFETY_POLICY
      empirical_optimality_claim: false
    - id: BBU-07
      name: Regime and ChangePoint Adapter
      authority_owner: DS-11
      output_on_break: REVALIDATION_REQUIRED
    - id: BBU-08
      name: Dependence-Aware Forecast Fusion
      allowed_methods: [baseline_pooling, dependence_aware_pooling, stacking_candidate, hierarchical_combination_candidate]
      gate: canonical dependence authority or an independently governed validated dependence model is required before independence-sensitive composition
    - id: BBU-09
      name: Posterior Predictive Contract
      invariant: predictive distribution cannot be replaced by scalar P(up)
    - id: BBU-10
      name: Calibration and Diagnostics
      metrics: [brier_score, log_score, reliability, calibration_slope, calibration_intercept, rhat, ess, divergences, psis_loo, pareto_k]
    - id: BBU-11
      name: Belief Ledger And Numeric Integrity
      invariants:
        - transitions are append-only
        - canonical serialized probability is deterministic
        - canonical_digest is SHA256 over sorted compact UTF-8 packet content excluding the digest field itself
        - canonical_digest proves content integrity only and never producer authority
    - id: BBU-12
      name: Decision Adapter
      allowed_consumers: [W7_RISK, W10_DECISION_EPISODE, W11_ALLOCATION, ISSUE_62_KELLY_EV]
      current_phase_output_semantics: ADVISORY_UNVALIDATED_PROPOSAL_ONLY
      forbidden_consumers: [BROKER, LIVE_ORDER, ACCOUNT_FUNDS]
    - id: BBU-13
      name: Epistemic Adapter
      authority_owner: ISSUE_457
      legal_states: [KNOWN_SAID, KNOWN_UNSAID_INFERRED, UNKNOWN_BUT_ACCESSIBLE, UNKNOWN_REQUIRES_SCAFFOLDING, UNKNOWN, ABSTAIN, REVALIDATION_REQUIRED]
  authority_contract:
    upstream_authorities_retained:
      market_truth: W2
      event_evidence: W5
      participant_context: W13
      regime: DS-11
      epistemic_state: ISSUE_457
      dependence_identity: FUTURE_SEPARATELY_GOVERNED_AUTHORITY
    downstream_authorities_retained:
      risk: W7
      decision: W10
      allocation: W11
      capital_allocation: ISSUE_62
      research_overfitting_audit: DS-10
    belief_packet_authority_flags:
      market_truth_authority: false
      event_truth_authority: false
      regime_authority: false
      epistemic_authority: false
      decision_authority: false
      risk_override_authority: false
      position_authority: false
      order_authority: false
      trade_authority: false
  validation_ladder:
    - V0_SCHEMA_AND_CROSS_FIELD_CONTRACT
    - V1_ANALYTIC_CORRECTNESS
    - V2_EXECUTABLE_ADVERSARIAL_PROPERTIES
    - V3_POINT_IN_TIME_KNOWLEDGE_CUTOFF_AND_REVISION
    - V4_EX_ANTE_PRIOR_AND_SHRINKAGE_SAFETY
    - V5_SIMULATION_BASED_CALIBRATION
    - V6_INFERENCE_DIAGNOSTICS
    - V7_PRIOR_POSTERIOR_PREDICTIVE
    - V8_FORECAST_CALIBRATION
    - V9_A_SHARE_OOS_ECONOMIC_INCREMENT
    - V10_RESEARCH_OVERFITTING_AUDIT
    - V11_SHADOW_VALIDATION
  phase_gate:
    current: CONTRACT_VERIFIER_AND_DETERMINISTIC_EXECUTABLE_EVAL_ONLY
