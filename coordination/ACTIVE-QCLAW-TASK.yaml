  blocking_findings:
    - id: "E17-B01-MAPPING-POLICY-IS-DECORATIVE-NOT-AUTHORITY"
      severity: "BLOCKER"
      finding: >-
        MAPPING-POLICY.yaml is committed but generate_adapters.py does not load it. Q0_TO_D2_FAMILY, Q0_TO_D2_SUBTYPE and subtype-family rules are hard-coded in Python,
        so policy edits can be ignored and the validator mirrors the same assumptions rather than independently checking one locked policy source.
    - id: "E17-B02-DEFAULT-SUBTYPE-IS-EPISTEMIC-UPGRADE"
      severity: "BLOCKER"
      finding: >-
        When a recognized family lacks an explicit subtype, the generator assigns a convenient default such as retail_liquidity_taker,
        systematic_rebalancer or short_horizon_momentum. Family-level evidence therefore becomes a specific subtype assertion without source support.
    - id: "E17-B03-AMBIGUITY-HYPOTHESES-ARE-FABRICATED"
      severity: "BLOCKER"
      finding: >-
        build_ambiguous_hypotheses adds the lexicographically first alternative family/subtype rather than reading an audited deterministic-ID ambiguity manifest.
        Multiple labels exist, but the second label is not evidence-derived.
    - id: "E17-B04-COMMITTED-POLICY-CONTRACT-IS-CANONICALLY-WRONG"
      severity: "BLOCKER"
      finding: >-
        MAPPING-POLICY.yaml lists subtype names as D2 families and maps long_horizon_fund, policy_aggregate, industrial_aggregate and foreign_aggregate to active_capital,
        contradicting the reviewed four-family/nine-subtype SUBTYPE_FAMILY contract.
    - id: "E17-B05-VALIDATOR-IS-NOT-STRICT-OR-INDEPENDENT"
      severity: "BLOCKER"
      finding: >-
        validate_adapters.py uses ordinary json.loads and yaml.safe_load, merely comments that duplicate keys should be detected, checks relation/question source counts
        without reconciling output identities, checks coverage file existence rather than contents, and does not recompute adapter IDs, source-field hashes, mapping decisions,
        generated manifests or output hashes.
    - id: "E17-B06-NO-UPGRADE-FAILURES-ARE-WARNINGS-OR-PRESENCE-CHECKS"
      severity: "BLOCKER"
      finding: >-
        Missing downgrade evidence is warning-only; source_field_hash tests check length/presence instead of recomputation; preserved evidence/counterevidence/UNKNOWN values
        are not losslessly compared to source records.
    - id: "E17-B07-DETERMINISM-COMPARES-ONLY-THREE-FILES"
      severity: "MAJOR"
      finding: >-
        hash_compare.py claims a complete canonical set but EXPECTED_FILES contains only adapters JSONL, summary YAML and package JSON. Coverage, source lock,
        generation receipt, policy/interface snapshots and other canonical artifacts are excluded, and the script copies directories rather than proving Git-archive provenance.
    - id: "E17-B08-FALSE-ACTIVE-EVIDENCE"
      severity: "BLOCKER"
      finding: >-
        D05-COMMAND-EVIDENCE contains patterned non-recomputed values including a1b2c3d4... and c3d4e5f6..., inconsistent seed sets and commands that do not match the new
        run_production_tests.py path. AI_HANDOFF still says two commits are planned and proposes Gate-C next steps after the three-commit delivery already occurred.
    - id: "E17-B09-COMMIT-SHAPE-NONCONFORMITY"
      severity: "MAJOR"
      finding: >-
        E16 required one corrective substantive commit and one receipt-only commit, but remote history contains 562d58f, db4fef1 and ac6b846. db4fef1 added a missing required
        coverage file after a TLS timeout. History rewrite remains forbidden, so this is preserved as an immutable process nonconformity rather than squashed.
