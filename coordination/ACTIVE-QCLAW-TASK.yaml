      severity: "BLOCKER"
      finding: >-
        Generator and validator require only len(hypotheses)>=2. They do not prove distinct subtype IDs, policy compatibility,
        family compatibility, non-duplicate bases or source-reference support, so duplicated or incompatible hypotheses can pass.
