        the pushed tested candidate is 243fce2. Receipt and quality files were committed inside the sole substantive commit, so the required receipt-only
        commit is absent.
    - id: "E16-B07-EPISITEMIC-FIELDS-NOT-LOSSLESSLY-PRESERVED"
      severity: "MAJOR"
