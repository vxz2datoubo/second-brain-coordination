  blocking_findings:
    - id: "E18-B01-JSON-DUPLICATE-KEYS-STILL-ACCEPTED"
      severity: "BLOCKER"
      finding: >-
        Generator and validator use json.loads(line) without object_pairs_hook. They reject duplicate record IDs but silently
        accept duplicate keys inside one JSON/JSONL object, contradicting the strict parsing contract.
    - id: "E18-B02-YAML-LOADER-IS-NOT-SEALED-SAFE-STRICT"
      severity: "BLOCKER"
      finding: >-
        Policy and manifest loading uses CLoader/Loader with a globally patched constructor rather than a dedicated SafeLoader-derived
        strict loader. The production tests use yaml.safe_load, which does not reject duplicate keys, and never inject duplicate mappings.
    - id: "E18-B03-ADAPTER-IDENTITY-TRUNCATES-SOURCE-ID"
      severity: "BLOCKER"
      finding: "adapter_id binds only deterministic_id[:16], not the full immutable source identity."
    - id: "E18-B04-SOURCE-HASH-AND-OUTPUT-ARE-NOT-LOSSLESS"
      severity: "BLOCKER"
      finding: >-
        source_field_hash covers a selected field subset and adapters omit content_en, tags, evidence/counterevidence references,
        UNKNOWN/data-availability qualifiers and extension fields. Source atom 92 contains data_availability_note, data_version,
        parameter_status and tags, while its adapter discards them and the hash does not bind them.
    - id: "E18-B05-NAMED-PERSON-QUARANTINE-IS-INCOMPLETE"
      severity: "BLOCKER"
      finding: >-
        QUARANTINE-MANIFEST contains only atoms 1 and 32, while accepted Q0 contains many additional Liu Xin person-bearing atoms.
        Those records are emitted as ordinary UNMAPPED or CONTEXT_ONLY instead of PERSON_IDENTITY_QUARANTINED, so the person-isolation
        rule is applied only when a record also carries family/subtype fields.
    - id: "E18-B06-AMBIGUITY-CAN-CONTAIN-ONE-HYPOTHESIS"
      severity: "BLOCKER"
      finding: >-
        Atoms 57 and 67 are classified AMBIGUOUS with only one speculative subtype hypothesis. One candidate is not ambiguity and
        does not satisfy the requirement for multiple source-grounded alternatives.
    - id: "E18-B07-VALIDATOR-DOES-NOT-CLOSE-PACKAGE-AND-COVERAGE"
      severity: "BLOCKER"
      finding: >-
        Validator checks only atom coverage contents, does not validate relation/question coverage contents, does not fail on extra
        canonical artifacts, does not recompute the full package hash/size manifest, and hard-codes the D2 truth rather than verifying
        the actual locked interface file independently.
    - id: "E18-B08-PRODUCTION-TEST-COUNT-INCLUDES-NON-TESTS"
      severity: "BLOCKER"
      finding: >-
        Duplicate-key tests only parse already-valid files; HYPOTHESIS authority test passes literal True; deterministic test passes
        when skipped; hash-seed test is hard-coded True. The claimed 39/39 result is not 39 distinct production-entry adversarial executions.
    - id: "E18-B09-HASH-COMPARE-MISSING-BOTH-PASSES"
      severity: "BLOCKER"
      finding: >-
        hash_compare.py marks MISSING_BOTH as match=True and compares arbitrary directories without proving Git-archive provenance.
    - id: "E18-B10-PACKAGE-MANIFEST-IS-INCOMPLETE"
      severity: "MAJOR"
      finding: >-
        D2-ADAPTER-PACKAGE.json contains counts and a few hashes but not the complete canonical artifact hash/size set or linked
        99/147/64 identity coverage required for independent verification.
