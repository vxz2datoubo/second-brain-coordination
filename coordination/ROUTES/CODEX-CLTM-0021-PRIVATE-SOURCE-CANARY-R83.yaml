  Do not discover, scan, guess, crawl or enumerate private source locations.

binding_contract:
  required_environment:
    - "CLTM_PRIVATE_DATA_ROOT"
    - "CLTM_PRIVATE_DAILY_MEMORY_CANDIDATE_V2_PATH"
  source_status_function: "private_source_binding_status"
  absent_missing_unreadable: "PRIVATE_SOURCE_BINDING_WAITING"
