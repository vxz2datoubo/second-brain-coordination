  directory_scan_or_source_discovery: "FORBIDDEN"

canary_contract:
  execute_only_if_binding_status: "PRIVATE_SOURCE_BINDING_CONFIGURED"
  canary_store: "fresh isolated MemoryStore SQLite under the explicit private data-root; do not use the public repository/worktree"
  canary_store_cleanup: "DO_NOT_DELETE_AUTOMATICALLY; cleanup requires later explicit owner approval"
  eligible_user_memory_candidate_count:
    zero: "Return NO_ELIGIBLE_USER_MEMORY_CANDIDATES; do not claim canary success."
    one: "May ingest and recall exactly that one eligible user-memory candidate."
    more_than_one: "Return PRIVATE_CANARY_SELECTION_WAITING; do not semantically choose among private candidates without owner review."
  required_path: "DailyMemoryCandidate-v2 -> DailyMemoryCandidateTransport-v1 -> W3PrivateCandidateEnvelope-v1 -> ConversationEpisode -> LearningPacket -> MemoryStore -> QueryPlan -> ContextBundle"
  exact_recall_proof_required: true
  correction_semantics_if_candidate_is_correction: "canonical producer-id resolution and supersession only; no direct W3 atom id from producer"
  candidate_authority_only: true
  formal_promotion: "FORBIDDEN"

