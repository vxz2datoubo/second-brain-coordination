purpose: >-
  Implement the synthetic-only foundation for a manual-capture Memory Palace. Extend the accepted W3 conversation memory path additively so a
  captured owner utterance can be atomized, temporally normalized, persisted, retrieved by keyword/time/graph cues, and conservatively checked
  against earlier memories for schedule/fact conflicts. Build the four-state cognitive coverage mapping contract. Do not touch real private data
  or create any scheduler in epoch 107.

existing_runtime_facts_to_preserve:
  - "ConversationEpisode is historical evidence and remains append-preserving."
  - "Conversation user memories remain candidate authority unless separately promoted."
  - "Current QueryPlan scope/user_scope/valid_at privacy gates remain fail-closed."
  - "CURRENT retrieval excludes superseded memories; HISTORICAL retrieval can use valid time."
  - "LearningPacket import remains atomic/idempotent and credential-secret patterns fail closed."
  - "Accepted recurring candidate runtime and operational private store must not be modified or opened by this task."

implementation_scope:
  primary_root: "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-3-INTEGRATED-OFFLINE-MEMORY/"
  allowed_change_policy: >-
    Changes may be made only inside the Phase-3 Integrated Offline Memory src/tests/fixtures area plus the canonical Memory Palace design/task
    documentation needed for this epoch. Do not change scheduler routes, ACL/security config, trading code, production MCP/Gateway, or unrelated
    program modules.
  required_capabilities:
    - "Manual capture contract/parser for `采集记忆` and alias `数据采集`, with deterministic trigger-in-message and trigger-only behavior."
    - "Derived semantic memory types for plans/goals/commitments/event reports without rewriting raw ConversationEpisode evidence."
    - "Timezone-aware temporal-expression normalization with deterministic relative-date handling for Chinese `今天/明天/后天` at minimum and an extensible parser boundary for richer expressions."
    - "Store original time expression, anchor time, normalized interval/date, granularity, method and confidence separately from raw evidence."
    - "Event/plan representation linked to candidate atoms and provenance."
    - "Typed conservative conflict detection: DIRECT_FACT_CONTRADICTION, SCHEDULE_HARD_CONFLICT, SCHEDULE_POTENTIAL_CONFLICT, PREFERENCE_TENSION, PLAN_SUPERSESSION_CANDIDATE, UNKNOWN_CONSTRAINT."
    - "Same calendar day without interval/exclusivity evidence must not be promoted to hard conflict."
    - "Hybrid retrieval orchestrator using current lexical retrieval + temporal window retrieval + relation/graph expansion. Add retrieval explanations."
    - "Provide an optional semantic-provider interface but do not require network/API keys or make semantic embeddings a correctness dependency in epoch 107."
    - "Four-state cognitive coverage mapping contract: KNOWN_SAID, KNOWN_UNSAID_INFERRED, UNKNOWN_BUT_ACCESSIBLE, UNKNOWN_REQUIRES_SCAFFOLDING."
    - "Post-write exact scoped recall verifier for capture success receipts."
    - "No private/public semantic leakage in receipts/tests."

reference_acceptance_story:
  timezone: "Asia/Shanghai"
  utterance_recorded_at: "2026-08-14T20:00:00+08:00"
  new_utterance: "明天我要去睡大觉。采集记忆"
  expected_resolved_date: "2026-08-15"
  prior_memory: "2026-08-15 有群运动"
  expected_behavior: >-
    Preserve the source utterance, derive a 2026-08-15 plan/event, retrieve the prior 2026-08-15 event through temporal expansion, and emit
    SCHEDULE_POTENTIAL_CONFLICT if the two events have unknown times/flexibility. Do not silently overwrite either memory and do not claim a hard
    contradiction without overlap/exclusivity evidence.

