owner_new_requirement: >-
  Manual conversational trigger `采集记忆` is the preferred near-term capture mechanism. The highest-priority capability is later retrieval plus
  temporal/constraint reasoning, including resolving relative dates against utterance time and surfacing conflicts with prior memories. Every
  atomic memory must also carry a temporal lifecycle so stale/superseded/revoked clues cannot silently influence current reasoning, especially in
  market/trading contexts. Owner evaluations such as good/bad, true/false belief, credibility and bias judgments are first-class time-bound stances
  linked to their targets and must never be collapsed into objective fact. The previous unattended-scheduler activation profile remains disabled.
design_spec: "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/CLTM-0021/MEMORY-PALACE-MANUAL-CAPTURE-TEMPORAL-REASONING-V1.md"

purpose: >-
  Implement the synthetic-only foundation for a manual-capture Memory Palace. Extend the accepted W3 conversation memory path additively so a
  captured owner utterance can be atomized, temporally normalized, persisted, retrieved by keyword/time/graph cues, conservatively checked against
  earlier memories, aged/revalidated through an explicit lifecycle, and represented as owner stance when the content is an evaluation rather than
  objective fact. Build the four-state cognitive coverage mapping contract. Do not touch real private data or create any scheduler in epoch 107.

existing_runtime_facts_to_preserve:
  - "ConversationEpisode is historical evidence and remains append-preserving."
  - "Conversation user memories remain candidate authority unless separately promoted."
  - "Current QueryPlan scope/user_scope/valid_at privacy gates remain fail-closed."
  - "CURRENT retrieval excludes superseded memories; HISTORICAL retrieval can use valid time."
  - "LearningPacket import remains atomic/idempotent and credential-secret patterns fail closed."
  - "Existing stale/revoked/superseded truth states remain available and historical evidence is not deleted."
  - "Accepted recurring candidate runtime and operational private store must not be modified or opened by this task."

implementation_scope:
  primary_root: "coordination/PROGRAMS/SECOND-BRAIN-A-SHARE-ENTERPRISE-SYSTEM-0001/PHASE-3-INTEGRATED-OFFLINE-MEMORY/"
  allowed_change_policy: >-
    Changes may be made only inside the Phase-3 Integrated Offline Memory src/tests/fixtures area plus the canonical Memory Palace design/task
    documentation needed for this epoch. Do not change scheduler routes, ACL/security config, trading code, production MCP/Gateway, or unrelated
    program modules.
  required_capabilities:
    - "Manual capture contract/parser for `采集记忆` and alias `数据采集`, with deterministic trigger-in-message and trigger-only behavior."
    - "Derived semantic memory types for plans/goals/commitments/event reports/evaluations without rewriting raw ConversationEpisode evidence."
    - "Timezone-aware temporal-expression normalization with deterministic relative-date handling for Chinese `今天/明天/后天` at minimum and an extensible parser boundary for richer expressions."
    - "Store original time expression, anchor time, normalized interval/date, granularity, method and confidence separately from raw evidence."
    - "Temporal lifecycle metadata separating evidence time, validity time and freshness/revalidation time."
    - "Domain-aware freshness profile contract: TRANSIENT, SHORT_CYCLE, MEDIUM_CYCLE, STRUCTURAL, UNKNOWN. No universal fixed half-life."
    - "Historical evidence remains retrievable even when CURRENT admission is stale/superseded/revoked."
    - "Market/trading retrieval distinguishes historical similarity, current validity, current relevance and revalidation status."
    - "Superseded/revoked/stale market clues cannot regain CURRENT decision influence solely through semantic similarity."
    - "Event/plan representation linked to candidate atoms and provenance."
    - "Owner stance/evaluation representation linked to a stable target, including good/bad, trust/credibility, authenticity, bias, risk, usefulness, accuracy and preference judgments."
    - "Epistemic separation: `用户认为事件X是假的` is a user stance, not proof that event X is objectively false."
    - "Later opposite evaluations create append-preserving update/supersession chains; prior stance remains HISTORICAL."
    - "Typed conservative conflict detection: DIRECT_FACT_CONTRADICTION, SCHEDULE_HARD_CONFLICT, SCHEDULE_POTENTIAL_CONFLICT, PREFERENCE_TENSION, PLAN_SUPERSESSION_CANDIDATE, STANCE_CONFLICT, SOURCE_CREDIBILITY_CONFLICT, UNKNOWN_CONSTRAINT."
    - "Same calendar day without interval/exclusivity evidence must not be promoted to hard conflict."
    - "Hybrid retrieval orchestrator using current lexical retrieval + temporal window retrieval + relation/graph expansion. Add retrieval explanations."
    - "Retrieval explanations expose freshness/current-validity and owner-stance reasons for admission/down-ranking/abstention."
    - "Provide an optional semantic-provider interface but do not require network/API keys or make semantic embeddings a correctness dependency in epoch 107."
    - "Four-state cognitive coverage mapping contract: KNOWN_SAID, KNOWN_UNSAID_INFERRED, UNKNOWN_BUT_ACCESSIBLE, UNKNOWN_REQUIRES_SCAFFOLDING."
    - "Post-write exact scoped recall verifier for capture success receipts."
    - "No private/public semantic leakage in receipts/tests."

reference_acceptance_story:
  timezone: "Asia/Shanghai"
  utterance_recorded_at: "2026-08-14T20:00:00+08:00"
  new_utterance: "明天我要去睡大觉。采集记忆"
  expected_resolved_date: "2026-08-15"
  prior_memory: "2026-08-15 有群运动"
  expected_behavior: >-
    Preserve the source utterance, derive a 2026-08-15 plan/event, retrieve the prior 2026-08-15 event through temporal expansion, and emit
    SCHEDULE_POTENTIAL_CONFLICT if the two events have unknown times/flexibility. Do not silently overwrite either memory and do not claim a hard
    contradiction without overlap/exclusivity evidence.

owner_stance_acceptance_story:
  utterance: "我觉得这个消息是假的，而且这个来源有偏见。采集记忆"
  expected_behavior: >-
    Preserve one source episode and atomize at least two owner stance memories linked to the target claim/source: a BELIEVES_FALSE/DISBELIEVES
    judgment about the message and a BIAS/CREDIBILITY judgment about the source. Neither stance may mark the target objectively false/biased
    without independent evidence. A later opposite owner evaluation must create a new stance in an update/supersession lineage while preserving
    the earlier stance for historical retrieval.

market_freshness_acceptance_story:
  expected_behavior: >-
    A short-cycle bullish market clue recorded in the past remains historically searchable but is stale/down-ranked or fail-gated for current
    trading reasoning when outside its validated freshness horizon and not revalidated. A durable structural preference/rule is not automatically
    suppressed merely because it is older.

