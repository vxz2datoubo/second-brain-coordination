    requirement: >-
      Pair every new atom id with its own derived item. Only the specific new atom that is USER_PLAN, USER_COMMITMENT or USER_EVENT_REPORT may
      participate in schedule-conflict detection. Preference, stance and assertion siblings from the same captured passage must never inherit a
      schedule conflict merely because another sibling is schedulable.
