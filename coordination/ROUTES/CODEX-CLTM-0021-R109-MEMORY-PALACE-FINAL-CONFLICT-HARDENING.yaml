    requirement: >-
      Preserve and compare each schedulable atom's own event interval. Multiple new event-like atoms on one date must not be collapsed by a
      date-to-single-item map.
  - id: "R109-NONOVERLAP-NO-CONFLICT"
    requirement: >-
      If both sides have known fixed intervals and they do not overlap, emit no SCHEDULE_HARD_CONFLICT, no SCHEDULE_POTENTIAL_CONFLICT and no
      UNKNOWN_CONSTRAINT. If fixed intervals overlap, emit SCHEDULE_HARD_CONFLICT. POTENTIAL plus UNKNOWN_CONSTRAINT is reserved for genuinely
      under-specified same-day mutual-exclusion cases.
  - id: "R109-EXACT-HEAD-CLOSEOUT"
