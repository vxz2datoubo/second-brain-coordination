root_goal: >-
  Build an independent PUBLIC_SAFE_SYNTHETIC adversarial retrieval benchmark for the GPT second-brain P2 program. QCLAW is a batch verifier and candidate
  evidence producer, not the runtime authority and not the final semantic judge. The benchmark must help GPT test Codex P2.1/P2.2 without modifying Codex runtime.

benchmark_scope:
  baseline_target_cases: "80-120 high-value deduplicated cases"
  stretch_target_cases: "up to 200 only if provider quota remains healthy and cases add distinct coverage"
  required_dimensions:
    - "user/project/privacy scope isolation and cross-domain denial"
    - "CURRENT/HISTORICAL valid_at behavior"
    - "stale/revoked/superseded no-resurrection"
    - "lexical/relation/temporal/provenance channel admission parity"
    - "hidden or disallowed relation/conflict endpoints"
    - "synthetic aggregate no-double-vote"
    - "support plus strongest counter/alternative coverage"
    - "material UNKNOWN and no-evidence ABSTAIN"
    - "provenance/redaction without raw pointer/body"
    - "deterministic ordering, dedup and budget omission"
    - "prompt-injection and secret-shaped fixture fail-closed"

case_contract:
  required_fields:
    - "case_id"
    - "canonical_contract_source"
    - "setup"
    - "query_and_intent"
    - "expected_admission_or_abstention"
    - "forbidden_outcome"
    - "failure_significance"
    - "applicable_slice"
  epistemic_rule: >-
    Expected outcomes must come from accepted canonical contracts. If the contract is ambiguous, QCLAW must mark UNKNOWN and escalate to GPT; it must not
    invent a new rule and then grade Codex against its own invention.

allowed_outputs:
  - "task-owned benchmark YAML/JSON/markdown under a QCLAW R60 program directory"
  - "coverage matrix, discovery ledger, UNKNOWN registry, WPDCR/AMED/AI_HANDOFF"
  - "task-owned benchmark harness outside Codex runtime if needed"
  - "read-only execution of existing public-safe Phase-3 tests and benchmark probes"

forbidden:
  - "editing PHASE-3-INTEGRATED-OFFLINE-MEMORY/src/**"
  - "editing Codex implementation branches"
  - "creating a second memory/retrieval runtime or canonical truth"
  - "real private user knowledge/source/store read or upload"
  - "formal PROJECT/GLOBAL promotion"
  - "scheduler, production MCP/Gateway or runtime dependency on QCLAW"
  - "security/ACL/repository visibility changes"
  - "trading/accounts/funds/orders"
  - "self merge or authority upgrade"

resource_policy:
  default_profile: "FOREGROUND_PRIORITY"
  qclaw_task_python_cap: 2
  combined_project_python_cap: 4
  combined_cpu_bound_workers_cap: 1
  nested_parallelism: "FORBIDDEN"
  heavy_matrix_or_fanout: "REMOTE_CI_OR_BOUNDED_BATCH"
  quota_policy: >-
    Prioritize distinct high-risk cases over raw count. Stop expansion before provider quota exhaustion; a strong 80-120 case benchmark is preferred to 200 repetitive cases.
  required_postflight: "measured zero task-owned descendants, zero orphans, zero unrelated terminations; UNKNOWN if not measurable"

required_closeout:
  - "exact head_sha, branch and Draft PR"
  - "benchmark case count and dedup method"
  - "coverage matrix by risk dimension and P2 slice"
  - "canonical-contract traceability for every expected result"
  - "negative/failed probes and discovered gaps"
  - "UNKNOWN items where contracts are not frozen"
  - "resource usage and process lifecycle receipt"
  - "proof no Codex runtime source changed"
  - "PUBLIC_SAFE_ONLY"
  - "REAL_PRIVATE_EXECUTION_NOT_RUN"
  - "FORMAL_PROMOTION_LOCKED"

