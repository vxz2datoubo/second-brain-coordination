  - "long mixed knowledge passage emits multiple typed atoms with shared immutable source lineage and epistemic separation"
  - "new knowledge retrieves old W3 evidence before write and assigns typed reconciliation action"
  - "proactive recall can trigger without explicit remember wording when prior context materially changes the answer"
  - "stale/revoked highly similar memory cannot dominate CURRENT context"
  - "feedback marks useful/irrelevant/stale/wrong/incomplete-conditions append-preservingly"

