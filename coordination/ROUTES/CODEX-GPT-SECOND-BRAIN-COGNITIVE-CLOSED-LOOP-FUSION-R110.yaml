mandatory_architecture_rules:
  - "one canonical W3/Integrated Offline Memory authority; no second canonical memory or knowledge store"
  - "source evidence separate from derived interpretation"
  - "user assertion, owner stance, source claim, assistant analysis, model inference and unknown remain epistemically distinct"
  - "CURRENT/HISTORICAL, event time and freshness/revalidation remain explicit"
  - "retrieval-before-write and retrieval-before-answer are separate governed stages"
  - "semantic similarity is retrieval evidence, never truth/current-validity authority"
  - "high-risk context retrieval includes lineage head, material support and strongest counterevidence/alternative where available"
  - "stale/superseded/revoked cannot regain CURRENT authority by similarity"
  - "scope/privacy fail closed"
  - "no one-case skill promotion"
  - "NO_TRADE"

mandatory_acceptance_stories:
