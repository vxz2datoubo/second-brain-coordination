mission:
  goal: >-
    Add one strict W2 market-data semantic type and provider-capability evidence gate so price/quantity/unit/direction/time/
    missingness/provider-version meaning becomes machine-checkable and documented provider capability can never silently mint
    local-runtime capability truth.
  success_requires:
    - "fixed-decimal canonical numeric semantics; no float guessing in new canonical semantic layer"
    - "explicit units and no silent share/lot, fraction/percent, yuan/ten-thousand-yuan conversion"
    - "source-enum to canonical-direction mapping with UNKNOWN preserved"
    - "event/exchange/published/available/ingested time semantics remain distinct"
    - "zero, missing, stale and entitlement-unverified remain distinct"
    - "OFFICIAL_DOCUMENTED never upgrades to LOCAL_RUNTIME_VERIFIED without local evidence"
    - "typed drift diagnostics for schema/semantic/unit/direction/precision/enum/time/adjustment/missingness/vendor/capability drift"
