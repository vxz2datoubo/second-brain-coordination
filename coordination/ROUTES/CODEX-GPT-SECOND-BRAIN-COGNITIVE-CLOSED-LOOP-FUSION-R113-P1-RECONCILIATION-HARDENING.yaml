required_semantics:
  retrieval_before_write:
    - "bounded same-domain QueryPlan result must be inspected and recorded in reconciliation evidence"
    - "action receipt binds candidate, compared lineage/atom IDs, evidence basis and action reason"
    - "caller directive may constrain intent but naked action+target cannot by itself prove SUPPORT/REFINE/etc"
    - "ambiguous or unsupported comparison => UNKNOWN/ABSTAIN with zero mutation"
  action_evidence:
    - "define minimum preconditions/evidence for MERGE, REFINE, SUPPORT, WEAKEN, CONTRADICT, SUPERSEDE, REVOKE, REVALIDATE, RESOLVE_UNKNOWN"
    - "positive and negative tests for each nontrivial action"
    - "if later lifecycle mutation belongs to P4, P1 may classify/record without performing that later transition, but must state that boundary explicitly"
  inert_untrusted_content:
    - "prompt-injection-like quoted/source text is stored only as source data with epistemic/provenance labeling"
    - "it cannot alter route/task/system/authorization/authority fields"
    - "actual secret/token/private-key shaped values remain hard-rejected before mutation/indexing"
  privacy_domains:
    - "separate public-safe execution class from privacy-domain namespace, or equivalent design"
    - "allow at least two distinct PUBLIC-SAFE SYNTHETIC privacy domains for adversarial isolation tests while real/private classes stay forbidden"
    - "same proposition across two synthetic privacy domains => distinct identities and zero implicit recall"
    - "explicit synthetic aggregate query may admit both, but must not count them as two independent semantic votes without governed equivalence/aggregation"
  post_write_proof:
    - "semantic/paraphrase success must use materially different query text or relation-assisted path"
    - "do not label exact lexical recall as semantic recall"
    - "plain newline-separated mixed passages must actually decompose or the supported input contract must be changed and tested truthfully"

