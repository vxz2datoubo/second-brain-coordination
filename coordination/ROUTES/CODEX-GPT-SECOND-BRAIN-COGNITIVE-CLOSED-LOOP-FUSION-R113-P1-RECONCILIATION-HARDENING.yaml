  - "prompt-injection-like source passage is retained as inert data and cannot mutate control/authorization"
  - "secret-shaped source still fails before mutation/indexing"
  - "two distinct public-safe synthetic privacy domains isolate proposition IDs and recall"
  - "explicit aggregate view does not double-count isolated equivalent propositions"
  - "true paraphrase or relation-assisted post-write recall proof"
  - "restart/index rebuild preserves domain identity and all provenance"
  - "newline-separated multi-atom passage behaves as documented"
  - "accepted R109/R111 semantics remain green"

