mandatory_repairs:
  - id: "R120-B01-EPISTEMIC-ROLE-PRESERVATION"
    requirements:
      - "Every projected evidence/context item must preserve its originating conversation claim_role and/or knowledge epistemic_role when present."
      - "USER_ASSERTION, USER_PREFERENCE, USER_DECISION, USER_PLAN, USER_GOAL, USER_COMMITMENT and USER_EVENT_REPORT must not be emitted as unlabeled objective fact evidence."
      - "SOURCE_INTERPRETATION, VALUE_JUDGMENT, USER_STANCE, ASSISTANT_ANALYSIS and MODEL_INFERENCE must not become generic fact support/current-head evidence."
      - "Owner preference/plan/goal/decision/commitment/event objects must remain typed owner/context objects; do not invent new objective semantics."
      - "Fact-like/source-claim items may remain evidence only with explicit epistemic labeling."
  - id: "R120-B02-MATERIALITY-ABSTAIN"
    requirements:
      - "Presence of any conflict or unknown must not automatically be upgraded to material/blocking."
      - "ABSTAIN may be forced only by a canonical, testable blocking/materiality condition."
      - "If materiality cannot be proven from the current schema, preserve the normal trust gate and expose non-authoritative materiality UNKNOWN rather than fabricate material_conflict_present/material_unknown_present."
      - "A benign/ancillary conflict or unknown must remain visible without necessarily forcing ABSTAIN."
  - id: "R120-B03-EXPLICIT-OPEN-UNKNOWN"
    requirements:
      - "Do not silently erase explicit OPEN unknowns solely because related_atom_ids is empty."
      - "Safely bound explicit open unknowns may be projected only when caller-observability/scope/provenance is provable."
      - "If an unbound explicit open unknown cannot prove user/privacy authorization, fail closed and expose only count-only `unbound_explicit_unknown_omitted`; never expose its identity/question and never pretend it did not exist."

