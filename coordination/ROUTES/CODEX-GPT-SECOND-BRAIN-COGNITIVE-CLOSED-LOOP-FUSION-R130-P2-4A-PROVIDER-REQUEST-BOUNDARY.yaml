    rule: "deterministic non-reversible content hash over normalized scope/privacy-mode contract fields; provider receives only fingerprint, never raw values"
  result_correlation:
    rule: "SemanticProviderResult/v1 must echo request_id; mismatch is INVALID_RESPONSE-equivalent fallback with no public reason"
  query_language:
    rule: "optional field only when already caller supplied; do not infer language as a new authority"
