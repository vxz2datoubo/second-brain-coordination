  - id: "R127-B01-IMPLICIT-SEMANTIC-WEIGHT"
    status: "REQUIRES_REMEDIATION"
    note: >-
      The contract says provider query-term enrichments enter existing lexical search while semantic numeric weight remains UNKNOWN. Canonical search_term_scores numerically accumulates query-term weights, so provider terms would implicitly alter lexical ranking. This is an unapproved scoring policy.
  - id: "R127-B02-ANALOGY-RELATION-FEATURE-ORACLE"
    status: "REQUIRES_REMEDIATION"
    note: >-
      StructuralFeature permits a relation-type multiset but does not explicitly bind every contributing relation to endpoint-safe admitted relations. Raw adjacency could leak hidden/foreign/revoked neighbors through feature labels or digests.

gpt_decisions:
  P2_4_SEMANTIC_NUMERIC_WEIGHT:
    status: "GPT_DECIDED"
    decision: "NO_NUMERIC_SCORE_V1"
    rule: >-
      Semantic provider terms are discovery-only. Candidate IDs may be discovered through the existing index, but semantic-only hits must enter _consider_candidate with score=None and channel=semantic, using existing deterministic supplemental placement. If an atom already has lexical/relation numeric score, semantic discovery may add channel attribution only and must not alter the numeric score. Provider terms must not be concatenated into the lexical query used for numeric scoring. Any future semantic numeric policy requires a separately reviewed benchmarked change.

