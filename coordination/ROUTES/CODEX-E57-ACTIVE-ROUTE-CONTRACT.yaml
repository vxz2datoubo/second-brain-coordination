  Prevent ordinary consumers from manufacturing accepted source, atom, evidence, packet or relation authority, and prevent a
  green test or receipt from being treated as authority unless real adversarial cases, genuine mutations, exact topology and two
  separate downloaded-byte Provider evidence sets all close.

