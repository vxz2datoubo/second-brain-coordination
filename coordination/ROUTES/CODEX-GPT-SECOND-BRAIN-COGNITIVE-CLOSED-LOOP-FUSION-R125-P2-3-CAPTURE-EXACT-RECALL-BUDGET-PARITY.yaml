blocking_finding:
  id: "R124-B01-CAPTURE-EXACT-RECALL-BUDGET"
  severity: "BLOCKER"
  fact: >-
    QueryPlan defaults to budget 50 while capture_text atomization has no matching 50-atom cap and requires all just-written atom_ids to be returned by a single retrieve_memory_palace call. Before R124, adapter-side provenance sibling augmentation occurred after the base bundle budget; after unification, all candidates are budgeted inside ContextAssembler and the compatibility adapter formats only bundle.atoms. Therefore a 51+ atom same-episode capture can lose at least one just-written atom and fail memory_palace_exact_recall_failed.

root_goal: >-
  Preserve the accepted P2.3 single-authority migration while restoring capture_text write-after-read exact-recall proof under budget saturation. Normal retrieval context budgets must remain authoritative and must not be globally inflated merely to make the proof green.

