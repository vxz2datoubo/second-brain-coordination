  - "Make capture_text exact-recall verification complete for all just-written atoms even when the normal retrieval context budget is saturated."
  - "Any exact-recall proof path must reuse canonical ContextAssembler caller-observability/admission and W3 data; direct get_atom existence checks alone are insufficient as retrieval proof."
  - "Do not globally raise or bypass QueryPlan budget for ordinary retrieval. Do not solve this by arbitrary ranking weights."
  - "Preserve temporal/relation/provenance unified discovery, deterministic channel attribution, CURRENT/HISTORICAL lifecycle behavior and R118-R123 security guarantees."
  - "If a new QueryPlan/proof contract is genuinely required and cannot be implemented additively without changing public semantics, stop and report UNKNOWN_NEEDS_GPT rather than inventing a broad schema change."

