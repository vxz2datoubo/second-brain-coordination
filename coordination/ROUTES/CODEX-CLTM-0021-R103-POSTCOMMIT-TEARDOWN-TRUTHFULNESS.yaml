root_goal: >-
  Close the remaining post-commit truthfulness gap before unattended activation. If the W3 transaction and public-safe ledger append have already
  succeeded but MemoryStore close or process-owned lock release/close fails during teardown, the CLI must not collapse that state into generic
  REJECTED. It must emit a redacted committed-state teardown-failure outcome that truthfully preserves committed_state and audit_status while
  reporting teardown failure. No new ingestion authority, scheduler activation or private execution is authorized.

blocking_finding:
  id: "R103-POSTCOMMIT-TEARDOWN-AMBIGUITY"
  finding: >-
    Current run_recurring_candidate_ingestion can commit W3 and append the ledger, then raise a generic RecurringCandidateSoakError if
    MemoryStore.close or OS lock unlock/descriptor close fails during context teardown. The CLI generic handler would report REJECTED although
    durable candidate state and audit evidence may already exist.
  required_fix: >-
    Distinguish post-commit teardown failure from all pre-commit rejection paths. Preserve only public-safe receipt fields and explicit coarse
    state such as status=COMMITTED_STATE_TEARDOWN_FAILED, committed_state=COMMITTED, audit_status=PASS when ledger append completed, and
    teardown_status=FAILED. Do not expose raw exception strings, private paths, candidate semantics, SID/usernames or private source values.

