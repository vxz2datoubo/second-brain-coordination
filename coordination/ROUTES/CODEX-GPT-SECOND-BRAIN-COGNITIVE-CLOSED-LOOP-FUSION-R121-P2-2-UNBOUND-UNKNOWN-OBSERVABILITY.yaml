blocking_finding:
  id: "R120-B01"
  title: "UNBOUND_UNKNOWN_OMISSION_COUNT_OBSERVABILITY"
  finding: >-
    `_safe_unknowns()` increments caller-visible `unbound_explicit_unknown_omitted` before checking the unknown's scope or proving any caller/user/privacy observability.
    With an empty query, `include_all_open=True` enumerates all OPEN unknowns, so a plan scoped to one project can have its count influenced by an unbound unknown from another project.
    Unbound unknowns also lack endpoints from which user/privacy admission can be proven, recreating the R118 existence/count side-channel class.

root_goal: >-
  Repair only caller observability of count-only telemetry for unbound explicit OPEN unknowns while preserving every accepted R120/R119/R118 semantic and safety behavior.

mandatory_repairs:
  - "An unbound OPEN unknown must be indistinguishable from nonexistence unless the omission itself is caller-observable under the current QueryPlan."
  - "Apply project/scope eligibility before incrementing any public omission count."
  - "When user/privacy observability cannot be proven from an unbound unknown, fail closed and do not increment caller-visible telemetry."
  - "For safely observable synthetic unbound unknowns, keep count-only telemetry; never expose ID, question, raw source, pointer or private metadata."
  - "Add adversarial tests: same-scope safely observable synthetic unbound unknown may count; foreign-scope does not change the report; user/privacy-bound plan cannot infer an unbound unknown whose visibility cannot be proven."
  - "Preserve R120 epistemic/owner-context separation and non-fabricated materiality semantics."
  - "Preserve R119 endpoint-safe relation/conflict/unknown projection and R118 rare-term/caller observability equivalence."

