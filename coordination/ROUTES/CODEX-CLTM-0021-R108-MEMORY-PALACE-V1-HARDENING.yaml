purpose: >-
  Harden the existing epoch-107 Memory Palace v1 implementation on the same Codex branch/PR. Close the seven GPT review blockers that can cause
  incorrect temporal validity, unrelated same-day recall, false post-write recall proof, inadequate long-message atomization, unstable owner-stance
  lineage, false schedule conflicts, weak provenance identity, and brittle market freshness classification. Remain synthetic-only.

required_blockers_to_close:
  - id: "R108-BITEMPORAL-EVENT-TIME-SEPARATION"
    requirement: >-
      Separate claim/evidence validity from the referenced event interval. A plan recorded at 2026-08-14T20:00+08:00 for `明天` must be CURRENT-
      recallable immediately after capture while its event interval remains 2026-08-15. A stance recorded at 20:00 must not appear in a 10:00
      HISTORICAL reconstruction of the same day.
  - id: "R108-TEMPORAL-CHANNEL-CONFIDENCE-GATE"
    requirement: >-
      Do not activate date expansion/temporal scanning when the query has no trusted temporal expression or explicit structured temporal filter.
      Non-temporal queries must not retrieve unrelated same-day memories. Post-write exact recall must be supported by content/semantic/graph
      evidence rather than an implicit anchor-date coincidence.
  - id: "R108-GENERAL-MULTI-ATOM-CAPTURE"
    requirement: >-
      A long owner passage containing multiple durable claims/plans/preferences/decisions/goals/commitments/event reports must be decomposable into
      separate retrievable atoms with one shared source episode lineage. Provide a deterministic offline/synthetic atomizer or injected atomizer
      provider boundary; no network/LLM availability may be required for correctness.
  - id: "R108-STRUCTURED-OWNER-STANCE-TARGETS"
    requirement: >-
      Implement stable target identity plus evaluation type so authenticity, source bias, credibility, good/bad, risk, usefulness, accuracy and
      preference judgments remain owner stances, not objective facts. Opposite bias/credibility/evaluation statements must update the same target
      lineage append-preservingly. A multi-stance source sentence must be able to attach claim-authenticity and source-bias to distinct targets.
  - id: "R108-TYPED-CONFLICT-DISCIPLINE"
    requirement: >-
      Schedule conflicts apply only to schedulable event-like memories/constraints. Unrelated same-day assertions/preferences/stances must not
      create schedule conflicts. Implement and test the route-declared conflict types that have actual v1 behavior; constants alone do not count.
      At minimum cover stance/source-credibility conflict and plan supersession/unknown-constraint behavior where evidence supports them.
  - id: "R108-CONTENT-BOUND-PROVENANCE"
    requirement: >-
      Bind ConversationEpisode/source provenance to normalized captured content or an explicit caller-supplied content hash. Reusing one source
      identity with changed source text must be detected/revisioned or produce a distinct content-bound source identity. Raw private text remains
      forbidden from public receipts.
  - id: "R108-DOMAIN-AWARE-FRESHNESS-POLICY"
    requirement: >-
      Replace literal-word-only market freshness classification with an explicit metadata/policy boundary. Stock/trading clues that do not contain
      the literal `市场` must still be classifiable as TRANSIENT/SHORT_CYCLE when appropriate. Structural preferences must remain durable; no one
      universal decay rule.

