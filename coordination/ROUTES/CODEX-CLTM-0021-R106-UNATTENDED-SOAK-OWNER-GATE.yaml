purpose: >-
  Freeze execution after successful real operational initialization and present one concrete unattended candidate-soak scheduler profile for
  explicit owner approval. Option A authorizes the direction of continuous candidate-only ingestion, but persistent automatic execution is a
  separate operational boundary and remains locked until the owner explicitly approves this exact profile or requests changes.

recommended_scheduler_profile:
  scheduler_type: "WINDOWS_TASK_SCHEDULER"
  task_name: "SecondBrain-CLTM-CandidateSoak"
  principal: "CURRENT_WINDOWS_USER_ONLY"
  run_level: "LEAST_PRIVILEGE"
  credential_storage: "NONE"
  run_when_logged_off: false
  run_when_logged_on: true
  trigger: "AT_LOGON_PLUS_REPEAT_EVERY_60_MINUTES"
  repeat_interval_minutes: 60
  catch_up_missed_runs: false
  wake_computer: false
  multiple_instances_policy: "IGNORE_NEW"
  execution_time_limit_minutes: 10
  network_required_each_run: false
  auto_update_runtime_from_remote: false
  runtime_pin: "52cae1f3eb30f8bc9f200d465f8d239c031d72fd"
  runtime_materialization: >-
    One owner-approved activation route will materialize a dedicated normal Git runtime clone under the current user's local application-data
    area, pinned exactly to the accepted runtime merge. It will not point the scheduled task at the damaged/stale linked worktree and will not
    fetch/pull during recurring runs.
  runtime_integrity_each_run: >-
    Before private access, the launcher must verify the pinned runtime HEAD and require no tracked modifications under the three accepted runtime
    source roots. Any mismatch fails closed before reading the private source.
  environment_binding: >-
    The launcher must obtain CLTM_PRIVATE_DATA_ROOT and CLTM_PRIVATE_DAILY_MEMORY_CANDIDATE_V2_PATH from the current user's persisted Windows
    environment without printing their values, set them only in the child process, and execute the canonical module entrypoint.
  exact_runtime_command: "python -m integrated_offline_memory.cli recurring-private-ingest"
  expected_normal_outcomes:
    - "IMPORTED / exit 0 when a new eligible candidate is present"
    - "NO_CHANGE / exit 0 for idempotent replay"
  committed_failure_outcomes:
    - "COMMITTED_STATE_AUDIT_FAILED / exit 2"
    - "COMMITTED_STATE_TEARDOWN_FAILED / exit 2"
  generic_rejection: "exit 1 / REJECTED"
  observability: >-
    Rely on the existing private soak ledger for aggregate/hash-only ingestion history and Windows Task Scheduler LastTaskResult for process status.
    Do not create an additional raw-private log file and do not redirect raw stderr into a public location.

activation_route_after_owner_approval:
  phase_1_materialize_runtime: >-
    Create the dedicated pinned local runtime clone and verify exact accepted commit plus clean relevant runtime paths. No private access required.
  phase_2_register_disabled_task: >-
    Register the task DISABLED first with the exact profile above. Do not store a password, request elevation, or use SYSTEM/Administrator.
  phase_3_registered_task_canary: >-
    Trigger the registered task exactly once while still administratively bounded, wait for completion, require LastTaskResult success and verify
    only aggregate operational evidence. Because the operational store is already initialized from epoch 105, an unchanged source should produce
    NO_CHANGE; a genuinely newer candidate may produce IMPORTED. Both remain candidate-only.
  phase_4_enable_periodic_trigger: >-
    Only if the registered-task canary passes, enable the 60-minute schedule. Stop immediately after enabling and return a redacted activation
    receipt for GPT review.

