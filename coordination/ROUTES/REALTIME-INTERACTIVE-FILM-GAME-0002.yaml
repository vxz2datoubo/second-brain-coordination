executor:
  role: "CODEX"
  integrator: "GPT_GITHUB_INTEGRATOR"
  independent_reviewer: "GPT_INDEPENDENT_REVIEWER"
  impersonation_forbidden: true

mode:
  value: "project_plan"
  label: "【Codex模式：项目计划模式】REALTIME-INTERACTIVE-FILM-GAME-0002"
  reason: >-
    The S00-S06 offline creative vertical slice is canonical on main. The next bounded mission is to turn that foundation into a
    materially richer multi-scene, save/replay, interactive presentation and multi-beat director continuity system without
    introducing network/provider/credential/production authority.

boundary: "PUBLIC_SAFE / OFFLINE_FIRST / LOCAL_DETERMINISTIC / NO_TRADE / NO_PRODUCTION / NO_CREDENTIALS / NO_PAID_GENERATION / NO_CANONICAL_KNOWLEDGE_WRITE"

FUNDAMENTAL_GOAL_AND_SUCCESS_MODEL:
  goal: >-
    Extend the merged creative runtime into a replayable multi-scene interactive-film game that remains deterministic,
    migration-safe, inspectable and reviewable. A fresh user should be able to play multiple synthetic scenes, save/load named
    slots, export transcripts, replay and compare branches, inspect causal consequences, compile multi-beat director continuity
    packets, and reproduce the entire demo offline from a clean clone.
  success_requires:
    - "S07-S10 completed in fixed order with pushed checkpoints"
    - "backward compatibility with the canonical S00-S06 runtime or an explicit tested migration"
    - "deterministic replay equivalence for identical manifest + event history"
    - "corrupt/incompatible saves fail closed without destroying valid slots"
    - "multi-beat director diagnostics expose screen-direction, spatial, knowledge, identity, causality and duration failures"
    - "terminal experience remains fully offline and model-independent"
    - "review package is reproducible from clean clone"
  failure_conditions:
    - "silent state mutation makes replay non-deterministic"
    - "save/load can overwrite or delete unrelated paths"
    - "schema incompatibility is guessed instead of rejected/migrated"
    - "director continuity silently accepts material contradiction"
    - "any credential/provider/paid-generation/production path becomes executable"
    - "creative session content can mint canonical second-brain knowledge"
    - "unregistered local/Eustia/WorkBuddy material is reused"

PRIMARY_DELIVERY_AND_NON_NEGOTIABLES:
  fixed_slice_order:
    - "S07_MANIFEST_SCENE_GRAPH_AND_SAVE_SLOTS"
    - "S08_REALTIME_INTERACTIVE_PRESENTATION"
    - "S09_MULTI_BEAT_DIRECTOR_CONTINUITY"
    - "S10_OFFLINE_DEMO_REVIEW_PACKAGE"
  S07:
    must_deliver:
      - "validated manifest-driven scene/beat/action graph with multiple synthetic adult/non-explicit scenes"
      - "stable scene_id beat_id action_id transition_id identities"
      - "deterministic transition graph and branch consequence records"
      - "versioned session/save schema with explicit migration registry"
      - "named save slots with safe list/load/save/delete semantics"
      - "atomic-or-equivalent fail-safe save replacement and corrupt-slot isolation"
      - "transcript export and branch replay comparison"
      - "path traversal / reserved-name / malformed-slot negative tests"
  S08:
    must_deliver:
      - "playable terminal loop with recap, choices, state summary, consequences, help and transcript mode"
      - "deterministic logical timing/pacing metadata rather than wall-clock authority"
      - "bounded free-text intent parser with explicit clarification/invalid fallback"
      - "accessibility-friendly plain-text presentation"
      - "no network or model call path"
  S09:
    must_deliver:
      - "compile multiple beats into ordered shot/director packets"
      - "continuity checks for screen direction, spatial relation, character identity, audience/character knowledge, action causality and duration budget"
      - "stable machine-readable diagnostic codes with evidence locations"
      - "cross-cut transition contract and final-state handoff"
      - "diagnostics must not rewrite story authority or trigger generation"
  S10:
    must_deliver:
      - "reproducible multi-scene demo fixtures and scripted playthroughs"
      - "golden deterministic replay snapshots for synthetic fixtures only"
      - "save migration/compatibility and negative fixtures"
      - "review packet export with manifest hash, session schema, event digest, transcript and director diagnostics"
      - "clean-clone RUNBOOK and current AI_HANDOFF.yaml"

PROACTIVE_MISSION_AND_BETTER_METHOD_MANDATE:
  executor_may:
    - "choose better internal schemas/abstractions within the authorized paths when tests prove improved determinism, safety or maintainability"
    - "reuse and extend canonical creative_runtime components before creating parallel implementations"
    - "add bounded task-local validators, fixtures, diagnostics and observability"
    - "improve ergonomics of the CLI without adding network/provider authority"
    - "implement backward-compatible AMED_A/AMED_B improvements discovered during S07-S10"
  executor_must_not:
    - "redesign repository authority or create a second W3/knowledge store"
    - "change task identity, branch, baseline, reviewer, merge policy or safety locks"
    - "import local/WorkBuddy/Eustia assets without GPT source-registration"
    - "enable provider credentials, external generation, paid calls, deployment or trading"
  AMED_C_proposal_only:
    - "real provider integration"
    - "production UI/server/service"
    - "cross-repository canonical knowledge writes"
    - "external asset import"
    - "new global dispatcher/reviewer/authority"

READ_CLAIM_EXECUTE_CONTRACT:
  trigger_phrases: ["读取任务", "执行任务", "开始任务", "读取并执行任务", "继续推进项目"]
  canonical_action: "READ_LATEST_ROUTE_CLAIM_VALID_LEASE_AND_EXECUTE_IMMEDIATELY"
