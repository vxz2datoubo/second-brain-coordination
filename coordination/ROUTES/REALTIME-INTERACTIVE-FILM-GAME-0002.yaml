MANDATORY_DISCOVERY_QUESTIONS:
  - "What can be done more reliably, simply, safely or completely than the literal slice wording?"
  - "Which assumptions, dependencies, schemas, tests or interfaces from S00-S06 are stale, incomplete or duplicated?"
  - "Which predecessor components can be reused or generalized instead of creating parallel scene/session/director systems?"
  - "What high-value extension becomes visible without expanding provider/production/knowledge authority?"
  - "What remains unresolved under current evidence, especially save migration, replay determinism and cross-beat continuity?"
  - "Which exact GPT/reviewer coordination is required for provenance, source import, scope or acceptance?"
  - "Which discoveries should feed back into tests, task-local design, reusable protocols or a future governed task?"

ANTICIPATED_DIFFICULTY_AND_UNKNOWNS:
  known_risks:
    - "schema migration can appear successful while silently changing replay semantics"
    - "save-slot filesystem behavior can create path traversal or partial-write corruption"
    - "event ordering tied to wall clock can break deterministic replay"
    - "multi-beat continuity can overfit synthetic fixtures and miss contradiction classes"
    - "CLI free text can accidentally become an unconstrained natural-language execution path"
  required_unknown_registry: "coordination/PROGRAMS/REALTIME-INTERACTIVE-FILM-GAME-0002/DEPENDENCY-AND-UNKNOWN-REGISTRY.yaml"
  fail_closed_on:
    - "unknown schema version without registered migration"
    - "corrupt manifest/session/event ledger"
    - "ambiguous transition target"
    - "unverified source/provenance"
    - "material director continuity contradiction"

