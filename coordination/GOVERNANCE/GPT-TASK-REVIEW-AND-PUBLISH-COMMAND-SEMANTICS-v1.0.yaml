schema_version: "1.4"
protocol_id: "GPT-TASK-REVIEW-AND-PUBLISH-COMMAND-SEMANTICS-0001"
short_name: "GRPC-S"
status: "ACTIVE_PERMANENT_PROJECT_RULE"
authority_scope: "user_to_GPT_project_orchestration_commands"
applies_to: [GPT]
parent_program: 31
binding_constitution: "coordination/GOVERNANCE/DUAL-LAYER-INITIATIVE-AND-GPT-ORCHESTRATION-CONSTITUTION-v1.0.yaml"
proactive_mission_authoring_protocol: "coordination/GOVERNANCE/PROACTIVE-MISSION-AUTHORING-AND-BOUNDED-INITIATIVE-GRANT-PROTOCOL-v1.0.yaml"
work_process_reporting_protocol: "coordination/GOVERNANCE/AGENT-WORK-PROCESS-DIFFICULTY-DISCOVERY-AND-COORDINATION-REPORTING-PROTOCOL-v1.0.yaml"
agent_read_execute_protocol: "coordination/GOVERNANCE/AGENT-READ-TASK-CLAIM-AND-EXECUTE-COMMAND-SEMANTICS-v1.0.yaml"
in_progress_visibility_protocol: "coordination/GOVERNANCE/AGENT-IN-PROGRESS-REMOTE-VISIBILITY-AND-ROUTE-BRIDGE-PROTOCOL-v1.0.yaml"
local_execution_issue_registry: "coordination/ENGINEERING-LEARNING/LOCAL-EXECUTION-ISSUE-PATTERNS.yaml"

purpose: >-
  Give 审查任务 and 发布任务 durable meanings. A bare 审查任务 is the whole review-optimize-publish cycle for all materially
  relevant active/newly completed lanes, not a shallow summary. GPT independently audits evidence and task quality, repairs its
  own control plane, and publishes or reaffirms correct executable routes without asking the user for a separate 发布任务 command.

trigger_commands:
  REVIEW_TASK:
    exact_phrases: ["审查任务", "审核任务", "验收任务", "审查成果", "审核成果"]
    default_scope:
      include_by_default: [CODEX, QCLAW]
      include_when_active_or_dependency_relevant: [WORKBUDDY, FUTURE_AGENT]
      named_focus_rule: "When user names one Agent/PR, prioritize it but still inspect material cross-agent/system effects."
    default_meaning: "FULL_REVIEW_OPTIMIZE_AND_PUBLISH_CYCLE"
    automatic_actions:
      - "Read latest remote main and all relevant active routes."
      - "Perform visibility preflight and fetch complete reports, PRs, commits, tests, CI and receipts."
      - "Review assignment quality, execution, process, difficulty, failures, discoveries, expansions, unresolved problems, coordination and system feedback."
      - "Match observed local execution failures against LOCAL-EXECUTION-ISSUE-PATTERNS; update evidence and prefer durable root-cause remediation over repeated workaround when justified."
      - "Accept reusable value and preserve negative evidence."
      - "Directly repair GPT-owned task, route, protocol or coordination defects."
      - "Publish remediation/next mission, reaffirm valid route or publish precise blocked state."
      - "Synchronize PR/Issue/central coordination anchors."
      - "Update reusable system lessons and templates when justified."
    separate_publish_command_required: false
    does_not_mean:
      - "Read only latest summary/comment."
      - "Accept self-declared completion."
      - "Check only checklist counts."
      - "Review one PR in isolation when interfaces are material."
      - "Infer no local progress from unchanged remote head."
      - "Return only an opinion while leaving known GPT control-plane defects unfixed."
      - "Wait for user to say 发布任务."
      - "Create an empty epoch when current valid route simply has not executed."
  PUBLISH_TASK:
    exact_phrases: ["发布任务", "派发任务", "重新分配任务", "继续发布任务"]
    default_meaning: "AUTHOR_AND_PUBLISH_PROACTIVE_EXECUTABLE_MISSION_FROM_LATEST_VALID_REVIEW"
    does_not_mean:
      - "Copy agent's own next step without review."
      - "Issue unnecessary micro-remediations."
      - "Give freedom without firewalls."
      - "Abandon local progress silently."
      - "Implicitly release real data, replay, backtest, account, order or trade."

review_task_protocol:
  evidence_scope:
    - "Latest main and agent-specific active routes."
    - "Task brief, forecast, Issue body and all comments."
    - "Complete reports, WPDCR, checkpoints, completion comments and handoffs."
    - "PR metadata, exact commit topology, changed files and patches."
    - "Commands, exits, stdout/stderr hashes, tests, receipts, CI jobs/logs and reproducibility."
    - "Visibility/StaleRoute/PARTIAL/CHECKPOINT/RECOVERY/IDLE packets and checkpoint refs."
    - "Proactive discoveries, improvements, alternatives, rejected ideas and UNKNOWNs."
    - "Negative results, survivors, SKIP, stale assumptions and contradictions."
    - "Cross-agent interfaces, canonical ownership, runtimes, dependencies and pauses."
    - "Applicable local execution issue patterns, their recurrence evidence, permanent-fix attempts and prevention regressions."
  visibility_preflight:
    mandatory: true
    inference_rules:
      - "Unchanged PR head proves only no new remote-verifiable delivery."
      - "Reported local work remains reported-not-verified until remotely fetchable."
      - "Checkpoint helps preserve/route but cannot satisfy final acceptance."
  task_authoring_quality_review:
    mandatory: true
    questions:
      - "Was mode and reason explicit?"
      - "Did task state fundamental goal and mechanism?"
      - "Did it separate minimum delivery from executor choices?"
      - "Did it grant bounded better-method/A-B initiative?"
      - "Did it require seven discovery questions, difficulty/UNKNOWN, exact coordination and system feedback?"
      - "Did it include RTCE: 读取任务 means claim and execute?"
      - "Did task publication inspect matching local execution issue patterns and inject relevant prevention checks?"
      - "For recurring failures, did it distinguish permanent root-cause remediation from temporary containment?"
      - "Could wording have caused passive, plan-only or evidence-theatre behavior?"
    repair_rule: "Repair authoring/command semantics as well as executor defects when task design contributed."
  execution_review_dimensions:
    - "Primary mission completeness and semantic correctness."
    - "Whether valid 读取任务 led to substantive execution."
    - "Observable process, pivots and failed attempts."
    - "Planned versus actual difficulty with evidence."
    - "Expected/unexpected findings and limits."
    - "Expandable ideas with reuse, owner, cost, risk, trigger and gate."
    - "Unresolved problems, attempts, missing capability and abstention."
    - "Failures, negative results and regression protection."
    - "Whether repeated local execution failures were prevented, permanently remediated, or explicitly contained with evidence."
    - "Exact coordination and unaffected work."
    - "Cross-agent handoff, authority and system impact."
    - "Reusable lessons and system feedback."
  independent_reasoning_required: true
  remote_truth_over_report: true
  agent_self_approval_forbidden: true
  required_dispositions: [ACCEPT_AS_IS, ACCEPT_AND_INTEGRATE, ACCEPT_WITH_GPT_REFINEMENT, PARTIAL_ACCEPT_REMOVE_INCOHERENT_PORTIONS, RETURN_FOR_REMEDIATION, SPLIT_AND_ROUTE, DEFER_WITH_OWNER_AND_TRIGGER, REJECT_PRESERVE_EVIDENCE]
  output_must_separate:
    - "Accepted facts and boundaries."
    - "Useful proactive additions."
    - "GPT-owned fixes applied."
    - "Returned defects with gates."
    - "Duplicate/incoherent parts."
    - "New high-value goals."
    - "Unresolved difficulty/UNKNOWN/negative risks."
    - "Exact coordination."
    - "Remote-verifiable versus reported/unknown state."
    - "Whole-system and release consequences."
  post_review_action:
    delivery_incomplete: "Publish smallest coherent remediation preserving accepted value."
    delivery_accepted: "Publish next gate only when prerequisites independently pass."
    no_new_delivery_current_route_valid: "Do not create empty epoch; reaffirm route and repair execution semantics if needed."
    route_invalid_or_incomplete: "Repair/reissue route before execution."
    high_risk_user_gate: "Stop affected scope and present exact decision."

publish_task_protocol:
  prerequisite: "Use latest valid review and preserve/disposition local work before superseding."
  local_issue_prevention_gate:
    registry: "coordination/ENGINEERING-LEARNING/LOCAL-EXECUTION-ISSUE-PATTERNS.yaml"
    mandatory: true
    procedure:
      - "Identify task OS, shells, languages, parsers/compilers, file formats, encodings, Unicode/path exposure and network transports."
      - "Load only matching ACTIVE patterns."
      - "Inject low-cost high-value prevention checks into task acceptance criteria."
      - "For recurring patterns, explicitly choose PERMANENT_FIX, CONTAIN_AND_MEASURE, or NOT_APPLICABLE_WITH_REASON."
      - "Do not promote one successful workaround into a permanent standard without maturity evidence."
  defaults:
    - "Proactive mission around fundamental goal, not passive checklist."
    - "Preserve useful work and repair defective boundary."
    - "Grant better-method and A/B initiative."
    - "Require seven discovery questions, difficulty/UNKNOWN, exact coordination and system feedback."
    - "Define internal evidence gates and WPDCR."
    - "Read matching local execution issue patterns and prevent known recurrence before release."
    - "State 读取任务 means read, claim and immediately execute."
  every_published_task_must_define:
    - "Mode and reason."
    - "Goal, mechanism and system position."
    - "Minimum delivery versus choices."
    - "Reviewed/base heads and accepted boundaries."
    - "Autonomy, better-method mandate and A/B/C/D."
    - "Seven discovery questions."
    - "Difficulty, UNKNOWN, blocker evidence and abstention."
    - "Applicable local execution issue patterns, prevention checks, and permanent-fix versus containment decision."
    - "Coordination owners/requests/unaffected work/closure."
    - "System-feedback destinations and GPT gate."
    - "Paths, branch, PR/WIP and safety firewalls."
    - "Visibility, evidence, tests, reproducibility, WPDCR and receipts."
    - "Completion signal and GPT second pass."
    - "RTCE one-command execution semantics."
  publication_actions:
    - "Update machine route on latest main."
    - "Synchronize PR/Issue/central coordination."
    - "Preserve paused Agents unless explicitly reactivated."
    - "Read back remote route and human anchors."

command_relationships:
  REVIEW_TASK_includes_publish_follow_through: true
  required_order: [REVIEW_AND_VISIBILITY_PREFLIGHT, FREEZE_DISPOSITION_AND_BOUNDARIES, LOCAL_ISSUE_PREVENTION_PREFLIGHT, OPTIMIZE_AND_PUBLISH_OR_REAFFIRM]
  forbidden_shortcut: "No publish-first retrofit."

memory_and_persistence:
  user_intent: "PERMANENT_LONG_TERM_OPERATING_RULE"
  applies_to_future_conversations: true
  applies_across_agent_and_epoch_changes: true
  default_user_shorthand:
    审查任务: "FULL_REVIEW_OPTIMIZE_AND_PUBLISH_CYCLE"
    读取任务: "AGENT_READ_CLAIM_AND_EXECUTE_CYCLE"

security_and_release_boundaries:
  direct_main_write_by_executors: false
  auto_merge: false
  force_push: false
  history_rewrite: false
  issue92_implicit_release: false
  real_data_replay_backtest_fitting_account_order_trade_implicit_release: false

