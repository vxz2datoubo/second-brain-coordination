schema_version: "1.1"
protocol_id: "GPT-TASK-REVIEW-AND-PUBLISH-COMMAND-SEMANTICS-0001"
short_name: "GRPC-S"
status: "ACTIVE_PERMANENT_PROJECT_RULE"
authority_scope: "user_to_GPT_project_orchestration_commands"
applies_to: [GPT]
parent_program: 31
binding_constitution: "coordination/GOVERNANCE/DUAL-LAYER-INITIATIVE-AND-GPT-ORCHESTRATION-CONSTITUTION-v1.0.yaml"
in_progress_visibility_protocol: "coordination/GOVERNANCE/AGENT-IN-PROGRESS-REMOTE-VISIBILITY-AND-ROUTE-BRIDGE-PROTOCOL-v1.0.yaml"

purpose: >-
  Give the user phrases 审查任务 and 发布任务 stable, durable meanings. GPT must use full evidence, independent judgment,
  system-level architecture awareness, local-progress visibility awareness and bounded initiative instead of treating either phrase
  as a shallow summary request or a mechanical ticket-writing command.

trigger_commands:
  REVIEW_TASK:
    exact_phrases: ["审查任务", "审核任务", "验收任务", "审查成果"]
    default_meaning: >-
      Read the agents' complete current reports and the underlying repository evidence, decide what can be accepted, what should
      be improved, removed, returned, split, deferred or expanded, and verify that the result remains compatible with the whole
      project architecture, ownership model, dependencies, safety boundaries and operability.
    does_not_mean:
      - "Read only the latest summary or completion comment."
      - "Accept an agent's self-declared completion."
      - "Check only whether a checklist count was reached."
      - "Review one PR in isolation when the task spans multiple PRs or interfaces."
      - "Infer that no local progress exists merely because the remote PR head is unchanged."
      - "Automatically publish the next task unless the user also requests publishing or the current command explicitly includes it."
  PUBLISH_TASK:
    exact_phrases: ["发布任务", "派发任务", "重新分配任务", "继续发布任务"]
    default_meaning: >-
      Convert the latest accepted review state and the global roadmap into executable machine routes and human-readable task
      contracts. Grant each agent an autonomy budget appropriate to its capability, explicitly state where initiative is encouraged,
      where caution and hard gates apply, preserve material local work through route bridges, and preserve GPT control of overall
      sequencing, integration and release.
    does_not_mean:
      - "Copy the agent's own proposed next step without independent review."
      - "Issue many tiny one-line remediation tickets when a coherent larger mission is safer and more efficient."
      - "Give unrestricted freedom without path, branch, PR, authority and stop-condition firewalls."
      - "Silently abandon reported or potentially existing local progress when superseding a route."
      - "Release real data, replay, backtest, account, order or trading authority implicitly."

review_task_protocol:
  evidence_scope_must_include_when_relevant:
    - "Latest remote main and active task routes."
    - "Complete agent report, all checkpoints, completion comments and handoffs."
    - "All related PR metadata, commit chains, changed files, patches and exact heads."
    - "Tests, commands, exits, stdout/stderr hashes, receipts and reproducibility evidence."
    - "InProgressVisibilityPacket, StaleRoutePacket, PARTIAL, CHECKPOINT, RECOVERY_POINT and IDLE_OR_NO_LOCAL_PROGRESS records."
    - "Authorized checkpoint branches or checkpoint SHAs named by the agent."
    - "User-supplied local SHA or local report that may not yet be remotely resolvable."
    - "Proactive discoveries, unplanned improvements, alternatives, rejected ideas and UNKNOWN registries."
    - "Negative results, surviving mutants, skipped cases, stale assumptions and contradictions."
    - "Cross-agent interfaces, canonical ownership, existing runtimes and duplicate-system risk."
    - "Relevant issues, parent program decisions, dependency gates and current pauses."
  visibility_preflight:
    mandatory: true
    steps:
      - "Check active PR heads and commit chains."
      - "Search PR and Issue comments for current in-progress visibility packets and local-progress language."
      - "Fetch any named public-safe checkpoint ref."
      - "Determine whether the remote branch is complete, local progress is reported, local state is unknown, or the agent explicitly reports no local work."
    inference_rules:
      - "An unchanged PR head proves only NO_REMOTE_VERIFIABLE_DELIVERY."
      - "Do not state NO_NEW_PROGRESS unless a current IDLE_OR_NO_LOCAL_PROGRESS packet exists or equivalent evidence is independently confirmed."
      - "A reported local commit is LOCAL_PROGRESS_REPORTED_NOT_VERIFIED until its commit, tree and diff are remotely fetchable."
      - "A checkpoint ref can guide preservation and routing but cannot satisfy final tested/receipt acceptance gates."
  no_summary_only_rule: true
  remote_truth_over_report_rule: true
  remote_absence_does_not_prove_local_absence: true
  agent_self_approval_forbidden: true
  GPT_independent_reasoning_required: true
  system_level_questions:
    - "Does the implementation solve the underlying goal rather than only the literal task wording?"
    - "Which proactive additions are high-value and compatible with the wider system?"
    - "Which additions duplicate, conflict with or weaken an existing canonical capability?"
    - "Are interfaces, ownership, schemas and authority boundaries coherent across modules?"
    - "Are tests semantically meaningful or merely count, presence or self-consistency checks?"
    - "What evidence would falsify the claimed result, and was that evidence actually exercised?"
    - "Does accepting this work improve total-system operability, maintainability and future leverage?"
    - "What adjacent problems or high-value opportunities should be absorbed into the next mission?"
    - "Is there local progress that is reported or structurally possible but not yet remotely reviewable?"
  required_component_dispositions:
    - "ACCEPT_AS_IS"
    - "ACCEPT_AND_INTEGRATE"
    - "ACCEPT_WITH_GPT_REFINEMENT"
    - "PARTIAL_ACCEPT_REMOVE_INCOHERENT_PORTIONS"
    - "RETURN_FOR_REMEDIATION"
    - "SPLIT_AND_ROUTE"
    - "DEFER_WITH_OWNER_AND_TRIGGER"
    - "REJECT_PRESERVE_EVIDENCE"
  review_output_must_separate:
    - "Accepted facts and implementation boundaries."
    - "Useful proactive additions accepted for integration."
    - "Improvements GPT will make directly in contracts, routing or architecture."
    - "Defects returned to the agent with exact acceptance gates."
    - "Incoherent or duplicate candidate parts to remove or deprecate."
    - "New high-value goals and adjacent work candidates."
    - "Unresolved UNKNOWNs, negative findings and risks."
    - "Remote-verifiable state versus local-reported or local-unknown state."
    - "Whole-system fit, dependency impact and release consequences."
  architecture_integrity_gate:
    must_pass:
      - "No second canonical system without an explicit migration decision."
      - "No cross-agent ownership collision or silent branch takeover."
      - "No incompatible schema or interface drift left unaccounted for."
      - "No candidate, plan or self-report silently promoted to implemented fact or authority."
      - "No weakening or deletion of negative evidence to manufacture success."
      - "No unauthorized real-data, replay, backtest, model fitting, performance, account, order or trade expansion."
      - "The accepted subset can be integrated, tested, rolled back and operated coherently."

publish_task_protocol:
  prerequisite: >-
    Use the latest valid review state. When material evidence changed after the last review, refresh the review before publishing.
    Before superseding an active route, inspect the latest in-progress visibility state and preserve or explicitly disposition local work.
  task_design_defaults:
    - "Prefer larger coherent multi-stage missions over repeated micro-remediation when boundaries can be made explicit."
    - "Preserve accepted work and repair only the defective boundary instead of rebuilding useful foundations."
    - "Absorb safe, high-value adjacent discoveries and proactive improvements into the mission."
    - "Separate different authority surfaces or ownership boundaries into different PRs."
    - "Define internal stage gates that allow autonomous continuation when evidence passes."
    - "Require complete machine evidence and a final GPT second-pass review."
    - "When local progress is reported or unknown, include an explicit preserve, bridge, isolate or discard-with-reason policy."
  autonomy_allocation:
    CODEX:
      default: "HIGH_WITH_EXPLICIT_FIREWALLS"
      encouraged_freedom:
        - "Architecture, module layout, algorithms, internal implementation order and test framework."
        - "Authorized AMED A/B adjacent defect repair and high-value capability improvement."
        - "Additional contracts, validators, observability, negative tests and reproducibility evidence."
        - "Controlled multi-branch and multi-Draft-PR execution inside the published budget."
        - "Evidence-driven replanning between internal gates without waiting for every micro-approval."
        - "One public-safe checkpoint ref per active gate to preserve material in-progress work without polluting final commit shape."
      reminders_and_hard_gates:
        - "No self-approval, merge, direct main write, force push or history rewrite."
        - "No cross-agent ownership takeover or second canonical runtime."
        - "No unsupported claim promotion, test weakening or hidden UNKNOWN deletion."
        - "No secret-bearing checkpoint push."
        - "No real-data admission, replay, backtest, fitting, performance claim, account, order or trade without a separate route."
    QCLAW:
      default: "KNOWLEDGE_SUPPLY_BOUNDED_AUTONOMY"
      encouraged_freedom:
        - "Source conflict discovery, atomization, relationship mapping, adversarial cases, UNKNOWNs and candidate adapters."
        - "Safe AMED A/B repairs inside QCLAW-owned candidate and knowledge-supply paths."
      reminders_and_hard_gates:
        - "All outputs remain candidate until GPT accepts them."
        - "No second canonical memory, retrieval, fusion or knowledge-gateway runtime."
        - "No edits to Codex or WorkBuddy runtime ownership."
    WORKBUDDY:
      default: "LOCAL_REALITY_BOUNDED_AUTONOMY_WHEN_EXPLICITLY_ACTIVE"
      encouraged_freedom:
        - "Local capability discovery, deployment, data quality, permission, service and failure reproduction improvements."
      reminders_and_hard_gates:
        - "No automatic resume while paused."
        - "No unapproved service lifecycle, authority, credential export, real-data admission or trading action."
  every_published_task_must_define:
    - "Mode label and reason."
    - "Fundamental goal and position in the total system."
    - "Reviewed/base heads and accepted boundaries."
    - "Primary stages, deliverables and semantic success criteria."
    - "Autonomy level and explicitly encouraged initiative zones."
    - "Caution areas, prohibited actions and stop conditions."
    - "Authorized paths, branches, PR budget and cross-agent firewalls."
    - "Active discovery and adjacent-work expectations."
    - "In-progress visibility and route-bridge expectations for material local work."
    - "Evidence, negative-test, reproducibility and receipt requirements."
    - "Dependencies, downstream integration and rollback."
    - "Exact completion signal and GPT final-review requirement."
  publication_actions:
    - "Write or update the machine-readable active route on latest main."
    - "Synchronize the relevant PR titles/bodies and source/parent issue comments."
    - "Update central coordination and resource allocation when materially changed."
    - "Preserve paused agents as execution_allowed false unless explicitly reactivated."
    - "State the route-transition treatment of reported or unknown local work."
    - "Read back the remote route and human entrypoints after publication."
  final_control_rule: >-
    Agent autonomy is intentionally broad inside the published task firewall. GPT retains control of overall roadmap, tempo,
    cross-agent integration, acceptance, release and whether the entire system remains coherent and operational.

combined_command_behavior:
  phrases_like: ["审查并发布任务", "审核成果后重新分配任务", "验收并派发下一轮"]
  required_order:
    - "Complete REVIEW_TASK protocol first, including visibility preflight."
    - "Freeze the review disposition, remote/local visibility state and accepted boundaries."
    - "Then execute PUBLISH_TASK protocol from that reviewed state."
  forbidden_shortcut: "Do not publish first and retrofit the review afterward."

memory_and_persistence:
  user_intent: "PERMANENT_LONG_TERM_OPERATING_RULE"
  applies_to_future_conversations: true
  applies_across_agent_and_epoch_changes: true
  not_limited_to_current_task: true
  project_memory_location:
    - "This protocol."
    - "The in-progress visibility and route bridge protocol."
    - "A linked permanent governance decision record."
    - "Program Issue #31 external anchor."

security_and_release_boundaries:
  direct_main_write_by_executors: false
  auto_merge: false
  force_push: false
  history_rewrite: false
  issue92_implicit_release: false
  real_data_implicit_release: false
  replay_backtest_fitting_implicit_release: false
  account_order_trade_implicit_release: false

