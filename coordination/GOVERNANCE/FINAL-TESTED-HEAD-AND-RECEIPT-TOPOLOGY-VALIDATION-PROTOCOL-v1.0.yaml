schema_version: "1.0"
protocol_id: "FINAL-TESTED-HEAD-AND-RECEIPT-TOPOLOGY-VALIDATION"
status: "CANONICAL_GOVERNANCE"
owner: "GPT_COORDINATION"
purpose: >-
  Prevent a green receipt-head workflow or a declared correction chain from preserving an obsolete tested identity after executable,
  workflow, test, schema or verification-contract changes.

first_principles:
  - "The final tested head is the last commit containing any executable or evidence-validator behavior that contributes to acceptance."
  - "A later commit may retain the earlier tested identity only when every changed path is in an explicit evidence-only allowlist and no changed content alters validation semantics."
  - "Labels such as receipt, report, handoff or correction do not determine commit class; the Git diff does."
  - "Any executable-class change invalidates all earlier CI, archive and tested-head evidence."

executable_class_paths:
  patterns:
    - "**/*.py"
    - ".github/workflows/**"
    - "**/tests/**"
    - "**/*.schema.json"
    - "**/requirements*.txt"
    - "**/CONTRACTS.yaml"
    - "**/PROJECT-PLAN.yaml"
  semantic_rule: >-
    Any other configuration, prompt, policy or manifest whose content changes validator behavior, execution selection, artifact scope,
    authority, identity or acceptance conditions is executable-class even when its extension is Markdown or YAML.

evidence_only_requirements:
  - "The route declares an exact evidence-only path allowlist."
  - "Git compare from tested_head to receipt_parent contains only allowlisted paths."
  - "No allowlisted file changes executable commands, validator rules, test definitions, artifact-surface selection or acceptance semantics."
  - "The final receipt commit is non-empty and contains evidence only."
  - "The receipt head is externally anchored by full commit and tree SHA."

mandatory_validator_checks:
  - "Resolve tested_head, receipt_parent and receipt_head from Git objects rather than trusting narrative fields."
  - "Compare tested_head..receipt_parent and fail on any executable-class or semantic-validator change."
  - "Require the archive commit/tree to equal the final tested executable commit/tree."
  - "Require exact Python/runtime CI and archive evidence for that same tested head."
  - "Reject correction chains that contain executable-class changes while preserving an older tested identity."
  - "Reject stale run/job/artifact identifiers when a later final-head validation run exists."

failure_codes:
  - "FTH_EXECUTABLE_CHANGE_AFTER_TESTED_HEAD"
  - "FTH_ARCHIVE_BINDS_OBSOLETE_EXECUTABLE_STATE"
  - "FTH_RECEIPT_ALLOWLIST_VIOLATION"
  - "FTH_CORRECTION_CHAIN_MASKS_EVIDENCE_RESET"
  - "FTH_STALE_FINAL_RUN_IDENTITY"

remediation:
  rule: >-
    Move the tested identity forward to the last executable-class commit, rerun all required tests and archives on that commit, then
    create exactly one later evidence-only receipt commit and publish external full-SHA anchors.
  prohibited: ["amend", "rebase", "reset", "force_push", "merge_before_acceptance"]

applies_to: ["CODEX", "QCLAW", "WORKBUDDY", "all future agents"]
boundary: "CONTROL_PLANE_ONLY / NO_TRADE"
