schema_version: "1.1"
schema_id: "PROJECT-EXECUTION-ADAPTER-v1"
status: "CANDIDATE_REMEDIATED_PENDING_INDEPENDENT_REVIEW"
source_issue: 596

required_fields:
  - "project_id"
  - "display_name"
  - "global_protocol_id"
  - "inherits_global_invariants"
  - "control_plane_repository"
  - "execution_repository"
  - "repositories"
  - "canonical_entrypoints"
  - "authority"
  - "allowed_execution_carriers"
  - "default_model_profiles"
  - "collision_domains"
  - "tool_interfaces"
  - "hard_boundaries"
  - "acceptance"
  - "handoff"

semantics:
  project_id: "stable cross-window identity"
  global_protocol_id: "must equal UNIFIED-AGENT-EXECUTION-FABRIC-v1"
  inherits_global_invariants: "must be true"
  control_plane_repository: "canonical task/route/claim/lease/reservation/snapshot/batch authority root"
  execution_repository: "repository whose governed worktree/branch is modified"
  repositories: "all repos this project may read/write, with authority roles"
  canonical_entrypoints: "fresh bootstrap sources; chat history is never sole authority"
  authority: "project/domain/runtime SoRs that global fabric cannot overwrite"
  allowed_execution_carriers: "strict subset/equal of global carriers"
  default_model_profiles: "hints only; exact model resolved at dispatch"
  collision_domains: "single-writer/write-overlap protection"
  tool_interfaces: "MCP/local/browser/runtime interfaces with read/write authority"
  hard_boundaries: "project-specific restrictions in addition to global ones"
  acceptance: "project tests/evidence/CI/review requirements"
  handoff: "cross-project or cross-repo transfer rules"

weakening_forbidden:
  - "single_writer_per_collision_domain"
  - "exact_head_review_identity"
  - "no_self_review"
  - "no_self_merge"
  - "credential_secret_exclusion"
  - "active_task_authority_required"

semantic_validation:
  executable_validator: "coordination/GOVERNANCE/unified_execution_validation.py::validate_project_adapter"
  global_protocol_id_must_match: true
  inherits_global_invariants_must_be_true: true
  adapter_carriers_must_be_subset_of_global: true
  second_global_router_forbidden: true
  non_weakenable_invariant_false_override_forbidden: true
  control_and_execution_repository_must_be_explicit: true

extension_rule: >-
  Project adapters may add stronger safety gates, domain-specific SoRs, model preferences,
  test suites and tool restrictions, but may not invent a second global task router or weaken
  any global invariant. Cross-repo projects must explicitly separate control-plane and
  execution-repository semantics.
