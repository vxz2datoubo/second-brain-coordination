schema_version: "1.0"
schema_id: "PROJECT-EXECUTION-ADAPTER-v1"
status: "CANDIDATE_PENDING_INDEPENDENT_REVIEW"
source_issue: 596

required_fields:
  - "project_id"
  - "display_name"
  - "repositories"
  - "canonical_entrypoints"
  - "authority"
  - "allowed_execution_carriers"
  - "default_model_profiles"
  - "collision_domains"
  - "tool_interfaces"
  - "hard_boundaries"
  - "acceptance"
  - "handoff"

semantics:
  project_id: "stable cross-window identity"
  repositories: "all repos this project may read/write, with authority roles"
  canonical_entrypoints: "fresh bootstrap sources; chat history is never sole authority"
  authority: "project/domain/runtime SoRs that global fabric cannot overwrite"
  allowed_execution_carriers: "subset of global carriers"
  default_model_profiles: "hints only; exact model resolved at dispatch"
  collision_domains: "single-writer/write-overlap protection"
  tool_interfaces: "MCP/local/browser/runtime interfaces with read/write authority"
  hard_boundaries: "project-specific restrictions in addition to global ones"
  acceptance: "project tests/evidence/CI/review requirements"
  handoff: "cross-project or cross-repo transfer rules"

weakening_forbidden:
  - "single_writer_per_collision_domain"
  - "exact_head_review_identity"
  - "no_self_review"
  - "no_self_merge"
  - "credential_secret_exclusion"
  - "active_task_authority_required"

extension_rule: >-
  Project adapters may add stronger safety gates, domain-specific SoRs, model preferences,
  test suites and tool restrictions, but may not invent a second global task router.
