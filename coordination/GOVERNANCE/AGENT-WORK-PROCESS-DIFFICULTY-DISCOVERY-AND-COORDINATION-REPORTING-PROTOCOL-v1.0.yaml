schema_version: "1.0"
protocol_id: "AGENT-WORK-PROCESS-DIFFICULTY-DISCOVERY-AND-COORDINATION-REPORTING-0001"
short_name: "WPDCR"
status: "ACTIVE_ENTERPRISE_STANDARD"
authority_scope: "all_non_trivial_agent_tasks_and_all_cross_agent_coordination"
applies_to: [GPT, CODEX, QCLAW, WORKBUDDY, FUTURE_AGENT]
parent_policies:
  - "coordination/GOVERNANCE/AMED-ENTERPRISE-POLICY-v1.0.yaml"
  - "coordination/GOVERNANCE/AGENT-PROACTIVE-DISCOVERY-AND-REALTIME-ESCALATION-PROTOCOL-v1.0.yaml"
  - "coordination/GOVERNANCE/DUAL-LAYER-INITIATIVE-AND-GPT-ORCHESTRATION-CONSTITUTION-v1.0.yaml"
template: "coordination/TEMPLATES/AGENT-WORK-PROCESS-AND-COORDINATION-REPORT-TEMPLATE-v1.0.yaml"
boundary: "PUBLIC_SAFE / authority_bounded / research_only / NO_TRADE unless separately authorized"

purpose: >-
  Make every coordination report explain not only what was completed, but how the work unfolded, what made it difficult,
  what changed unexpectedly, what new opportunities appeared, what remains hard or unresolved, what problems were found,
  and exactly what coordination or decision is required from another agent, GPT or the user. The protocol prevents
  completion-only reporting, hidden struggle, late blocker disclosure, lost discoveries and vague handoffs.

core_principles:
  - id: "P1_PROCESS_IS_EVIDENCE"
    rule: "Important changes of approach, failed attempts, pivots and validation steps are part of the auditable evidence, not disposable chat history."
  - id: "P2_DIFFICULTY_MUST_BE_EXPLAINED_NOT_PERFORMED"
    rule: "Difficulty claims require concrete causes and evidence; they may not be used to inflate progress, excuse missing evidence or dramatize routine work."
  - id: "P3_UNEXPECTED_FINDINGS_ARE_FIRST_CLASS_OUTPUTS"
    rule: "Unexpected positive, negative, contradictory and unknown findings must be separated from planned deliverables and preserved."
  - id: "P4_COORDINATION_REQUESTS_MUST_BE_ACTIONABLE"
    rule: "A request must name the owner, exact needed action or decision, evidence package, urgency, dependency and whether unaffected work can continue."
  - id: "P5_NO_SILENT_EMPTY_SECTIONS"
    rule: "Every mandatory section must be populated or explicitly state NONE_OBSERVED / NONE_REQUIRED with the checks performed."
  - id: "P6_REPORT_BEFORE_SCOPE_OR_AUTHORITY_CHANGE"
    rule: "A discovery or difficult problem does not authorize task switching, cross-agent takeover, canonical promotion or safety-boundary expansion."
  - id: "P7_PLAIN_LANGUAGE_AND_MACHINE_TRUTH"
    rule: "Material findings require both machine-readable fields and a plain-language explanation of meaning, impact and what the evidence does not prove."

mandatory_reporting_moments:
  LEASE_CLAIM:
    required: true
    purpose: "Confirm task truth and surface expected hard parts, dependencies and likely coordination needs before implementation."
  CHECKPOINT:
    required: true
    triggers:
      - "A major milestone or validation gate is reached."
      - "The implementation approach changes materially."
      - "A difficulty reaches D2_HARD or above."
      - "An S2+ discovery, meaningful negative result or cross-agent dependency appears."
      - "Work pauses, is handed off, or remote visibility is required."
  BLOCKER_OR_ESCALATION:
    required: true
    timing: "IMMEDIATE_FOR_S3_S4_OR_D3_D4; NEXT_CHECKPOINT_FOR_S2_OR_D2"
  COMPLETION:
    required: true
    purpose: "Provide cumulative work-process, difficulty, discovery, unresolved-problem and coordination truth alongside tested deliverables."
  HANDOFF_OR_ROUTE_CHANGE:
    required: true
    purpose: "Prevent loss of context when work changes agent, PR, Gate, route epoch or owner."

mandatory_report_sections:
  - section: "PRIMARY_WORK_AND_PROCESS_TRACE"
    required_fields:
      - original_goal
      - work_stages_completed
      - current_state
      - approach_taken
      - approach_changes_and_why
      - failed_or_discarded_attempts
      - evidence_and_validation
      - remaining_work
    rules:
      - "Report meaningful process transitions, not private chain-of-thought or token-by-token narration."
      - "Each failed attempt must state what was learned and whether a regression test or rule was added."

  - section: "DIFFICULTY_AND_COMPLEXITY"
    required_fields:
      - planned_difficulty
      - actual_difficulty
      - hardest_parts
      - why_each_part_was_hard
      - evidence_of_difficulty
      - complexity_sources
      - effort_or_iteration_deviation
      - simplifications_found
      - residual_difficulty
    difficulty_scale:
      D0_ROUTINE: "Known path, deterministic edit or check, no material uncertainty."
      D1_MODERATE: "Several dependent steps or nontrivial validation, but known solution family."
      D2_HARD: "Multiple failed attempts, conflicting constraints, hidden dependency or difficult reproduction."
      D3_VERY_HARD: "Core assumption invalid, cross-module conflict, major blocker or uncertain solution requiring coordination."
      D4_RESEARCH_UNKNOWN: "No reliable solution path, new domain or evidence gap requiring independent research or user decision."
    evidence_examples:
      - "Number and identity of failed tests or reproductions."
      - "Approach pivots, incompatible interfaces, missing evidence or dependency conflicts."
      - "Changed-file, runtime, data, performance or environment complexity."
    prohibitions:
      - "Do not infer difficulty from elapsed time alone."
      - "Do not label work hard merely because the report is long."
      - "Do not hide an easier valid solution to justify a preferred architecture."

  - section: "NEW_AND_UNEXPECTED_DISCOVERIES"
    required_fields:
      - discovery_id
      - expected_or_unexpected
      - discovery_type
      - verified_fact
      - inference_or_hypothesis
      - evidence
      - severity
      - affected_scope
      - immediate_impact
      - downstream_impact
      - what_it_does_not_prove
      - action_taken
      - recommended_disposition
    discovery_classes:
      - EXPECTED_CONFIRMATION
      - UNEXPECTED_POSITIVE
      - UNEXPECTED_NEGATIVE
      - CONTRADICTION
      - NEW_UNKNOWN
      - REUSE_OPPORTUNITY
      - DUPLICATION_OR_DEPRECATION_CANDIDATE
      - CROSS_MODULE_EFFECT
      - USER_REQUIREMENT_MISMATCH
    no_discovery_rule: >-
      When no material discovery exists, report NONE_OBSERVED and list the repository, tests, interfaces, sources or local reality
      that were checked. A blank section is invalid.

  - section: "EXPANDABLE_IDEAS_AND_HIGH_VALUE_OPPORTUNITIES"
    required_fields:
      - opportunity_id
      - idea
      - originating_observation
      - expected_value
      - system_reuse_or_duplication_check
      - estimated_cost_and_complexity
      - risks_and_negative_effects
      - AMED_class
      - recommended_owner
      - recommended_mode
      - prerequisites
      - validation_gate
      - activation_trigger
      - current_disposition
    rules:
      - "Separate implemented A/B improvements from C proposals and D/user-gated ideas."
      - "An attractive idea without owner, trigger and validation gate is not an actionable proposal."
      - "Do not create a new workstream when reuse, adaptation, migration or deprecation is better."

  - section: "UNRESOLVED_HARD_PROBLEMS_AND_UNKNOWNS"
    required_fields:
      - problem_id
      - plain_language_problem
      - why_difficult
      - attempts_made
      - evidence_obtained
      - current_unknowns
      - blocked_by
      - minimum_information_or_capability_needed
      - safe_workaround_or_abstention
      - risk_if_deferred
      - owner
      - escalation_level
      - closure_condition
    rules:
      - "Do not report a blocker without stating what was attempted."
      - "Do not turn lack of effort into UNKNOWN."
      - "If no reliable workaround exists, state ABSTAIN_OR_STOP rather than guess."

  - section: "PROBLEMS_FAILURES_AND_NEGATIVE_RESULTS"
    required_fields:
      - problem_id
      - symptom
      - root_cause_or_best_current_hypothesis
      - evidence
      - severity
      - affected_scope
      - reproduction
      - temporary_mitigation
      - permanent_fix_or_follow_up
      - regression_protection
      - status
    rules:
      - "Preserve no-increment, failed, contradictory and simpler-baseline-wins results."
      - "A green final run does not erase failures encountered during the work."

  - section: "COORDINATION_REQUESTS"
    required_fields:
      - request_id
      - requested_from
      - exact_action_input_access_or_decision_needed
      - reason
      - evidence_or_handoff_reference
      - urgency
      - dependency_or_blocked_gate
      - work_that_can_continue_without_it
      - deadline_or_activation_trigger
      - privacy_permission_or_user_gate
      - status
    statuses:
      - NONE_REQUIRED
      - REQUESTED
      - ACKNOWLEDGED
      - IN_PROGRESS
      - SATISFIED
      - DEFERRED_WITH_TRIGGER
      - REJECTED_WITH_REASON
    rules:
      - "Avoid vague requests such as please coordinate or need more information."
      - "Name the exact file, field, decision, environment access, test or review needed."
      - "State whether the request blocks all work or only an affected scope."

  - section: "CROSS_AGENT_HANDOFF_AND_SYSTEM_IMPACT"
    required_fields:
      - incoming_dependencies
      - outgoing_handoffs
      - authoritative_source_of_truth
      - files_commits_or_artifacts
      - interface_assumptions
      - disagreements_or_conflicts
      - affected_agents_modules_or_tasks
      - ownership_boundary
      - acceptance_gate
      - rollback_or_recovery
    rules:
      - "Preserve disagreements; do not rewrite evidence to manufacture consensus."
      - "Every handoff must identify the receiving owner and what the receiver should verify rather than merely trust."

  - section: "DECISIONS_ALTERNATIVES_AND_LESSONS"
    required_fields:
      - key_decisions
      - decision_basis
      - alternatives_considered
      - alternatives_rejected_and_why
      - reusable_lessons
      - rules_templates_tests_or_blueprints_to_update
    rules:
      - "Record decision pivots caused by new evidence."
      - "A reusable lesson requires applicability conditions and failure conditions."

  - section: "NEXT_ACTION_AND_GATE"
    required_fields:
      - recommended_next_action
      - owner
      - priority
      - prerequisites
      - success_gate
      - stop_condition
      - route_or_task_change_required
      - user_decision_required
      - completion_or_checkpoint_signal

report_completeness_rules:
  all_sections_required_for_standard_and_strategic: true
  light_tasks:
    compact_inline_report_allowed: true
    must_include:
      - "work process"
      - "actual difficulty"
      - "discoveries or NONE_OBSERVED"
      - "unresolved problems or NONE"
      - "coordination requests or NONE_REQUIRED"
      - "next action"
  blank_section_invalid: true
  placeholder_values_invalid:
    - TBD
    - TODO
    - UNKNOWN_WITHOUT_REASON
    - VAR
    - ELLIPSIS
    - N_A_WITHOUT_EXPLANATION
  completion_signal_without_report_invalid: true
  difficulty_without_evidence_invalid: true
  blocker_without_attempts_and_exact_request_invalid: true
  opportunity_without_owner_trigger_and_gate_invalid: true

checkpoint_delta_rule: >-
  Checkpoint reports may include only changes since the prior accepted report, but must carry forward all unresolved D2+ difficulties,
  S2+ discoveries, open coordination requests, unresolved hard problems and negative results until explicitly closed.

agent_specific_emphasis:
  CODEX:
    - "Architecture and implementation pivots, test difficulty, hidden dependencies, technical debt and cross-module interface requests."
  QCLAW:
    - "Source conflicts, knowledge gaps, contradictory evidence, maturity inflation, unexpected conceptual links and research coordination."
  WORKBUDDY:
    - "Local environment difficulty, permissions, service state, path and deployment surprises, data-quality problems and required access."
  GPT:
    - "Cross-agent synthesis, priority conflict, ownership, route changes, acceptance decisions and user-facing explanation."

GPT_obligations:
  - "Reject or remediate reports that omit mandatory sections or use placeholders."
  - "Distinguish execution difficulty from poor planning, missing evidence, environment change and unknown unknown."
  - "Route actionable coordination requests to the correct owner and track them until satisfied, rejected or deferred with a trigger."
  - "Convert accepted reusable lessons into permanent protocol, template, test, blueprint or task-route updates."
  - "Summarize material difficulty, unexpected discovery and unresolved risk to the user rather than reporting only PASS/FAIL."
  - "Do not expose private chain-of-thought; request concise decision rationale, observable process and evidence instead."

anti_patterns:
  - "COMPLETION_ONLY_REPORT"
  - "ALL_TESTS_PASS_SO_NO_PROBLEMS_EXIST"
  - "VAGUE_DIFFICULTY_CLAIM"
  - "BLOCKED_WITHOUT_ATTEMPTS"
  - "COORDINATION_REQUEST_WITHOUT_OWNER_OR_ACTION"
  - "DISCOVERY_HIDDEN_UNTIL_COMPLETION"
  - "IDEA_DUMP_WITHOUT_VALUE_COST_OWNER_OR_GATE"
  - "SILENT_HANDOFF"
  - "ERASING_FAILED_APPROACHES"
  - "USING_PRIVATE_CHAIN_OF_THOUGHT_AS_REQUIRED_EVIDENCE"

integration_requirements:
  AGENTS_must_reference: true
  task_routers_must_reference: [CODEX, QCLAW, WORKBUDDY]
  AMED_delivery_must_include_report: true
  active_tasks_inherit_without_route_reissue: true
  inheritance_rule: >-
    Existing active tasks inherit this reporting protocol for all future checkpoints, handoffs and completion reports. The protocol
    does not change their task_id, route_epoch, branch, PR, scope or completion signal, so no lease reissue is required solely for adoption.
  future_task_briefs_must_reference: true
  final_handoff_must_include_report_or_exact_link: true

security:
  public_safe_remote_reports_only: true
  private_chain_of_thought_not_required: true
  secret_values_denied: true
  restricted_raw_data_denied: true
  direct_main_write_by_executors: false
  auto_merge: false
  real_trade_denied: true

