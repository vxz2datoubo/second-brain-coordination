schema_version: "1.1"
protocol_id: "PROACTIVE-MISSION-AUTHORING-AND-BOUNDED-INITIATIVE-GRANT-0001"
short_name: "PMA-BIG"
status: "ACTIVE_ENTERPRISE_STANDARD"
authority_scope: "all_non_trivial_task_assignment_authoring_and_route_publication"
applies_to_task_authors: [GPT, FUTURE_ORCHESTRATOR]
applies_to_executors: [CODEX, QCLAW, WORKBUDDY, FUTURE_AGENT]
parent_policies:
  - "coordination/GOVERNANCE/AMED-ENTERPRISE-POLICY-v1.0.yaml"
  - "coordination/GOVERNANCE/DUAL-LAYER-INITIATIVE-AND-GPT-ORCHESTRATION-CONSTITUTION-v1.0.yaml"
  - "coordination/GOVERNANCE/AGENT-WORK-PROCESS-DIFFICULTY-DISCOVERY-AND-COORDINATION-REPORTING-PROTOCOL-v1.0.yaml"
  - "coordination/GOVERNANCE/AGENT-READ-TASK-CLAIM-AND-EXECUTE-COMMAND-SEMANTICS-v1.0.yaml"
task_brief_template: "coordination/TEMPLATES/AMED-TASK-BRIEF-TEMPLATE-v1.0.yaml"
boundary: "PUBLIC_SAFE / authority_bounded / research_only / NO_TRADE unless separately authorized"

purpose: >-
  Require every non-trivial task to be authored as a bounded proactive mission rather than a passive checklist. The assignment
  explicitly authorizes optimization for the fundamental goal, better internal methods, discovery, unresolved-problem truth,
  precise coordination and system feedback. It also makes 读取任务 a one-command read-claim-execute cycle rather than a read-only step.

assignment_principles:
  - id: "A1_FUNDAMENTAL_GOAL_OVER_LITERAL_CHECKLIST"
    rule: "The executor is responsible for the real outcome and causal mechanism, not literal step completion only."
  - id: "A2_INITIATIVE_MUST_BE_EXPLICITLY_GRANTED"
    rule: "Every assignment states what may be chosen, inspected, improved and implemented, and what remains proposal-only/prohibited."
  - id: "A3_BETTER_THAN_REQUESTED_WITH_EVIDENCE"
    rule: "Inside A/B authority and scope, implement demonstrably better methods when value, evidence, complexity and rollback tests pass."
  - id: "A4_DISCOVERY_IS_A_PRIMARY_ASSIGNMENT_OUTPUT"
    rule: "Require search for false assumptions, dependencies, missing requirements, negative results, alternatives, reuse, duplication, gaps and UNKNOWNs."
  - id: "A5_UNSOLVED_TRUTH_OVER_GUESSED_COMPLETION"
    rule: "Identify what remains unsolved, attempts, missing evidence/capability and safe abstention."
  - id: "A6_COORDINATION_MUST_BE_DESIGNED_IN_ADVANCE"
    rule: "Name upstream/downstream owners, handoffs, decision gates and exact coordination request shape."
  - id: "A7_SYSTEM_FEEDBACK_IS_REQUIRED_BUT_GATED"
    rule: "Ask whether findings update protocols, templates, tests, blueprints, skills, routes, deprecations, lessons or tasks; major changes need GPT/user gates."
  - id: "A8_INITIATIVE_DOES_NOT_AUTHORIZE_SCOPE_EXPLOSION"
    rule: "Primary mission first; no unrelated workstream, ownership takeover, second canonical, test weakening or ungated implementation."
  - id: "A9_READ_TASK_MEANS_EXECUTE"
    rule: >-
      Every published route states that 读取任务 means read latest truth, claim a valid lease and immediately begin substantive
      execution. A summary-only or plan-only response and a request for a second start command are invalid.

mandatory_assignment_sections:
  - FUNDAMENTAL_GOAL_AND_SUCCESS_MODEL
  - PRIMARY_DELIVERY_AND_NON_NEGOTIABLES
  - PROACTIVE_MISSION_AND_BETTER_METHOD_MANDATE
  - READ_CLAIM_EXECUTE_CONTRACT
  - MANDATORY_DISCOVERY_QUESTIONS
  - ANTICIPATED_DIFFICULTY_AND_UNKNOWNS
  - EXPLORATION_AND_AUTHORITY_BUDGET
  - COORDINATION_AND_HANDOFF_DESIGN
  - SYSTEM_FEEDBACK_AND_DOUBLE_LOOP_TARGETS
  - EVIDENCE_REPORTING_AND_SECOND_PASS

read_claim_execute_contract:
  required_fields:
    - trigger_phrases
    - canonical_action
    - second_user_start_command_required
    - read_only_acknowledgement_forbidden
    - plan_only_response_when_ready_forbidden
    - minimum_progress_before_return
    - non_executable_route_report_shape
  required_values:
    canonical_action: "READ_LATEST_ROUTE_CLAIM_VALID_LEASE_AND_EXECUTE_IMMEDIATELY"
    second_user_start_command_required: false
    read_only_acknowledgement_forbidden: true
    plan_only_response_when_ready_forbidden: true

mandatory_discovery_questions:
  - "What can be done more reliably, simply, safely or completely than the literal wording?"
  - "Which assumptions, dependencies, requirements, tests, interfaces or sources may be wrong, stale or missing?"
  - "What can be reused, adapted, integrated, generalized, simplified, migrated or deprecated?"
  - "What valuable extension becomes visible and what evidence would justify it?"
  - "What remains unresolved inside current evidence, authority or budget?"
  - "Who needs to coordinate exactly what input, access, decision, test or review?"
  - "Which discoveries should feed back into protocols, templates, tests, blueprints, skills, routes, lessons or tasks?"

assignment_quality_gate:
  required_before_READY:
    - "Mode and reason are explicit."
    - "Fundamental goal, mechanism, success, failure and stop conditions exist."
    - "Minimum delivery and frozen constraints are separated from executor choices."
    - "Meaningful bounded initiative and A/B/C/D boundaries exist."
    - "Seven discovery questions exist."
    - "Expected difficulty/UNKNOWNs and blocker evidence exist."
    - "Coordination design and system-feedback targets exist."
    - "Exploration, ownership, path, WIP, privacy, license, canonical and safety firewalls exist."
    - "WPDCR and read-claim-execute semantics exist."
  executor_must_be_authorized_to:
    - "Choose better internal methods when value/evidence/boundary/rollback tests pass."
    - "Inspect relevant adjacent modules, tests, interfaces, capabilities and lessons."
    - "Implement authorized A/B improvements without micro-instructions."
    - "Propose C opportunities with owner, trigger, cost, risk, validation and closure."
    - "Stop/abstain on D/user-gated or unsupported work rather than guess."
  invalid_assignment_patterns:
    - LITERAL_CHECKLIST_WITH_NO_FUNDAMENTAL_GOAL
    - VAGUE_USE_YOUR_JUDGMENT_WITH_NO_AUTHORITY_BOUNDARY
    - DISCOVER_MORE_WITH_NO_QUESTIONS_BUDGET_OR_OUTPUT
    - DO_MORE_WITHOUT_VALUE_TEST_OR_ROLLBACK
    - PROPOSE_IDEAS_WITHOUT_OWNER_TRIGGER_COST_RISK_AND_GATE
    - BLOCKED_ALLOWED_WITHOUT_ATTEMPTS_AND_EXACT_COORDINATION_REQUEST
    - SYSTEM_FEEDBACK_WITHOUT_GPT_ACCEPTANCE_BOUNDARY
    - AUTONOMY_THAT_CHANGES_SCOPE_OWNER_CANONICAL_PERMISSION_OR_SAFETY
    - READ_TASK_AS_NAVIGATION_OR_SUMMARY
    - SECOND_START_COMMAND_REQUIRED_WHEN_ROUTE_IS_READY
  READY_gate: >-
    A non-trivial task may not be READY when proactive mission, discovery questions, difficulty/UNKNOWNs, coordination, system
    feedback, exploration/firewalls, WPDCR or read-claim-execute semantics are absent.

executor_acceptance_duty:
  lease_claim_must_confirm:
    - "fundamental goal"
    - "authorized methods and A/B/C/D boundary"
    - "seven discovery questions"
    - "difficulty/UNKNOWN and exact coordination duties"
    - "system-feedback duty"
    - "读取任务 means immediate execution after claim"
  first_response_after_trigger:
    READY_route: "Perform first meaningful authorized action and evidence before returning."
    non_executable_route: "Report exact failed field, attempts, minimum missing capability, affected/unaffected scope, exact owner request and reactivation condition."

anti_scope_explosion:
  primary_task_first: true
  more_output_is_not_better: true
  reuse_before_new: true
  A_B_may_implement: true
  C_proposal_only: true
  D_stop_and_escalate: true
  executor_self_approval_forbidden: true

agent_specific_authoring:
  CODEX:
    emphasize: [architecture, implementation, tests, determinism, interfaces, foundational_defects, immediate_execution]
  QCLAW:
    emphasize: [source_conflict, counterevidence, knowledge_gaps, candidate_skills, maturity_audit, immediate_execution]
  WORKBUDDY:
    emphasize: [local_reality, permissions, paths, services, data_quality, performance, deployment, pause_gate]

GPT_review_duty:
  - "Review whether task authoring gave enough direction and bounded freedom."
  - "Review whether executor actually executed after 读取任务 or stopped after reading/planning."
  - "Repair task/command semantics when authoring caused passive behavior."
  - "Do not blame only the executor for a mechanically authored task."

active_task_inheritance: >-
  Existing active tasks inherit better-method, discovery, unresolved-problem, precise-coordination, system-feedback and read-claim-
  execute duties without expanding scope or authority. Route reissue is needed only when actual task, owner, scope or safety changes.

memory_and_persistence:
  user_intent: "PERMANENT_LONG_TERM_OPERATING_RULE"
  applies_to_future_conversations: true
  applies_across_agent_and_epoch_changes: true

updated_by: "GPT"
