schema_version: "1.1"
protocol_id: "AGENT-MODEL-REASONING-EXECUTION-INTENSITY-AND-DELEGATED-INTELLIGENCE-ROUTING-0001"
short_name: "MREI-DIR"
chinese_name: "模型与推理等级用户通知和手动选择协议"
status: "ACTIVE_ENTERPRISE_STANDARD"
authority_scope: "all_non_trivial_task_authoring_execution_and_second_pass_review"
applies_to_task_authors: [GPT, FUTURE_ORCHESTRATOR]
applies_to_executors: [CODEX, QCLAW, WORKBUDDY, FUTURE_AGENT]
profile_template: "coordination/TEMPLATES/MODEL-REASONING-EXECUTION-PROFILE-TEMPLATE-v1.0.yaml"
boundary: "ADVISORY_ONLY / USER_SELECTS / AGENT_SETTING_MUTATION_FORBIDDEN / NO_TRADE unless separately authorized"

purpose: >-
  For every non-trivial task, tell the user which model class or exact model and which reasoning level are recommended,
  explain the quality/cost reason, and let the user make the software selection. Model advice is planning metadata only.
  It is never authority for GPT, Codex, QCLAW, WorkBuddy, scripts, agents or automations to alter application/runtime settings.

selection_authority:
  owner: "USER_ONLY"
  rule: >-
    Only the user may change the selected model, reasoning level, default model, thread model, subagent model or persisted
    model configuration in ChatGPT, Codex or another agent product.
  task_author_duty: "Notify the user of the recommendation before execution when a change from the current selection would matter."
  executor_duty: "Use the user-selected/current environment as found; report limitations or mismatch, but do not change it."

hard_prohibition_on_setting_mutation:
  enabled: true
  prohibited_actors: [GPT, CODEX, QCLAW, WORKBUDDY, FUTURE_AGENT, SCRIPT, AUTOMATION]
  prohibited_actions:
    - "Change a ChatGPT or Codex model picker selection."
    - "Change reasoning effort, thinking level, pro/standard mode or default execution profile."
    - "Write model or reasoning fields into user-level or project-level Codex configuration."
    - "Create or edit agent TOML files to force a model or reasoning level."
    - "Change environment variables, registry/application state, workspace settings, thread settings or automation defaults for model routing."
    - "Restart, reinstall, reset, sign out, clear state or migrate configuration merely to apply a model recommendation."
  examples_of_protected_surfaces:
    - "ChatGPT/Codex model picker and thread settings"
    - "user and project Codex config.toml"
    - ".codex/agents and user agent configuration"
    - "IDE/workspace model settings"
    - "application databases, preferences and automation defaults"
  recommendation_is_not_permission: true
  task_metadata_is_not_permission: true
  route_metadata_is_not_permission: true

narrow_restoration_exception:
  allowed_only_when: >-
    The user explicitly asks to undo an earlier agent-caused model-setting change and trustworthy evidence identifies the exact
    pre-change value or exact pre-change bytes.
  requirements:
    - "Identify the agent-caused mutation before writing."
    - "Prefer an exact backup, snapshot, transaction log or verified before-state."
    - "Restore only the proven changed fields; preserve all unrelated bytes/settings."
    - "Never infer the old value from this protocol, a model matrix, web guidance or a recommendation."
    - "If no trustworthy before-state exists, stop with BLOCKED_NO_TRUSTWORTHY_PRECHANGE_STATE and make no write."
    - "Never expose or commit local secrets, sessions, tokens, cookies or complete private configuration."

operator_advisory_levels:
  FAST_LOW:
    description: "Fast/low-cost model with low or medium reasoning."
    use_when: ["formatting", "deterministic scans", "repetitive validation", "simple known-path edits"]
  BALANCED:
    description: "Balanced model with medium or high reasoning."
    use_when: ["ordinary implementation", "bounded debugging", "standard integration", "routine review"]
  HIGH:
    description: "Highest suitable model with high or extra-high reasoning."
    use_when: ["architecture", "subtle evidence truth", "cross-module invariants", "difficult restoration", "security review"]
  MAXIMUM:
    description: "Highest available model with maximum reasoning, reserved for rare quality-first work."
    use_when: ["major ambiguous system design", "final adversarial arbitration", "high-cost error with no reliable known path"]

advisory_selection_rule:
  - "Recommend the least expensive level likely to pass the quality gate."
  - "Increase the recommendation when uncertainty, reversibility risk or error cost justifies it."
  - "State whether the advice is a generic level or an exact currently visible model name."
  - "Do not assume a model is available; ask the user to choose the closest visible option when exact availability differs."
  - "Do not block deterministic work solely because the user keeps the current model, unless quality/safety would become unreliable."

mandatory_task_advisory:
  required_before_READY: true
  fields:
    - recommendation_level
    - recommended_model_or_picker_label
    - recommended_reasoning_level
    - rationale
    - lower_cost_alternative
    - quality_risk_if_underpowered
    - user_action_required
    - agent_setting_mutation_forbidden
  user_action_required_value: "USER_MANUALLY_SELECTS_OR_KEEPS_CURRENT_SETTING"
  agent_setting_mutation_forbidden_value: true
  visible_placement: "Near the task mode/reason and in the user-facing dispatch message."

execution_behavior:
  before_substantive_work:
    - "Read the advisory as planning context only."
    - "Do not inspect or modify private model settings unless the active task is the narrow restoration exception."
    - "If runtime metadata is exposed, record it without changing it."
    - "If runtime metadata is not exposed, report ACCESS_NOT_EXPOSED; never guess."
  mismatch_behavior:
    - "Do not silently mutate settings to match the advisory."
    - "Report that the current selection may be underpowered or overpowered."
    - "For safety-critical quality gaps, stop and ask the user to select the recommended level."
    - "For ordinary work, continue only when acceptance criteria remain reliable."

reporting_contract:
  mandatory_WPDCR_section: "MODEL_REASONING_AND_EXECUTION_ADVISORY"
  required_fields:
    - recommended_model_or_level
    - recommended_reasoning_level
    - recommendation_rationale
    - user_was_notified
    - user_selection_observed_or_ACCESS_NOT_EXPOSED
    - agent_changed_model_setting
    - restoration_exception_used
    - quality_effect_or_residual_uncertainty
  invariant: "agent_changed_model_setting must be false unless the exact user-requested forensic restoration exception was used."

GPT_authoring_and_review_duty:
  authoring:
    - "Tell the user what model level and reasoning level to select; do not select it in software."
    - "Use exact model names only as recommendations when they are currently visible/known; otherwise use high/balanced/fast labels."
    - "Never place model mutation instructions in an executable task, AGENTS.md, script or automation."
  review:
    - "Reject any agent-authored change to model/runtime settings unless it is an exact, user-requested restoration."
    - "Verify the user was notified and that recommendation metadata did not become runtime authority."
    - "Treat unauthorized model-setting mutation as a governance incident requiring immediate task freeze."

historical_and_active_task_interpretation:
  rule: >-
    All existing requested_model, preferred_model, reasoning_effort, fallback and execution-profile fields are reinterpreted as
    non-binding operator advice. They do not authorize any software/configuration mutation. This v1.1 rule overrides conflicting
    wording in historical task briefs, routes, templates, AGENTS files and reports.
  active_agents_must_not_autocorrect_settings: true

memory_and_persistence:
  user_intent: "PERMANENT_LONG_TERM_OPERATING_RULE"
  applies_to_future_tasks: true
  applies_to_active_tasks: true
  applies_across_agent_and_epoch_changes: true

updated_by: "GPT"
updated_at: "2026-08-02T12:35:00+08:00"
change_reason: "User corrected that model/reasoning choices must be communicated for manual selection, never changed by agents at software level."
