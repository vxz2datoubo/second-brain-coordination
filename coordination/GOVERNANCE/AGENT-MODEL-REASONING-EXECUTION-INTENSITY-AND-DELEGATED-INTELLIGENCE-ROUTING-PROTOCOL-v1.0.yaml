schema_version: "1.0"
protocol_id: "AGENT-MODEL-REASONING-EXECUTION-INTENSITY-AND-DELEGATED-INTELLIGENCE-ROUTING-0001"
short_name: "MREI-DIR"
chinese_name: "模型级别、推理强度、推进强度与委托智能调度协议"
status: "ACTIVE_ENTERPRISE_STANDARD"
authority_scope: "all_non_trivial_task_authoring_execution_and_second_pass_review"
applies_to_task_authors: [GPT, FUTURE_ORCHESTRATOR]
applies_to_executors: [CODEX, QCLAW, WORKBUDDY, FUTURE_AGENT]
mandatory_overlay_over:
  - "coordination/GOVERNANCE/PROACTIVE-MISSION-AUTHORING-AND-BOUNDED-INITIATIVE-GRANT-PROTOCOL-v1.0.yaml"
  - "coordination/GOVERNANCE/BOUNDED-AUTONOMOUS-REMEDIATION-AND-MICRO-BLOCKER-RESOLUTION-PROTOCOL-v1.0.yaml"
  - "coordination/GOVERNANCE/AGENT-WORK-PROCESS-DIFFICULTY-DISCOVERY-AND-COORDINATION-REPORTING-PROTOCOL-v1.0.yaml"
profile_template: "coordination/TEMPLATES/MODEL-REASONING-EXECUTION-PROFILE-TEMPLATE-v1.0.yaml"
boundary: "PUBLIC_SAFE / authority_bounded / research_only / NO_TRADE unless separately authorized"

purpose: >-
  Make every non-trivial task explicitly state the recommended model tier, reasoning effort, execution intensity, delegated authority,
  fallback policy and reporting obligations. Use stronger models and deeper reasoning where uncertainty, architecture, local exploration,
  long-horizon execution or independent adversarial review justify them, while avoiding waste on deterministic repetitive work.

verified_model_snapshot:
  observed_at: "2026-07-31"
  source_class: "OFFICIAL_OPENAI_DOCUMENTATION"
  availability_note: >-
    GPT-5.6 Sol, Terra and Luna are official models available through supported Codex/API experiences for eligible access. Availability
    is account- and rollout-dependent and must be checked at task claim; no task may assume access without a preflight result.
  tiers:
    SOL:
      model_id: "gpt-5.6-sol"
      role: "FLAGSHIP_FRONTIER"
      intended_use: ["frontier reasoning", "long-horizon agentic work", "complex software engineering", "architecture", "scientific or adversarial analysis"]
    TERRA:
      model_id: "gpt-5.6-terra"
      role: "BALANCED_INTELLIGENCE_COST"
      intended_use: ["standard implementation", "bounded research", "moderate debugging", "integration", "routine review"]
    LUNA:
      model_id: "gpt-5.6-luna"
      role: "FAST_EFFICIENT_HIGH_VOLUME"
      intended_use: ["deterministic scans", "repetitive transformations", "simple validation", "formatting", "high-volume low-ambiguity work"]
  reasoning_effort_values: [none, low, medium, high, xhigh, max]

core_principles:
  - "Choose the least expensive model/effort that can reliably satisfy the quality gate, then escalate when evidence or uncertainty justifies it."
  - "Model strength, reasoning effort, execution intensity and authority are separate controls; one does not silently imply the others."
  - "A stronger model grants more cognitive budget, not canonical authority, production authority, privacy access or permission to weaken evidence."
  - "No silent model downgrade, adjacent-model substitution or reasoning-effort reduction when the task declares an exact minimum."
  - "Actual model, effort and execution profile are reportable evidence, not hidden implementation detail."

model_selection_matrix:
  D0_D1_LOW_AMBIGUITY:
    preferred: "gpt-5.6-luna"
    reasoning: [low, medium]
    examples: ["format conversion", "known-path validator execution", "deterministic file inventory", "repetitive receipt reconciliation"]
  D1_D2_STANDARD_ENGINEERING:
    preferred: "gpt-5.6-terra"
    reasoning: [medium, high]
    examples: ["bounded implementation", "CI repair", "ordinary refactor", "targeted research", "standard second-pass review"]
  D2_D3_COMPLEX_OR_AMBIGUOUS:
    preferred: "gpt-5.6-sol"
    reasoning: [high, xhigh]
    examples: ["cross-module invariants", "architecture boundary", "difficult debugging", "local exploratory engineering", "multi-hypothesis root cause"]
  D3_D4_FRONTIER_OR_FINAL_ARBITER:
    preferred: "gpt-5.6-sol"
    reasoning: [xhigh, max]
    examples: ["no reliable known path", "major system design", "conflicting evidence", "highest-stakes final adversarial review", "GPT uncertainty requiring delegated investigation"]

reasoning_effort_policy:
  none_low:
    use_when: "The path is deterministic, low-risk and tool execution dominates reasoning."
  medium:
    use_when: "Balanced default for ordinary bounded work."
  high:
    use_when: "Multiple dependencies, nontrivial validation or design tradeoffs exist."
  xhigh:
    use_when: "Complex architecture, long-horizon coding, subtle evidence truth or difficult local exploration exists."
  max:
    use_when: >-
      D3/D4 difficulty, unresolved conflicting hypotheses, system-wide design, final independent arbiter work or a task explicitly
      delegated because GPT cannot confidently resolve it from remote evidence alone.
  max_not_default: true
  escalation_rule: "Escalate one level when the current effort exhausts its task-published hypothesis/attempt budget without reliable closure."

execution_intensity_levels:
  X0_RECONNAISSANCE:
    meaning: "Inspect, reproduce and map the problem; minimal change authority."
    persistence: "One bounded pass plus evidence."
  X1_STANDARD:
    meaning: "Normal implementation and validation to the next checkpoint or completion."
    persistence: "Use normal R0/R1 remediation budget."
  X2_SUSTAINED:
    meaning: "Continue through ordinary blockers, test multiple approaches and complete broader regression evidence."
    persistence: "Do not stop for solvable R0/R1 issues; checkpoint on material method change."
  X3_DEEP:
    meaning: "Long-horizon multi-hypothesis exploration, implementation, independent validation and self-critique."
    persistence: "Use enhanced compute/attempt budget and preserve failed hypotheses."
  X4_MAXIMUM:
    meaning: "Highest authorized sustained attack on a D3/D4 or strategic problem with Sol xhigh/max and explicit resource ceiling."
    persistence: "Continue until success, exact budget exhaustion or an R3 boundary; never convert persistence into unbounded work."

permission_profiles:
  P0_STANDARD_BOUNDED:
    authority: "Current task paths and normal R0 remediation only."
  P1_ENHANCED_BOUNDED:
    authority: >-
      Current task paths plus R0/R1 autonomous remediation, bounded local exploration, helper/test/workflow improvements and method
      selection inside the published budget. This is the default Codex profile for STANDARD engineering tasks.
  P2_STRATEGIC_BOUNDED:
    authority: >-
      Explicitly named R2 changes, broader exploration and higher compute budget inside one owned workstream. Requires task-specific
      paths, budgets, checkpoints and rollback; it still cannot change canonical authority, owner, Gate, privacy, external spend,
      production or trading boundaries.
  P3_USER_OR_GOVERNANCE_GATE:
    authority: "No autonomous execution; exact decision or permission required."

codex_specific_policy:
  default_permission_profile: "P1_ENHANCED_BOUNDED"
  default_for_standard_code_task:
    preferred_model: "gpt-5.6-terra"
    reasoning_effort: "high"
    execution_intensity: "X2_SUSTAINED"
  escalate_to_sol_when:
    - "Architecture or interface boundaries are ambiguous."
    - "The task needs substantial local exploration unavailable to GPT remote review."
    - "Cross-module invariants, concurrency, determinism or evidence truth are subtle."
    - "Two plausible approaches remain after one bounded investigation pass."
    - "GPT explicitly delegates an uncertain design, root-cause or independent review question."
  use_sol_xhigh_or_max_when:
    - "D3/D4 or strategic difficulty is declared."
    - "A final adversarial review could prevent a costly architecture or evidence mistake."
    - "The task requires long-horizon implementation with repeated tool use and self-correction."
  delegated_intelligence_role: >-
    Codex may be used as a high-capability local investigator, architect, implementer or adversarial reviewer when its repository and
    environment access or stronger long-horizon coding/reasoning capability is useful. Its result is evidence and a recommendation;
    GPT/user governance remains the canonical acceptance authority.
  no_blanket_superiority_claim: >-
    Sol is the flagship model and may be more capable for long-horizon software engineering and agentic reasoning, but no protocol may
    claim universal superiority across every task or use model size as a substitute for evidence.

mandatory_task_profile:
  required_before_READY: true
  required_fields:
    - preferred_model_tier
    - preferred_model_id
    - minimum_acceptable_model
    - reasoning_effort
    - execution_intensity
    - permission_profile
    - selection_rationale
    - availability_preflight
    - fallback_policy
    - escalation_triggers
    - resource_budget
    - actual_profile_reporting
  visible_placement: "Near the task mode/reason, not buried only in an appendix."
  invalid_when_missing: "TASK_MODEL_REASONING_EXECUTION_PROFILE_MISSING"

availability_and_fallback:
  preflight_required: true
  preflight_checks: ["model visible/selectable", "reasoning effort supported", "usage/credit window sufficient", "required tools/environment available"]
  silent_downgrade_forbidden: true
  fallback_modes:
    REQUIRED_EXACT:
      behavior: "Stop and report exact unavailable model/effort, checks, unaffected work and activation condition."
    EXPLICIT_ALLOWED_FALLBACK:
      behavior: "Use only the named fallback model/effort if acceptance criteria remain unchanged and record the substitution before substantive execution."
    DECOMPOSE_AND_ROUTE:
      behavior: "Use Luna/Terra for deterministic subwork and reserve Sol for critical architecture, synthesis or final review."
  fallback_may_not:
    - "Weaken tests, runtime matrix, evidence, completion signal or safety controls."
    - "Use an adjacent model/version not named by the task."
    - "Hide the actual model or effort."

resource_and_efficiency_policy:
  model_size_is_not_execution_intensity: true
  recommended_pattern:
    - "Use Luna for repetitive deterministic substeps."
    - "Use Terra for standard implementation and ordinary review."
    - "Use Sol for ambiguity, architecture, local exploration, root-cause synthesis and final adversarial review."
  maximum_profile_requires:
    - "Explicit value/risk rationale."
    - "Attempt or compute ceiling."
    - "Checkpoint and stop conditions."
    - "Evidence that lower profile is insufficient or the expected error cost justifies maximum effort."
  external_cost_default: 0

reporting_contract:
  mandatory_WPDCR_section: "MODEL_REASONING_AND_EXECUTION_PROFILE"
  required_fields:
    - requested_model
    - actual_model
    - requested_reasoning_effort
    - actual_reasoning_effort
    - requested_execution_intensity
    - actual_execution_intensity
    - permission_profile_used
    - availability_preflight_result
    - fallback_or_escalation_events
    - why_the_profile_was_sufficient_or_insufficient
    - compute_or_attempt_budget_used
    - material_quality_effect
    - residual_uncertainty
  no_hidden_change_rule: "Any model, effort, intensity or permission-profile change must be recorded."

GPT_authoring_and_review_duty:
  authoring:
    - "Every Codex task must prominently name recommended model, reasoning effort and execution intensity."
    - "Choose Sol xhigh/max for genuinely difficult or uncertain work, not as decorative overprovisioning."
    - "Use Codex as a delegated local intelligence source when GPT lacks local evidence or confidence."
    - "Give Codex P1 enhanced bounded authority by default for standard engineering; P2 only with explicit scope and budgets."
  review:
    - "Check whether the assigned model/effort matched actual difficulty."
    - "Penalize silent downgrade, unnecessary maximum usage, underpowered execution and unauthorized escalation."
    - "Compare quality and cost effects so future routing improves."

active_task_inheritance: >-
  Existing READY Codex tasks inherit the requirement to report actual model, reasoning effort and execution intensity. A current task
  receives a concrete profile through its active route/task brief without changing task ID, epoch, branch, Gate or completion signal.
  Other active agents inherit reporting only until their next route explicitly publishes a profile.

memory_and_persistence:
  user_intent: "PERMANENT_LONG_TERM_OPERATING_RULE"
  applies_to_future_tasks: true
  applies_to_active_codex_tasks: true
  applies_across_agent_and_epoch_changes: true

updated_by: "GPT"
