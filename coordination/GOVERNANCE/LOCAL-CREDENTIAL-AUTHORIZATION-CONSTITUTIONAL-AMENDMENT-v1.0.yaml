schema_version: "1.0"
amendment_id: "LOCAL-CREDENTIAL-AUTHORIZATION-CONSTITUTIONAL-AMENDMENT-0001"
status: "ACTIVE_BINDING_AMENDMENT"
amends: "coordination/GOVERNANCE/DUAL-LAYER-INITIATIVE-AND-GPT-ORCHESTRATION-CONSTITUTION-v1.0.yaml"
authority: "USER_EXPLICIT_AUTHORIZATION"

reason: >-
  The constitution contains older generic wording such as credentials_denied and credential-related escalation language.
  The user has now explicitly authorized direct credential reading and use by local Codex for authorized local MCP and adapter work.
  This amendment removes ambiguity without permitting secret export, privilege expansion, account trading or unrelated access.

precedence_rule: >-
  For local credential discovery, reading, process injection, authentication and connectivity testing on the user's own machine,
  this amendment together with LOCAL-CREDENTIAL-DIRECT-USE-AND-NON-EXPORT-PROTOCOL-v1.0.yaml takes precedence over older generic
  credential-denial wording. For credential export, repository publication, rotation, deletion, privilege expansion, broker access,
  order routing and trading, the stricter existing prohibitions remain in force.

constitutional_interpretation:
  P3_AUTONOMY_IS_NOT_AUTHORITY_PROMOTION:
    preserved: true
    clarification: >-
      Local secret use for an already authorized service is execution of existing user authority, not promotion of authority.
      It does not grant new provider permissions, new accounts, new data admission or trading rights.
  adjacent_work_value_test_credentials_clause:
    old_default: "propose_or_escalate when credentials are required"
    amended_rule: >-
      Do not escalate merely because an existing local credential is required. Resolve and use it directly when the task and
      service are authorized under the local credential protocol. Escalate only for missing credentials after exhaustive local
      discovery, new paid access, new privilege, rotation/deletion, external disclosure or a separately gated capability.
  security_credentials_denied:
    old_generic_value: true
    amended_meaning: "EXTERNAL_EXPORT_AND_UNAUTHORIZED_USE_DENIED; AUTHORIZED_LOCAL_READ_AND_USE_ALLOWED"

local_codex_rights:
  - "Read WorkBuddy MCP local configuration and credential references for authorized interoperability."
  - "Read TongDaXin/TDX, TQ and other user-owned local adapter credentials required by an active task."
  - "Reuse authenticated sessions and inject credentials into local process memory without repeated confirmation."
  - "Perform secret-redacted authentication, health and capability checks."

unchanged_prohibitions:
  - "No secret value in Git, GitHub, logs, receipts, test fixtures, datasets, model context or chat."
  - "No credential rotation, deletion, overwrite or privilege expansion without separate authorization."
  - "No real-data admission, replay, backtest, fitting, performance claim, broker account, order or trade merely because authentication succeeded."
  - "No transfer of WorkBuddy branch, task or canonical ownership."

binding_files:
  - "coordination/AUTHORIZATION/CREDENTIAL-SECRETS-LOCAL-ONLY-v1.0.yaml"
  - "coordination/GOVERNANCE/LOCAL-CREDENTIAL-DIRECT-USE-AND-NON-EXPORT-PROTOCOL-v1.0.yaml"
  - "coordination/CODEX-TASK-ROUTER.md"

updated_by: "GPT"
updated_at: "2026-07-27"
