schema_version: "1.0"
protocol_id: "WPDCR-AUTONOMY-AND-MODEL-PROFILE-MANDATORY-OVERLAY-0001"
status: "ACTIVE_ENTERPRISE_STANDARD"
parent_protocol: "coordination/GOVERNANCE/AGENT-WORK-PROCESS-DIFFICULTY-DISCOVERY-AND-COORDINATION-REPORTING-PROTOCOL-v1.0.yaml"
overlays:
  - "coordination/GOVERNANCE/BOUNDED-AUTONOMOUS-REMEDIATION-AND-MICRO-BLOCKER-RESOLUTION-PROTOCOL-v1.0.yaml"
  - "coordination/GOVERNANCE/AGENT-MODEL-REASONING-EXECUTION-INTENSITY-AND-DELEGATED-INTELLIGENCE-ROUTING-PROTOCOL-v1.0.yaml"

purpose: >-
  Close the machine-enforcement gap created when autonomous-remediation and model-routing duties were added after the base WPDCR
  protocol. Every STANDARD or STRATEGIC completion report and every validator that claims WPDCR conformance must enforce the union
  of the base WPDCR sections and the two sections below.

additional_mandatory_sections:
  AUTONOMOUS_REMEDIATION_LEDGER:
    required: true
    no_action_value: "NONE_USED_WITH_CHECKS"
    required_fields_when_used: [remediation_id, trigger_problem, class, boundary_tests, action, commands_and_exits, changed_surface, cost, validation, rollback, outcome, residual_risk, no_prior_coordination_reason]
  MODEL_REASONING_AND_EXECUTION_PROFILE:
    required: true
    required_fields: [requested_model, actual_model, requested_reasoning_effort, actual_reasoning_effort, requested_execution_intensity, actual_execution_intensity, permission_profile_used, availability_preflight_result, fallback_or_escalation_events, compute_or_attempt_budget_used, material_quality_effect, residual_uncertainty]
    unknown_rule: "If the executor environment does not expose actual model/effort metadata, report ACCESS_NOT_EXPOSED with checks; never guess."

validator_contract:
  effective_required_sections: "BASE_WPDCR_REQUIRED_SECTIONS UNION additional_mandatory_sections"
  renamed_alias_not_accepted: true
  blank_mapping_not_accepted: true
  custom_flat_summary_not_accepted: true
  completion_without_union: "INVALID_WPDCR_COMPLETION"

active_task_inheritance: >-
  Current READY, IN_PROGRESS or BLOCKED tasks inherit these reporting and validator duties without changing task ID, epoch, scope,
  branch, Gate or completion signal. The executor must report a split-phase profile when the model-routing requirement arrived after
  work began.

