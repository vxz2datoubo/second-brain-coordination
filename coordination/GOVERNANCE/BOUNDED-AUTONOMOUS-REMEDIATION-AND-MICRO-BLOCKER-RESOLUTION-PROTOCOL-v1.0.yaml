schema_version: "1.1"
protocol_id: "BOUNDED-AUTONOMOUS-REMEDIATION-AND-MICRO-BLOCKER-RESOLUTION-0001"
short_name: "BAR-MBR"
chinese_name: "有界自主补障与微阻塞消解协议"
status: "ACTIVE_ENTERPRISE_STANDARD"
authority_scope: "all_non_trivial_task_authoring_execution_and_reporting"
applies_to: [GPT, CODEX, QCLAW, WORKBUDDY, FUTURE_AGENT]
mandatory_overlay_over:
  - "coordination/GOVERNANCE/PROACTIVE-MISSION-AUTHORING-AND-BOUNDED-INITIATIVE-GRANT-PROTOCOL-v1.0.yaml"
  - "coordination/GOVERNANCE/AGENT-WORK-PROCESS-DIFFICULTY-DISCOVERY-AND-COORDINATION-REPORTING-PROTOCOL-v1.0.yaml"
task_section_template: "coordination/TEMPLATES/AUTONOMOUS-REMEDIATION-ENVELOPE-TEMPLATE-v1.0.yaml"
boundary: "PUBLIC_SAFE / authority_bounded / research_only / NO_TRADE unless separately authorized"

purpose: >-
  Let executors resolve ordinary in-task blockers without repeated stop-report-read loops while preventing repairs from changing
  acceptance criteria, architecture, ownership, canonical authority, security, privacy, licensing, external cost, production or
  trading boundaries. Every autonomous action remains testable, reversible and cumulatively reportable.

core_rule: >-
  When a problem stays inside the current fundamental goal, authorized paths and ownership, preserves or strengthens every exact
  requirement, is reversible and testable, adds no forbidden authority or external cost, and remains inside the published budget,
  the executor SHALL solve it and aggregate the evidence at the next checkpoint or completion. It SHALL NOT stop merely for
  micro-approval.

six_boundary_tests:
  T1_SAME_GOAL: "Directly restores or improves the current task; no adjacent feature or later Gate."
  T2_SAME_AUTHORITY_AND_OWNERSHIP: "Same branch, PR, owner, paths and system of record."
  T3_NO_STANDARD_WEAKENING: "No runtime, model, test, signal, evidence or safety substitution."
  T4_REVERSIBLE_AND_TESTABLE: "Bounded rollback and explicit validation exist."
  T5_NO_NEW_EXTERNAL_AUTHORITY_OR_RISK: "No new credential, private data, paid service, ambiguous license, production side effect or unrestricted egress."
  T6_INSIDE_REMEDIATION_BUDGET: "Attempts, files, dependencies, workflow changes, compute and cost remain within the task envelope."

remediation_classes:
  R0_ROUTINE_LOCAL_REPAIR:
    action: "SOLVE_NOW_AND_AGGREGATE_REPORT"
    examples: ["path/quoting/encoding/environment correction", "bounded transient retry", "approved tool used correctly"]
  R1_BOUNDED_TOOL_RUNTIME_TEST_OR_PORTABILITY_REPAIR:
    action: "SOLVE_NOW_VALIDATE_AND_AGGREGATE_REPORT"
    examples:
      - "Install an exact required runtime in an official task-local or ephemeral environment."
      - "Add an exact runtime matrix entry without adjacent-version substitution."
      - "Add a small helper, validator, test fixture, compatibility shim or cross-platform path normalization."
    conditions: ["official or approved source", "exact requirement preserved", "tests and rollback recorded"]
  R2_MATERIAL_BUT_REVERSIBLE_REPAIR:
    action: "ONLY_IF_EXPLICITLY_PREAUTHORIZED_THEN_CHECKPOINT"
    examples: ["one execution-topology workflow change", "one reviewed dependency", "small same-owner internal interface change"]
  R3_STOP_AND_COORDINATE:
    action: "STOP_PRESERVE_AND_REQUEST_EXACT_DECISION"
    triggers:
      - "Any boundary test fails."
      - "A standard, runtime, model minimum, signal, evidence contract or safety boundary would change."
      - "New credentials, private data, paid cost, ambiguous license, persistent system installation or external service is required."
      - "Canonical schema/API/system-of-record, owner, branch, PR, Gate, production or trading scope would change."
      - "Another agent surface, destructive/history-rewriting action, merge or release is affected."
      - "Budget is exhausted or difficulty/discovery reaches D3/D4 or S3/S4."

commit_topology_and_route_bridge:
  principle: >-
    Planned substantive commit counts describe the expected implementation shape, but SHALL NOT turn a later test-discovered R0/R1
    defect into an avoidable governance deadlock. A bounded remediation commit may be added without amending or rewriting history
    when all six tests pass.
  default_standard_allowance:
    max_additional_R0_R1_corrective_commits: 2
    each_commit_must_be: "narrow, independently reviewable, inside allowed paths, and linked to one recorded remediation item"
  hard_cap_rule: >-
    A task may prohibit all additional corrective commits only when it explicitly labels the commit count as a safety-critical hard
    cap and explains why. Merely saying exactly one substantive commit is not enough to disable BAR-MBR.
  route_bridge_without_new_epoch:
    allowed_when:
      - "Task, fundamental goal, owner, PR, branch, Gate, completion signal and safety boundary remain unchanged."
      - "The repair is R0/R1 and the current route merely omitted or contradicted the remediation allowance."
    required_fields: [current_tested_head, discovered_defect, exact_allowed_surface, max_additional_commits, required_revalidation, receipt_condition]
    behavior: "GPT may amend the active route in place; no empty new epoch or second task is required."
  evidence_reset_rule: >-
    After any corrective source commit, all acceptance evidence binds to the new final tested head. Earlier green CI remains diagnostic
    only. The receipt-only commit is forbidden until every required platform, archive, test and validator is green on that final head.
  prohibitions: [amend, reset, rebase, force_push, hidden_squash, receipt_mislabeling]

runtime_and_tool_rules:
  exact_requirement_must_be_preserved: true
  adjacent_version_substitution_forbidden: true
  preferred_order: ["existing approved capability", "official task-local/ephemeral setup", "pinned official CI action", "small owned compatibility shim", "R3 coordination"]
  persistent_system_install_default: "PROHIBITED_UNLESS_EXPLICIT"
  external_cost_default: 0
  evidence_required: ["identity/version/source/license", "installation scope", "commands/exits", "changed surface", "validation", "rollback"]

recommended_default_budgets:
  LIGHT: {allowed_classes: [R0_ROUTINE_LOCAL_REPAIR], max_attempt_cycles: 2, max_unplanned_files: 1, max_dependencies: 0, max_workflows: 0, max_compute: "1.10x", max_external_cost: 0}
  STANDARD: {allowed_classes: [R0_ROUTINE_LOCAL_REPAIR, R1_BOUNDED_TOOL_RUNTIME_TEST_OR_PORTABILITY_REPAIR], max_attempt_cycles: 3, max_unplanned_files: 5, max_dependencies: 1, max_workflows: 1, max_compute: "1.25x", max_external_cost: 0}
  STRATEGIC: {allowed_classes: [R0_ROUTINE_LOCAL_REPAIR, R1_BOUNDED_TOOL_RUNTIME_TEST_OR_PORTABILITY_REPAIR, R2_MATERIAL_BUT_REVERSIBLE_REPAIR], max_attempt_cycles: 5, max_external_cost: 0}

reporting_and_visibility:
  mandatory_WPDCR_section: "AUTONOMOUS_REMEDIATION_LEDGER"
  required_fields: [remediation_id, trigger_problem, class, boundary_tests, action, commands_and_exits, changed_surface, cost, validation, rollback, outcome, residual_risk, no_prior_coordination_reason]
  aggregation_rule: "R0/R1 aggregate until an existing checkpoint or completion; R2 checkpoints after first tested result; R3 reports immediately."
  no_silent_action_rule: "Autonomy removes prior approval, not retrospective accountability. Missing ledger entries invalidate completion."

anti_patterns:
  - MICRO_BLOCKER_ESCALATED_WITHOUT_AUTHORIZED_ATTEMPT
  - REPEATED_STOP_REPORT_READ_LOOP_FOR_R0_R1
  - SILENT_REMEDIATION_WITHOUT_LEDGER
  - REQUIREMENT_SUBSTITUTION_DISGUISED_AS_REPAIR
  - COMMIT_COUNT_DEADLOCK_FOR_TEST_DISCOVERED_R0_R1
  - EARLIER_CI_REUSED_AFTER_CORRECTIVE_SOURCE_COMMIT
  - EMPTY_OR_EXECUTABLE_RECEIPT_MISLABELING
  - UNBOUNDED_RETRY_COMPUTE_OR_ENVIRONMENT_DRIFT

GPT_task_authoring_duty:
  - "Publish a concrete remediation envelope and numeric budget."
  - "Grant R0/R1 by default for STANDARD tasks."
  - "Separate planned commit shape from corrective-remediation allowance."
  - "Do not require micro-approval for actions already inside the envelope."
  - "Audit both unauthorized overreach and unnecessary underuse of authority."

active_task_inheritance: >-
  Existing READY or truthfully BLOCKED tasks inherit R0/R1 and the route-bridge rule where all six tests pass, allowed paths and hard
  boundaries remain unchanged, and external cost is zero. This does not change task ID, epoch, PR, branch, Gate or completion signal.

memory_and_persistence:
  user_intent: "PERMANENT_LONG_TERM_OPERATING_RULE"
  applies_to_future_tasks: true
  applies_to_active_tasks: true
  applies_across_agent_and_epoch_changes: true

