schema_version: "1.4.0"
protocol_id: "AGENT-TASK-LEASE-AND-COMPLETION-FRESHNESS"
status: "ACTIVE"
owner: "GPT"
applies_to: [CODEX, WORKBUDDY, QCLAW, FUTURE_AGENTS]
in_progress_visibility_protocol: "coordination/GOVERNANCE/AGENT-IN-PROGRESS-REMOTE-VISIBILITY-AND-ROUTE-BRIDGE-PROTOCOL-v1.0.yaml"
read_claim_execute_protocol: "coordination/GOVERNANCE/AGENT-READ-TASK-CLAIM-AND-EXECUTE-COMMAND-SEMANTICS-v1.0.yaml"
archive_runtime_evidence_template: "coordination/TEMPLATES/EXACT-COMMIT-ARCHIVE-AND-RUNTIME-EVIDENCE-TEMPLATE-v1.0.yaml"
purpose: >-
  Prevent stale routes, superseded completions, invisible local progress, invalid tested-head claims, unauthorized files,
  incomplete evidence, runtime-version substitution, empty receipt commits, label-only archive claims and read-only task
  acknowledgements from overriding the current control plane.

lease_claim_required: true
lease_claim_fields:
  - repository
  - remote_main_head_at_claim
  - task_id
  - route_epoch
  - active_issue
  - pull_request
  - branch
  - status
  - execution_allowed
  - reviewed_or_base_head
  - completion_signal
  - dependencies
  - mode
  - task_brief
  - task_impact_forecast
  - authorized_paths
  - hard_boundaries
  - read_claim_execute_protocol

claim_validation:
  latest_remote_main_required: true
  exact_route_field_match_required: true
  status_must_be_READY: true
  execution_allowed_must_be_true: true
  dependencies_must_be_satisfied: true
  historical_or_superseded_route_not_executable: true
  other_agent_route_not_executable: true

valid_claim_execution_rule:
  action: "START_SUBSTANTIVE_EXECUTION_IMMEDIATELY"
  second_user_start_command_required: false
  lease_claim_or_task_summary_is_not_progress: true
  first_meaningful_authorized_action_before_return: true
  prohibited:
    - "Only restate or summarize the task"
    - "Only produce a plan"
    - "Wait for execute/continue/start"
    - "Ask what to do when route and Issue are self-contained"

first_substantive_action_receipt:
  required: true
  fields:
    - trigger_phrase
    - lease_claim_order_or_timestamp
    - first_authorized_action
    - exact_command_file_or_test
    - observed_result
    - evidence_reference
    - checkpoint_or_stop_reason
  invalid:
    - READ_ONLY_ACKNOWLEDGEMENT_WITHOUT_EXECUTION
    - PLAN_ONLY_RESPONSE_WHEN_READY
    - SECOND_START_COMMAND_REQUESTED

in_progress_visibility:
  remote_head_unchanged_does_not_prove_no_local_progress: true
  local_report_not_final_acceptance: true
  checkpoint_required_for_material_local_work: true
  stale_route_packet_required_on_epoch_change: true
  no_reset_delete_force_push_or_silent_abandonment: true

completion_freshness:
  before_completion_signal:
    - "Re-read latest canonical remote main and active route."
    - "Compare task_id, route_epoch, Issue, PR, branch, status, execution_allowed, exact completion signal and base."
    - "Verify tested and receipt full SHAs are remote-resolvable."
    - "Verify commit topology and changed-file claims against remote Git."
    - "Verify the required runtime matrix exactly matches the route; adjacent versions are not substitutes."
    - "Verify exact-commit archive roots were extracted and commands actually executed inside every root."
    - "Verify required AMED, WPDCR, tests, UNKNOWN and handoff artifacts are complete and cumulative."
  stale_route_action:
    - "Do not publish old completion signal."
    - "Preserve work through StaleRoutePacket and visibility packet."
    - "Request exact route-bridge disposition."
  mandatory_fields:
    - remote_main_head_at_claim
    - remote_main_head_before_completion
    - task_id
    - route_epoch
    - issue
    - pr
    - branch
    - completion_signal
    - delivered_head
    - tested_head
    - tested_parent
    - tested_tree
    - receipt_head
    - exact_changed_files
    - exact_commands
    - exit_codes
    - counts
    - normalized_stdout_sha256
    - normalized_stderr_sha256
    - failures
    - skipped
    - unknowns
    - required_runtime_matrix
    - observed_runtime_matrix
    - exact_commit_archive_evidence
    - WPDCR_report
    - external_PR_anchor
    - external_issue_anchor

exact_completion_signal_rules:
  route_signal_is_literal_contract: true
  exact_string_match_required: true
  aliases_synonyms_or_reworded_signals_forbidden: true
  signal_may_not_be_generated_by_runner_from_a_different_task_name: true
  mismatch_disposition: "NO_COMPLETION_CREDIT"

runtime_matrix_rules:
  exact_route_versions_required: true
  adjacent_minor_or_patch_substitution_forbidden: true
  local_interpreter_runs_do_not_replace_required_remote_CI: true
  every_required_version_must_record: [workflow_run_id, job_id, checkout_sha, event, command_set, exit_codes, stdout_sha256, stderr_sha256]
  checkout_sha_must_equal_tested_head: true
  PR_merge_SHA_is_not_tested_branch_SHA_unless_route_explicitly_authorizes_it: true
  preferred_exact_branch_methods: [workflow_dispatch_exact_ref, explicit_checkout_ref_and_sha, governed_branch_push_run]

archive_evidence_rules:
  exact_full_40_hex_tested_commit_required: true
  archive_creation_alone_is_not_execution_proof: true
  seed_labels_alone_do_not_prove_independent_roots: true
  distinct_extracted_root_identities_required: true
  each_root_must_record:
    - root_id
    - root_path_or_redacted_path_hash
    - exact_commit
    - archive_sha256
    - archive_size_bytes
    - extracted_file_count
    - full_commands_executed_inside_root
    - exit_codes
    - stdout_sha256
    - stderr_sha256
    - per_artifact_sha256_and_size
  required_cross_root_checks:
    - exact_commit_equality
    - distinct_root_identity
    - command_path_contained_in_root
    - required_command_set_equality
    - exit_zero_for_required_positive_commands
    - expected_nonzero_for_declared_negative_commands
    - per_artifact_hash_and_size_equality
    - deterministic_output_claims_match_observed_stream_hashes
  wrong_ancestor_or_short_SHA_fails_closed: true
  external_workspace_path_fails_closed: true

receipt_rules:
  tested_commit_may_not_self_reference_future_receipt: true
  receipt_file_may_use_declared_external_post_push_anchor: true
  placeholder_must_be_replaced_or_explicitly_externally_bound: true
  full_40_hex_SHA_required: true
  cumulative_negative_evidence_required: true
  receipt_only_commit_may_not_change_executable_code: true
  receipt_only_commit_must_be_non_empty_when_route_requires_one: true
  receipt_only_commit_must_contain_only_receipt_governance_or_evidence_files: true
  cumulative_evidence_may_not_be_hidden_in_the_tested_commit_to_manufacture_an_empty_receipt_commit: true
  empty_commit_disposition: "INVALID_RECEIPT_TOPOLOGY"

WPDCR_completion_rules:
  exact_enterprise_section_contract_required_for_standard_and_strategic_tasks: true
  custom_flat_summary_is_not_a_substitute: true
  missing_mandatory_section_fails_closed: true
  NONE_REQUIRED_or_NONE_OBSERVED_requires_checks_performed: true
  cumulative_carry_forward_required: true

invalid_completion_patterns:
  - COMPLETION_SIGNAL_ON_STALE_ROUTE
  - COMPLETION_SIGNAL_LITERAL_MISMATCH
  - WRONG_OR_TRUNCATED_TESTED_OR_RECEIPT_SHA
  - REQUIRED_RUNTIME_VERSION_SUBSTITUTED
  - CI_CHECKOUT_SHA_DIFFERS_FROM_TESTED_HEAD
  - PR_MERGE_SHA_MISREPRESENTED_AS_BRANCH_TESTED_SHA
  - ARCHIVE_CREATED_BUT_NOT_EXECUTED
  - ARCHIVE_ROOT_IDENTITY_NOT_PROVEN
  - ARCHIVE_PER_ARTIFACT_EQUALITY_NOT_PROVEN
  - SEED_LABELS_MISREPRESENTED_AS_INDEPENDENT_ROOTS
  - EMPTY_RECEIPT_ONLY_COMMIT
  - CUMULATIVE_EVIDENCE_PLACED_IN_TESTED_COMMIT_WITH_EMPTY_RECEIPT
  - UNBOUND_THIS_COMMIT_AFTER_PUSH
  - MISSING_REMOTE_MAIN_HEADS
  - MISSING_COMMAND_EXIT_OR_HASH
  - FAILURES_SKIP_UNKNOWN_OMITTED
  - WPDCR_MISSING_OR_INCOMPLETE
  - CUMULATIVE_EVIDENCE_COMPRESSED_OR_OVERWRITTEN
  - READ_ONLY_ACKNOWLEDGEMENT_REPORTED_AS_PROGRESS

non_executable_route_report:
  required_fields:
    - exact_failed_field_or_dependency
    - checks_and_attempts_performed
    - minimum_missing_information_capability_or_decision
    - affected_scope
    - unaffected_work
    - requested_owner
    - exact_requested_action
    - reactivation_or_closure_condition
  only_BLOCKED_is_invalid: true
  no_fallback_to_old_or_other_agent_task: true

security:
  direct_main_write_by_executors: false
  auto_merge: false
  force_push: false
  history_rewrite: false
  implicit_real_data_replay_backtest_account_order_trade_release: false

updated_by: "GPT"
updated_at: "2026-07-31T15:58:00+08:00"