schema_version: "1.1"
schema_family: "UNIFIED-EXECUTION-INTERFACES-v1"
status: "CANDIDATE_REMEDIATED_PENDING_INDEPENDENT_REVIEW"
source_issue: 596

common_identity:
  composition_rule: "EVERY_AUTHORITY_BEARING_MACHINE_OBJECT_MUST_EXPLICITLY_INCLUDE_ALL_COMMON_IDENTITY_FIELDS"
  required:
    - control_plane_repository
    - execution_repository
    - project_id
    - task_id
    - route_epoch
    - exact_base_sha
    - implementation_branch
    - collision_domain
  rule: "IDENTITY_MISMATCH_FAILS_CLOSED"

CANONICAL_EXECUTION_AUTHORITY_CHAIN_v1:
  purpose: >-
    Fresh bridge-built readback of the canonical execution-authority documents. This object
    is evidence derived from canonical main; caller-supplied dispatch fields cannot mint it.
  required:
    - canonical_main_sha
    - fresh_readback
    - route_status
    - execution_allowed
    - lease_released
    - lease_replaced
    - authority_replaced
    - authority_chain_receipt_digest
    - authority_refs
    - authority_digests
    - authorized_paths
    - authority_grants
    - authority_denials
  authority_refs_required:
    - active_task_index_ref
    - canonical_route_ref
    - work_claim_ref
    - task_lease_ref
    - executor_reservation_ref
    - prewrite_snapshot_ref
    - executable_batch_ref
  authority_digests_required:
    - active_task_index_ref
    - canonical_route_ref
    - work_claim_ref
    - task_lease_ref
    - executor_reservation_ref
    - prewrite_snapshot_ref
    - executable_batch_ref
  derivation:
    source: "FRESH_CANONICAL_MAIN_READBACK_ONLY"
    digest_rule: "DIGEST_EACH_APPLICABLE_DOCUMENT_AND_BIND_ONE_RECEIPT_TO_COMMON_IDENTITY_AND_CANONICAL_MAIN"
    caller_assertion_is_authority: false
  fail_closed_when:
    - "route_status_not_READY"
    - "execution_allowed_not_true"
    - "fresh_readback_missing_or_false"
    - "lease_released"
    - "lease_replaced"
    - "authority_replaced"
    - "required_authority_ref_or_digest_missing"
    - "canonical_main_moved_since_receipt"
    - "any_authority_document_digest_moved_or_replaced"

GPT_TO_EXECUTOR_DISPATCH_v1:
  purpose: "exact-bound handoff from GPT architecture/control plane to an authorized executor"
  common_identity_required: true
  required:
    - schema_version
    - control_plane_repository
    - execution_repository
    - project_id
    - project_adapter
    - task_id
    - route_epoch
    - source_issue
    - canonical_main_sha
    - exact_base_sha
    - implementation_branch
    - executor
    - carrier
    - model_profile
    - resolved_model_display_name
    - model_resolution_status
    - authority_chain_receipt_digest
    - authority_refs
    - authority_digests
    - authorized_paths
    - forbidden_paths
    - collision_domain
    - architecture_decisions
    - acceptance_stories
    - required_tests
    - authority_grants
    - authority_denials
    - stop_escalation_conditions
    - completion_signal
    - return_package_target
  optional:
    - resolved_cli_model_id
    - observed_credit_multiplier
    - observed_promotion_state
    - model_fallback
    - local_resource_class
    - exclusive_tool_locks
    - cross_project_dependencies
    - codex_escalation_reason
  invariants:
    - "dispatch_identity_exactly_matches_fresh_canonical_authority_receipt"
    - "authority_refs_and_digests_exactly_match_fresh_canonical_authority_receipt"
    - "authorized_paths_must_be_subset_of_canonical_authorized_paths"
    - "authority_grants_must_be_subset_of_canonical_authority_grants"
    - "canonical_authority_denials_must_be_preserved_or_strengthened"
    - "project_adapter_must_exist_in_project_registry"
    - "carrier_must_be_allowed_by_project_adapter"
    - "model_profile_must_be_allowed_by_project_adapter"
    - "no_authority_is_inferred_from_model_or_carrier"
    - "ordinary_private_memory_publication_is_allowed_when_owner_authorized"
    - "authentication_secret_values_are_never_payload_content"

WORKBUDDY_RETURN_PACKAGE_v1:
  purpose: "reproducible execution return from CLI/WebUI/Desktop WorkBuddy carrier"
  common_identity_required: true
  required:
    - schema_version
    - control_plane_repository
    - execution_repository
    - project_id
    - task_id
    - route_epoch
    - exact_base_sha
    - exact_head_sha
    - implementation_branch
    - collision_domain
    - carrier
    - model_profile
    - resolved_model_display_name
    - changed_files
    - diff_scope_summary
    - commands_and_tests
    - failures_and_repairs
    - discoveries
    - unknowns
    - collision_scope_proof
    - credential_secret_scan_result
    - architecture_drift_check
    - next_gate
  telemetry_optional:
    - resolved_cli_model_id
    - observed_credit_multiplier
    - local_execution_cycles
    - model_switches
    - push_count
    - ci_cycles
    - elapsed_wall_time_seconds
    - product_credit_or_api_cost
    - session_id
  invariants:
    - "return_package_never_self_asserts_ACCEPT"
    - "head_sha_is_immutable_review_identity_once_submitted"
    - "secret_values_are_redacted_not_hashed_for_public_persistence"
    - "changed_files_must_fit_authorized_paths_or_return_BLOCKED_SCOPE_DRIFT"

EXECUTION_CARRIER_HANDOFF_v1:
  purpose: "safe transfer between CLI Headless, CLI WebUI, Desktop or another governed executor"
  common_identity_required: true
  required:
    - control_plane_repository
    - execution_repository
    - project_id
    - task_id
    - route_epoch
    - exact_base_sha
    - implementation_branch
    - collision_domain
    - from_carrier
    - to_carrier
    - checkpoint_head_sha
    - git_status
    - current_session_state
    - old_writer_lease_id
    - old_writer_lease_generation
    - old_writer_release_receipt_digest
    - release_readback_canonical_main_sha
    - new_writer_admission_required
    - reason
  release_witness_required:
    - control_plane_repository
    - execution_repository
    - project_id
    - task_id
    - route_epoch
    - exact_base_sha
    - implementation_branch
    - collision_domain
    - writer_lease_id
    - writer_lease_generation
    - release_status
    - release_receipt_digest
    - canonical_readback_verified
    - canonical_main_sha
  invariants:
    - "release_witness_must_match_complete_common_identity"
    - "old_writer_release_must_be_fresh_canonical_readback"
    - "old_writer_lease_id_and_generation_must_match_release_witness"
    - "new_writer_admission_must_match_same_common_identity"
    - "old_writer_lease_cannot_be_replayed_as_new_writer_lease"
    - "same_task_simultaneous_writers_forbidden"
    - "carrier_switch_does_not_change_architecture_or_authority"

GPT_INDEPENDENT_REVIEW_REQUEST_v1:
  purpose: "exact-head request to a GPT reviewer that did not author/execute the candidate"
  required:
    - control_plane_repository
    - execution_repository
    - source_issue
    - pull_request
    - exact_base_sha
    - exact_head_sha
    - changed_file_scope
    - exact_head_ci
    - effective_spec_snapshot
    - review_focus
    - forbidden_reuse_of_older_verdicts
  result_semantics: "reuse existing REVIEW_RESULT/v1 exact-head discipline"
  invariants:
    - "any_head_movement_requires_new_review_request"
    - "ACCEPT_is_not_canonical"

ENGINEERING_PRODUCTIVITY_RECEIPT_v1:
  purpose: "calibrate future executor/model/carrier routing from our own comparable task evidence"
  required:
    - project_id
    - task_class
    - executor
    - carrier
    - model_profile
    - resolved_model_display_name
    - final_verdict
  optional:
    - observed_credit_multiplier
    - local_execution_cycles
    - push_count
    - ci_cycles
    - reviewer_blocker_count
    - changed_files_count
    - additions
    - deletions
    - elapsed_wall_time_seconds
    - product_credit_or_api_cost
  update_rule: "MULTIPLE_COMPARABLE_TASKS_REQUIRED_BEFORE_GLOBAL_ROUTING_DEFAULT_CHANGE"

LOCAL_BRIDGE_ADMISSION_v1:
  purpose: >-
    Final process-start gate. The bridge must build the canonical authority receipt from
    fresh control-plane main and validate this object against both that receipt and dispatch.
  common_identity_required: true
  required:
    - control_plane_repository
    - execution_repository
    - canonical_main_sha
    - dispatch_digest_or_identity
    - task_id
    - route_epoch
    - project_id
    - project_adapter
    - exact_base_sha
    - implementation_branch
    - collision_domain
    - route_status
    - execution_allowed
    - authority_chain_receipt_digest
    - authority_refs
    - authority_digests
    - authorized_paths
    - authority_grants
    - authority_denials
    - carrier
    - model_profile
    - resolved_model_display_name
    - writer_lease_id
    - writer_lease_generation
    - admitted
  admit_only_when:
    - "fresh_canonical_authority_receipt_validates"
    - "route_status_READY"
    - "execution_allowed_true"
    - "all_common_identity_fields_match_dispatch_and_canonical_receipt"
    - "canonical_main_and_authority_digests_match_fresh_readback"
    - "authorized_paths_and_grants_are_canonical_subsets"
    - "canonical_denials_are_preserved"
    - "lease_not_released_replaced_or_replayed"
    - "collision_domain_available"
    - "credential_secret_policy_loaded"
    - "local_runtime_requirements_satisfied"
  otherwise: "FAIL_CLOSED_NO_PROCESS_START"

executable_validation:
  module: "coordination/GOVERNANCE/unified_execution_validation.py"
  required_functions:
    - validate_canonical_authority
    - validate_dispatch
    - validate_local_admission
    - validate_carrier_handoff
    - validate_project_adapter
  rule: "BRIDGE_IMPLEMENTATION_MUST_USE_EQUIVALENT_OR_STRONGER_VALIDATION_BEFORE_PROCESS_START"
