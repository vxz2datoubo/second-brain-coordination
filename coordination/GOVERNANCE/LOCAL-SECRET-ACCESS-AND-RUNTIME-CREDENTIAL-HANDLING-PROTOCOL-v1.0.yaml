schema_version: "1.0"
protocol_id: "LOCAL-SECRET-ACCESS-AND-RUNTIME-CREDENTIAL-HANDLING-0001"
short_name: "LSARH"
status: "ACTIVE_ENTERPRISE_STANDARD"
authority_scope: "local_execution_credentials_for_authorized_tasks"
applies_to: [CODEX, WORKBUDDY, GPT]
parent_program: 31
standing_user_authorization: true
user_authorization_recorded_at: "2026-07-27T08:55:00+08:00"

purpose: >-
  Permit local Codex to directly discover, read and use task-required credentials and connection configuration for
  WorkBuddy-managed MCP services, TongdaXin/TDX, TQ, WeStock and other explicitly authorized local integrations without
  stopping for repeated credential approval, while preventing secret disclosure, repository contamination, license bypass,
  unauthorized data admission or trading authority expansion.

fundamental_rule: >-
  Local secret access is allowed for execution efficiency. Secret disclosure, persistence outside approved local stores,
  remote publication and authority expansion remain prohibited.

allowed_local_secret_classes:
  - "MCP server tokens, API keys and connection strings required by an active authorized task"
  - "TongdaXin/TDX local client or MCP authentication material"
  - "TQ local/API credentials and local connection configuration"
  - "WeStock local/API credentials and local connection configuration"
  - "WorkBuddy-maintained local MCP configuration required to connect Codex to an authorized service"
  - "Environment variables, .env files, local configuration files and OS credential-store entries scoped to the active task"
  - "Locally installed licensed-software session material when use is permitted by the user's license"

standing_permissions_for_local_codex:
  - "Read task-required secrets from known local configuration locations without requesting per-secret confirmation."
  - "Inspect WorkBuddy local MCP configuration read-only to discover endpoints, credential references and startup parameters."
  - "Load secrets into process memory or environment for the duration of an authorized command."
  - "Use OS credential stores, environment variables and protected local files as credential sources."
  - "Test connectivity and authentication against the explicitly authorized local service."
  - "Retry authentication using alternate authorized local credential sources when the first source is stale."
  - "Report only whether a credential source was FOUND, USED, REJECTED, EXPIRED or NOT_AVAILABLE."

no_repeat_prompt_rule:
  enabled: true
  rule: >-
    When the current task explicitly requires a listed MCP/local integration and the secret is already present on the user's
    machine, Codex should read and use it directly. Missing permission is not a blocker under this protocol.
  ask_user_only_when:
    - "No task-relevant credential can be found locally."
    - "The service requires a new purchase, new account, CAPTCHA, MFA or user interaction that cannot be completed locally."
    - "The requested operation would activate real data, production, account, order or trading authority not released by the active route."
    - "The credential appears unrelated to the active task or belongs to a different user/organization."

preferred_secret_source_order:
  - "OS credential store or keychain"
  - "Process/user environment variables"
  - "MCP client configuration with secret references"
  - "Protected local .env or configuration file"
  - "WorkBuddy local configuration read-only"
  - "Other task-specific local secret file explicitly referenced by configuration"

runtime_handling_requirements:
  - "Use secrets in memory or environment rather than command-line arguments whenever possible."
  - "Never include raw secrets in shell history, process titles, command transcripts or test snapshots."
  - "Do not print, echo, cat, serialize or return raw secret values to the user, GPT, GitHub or another agent."
  - "Redact authorization headers, cookies, query tokens, passwords, private keys and connection-string secret fields."
  - "If a temporary secret file is technically unavoidable, create it outside the repository with owner-only permissions, use it for the shortest possible time and delete it in a finally/cleanup path."
  - "Do not copy secrets from WorkBuddy configuration into Codex repository files or permanent Codex configuration."
  - "Do not persist decrypted secrets in caches, fixtures, notebooks, crash dumps or artifact bundles."
  - "Run a secret-pattern scan before commit and before posting logs or receipts."

reporting_contract:
  permitted_fields:
    - "credential_source_class"
    - "credential_alias_or_variable_name"
    - "service_name"
    - "access_result"
    - "authentication_result"
    - "expiry_or_staleness_status_when_available"
    - "redaction_applied"
  forbidden_fields:
    - "raw_secret"
    - "partial_secret"
    - "secret_hash_or_fingerprint_derived_from_the_secret"
    - "authorization_header"
    - "session_cookie"
    - "private_key_material"
    - "full_connection_string_with_credentials"
  example_safe_receipt:
    service: "TDX_MCP"
    credential_source_class: "LOCAL_ENVIRONMENT"
    credential_alias_or_variable_name: "TDX_MCP_TOKEN"
    access_result: "USED"
    authentication_result: "SUCCESS"
    redaction_applied: true

workbuddy_interoperability:
  codex_may_read_workbuddy_local_config: true
  access_mode: "READ_ONLY_FOR_CONNECTION_BOOTSTRAP"
  codex_may_edit_workbuddy_files: false
  codex_may_copy_workbuddy_secrets_to_repo: false
  codex_may_take_over_workbuddy_runtime: false
  allowed_use: >-
    Discover and use endpoints, local service startup details and credential references needed to connect an authorized Codex task.

security_boundaries:
  repository_secret_write: false
  github_secret_publication: false
  issue_pr_comment_secret_publication: false
  chat_secret_disclosure: false
  cross_task_secret_harvesting: false
  unrelated_secret_access: false
  credential_export_to_remote_agent: false
  license_bypass: false
  captcha_bypass: false
  mfa_bypass: false
  broker_account_secret_access: false
  order_routing_secret_access: false
  real_trade_secret_access: false

non_authorizations:
  - "Reading a credential does not approve a SourceManifest or admit a real data source."
  - "Reading a credential does not release Issue #92."
  - "Reading a credential does not authorize historical replay, backtest, performance claims, account access, order routing or trading."
  - "Reading a credential does not authorize bypassing software licenses, paywalls, CAPTCHA, MFA or provider restrictions."
  - "Reading WorkBuddy configuration does not grant ownership of WorkBuddy branches, files or runtime services."

failure_behavior:
  - "If a secret is missing, report the missing alias/source class without exposing nearby configuration values."
  - "If authentication fails, preserve only sanitized error codes and messages."
  - "If a command unexpectedly prints a secret, stop publication, redact the output, rotate the exposed secret when feasible and submit an S4 credential-exposure report."
  - "If repository contamination is detected, do not push; remove the secret from the working tree and history before any remote publication."

binding_updates_required:
  - "coordination/GOVERNANCE/AMED-ENTERPRISE-POLICY-v1.0.yaml"
  - "coordination/GOVERNANCE/AGENT-PROACTIVE-DISCOVERY-AND-REALTIME-ESCALATION-PROTOCOL-v1.0.yaml"
  - "coordination/GOVERNANCE/DUAL-LAYER-INITIATIVE-AND-GPT-ORCHESTRATION-CONSTITUTION-v1.0.yaml"
  - "coordination/CODEX-TASK-ROUTER.md"
  - "coordination/ACTIVE-THREE-AGENT-COORDINATION.yaml"

boundary: "LOCAL_SECRET_USE_ALLOWED / REMOTE_SECRET_DISCLOSURE_DENIED / LICENSE_RESPECTED / NO_TRADE"
updated_by: "GPT"
updated_at: "2026-07-27T08:55:00+08:00"
