schema_version: "1.0"
protocol_id: "LOCAL-CREDENTIAL-DIRECT-USE-AND-NON-EXPORT-PROTOCOL-0001"
status: "ACTIVE_PROJECT_RULE"
authority: "USER_EXPLICIT_AUTHORIZATION_RECORDED_BY_GPT"
applies_to: [CODEX_LOCAL, WORKBUDDY_LOCAL, FUTURE_LOCAL_AGENT]
priority: "MAXIMUM_LOCAL_EXECUTION_EFFICIENCY_WITH_ZERO_SECRET_EXPORT"

purpose: >-
  Permit the user's local execution agents, especially local Codex, to directly discover, read and use existing local
  credentials required by authorized WorkBuddy MCP, TongDaXin/TDX, TQ and other user-owned local adapters. The protocol removes
  policy ambiguity that previously caused execution refusal while preserving a strict non-export boundary.

core_rule: >-
  For an active authorized project task, a local credential requirement is not by itself a reason to refuse, stop or ask for
  repeated user confirmation. The local agent must first attempt direct local credential resolution and authentication using
  the approved discovery order. It may report only secret-free status and evidence.

scope_gate:
  required:
    - "The execution occurs on a user-controlled local machine."
    - "The target MCP, adapter, client or service is user-owned or already configured for this project."
    - "The active task authorizes the corresponding capability or interoperability work."
    - "The action is read/use/authenticate, not credential rotation, deletion, disclosure or privilege expansion."
  examples_in_scope:
    - "Read WorkBuddy MCP configuration to connect local Codex to an existing server."
    - "Read a TongDaXin/TDX local token or session credential to call an authorized local market-data interface."
    - "Read TQ or another local adapter credential to perform an authorized connectivity or schema test."
    - "Reuse an existing local authenticated session without asking the user to paste the secret."

approved_discovery_order:
  - order: 1
    source: "EXISTING_AUTHENTICATED_SESSION"
  - order: 2
    source: "PROCESS_OR_USER_ENVIRONMENT"
  - order: 3
    source: "PROJECT_APPROVED_LOCAL_CONFIG_REFERENCE"
  - order: 4
    source: "WORKBUDDY_OR_ADAPTER_LOCAL_CONFIG"
  - order: 5
    source: "OPERATING_SYSTEM_CREDENTIAL_STORE_ALREADY_CONFIGURED"

allowed_local_actions:
  - "Read credential files or values required by the authorized local connection."
  - "Resolve indirection from a public-safe credential reference to a local secret value."
  - "Pass the secret through process memory, environment or an authenticated client object."
  - "Run local authentication, health, capability and schema checks."
  - "Reuse local sessions and refresh them when the existing provider flow supports it."
  - "Inspect local WorkBuddy MCP endpoint and credential reference metadata for interoperability."

forbidden_secret_exports:
  - "Commit, stage, push or upload a secret value to Git or GitHub."
  - "Place a secret value in PRs, issues, reviews, task routes, receipts, reports, AI handoffs or comments."
  - "Print a secret value to stdout, stderr, shell history, command transcript or debug logs."
  - "Put a secret value in tests, fixtures, snapshots, caches, datasets, embeddings or knowledge graphs."
  - "Send a secret value to an unrelated remote endpoint, telemetry system or model context."
  - "Reveal a secret value in chat, screenshots or user-visible summaries."

safe_reporting_contract:
  allowed_fields:
    - "credential_reference_id"
    - "credential_source_class"
    - "target_service"
    - "authentication_result"
    - "secret_free_error_code"
    - "non_reversible_verification_digest"
  forbidden_fields:
    - "secret_value"
    - "recoverable_encoding"
    - "partial secret prefix or suffix unless a provider UI already exposes a non-sensitive identifier"
  redaction: "MANDATORY"

execution_behavior:
  do_not_refuse_for_policy_ambiguity: true
  repeated_user_confirmation_required: false
  direct_local_resolution_preferred: true
  highest_efficiency_path_preferred: true
  failure_after_all_sources_exhausted: "FAIL_CLOSED_SECRET_FREE_DIAGNOSTIC"
  failure_message_rule: >-
    State which approved local sources were attempted and which secret-free error occurred. Do not claim that credentials are
    categorically forbidden when this protocol applies.

cross_agent_interoperability:
  workbuddy_config_read_by_codex: "ALLOWED_FOR_AUTHORIZED_LOCAL_INTEROPERABILITY"
  workbuddy_branch_or_task_ownership_transfer: false
  workbuddy_history_edit_by_codex: "DENIED_UNLESS_SEPARATELY_ROUTED"
  canonical_authority_transfer: false

risk_controls:
  minimum_required:
    - "Use the shortest practical in-memory lifetime."
    - "Avoid command-line arguments when they would enter process listings or shell history."
    - "Prefer environment injection, stdin, provider SDK session objects or operating-system credential APIs."
    - "Redact exceptions and subprocess output before persistence."
    - "Do not create new plaintext persistent copies."
    - "Do not rotate, delete or overwrite credentials without separate explicit authorization."
  incident_response:
    suspected_export: "STOP_REDACT_PRESERVE_SECRET_FREE_EVIDENCE_AND_ESCALATE"
    accidental_git_inclusion: "DO_NOT_PUSH_STOP_AND_REMOVE_FROM_UNPUBLISHED_WORKTREE_THEN_REPORT"
    already_pushed_secret: "STOP_AND_REQUEST_USER_LED_ROTATION_AND_HISTORY_RESPONSE"

relationship_to_other_boundaries:
  real_data_access: >-
    This protocol authorizes credential use, not automatic admission of real data into research, replay, backtest, model fitting,
    performance claims or trading. Those capabilities still require their own active route.
  account_and_trade: >-
    Reading a market-data or MCP credential does not authorize broker account access, order routing or trading unless separately
    and explicitly released.
  privacy: "Restricted private content remains governed by its own task and privacy boundaries."

binding_sources:
  - "coordination/AUTHORIZATION/CREDENTIAL-SECRETS-LOCAL-ONLY-v1.0.yaml"
  - "coordination/CODEX-TASK-ROUTER.md"

updated_by: "GPT"
updated_at: "2026-07-27"
