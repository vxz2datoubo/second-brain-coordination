  - "message or turn structural identifiers"
  - "role"
  - "stable ordering evidence"
  - "record counts"
  - "hashes of canonicalized structural evidence"
  - "virtualization, mounted-set, reload and scroll evidence"
  - "synthetic or deliberately non-sensitive marker evidence"

privacy_and_durability:
  raw_private_message_durable_persistence: false
  raw_private_html_dump: false
  private_message_screenshot_or_trace_persistence: false
  private_message_console_log_persistence: false
  private_message_text_may_be_read_ephemerally_only_when_required_to_identify_trigger_semantics: true
