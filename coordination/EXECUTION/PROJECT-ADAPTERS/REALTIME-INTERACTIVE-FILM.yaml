schema_version: "1.3"
adapter_schema: "PROJECT-EXECUTION-ADAPTER-v1"
project_id: "REALTIME_INTERACTIVE_FILM_GAME"
display_name: "实时互动电影游戏"
status: "CANDIDATE_REMEDIATION_PENDING_INDEPENDENT_REVIEW"
global_protocol_id: "UNIFIED-AGENT-EXECUTION-FABRIC-v1"
inherits_global_invariants: true
control_plane_repository: "vxz2datoubo/second-brain-coordination"
execution_repository: "vxz2datoubo/second-brain-coordination"
authority_project_aliases:
  - "REALTIME_INTERACTIVE_FILM_GAME"
  - "CREATIVE-INTERACTIVE-FILM-SECOND-BRAIN-0001"

repositories:
  - repo: "vxz2datoubo/second-brain-coordination"
    role: "PROGRAM_COORDINATION_AND_SHARED_ENGINEERING"

canonical_entrypoints:
  - "coordination/PROGRAMS/CREATIVE-INTERACTIVE-FILM-SECOND-BRAIN-0001/PROJECT-BATON.yaml"
  - "coordination/PROGRAMS/CREATIVE-INTERACTIVE-FILM-SECOND-BRAIN-0001/CONTINUE-HERE.md"
  - "coordination/SKILLS/CREATIVE-INTERACTIVE-FILM-MULTI-AGENT-RELAY-SKILL-v1.0.yaml"
  - "current issue/PR/exact-head/route evidence"

authority:
  project_baton_is_navigation_not_execution_authority: true
  global_factory_rule: "INHERIT_UNIFIED_FABRIC_DO_NOT_REDEFINE"
  ai_director_calls_require_explicit_adapter: true

allowed_execution_carriers:
  - "GPT_DIRECT"
  - "WORKBUDDY_CLI_HEADLESS"
  - "WORKBUDDY_CLI_WEBUI"
  - "WORKBUDDY_DESKTOP_INTERACTIVE"
  - "CODEX_STANDARD_ESCALATION"
  - "CODEX_FRONTIER_ESCALATION"

default_model_profiles:
  routine_engineering: "FAST_LOW_COST"
  complex_runtime_engineering: "DEEP_ENGINEERING"
  codex_standard: "CODEX_STANDARD_ENGINEERING"
  visual_or_media_validation: "MULTIMODAL_VISUAL"
  architecture_ambiguous: "FRONTIER_ARCHITECTURE"

collision_domains:
  - "INTERACTIVE_FILM_PROGRAM_ROUTE"
  - "CREATIVE_RUNTIME"
  - "SHOT_AND_DIRECTOR_PLAN_INTERFACES"
  - "PROJECT_BATON"
  - "AI_DIRECTOR_CROSS_REPO_CONTRACT"

tool_interfaces:
  - id: "AI_DIRECTOR_ADAPTER"
    target_project: "AI_DIRECTOR"
    rule: "EXPLICIT_CROSS_PROJECT_HANDOFF"
  - id: "VIDEO_GENERATION_BROWSER"
    authority: "SEPARATE_GENERATION_CARRIER"
    generic_engineering_route_does_not_grant_generation: true

hard_boundaries:
  - "NO_SECOND_GLOBAL_GPT_WORKBUDDY_FACTORY"
  - "NO_SILENT_AI_DIRECTOR_AUTHORITY_IMPORT"
  - "NO_ACCEPTANCE_ORACLE_DRIFT"
  - "NO_SELF_REVIEW"
  - "NO_SELF_MERGE"

acceptance:
  required:
    - "project relay skill invariants"
    - "project-specific runtime tests"
    - "exact-head CI"
    - "independent review"

handoff:
  to_ai_director: "use AI_DIRECTOR adapter and preserve source/return provenance"