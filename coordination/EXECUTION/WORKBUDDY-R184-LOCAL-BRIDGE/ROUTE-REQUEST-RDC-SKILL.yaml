    OWNER AUTHORIZATION — RDC skill publication route

    I authorize a new route to be published that carries the RDC execution-carrier
    and cross-agent scheduling skill into the repository.

    Authorized write surface for that route:
      - coordination/SKILLS/RDC-EXECUTION-CARRIER-AND-CROSS-AGENT-SCHEDULING-SKILL-v1.0.yaml

    Constraint: the skill remains a CANDIDATE. Publishing it is not acceptance.
    Independent review is still required before it is treated as canonical.
    Real process activation remains FORBIDDEN until independent review and
    canonicalization complete.

    Signed: Owner (vxz2datoubo)

