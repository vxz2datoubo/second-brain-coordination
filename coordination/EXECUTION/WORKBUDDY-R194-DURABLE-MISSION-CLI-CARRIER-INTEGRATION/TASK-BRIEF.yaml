mission_intent:
  fundamental_goal: >-
    Turn the existing Durable Mission Kernel into a truthful bounded real WorkBuddy CLI episode carrier that can survive
    maxTurns, client/RDC wait timeout, worker restart and stalled-but-alive processes without losing mission continuity
    or starting duplicate writers.
  user_capability_outcome: >-
    Establish the carrier reliability needed for a later governed 2-4h and then 6-8h unattended overnight mission,
    while this task itself remains synthetic/disposable and grants no production or trading authority.
  current_state_to_change: >-
    The kernel is synthetic-only and real CodeBuddy background/session evidence can diverge from process/heartbeat labels;
    one episode termination or caller timeout can therefore be mistaken for mission termination without an authenticated adapter.
  causal_mechanism:
    - "Bind each episode to governed task/mission/episode/attempt identity plus CodeBuddy job/session generation and process-start evidence."
    - "Treat maxTurns and client timeout as bounded episode conditions, reconcile durable JobStore/checkpoint state, then resume or roll over without duplicate effects."
    - "Separate process-alive/heartbeat evidence from meaningful tool/file/git/test/checkpoint progress and fail closed on ambiguity."
  observable_success:
    - "A clean authenticated V4.1 Flash synthetic episode can resume the same governed session from a new process without relying on tool/file memory; conversational session state is allowed only when bound to the authenticated session identity."
    - "A deliberately stalled-but-alive carrier is detected by the watchdog."
    - "Supervisor timeout and crash-after-commit do not duplicate the committed episode."
    - "Only a structured terminal episode result can advance mission state; outer process exit 0 alone cannot."
  failure_conditions:
    - "Duplicate episode or writer can be launched after timeout/retry."
    - "Heartbeat/busy alone is accepted as meaningful progress."
    - "Ambiguous JobStore/session/process state is promoted to PASS/COMPLETE."
    - "Implementation requires a second scheduler/broker/ledger or production activation."
  stop_conditions:
    - "Canonical authority chain becomes stale or conflicting."
    - "Required work leaves the authorized write surface."
    - "Secrets, real capture, W3 production, trading/account/order/funds or production service activation are required."
    - "Two bounded attempts leave the same root-cause ambiguity unresolved; return exact evidence to GPT Architecture Owner."

primary_delivery_and_non_negotiables:
