    - "Authenticated real WorkBuddy CLI episode adapter under the existing Durable Mission Kernel."
    - "Meaningful-progress watchdog with RUNNING/STALLED/OUTCOME_UNKNOWN distinctions."
    - "Checkpoint/reconcile/resume/respawn/rollover behavior for maxTurns, caller timeout and crash-after-commit."
    - "Deterministic tests plus one live synthetic V4.1 Flash canary and durable evidence receipts."
  frozen_constraints:
    - "Reuse existing CodeBuddy JobStore/background broker/respawn mechanisms and the canonical Host Execution Broker; do not build another broker or scheduler."
    - "Synthetic/disposable only; no production background-service activation."
    - "One mechanical verification per verification layer."
  required_commit_or_artifact_shape:
    - "One bounded implementation branch under the published authority; exact-head freeze before review."
    - "Task-local execution/test/discovery/unknown/handoff receipts under authorized evidence paths."
  evidence_gates:
