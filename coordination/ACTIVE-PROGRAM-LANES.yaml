    Explicit durable signals are admitted to the existing Signal Tower ledger/projection path. Signal is not automatically a task.
  mandatory_before_formal_task_release:
    - "GLOBAL_SHALLOW: scan current Signal Tower/open-signal metadata plus active tasks, lanes, claims, PRs and authority state"
    - "DELTA: identify material changes since the last valid reconciliation/watermark"
    - "TARGETED_DEEP: deeply read only signals/dependencies/conflicts/evidence materially relevant to the proposed task"
    - "CONDITIONAL_RESEARCH: perform external/current research only when the task requires it"
    - "RELEASE_DECISION: merge, parallelize, serialize, defer, block or release the task with explicit rationale"
  full_body_scan_every_time: false
  daemon_or_scheduler_required_for_normal_mode: false
  background_runtime_role: "OPTIONAL_FUTURE_ENHANCEMENT_FOR_TIME_CONDITION_EVENT_DRIVEN_AUTOMATION_ONLY"
  no_signal_equals_task_rule: true
  task_release_without_fresh_preflight: "FORBIDDEN"

