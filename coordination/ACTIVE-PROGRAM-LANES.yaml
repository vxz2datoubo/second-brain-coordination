authority_role: >-
  This registry is authoritative only for program-lane identity, mission, desired state,
  cross-lane relationships, overlap declarations and portfolio-level gates. It is not
  the execution authority for any Agent task and may not override a fresher per-agent route.

source_precedence:
  - "USER_CURRENT_EXPLICIT_DIRECTION"
  - "LATEST_PER_AGENT_ACTIVE_ROUTE_ON_REMOTE_MAIN"
  - "PROJECT_OR_PROGRAM_CANONICAL_AUTHORITY"
  - "THIS_PROGRAM_LANE_REGISTRY_FOR_LANE_RELATIONSHIPS_ONLY"
  - "DERIVED_HUMAN_FACING_VIEWS"
  - "HISTORICAL_AGGREGATE_VIEWS"

not_authoritative_for:
  - "Agent task_id / route_epoch / execution_allowed / completion_signal"
  - "W2 market facts or A-share rules"
  - "W3 knowledge, evidence or long-term memory"
  - "W4 strategy experiments"
  - "W5 event evidence"
  - "W7 validation or final risk veto"
  - "W9 outcome calibration"
  - "W10 DecisionEpisode"
  - "W11 capital allocation"
  - "W12 ProbabilityEstimate"
  - "W13 participant-flow evidence"
  - "AI-film plot, assets, maps, continuity or directing authority"

lane_state_machine:
  normal: [PROPOSED, READY, ACTIVE, REVIEW, BLOCKED, PAUSED, DONE]
  terminal: [DONE, CANCELLED]
  alert_flags:
    - STALE_VIEW
    - AUTHORITY_CONFLICT
    - PATH_OVERLAP
    - INTERFACE_OVERLAP
    - DEPENDENCY_BLOCKED
    - WIP_EXCEEDED
    - SAME_AGENT_DOUBLE_BOOKED
    - HEAVY_RESOURCE_COLLISION
    - SEMANTIC_VERSION_SKEW
    - COMMIT_AUTHORITY_STALE

portfolio_capacity_policy:
  program_lanes_may_coexist: 3
  meaning: >-
    Up to three major program lanes may be open concurrently as separate goals, but this
    does not authorize three heavy implementations at once.
  codex_active_execution_routes_max: 1
  qclaw_active_execution_routes_max: 1
  workbuddy_active_execution_routes_max: 1
  local_heavy_stage_concurrency_max: 1
  a_share_business_vertical_slices_max: 1
  same_canonical_object_writers_max: 1
  nested_parallelism: "FORBIDDEN"
  additional_rule: >-
    Prefer orthogonal parallelism only after the relevant Control Tower release gate is satisfied.
    Proposal-only architecture/research does not consume the heavy implementation lease.

current_user_release_policy:
  decision_at: "2026-08-15T17:29:00+08:00"
  decision: "RELEASE_LANE_A_TO_PROPOSAL_ONLY_KEEP_LANE_B_HELD"
  rationale: >-
    Control Tower foundation is ready and merged. The user explicitly started Lane A Harness/Cognitive-OS architecture
    design. Lane A may therefore perform isolated proposal-only architecture work, but no Harness/H1/H2 runtime route is
    authorized. Lane B A-share remediation remains held unless separately started.
  released_proposal_only_lanes:
    - "LANE-A-HARNESS-INTEGRATION"
  held_lanes:
    - "LANE-B-A-SHARE-REMEDIATION"
  release_owner: "GPT_WITH_USER_DIRECTION_PRESERVED"
  no_prompt_needed_for_lane_a_proposal_design: true
  implementation_release_requires:
    - "H0 final compatibility verdict."
    - "A fresh implementation Work Claim for the exact slice."
    - "Fresh O0-O4, same-agent and heavy-resource checks."
    - "Fresh durable authorization witness."
    - "Explicit GPT implementation release."
    - "High-impact user approval when private/production/permission/trading boundaries change."

