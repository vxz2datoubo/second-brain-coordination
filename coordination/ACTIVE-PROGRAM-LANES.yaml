lane_state_machine:
  normal: [PROPOSED, READY, ACTIVE, REVIEW, BLOCKED, PAUSED, DONE]
  terminal: [DONE, CANCELLED]
  alert_flags:
    - STALE_VIEW
    - AUTHORITY_CONFLICT
    - PATH_OVERLAP
    - INTERFACE_OVERLAP
    - DEPENDENCY_BLOCKED
    - WIP_EXCEEDED
    - SAME_AGENT_DOUBLE_BOOKED
    - HEAVY_RESOURCE_COLLISION
    - SEMANTIC_VERSION_SKEW
    - COMMIT_AUTHORITY_STALE
    - LANE_CONTRACT_INVALID
    - CROSS_WINDOW_STATE_DRIFT

portfolio_capacity_policy:
  program_lanes_may_coexist: 3
  meaning: >-
    Up to three major program lanes may be open concurrently as separate goals, but this
    does not authorize three heavy implementations at once.
  codex_active_execution_routes_max: 1
  qclaw_active_execution_routes_max: 1
  workbuddy_active_execution_routes_max: 1
  local_heavy_stage_concurrency_max: 1
  a_share_business_vertical_slices_max: 1
  same_canonical_object_writers_max: 1
  nested_parallelism: "FORBIDDEN"
  additional_rule: >-
    Prefer orthogonal parallelism only after the relevant Control Tower release gate is satisfied.
    H1 Lane A is closed and no longer consumes a Codex execution lease. H2 remains separately unauthorized.

