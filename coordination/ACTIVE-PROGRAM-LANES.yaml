reconciliation_rule: >-
  Before any successor cross-program implementation task is published or accepted, fetch current per-agent routes,
  canonical project/program indices and a fresh GlobalReconciliationReceipt, derive observed state, compare desired
  relationships, classify drift/overlap, and fail closed on O4 authority conflict, stale commit/review authorization,
  invalidated reconciliation receipt, SAME_AGENT_DOUBLE_BOOKED or CROSS_WINDOW_STATE_DRIFT.