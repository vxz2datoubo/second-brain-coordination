    overlap_level: "O2_SHARED_RUNTIME_INTERFACES"
    shared_domains: [W7, W8, W9, tool_execution, guardrails, observability]
    rule: "Held until control-tower foundation release; after release, Harness may not become market/probability/risk authority."
  - pair: ["LANE-A-HARNESS-INTEGRATION", "LANE-C-SECOND-BRAIN-GPT-COGNITIVE-CLOSED-LOOP"]
    overlap_level: "O3_HIGH_INTERFACE_OVERLAP"
    shared_domains: [W3, W8, W9, W10, skills, context, session, retrieval, agent_runtime]
    rule: >-
      Lane A remains held. Do not implement Harness integration against unstable P2.2/P2.3 ContextBundle interfaces.
      After release, first freeze the relevant interface or isolate the PoC behind an adapter.
  - pair: ["LANE-B-A-SHARE-REMEDIATION", "LANE-C-SECOND-BRAIN-GPT-COGNITIVE-CLOSED-LOOP"]
    overlap_level: "O2_SHARED_KNOWLEDGE_DECISION_CONTEXT"
    shared_domains: [W3, W9, W10, W12, evidence_retrieval, decision_context]
    rule: "Lane B remains held until control-tower release; later it may consume frozen contracts without creating second authorities."

overlap_levels:
  O0: "No material overlap. Parallel execution normally safe."
  O1: "Read/read overlap only. Safe with freshness checks."
  O2: "Shared interface or downstream consumption. Parallel work allowed if contracts are frozen and no shared write surface exists."
  O3: "Shared mutable interface/path or unstable contract. Sequence, isolate, or acquire explicit lock before implementation."
  O4: "Canonical authority collision or incompatible desired states. Fail closed and require GPT/user architecture decision."

flow_metrics:
  required_when_automation_exists:
    - WIP
    - WorkItemAge
    - BlockedAge
    - Throughput
    - CycleTime
  later_when_history_is_sufficient:
    - ServiceLevelExpectation
  note: "Metrics are observability signals, not automatic proof of value or completion."

reconciliation_rule: >-
  Before any cross-program task is published or accepted, fetch current per-agent routes and relevant canonical
  project/program indices, derive observed state, compare to this registry's desired lane relationships, classify
  drift/overlap, and fail closed on O4 authority conflict or stale commit authorization.
