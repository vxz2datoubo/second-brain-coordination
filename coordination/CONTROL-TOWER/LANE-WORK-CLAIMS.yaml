    Lane A is closed with no active Codex execution lease or current work surface. Lane B remains held proposal-only.
    AI Film remains an external read-only source with zero shared write authority; any successor implementation requires a fresh release.
  implementation_release_is_separate: true
  implementation_release_requires_fresh_claim_rescan: true
  reservation_upgrade_requires_fresh_post_merge_reconciliation: true
