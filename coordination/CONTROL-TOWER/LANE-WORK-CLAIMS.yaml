      closure_issue: 335
      merged_pr: 334
      merge_commit: "823d5b22c7b449626bc03cdf1f574c592e50b9fc"
      completed_route_epoch: 132
      bounded_gaps:
        - "R120-W01-CONTEXT-ONLY-ENDPOINT"
        - "R122-UNKNOWN-BINDING-GAP"
      reopen_rule: "BUG / SECURITY_GAP / CONTRACT_DEFECT / PROVEN_REGRESSION only"
    stop_conditions:
      - "A future implementation requires a new per-agent ACTIVE route and fresh Work Claim."

  - lane_id: "LANE-A-HARNESS-INTEGRATION"
    claim_state: "CLOSED_NO_ACTIVE_IMPLEMENTATION"
    execution_agent: null
    resource_class: "NO_ACTIVE_IMPLEMENTATION"
    route_binding: null
    write_paths: []
    read_paths: []
    interfaces: []
    read_domains: []
    write_domains: []
    authority_claims: []
    closure_receipt:
