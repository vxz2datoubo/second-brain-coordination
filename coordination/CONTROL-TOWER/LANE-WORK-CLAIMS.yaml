  proposal_only_parallelism: >-
    Lane A reserves only the exact future R136 S0E0 surface and is non-executable. Lane B remains held proposal-only.
    AI Film is an external exact-commit read-only source with zero shared write authority. No current Codex execution lease exists.
  implementation_release_is_separate: true
  implementation_release_requires_fresh_claim_rescan: true
  reservation_upgrade_requires_fresh_post_merge_reconciliation: true
  closed_lane_has_no_execution_lease: true
  reserved_lane_has_no_execution_lease: true
  r136_future_stage_separation: >-
    R136 reservation or acceptance never implies AI Film domain write, private/live bridge, Harness/H2/H7, production,
    permission change or trading authorization.
