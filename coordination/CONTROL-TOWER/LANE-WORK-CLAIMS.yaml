  proposal_only_parallelism: >-
    Lane B may continue bounded research/design only inside its isolated proposal root if separately released.
    Lane A S0C is the only active Codex implementation and occupies the exact S0C write surface.
    S0C cannot authorize S0D, H2, H7, private bridge, domain write, production or trading.
  implementation_release_is_separate: true
  implementation_release_requires_fresh_claim_rescan: true
  reservation_upgrade_requires_fresh_post_merge_reconciliation: true
  closed_lane_has_no_execution_lease: true
  h1_h2_separation: "H1 exact-head acceptance and merge never imply H2 Harness runtime authorization."
  s0c_future_stage_separation: "S0C exact-head acceptance never implies S0D/H2/H7/private/production authorization."
