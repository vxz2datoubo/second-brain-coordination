      - "one bounded remediation write surface"
      - "exact interface read/write/frozen state"
      - "authority claims"
      - "resource class"
      - "O0-O4 rescan against current claims"
      - "PIT/T+1/NO_TRADE and domain authority gates"
      - "commit-time route witness"

release_semantics:
  foundation_can_release_windows_to_proposal_only: true
  proposal_only_parallelism: >-
    Lane B may continue bounded research/design only inside its isolated proposal root if separately released.
    Lane A currently has no active implementation claim after H1 closure, so R133 no longer consumes a Codex execution lease.
    This does not authorize H2 or any new implementation by itself.
  implementation_release_is_separate: true
  implementation_release_requires_fresh_claim_rescan: true
  closed_lane_has_no_execution_lease: true
  h1_h2_separation: "H1 exact-head acceptance and merge never imply H2 Harness runtime authorization."
