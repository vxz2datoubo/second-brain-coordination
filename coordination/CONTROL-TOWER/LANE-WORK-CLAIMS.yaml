  route_binding_required_for_executable_implementation: true
  latest_per_agent_active_route_is_execution_truth: true
  closed_lane_releases_all_current_work_surfaces: true
  reserved_implementation_occupies_surface_without_execution: true
  reserved_implementation_requires_non_executable_route: true
  reserved_implementation_requires_global_reconciliation_receipt: true
  reservation_to_active_requires_successor_receipt_and_fresh_control_tower: true
  h1_authorization_does_not_authorize_h2: true
  s0c_authorization_does_not_authorize_s0d_h2_h7: true
  s0d_authorization_does_not_authorize_s0e_h2_h7_domain_write: true
  global_reconciliation_receipt_is_not_execution_authority: true

