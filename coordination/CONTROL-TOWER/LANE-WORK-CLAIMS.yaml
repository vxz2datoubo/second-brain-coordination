    Lane A has no active implementation claim. Lane B remains held proposal-only and Lane C remains closed. Lane B has no
    implementation/runtime write authority and therefore creates no current write/write collision with Lane A.
  implementation_release_is_separate: true
  implementation_release_requires_fresh_claim_rescan: true
  reservation_upgrade_requires_fresh_post_merge_reconciliation: true
  closed_lane_has_no_execution_lease: true
